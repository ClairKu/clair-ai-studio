name = "pain-off-relay"
main = "src/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# 建 KV：wrangler kv namespace create PAIN_OFF —— 把返回的 id 填到下面
[[kv_namespaces]]
binding = "PAIN_OFF"
id = "b93940a89f0f435f97d54d465add09f2"

[vars]
ALLOWED_ORIGINS = "https://clairku.github.io"

# secret 不写在这里，用命令设：
#   wrangler secret put PULSE_PASSCODE   # 公网点更新时要输的口令
#   wrangler secret put AGENT_TOKEN      # 本机 agent 的凭据，随便一串长随机字符串
