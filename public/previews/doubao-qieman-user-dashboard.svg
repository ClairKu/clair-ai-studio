<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">豆包 × 且慢使用后转化看板预览</title>
  <desc id="desc">深色首屏、授权与可使用人数、使用后开户绑卡风测首投和入金规模。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131b"/><stop offset="1" stop-color="#1b1d2b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff3b73"/><stop offset=".55" stop-color="#7157ff"/><stop offset="1" stop-color="#20c7d9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#080910" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <circle cx="1450" cy="50" r="330" fill="#7157ff" opacity=".18"/><circle cx="90" cy="830" r="260" fill="#20c7d9" opacity=".12"/>
  <g font-family="Inter,PingFang SC,sans-serif">
    <rect x="86" y="70" width="56" height="56" rx="18" fill="url(#accent)"/><text x="114" y="105" fill="white" font-size="18" font-weight="900" text-anchor="middle">D×且</text>
    <text x="160" y="93" fill="#fff" font-size="22" font-weight="800">豆包 × 且慢</text><text x="160" y="117" fill="#9ca2b8" font-size="12" letter-spacing="3">POST-USE CONVERSION</text>
    <text x="86" y="202" fill="#84e6ef" font-size="14" font-weight="800" letter-spacing="4">DOUBAO × QIEMAN POST-USE JOURNEY</text>
    <text x="86" y="278" fill="#fff" font-size="66" font-weight="900" letter-spacing="-4">真正要看的，</text><text x="86" y="350" fill="url(#accent)" font-size="66" font-weight="900" letter-spacing="-4">是使用之后有没有转化。</text>
    <text x="90" y="397" fill="#b7bbcb" font-size="18">授权 → 可使用 → 开户 / 绑卡 / 风测 / 首投 / 入金 · 聚合数据</text>
    <g filter="url(#shadow)">
      <g transform="translate(86 455)"><rect width="250" height="150" rx="24" fill="#2a2030" stroke="#70405b"/><text x="24" y="34" fill="#b8bdcc" font-size="15">豆包授权用户</text><text x="24" y="94" fill="#fff" font-size="48" font-weight="900">397</text><text x="24" y="125" fill="#ff85aa" font-size="13">授权真实发生</text></g>
      <g transform="translate(354 455)"><rect width="250" height="150" rx="24" fill="#20222e" stroke="#353846"/><text x="24" y="34" fill="#b8bdcc" font-size="15">使用代理用户</text><text x="24" y="94" fill="#fff" font-size="48" font-weight="900">389</text><text x="24" y="125" fill="#9da3b8" font-size="13">覆盖率 98.0%</text></g>
      <g transform="translate(622 455)"><rect width="250" height="150" rx="24" fill="#20222e" stroke="#353846"/><text x="24" y="34" fill="#b8bdcc" font-size="15">严格后续日入账</text><text x="24" y="94" fill="#fff" font-size="48" font-weight="900">0.83万</text><text x="24" y="125" fill="#9da3b8" font-size="13">6 人 · 同日另计</text></g>
    </g>
    <g transform="translate(930 432)"><rect width="570" height="310" rx="28" fill="#fff"/><text x="30" y="44" fill="#171923" font-size="19" font-weight="800">绑定增长走势</text><g stroke="#ececf2"><line x1="45" x2="535" y1="245" y2="245"/><line x1="45" x2="535" y1="180" y2="180"/><line x1="45" x2="535" y1="115" y2="115"/></g><g fill="#b8b0ff"><rect x="62" y="242" width="26" height="3" rx="2"/><rect x="107" y="197" width="26" height="48" rx="4"/><rect x="152" y="197" width="26" height="48" rx="4"/><rect x="197" y="154" width="26" height="91" rx="4"/><rect x="242" y="156" width="26" height="89" rx="4"/><rect x="287" y="177" width="26" height="68" rx="4"/><rect x="332" y="189" width="26" height="56" rx="4"/><rect x="377" y="141" width="26" height="104" rx="4"/><rect x="422" y="187" width="26" height="58" rx="4"/><rect x="467" y="187" width="26" height="58" rx="4"/><rect x="512" y="212" width="26" height="33" rx="4"/></g><polyline points="75,244 120,231 165,218 210,193 255,168 300,150 345,134 390,106 435,90 480,74 525,65" fill="none" stroke="#171923" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#171923"><circle cx="75" cy="244" r="6"/><circle cx="120" cy="231" r="6"/><circle cx="165" cy="218" r="6"/><circle cx="210" cy="193" r="6"/><circle cx="255" cy="168" r="6"/><circle cx="300" cy="150" r="6"/><circle cx="345" cy="134" r="6"/><circle cx="390" cy="106" r="6"/><circle cx="435" cy="90" r="6"/><circle cx="480" cy="74" r="6"/><circle cx="525" cy="65" r="6"/></g><text x="43" y="282" fill="#8c909e" font-size="12">8.28</text><text x="500" y="282" fill="#8c909e" font-size="12">9.07</text></g>
    <rect x="86" y="660" width="786" height="82" rx="22" fill="#fff" opacity=".96"/><text x="112" y="694" fill="#7157ff" font-size="12" font-weight="800" letter-spacing="2">CORE JUDGEMENT</text><text x="112" y="723" fill="#171923" font-size="19" font-weight="800">使用代理覆盖率 98.0%，但开户、绑卡、风测与首投仍为 0。</text>
    <text x="86" y="824" fill="#858b9f" font-size="13">数据截止 2026-09-07 14:17 · 资产快照 2026-09-04 · 生产数仓只读聚合</text>
  </g>
</svg>
