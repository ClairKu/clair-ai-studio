<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">且慢养老规划统一工具</title>
  <desc id="desc">从目标测算到账户和产品落地的养老计划工具封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b38"/><stop offset="1" stop-color="#0d5b69"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59d8d5"/><stop offset="1" stop-color="#f2c77f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1050" cy="105" r="220" fill="#5ddbd5" opacity=".08"/>
  <circle cx="180" cy="625" r="265" fill="#f2c77f" opacity=".07"/>
  <g transform="translate(75 70)">
    <rect width="176" height="34" rx="17" fill="#d9fffb" opacity=".94"/>
    <text x="88" y="23" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#0c5962">且慢 · 产品规划</text>
    <text y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="64" font-weight="800" fill="#fff">养老规划，不再只是算一遍</text>
    <text y="164" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#cce3ea">统一目标、账户、产品与持续复盘</text>
  </g>
  <g transform="translate(75 286)" filter="url(#shadow)">
    <rect width="1050" height="274" rx="28" fill="#fff" opacity=".97"/>
    <g transform="translate(38 34)">
      <text font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#587085">01 目标</text>
      <text y="38" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="800" fill="#0a2942">想过怎样的退休生活？</text>
      <path d="M0 83 H950" stroke="#e7edf1"/>
      <g transform="translate(0 112)">
        <circle cx="14" cy="14" r="14" fill="#0d6571"/><text x="14" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">1</text>
        <path d="M32 14 H160" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="190" cy="14" r="14" fill="#1d8c92"/><text x="190" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">2</text>
        <path d="M208 14 H336" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="366" cy="14" r="14" fill="#47bcb9"/><text x="366" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">3</text>
        <path d="M384 14 H512" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="542" cy="14" r="14" fill="#e5b968"/><text x="542" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">4</text>
        <path d="M560 14 H688" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="718" cy="14" r="14" fill="#e9a04f"/><text x="718" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">5</text>
        <path d="M736 14 H864" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="894" cy="14" r="14" fill="#dc7d46"/><text x="894" y="20" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">6</text>
        <g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#30485a">
          <text x="14" y="58" text-anchor="middle">目标</text><text x="190" y="58" text-anchor="middle">盘点</text><text x="366" y="58" text-anchor="middle">测算</text><text x="542" y="58" text-anchor="middle">分桶</text><text x="718" y="58" text-anchor="middle">选择</text><text x="894" y="58" text-anchor="middle">复盘</text>
        </g>
      </g>
    </g>
  </g>
  <text x="75" y="625" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#cce3ea">VESTA 规则审计 × 可交互用户原型 × 旧能力整合方案</text>
</svg>
