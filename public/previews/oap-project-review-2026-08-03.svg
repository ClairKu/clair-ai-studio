    <rect width="190" height="120" rx="16" fill="#242147" stroke="#62569a"/>
    <text x="22" y="45" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="30" font-weight="800">90.6%</text>
