<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">个人理财 Agent 候选作品能力测评</title>
  <desc id="desc">总分 45 分，系统搭建能力强，但金融答案、安全、移动端和可复现交付存在生产阻断。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a2238"/><stop offset=".58" stop-color="#3b3158"/><stop offset="1" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb16f"/><stop offset="1" stop-color="#e35f47"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#090c19" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1115" cy="40" r="265" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1115" cy="40" r="185" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
  <text x="70" y="76" fill="#ffbc82" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19" font-weight="700" letter-spacing="3">CANDIDATE WORK SAMPLE · AGENT EVALUATION</text>
  <text x="70" y="154" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="52" font-weight="800">个人理财 Agent</text>
  <text x="70" y="218" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="52" font-weight="800">候选作品能力测评</text>
  <text x="72" y="262" fill="#ded8ea" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22">全场景实测 · 金融事实复核 · 安全审计 · 2026-08-10</text>
  <g transform="translate(70 323)" filter="url(#shadow)">
    <rect width="250" height="186" rx="25" fill="#fff" fill-opacity=".97"/>
    <text x="25" y="66" fill="#2c3150" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="58" font-weight="850">45</text>
    <text x="112" y="66" fill="#7a8193" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700">/ 100</text>
    <text x="25" y="102" fill="#6e7588" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">综合能力得分</text>
    <rect x="25" y="135" width="200" height="13" rx="7" fill="#e7e9ef"/>
    <rect x="25" y="135" width="90" height="13" rx="7" fill="url(#score)"/>
  </g>
  <g transform="translate(342 323)" filter="url(#shadow)">
    <rect width="250" height="186" rx="25" fill="#fff" fill-opacity=".97"/>
    <text x="25" y="61" fill="#c14f38" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="850">10 / 52</text>
    <text x="25" y="100" fill="#6e7588" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">官方 E2E 通过</text>
    <text x="25" y="142" fill="#984431" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700">30 failed · 10 not run</text>
  </g>
  <g transform="translate(614 323)" filter="url(#shadow)">
    <rect width="250" height="186" rx="25" fill="#fff" fill-opacity=".97"/>
    <text x="25" y="61" fill="#c14f38" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="850">P0 × 3</text>
    <text x="25" y="100" fill="#6e7588" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">上线阻断</text>
    <text x="25" y="141" fill="#984431" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700">数据语义 · 安全 · 移动端</text>
  </g>
  <g transform="translate(886 323)" filter="url(#shadow)">
    <rect width="250" height="186" rx="25" fill="#fff" fill-opacity=".97"/>
    <text x="25" y="61" fill="#4d426d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="33" font-weight="850">有条件复试</text>
    <text x="25" y="100" fill="#6e7588" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">招聘建议</text>
    <text x="25" y="141" fill="#594b77" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700">强原型 · 弱生产交付</text>
  </g>
  <text x="70" y="582" fill="#e7ddea" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">结论：能搭复杂系统，但尚未证明能把金融 Agent 安全、正确、稳定地交给用户。</text>
  <text x="70" y="619" fill="#a9a3b7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">Public repository evidence · sanitized runtime results · no credentials</text>
</svg>
