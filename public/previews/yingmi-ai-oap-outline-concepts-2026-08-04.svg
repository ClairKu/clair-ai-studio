  <rect width="720" height="405" rx="28" fill="url(#bg)"/><text x="30" y="34" class="k">OAP OUTLINE DESIGN STUDY · 2026.08.04</text><text x="30" y="70" class="t">一页大纲，三种阅读模型</text><text x="30" y="91" class="s">不做传统目录；先建立管理层理解整份报告的方式。</text>
