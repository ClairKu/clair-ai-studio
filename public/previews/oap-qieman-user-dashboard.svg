<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OAP 用户画像 × 且慢持仓与行为看板预览</title>
  <desc id="desc">深色背景中由 OAP 调用信号连接到且慢资产价值，展示新注册、资产入账代理、三层用户阶梯和持仓行为指标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071922"/><stop offset="1" stop-color="#0c2c35"/></linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2b647"/><stop offset="1" stop-color="#28c9b4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#001117" flood-opacity=".42"/></filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#28c9b4" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <circle cx="1030" cy="132" r="270" fill="none" stroke="#28c9b4" stroke-opacity=".13"/>
  <circle cx="1030" cy="132" r="170" fill="none" stroke="#28c9b4" stroke-opacity=".13"/>

  <g transform="translate(72 54)">
    <circle cx="18" cy="18" r="18" fill="#28c9b4"/><text x="18" y="23" text-anchor="middle" font-family="monospace" font-size="14" font-weight="800" fill="#071922">O</text>
    <path d="M36 18h28" stroke="#ffffff" stroke-opacity=".45"/>
    <circle cx="82" cy="18" r="18" fill="#f2b647"/><text x="82" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#071922">且</text>
    <text x="112" y="13" font-family="sans-serif" font-size="15" font-weight="700" fill="#fffef9">OAP × 且慢</text>
    <text x="112" y="31" font-family="monospace" font-size="9" letter-spacing="2" fill="#ffffff" opacity=".48">USER VALUE RADAR</text>
  </g>

  <g transform="translate(72 142)">
    <text font-family="monospace" font-size="11" font-weight="700" letter-spacing="2.4" fill="#a7e6d7">OAP USER SIGNAL → QIEMAN VALUE</text>
    <text y="61" font-family="serif" font-size="50" font-weight="700" fill="#fffef9">先把<tspan fill="#f2b647">机器规模</tspan></text>
    <text y="119" font-family="serif" font-size="50" font-weight="700" fill="#fffef9">与<tspan fill="#28c9b4">真人价值</tspan>分开。</text>
    <text y="158" font-family="sans-serif" font-size="13" fill="#ffffff" opacity=".6">新注册与资产入账代理 · 三组用户联动 · 持仓行为 · 证据边界</text>
  </g>

  <g transform="translate(550 118)" filter="url(#shadow)">
    <rect width="578" height="306" fill="#fffef9"/>
    <rect x="10" y="10" width="558" height="286" fill="none" stroke="#13262d" stroke-opacity=".08"/>
    <text x="42" y="48" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.6" fill="#66787b">PLATFORM SIGNAL</text>
    <text x="42" y="98" font-family="monospace" font-size="42" font-weight="800" letter-spacing="-3" fill="#13262d">945.9 万</text>
    <text x="42" y="121" font-family="sans-serif" font-size="11" fill="#66787b">累计调用</text>
    <rect x="42" y="151" width="190" height="9" fill="#dfe6e2"/>
    <rect x="42" y="151" width="35" height="9" fill="#28c9b4"/>
    <text x="42" y="184" font-family="sans-serif" font-size="10" fill="#66787b"><tspan font-family="monospace" font-weight="800" fill="#13262d">18.4%</tspan> 可归属真人</text>

    <circle cx="288" cy="57" r="8" fill="#f2b647" stroke="#fffef9" stroke-width="4"/>
    <path d="M288 65v176" stroke="url(#bridge)" stroke-width="3"/>
    <circle cx="288" cy="249" r="8" fill="#28c9b4" stroke="#fffef9" stroke-width="4"/>
    <rect x="274" y="112" width="28" height="88" fill="#fffef9"/>
    <text x="289" y="120" font-family="monospace" font-size="8" font-weight="700" letter-spacing="1" fill="#66787b" writing-mode="tb">IDENTITY BRIDGE</text>

    <text x="330" y="48" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.6" fill="#66787b">QIEMAN VALUE</text>
    <text x="330" y="98" font-family="monospace" font-size="42" font-weight="800" letter-spacing="-3" fill="#13262d">0.88 亿</text>
    <text x="330" y="121" font-family="sans-serif" font-size="11" fill="#66787b">近 30 日活跃人群持仓</text>
    <text x="330" y="161" font-family="monospace" font-size="18" font-weight="800" fill="#098b80">357</text>
    <text x="382" y="161" font-family="sans-serif" font-size="11" fill="#66787b">位持仓用户</text>
    <text x="330" y="190" font-family="monospace" font-size="18" font-weight="800" fill="#098b80">15.8%</text>
    <text x="401" y="190" font-family="sans-serif" font-size="11" fill="#66787b">人群持仓率</text>
  </g>

  <g transform="translate(72 470)">
    <rect width="1056" height="166" fill="#f4f5ef"/>
    <g transform="translate(0)">
      <rect width="430" height="166" fill="#071922"/>
      <rect y="157" width="430" height="9" fill="#28c9b4"/>
      <text x="26" y="34" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.4" fill="#a7e6d7">01 · 批准申请用户</text>
      <text x="26" y="95" font-family="monospace" font-size="46" font-weight="800" letter-spacing="-3" fill="#fffef9">9,855</text>
      <text x="26" y="126" font-family="sans-serif" font-size="11" fill="#ffffff" opacity=".5">人群起点</text>
    </g>
    <g transform="translate(430)">
      <rect width="338" height="166" fill="#fffef9" stroke="#13262d" stroke-opacity=".15"/>
      <rect y="157" width="338" height="9" fill="#4e94cf"/>
      <text x="26" y="34" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.4" fill="#66787b">02 · 历史调用用户</text>
      <text x="26" y="95" font-family="monospace" font-size="46" font-weight="800" letter-spacing="-3" fill="#13262d">5,816</text>
      <text x="26" y="126" font-family="monospace" font-size="11" font-weight="700" fill="#66787b">59.0% / 批准用户</text>
    </g>
    <g transform="translate(768)">
      <rect width="288" height="166" fill="#fffef9" stroke="#13262d" stroke-opacity=".15"/>
      <rect y="157" width="288" height="9" fill="#f2b647"/>
      <text x="26" y="34" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1.4" fill="#66787b">03 · 近 30 日活跃</text>
      <text x="26" y="95" font-family="monospace" font-size="46" font-weight="800" letter-spacing="-3" fill="#13262d">2,266</text>
      <text x="26" y="126" font-family="monospace" font-size="11" font-weight="700" fill="#66787b">39.0% / 历史调用</text>
    </g>
  </g>
  <text x="72" y="679" font-family="sans-serif" font-size="10" fill="#ffffff" opacity=".44">公开脱敏聚合 · 稳定主键关联 · confirmed / partial / missing 分层</text>
</svg>
