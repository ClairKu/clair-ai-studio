<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">且慢养老统一方案预览</title>
  <desc id="desc">以唯一养老目标账户连接服务主线、投研引擎与角色化产品货架的管理方案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1E45"/>
      <stop offset="0.55" stop-color="#1D3F86"/>
      <stop offset="1" stop-color="#3567D6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EDF3FF" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#06102A" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="-60" r="420" fill="#78A1FF" opacity="0.18"/>
  <circle cx="80" cy="950" r="360" fill="#5CE0C5" opacity="0.11"/>
  <text x="120" y="118" fill="#AFC7FF" font-size="28" font-family="Songti SC, STSong, serif" letter-spacing="5">QIEMAN · PENSION UNIFICATION</text>
  <text x="120" y="220" fill="#FFFFFF" font-size="76" font-weight="700" font-family="Songti SC, STSong, serif">且慢养老统一方案</text>
  <text x="120" y="292" fill="#DDE8FF" font-size="34" font-family="Songti SC, STSong, serif">一个目标账户，一条服务主线，多套受治理的投研引擎</text>

  <g filter="url(#shadow)">
    <rect x="120" y="382" width="1360" height="430" rx="34" fill="url(#card)"/>
  </g>
  <g font-family="Songti SC, STSong, serif">
    <rect x="650" y="438" width="300" height="92" rx="22" fill="#3567D6"/>
    <text x="800" y="494" fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="middle">唯一养老目标账户</text>

    <line x1="800" y1="530" x2="800" y2="594" stroke="#7F9DDB" stroke-width="4"/>
    <line x1="800" y1="594" x2="340" y2="594" stroke="#7F9DDB" stroke-width="4"/>
    <line x1="800" y1="594" x2="1260" y2="594" stroke="#7F9DDB" stroke-width="4"/>
    <line x1="340" y1="594" x2="340" y2="626" stroke="#7F9DDB" stroke-width="4"/>
    <line x1="800" y1="594" x2="800" y2="626" stroke="#7F9DDB" stroke-width="4"/>
    <line x1="1260" y1="594" x2="1260" y2="626" stroke="#7F9DDB" stroke-width="4"/>

    <rect x="190" y="626" width="300" height="126" rx="22" fill="#E6EEFF"/>
    <text x="340" y="678" fill="#17366F" font-size="27" font-weight="700" text-anchor="middle">统一服务主线</text>
    <text x="340" y="718" fill="#506486" font-size="21" text-anchor="middle">规划 · 执行 · 跟踪 · 复盘</text>

    <rect x="650" y="626" width="300" height="126" rx="22" fill="#E5F8F4"/>
    <text x="800" y="678" fill="#145A50" font-size="27" font-weight="700" text-anchor="middle">多套投研引擎</text>
    <text x="800" y="718" fill="#4A716B" font-size="21" text-anchor="middle">测算 · 配置 · 风险预算</text>

    <rect x="1110" y="626" width="300" height="126" rx="22" fill="#FFF0DE"/>
    <text x="1260" y="678" fill="#7A4A12" font-size="27" font-weight="700" text-anchor="middle">角色化产品货架</text>
    <text x="1260" y="718" fill="#7C684F" font-size="21" text-anchor="middle">税优 · 增长 · 稳健 · 保障</text>
  </g>

  <g font-family="Songti SC, STSong, serif">
    <rect x="120" y="858" width="318" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="279" y="899" fill="#FFFFFF" font-size="23" text-anchor="middle">不建设第二套对客体系</text>
    <rect x="462" y="858" width="318" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="621" y="899" fill="#FFFFFF" font-size="23" text-anchor="middle">先修首投与持有漏斗</text>
    <rect x="804" y="858" width="318" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="963" y="899" fill="#FFFFFF" font-size="23" text-anchor="middle">现有新产品同机制准入</text>
    <rect x="1146" y="858" width="334" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="1313" y="899" fill="#FFFFFF" font-size="23" text-anchor="middle">90天完成收口与试点</text>
  </g>
</svg>
