<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">且慢投顾服务重构报告预览</title>
  <desc id="desc">紫色编辑式报告封面与新版投顾页手机原型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset=".62" stop-color="#eeeaff"/><stop offset="1" stop-color="#ded6ff"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171e31"/><stop offset="1" stop-color="#283451"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#251b59" flood-opacity=".20"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="120" r="280" fill="#7457e8" opacity=".10"/>
  <circle cx="160" cy="790" r="260" fill="#5e45c7" opacity=".08"/>
  <g transform="translate(120 120)">
    <text fill="#7457e8" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="800" letter-spacing="4">QIEMAN PRODUCT · 2026.08.07</text>
    <text y="114" fill="#171a27" font-family="Songti SC, STSong, serif" font-size="98" font-weight="600">且慢投顾服务重构</text>
    <text y="202" fill="#5138b5" font-family="Songti SC, STSong, serif" font-size="52">从策略货架，升级为个人投资服务首页</text>
    <text y="278" fill="#667084" font-family="Arial, PingFang SC, sans-serif" font-size="27">规划默认 · 定制优先 · 主动编排 · 自助可控</text>
    <g transform="translate(0 340)" font-family="Arial, PingFang SC, sans-serif" font-size="21" font-weight="700">
      <rect width="150" height="54" rx="18" fill="#fff" opacity=".84"/><text x="28" y="35" fill="#5c49bd">现状盘点</text>
      <rect x="168" width="150" height="54" rx="18" fill="#fff" opacity=".84"/><text x="196" y="35" fill="#5c49bd">转化分析</text>
      <rect x="336" width="150" height="54" rx="18" fill="#fff" opacity=".84"/><text x="364" y="35" fill="#5c49bd">目标态设计</text>
    </g>
    <g transform="translate(0 460)">
      <rect width="720" height="190" rx="28" fill="#fff" opacity=".78"/>
      <rect x="26" y="28" width="8" height="128" rx="4" fill="#7457e8"/>
      <text x="64" y="70" fill="#5138b5" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="800">中心判断</text>
      <text x="64" y="116" fill="#283044" font-family="Songti SC, STSong, serif" font-size="31">一份持续更新的个人投资计划，</text>
      <text x="64" y="157" fill="#283044" font-family="Songti SC, STSong, serif" font-size="31">统领规划、持仓、策略、工具与投后。</text>
    </g>
  </g>
  <g transform="translate(1130 90)" filter="url(#shadow)">
    <rect width="340" height="720" rx="58" fill="#171a22"/>
    <rect x="10" y="10" width="320" height="700" rx="49" fill="#f8f7f3"/>
    <rect x="126" y="24" width="88" height="22" rx="11" fill="#171a22"/>
    <text x="30" y="86" fill="#172033" font-family="Songti SC, STSong, serif" font-size="26" font-weight="700">我的投顾</text>
    <rect x="24" y="108" width="292" height="205" rx="28" fill="url(#phone)"/>
    <rect x="44" y="133" width="94" height="26" rx="13" fill="#7457e8" opacity=".85"/>
    <text x="58" y="151" fill="#fff" font-family="Arial, PingFang SC, sans-serif" font-size="11" font-weight="700">有资产未规划</text>
    <text x="44" y="200" fill="#fff" font-family="Songti SC, STSong, serif" font-size="25">先把这笔钱</text>
    <text x="44" y="234" fill="#fff" font-family="Songti SC, STSong, serif" font-size="25">放进计划里</text>
    <rect x="44" y="260" width="252" height="9" rx="5" fill="#fff" opacity=".16"/><rect x="44" y="260" width="158" height="9" rx="5" fill="#a996ff"/>
    <rect x="44" y="282" width="252" height="42" rx="13" fill="#8b72f3"/>
    <text x="117" y="309" fill="#fff" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="800">继续完善计划</text>
    <text x="28" y="358" fill="#172033" font-family="Songti SC, STSong, serif" font-size="21" font-weight="700">今天需要你处理</text>
    <rect x="24" y="377" width="292" height="118" rx="20" fill="#fff" stroke="#e6e3dc"/>
    <rect x="42" y="397" width="38" height="38" rx="12" fill="#fff2d9"/><text x="57" y="422" fill="#a35f0e" font-family="Arial" font-size="20" font-weight="900">!</text>
    <text x="94" y="415" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="800">新增资金到账，需要安排</text>
    <text x="94" y="441" fill="#777e8c" font-family="Arial, PingFang SC, sans-serif" font-size="10">先保留应急金，再补目标缺口</text>
    <rect x="42" y="457" width="120" height="25" rx="9" fill="#171e31"/><text x="82" y="474" fill="#fff" font-family="Arial, PingFang SC, sans-serif" font-size="10">看建议</text>
    <text x="28" y="540" fill="#172033" font-family="Songti SC, STSong, serif" font-size="21" font-weight="700">你的四笔钱</text>
    <g transform="translate(24 560)">
      <rect width="66" height="78" rx="16" fill="#fff" stroke="#e6e3dc"/><text x="22" y="34" fill="#3d7bd9" font-size="18" font-weight="800">活</text><text x="20" y="58" fill="#172033" font-size="11">已充足</text>
      <rect x="75" width="66" height="78" rx="16" fill="#fff" stroke="#e6e3dc"/><text x="97" y="34" fill="#2d8d78" font-size="18" font-weight="800">稳</text><text x="88" y="58" fill="#172033" font-size="11">缺 1.2 万</text>
      <rect x="150" width="66" height="78" rx="16" fill="#fff" stroke="#e6e3dc"/><text x="172" y="34" fill="#7457e8" font-size="18" font-weight="800">长</text><text x="169" y="58" fill="#172033" font-size="11">待规划</text>
      <rect x="225" width="66" height="78" rx="16" fill="#fff" stroke="#e6e3dc"/><text x="247" y="34" fill="#b06a23" font-size="18" font-weight="800">保</text><text x="244" y="58" fill="#172033" font-size="11">待检查</text>
    </g>
    <rect x="20" y="662" width="300" height="40" rx="18" fill="#fbfaf7"/>
    <text x="46" y="687" fill="#5b43c7" font-family="Arial, PingFang SC, sans-serif" font-size="12">今天</text><text x="120" y="687" fill="#8a8e98" font-size="12">计划</text><text x="195" y="687" fill="#8a8e98" font-size="12">自助</text><text x="268" y="687" fill="#8a8e98" font-size="12">组件</text>
  </g>
</svg>
