<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 开放平台历程・里程碑预览</title>
  <desc id="desc">左侧按月归并重点建设、重点合作与重点突破，右侧为四项用户指标联动走势；完整内容需密码访问。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111629"/>
      <stop offset="1" stop-color="#262244"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8067e8"/>
      <stop offset="1" stop-color="#b9a8ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c85f8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9c85f8" stop-opacity=".02"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
