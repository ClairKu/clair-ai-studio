    <g transform="translate(0 126)"><rect x="60" y="252" width="340" height="106" rx="18" fill="#effaf8"/><rect x="60" y="252" width="6" height="106" rx="3" fill="#42bbaa"/><text x="86" y="290" fill="#299b8c" font-size="19" font-weight="700">2025.07 · 重点合作</text><text x="86" y="328" fill="#171525" font-size="25">升级 AI 全栈合作</text></g>
    <g transform="translate(0 252)"><rect x="60" y="252" width="340" height="106" rx="18" fill="#fff8ea"/><rect x="60" y="252" width="6" height="106" rx="3" fill="#d59a3d"/><text x="86" y="290" fill="#b7791d" font-size="19" font-weight="700">2026.06 · 重点突破</text><text x="86" y="328" fill="#171525" font-size="25">千问合作 · 超级入口</text></g>
    <g transform="translate(0 378)"><rect x="60" y="252" width="340" height="106" rx="18" fill="#fff8ea"/><rect x="60" y="252" width="6" height="106" rx="3" fill="#d59a3d"/><text x="86" y="290" fill="#b7791d" font-size="19" font-weight="700">2026.07 · 重点突破</text><text x="86" y="328" fill="#171525" font-size="25">A2A · 首个机构投标</text></g>
