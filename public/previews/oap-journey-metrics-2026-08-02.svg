  <rect x="0" y="0" width="450" height="900" fill="#fbfaff"/>
  <text x="68" y="92" fill="#8067e8" font-family="Songti SC,STSong,serif" font-size="22" font-weight="700" letter-spacing="4">YINGMI AI · OAP JOURNEY</text>
  <text x="68" y="164" fill="#171525" font-family="Songti SC,STSong,serif" font-size="46" font-weight="700">月度关键历程</text>
