<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Stargate 金融机构使用统计报告预览</title>
  <desc id="desc">紫色加密报告封面，展示金融机构接入与调用统计主题，正文需口令解锁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171934"/>
      <stop offset="1" stop-color="#3c2f73"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8067e8"/>
      <stop offset="1" stop-color="#b7a6ff"/>
