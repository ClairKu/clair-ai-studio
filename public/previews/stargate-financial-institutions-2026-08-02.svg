    <rect x="140" y="452" width="56" height="84" rx="6" fill="url(#bar)" opacity="0.75"/>
    <rect x="216" y="476" width="56" height="60" rx="6" fill="url(#bar)" opacity="0.6"/>
    <rect x="292" y="492" width="56" height="44" rx="6" fill="url(#bar)" opacity="0.45"/>
    <rect x="368" y="504" width="56" height="32" rx="6" fill="url(#bar)" opacity="0.35"/>
  </g>
  <g transform="translate(760,420)">
    <rect x="0" y="24" width="120" height="92" rx="14" fill="none" stroke="#b7a6ff" stroke-width="6"/>
    <path d="M20 24 v-14 a40 40 0 0 1 80 0 v14" fill="none" stroke="#b7a6ff" stroke-width="6"/>
    <circle cx="60" cy="64" r="10" fill="#b7a6ff"/>
