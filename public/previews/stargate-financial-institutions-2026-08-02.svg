  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect x="64" y="64" width="180" height="34" rx="17" fill="none" stroke="#b7a6ff" stroke-opacity="0.6"/>
  <text x="154" y="87" text-anchor="middle" font-family="Songti SC, STSong, Georgia, serif" font-size="16" letter-spacing="4" fill="#b7a6ff">INTERNAL</text>
  <text x="64" y="200" font-family="Songti SC, STSong, Georgia, serif" font-size="58" font-weight="700" fill="#f5f3ff">Stargate 金融机构</text>
  <text x="64" y="272" font-family="Songti SC, STSong, Georgia, serif" font-size="58" font-weight="700" fill="#f5f3ff">使用统计报告</text>
  <text x="64" y="330" font-family="Songti SC, STSong, Georgia, serif" font-size="22" fill="#c9c0f2">剔除盈米口径 · 488 家接入 · 326 家在用 · 数据截至 2026-08-02</text>
  <g opacity="0.9">
