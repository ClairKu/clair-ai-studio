    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#a996ff"/><stop offset="1" stop-color="#7457e8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
