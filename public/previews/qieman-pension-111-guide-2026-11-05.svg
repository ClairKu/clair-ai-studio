<text x="76" y="455" font-family="Georgia,serif" fill="#a88445" font-size="30">01</text><text x="128" y="455" fill="#203f36" font-size="26" font-weight="650">1+1+1：三类养老安排，共同服务一个目标</text>
<text x="76" y="491" fill="#68756b" font-size="14">2022 年发布的完整养老服务框架 · 政策性养老储备、补充养老投资和保险安排</text>
<g>
<rect x="76" y="517" width="344" height="221" rx="16" fill="#fffef9" stroke="#d9dfd3"/>
