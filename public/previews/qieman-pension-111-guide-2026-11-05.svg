<text x="1204" y="52" text-anchor="end" fill="#68756b" font-size="12">2026.11.05 整理</text>
<text x="76" y="111" fill="#a88445" font-size="12" font-weight="650" letter-spacing="2.2">RETIREMENT PLANNING</text>
<text x="76" y="179" font-family="Songti SC,Noto Serif CJK SC,serif" font-size="50" font-weight="600" fill="#203f36">养老 1+1+1：账户、产品与规划</text>
<g font-size="18" fill="#52675a"><text x="76" y="226">先测算需要存多少，再决定资金放在哪里、承担多大风险，</text><text x="76" y="258">最后匹配产品，形成一份可以长期执行的养老计划。</text></g>
