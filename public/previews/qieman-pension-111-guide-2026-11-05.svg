<text x="424" y="306" fill="#a88445">→</text><rect x="444" y="283" width="120" height="35" rx="18" fill="#fffef9" stroke="#d9dfd3"/><text x="504" y="306">账户分配</text>
<text x="585" y="306" fill="#a88445">→</text><rect x="605" y="283" width="120" height="35" rx="18" fill="#fffef9" stroke="#d9dfd3"/><text x="665" y="306">配置与选品</text>
<text x="746" y="306" fill="#a88445">→</text><rect x="766" y="283" width="120" height="35" rx="18" fill="#fffef9" stroke="#d9dfd3"/><text x="826" y="306">长期跟踪</text>
</g>
<path d="M0 347H1280 M0 396H1280" stroke="#d9dfd3"/>
