<text x="101" y="590" font-size="24" fill="#203f36" font-weight="650">个人养老金账户</text><text x="101" y="628" font-size="15" fill="#203f36" font-weight="650">在个人养老金制度内积累</text><text x="101" y="666" font-size="13" fill="#5e7062">参加意愿 · 税收情况</text><text x="101" y="694" font-size="13" fill="#5e7062">长期资金安排</text>
<text x="441" y="632" font-family="Georgia,serif" font-size="29" text-anchor="middle" fill="#a3ad9c">+</text>
<rect x="462" y="517" width="344" height="221" rx="16" fill="#fffef9" stroke="#d9dfd3"/>
<text x="487" y="550" font-size="11" fill="#a88445" letter-spacing="1.2">补充养老投资</text><text x="775" y="566" font-family="Georgia,serif" font-size="44" fill="#b1c3b5">1</text>
<text x="487" y="590" font-size="24" fill="#203f36" font-weight="650">且慢补充养老投资账户</text><text x="487" y="628" font-size="15" fill="#203f36" font-weight="650">承接政策账户之外的养老钱</text><text x="487" y="666" font-size="13" fill="#5e7062">用钱时间 · 风险承受能力</text><text x="487" y="694" font-size="13" fill="#5e7062">补充储备需求</text>
<text x="827" y="632" font-family="Georgia,serif" font-size="29" text-anchor="middle" fill="#a3ad9c">+</text>
<rect x="848" y="517" width="356" height="221" rx="16" fill="#f5f2e8" stroke="#d9dfd3"/>
<text x="873" y="550" font-size="11" fill="#a88445" letter-spacing="1.2">养老保险安排</text><text x="1173" y="566" font-family="Georgia,serif" font-size="44" fill="#b1c3b5">1</text>
<text x="873" y="590" font-size="24" fill="#203f36" font-weight="650">且慢养老保险账户</text><text x="873" y="628" font-size="15" fill="#203f36" font-weight="650">按合同安排退休领取现金流</text><text x="873" y="666" font-size="13" fill="#5e7062">已有保障 · 退休现金流</text><text x="873" y="694" font-size="13" fill="#5e7062">持续缴费能力</text>
</g>
