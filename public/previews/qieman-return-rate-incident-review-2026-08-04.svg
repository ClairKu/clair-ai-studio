      <text x="66" y="155" font-size="27" fill="#5F45D2">+34.71%</text>
      <rect x="42" y="188" width="376" height="76" rx="18" fill="#FFF3F4"/>
      <text x="66" y="219" font-size="15" fill="#716A82">收益日历</text>
      <text x="66" y="247" font-size="27" fill="#C14D64">-1706.20%</text>
      <rect x="42" y="280" width="376" height="76" rx="18" fill="#F1EDFF"/>
      <text x="66" y="311" font-size="15" fill="#716A82">资产页</text>
