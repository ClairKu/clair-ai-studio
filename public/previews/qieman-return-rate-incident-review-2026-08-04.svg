      <stop offset="1" stop-color="#EAE3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6549D8"/>
      <stop offset="1" stop-color="#9A78F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#443189" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="230" fill="#DCCFFF" opacity=".55"/>
  <circle cx="85" cy="650" r="180" fill="#FFFFFF" opacity=".7"/>
  <g transform="translate(74 76)">
