    <text x="29" y="37" text-anchor="middle" font-family="Songti SC,serif" font-size="21" font-weight="700" fill="#fff">QM</text>
    <text x="0" y="108" font-family="Songti SC,serif" font-size="18" font-weight="700" letter-spacing="4" fill="#6A54C7">RETURN RATE · INCIDENT REVIEW</text>
    <text x="0" y="182" font-family="Songti SC,serif" font-size="54" font-weight="700" fill="#171525">累计收益率异常</text>
    <text x="0" y="246" font-family="Songti SC,serif" font-size="35" fill="#4D4760">从公式争议到产品修复</text>
    <text x="0" y="316" font-family="Songti SC,serif" font-size="22" fill="#706A7F">口径冲突 · 分母有效域 · TWR 主指标 · PM 决策</text>
  </g>
  <g transform="translate(660 142)" filter="url(#shadow)">
