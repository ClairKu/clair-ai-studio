<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 从底座到服务</title>
  <desc id="desc">AI 开放平台位于最底层，向上支撑 AI 资产、生产治理、交付协同和服务生态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5ff"/><stop offset="1" stop-color="#e9e3ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f4fe4"/><stop offset="1" stop-color="#9a84ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b277f" flood-opacity=".14"/></filter>
  </defs>
  <rect width="640" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="558" cy="58" r="120" fill="#fff" opacity=".42"/>
  <text x="44" y="54" fill="#7457e8" font-family="Songti SC,serif" font-size="13" font-weight="700" letter-spacing="2">ARCHITECTURE REFRAME</text>
  <text x="44" y="91" fill="#171727" font-family="Songti SC,serif" font-size="30" font-weight="700">从底座到服务</text>
  <text x="44" y="116" fill="#6b7081" font-family="Songti SC,serif" font-size="13">统一为自下而上的价值生长逻辑</text>
  <g filter="url(#shadow)">
    <rect x="90" y="146" width="460" height="42" rx="14" fill="#fff"/>
    <rect x="116" y="198" width="408" height="42" rx="14" fill="#fff"/>
    <rect x="142" y="250" width="356" height="42" rx="14" fill="#fff"/>
    <rect x="168" y="302" width="304" height="52" rx="16" fill="url(#core)"/>
  </g>
  <text x="320" y="173" text-anchor="middle" fill="#26273a" font-family="Songti SC,serif" font-size="14" font-weight="700">服务与生态</text>
  <text x="320" y="225" text-anchor="middle" fill="#26273a" font-family="Songti SC,serif" font-size="14" font-weight="700">交付协同 · 生产治理</text>
  <text x="320" y="277" text-anchor="middle" fill="#26273a" font-family="Songti SC,serif" font-size="14" font-weight="700">MCP · Skills · Agent</text>
  <text x="320" y="334" text-anchor="middle" fill="#fff" font-family="Songti SC,serif" font-size="16" font-weight="700">AI 开放平台</text>
  <path d="M320 297v-78" fill="none" stroke="#7457e8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7"/>
  <path d="m311 226 9-11 9 11" fill="none" stroke="#7457e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="361" width="552" height="1" fill="#7457e8" opacity=".18"/>
  <text x="44" y="382" fill="#6b7081" font-family="Songti SC,serif" font-size="11">主链向上创造价值 · 反馈向下驱动迭代</text>
</svg>
