<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">盈米 MCP 个人中心重设计</title>
  <desc id="desc">个人版、团队版、企业版账号、积分额度、口令与用量统计的管理页面原型封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1E4B"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2F6BFF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="230" fill="#9DB7FF" opacity=".12"/>
  <circle cx="150" cy="640" r="260" fill="#7C5CFF" opacity=".14"/>
  <g transform="translate(75 66)">
    <rect width="236" height="34" rx="17" fill="#EAF0FF" opacity=".95"/>
    <text x="118" y="23" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#1E52D6">盈米 AI 开放平台 · 产品原型</text>
    <text y="110" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="60" font-weight="800" fill="#fff">MCP 个人中心，从一个人到一家机构</text>
    <text y="160" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#C9D8FF">个人版 · 团队版 · 企业版 ｜ 账号 · 积分额度 · 使用期限 · 口令 · 用量统计</text>
  </g>
  <g transform="translate(75 262)" filter="url(#shadow)">
    <rect width="1050" height="300" rx="26" fill="#fff" opacity=".98"/>
    <g transform="translate(34 30)" font-family="PingFang SC,Microsoft YaHei,sans-serif">
      <g>
        <rect width="228" height="96" rx="14" fill="#F2F6FF" stroke="#C9D8FF"/>
        <text x="18" y="30" font-size="14" fill="#7A8497">积分池剩余</text>
        <text x="18" y="66" font-size="30" font-weight="800" fill="#1F2633">1,187,660</text>
        <rect x="18" y="78" width="192" height="6" rx="3" fill="#EDF0F6"/><rect x="18" y="78" width="79" height="6" rx="3" fill="url(#bar)"/>
      </g>
      <g transform="translate(250 0)">
        <rect width="228" height="96" rx="14" fill="#fff" stroke="#E6EBF5"/>
        <text x="18" y="30" font-size="14" fill="#7A8497">席位 · 活跃成员</text>
        <text x="18" y="66" font-size="30" font-weight="800" fill="#1F2633">38<tspan font-size="16" fill="#7A8497" font-weight="500"> / 50</tspan></text>
        <text x="18" y="86" font-size="12" fill="#1FA971">待激活 2 · 30 天内到期 1</text>
      </g>
      <g transform="translate(500 0)">
        <rect width="228" height="96" rx="14" fill="#fff" stroke="#E6EBF5"/>
        <text x="18" y="30" font-size="14" fill="#7A8497">本月调用量</text>
        <text x="18" y="66" font-size="30" font-weight="800" fill="#1F2633">236,850</text>
        <text x="18" y="86" font-size="12" fill="#1FA971">▲ 18.6% 较上月</text>
      </g>
      <g transform="translate(750 0)">
        <rect width="232" height="96" rx="14" fill="#EAF0FF" stroke="#C9D8FF"/>
        <text x="18" y="30" font-size="14" fill="#1E52D6">席位激活口令</text>
        <text x="18" y="64" font-family="Menlo,SF Mono,Consolas,monospace" font-size="22" font-weight="700" fill="#1E52D6">YM-ENT-4H8K-2ZQ7</text>
        <text x="18" y="86" font-size="12" fill="#7A8497">20,000 积分 · 至 2027-03-31 · 7 天有效</text>
      </g>
      <g transform="translate(0 122)">
        <text font-size="14" font-weight="700" fill="#4B5566">账号与成员</text>
        <g transform="translate(0 20)" font-size="13">
          <rect width="982" height="1" fill="#E6EBF5"/>
          <g transform="translate(0 14)">
            <circle cx="14" cy="10" r="12" fill="#E8EDF7"/><text x="14" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#3A4A6B">周</text>
            <text x="36" y="15" font-weight="600" fill="#1F2633">周子航</text><text x="110" y="15" fill="#7A8497">成员 · 量化研究</text>
            <rect x="250" y="4" width="84" height="18" rx="9" fill="#E6F7EF"/><text x="292" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#1FA971">已激活</text>
            <text x="370" y="15" fill="#4B5566">37,800 / 40,000</text><rect x="500" y="8" width="200" height="6" rx="3" fill="#EDF0F6"/><rect x="500" y="8" width="190" height="6" rx="3" fill="#E5484D"/>
            <text x="730" y="15" fill="#4B5566">2026-12-31</text><text x="850" y="15" fill="#2F6BFF">调整额度 · 延期 · 更多</text>
          </g>
          <g transform="translate(0 50)">
            <circle cx="14" cy="10" r="12" fill="#E8EDF7"/><text x="14" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#3A4A6B">韩</text>
            <text x="36" y="15" font-weight="600" fill="#1F2633">韩奕</text><text x="110" y="15" fill="#7A8497">成员 · 技术部</text>
            <rect x="250" y="4" width="84" height="18" rx="9" fill="#FFF3E6"/><text x="292" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#C9700F">待激活</text>
            <text x="370" y="15" fill="#4B5566">0 / 20,000</text><rect x="500" y="8" width="200" height="6" rx="3" fill="#EDF0F6"/>
            <text x="730" y="15" fill="#4B5566">2027-03-31</text><text x="850" y="15" fill="#2F6BFF">重发口令 · 延期 · 更多</text>
          </g>
          <g transform="translate(0 86)">
            <circle cx="14" cy="10" r="12" fill="#E8EDF7"/><text x="14" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#3A4A6B">吴</text>
            <text x="36" y="15" font-weight="600" fill="#1F2633">吴晚晴</text><text x="110" y="15" fill="#7A8497">成员 · 投顾服务</text>
            <rect x="250" y="4" width="84" height="18" rx="9" fill="#E6F7EF"/><text x="292" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#1FA971">已激活</text>
            <text x="370" y="15" fill="#4B5566">12,040 / 30,000</text><rect x="500" y="8" width="200" height="6" rx="3" fill="#EDF0F6"/><rect x="500" y="8" width="80" height="6" rx="3" fill="#2F6BFF"/>
            <text x="730" y="15" fill="#C9700F">2026-10-15 ⚠</text><text x="850" y="15" fill="#2F6BFF">调整额度 · 延期 · 更多</text>
          </g>
        </g>
      </g>
    </g>
  </g>
  <text x="75" y="622" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#C9D8FF">管理员视图 × 成员视图 × 待激活视图 ｜ 5 个演示视角一键切换 ｜ 单文件交互原型</text>
</svg>
