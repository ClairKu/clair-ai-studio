<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">MCP 调用 TOP10 分析预览</title>
  <desc id="desc">紫色数据分析封面，展示剔除时间查询后的 23 次调用、18 个工具和 TOP10 覆盖率。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171934"/>
      <stop offset=".62" stop-color="#2d245c"/>
      <stop offset="1" stop-color="#6d55c9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8067e8"/>
      <stop offset="1" stop-color="#c3b3ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="824" cy="112" r="225" fill="none" stroke="#d8ceff" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="824" cy="112" r="164" fill="none" stroke="#d8ceff" stroke-opacity=".1" stroke-width="2"/>
  <text x="70" y="70" fill="#d8ceff" font-family="'Songti SC','STSong',serif" font-size="16" font-weight="800" letter-spacing="3">YINGMI MCP / 7-DAY USAGE ANALYSIS</text>
  <text x="70" y="158" fill="#fff" font-family="'Songti SC','STSong',serif" font-size="56" font-weight="850">MCP 调用 TOP10</text>
  <text x="70" y="218" fill="#fff" font-family="'Songti SC','STSong',serif" font-size="42" font-weight="800">剔除时间查询</text>
  <text x="70" y="262" fill="#d7d2e9" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">资讯入口已形成，专业场景仍在广泛试用</text>
  <g transform="translate(70 330)">
    <rect width="240" height="132" rx="18" fill="#242147" stroke="#65599a"/>
    <text x="24" y="54" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="800">23</text>
    <text x="24" y="86" fill="#bdb6d4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">非时间调用</text>
    <text x="24" y="112" fill="#8f86ae" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13">原始 26 次 − 时间查询 3 次</text>
  </g>
  <g transform="translate(330 330)">
    <rect width="205" height="132" rx="18" fill="#242147" stroke="#65599a"/>
    <text x="24" y="54" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="800">18</text>
    <text x="24" y="86" fill="#bdb6d4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">非时间工具</text>
    <text x="24" y="112" fill="#8f86ae" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13">仅 2 项发生重复调用</text>
  </g>
  <g transform="translate(555 330)">
    <rect width="300" height="132" rx="18" fill="#242147" stroke="#65599a"/>
    <text x="24" y="54" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="800">65.2%</text>
    <text x="24" y="86" fill="#bdb6d4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">TOP10 覆盖率</text>
    <rect x="24" y="106" width="252" height="7" rx="4" fill="#423a67"/>
    <rect x="24" y="106" width="164" height="7" rx="4" fill="url(#bar)"/>
  </g>
  <text x="70" y="540" fill="#bcb5d2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14">近 7 天 · 采集于 2026-08-03 · 公开脱敏摘要</text>
</svg>
