<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 交易能力规划预览</title>
  <desc id="desc">从五条并行任务收口为一条受控交易服务闭环的能力架构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f0ecff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7457e8"/>
      <stop offset="1" stop-color="#9a86ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#2a2254" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1135" cy="102" r="180" fill="#7457e8" opacity=".07"/>
  <circle cx="112" cy="670" r="210" fill="#9a86ef" opacity=".08"/>
  <g transform="translate(86 72)">
    <rect width="42" height="42" rx="12" fill="url(#ink)"/>
    <text x="21" y="28" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="800">C</text>
    <text x="58" y="17" fill="#695b94" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="800" letter-spacing="2">Q I E M A N · R O A D M A P</text>
    <text x="58" y="39" fill="#8b82a7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12">2026.08.11 · 脱敏公开版</text>
  </g>
  <text x="86" y="186" fill="#171a27" font-family="'Songti SC','STSong',serif" font-size="54" font-weight="600">AI 交易能力规划</text>
  <text x="86" y="240" fill="#7457e8" font-family="'Songti SC','STSong',serif" font-size="34" font-weight="600">从五条任务，收口为一条服务闭环</text>
  <g transform="translate(86 314)" filter="url(#shadow)">
    <rect width="1108" height="242" rx="28" fill="#fff" stroke="#e5e1f4"/>
    <g transform="translate(42 48)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <g>
        <rect width="138" height="74" rx="18" fill="#f3f0ff"/>
        <text x="69" y="31" text-anchor="middle" fill="#7457e8" font-size="11" font-weight="800" letter-spacing="1.6">INTENT</text>
        <text x="69" y="54" text-anchor="middle" fill="#2c3040" font-size="16" font-weight="700">意图与约束</text>
      </g>
      <path d="M148 37h28" stroke="#b8acf0" stroke-width="2"/><path d="m172 31 8 6-8 6" fill="none" stroke="#b8acf0" stroke-width="2"/>
      <g transform="translate(188)">
        <rect width="138" height="74" rx="18" fill="#f8f7fb" stroke="#e4e1ee"/>
        <text x="69" y="31" text-anchor="middle" fill="#7457e8" font-size="11" font-weight="800" letter-spacing="1.6">PLAN</text>
        <text x="69" y="54" text-anchor="middle" fill="#2c3040" font-size="16" font-weight="700">计划与解释</text>
      </g>
      <path d="M336 37h28" stroke="#b8acf0" stroke-width="2"/><path d="m360 31 8 6-8 6" fill="none" stroke="#b8acf0" stroke-width="2"/>
      <g transform="translate(376)">
        <rect width="138" height="74" rx="18" fill="#f8f7fb" stroke="#e4e1ee"/>
        <text x="69" y="31" text-anchor="middle" fill="#7457e8" font-size="11" font-weight="800" letter-spacing="1.6">PREFLIGHT</text>
        <text x="69" y="54" text-anchor="middle" fill="#2c3040" font-size="16" font-weight="700">治理与预检</text>
      </g>
      <path d="M524 37h28" stroke="#b8acf0" stroke-width="2"/><path d="m548 31 8 6-8 6" fill="none" stroke="#b8acf0" stroke-width="2"/>
      <g transform="translate(564)">
        <rect width="138" height="74" rx="18" fill="#171f37"/>
        <text x="69" y="31" text-anchor="middle" fill="#cbbfff" font-size="11" font-weight="800" letter-spacing="1.6">CONFIRM</text>
        <text x="69" y="54" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">人工确认</text>
      </g>
      <path d="M712 37h28" stroke="#b8acf0" stroke-width="2"/><path d="m736 31 8 6-8 6" fill="none" stroke="#b8acf0" stroke-width="2"/>
      <g transform="translate(752)">
        <rect width="138" height="74" rx="18" fill="#f8f7fb" stroke="#e4e1ee"/>
        <text x="69" y="31" text-anchor="middle" fill="#7457e8" font-size="11" font-weight="800" letter-spacing="1.6">EXECUTE</text>
        <text x="69" y="54" text-anchor="middle" fill="#2c3040" font-size="16" font-weight="700">沙箱执行</text>
      </g>
      <path d="M900 37h28" stroke="#b8acf0" stroke-width="2"/><path d="m924 31 8 6-8 6" fill="none" stroke="#b8acf0" stroke-width="2"/>
      <g transform="translate(940)">
        <rect width="126" height="74" rx="18" fill="#f3f0ff"/>
        <text x="63" y="31" text-anchor="middle" fill="#7457e8" font-size="11" font-weight="800" letter-spacing="1.4">WRITEBACK</text>
        <text x="63" y="54" text-anchor="middle" fill="#2c3040" font-size="16" font-weight="700">结果写回</text>
      </g>
      <g transform="translate(0 116)">
        <rect width="1066" height="58" rx="15" fill="#f8f6ff"/>
        <text x="28" y="35" fill="#5f4ec0" font-size="14" font-weight="800">P0 守住基线与主链</text>
        <text x="280" y="35" fill="#6b7183" font-size="14">P1 内容工作包 · 市场温度 · 工具治理</text>
        <text x="756" y="35" fill="#6b7183" font-size="14">P2 投顾页与常规优化</text>
      </g>
    </g>
  </g>
  <g transform="translate(86 610)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect width="116" height="32" rx="16" fill="#171f37"/><text x="58" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">人工确认</text>
    <rect x="128" width="116" height="32" rx="16" fill="#ede8ff"/><text x="186" y="21" text-anchor="middle" fill="#634dc8" font-size="11" font-weight="800">沙箱优先</text>
    <rect x="256" width="116" height="32" rx="16" fill="#ede8ff"/><text x="314" y="21" text-anchor="middle" fill="#634dc8" font-size="11" font-weight="800">目标态规划</text>
  </g>
