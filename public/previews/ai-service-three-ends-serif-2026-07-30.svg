<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">同一能力底座，服务三端业务</title>
  <desc id="desc">盈米 AI 以统一能力资产服务投资者、顾问运营和机构伙伴三端业务。</desc>
  <defs>
    <linearGradient id="storyBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#302d73"/>
      <stop offset="1" stop-color="#151f38"/>
    </linearGradient>
    <linearGradient id="metricBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#f0edfc"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#161e38" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="38" fill="#0d162b"/>
  <text x="42" y="48" fill="#fff" font-family="Songti SC, STSong, SimSun, serif" font-size="18" font-weight="700" letter-spacing="2">ONE AI, THREE ENDS</text>
  <rect x="922" y="22" width="235" height="39" rx="19.5" fill="#182239" stroke="#303a51"/>
  <text x="1039.5" y="47" text-anchor="middle" fill="#aeb7ca" font-family="Songti SC, STSong, SimSun, serif" font-size="14">统一能力资产 · 差异化服务</text>

  <rect x="42" y="82" width="1116" height="551" rx="30" fill="#f6f7fb"/>
  <path d="M72 82H356V633H72A30 30 0 0 1 42 603V112A30 30 0 0 1 72 82Z" fill="url(#storyBg)"/>
  <text x="82" y="141" fill="#b9aaff" font-family="Songti SC, STSong, SimSun, serif" font-size="14" font-weight="700" letter-spacing="2">ONE AI, THREE ENDS</text>
  <text x="82" y="200" fill="#fff" font-family="Songti SC, STSong, SimSun, serif" font-size="34" font-weight="700">
    <tspan x="82">同一能力底座，</tspan>
    <tspan x="82" dy="46">服务三端业务</tspan>
  </text>
  <rect x="82" y="282" width="45" height="4" rx="2" fill="#8d70ff"/>
  <text x="82" y="327" fill="#c6cce0" font-family="Songti SC, STSong, SimSun, serif" font-size="15">
    <tspan x="82">不是为三端分别重复建设 AI，</tspan>
    <tspan x="82" dy="28">而是以统一能力资产支撑差异化</tspan>
    <tspan x="82" dy="28">服务：C 端更懂、更主动；A 端</tspan>
    <tspan x="82" dy="28">获得专家级辅助；B 端获得可集</tspan>
    <tspan x="82" dy="28">成、可复用、可治理的能力底座。</tspan>
  </text>
  <text x="82" y="585" fill="#737f99" font-family="Songti SC, STSong, SimSun, serif" font-size="11" letter-spacing="1.4">CUSTOMER · ADVISOR · BUSINESS</text>

  <text x="394" y="139" fill="#121827" font-family="Songti SC, STSong, SimSun, serif" font-size="27" font-weight="700">同一套能力，创造三类结果</text>
  <text x="1121" y="138" text-anchor="end" fill="#65708a" font-family="Songti SC, STSong, SimSun, serif" font-size="13">面向用户更懂，面向顾问更强，面向机构更开放。</text>

  <g filter="url(#shadow)" font-family="Songti SC, STSong, SimSun, serif">
    <rect x="394" y="173" width="226" height="404" rx="24" fill="#fff" stroke="#d9deeb"/>
    <text x="425" y="215" fill="#7352ed" font-size="13" font-weight="700">投资者 · CUSTOMER</text>
    <text x="584" y="261" fill="#7352ed" opacity=".11" font-size="92" font-weight="700">C</text>
    <text x="425" y="284" fill="#121827" font-size="23" font-weight="700">
      <tspan x="425">更懂、更主动、</tspan>
      <tspan x="425" dy="32">更会分析</tspan>
    </text>
    <text x="425" y="366" fill="#65708a" font-size="12.5">
      <tspan x="425">AI 小顾提供 7×24 小时的账户解释、</tspan>
      <tspan x="425" dy="23">投资规划、产品分析、市场解读与</tspan>
      <tspan x="425" dy="23">投后陪伴。</tspan>
    </text>
    <rect x="425" y="463" width="74" height="72" rx="13" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <rect x="509" y="463" width="80" height="72" rx="13" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <text x="437" y="492" fill="#5d43d4" font-size="21" font-weight="700">20 万</text>
    <text x="437" y="515" fill="#42495c" font-size="10">服务用户</text>
    <text x="521" y="492" fill="#5d43d4" font-size="21" font-weight="700">300 万</text>
    <text x="521" y="515" fill="#42495c" font-size="10">次调用</text>
    <rect x="425" y="543" width="164" height="24" rx="10" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <text x="437" y="561" fill="#5d43d4" font-size="13" font-weight="700">95%+ <tspan fill="#42495c" font-size="9" font-weight="400">通过率</tspan></text>

    <rect x="635" y="173" width="226" height="404" rx="24" fill="#fff" stroke="#d9deeb"/>
    <text x="666" y="215" fill="#7352ed" font-size="13" font-weight="700">顾问 / 运营 · ADVISOR</text>
    <text x="825" y="261" fill="#7352ed" opacity=".11" font-size="92" font-weight="700">A</text>
    <text x="666" y="284" fill="#121827" font-size="23" font-weight="700">
      <tspan x="666">把专家方法复制给</tspan>
      <tspan x="666" dy="32">每位顾问</tspan>
    </text>
    <text x="666" y="366" fill="#65708a" font-size="12.5">
      <tspan x="666">客户洞察、方案生成、沟通陪伴、</tspan>
      <tspan x="666" dy="23">内容生产与服务复盘形成闭环。</tspan>
    </text>
    <rect x="666" y="493" width="74" height="72" rx="13" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <rect x="750" y="493" width="80" height="72" rx="13" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <text x="678" y="522" fill="#5d43d4" font-size="21" font-weight="700">5×</text>
    <text x="678" y="545" fill="#42495c" font-size="10">报告产能</text>
    <text x="762" y="522" fill="#5d43d4" font-size="21" font-weight="700">2×</text>
    <text x="762" y="545" fill="#42495c" font-size="10">转化提升案例</text>

    <rect x="876" y="173" width="245" height="404" rx="24" fill="#fff" stroke="#d9deeb"/>
    <text x="907" y="215" fill="#7352ed" font-size="13" font-weight="700">机构伙伴 · BUSINESS</text>
    <text x="1082" y="261" fill="#7352ed" opacity=".11" font-size="92" font-weight="700">B</text>
    <text x="907" y="284" fill="#121827" font-size="23" font-weight="700">
      <tspan x="907">可集成、可复用、</tspan>
      <tspan x="907" dy="32">可治理</tspan>
    </text>
    <text x="907" y="366" fill="#65708a" font-size="12.5">
      <tspan x="907">通过 MCP、Skills、开放平台与机构</tspan>
      <tspan x="907" dy="23">共建，把金融专业能力嵌入各类 AI</tspan>
      <tspan x="907" dy="23">产品和业务工作台。</tspan>
    </text>
    <rect x="907" y="493" width="84" height="72" rx="13" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <rect x="1001" y="493" width="89" height="72" rx="13" fill="url(#metricBg)" stroke="#e2ddf8"/>
    <text x="919" y="522" fill="#5d43d4" font-size="21" font-weight="700">400+</text>
    <text x="919" y="545" fill="#42495c" font-size="10">金融机构</text>
    <text x="1013" y="522" fill="#5d43d4" font-size="21" font-weight="700">1600+</text>
    <text x="1013" y="545" fill="#42495c" font-size="10">接入机构总数</text>
  </g>
</svg>
