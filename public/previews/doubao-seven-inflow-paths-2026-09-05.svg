<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">豆包 × 且慢 7 位入金用户路径深析</title>
  <desc id="desc">米白编辑风格的用户路径审计，展示口径纠偏、七条时间线与存量客户再行动结论。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3eb"/><stop offset="1" stop-color="#e8e4d8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#253028" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#paper)"/>
  <g font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif">
    <circle cx="82" cy="72" r="26" fill="#18231d"/><text x="82" y="78" fill="#c9f03e" font-size="15" font-weight="800" text-anchor="middle">Q</text>
    <text x="124" y="79" fill="#171915" font-size="20" font-weight="800">CLAIR’S STUDIO</text>
    <text x="84" y="173" fill="#0b6a50" font-size="14" font-weight="800" letter-spacing="4">DOUBAO × QIEMAN · PATH AUDIT</text>
    <text x="82" y="258" fill="#171915" font-size="66" font-weight="900" letter-spacing="-4">这 7 人不是新增用户，</text>
    <text x="82" y="331" fill="#0b6a50" font-size="66" font-weight="900" letter-spacing="-4">而是存量投资者的再行动。</text>
    <text x="86" y="382" fill="#65695f" font-size="19">从首次豆包会话代理到资金与交易事实 · 逐人证据链</text>
    <g transform="translate(1035 110)" filter="url(#shadow)"><rect width="475" height="276" rx="30" fill="#18231d"/><text x="32" y="47" fill="#c9f03e" font-size="12" font-weight="800" letter-spacing="3">CORE JUDGEMENT</text><text x="32" y="99" fill="#f3f4ed" font-size="31" font-weight="800">0 开户 · 0 绑卡</text><text x="32" y="140" fill="#f3f4ed" font-size="31" font-weight="800">0 风测 · 0 首投</text><line x1="32" x2="443" y1="177" y2="177" stroke="#3c4a40"/><text x="32" y="215" fill="#b8c2b9" font-size="15">全部关键里程碑均在豆包会话前完成</text><text x="32" y="242" fill="#b8c2b9" font-size="15">应归入存量客户复用，而非新增获客</text></g>
    <g transform="translate(84 449)">
      <g><rect width="328" height="154" rx="24" fill="#fbfaf5" stroke="#c9c5b8"/><text x="24" y="37" fill="#65695f" font-size="14">自然日关联入账</text><text x="24" y="94" fill="#171915" font-size="43" font-weight="900">7 人 / 9,358</text><text x="24" y="126" fill="#df8c28" font-size="13" font-weight="800">含同日先后不确定</text></g>
      <path d="M354 77 h56 m-12 -12 l12 12 l-12 12" stroke="#65695f" stroke-width="3" fill="none"/>
      <g transform="translate(438 0)"><rect width="330" height="154" rx="24" fill="#fbfaf5" stroke="#0b6a50" stroke-width="3"/><text x="24" y="37" fill="#65695f" font-size="14">严格后续日入账</text><text x="24" y="94" fill="#0b6a50" font-size="43" font-weight="900">6 人 / 8,258</text><text x="24" y="126" fill="#65695f" font-size="13">另有 1,100 元同日不确定</text></g>
      <g transform="translate(796 0)"><rect width="328" height="154" rx="24" fill="#fbfaf5" stroke="#c9c5b8"/><text x="24" y="37" fill="#65695f" font-size="14">使用后买入</text><text x="24" y="94" fill="#171915" font-size="43" font-weight="900">6 人 / 2.37 万</text><text x="24" y="126" fill="#65695f" font-size="13">15 笔非钱包买入</text></g>
      <g transform="translate(1152 0)"><rect width="328" height="154" rx="24" fill="#fbfaf5" stroke="#c9c5b8"/><text x="24" y="37" fill="#65695f" font-size="14">会话代理强度</text><text x="24" y="94" fill="#171915" font-size="43" font-weight="900">44 次</text><text x="24" y="126" fill="#65695f" font-size="13">7 人 · 15 个活跃人日</text></g>
    </g>
    <g transform="translate(84 655)"><rect width="1434" height="165" rx="28" fill="#18231d"/><text x="28" y="35" fill="#c9f03e" font-size="12" font-weight="800" letter-spacing="3">SEVEN PATHS</text>
      <g font-size="12" fill="#d9dfd8"><text x="28" y="70">U01</text><text x="28" y="102">U02</text><text x="28" y="134">U03</text><text x="740" y="70">U04</text><text x="740" y="102">U05</text><text x="740" y="134">U06 / U07</text></g>
      <g stroke="#506057" stroke-width="2"><line x1="76" x2="680" y1="66" y2="66"/><line x1="76" x2="680" y1="98" y2="98"/><line x1="76" x2="680" y1="130" y2="130"/><line x1="810" x2="1394" y1="66" y2="66"/><line x1="810" x2="1394" y1="98" y2="98"/><line x1="810" x2="1394" y1="130" y2="130"/></g>
      <g fill="#c9f03e"><circle cx="122" cy="66" r="8"/><circle cx="127" cy="98" r="10"/><circle cx="130" cy="130" r="8"/><circle cx="852" cy="66" r="9"/><circle cx="856" cy="98" r="9"/><circle cx="860" cy="130" r="8"/></g>
      <g fill="#6daee2"><rect x="240" y="56" width="12" height="12" rx="3"/><rect x="345" y="88" width="12" height="12" rx="3"/><rect x="430" y="120" width="12" height="12" rx="3"/><rect x="1070" y="56" width="12" height="12" rx="3"/><rect x="1190" y="120" width="12" height="12" rx="3"/></g>
      <g fill="#f2a74f"><path d="M610 56 l8 8 l-8 8 l-8-8z"/><path d="M612 88 l8 8 l-8 8 l-8-8z"/><path d="M620 120 l8 8 l-8 8 l-8-8z"/><path d="M1310 56 l8 8 l-8 8 l-8-8z"/><path d="M1350 120 l8 8 l-8 8 l-8-8z"/></g>
    </g>
    <text x="84" y="861" fill="#777c73" font-size="13">数据截止 2026-09-05 22:33 · 资产快照 2026-09-04 · 公开脱敏版</text>
  </g>
</svg>
