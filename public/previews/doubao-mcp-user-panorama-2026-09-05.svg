      <rect x="840" y="744" width="180" height="34" rx="7" fill="#1b88ee" opacity=".64"/><text x="854" y="768" fill="#ffffff" font-size="19" font-weight="700">当前持仓 30</text>
      <rect x="840" y="788" width="130" height="34" rx="7" fill="#e08a2e"/><text x="854" y="812" fill="#ffffff" font-size="19" font-weight="700">新入金 18</text>
