<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">豆包上架盈米 MCP 首 9 日用户全景预览</title>
  <desc id="desc">浅色报告首屏：OAuth 与传统 Key 口径、绑定走势、开户绑卡入金漏斗与行为分析。</desc>
  <defs>
    <linearGradient id="pnbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7fa"/><stop offset="1" stop-color="#e5f2ff"/></linearGradient>
    <linearGradient id="pnbar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#1b88ee"/><stop offset="1" stop-color="#47a6ff"/></linearGradient>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#pnbg)"/>
  <circle cx="1480" cy="80" r="300" fill="#1b88ee" opacity=".08"/>
  <circle cx="60" cy="860" r="240" fill="#e08a2e" opacity=".10"/>
  <g font-family="Inter,PingFang SC,sans-serif">
