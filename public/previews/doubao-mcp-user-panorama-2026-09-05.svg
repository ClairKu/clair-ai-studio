        <rect x="200" y="732" width="48" height="76" rx="5"/>
        <rect x="270" y="732" width="48" height="76" rx="5"/>
        <rect x="340" y="668" width="48" height="140" rx="5"/>
        <rect x="410" y="672" width="48" height="136" rx="5"/>
        <rect x="480" y="702" width="48" height="106" rx="5"/>
        <rect x="550" y="718" width="48" height="90" rx="5"/>
        <rect x="620" y="648" width="48" height="160" rx="5"/>
        <rect x="690" y="730" width="48" height="78" rx="5"/>
