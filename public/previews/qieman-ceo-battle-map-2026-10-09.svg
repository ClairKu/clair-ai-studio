<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">且慢下一仗｜CEO 决策地图</title>
  <desc id="desc">未来半年只打三仗：首次计划、存量服务、富裕家庭</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102a41"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#d8fff8"/><stop offset=".25" stop-color="#46e0d1"/><stop offset="1" stop-color="#0c776f"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="250" fill="#46e0d1" opacity=".06"/>
  <text x="70" y="78" fill="#46e0d1" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="3">QIEMAN · CEO DECISION MAP</text>
  <text x="70" y="145" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="48" font-weight="800">先把存量客户经营深</text>
  <text x="70" y="205" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="48" font-weight="800">再<tspan fill="#46e0d1">买新增流量</tspan></text>
  <g transform="translate(70 280)">
    <rect width="300" height="240" rx="22" fill="#0c1a2c" stroke="#31506f"/>
    <text x="24" y="38" fill="#69a9ff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">增长顺序</text>
    <text x="24" y="83" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="800">70% 已有客户</text>
    <text x="24" y="116" fill="#93a5bd" font-family="Arial,'PingFang SC',sans-serif" font-size="16">先做好服务与经营结果</text>
    <path d="M24 145H276" stroke="#31506f"/>
    <text x="24" y="187" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="800">30% 外部渠道</text>
    <text x="24" y="220" fill="#93a5bd" font-family="Arial,'PingFang SC',sans-serif" font-size="16">先小规模验证，再决定加码</text>
  </g>
  <g transform="translate(430 282)">
    <circle cx="160" cy="120" r="100" fill="#46e0d1" opacity=".13" filter="url(#glow)"/>
    <circle cx="160" cy="120" r="76" fill="url(#orb)"/>
    <text x="160" y="113" fill="#05231f" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="31" font-weight="900">客户结果</text>
    <text x="160" y="143" fill="#05231f" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">有人负责 · 持续推进</text>
  </g>
  <g transform="translate(790 280)">
    <rect width="340" height="240" rx="22" fill="#0c1a2c" stroke="#31506f"/>
    <text x="24" y="38" fill="#f6c867" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">未来半年只打三仗</text>
    <text x="24" y="82" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="800">01  第一份计划</text>
    <text x="24" y="130" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="800">02  存量账户经营</text>
    <text x="24" y="178" fill="#eaf2ff" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="800">03  富裕家庭规划</text>
    <text x="24" y="218" fill="#93a5bd" font-family="Arial,'PingFang SC',sans-serif" font-size="15">三位负责人 · 一张结果表</text>
  </g>
  <g transform="translate(70 575)">
    <rect width="1060" height="2" fill="#31506f"/>
    <text y="45" fill="#93a5bd" font-family="Arial,'PingFang SC',sans-serif" font-size="17">近百名顾问编成 8–10 支服务队；90 天至少两场试点优于现状，否则缩减或停止。</text>
  </g>
</svg>
