<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI-Native 投顾工作台 V1.2 完整评审与优化方案</title>
  <desc id="desc">方向对了，生产闭环还没站稳。概念与体验方向 8.2 分，生产就绪度 3.1 分。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c49"/>
      <stop offset="0.58" stop-color="#194d72"/>
      <stop offset="1" stop-color="#228b89"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55c4b9"/>
      <stop offset="1" stop-color="#8ee2d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#061624" flood-opacity=".26"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#e9eff3"/>
  <rect x="28" y="28" width="1144" height="619" rx="32" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="1065" cy="70" r="210" fill="#fff" opacity=".06"/>
  <circle cx="640" cy="690" r="220" fill="#5ad3c4" opacity=".09"/>
  <g transform="translate(76 70)">
    <rect width="184" height="34" rx="17" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".22"/>
    <circle cx="20" cy="17" r="5" fill="#8ee2d7"/>
    <text x="34" y="22" fill="#e8f5f5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="1.5">PRODUCT REVIEW</text>
    <text y="112" fill="#fff" font-family="'Songti SC','STSong',serif" font-weight="700" font-size="56">AI-Native 投顾工作台 V1.2</text>
    <text y="176" fill="url(#accent)" font-family="'Songti SC','STSong',serif" font-weight="700" font-size="48">方向对了，生产闭环还没站稳</text>
    <text y="228" fill="#d1e0e8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19">完整分析 · 方案完善 · 优化建议 · 分阶段落地路线</text>
  </g>
  <g transform="translate(76 362)">
    <g>
      <rect width="250" height="154" rx="18" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/>
      <text x="22" y="36" fill="#d7e5eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">概念与体验方向</text>
      <text x="22" y="105" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="800">8.2</text>
      <text x="174" y="105" fill="#9fded6" font-family="sans-serif" font-size="22">/ 10</text>
    </g>
    <g transform="translate(270 0)">
      <rect width="250" height="154" rx="18" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/>
      <text x="22" y="36" fill="#d7e5eb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">生产就绪度</text>
      <text x="22" y="105" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="800">3.1</text>
      <text x="174" y="105" fill="#ffd39e" font-family="sans-serif" font-size="22">/ 10</text>
    </g>
  </g>
  <g transform="translate(635 345)">
    <rect width="461" height="191" rx="20" fill="#071827" opacity=".25" stroke="#fff" stroke-opacity=".15"/>
    <text x="26" y="39" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="17">建议：继续投入，但先收窄范围</text>
    <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15">
      <circle cx="31" cy="76" r="5" fill="#70d2c5"/><text x="47" y="82" fill="#dce9ee">保留任务 × 客户 × AI 的融合架构</text>
      <circle cx="31" cy="111" r="5" fill="#70d2c5"/><text x="47" y="117" fill="#dce9ee">V1.3 只做 3 条黄金服务闭环</text>
      <circle cx="31" cy="146" r="5" fill="#f4b45e"/><text x="47" y="152" fill="#dce9ee">重做数据真相、权限、证据与写回协议</text>
    </g>
  </g>
  <text x="76" y="594" fill="#aac2cf" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">Clair’s Studio · 2026-09-17 · 公开脱敏版</text>
</svg>
