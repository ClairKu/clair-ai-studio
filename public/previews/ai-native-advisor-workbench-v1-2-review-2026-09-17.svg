<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI-Native 投顾工作台 V1.2 DEMO 业务与产品体验评审</title>
  <desc id="desc">聚焦业务价值性、产品完整性、创新性与交互体验，综合评价 7.9 分。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172033"/><stop offset=".62" stop-color="#293e70"/><stop offset="1" stop-color="#3857d6"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee1c5"/><stop offset="1" stop-color="#b1c0ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#081123" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" fill="#eef1f7"/>
  <rect x="28" y="28" width="1144" height="619" rx="32" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="1065" cy="92" r="205" fill="#fff" opacity=".055"/><circle cx="710" cy="690" r="250" fill="#7ee1c5" opacity=".07"/>
  <g transform="translate(76 66)">
    <rect width="188" height="34" rx="17" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".2"/>
    <circle cx="20" cy="17" r="5" fill="#7ee1c5"/><text x="34" y="22" fill="#e8edf9" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="1.5">DEMO REVIEW</text>
    <text y="108" fill="#fff" font-family="'Songti SC','STSong',serif" font-weight="700" font-size="54">AI-Native 投顾工作台 V1.2</text>
    <text y="169" fill="url(#glow)" font-family="'Songti SC','STSong',serif" font-weight="700" font-size="44">从功能全景图，到服务价值证明</text>
    <text y="216" fill="#ced6e8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">业务价值性 · 产品完整性 · 创新性 · 交互体验</text>
  </g>
  <g transform="translate(76 344)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <g><rect width="224" height="142" rx="18" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".16"/><text x="20" y="34" fill="#d7dff0" font-size="14">业务价值性</text><text x="20" y="100" fill="#7ee1c5" font-size="57" font-weight="800">8.5</text><text x="150" y="100" fill="#aebad4" font-size="20">/ 10</text></g>
    <g transform="translate(242 0)"><rect width="224" height="142" rx="18" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".16"/><text x="20" y="34" fill="#d7dff0" font-size="14">产品完整性</text><text x="20" y="100" fill="#b1c0ff" font-size="57" font-weight="800">7.2</text><text x="150" y="100" fill="#aebad4" font-size="20">/ 10</text></g>
    <g transform="translate(484 0)"><rect width="224" height="142" rx="18" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".16"/><text x="20" y="34" fill="#d7dff0" font-size="14">创新性</text><text x="20" y="100" fill="#cfb5ff" font-size="57" font-weight="800">8.4</text><text x="150" y="100" fill="#aebad4" font-size="20">/ 10</text></g>
    <g transform="translate(726 0)"><rect width="224" height="142" rx="18" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".16"/><text x="20" y="34" fill="#d7dff0" font-size="14">交互体验</text><text x="20" y="100" fill="#ffc382" font-size="57" font-weight="800">7.5</text><text x="150" y="100" fill="#aebad4" font-size="20">/ 10</text></g>
  </g>
  <g transform="translate(76 526)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="950" height="57" rx="15" fill="#081326" opacity=".32"/><text x="22" y="35" fill="#fff" font-size="17" font-weight="700">结论：方向先进、覆盖完整；下一版不再加页面，把三条顾问服务链路做深、做完。</text></g>
  <text x="76" y="614" fill="#aebad0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">Clair’s Studio · DEMO 产品评审 · 公开脱敏版</text>
</svg>
