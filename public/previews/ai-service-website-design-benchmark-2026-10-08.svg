<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">金融 AI 开放平台官网设计竞品研究</title>
  <desc id="desc">对标海内外 13 个金融数据、金融 AI 与开放平台，输出可信金融智能官网和运营闭环蓝图。</desc>
  <defs>
    <radialGradient id="mintGlow" cx="78%" cy="18%" r="62%"><stop stop-color="#2ec4b6" stop-opacity=".32"/><stop offset="1" stop-color="#2ec4b6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00101f" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="675" fill="#071b33"/>
  <rect width="1200" height="675" fill="url(#mintGlow)"/>
  <g opacity=".09" fill="none" stroke="#fff">
    <circle cx="1100" cy="72" r="250"/><circle cx="1100" cy="72" r="330"/><circle cx="1100" cy="72" r="410"/>
  </g>
  <g transform="translate(72 58)">
    <circle cx="22" cy="22" r="21" fill="none" stroke="#2ec4b6"/>
    <text x="22" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#75e0d2">F</text>
    <text x="58" y="19" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#fff">金融 AI 开放平台官网设计</text>
    <text x="58" y="40" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.2" fill="#8fa6bb">FINANCIAL INTELLIGENCE × OPEN PLATFORM</text>
  </g>
  <g transform="translate(72 165)">
    <text font-family="Georgia, 'Songti SC', serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#fff">
      <tspan x="0" y="0">别再做通用 AI 官网。</tspan>
      <tspan x="0" y="72">要做</tspan><tspan fill="#75e0d2">可信金融智能入口</tspan>
    </text>
    <text y="126" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#b5c4d2">13 个金融平台 · 4 类竞品 · 14 张页面蓝图 · 22 条官方证据</text>
  </g>
  <g transform="translate(72 386)" filter="url(#shadow)">
    <rect width="684" height="184" fill="#fff"/>
    <rect width="684" height="46" fill="#102d4e"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#80ded2">TRUSTED FINANCIAL INTELLIGENCE</text>
    <text x="520" y="29" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" fill="#fff">申请试用 →</text>
    <text x="24" y="85" font-family="Georgia, 'Songti SC', serif" font-size="25" font-weight="700" fill="#071b33">数据 → Skills / MCP → Agent → 金融工作流</text>
    <g transform="translate(24 112)" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">
      <rect width="138" height="40" fill="#eef3f4"/><text x="14" y="17" fill="#53697d">权威数据与研究</text><text x="14" y="31" fill="#071b33" font-weight="700">来源 · 口径 · 权益</text>
      <rect x="148" width="150" height="40" fill="#dff5f1"/><text x="162" y="17" fill="#53697d">开放能力</text><text x="162" y="31" fill="#071b33" font-weight="700">MCP · Skill · API</text>
      <rect x="308" width="145" height="40" fill="#eef3f4"/><text x="322" y="17" fill="#53697d">场景 Agent</text><text x="322" y="31" fill="#071b33" font-weight="700">研究 · 投顾 · 风控</text>
      <rect x="463" width="190" height="40" fill="#fff0e8"/><text x="477" y="17" fill="#53697d">可审计成果</text><text x="477" y="31" fill="#071b33" font-weight="700">报告 · 模型 · 组合 · 预警</text>
    </g>
  </g>
  <g transform="translate(800 386)">
    <rect width="328" height="184" fill="#2ec4b6"/>
    <text x="27" y="53" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#071b33">13 × 4 × 14</text>
    <line x1="28" x2="298" y1="74" y2="74" stroke="#071b33" opacity=".25"/>
    <text x="28" y="105" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#071b33">平台 × 竞品类型 × 核心页面</text>
    <text x="28" y="137" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#071b33">不是换一批 Logo，</text>
    <text x="28" y="158" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#071b33">是重建金融可信成交链路。</text>
  </g>
  <text x="72" y="625" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.7" fill="#7890a6">CLAIR'S STUDIO · RESEARCH DATE 2026-10-08</text>
</svg>
