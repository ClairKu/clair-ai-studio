<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 开放平台 8·3 项目汇报（十项框架版）预览</title>
  <desc id="desc">按飞书 revision 1934 十项大纲生成：申请用户 8,569（85.7%）、月活 1,812（90.6%）、累计调用 9,194,916（70.7%）、AI 实验室 0%；含千问与微信双入口、九平台三层货架矩阵与四类问题回顾。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#eae6f8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7058d8"/><stop offset="1" stop-color="#a58df7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a32"/><stop offset="1" stop-color="#263151"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#342568" flood-opacity=".12"/></filter>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#171a2a}.serif{font-family:"Songti SC",STSong,SimSun,serif}.eyebrow{font-size:9px;font-weight:800;letter-spacing:1.5px;fill:#735bd8}.title{font-size:24px;font-weight:800}.sub{font-size:9px;fill:#687287}.card{font-size:11px;font-weight:750}.metric{font-size:19px;font-weight:800;fill:#735bd8}.label{font-size:9px;fill:#687287}.white{fill:#fff}.pale{fill:#cfd6f2}.warn{fill:#c0783a;font-size:19px;font-weight:800}</style>
  </defs>
  <rect width="720" height="405" rx="28" fill="url(#bg)"/>
  <text x="28" y="30" class="eyebrow">YINGMI AI OPEN PLATFORM · OAP PROJECT REPORT</text>
  <text x="28" y="60" class="title serif">盈米 AI 开放平台｜8·3 汇报</text>
  <text x="28" y="79" class="sub">飞书 revision 1934 十项框架：年度目标 · 关键举措 · 用户增长 · 新流量入口 · 产品规划 · 能力建设 · AI 实验室 · 商化准备 · 行业机会 · 问题回顾</text>
  <rect x="28" y="96" width="156" height="88" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="44" y="122" class="label">申请用户 / 目标 1 万</text>
  <text x="44" y="149" class="metric">8,569</text>
  <text x="44" y="168" class="label">复算完成度 85.69%</text>
  <rect x="198" y="96" width="156" height="88" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="214" y="122" class="label">月活用户 / 目标 2 千</text>
  <text x="214" y="149" class="metric">1,812</text>
  <text x="214" y="168" class="label">复算完成度 90.60%</text>
  <rect x="368" y="96" width="156" height="88" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="384" y="122" class="label">累计调用 / 目标 1300 万</text>
  <text x="384" y="149" class="metric">9,194,916</text>
  <text x="384" y="168" class="label">复算完成度 70.73%</text>
  <rect x="538" y="96" width="154" height="88" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="554" y="122" class="label">AI 实验室经营指标</text>
  <text x="554" y="149" class="warn">0%</text>
  <text x="554" y="168" class="label">实际值待补</text>
  <rect x="28" y="202" width="320" height="82" rx="14" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="44" y="228" class="card white">新流量入口 · 千问首次切入超级入口</text>
  <text x="44" y="248" class="label pale">A2A 入围首批第三方品牌智能体</text>
  <text x="44" y="266" class="label pale">新用户获取 到 AI 服务 到 外链完成交易</text>
  <rect x="364" y="202" width="328" height="82" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="380" y="228" class="card">新流量入口 · 微信小程序承接</text>
  <text x="380" y="248" class="label">累计用户 8 万+ · 日均 6,000+ 用户</text>
  <text x="380" y="266" class="label">近 7 日日活 1.37 万，达小微首批试点资质</text>
  <rect x="28" y="300" width="320" height="76" rx="14" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="44" y="326" class="card white">九平台三层货架 · MCP 已满覆盖</text>
  <text x="44" y="346" class="label pale">MCP 9/9 · Skills 2/9 · Agent 2/9</text>
  <text x="44" y="364" class="label pale">支付宝邀测中 · 百炼 one key MCP 待上架</text>
  <rect x="364" y="300" width="328" height="76" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="380" y="326" class="card">向内看 · 四类问题制约节奏</text>
  <text x="380" y="346" class="label">技术协议更迭 · 复合人选难招</text>
  <text x="380" y="364" class="label">MCP 质量与机构承接 · 数据采购评估</text>
</svg>
