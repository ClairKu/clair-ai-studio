<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800">
  <title>且慢财富顾问服务总产品蓝图 A：一位客户，AI与真人接力的不断线服务</title>
  <defs>
    <style>
      text{font-family:"PingFang SC","Heiti SC","Microsoft YaHei",sans-serif;fill:#1F2A44}
      .b{font-weight:700}
      .m{fill:#5C6478}
      .w{fill:#FFFFFF}
      .c{text-anchor:middle}
      .e{text-anchor:end}
    </style>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34449A"/></marker>
    <marker id="aGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6D12"/></marker>
    <marker id="aPlum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4C8A"/></marker>
  </defs>

  <rect width="3200" height="1800" fill="#F6F3EC"/>

  <!-- 标题区 -->
  <g id="header">
    <text x="120" y="92" font-size="34" class="m">且慢 · 财富顾问服务总产品蓝图 · 方案A「服务现场」</text>
    <text x="120" y="176" font-size="68" class="b">一位客户，AI与真人接力的不断线服务</text>
    <text x="3080" y="120" font-size="32" class="e m">AI与真人共用一本服务台账、一套标准服务包</text>
    <text x="3080" y="172" font-size="32" class="e m">L3把方法验证成资产，按场景开放给小顾4.0与Lodestar</text>
  </g>

  <!-- 业务总域（包含关系） -->
  <g id="domain">
    <rect x="620" y="236" width="1960" height="1264" rx="36" fill="none" stroke="#1F2A44" stroke-width="3"/>
    <rect x="640" y="258" width="380" height="60" fill="#F6F3EC"/>
    <text x="660" y="300" font-size="34" class="b">客户服务 · 业务总域</text>
    <rect x="1240" y="262" width="400" height="52" rx="26" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
    <text x="1440" y="299" font-size="30" class="c">私域 ＝ 渠道与关系方式</text>
    <rect x="1660" y="262" width="400" height="52" rx="26" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
    <text x="1860" y="299" font-size="30" class="c">VIP ＝ 服务权益与深度</text>
    <rect x="2080" y="262" width="440" height="52" rx="26" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
    <text x="2300" y="299" font-size="30" class="c">顾问运营 ＝ 组织与运营职能</text>
  </g>

  <!-- 客户价值 -->
  <g id="customer">
    <rect x="700" y="350" width="1800" height="190" rx="95" fill="#1F2A44"/>
    <text x="1600" y="428" font-size="46" class="b c w">客户价值：被持续理解，承诺有回音</text>
    <text x="1600" y="494" font-size="32" class="c w" opacity="0.88">随时可问 · 主动提醒 · 专业判断有人负责 · 交付与复检可追溯</text>
  </g>
  <line x1="1080" y1="616" x2="1080" y2="550" stroke="#1F2A44" stroke-width="6" marker-end="url(#aInk)"/>
  <line x1="2120" y1="616" x2="2120" y2="550" stroke="#1F2A44" stroke-width="6" marker-end="url(#aInk)"/>

  <!-- AI小顾 4.0 -->
  <g id="xiaogu">
    <rect x="700" y="620" width="760" height="370" rx="28" fill="#E3F2F1" stroke="#138A8A" stroke-width="4"/>
    <rect x="740" y="650" width="300" height="50" rx="25" fill="#138A8A"/>
    <text x="890" y="686" font-size="30" class="c w">已有产品 · 升级4.0</text>
    <text x="740" y="775" font-size="60" class="b" style="fill:#0E6B6B">AI小顾 4.0</text>
    <text x="1070" y="772" font-size="34" class="m">客户侧AI服务</text>
    <text x="740" y="840" font-size="32">持续服务 · 长期服务状态</text>
    <text x="740" y="890" font-size="32">跨AI与真人的服务接续与协同</text>
    <text x="740" y="950" font-size="30" class="m">延续3.0方向：工厂化 · 记忆 · 主动服务</text>
  </g>

  <!-- 服务接续 -->
  <g id="handoff">
    <line x1="1478" y1="800" x2="1722" y2="800" stroke="#1F2A44" stroke-width="6" marker-start="url(#aInk)" marker-end="url(#aInk)"/>
    <text x="1600" y="768" font-size="34" class="b c">服务接续</text>
    <text x="1600" y="850" font-size="30" class="c m">同一服务状态</text>
    <text x="1600" y="890" font-size="30" class="c m">不断线</text>
  </g>

  <!-- Lodestar -->
  <g id="lodestar">
    <rect x="1740" y="620" width="760" height="370" rx="28" fill="#FBEBDD" stroke="#B8661E" stroke-width="4"/>
    <rect x="1780" y="650" width="180" height="50" rx="25" fill="#B8661E"/>
    <text x="1870" y="686" font-size="30" class="c w">新建产品</text>
    <text x="1780" y="775" font-size="60" class="b" style="fill:#8A4A12">Lodestar</text>
    <text x="2100" y="772" font-size="34" class="m">真人顾问专业工作台</text>
    <text x="1780" y="840" font-size="32">理解客户 · 服务队列 · 专业分析判断</text>
    <text x="1780" y="890" font-size="32">交付与持续跟进</text>
    <text x="1780" y="950" font-size="30" class="m">AI准备与辅助，顾问承担专业判断责任</text>
  </g>

  <!-- 共用服务底座 -->
  <g id="foundation">
    <line x1="1080" y1="1046" x2="1080" y2="996" stroke="#34449A" stroke-width="6" marker-end="url(#aBlue)"/>
    <line x1="2120" y1="1046" x2="2120" y2="996" stroke="#34449A" stroke-width="6" marker-end="url(#aBlue)"/>
    <text x="1110" y="1032" font-size="30" style="fill:#34449A">按场景供给</text>
    <text x="2150" y="1032" font-size="30" style="fill:#34449A">按场景供给</text>

    <rect x="700" y="1050" width="1800" height="400" rx="28" fill="#E6E8F5" stroke="#34449A" stroke-width="3"/>
    <text x="740" y="1104" font-size="36" class="b" style="fill:#34449A">共用服务底座 · AI小顾、真人顾问、Lodestar同用</text>

    <!-- 标准服务包 -->
    <rect x="730" y="1130" width="420" height="290" rx="20" fill="#FFFFFF" stroke="#34449A" stroke-width="2"/>
    <text x="760" y="1190" font-size="40" class="b">标准服务包</text>
    <text x="760" y="1245" font-size="30">可版本化的方法 · 知识</text>
    <text x="760" y="1290" font-size="30">工具 · 责任 · 质量规范</text>
    <rect x="760" y="1352" width="260" height="46" rx="23" fill="#34449A"/>
    <text x="890" y="1386" font-size="30" class="c w">三方复用同一包</text>

    <!-- 统一客户服务台账 -->
    <rect x="1180" y="1130" width="620" height="290" rx="20" fill="#FFFFFF" stroke="#1F2A44" stroke-width="5"/>
    <text x="1210" y="1192" font-size="42" class="b">统一客户服务台账</text>
    <text x="1210" y="1245" font-size="30">引用：原系统权威事实（不搬源库）</text>
    <text x="1210" y="1290" font-size="30">持久保存：目标诉求 · 约定 · 责任</text>
    <text x="1210" y="1332" font-size="30">计划 · 交付 · 回执 · 复检</text>
    <rect x="1210" y="1352" width="400" height="46" rx="23" fill="#1F2A44"/>
    <text x="1410" y="1386" font-size="30" class="c w">全域只维护一套服务主状态</text>

    <!-- 证据化洞察（慧客通） -->
    <rect x="1830" y="1130" width="320" height="290" rx="20" fill="#FFFFFF" stroke="#34449A" stroke-width="2"/>
    <text x="1855" y="1190" font-size="36" class="b">证据化洞察</text>
    <text x="1855" y="1240" font-size="30">与服务准备</text>
    <text x="1855" y="1290" font-size="30" class="m">已有基础：洞察</text>
    <text x="1855" y="1332" font-size="30" class="m">批量作业 · 质量</text>
    <rect x="1845" y="1352" width="290" height="46" rx="23" fill="#34449A"/>
    <text x="1990" y="1386" font-size="30" class="c w">慧客通 · 升级整合</text>

    <!-- 关系与私域（SCRM） -->
    <rect x="2180" y="1130" width="290" height="290" rx="20" fill="#FFFFFF" stroke="#34449A" stroke-width="2"/>
    <text x="2200" y="1190" font-size="34" class="b">客户关系与私域</text>
    <text x="2200" y="1240" font-size="30">服务过程</text>
    <text x="2200" y="1285" font-size="30">沟通留痕</text>
    <text x="2200" y="1332" font-size="30" class="m">保留已有业务深度</text>
    <rect x="2190" y="1352" width="270" height="46" rx="23" fill="#34449A"/>
    <text x="2325" y="1386" font-size="30" class="c w">SCRM · 升级整合</text>
  </g>

  <!-- L3 建设与验证项目 -->
  <g id="l3">
    <rect x="120" y="350" width="450" height="1100" rx="28" fill="#FFF8E1" stroke="#8A6D12" stroke-width="4" stroke-dasharray="18 12"/>
    <rect x="150" y="380" width="390" height="50" rx="25" fill="#8A6D12"/>
    <text x="345" y="416" font-size="30" class="c w">建设与验证项目</text>
    <text x="150" y="500" font-size="42" class="b">智能顾问运营</text>
    <text x="150" y="600" font-size="96" class="b" style="fill:#8A6D12">L3</text>
    <text x="150" y="660" font-size="30">把顾问运营做实、</text>
    <text x="150" y="702" font-size="30">验证到真正可用：</text>
    <text x="150" y="760" font-size="32">① 服务方法</text>
    <text x="150" y="808" font-size="32">② 工具流程</text>
    <text x="150" y="856" font-size="32">③ 标准服务包</text>
    <text x="150" y="904" font-size="32">④ 质量评测</text>
    <text x="150" y="970" font-size="30" class="b" style="fill:#8A6D12">→ 沉淀为共用资产</text>
    <text x="150" y="1030" font-size="30" class="m">逐场景验证、开放：</text>
    <rect x="150" y="1050" width="44" height="44" rx="8" fill="#8A6D12"/>
    <rect x="210" y="1050" width="44" height="44" rx="8" fill="#8A6D12"/>
    <rect x="270" y="1050" width="44" height="44" rx="8" fill="#8A6D12"/>
    <rect x="330" y="1050" width="44" height="44" rx="8" fill="none" stroke="#8A6D12" stroke-width="3"/>
    <rect x="390" y="1050" width="44" height="44" rx="8" fill="none" stroke="#8A6D12" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="150" y="1160" font-size="30">小顾升级的</text>
    <text x="150" y="1202" font-size="30">关键前提输入之一</text>
    <text x="150" y="1300" font-size="30" class="m">并行建设，</text>
    <text x="150" y="1342" font-size="30" class="m">非全量串行</text>
    <text x="150" y="1410" font-size="30" class="m">隶属顾问运营职能</text>
  </g>
  <line x1="572" y1="800" x2="694" y2="800" stroke="#8A6D12" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#aGold)"/>
  <text x="634" y="780" font-size="30" class="b c" style="fill:#8A6D12">前提输入</text>
  <line x1="572" y1="1280" x2="724" y2="1280" stroke="#8A6D12" stroke-width="6" marker-end="url(#aGold)"/>
  <text x="648" y="1262" font-size="30" class="b c" style="fill:#8A6D12">沉淀</text>

  <!-- YINGWORK -->
  <g id="yingwork">
    <rect x="2630" y="350" width="450" height="1100" rx="28" fill="#EFE8F5" stroke="#6B4C8A" stroke-width="4"/>
    <rect x="2660" y="380" width="390" height="50" rx="25" fill="#6B4C8A"/>
    <text x="2855" y="416" font-size="30" class="c w">独立平台 · 并列协同</text>
    <text x="2660" y="520" font-size="52" class="b" style="fill:#4E3470">YINGWORK</text>
    <text x="2660" y="580" font-size="34">员工AI生产力平台</text>
    <text x="2660" y="660" font-size="30" class="m">与Lodestar并列协同</text>
    <text x="2660" y="702" font-size="30" class="m">非上级、非子产品</text>
    <text x="2660" y="744" font-size="30" class="m">非必需宿主</text>
    <text x="2660" y="860" font-size="32" class="b" style="fill:#4E3470">按需共用</text>
    <text x="2660" y="915" font-size="30">· 技术供给</text>
    <text x="2660" y="960" font-size="30">· 受控工具</text>
    <text x="2660" y="1005" font-size="30">· 任务引用与成果</text>
    <text x="2660" y="1400" font-size="30" class="m">共用平台技术供给 ↓</text>
  </g>
  <line x1="2508" y1="800" x2="2622" y2="800" stroke="#6B4C8A" stroke-width="5" marker-start="url(#aPlum)" marker-end="url(#aPlum)"/>
  <text x="2565" y="772" font-size="30" class="b c" style="fill:#6B4C8A">按需协同</text>

  <!-- 平台供给 -->
  <line x1="1600" y1="1516" x2="1600" y2="1458" stroke="#8C877C" stroke-width="5" marker-end="url(#aInk)"/>
  <rect x="120" y="1520" width="2960" height="84" rx="42" fill="#ECE8DF" stroke="#A39E92" stroke-width="2"/>
  <text x="1600" y="1574" font-size="32" class="c">平台供给（极简，详见附图）：企业AI · 专业知识计算 · 业务数据 · 渠道治理</text>

  <!-- 图例 -->
  <g id="legend">
    <text x="120" y="1712" font-size="30" class="b">图例</text>
    <line x1="220" y1="1702" x2="300" y2="1702" stroke="#1F2A44" stroke-width="5" marker-end="url(#aInk)"/>
    <text x="320" y="1712" font-size="30">供给 / 消费</text>
    <line x1="560" y1="1702" x2="640" y2="1702" stroke="#1F2A44" stroke-width="5" marker-start="url(#aInk)" marker-end="url(#aInk)"/>
    <text x="660" y="1712" font-size="30">协同 · 接续</text>
    <rect x="900" y="1680" width="80" height="44" rx="8" fill="#FFF8E1" stroke="#8A6D12" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="1000" y="1712" font-size="30">建设与验证项目</text>
    <rect x="1250" y="1680" width="80" height="44" rx="8" fill="none" stroke="#1F2A44" stroke-width="2"/>
    <text x="1350" y="1712" font-size="30">包含（业务域）</text>
    <rect x="1620" y="1680" width="190" height="44" rx="22" fill="#138A8A"/>
    <text x="1715" y="1712" font-size="30" class="c w">已有·升级</text>
    <rect x="1830" y="1680" width="120" height="44" rx="22" fill="#B8661E"/>
    <text x="1890" y="1712" font-size="30" class="c w">新建</text>
    <rect x="1970" y="1680" width="190" height="44" rx="22" fill="#6B4C8A"/>
    <text x="2065" y="1712" font-size="30" class="c w">独立并列</text>
    <text x="3080" y="1712" font-size="30" class="e m">客户流程、技术架构、接口清单见附图</text>
  </g>
</svg>
