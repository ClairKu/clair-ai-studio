<script id="card-copy" type="application/json">{"mcp-getFundCampisiIndicator":{"description_plain":"把债券基金的收益拆开，看看收益主要来自哪里。","input_brief":"基金代码、统计区间","output_brief":"收入效应、国债效应、利差效应、券种选择效应、超额回报"},"mcp-GetStrategyAssetClassAnalysis":{"description_plain":"查看投顾策略底层有哪些大类资产，以及每类资产的金额和占比","input_brief":"策略代码","output_brief":"资产类别、资产金额、配置占比、细分类别"},"mcp-getFundBenchmarkInfo":{"description_plain":"查看基金约定的业绩比较基准，明确基金收益的比较对象","input_brief":"基金代码","output_brief":"业绩比较基准"},"mcp-getBondAllocationByFundCode":{"description_plain":"查看债券基金持有什么券种，以及各类债券的配置比例","input_brief":"基金代码列表、统计区间、资产占比口径","output_brief":"各券种占比、利率债占比、信用债占比、报告期"},"mcp-getFundTurnoverRate":{"description_plain":"查看基金在指定时间内的换手率，了解持仓调整频率","input_brief":"基金代码、统计区间","output_brief":"基金代码、统计区间、换手率"},"mcp-getFundIndustryPreference":{"description_plain":"查看一只或多只基金的行业偏好，了解偏向哪些行业","input_brief":"基金代码列表、统计区间","output_brief":"基金代码、行业偏好、统计区间"},"mcp-SearchFunds":{"description_plain":"按名称、分类和交易状态筛选基金，并按所需指标排序","input_brief":"名称关键词、交易状态、基金分类、排序方式、分页设置","output_brief":"基金代码、基金名称、投资类型、基金状态、收益率"},"mcp-GetFundRelatedStrategies":{"description_plain":"查找持有指定基金的投顾策略，以及各策略的持仓比例","input_brief":"基金代码、基金名称","output_brief":"相关策略代码、策略名称、持仓占比"},"mcp-getBondIndicator":{"description_plain":"查看债券基金的久期、杠杆和持仓集中度等风险指标","input_brief":"基金代码、统计区间","output_brief":"杠杆水平、敏感性久期、债券持仓集中度"},"mcp-BatchGetStrategiesComposition":{"description_plain":"一次查询多个投顾策略的持仓基金、配置权重和替代基金","input_brief":"策略代码列表","output_brief":"持仓基金、配置权重、基金分类、替代基金"},"mcp-getFundIndustryReturns":{"description_plain":"查看基金在不同行业的收益与贡献，找出基金的收益来源","input_brief":"基金代码、统计区间","output_brief":"行业名称、绝对收益、相对收益、收益率、收益得分"},"mcp-filterStockFundByStockTurnover":{"description_plain":"按股票换手率的高低筛选基金，查找调仓频率符合条件的产品","input_brief":"换手率阈值、比较条件、统计区间、报告期、结果条数","output_brief":"基金代码、基金名称、股票换手率"},"mcp-GetPopularFund":{"description_plain":"按基金详情页近期打开人数排序，找出当前关注度较高的基金","input_brief":"统计天数、返回条数","output_brief":"热门基金列表、详情页打开人数、收益率、最大回撤、详情链接"},"mcp-BatchGetPoTradeComposition":{"description_plain":"查询投顾策略可交易的成分基金、买入权重和替代基金","inp 的配置比例，支持按时间区间查询","input_brief":"基金代码、统计区间","output_brief":"行业名称、行业代码、配置比例、统计区间"},"mcp-GetFundDiagnosis":{"description_plain":"汇总一只基金的诊断结论、最新净值、业绩与持仓配置信息","input_brief":"基金代码","output_brief":"基金诊断结论、最新净值、业绩表现、行业占比、资产配置"},"mcp-getBondFundCreditRatingLevel":{"description_plain":"查看债券基金不同信用评级的持仓占比，了解评级结构","input_brief":"基金代码列表、统计区间、评级类型","output_brief":"信用评级类别、总资产占比、净资产占比、债券市值占比"},"mcp-getBondFundWithAlertRecord":{"description_plain":"按净值跳水或异动告警筛选债券基金，查看发生日期和幅度","input_brief":"告警类型、跳水阈值、结果条数","output_brief":"基金代码、基金名称、告警类型、发生日期、跳水幅度"},"mcp-filterBondFundByBondType":{"description_plain":"按指定券种的配置比例筛选债券基金，找出符合条件的产品","input_brief":"券种类型、占比阈值、比较条件、统计区间、占比口径","output_brief":"基金代码、基金名称、券种配置占比"},"mcp-fund-equity-position":{"description_plain":"查看基金的权益资产占比和仓位等级，了解权益配置高低","input_brief":"基金代码","output_brief":"权益仓位、权益仓位等级"},"mcp-fund-recovery-ability":{"description_plain":"查看基金回撤后的修复能力等级，以及相应的排名描述","input_brief":"基金代码","output_brief":"修复能力等级、排名描述"},"mcp-BatchGetFundsDetail":{"description_plain":"批量查看基金基本信息、基金经理、持仓配置和交易限制","input_brief":"基金代码列表","output_brief":"基本信息、基金经理、资产配置、行业占比、交易限制"},"mcp-filterBondFundByCreditRating":{"description_plain":"按指定信用评级的持仓占比筛选债券基金，找到符合条件的产品","input_brief":"评级类型、占比阈值、比较条件、统计区间、占比口径","output_brief":"基金代码、基金名称、评级持仓占比"},"mcp-getFundBrinsonIndicator":{"description_plain":"用Brinson归因拆分基金超额收益，区分行业配置和选股贡献","input_brief":"基金代码、统计区间","output_brief":"行业配置收益、选股收益、总超额收益"},"mcp-BatchGetFundsSplitHistory":{"description_plain":"批量查询基金历史拆分日期和拆分比例，核对份额折算记录","input_brief":"基金代码列表","output_brief":"基金代码、拆分日期、拆分比例"},"mcp-getQdFundAreaAllocation":{"description_plain":"查看QDII基金在不同地区的资产分布和配置占比","input_brief":"基金代码列表、统计区间、地区编码","output_brief":"地区名称、地区编码、总资产占比、净资产占比"},"mcp-AnalyzeFundRisk":{"description_plain":"评估一只或多只基金的风险程度，返回风险评分和评分生效日期","input_brief":"基金代码列表","output_brief":"风险评分、拟合优度、残差方差、标准误差、生效日期"},"mcp-GetFundsBackTest":{"description_plain":"按基金持仓金额回测历史表现，查看收益、回撤和波动情况","input_brief":"基金代码、基金名称、持仓金额","output_brief":"年化收益率、最大回撤、收益曲线、波动率、夏普比率"},"mcp-MonteCarloSimulate":{" ":"顾问交付与运营","subcategory":"","inputs":"配置对象及报告用途；可投资金额（剔除应急金等）；有效风险测评及日期；每笔资金的目标与期限；流动性和损失承受能力；禁投资产、集中度及现有候选。","outputs":"单目标/多目标资产权重与金额；配置理由和约束；按需展开复合模型、基金实施参考或现有方案偏离复核；MD/HTML/PDF。","source_url":"https://qieman.com/mcp/skill-detail/advisor-allocation","official_name":"advisor-allocation","description":"将已确认的客户目标、期限、流动性和风险约束转成可解释的资产配置方案。","scenes":["investment-planning"],"fields":[],"out_fields":[],"input_summary":"可投资金额、目标、资金期限、流动性、风险约束及现有方案。","output_summary":"资产配置比例和金额、配置理由，以及基金或策略实施参考。","website_order":0,"classification_paths":["投资规划与组合管理 / 投资方案生成与评估"]},{"uid":"skill-advisor-client-insights","layer":"Skills","name":"顾问客户洞察","english":"advisor-client-insights","category":"顾问交付与运营","subcategory":"","inputs":"分析对象与服务目的；资料范围、截至日期及授权范围；客户别名或去标识化ID；当前希望解决的服务问题；相关客户原话、问卷、顾问纪要或已授权事实。","outputs":"单客3–5个服务议题、备访问题与待办；批量需求分组及服务优先级；证据记录含statement/status/source/as_of/confidence/review_trigger；MD/HTML/PDF。","source_url":"https://qieman.com/mcp/skill-detail/advisor-client-insights","official_name":"advisor-client-insights","description":"基于客户已授权资料，形成可溯源的单客洞察、备访简报或服务需求分群。","scenes":["market-information"],"fields":[],"out_fields":[],"input_summary":"客户授权资料、服务目的、信息日期，以及当前要解决的问题。","output_summary":"单客洞察、备访问题、服务需求分群与证据记录","website_order":1,"classification_paths":["市场资讯与内容 / 顾问交付与运营"]},{"uid":"skill-advisor-product-communication","layer":"Skills","name":"顾问产品沟通","english":"advisor-product-communication","category":"顾问交付与运营","subcategory":"","inputs":"已确定基金代码或策略代码（名称需先消歧）；费率、规则、风险收益或沟通问题；受众与渠道；定向适配任务还需风险测评、期限、流动性、目标和损失承受能力。","outputs":"带官方名称和代码的产品说明；费率/限额/确认到账规则表；FAQ、顾问提纲、同口径比较、企微或电话话术；MD/HTML/PDF。","source_url":"https://qieman.com/mcp/skill-detail/advisor-product-communication","official_name":"advisor-product-communication","description":"围绕已确定基金或投顾策略，生成事实核验后的产品说明、FAQ与客户沟通材料。","scenes":["market-information","trade-service"],"fields":[],"out_fields":[],"input_summary":"已确定的基金或策略、沟通问题、目标受众和表达渠道。","output_summary":"产品说明、费率规则表、常见问题，以及顾问沟通提纲或话术。","website_order":2,"classification_paths"  * Create a genuine, offline XLSX package for the catalog's current result set.

function createCatalogXlsx(rows) {
  'use strict';
  const headers = ['业务分类', '子类', '能力类型', '中文名称', '英文名称', '一句话描述', 'IN', 'OUT'];
  const widths = [22, 23, 12, 25, 38, 48, 52, 52];
  const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const relNs = 'http://schemas.openxmlformats.org/package/2006/relationships';

  const declaration = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  if (!Array.isArray(rows)) throw new TypeError('Excel 导出数据必须是二维数组。');
  if (rows.length > 1048575) throw new RangeError('Excel 导出最多支持 1,048,575 条数据及一行表头。');

  function cleanScalars(value) {
    let result = '';
    for (const char of value) {
      const cp = char.codePointAt(0);
      const valid = cp === 9 || cp === 10 || cp === 13 ||
        (cp >= 0x20 && cp <= 0xD7FF) ||
        (cp >= 0xE000 && cp <= 0xFFFD) ||
        (cp >= 0x10000 && cp <= 0x10FFFF);
      result += valid ? char : '\uFFFD';

    // Xstring escapes apply before XML escaping, and CR must use its Excel escape.
    return value
      .replace(/_(?=x[0-9a-fA-F]{4}_)/g, '_x005F_')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;')
      .replace(/\r/g, '_x000D_');
  }

  function lineCount(value, columnWidth) {

    return value.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').reduce((sum, line) => {
      let units = 0;
      for (const char of line) units += char.codePointAt(0) > 0xFF ? 2 : 1;
      return sum + Math.max(1, Math.ceil(units / Math.max(1, columnWidth - 2)));

  const sheetXml = declaration + `<worksheet xmlns="${ns}">` +
    `<dimension ref="${range}"/>` +

    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
    '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/>' +
    '</sheetView></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="18"/>' +
    '<cols>' + widths.map((width, i) => `<col min="${i + 1}" max="${i + 1}" width="${width}" customWidth="1"/>`).join('') + '</cols>' +
    '<sheetData>' + makeRow(headers, 1, true) + data.map((row, i) => makeRow(row, i + 2, false)).join('') + '</sheetData>' +
    `<autoFilter ref="${range}"/>` +
    '<pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/>' +
    '</worksheet>';

  const stylesXml = declaration + `<styleSheet xmlns="${ns}">` +
    '<fonts count="2">' +
    '<font><sz val="11"/><color rgb="FF334155"/><name val="宋体"/><family val="1"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="宋体"/><family val="1"/></font>' +
    '</fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFF05A28"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +

    '</styleSheet>';

      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
      '</Types>'],
    ['_rels/.rels', declaration + `<Relationships xmlns="${relNs}">` +
      `<Relationship Id="rId1" Type="${officeRel}officeDocument" Target="xl/workbook.xml"/>` +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
      `<Relationship Id="rId3" Type="${officeRel}extended-properties" Target="docProps/app.xml"/>` +
      '</Relationships>'],
    ['xl/workbook.xml', declaration + `<workbook xmlns="${ns}" xmlns:r="${officeRel.slice(0, -1)}">` +
      '<bookViews><workbookView/></bookViews><sheets><sheet name="AI能力清单" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', declaration + `<Relationships xmlns="${relNs}">` +
      `<Relationship Id="rId1" Type="${officeRel}worksheet" Target="worksheets/sheet1.xml"/>` +
      `<Relationship Id="rId2" Type="${officeRel}styles" Target="styles.xml"/>` +
      '</Relationships>'],
    ['xl/worksheets/sheet1.xml', sheetXml],
    ['xl/styles.xml', stylesXml],
    ['docProps/core.xml', declaration +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +

<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('catalog-data').textContent),ITEMS=DATA.items,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state={category:'all',child:'all',layer:'all',query:''};let current=[],toastTimer;
function queryMatch(x){const words=state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return true;const s=[x.name,x.english,x.description,...Object.values(CARD_COPY[x.uid]||{}),x.input_summary,x.output_summary,x.inputs,x.outputs,x.category,x.subcategory,...(x.classification_paths||[]),...displayPaths(x),JSON.stringify(x.fields||[]),JSON.stringify(x.out_fields||[])].join(' ').toLowerCase();return words.every(w=>s.includes(w));}

}

function render(){
 const previousScroll=$('categories').scrollTop||0;normalizeScope();const f=buildFacets();current=f.current;const navRows=ITEMS.filter(x=>inLayer(x)&&queryMatch(x));
 const all={id:'all',name:'全部分类'+(state.layer==='all'?'':' · '+state.layer),icon:'all'};
 const allExpanded=f.categories.length>0&&f.categories.every(r=>expandedRoots.has(r.node.id));

 const normal=f.categories.filter(r=>!['general-tools','private-research','user-data'].includes(r.node.id)),general=f.categories.filter(r=>r.node.id==='general-tools'),privateRows=f.categories.filter(r=>r.node.id==='private-research'),userRows=f.categories.filter(r=>r.node.id==='user-data'),groups=[normal,privateRows,[...userRows,...general]].filter(g=>g.length),ordered=groups.flat(),divider='<div class="nav-separator" role="separator"></div>';
 $('categories').innerHTML='<div class="navigation-heading">'+button(all,f.allCount)+(groups.length?divider:'')+'</div>'+(groups.length?'<div class="business-categories">'+ordered.map(r=>button(r.node,r.count)).join('')+'</div>':'');restoreNavigation(previousScroll);

function selectLayer(layer){if(!LAYERS.includes(layer))return;state.layer=layer;render();}
