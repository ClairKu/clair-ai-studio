务需求分群。","scenes":["client-visit"],"fields":[],"out_fields":[],"input_summary":"客户授权资料、服务目的、信息日期，以及当前要解决的问题。","output_summary":"单客洞察、备访问题、服务需求分群与证据记录","website_order":1,"classification_paths":["客户备访与产品沟通 / 客户洞察与备访"]},{"uid":"skill-advisor-product-communication","layer":"Skills","name":"顾问产品沟通","english":"advisor-product-communication","category":"顾问交付与运营","subcategory":"","inputs":"已确定基金代码或策略代码（名称需先消歧）；费率、规则、风险收益或沟通问题；受众与渠道；定向适配任务还需风险测评、期限、流动性、目标和损失承受能力。","outputs":"带官方名称和代码的产品说明；费率/限额/确认到账规则表；FAQ、顾问提纲、同口径比较、企微或电话话术；MD/HTML/PDF。","source_url":"https://qieman.com/mcp/skill-detail/advisor-product-communication","official_name":"advisor-product-communication","description":"围绕已确定基金或投顾策略，生成事实核验后的产品说明、FAQ与客户沟通材料。","scenes":["client-visit","content-studio","account-service"],"fields":[],"out_fields":[],"input_summary":"已确定的基金或策略、沟通问题、目标受众和表达渠道。","output_summary":"产品说明、费率规则表、常见问题，以及顾问沟通提纲或话术。","website_order":2,"classification_paths":["客户备访与产品沟通 / 产品说明与客户沟通","内容策划与材料生成 / 产品说明与客户沟通","交易规则与费用 / 交易规则与限额"]},{"uid":"skill-family-wealth-planning","layer":"Skills","name":"家庭财富规划","english":"family-wealth-planning","category":"家庭理财规划","subcategory":"","inputs":"规划对象、币种与数据日期；按任务提供收支、资产负债和家庭责任；目标金额/期限/已有本金/收益假设；全周期任务还需成员年龄、持续与一次性收支。","outputs":"财务体检、目标排序、教育养老目标测算、四笔钱和全周期现金流分析；预算、应急储备、目标月投入与规划路线；MD/HTML/PDF。","source_url":"https://qieman.com/mcp/skill-detail/family-wealth-planning","official_name":"family-wealth-planning","description":"围绕家庭现金流和财富目标，梳理财务健康、目标可行性与四笔钱安排。","scenes":["family-planning"],"fields":[],"out_fields":[],"input_summary":"家庭收支、资产负债、成员责任，以及教育养老等财富目标。","output_summary":"家庭财务体检、目标测算、四笔钱安排与长期现金流规划。","website_order":3,"classification_paths":["家庭规划与目标测算 / 家庭财务与现金流"]},{"uid":"skill-fund-analysis","layer":"Skills","name":"盈米基金分析","english":"fund-analysis","category":"基金策略与组合分析","subcategory":"","inputs":"一只或多只基金代码/名称（先核验身份）；快速/完整/风险/经理/持仓归因/对比任务；关注区间和问题；单批工具取数不超过20只。","outputs":"基金事实、业绩风险、持仓风格、经理及归因结论；专项分析或同口径对比表；按复杂度交付MD、HTML或PDF并标注日期与局限。","source_url":"https://qieman.co (()=>{'use strict';

function queryMatch(x){const words=state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return true;const s=[x.name,x.english,x.description,x.input_summary,x.output_summary,x.inputs,x.outputs,x.category,x.subcategory,...(x.classification_paths||[]),JSON.stringify(x.fields||[]),JSON.stringify(x.out_fields||[])].join(' ').toLowerCase();return words.every(w=>s.includes(w));}
