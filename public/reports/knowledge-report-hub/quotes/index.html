<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI 经典语录已整合进 AI 行业情报站的人物语录与观点对照栏目。" />
  <title>人物语录已整合 · AI 行业情报站</title>
  <link rel="canonical" href="../#quotes" />
</head>
<body>
  <p>人物语录与观点对照已整合进 <a id="hub-link" href="../#quotes">AI 行业情报站</a>，正在前往。</p>
  <script>
    (() => {
      const hash = location.hash;
      const retained = hash.startsWith("#quote=") || hash.startsWith("#quotes") || hash.startsWith("#comparisons") ? hash : "#quotes";
      const target = new URL("../", location.href);
      target.hash = retained;
      document.getElementById("hub-link").href = target.href;
      location.replace(target.href);
    })();
  </script>
  <noscript><p>请使用上方链接进入整合后的栏目。</p></noscript>
</body>
</html>
