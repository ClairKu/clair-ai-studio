<p>季度交付、投入次序和经营指标为规划建议。顾问工作台分期沿用 11 月 27 日路线图，二、三期具体日期待定。</p>

<div id="status" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const el=id=>document.getElementById(id);
const pages=Array.from(document.querySelectorAll('figure.art'));
const serial=i=>String(i+1).padStart(2,'0');
let current=0, all=false, presenting=false, busy=false, scheduled=false, messageTimer;
document.body.classList.add('ready');
function status(message){clearTimeout(messageTimer);el('status').textContent=message;if(message)messageTimer=setTimeout(()=>{el('status').textContent='';},4000);}
function selectPage(i){
  current=Math.max(0,Math.min(i,pages.length-1));
  el('jump').value=String(current);
  el('prev').disabled=current===0;
  el('next').disabled=current===pages.length-1;
}
function setZoom(enable){
  document.body.classList.toggle('zoomed',enable);
  el('zoom').setAttribute('aria-pressed',String(enable));
  el('zoom').textContent=enable?'适应宽度':'放大';
  if(!enable)for(const page of pages)page.querySelector('.viewport').scrollLeft=0;
}
function readHash(){
  const h=location.hash;
  const target=/^#fig-(0[1-9]|10)$/.exec(h);
  all=h==='#overview'&&!presenting;
  selectPage(target?Number(target[1])-1:all?current:0);
  document.body.classList.toggle('overview',all);
  el('continuous').setAttribute('aria-pressed',String(all));
  el('continuous').textContent=all?'单图阅读':'十图连读';
  pages.forEach((page,i)=>{page.hidden=!all&&i!==current;});
  setZoom(false);
  if(all)pages[current].scrollIntoView({block:'start'});
  else if(!presenting)window.scrollTo(0,0);
}
function go(i){
  if(i<0||i>=pages.length)return;
  const hash='#fig-'+serial(i);
  if(location.hash===hash)readHash();else location.hash=hash;
}
function step(delta){
  if(all){selectPage(current+delta);pages[current].scrollIntoView({block:'start'});}
  else go(current+delta);
}
function visiblePage(){
  if(!all||scheduled)return;
  scheduled=true;
  requestAnimationFrame(()=>{
    scheduled=false;if(!all)return;
    const y=document.querySelector('.bar').getBoundingClientRect().bottom+Math.max(10,window.innerHeight*.18);
    let i=current;for(let j=0;j<pages.length;j++){if(pages[j].getBoundingClientRect().top<=y)i=j;else break;}
    selectPage(i);
  });
}
el('jump').addEventListener('change',e=>go(Number(e.target.value)));
el('prev').addEventListener('click',()=>step(-1));el('next').addEventListener('click',()=>step(1));
el('continuous').addEventListener('click',()=>{if(all)go(current);else location.hash='overview';});
el('zoom').addEventListener('click',()=>setZoom(!document.body.classList.contains('zoomed')));
function setPresentation(enable){
  presenting=enable;
  document.body.classList.toggle('present',enable);
  el('present').setAttribute('aria-pressed',String(enable));
  el('present').textContent=enable?'退出演示':'全屏演示';
  if(enable){el('exports').open=false;setZoom(false);if(all)go(current);}
}
el('present').addEventListener('click',async()=>{
  if(presenting){
    setPresentation(false);
    if(document.fullscreenElement&&document.exitFullscreen)try{await document.exitFullscreen();}catch{}
    return;
  }
  setPresentation(true);
  if(document.documentElement.requestFullscreen)try{await document.documentElement.requestFullscreen();}catch{/* In-app webviews can still present in the full viewport. */}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&presenting)setPresentation(false);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(presenting)setPresentation(false);else if(el('exports').open)el('exports').open=false;else setZoom(false);return;}
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)||el('exports').open)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();step(e.key==='ArrowRight'?1:-1);}
});
document.addEventListener('click',e=>{if(!el('exports').contains(e.target))el('exports').open=false;});
window.addEventListener('hashchange',readHash);
window.addEventListener('scroll',visiblePage,{passive:true});
const filename=(i,ext)=>pages[i].dataset.filename+'.'+ext;
function svgBlob(i){
  const svg=pages[i].querySelector('svg');
  return new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'});
}
function download(blob,name){
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function png(i){
  const source=URL.createObjectURL(svgBlob(i)),canvas=document.createElement('canvas');
  try{
    const img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=source;});
    canvas.width=3840;canvas.height=2160;
    const ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas');
    ctx.drawImage(img,0,0,3840,2160);
    return await new Promise((ok,fail)=>canvas.toBlob(b=>b?ok(b):fail(new Error('png')),'image/png'));
  }finally{URL.revokeObjectURL(source);canvas.width=1;canvas.height=1;}
}
const checksums = Array.from({length:256},(_,n)=>{let value=n;for(let k=0;k<8;k++)value=(value&1)?(0xedb88320^(value>>>1)):value>>>1;return value>>>0;});
function crc32(bytes){let value=0xffffffff;for(const b of bytes)value=checksums[(value^b)&255]^(value>>>8);return (value^0xffffffff)>>>0;}
function header(n){const data=new Uint8Array(n),v=new DataView(data.buffer);return {data,u16:(o,x)=>v.setUint16(o,x,true),u32:(o,x)=>v.setUint32(o,x,true)};}
function zip(entries){
  const files=[],directory=[];let offset=0,dirSize=0;
  for(const entry of entries){
    const name=new TextEncoder().encode(entry.name),bytes=entry.bytes,crc=crc32(bytes);
    const local=header(30);local.u32(0,0x04034b50);local.u16(4,20);local.u16(6,0x0800);local.u16(12,0x21);local.u32(14,crc);local.u32(18,bytes.length);local.u32(22,bytes.length);local.u16(26,name.length);
    const central=header(46);central.u32(0,0x02014b50);central.u16(4,20);central.u16(6,20);central.u16(8,0x0800);central.u16(14,0x21);central.u32(16,crc);central.u32(20,bytes.length);central.u32(24,bytes.length);central.u16(28,name.length);central.u32(42,offset);
    files.push(local.data,name,bytes);directory.push(central.data,name);offset+=30+name.length+bytes.length;dirSize+=46+name.length;
  }
  const end=header(22);end.u32(0,0x06054b50);end.u16(8,entries.length);end.u16(10,entries.length);end.u32(12,dirSize);end.u32(16,offset);
  return new Blob([...files,...directory,end.data],{type:'application/zip'});
}
async function save(kind){
  if(busy)return;busy=true;el('exports').open=false;
  const at=current;
  try{
    if(kind==='all'){
      const entries=[];
      for(let i=0;i<pages.length;i++){
        status('正在生成 4K 图 '+serial(i)+' / 10');
        entries.push({name:filename(i,'png'),bytes:new Uint8Array(await (await png(i)).arrayBuffer())});
      }
      download(zip(entries),'qieman-2027-strategy-frameworks-4k.zip');
    }else if(kind==='svg'){download(svgBlob(at),filename(at,'svg'));}
    else{status('正在生成 4K 图 '+serial(at));download(await png(at),filename(at,'png'));}
    status('下载文件已生成');
  }catch{status('文件未能生成，请重试或下载矢量图。');}finally{busy=false;}
}
el('save-one').addEventListener('click',()=>save('png'));el('save-all').addEventListener('click',()=>save('all'));el('save-vector').addEventListener('click',()=>save('svg'));
readHash();
})();
</script>
