<details class="sources"><summary>规划依据与示例说明</summary><div class="source-body">这是产品侧的 2027 年建议方案。林女士、界面与资金流水均为虚构演示。试点规模、收费方式及验收指标均为建议，年度目标在首季基线核定后确认。<br><a href="https://clairku.github.io/clair-ai-studio/reports/qieman-2027-product-plan-2026-11-26/">年度产品规划</a><a href="https://clairku.github.io/clair-ai-studio/reports/vip-advisor-two-scenarios-2026-11-25/">顾问的两条作业流程</a><a href="https://clairku.github.io/clair-ai-studio/reports/xiaogu-l3-service-diagrams-2026-11-26/">小顾主动服务方案</a></div></details>
<dialog id="enlarged" aria-label="放大本图"><div class="overlay-bar"><strong id="zoom-title"></strong><button type="button" class="close" id="zoom-close">关闭</button></div><div class="overlay-art"><img id="zoom-image" alt=""></div></dialog><div class="status" role="status"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const pages = Array.from(document.querySelectorAll('figure.art'));
const svg = page => page.querySelector('svg');
const title = page => svg(page).querySelector('title').textContent;
const serial = i => String(i + 1).padStart(2, '0');
const metadata = pages.map(page => ({slug:page.dataset.slug, section:page.dataset.section, title:title(page), image:new XMLSerializer().serializeToString(svg(page))}));
const sourceUrl = item => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(item.image);
let pageIndex = 0;
let inOverview = false;
let generating = false;
let noticeTimer;
function notice(value) {
  clearTimeout(noticeTimer);
  document.querySelector('.status').textContent = value;
  if (value && !generating) noticeTimer = setTimeout(() => notice(''), 3000);
}
const dots = metadata.map((item, i) => {
  const dot = document.createElement('button');
  dot.type='button'; dot.className='dot'; dot.setAttribute('aria-label','第 ' + (i+1) + ' 张，' + item.title); dot.title=item.title;
  dot.append(document.createElement('b'));
  dot.addEventListener('click',()=>visit(i));
  $('steps').append(dot);
  const tile=document.createElement('button'); tile.type='button'; tile.className='tile';
  const preview=new Image(); preview.src=sourceUrl(item); preview.alt=item.title; preview.loading='lazy';
  const caption=document.createElement('span'); caption.textContent=serial(i)+'  /  '+item.section;
  tile.append(preview,caption); tile.addEventListener('click',()=>visit(i,true)); $('grid').append(tile);
  return dot;
});
function display(i) {
  pageIndex=Math.max(0,Math.min(i,pages.length-1));
  pages.forEach((page,j)=>{page.hidden=j!==pageIndex; if(j===pageIndex)dots[j].setAttribute('aria-current','step');else dots[j].removeAttribute('aria-current');});
  $('prev').disabled=pageIndex===0; $('next').disabled=pageIndex===pages.length-1;
  $('position').textContent=serial(pageIndex)+' / '+pages.length;
}
function overview(on) {
  inOverview=on; $('overview').hidden=!on; $('viewer').hidden=on;
  $('overview-toggle').setAttribute('aria-pressed',String(on));
  $('overview-toggle').textContent=on?'逐张查看':'十图总览';
  $('zoom').hidden=on; $('save-one').hidden=on;
}
function visit(i,focus=false) {
  overview(false); display(i);
  const hash='#fig-'+serial(pageIndex);
  if(location.hash!==hash)location.hash=hash;
  if(focus)$('viewer').focus({preventScroll:true});
}
function readLocation() {
  if(location.hash==='#overview'){overview(true);return;}
  const found=location.hash.match(/^#fig-(0[1-9]|10)$/);
  overview(false); display(found?Number(found[1])-1:0);
}
$('overview-toggle').addEventListener('click',()=>{if(inOverview)visit(pageIndex,true);else{overview(true);location.hash='overview';}});
$('prev').addEventListener('click',()=>visit(pageIndex-1));
$('next').addEventListener('click',()=>visit(pageIndex+1));
window.addEventListener('hashchange',readLocation);
const modal=$('enlarged');
$('zoom').addEventListener('click',()=>{const item=metadata[pageIndex];$('zoom-title').textContent=serial(pageIndex)+' / '+item.title;$('zoom-image').src=sourceUrl(item);$('zoom-image').alt=item.title;modal.showModal();modal.querySelector('.overlay-art').scrollTo(0,0);});
$('zoom-close').addEventListener('click',()=>modal.close());
document.addEventListener('keydown',event=>{
  if(modal.open || inOverview || event.altKey || event.ctrlKey || event.metaKey)return;
  if(event.key==='ArrowRight' || event.key==='ArrowLeft'){event.preventDefault();visit(pageIndex+(event.key==='ArrowRight'?1:-1));}
});
let touchStart;
$('viewer').addEventListener('touchstart',e=>{touchStart=e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null;},{passive:true});
$('viewer').addEventListener('touchend',e=>{if(!touchStart || e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];touchStart=null;if(Math.abs(dx)>75 && Math.abs(dx)>Math.abs(dy)*2)visit(pageIndex+Math.sign(-dx));},{passive:true});
function download(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function renderPNG(i){
  const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=sourceUrl(metadata[i]);});
  const canvas=document.createElement('canvas');canvas.width=2560;canvas.height=1440;
  const context=canvas.getContext('2d');if(!context)throw new Error('canvas unavailable');
  context.drawImage(img,0,0,canvas.width,canvas.height);
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG unavailable')),'image/png'));
}
// The PNGs are already compressed. ZIP's stored method keeps the download self-contained.
const checksums = Array.from({length:256},(_,n)=>{let value=n;for(let k=0;k<8;k++)value=(value&1)?(0xedb88320^(value>>>1)):value>>>1;return value>>>0;});
function crc32(bytes){let value=0xffffffff;for(const b of bytes)value=checksums[(value^b)&255]^(value>>>8);return (value^0xffffffff)>>>0;}
function header(n){const data=new Uint8Array(n),v=new DataView(data.buffer);return {data,u16:(o,x)=>v.setUint16(o,x,true),u32:(o,x)=>v.setUint32(o,x,true)};}
function zip(entries){
  const files=[],directory=[];let offset=0,dirSize=0;
  for(const entry of entries){
    const name=new TextEncoder().encode(entry.name),bytes=entry.bytes,crc=crc32(bytes);
    const local=header(30);local.u32(0,0x04034b50);local.u16(4,20);local.u16(6,0x0800);local.u16(12,0x21);local.u32(14,crc);local.u32(18,bytes.length);local.u32(22,bytes.length);local.u16(26,name.length);
    const central=header(46);central.u32(0,0x02014b50);central.u16(4,20);central.u16(6,20);central.u16(8,0x0800);central.u16(14,0x21);central.u32(16,crc);central.u32(20,bytes.length);central.u32(24,bytes.length);central.u16(28,name.length);central.u32(42,offset);
    files.push(local.data,name,bytes);directory.push(central.data,name);offset+=30+name.length+bytes.length;dirSize+=46+name.length;
  }
  const end=header(22);end.u32(0,0x06054b50);end.u16(8,entries.length);end.u16(10,entries.length);end.u32(12,dirSize);end.u32(16,offset);
  return new Blob([...files,...directory,end.data],{type:'application/zip'});
}
function filename(i){return serial(i)+'-'+metadata[i].slug+'.png';}
async function save(all){
  if(generating)return;generating=true;$('save-one').disabled=true;$('save-all').disabled=true;
  try{
    if(all){const entries=[];for(let i=0;i<pages.length;i++){notice('正在生成高清图 '+serial(i)+' / 10');entries.push({name:filename(i),bytes:new Uint8Array(await (await renderPNG(i)).arrayBuffer())});}download(zip(entries),'qieman-2027-ten-figures.zip');}
    else{const i=pageIndex;notice('正在生成高清图');download(await renderPNG(i),filename(i));}
    generating=false;notice('已生成下载文件');
  }catch{generating=false;notice('下载未完成，可重新生成。');}
  finally{$('save-one').disabled=false;$('save-all').disabled=false;}
}
$('save-one').addEventListener('click',()=>save(false));$('save-all').addEventListener('click',()=>save(true));
display(0);readLocation();
})();
</script>
