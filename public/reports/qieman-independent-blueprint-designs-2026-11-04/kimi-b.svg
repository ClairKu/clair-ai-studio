<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">且慢财富顾问服务总产品蓝图 B：一个共同内核，两类服务主体，逐场景生长</title>
  <desc id="desc">采用同心内核与场景循环构图。统一服务台账是服务主状态，标准服务包是共用资产，AI小顾4.0和Lodestar是两类服务主体，智能顾问运营L3以验证、发布、消费、回流循环逐场景推动升级。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif; }
      .white { fill: #f8f5ed; }
      .ink { fill: #142b3a; }
      .muted { fill: #a8bac2; }
      .darkmuted { fill: #586c75; }
      .title { font-size: 66px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 34px; font-weight: 400; }
      .section { font-size: 42px; font-weight: 700; }
      .cardtitle { font-size: 38px; font-weight: 700; }
      .body { font-size: 32px; font-weight: 400; }
      .body-strong { font-size: 32px; font-weight: 600; }
      .small { font-size: 30px; font-weight: 400; }
      .small-strong { font-size: 30px; font-weight: 600; }
      .label { font-size: 30px; font-weight: 600; letter-spacing: 1px; }
      .supply { fill: none; stroke: #69c4b2; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .goldline { fill: none; stroke: #c89b3c; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #b8add8; stroke-width: 5; stroke-dasharray: 13 12; stroke-linecap: round; }
    </style>
    <marker id="arrow-mint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#69c4b2"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c89b3c"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef8b65"/>
    </marker>
    <marker id="arrow-coral-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 Z" fill="#ef8b65"/>
    </marker>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="3200" height="1800" fill="#0d202d"/>
  <path d="M0 0 H3200 V18 H0 Z" fill="#69c4b2"/>
  <path d="M2560 0 H3200 V18 H2560 Z" fill="#ef8b65"/>

  <!-- Header -->
  <text x="120" y="82" class="label" fill="#69c4b2">QIEMAN · SERVICE BUSINESS OPERATING MODEL / BLUEPRINT B</text>
  <text x="120" y="166" class="title white">一个共同内核，两类服务主体，逐场景生长</text>
  <text x="120" y="224" class="subtitle muted">且慢财富顾问服务总产品蓝图｜客户价值牵引，共同资产复用，专业责任不缺席</text>
  <rect x="2650" y="84" width="430" height="138" rx="69" fill="#173442" stroke="#315564" stroke-width="3"/>
  <text x="2865" y="140" text-anchor="middle" class="small" fill="#a8bac2">业务重塑的判断标准</text>
  <text x="2865" y="190" text-anchor="middle" class="body-strong white">客户感知是同一项服务</text>

  <!-- Business vocabulary -->
  <rect x="120" y="270" width="2960" height="82" rx="41" fill="#173442"/>
  <text x="160" y="322" class="small white">
    <tspan font-weight="700" fill="#69c4b2">四个概念，四种维度：</tspan>
    <tspan>客户服务＝总域 / 职能</tspan><tspan fill="#607d89">　｜　</tspan>
    <tspan>私域＝渠道 / 关系</tspan><tspan fill="#607d89">　｜　</tspan>
    <tspan>VIP＝权益 / 深度</tspan><tspan fill="#607d89">　｜　</tspan>
    <tspan>顾问运营＝组织 / 运营</tspan>
  </text>

  <!-- Left: customer-value field -->
  <ellipse cx="1100" cy="950" rx="960" ry="520" fill="#122c3a" stroke="#31515f" stroke-width="4"/>
  <ellipse cx="1100" cy="950" rx="900" ry="465" fill="none" stroke="#244553" stroke-width="3" stroke-dasharray="8 16"/>
  <text x="190" y="466" class="label" fill="#69c4b2">客户价值 / LONG-TERM SERVICE</text>
  <text x="1980" y="466" text-anchor="end" class="small muted">所有产品关系都服务于这一外圈</text>

  <!-- Value chips on the outer field -->
  <rect x="280" y="500" width="340" height="70" rx="35" fill="#214654"/>
  <text x="450" y="546" text-anchor="middle" class="body-strong white">目标被记住</text>
  <rect x="1580" y="500" width="340" height="70" rx="35" fill="#214654"/>
  <text x="1750" y="546" text-anchor="middle" class="body-strong white">服务接得上</text>
  <rect x="240" y="1360" width="380" height="70" rx="35" fill="#214654"/>
  <text x="430" y="1406" text-anchor="middle" class="body-strong white">交付之后不断档</text>
  <rect x="1580" y="1360" width="380" height="70" rx="35" fill="#214654"/>
  <text x="1770" y="1406" text-anchor="middle" class="body-strong white">专业判断有人负责</text>

  <!-- Shared service-package ring -->
  <circle cx="1100" cy="950" r="340" fill="none" stroke="#c89b3c" stroke-width="62" opacity="0.24"/>
  <circle cx="1100" cy="950" r="371" fill="none" stroke="#c89b3c" stroke-width="3"/>
  <circle cx="1100" cy="950" r="309" fill="none" stroke="#c89b3c" stroke-width="3"/>
  <rect x="800" y="602" width="600" height="92" rx="46" fill="#c89b3c"/>
  <text x="1100" y="643" text-anchor="middle" class="body-strong" fill="#142b3a">标准服务包 · 可版本化</text>
  <text x="1100" y="680" text-anchor="middle" class="small" fill="#142b3a">方法 / 知识 / 工具 / 责任 / 质量规范</text>

