  <rect x="2220" y="400" width="860" height="1054" rx="48" fill="#f3ecdf" filter="url(#softshadow)"/>
  <rect x="2260" y="438" width="300" height="50" rx="25" fill="#c89b3c"/>
  <text x="2410" y="472" text-anchor="middle" class="small-strong" fill="#142b3a">建设与验证项目 · 非客户产品</text>
  <text x="2260" y="556" class="section ink">智能顾问运营 L3</text>
