  <rect x="2460" y="646" width="180" height="62" rx="20" fill="#e4d5b7"/>
  <text x="2550" y="687" text-anchor="middle" class="small-strong ink">工具流程</text>
  <rect x="2660" y="646" width="180" height="62" rx="20" fill="#e4d5b7"/>
  <text x="2750" y="687" text-anchor="middle" class="small-strong ink">标准服务包</text>
  <rect x="2860" y="646" width="180" height="62" rx="20" fill="#e4d5b7"/>
  <text x="2950" y="687" text-anchor="middle" class="small-strong ink">质量评测</text>

  <!-- Circular scenario loop -->
  <circle cx="2650" cy="1010" r="214" fill="none" stroke="#d8c6a3" stroke-width="4"/>
  <path d="M2650 796 A214 214 0 0 1 2864 1010" class="goldline" marker-end="url(#arrow-gold)"/>
  <path d="M2864 1010 A214 214 0 0 1 2650 1224" class="goldline" marker-end="url(#arrow-gold)"/>
  <path d="M2650 1224 A214 214 0 0 1 2436 1010" class="goldline" marker-end="url(#arrow-gold)"/>
  <path d="M2436 1010 A214 214 0 0 1 2650 796" class="goldline" marker-end="url(#arrow-gold)"/>

  <circle cx="2650" cy="796" r="92" fill="#142b3a"/>
  <text x="2650" y="788" text-anchor="middle" class="small" fill="#a9d8ce">01</text>
  <text x="2650" y="834" text-anchor="middle" class="body-strong white">场景验证</text>
  <circle cx="2864" cy="1010" r="92" fill="#c89b3c"/>
  <text x="2864" y="1002" text-anchor="middle" class="small" fill="#142b3a">02</text>
  <text x="2864" y="1048" text-anchor="middle" class="body-strong" fill="#142b3a">资产发布</text>
  <circle cx="2650" cy="1224" r="92" fill="#147d78"/>
  <text x="2650" y="1216" text-anchor="middle" class="small" fill="#d8f0e9">03</text>
  <text x="2650" y="1262" text-anchor="middle" class="body-strong white">双前台消费</text>
  <circle cx="2436" cy="1010" r="92" fill="#db6b43"/>
  <text x="2436" y="1002" text-anchor="middle" class="small" fill="#fff0e8">04</text>
  <text x="2436" y="1048" text-anchor="middle" class="body-strong white">质量回流</text>

  <text x="2650" y="978" text-anchor="middle" class="small darkmuted">不等全量完成</text>
