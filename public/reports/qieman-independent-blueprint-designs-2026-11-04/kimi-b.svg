  <rect x="220" y="1130" width="570" height="176" rx="34" fill="#1b3b49" stroke="#426573" stroke-width="3"/>
  <text x="254" y="1178" class="small-strong" fill="#69c4b2">慧客通 · 已有 / 升级整合</text>
  <text x="254" y="1226" class="body-strong white">证据化洞察 · 服务准备</text>
  <text x="254" y="1272" class="small muted">批量作业 · 质量基础｜不是数据管道</text>
  <path d="M790 1190 C850 1190 885 1155 930 1125" class="supply" marker-end="url(#arrow-mint)"/>
  <text x="838" y="1152" class="small-strong" fill="#69c4b2">支撑</text>

  <rect x="1410" y="1130" width="570" height="176" rx="34" fill="#1b3b49" stroke="#426573" stroke-width="3"/>
  <text x="1444" y="1178" class="small-strong" fill="#69c4b2">SCRM · 已有 / 升级整合</text>
  <text x="1444" y="1226" class="body-strong white">客户关系 · 私域渠道 · 服务过程</text>
  <text x="1444" y="1272" class="small muted">沟通留痕｜主状态归统一台账</text>
  <path d="M1410 1190 C1350 1190 1315 1155 1270 1125" class="supply" marker-end="url(#arrow-mint)"/>
  <text x="1362" y="1152" class="small-strong" fill="#69c4b2">衔接</text>

  <!-- Independent YINGWORK satellite -->
  <rect x="855" y="1300" width="490" height="154" rx="34" fill="#292d4b" stroke="#b8add8" stroke-width="3"/>
  <text x="1100" y="1348" text-anchor="middle" class="cardtitle white">YINGWORK</text>
  <text x="1100" y="1392" text-anchor="middle" class="small" fill="#d4cfee">独立员工 AI 生产力平台 · 并列协同</text>
  <text x="1100" y="1432" text-anchor="middle" class="small" fill="#d4cfee">按需共用技术 / 工具 / 任务引用 / 成果</text>
  <path d="M1345 1340 C1395 1270 1360 1130 1450 1078" class="dash"/>
  <circle cx="1450" cy="1078" r="8" fill="#b8add8"/>

