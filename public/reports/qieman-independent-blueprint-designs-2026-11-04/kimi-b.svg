  <rect x="875" y="510" width="450" height="62" rx="31" fill="#0d202d"/>
  <text x="1100" y="552" text-anchor="middle" class="body-strong" fill="#ef8b65">跨 AI 与真人双向服务接续</text>

  <!-- AI Xiaogu card -->
  <rect x="220" y="740" width="570" height="320" rx="42" fill="#dff1eb" filter="url(#softshadow)"/>
  <rect x="254" y="770" width="244" height="48" rx="24" fill="#147d78"/>
  <text x="376" y="803" text-anchor="middle" class="small-strong white">已有 · 升级 4.0</text>
  <text x="254" y="874" class="section ink">AI小顾 4.0</text>
  <text x="254" y="920" class="small darkmuted">客户侧 AI 服务产品</text>
  <text x="254" y="968" class="small-strong ink">持续服务 · 长期状态 · 协同</text>
  <line x1="254" y1="992" x2="756" y2="992" stroke="#b4d8ce" stroke-width="3"/>
  <text x="254" y="1032" class="small darkmuted">3.0 已有：工厂化 / 记忆 / 主动服务</text>

  <!-- Lodestar card -->
  <rect x="1410" y="740" width="570" height="320" rx="42" fill="#f8e4d8" filter="url(#softshadow)"/>
  <rect x="1444" y="770" width="324" height="48" rx="24" fill="#db6b43"/>
  <text x="1606" y="803" text-anchor="middle" class="small-strong white">新建 · 真人顾问工作台</text>
  <text x="1444" y="874" class="section ink">Lodestar</text>
  <text x="1444" y="920" class="small darkmuted">理解客户 · 服务队列 · 分析判断</text>
  <text x="1444" y="968" class="small-strong ink">交付 · 持续跟进</text>
  <line x1="1444" y1="992" x2="1946" y2="992" stroke="#e6bca7" stroke-width="3"/>
  <text x="1444" y="1032" class="small" fill="#9f492b">AI 辅助｜顾问对专业判断负责</text>

  <!-- Core: shared service ledger -->
  <circle cx="1100" cy="950" r="245" fill="#f7f3e9" filter="url(#softshadow)"/>
  <text x="1100" y="790" text-anchor="middle" class="small-strong" fill="#147d78">共同内核 / 唯一服务主状态</text>
  <text x="1100" y="850" text-anchor="middle" class="cardtitle ink">统一客户服务台账</text>
  <text x="1100" y="896" text-anchor="middle" class="body-strong" fill="#147d78">AI 与真人共用</text>
  <line x1="945" y1="926" x2="1255" y2="926" stroke="#d5d5ca" stroke-width="3"/>
  <text x="1100" y="972" text-anchor="middle" class="small ink">引用原系统权威事实</text>
  <text x="1100" y="1016" text-anchor="middle" class="small ink">持久保存目标诉求、约定、责任</text>
  <text x="1100" y="1060" text-anchor="middle" class="small ink">计划 / 交付 / 回执 / 复检</text>
  <text x="1100" y="1114" text-anchor="middle" class="small darkmuted">非交易源库 · 非临时查询视图</text>

  <!-- Explicit three-role reuse of the same service packages -->
  <rect x="820" y="1210" width="560" height="62" rx="31" fill="#c89b3c"/>
  <text x="1100" y="1251" text-anchor="middle" class="small-strong" fill="#142b3a">AI小顾 / 真人顾问 / Lodestar 复用</text>

  <!-- State sharing arrows -->
  <path d="M855 1000 H806" class="supply" marker-end="url(#arrow-mint)"/>
  <text x="830" y="972" text-anchor="middle" class="small-strong" fill="#69c4b2">共用</text>
  <path d="M1345 1000 H1394" class="supply" marker-end="url(#arrow-mint)"/>
  <text x="1370" y="972" text-anchor="middle" class="small-strong" fill="#69c4b2">共用</text>

