<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="t d"><title id="t">产品组合：入口分工，共用服务能力</title><desc id="d">谁为谁提供什么，产品边界和共建边界在哪里。目标设计，非现网审计。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#117D76"/></marker><marker id="bluearr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#286CAC"/></marker></defs><g font-family="Heiti SC,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="3200" height="1800" rx="0" fill="#F4F5F1" stroke="none" stroke-width="2"/><text x="80" y="75" font-size="23" font-weight="650" fill="#117D76" text-anchor="start">QIEMAN  /  PRODUCT BLUEPRINT</text><text x="80" y="155" font-size="53" font-weight="750" fill="#17343D" text-anchor="start">产品组合：入口分工，共用服务能力</text><text x="80" y="211" font-size="29" font-weight="400" fill="#597078" text-anchor="start">回答：AI小顾、Lodestar、慧客通、SCRM、YINGWORK如何各司其职，哪些能力一起建设。</text><text x="3120" y="77" font-size="33" font-weight="650" fill="#117D76" text-anchor="end">02 / 06</text><rect x="600" y="285" width="820" height="300" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="600" y="285" width="9" height="300" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="630" y="340" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">AI小顾 → 4.0</text><text x="630" y="397.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">客户表达、补全与解释</text><text x="630" y="442.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">查看进度，接续已确认服务</text><text x="630" y="488.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">获准服务自动完成或转人工</text><rect x="630" y="524" width="257" height="40" rx="10" fill="#F9ECD8" stroke="none" stroke-width="2"/><text x="646" y="553" font-size="24" font-weight="650" fill="#9A611B" text-anchor="start">已有产品 · 升级</text><rect x="1510" y="285" width="820" height="300" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1510" y="285" width="9" height="300" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="1540" y="340" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">Lodestar 顾问工作台</text><text x="1540" y="397.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">顾问队列、客户与任务工作区</text><text x="1540" y="442.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">核证、判断、修改、签发、复盘</text><text x="1540" y="488.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">承接人机协作及专业交付</text><rect x="1540" y="524" width="82" height="40" rx="10" fill="#E3EDF8" stroke="none" stroke-width="2"/><text x="1556" y="553" font-size="24" font-weight="650" fill="#286CAC" text-anchor="start">新建</text><rect x="2540" y="285" width="580" height="300" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="2540" y="285" width="9" height="300" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="2570" y="340" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">YINGWORK</text><text x="2570" y="397.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">独立员工AI生产力平台</text><text x="2570" y="439.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">通用作业、知识与工具</text><text x="2570" y="482.84000000000003" font-size="29" font-weight="400" fill="#597078" text-anchor="start">与Lodestar并列协同</text><rect x="2570" y="524" width="307" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="2586" y="553" font-size="24" font-weight="650" fill="#597078" text-anchor="start">独立协同 · 持续建设</text><line x1="1010" y1="593" x2="1010" y2="689" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="1036" y="644" font-size="26" font-weight="400" fill="#117D76" text-anchor="start">服务请求 / 授权 / 反馈</text><line x1="1920" y1="593" x2="1920" y2="689" stroke="#117D76" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="1945" y="644" font-size="26" font-weight="400" fill="#117D76" text-anchor="start">工作队列 / 判断 / 交付</text><path d="M2330,435 L2430,435 L2430,620 L2830,620 L2830,585" fill="none" stroke="#117D76" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="10 8"/><text x="2470" y="676" font-size="26" font-weight="400" fill="#7452A1" text-anchor="start">协同任务链接 / 成果引用</text><rect x="600" y="710" width="1730" height="660" rx="20" fill="#EAF2EF" stroke="#117D76" stroke-width="3"/><text x="630" y="765" font-size="34" font-weight="700" fill="#117D76" text-anchor="start">共用客户服务能力｜逻辑能力共建，物理实现按现有系统择优复用</text><rect x="630" y="800" width="800" height="505" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="630" y="800" width="9" height="505" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="660" y="855" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">设计态：标准服务生产线</text><text x="660" y="912.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">服务目录、权益及适用范围</text><text x="660" y="957.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">专业方法、知识、工具与SOP</text><text x="660" y="1003.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">责任点、交付标准、异常路径</text><text x="660" y="1049.64" font-size="31" font-weight="400" fill="#597078" text-anchor="start">评测、审批、版本发布与撤回</text><rect x="660" y="1244" width="382" height="40" rx="10" fill="#EDE6F5" stroke="none" stroke-width="2"/><text x="676" y="1273" font-size="24" font-weight="650" fill="#7452A1" text-anchor="start">升级 / 新建能力 · 共建</text><rect x="1490" y="800" width="810" height="505" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1490" y="800" width="9" height="505" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="1520" y="855" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">运行态：客户服务履约</text><text x="1520" y="912.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">统一台账、服务实例与计划</text><text x="1520" y="957.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">任务分派、人机交接、状态推进</text><text x="1520" y="1003.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">受控执行、交付回执与后续复检</text><text x="1520" y="1049.64" font-size="31" font-weight="400" fill="#597078" text-anchor="start">质量抽检与客户反馈</text><rect x="1520" y="1244" width="382" height="40" rx="10" fill="#EDE6F5" stroke="none" stroke-width="2"/><text x="1536" y="1273" font-size="24" font-weight="650" fill="#7452A1" text-anchor="start">升级 / 新建能力 · 共建</text><line x1="1440" y1="1015" x2="1477" y2="1015" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="1444" y="974" font-size="25" font-weight="400" fill="#117D76" text-anchor="start">版</text><text x="1444" y="1001" font-size="25" font-weight="400" fill="#117D76" text-anchor="start">本</text><text x="635" y="1348" font-size="26" font-weight="400" fill="#117D76" text-anchor="start">运行问题与服务结果 → 反哺规范、知识、工具和评测；旧实例升级不得静默改动原承诺。</text><rect x="80" y="790" width="440" height="270" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="80" y="790" width="9" height="270" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="110" y="845" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">慧客通</text><text x="110" y="902.0" font-size="28" font-weight="400" fill="#597078" text-anchor="start">客户洞察 / 批处理基础</text><text x="110" y="943.44" font-size="28" font-weight="400" fill="#597078" text-anchor="start">输出可追溯候选信号</text><text x="110" y="984.88" font-size="28" font-weight="400" fill="#597078" text-anchor="start">服务准备与质量输入</text><rect x="110" y="999" width="257" height="40" rx="10" fill="#F9ECD8" stroke="none" stroke-width="2"/><text x="126" y="1028" font-size="24" font-weight="650" fill="#9A611B" text-anchor="start">已有基础 · 适配</text><rect x="80" y="1100" width="440" height="270" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="80" y="1100" width="9" height="270" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="110" y="1155" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">SCRM</text><text x="110" y="1212.0" font-size="28" font-weight="400" fill="#597078" text-anchor="start">关系归属 / 私域基础</text><text x="110" y="1253.44" font-size="28" font-weight="400" fill="#597078" text-anchor="start">承接获准触达与留痕</text><text x="110" y="1294.88" font-size="28" font-weight="400" fill="#597078" text-anchor="start">回流沟通和分项回执</text><rect x="110" y="1309" width="257" height="40" rx="10" fill="#F9ECD8" stroke="none" stroke-width="2"/><text x="126" y="1338" font-size="24" font-weight="650" fill="#9A611B" text-anchor="start">已有基础 · 整合</text><line x1="528" y1="930" x2="588" y2="930" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><line x1="528" y1="1230" x2="588" y2="1230" stroke="#117D76" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="2540" y="790" width="580" height="580" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="2540" y="790" width="9" height="580" rx="0" fill="#7452A1" stroke="none" stroke-width="2"/><text x="2570" y="845" font-size="35" font-weight="700" fill="#7452A1" text-anchor="start">同平台供给，独立业务责任</text><text x="2570" y="902.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">YINGWORK可复用企业AI供给。</text><text x="2570" y="944.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">按需调用受控业务工具，</text><text x="2570" y="987.84" font-size="29" font-weight="400" fill="#597078" text-anchor="start">交换任务引用与成果。</text><text x="2570" y="1030.76" font-size="29" font-weight="400" fill="#597078" text-anchor="start">客户服务实例与主状态，</text><text x="2570" y="1073.68" font-size="29" font-weight="400" fill="#597078" text-anchor="start">归入指定权威业务实现。</text><text x="2570" y="1116.6" font-size="29" font-weight="400" fill="#597078" text-anchor="start">具体集成方式按场景验收。</text><rect x="600" y="1450" width="2520" height="187" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="628" y="1499" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">企业与专业供给 → 服务生产线、运行能力及各应用</text><text x="628" y="1545" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">源业务系统 / 数据与身份授权 / 专业知识与计算 / AI运行与工具 / 触达渠道 / 观测评测。</text><text x="628" y="1584" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">供给项详见图05；平台支持业务，业务责任和产品归属分别管理。</text><line x1="1465" y1="1442" x2="1465" y2="1386" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><line x1="2820" y1="1442" x2="2820" y2="1386" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><line x1="80" y1="1705" x2="3120" y2="1705" stroke="#CFDBDB" stroke-width="2"/><text x="80" y="1746" font-size="24" font-weight="400" fill="#597078" text-anchor="start">状态：已有指产品或系统基础；升级、新建为目标改造。共建是协作方式，可与状态叠加；接口接通情况另验收。</text><text x="3120" y="1780" font-size="23" font-weight="400" fill="#597078" text-anchor="end">且慢目标设计 · 2026.11.04 · 行业研究重绘版</text></g></svg>