function calculate(id){try{let out='';
if(['dca-calculator','goal-tracker'].includes(id)){const init=number('#initial'),mo=number('#monthly'),yr=number('#years',1,60),an=number('#annual',-99,100),r=Math.pow(1+an/100,1/12)-1,n=Math.round(yr*12),end=fv(mo,r,n,init),cost=init+mo*n,a=[],b=[];for(let i=0;i<=n;i++){a.push(fv(mo,r,i,init));b.push(init+mo*i);}let sub='共 '+n+' 期月末投入；假设年收益 '+fmt(an,2)+'%。';if(id==='goal-tracker'){const target=number('#target'),factor=Math.abs(r)<1e-12?n:Math.expm1(n*Math.log1p(r))/r,need=Math.max(0,(target-init*Math.pow(1+r,n))/factor);out=result('预计目标完成度',target===0?'目标已覆盖':fmt(end/target*100,1)+'%','期末资产 '+money(end)+'；目标 '+money(target),['达到目标所需月投入',money(need)],['与目标差额',money(end-target)])+curve([a,b]);}else out=result('规划期末资产',money(end),sub,['累计投入',money(cost)],['假设累计收益',money(end-cost)])+curve([a,b]);}
else if(id==='mortgage-compare'){const init=number('#initial'),lr=number('#loanrate',0,100)/100,an=number('#annual',-99,100)/100,yr=number('#years',1,40),loan=init*(1+lr)**yr,invest=init*(1+an)**yr,a=[],b=[];for(let i=0;i<=yr;i++){a.push(init*(1+an)**i);b.push(init*(1+lr)**i);}out=result('投资假设与贷款基准的期末差额',money(invest-loan),'差额取决于假设收益能否实现。可比较的盈亏平衡年收益约为 '+fmt(lr*100,2)+'%。',['投资情景终值',money(invest)],['贷款利率复利基准',money(loan)])+curve([a,b],['投资假设路径','贷款利率比较基准']);}
else if(id==='retire-sim'){const init=number('#initial'),wd=number('#withdraw'),an=number('#annual',-99,100)/100,inf=number('#inflation',-50,50)/100,yr=number('#years',1,60);let bal=init,total=0,ruin=null,arr=[init],rows=[];for(let y=1;y<=yr;y++){let draw=wd*(1+inf)**(y-1),pre=bal*(1+an);if(pre<draw&&ruin===null)ruin=y;const paid=Math.min(pre,draw);bal=Math.max(0,pre-draw);total+=paid;arr.push(bal);rows.push([y+' 年',money(draw),money(paid),money(bal)]);}out=result('期末剩余资产',money(bal),ruin?'第 '+ruin+' 年起资产不足以覆盖计划支取。':'该组恒定收益假设下，规划期内可覆盖全部支取。',['累计实际支取',money(total)],['规划期限',yr+' 年'])+curve([arr],['支取后资产'])+table(['年份','计划支取','可支取金额','年末资产'],rows);}
else if(['quick-plan','asset-alloc','lineup-card'].includes(id)){const level=number('#risk-level',1,5),cap=number('#capital'),w=({1:[5,75,20],2:[15,70,15],3:[40,50,10],4:[65,30,5],5:[85,10,5]})[level],returns=[number('#equity-r',-99,100),number('#bond-r',-99,100),number('#cash-r',-99,100)],r=w.reduce((a,x,i)=>a+x*returns[i]/100,0),names=['权益资产','债券资产','现金资产'];out=result('组合加权假设年收益',pct(r),'配置情景 '+level+'；金额 '+money(cap)+'。')+'<div class="bar-asset">'+w.map((v,i)=>'<span style="width:'+v+'%;background:'+colours[i]+'"></span>').join('')+'</div>'+table(['资产','权重','配置金额','假设年收益'],w.map((v,i)=>[names[i],v+'%',money(cap*v/100),pct(returns[i])]))+(id==='lineup-card'?notice('演示阵型：权益承担进攻，债券承担中场缓冲，现金承担流动性。实际风险仍取决于具体持仓与资金用途。'):'');}
else if(['stress-test','portfolio-calc'].includes(id)){const cap=number('#capital'),w=[number('#weight-e',0,100),number('#weight-b',0,100),number('#weight-c',0,100)],shock=[number('#shock-e',-100,100),number('#shock-b',-100,100),number('#shock-c',-100,100)];if(Math.abs(w.reduce((a,b)=>a+b,0)-100)>.001)throw Error('三类资产权重需要合计 100%。');const r=w.reduce((a,v,i)=>a+v*shock[i]/100,0);out=result('冲击后组合变化',pct(r),'按输入权重加权，未考虑再平衡、相关性变化、流动性及非线性风险。',['情景损益',money(cap*r/100)],['冲击后资产',money(cap*(1+r/100))])+table(['资产','权重','情景冲击','组合贡献'],w.map((v,i)=>[['权益','债券','现金'][i],v+'%',pct(shock[i]),fmt(v*shock[i]/100,2)+' 个百分点']));}
else if(id==='real-return'){const b=number('#beta',-100,100),a=number('#alpha',-100,100),c=number('#cost',0,100),g=number('#gamma',-100,100);out=result('演示投资收益',pct(b+a-c+g),'β '+pct(b)+' + α '+pct(a)+' − c '+fmt(c,2)+'% + γ '+pct(g))+table(['组成','输入值','解释'],[['β',pct(b),'市场收益假设'],['α',pct(a),'经理超额假设'],['c','−'+fmt(c,2)+'%','投资成本假设'],['γ',pct(g),'行为损益假设']]);}
$('#calc-result').innerHTML=out;
}catch(e){$('#calc-result').innerHTML='<div class="calc-error">'+esc(e.message)+'</div>';}}

function agents(){const roles=D.previous.skills.filter(x=>x.id.startsWith('r9-opc-'));return '<div class="eyebrow">OPC COMPANY / ROLE DEFINITIONS</div><h1 style="font-size:39px">一人投顾公司的智能体组织</h1><p class="detail-description">原站把角色职责、技能工具和业务模块关联起来。下面展示公开文档中的 15 个角色 / 记忆入口，可点击打开原始定义。</p>'+notice('本页展示角色定义与职责，不会冒充真实智能体运行，也没有访问公司私有任务、会议或客户记忆。')+'<div class="panel"><h3>组织协作方式</h3><p><b>R9 / Luce</b> 接收并拆分经营目标；<b>Atlas</b> 组织投研；<b>Mira</b> 组织投顾服务；<b>Vega</b> 负责交易运营；<b>Sage</b> 审核合规风险；公司记忆承接归档与检索。</p></div><div class="role-tree" style="margin-top:20px">'+roles.map(x=>'<article class="role-card"><small>'+esc(x.category)+'</small><b>'+esc(x.name)+'</b><p>'+esc(x.purpose)+'</p><div class="mono">'+esc(x.id)+'</div><a href="'+esc(x.url)+'" target="_blank" rel="noreferrer" style="display:inline-block;margin-top:13px;font-size:14px">阅读角色定义</a></article>').join('')+'</div>';}
function apiKind(path){if(/password|logout|pb-gate/.test(path))return '认证与权限';if(/publish|hot-like|client-watch|clients|forum|track$|approvals$/.test(path))return '状态与写入';if(/ask|commentary|analysis|review|sparring|reader|muse/.test(path))return 'AI 与内容';if(/portfolio|dca|quant|diagnose|correlation|stress|return|compare|attribution/.test(path))return '计算与研究';return '行情与资料';}
function apis(){return '<div class="eyebrow">DATA & INTEGRATION MAP</div><h1 style="font-size:39px">数据接口与边界</h1><p class="detail-description">从完整前端页面提取 '+D.endpoints.length+' 个不同的 /api/ 路径。按用途归类，便于重新设计同类能力时拆分数据、计算、AI、状态与权限。</p>'+notice('这些是前端引用的路径清单，尚未逐接口确认 HTTP 方法、入参、返回字段、鉴权、频率限制和服务端实现。本展示不会向原站发起请求。')+'<div class="stats">'+['行情与资料','计算与研究','AI 与内容','状态与写入'].map(k=>'<div class="stat"><b>'+D.endpoints.filter(p=>apiKind(p)===k).length+'</b><span>'+k+'</span></div>').join('')+'</div><div class="filters"><input id="api-q" placeholder="搜索接口：fund、portfolio、opc、AI…" value="'+esc(apiQuery)+'" aria-label="搜索接口"><span class="meta">认证与权限接口另外标识</span></div><div id="api-table"></div><div class="panel"><h3>重新实现时的数据分层</h3><div class="grid two"><article><h4>市场与公开产品资料</h4><p class="muted">原站说明涉及天天基金、腾讯行情、东方财富、公开指数与机构公告。需要逐来源确认日期、授权、复权和可复算性。</p></article><article><h4>客户与组织状态</h4><p class="muted">持仓、档案、观察池、公司记忆、指令与论坛涉及持久化和身份边界；本页只展示界面，没有复制原站账户与状态服务。</p></article></div></div>';}
function apisTable(){const a=D.endpoints.filter(x=>x.includes(apiQuery));$('#api-table').innerHTML=table(['前端引用路径','用途分类','关联模块（静态线索）','验证状态'],a.map(x=>['<code>'+esc(x)+'</code>',pill(apiKind(x),apiKind(x)==='状态与写入'?'gold':''),D.modules.filter(m=>m.endpoints.includes(x)).map(m=>'<button class="small" data-module="'+esc(m.id)+'">'+esc(m.name)+'</button>').join(' ')||'<small>共享脚本 / 未确认单模块映射</small>', '<small>发现前端引用<br>未调用接口</small>']));bindModules();}
function evidence(){return '<div class="eyebrow">EVIDENCE & COVERAGE</div><h1 style="font-size:39px">截图与核验记录</h1><p class="detail-description">所有展示都按证据等级标明：原站现场刷新、界面留档、公开文档与本地重做。数据日期与功能实现情况分别记录。</p>'+(D.captured?notice('已接手完整结果档案：'+D.captured.coverage.data.requests+' 组数据请求，'+D.captured.coverage.data.success+' 组成功。保存结果支持原站图表与明细重放；未采集输入明确报缺失。'):'')+table(['材料','这次完成了什么','实际边界'],[['完整工作台','已登录保存 130 个功能区块及 3 个独立面板；另外重建 4 个公开体验页，共 '+D.modules.length+' 个展示入口。','保存页面不代表其中每个查询和输出已跑通。'],['指数温度','现场点击加载，重绘 9 张完整可读卡片，并保留原站截图。','境内 2026-11-19；海外 2026-11-18；未审计底层数据。'],['本地互动',localIds.length+' 个模块：计算、问卷、配置和服务文稿。','使用本页公式与手工假设；不是原站历史回测或 AI 服务。'],['技能目录','公开库 120 个 SKILL.md 逐项比对 SHA，未发现版本变化。','3 个未完成模板；公开文档与网页部署关系未全部确认。'],['工作流与组织','10 张原站工作流图；15 个公开 OPC 角色 / 记忆入口。','仅展示定义与流程，没有运行真实智能体。'],['数据接口',D.endpoints.length+' 个前端引用路径；接入 146 组已成功的保存响应。','每组输入单独计数；18 组失败与独立口令限制未填造结果。'],['此前测评','保留此前 '+D.previous.tests.length+' 条测评记录以供对照。','其中匿名访问受限结论已被本次登录成功更新；旧数值只代表当时结果。']])+(D.captured?table(['未取得成功结果的输入','状态','原站返回'],D.captured.coverage.data.failed.map(x=>['<code>'+esc(x.url)+'</code>',esc(x.status),esc(x.error)])):'')+'<div class="notice warn"><b>本次新发现：</b>创业板页面温度为 60°，页面分腿 100 / 68 / 4 / 41，按公布权重复算为 65.3°。其余本次完整可读卡片的整数结果与同一复算一致。需确认是否存在额外校准或更新时差。</div><div class="section-head"><h2>指数温度原站截图</h2><button class="small" data-go="index-temp">打开交互重绘</button></div><img class="snapshot" src="'+D.screenshot+'" alt="现场刷新后的R9指数温度原站截图"><p class="caption">采集日期 2026-11-19。已移除浏览器工具栏；账号口令没有包含在展示文件中。</p><details class="panel"><summary>展开此前测评记录（历史对照）</summary>'+table(['用例','输入 / 操作','当时页面结果','当时状态'],D.previous.tests.map(x=>[esc(x.id)+' · '+esc(x.name),esc(x.action),esc(x.result),esc(x.status)]))+'</details><div class="section-head"><h3>来源</h3></div><div class="panel"><p><a href="https://r9aihub.com/" target="_blank" rel="noreferrer">R9 AI Hub 工作台</a> · 完整页面本次保存。</p><p><a href="https://github.com/r9412460971-cloud/OPC-skill" target="_blank" rel="noreferrer">R9 OPC-skill 公开仓库</a> · Skills 目录 SHA 对照。</p><p class="meta">公开技能树版本：<code>'+esc(D.skillsRefresh.sha)+'</code></p></div>';}
function bind(){$$('[data-universe]').forEach(x=>x.onclick=()=>{universeCase=x.dataset.universe;render();});$$('[data-licai]').forEach(x=>x.onclick=()=>{licaiIndex=Number(x.dataset.licai);render();});bindModules();$$('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));$$('[data-group]').forEach(x=>x.onclick=()=>{category=x.dataset.group;go('catalog');});$$('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;render();});$$('[data-role]').forEach(x=>x.onclick=()=>{role=x.dataset.role;render();});$('#catalog-q')?.addEventListener('input',e=>{catalogQuery=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();$('#catalog-q').focus();$('#catalog-q').setSelectionRange(pos,pos);});$('#catalog-group')?.addEventListener('change',e=>{category=e.target.value;render();});$('#skill-q')?.addEventListener('input',e=>{skillQuery=e.target.value.toLowerCase();skillsTable();});$('#skill-cat')?.addEventListener('change',e=>{skillCategory=e.target.value;skillsTable();});$('#api-q')?.addEventListener('input',e=>{apiQuery=e.target.value.toLowerCase();apisTable();});$('#pipeline-select')?.addEventListener('change',e=>{workflowIndex=Number(e.target.value);render();});if($('#skill-table'))skillsTable();if($('#api-table'))apisTable();if($('#module-frame'))buildFrame(D.modules.find(x=>x.id===route));if($('#captured-frame'))buildCaptured(D.modules.find(x=>x.id===route));if($('#calc-run')){$('#calc-run').onclick=()=>calculate(route);$$('.form-stack input,.form-stack select').forEach(x=>x.addEventListener('input',()=>calculate(route)));calculate(route);}$$('[data-temp]').forEach(x=>x.onclick=()=>tempDetail(Number(x.dataset.temp)));if($('#temp-detail'))tempDetail();if($('#quiz-run'))$('#quiz-run').onclick=()=>{const score=$$('input[type=radio]:checked').reduce((a,x)=>a+Number(x.value),0),label=score<=4?'优先梳理流动性与资金底线':score<=9?'兼顾稳定与长期目标':'可进一步讨论长期波动承受与纪律';$('#quiz-result').innerHTML=notice('<b>演示访谈方向：</b>'+label+'。得分 '+score+' / 15；请继续核实收入、负债、家庭责任、资金用途及损失承受能力。');};if($('#redeem-run')){$('#redeem-run').onclick=redeemRun;redeemRun();}if($('#memo-run')){try{const saved=JSON.parse(localStorage.getItem('r9-showcase-memo-'+route)||'null');if(saved){for(const k of ['name','facts','causes','next'])$('#memo-'+k).value=saved[k]||'';memoRun();}}catch(e){}$('#memo-run').onclick=memoRun;$('#memo-save').onclick=()=>{try{const v={};for(const k of ['name','facts','causes','next'])v[k]=$('#memo-'+k).value;localStorage.setItem('r9-showcase-memo-'+route,JSON.stringify(v));$('#memo-status').textContent='已保存本机草稿。';}catch(e){$('#memo-status').textContent='当前浏览器不能保存草稿，请复制文稿。';}};$('#memo-copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#memo-output').textContent);$('#memo-copy').textContent='已复制';}catch(e){const sel=getSelection(),range=document.createRange();range.selectNodeContents($('#memo-output'));sel.removeAllRanges();sel.addRange(range);$('#memo-copy').textContent='已选中文稿，请复制';}};}}
function render(){document.body.classList.remove('nav-open');route=decodeURIComponent(location.hash.slice(1));route=({'industry-heatmap-card':'industry','industry-range-card':'industry','industry-yearly-card':'industry'})[route]||route;let m=D.modules.find(x=>x.id===route),body=route==='catalog'?catalog():route==='skills'?skills():route==='agents'?agents():route==='apis'?apis():route==='evidence'?evidence():m?detail(m):home();$('#view').innerHTML=body+'<footer class="foot">R9 AI Hub 产品展示 · 2026.11.19 · Clair Studio<br>原站界面与公开资料用于研究展示；本地重做内容已标明数据和计算边界。</footer>';$('#top-label').textContent=m?m.name:({'catalog':'完整功能目录','skills':'Skills 与工作流','agents':'OPC 智能体','apis':'数据与接口','evidence':'截图与核验记录'})[route]||'产品全景';document.title=(m?m.name+' · ':'')+'R9 AI Hub · 完整功能展示';nav();bind();}
async function init(){try{const packed=document.getElementById('r9-payload').textContent.trim(),bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(stream).text());window.R9Showcase={fv,curve,data:D,localIds};$('#nav-search').addEventListener('input',e=>{moduleQuery=e.target.value.toLowerCase();nav();});$('#menu').onclick=()=>document.body.classList.toggle('nav-open');$('#backdrop').onclick=()=>document.body.classList.remove('nav-open');$('#presentation').onclick=()=>{presentation=!presentation;document.body.classList.toggle('presentation',presentation);$('#presentation').textContent=presentation?'退出演示':'演示模式';};$('#print').onclick=()=>window.print();window.addEventListener('hashchange',()=>{mode='show';render();window.scrollTo(0,0);});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('nav-open');if(presentation){presentation=false;document.body.classList.remove('presentation');$('#presentation').textContent='演示模式';}}if(presentation&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&['ArrowRight','ArrowLeft'].includes(e.key)){let n=D.modules.findIndex(x=>x.id===route);go(D.modules[(n+(e.key==='ArrowRight'?1:-1)+D.modules.length)%D.modules.length].id);}});render();}catch(e){$('#view').innerHTML='<div class="panel"><h2>页面未能载入</h2><p>请使用支持 DecompressionStream 的较新版本 Chrome、Edge 或 Safari 打开此文件。</p><small>'+esc(e.message)+'</small></div>';}}
buildCaptured=function(m){const f=document.querySelector('#captured-frame');if(!f)return;const p=({'stars':'stars.html','dushu':'dushu.html','quant-model':'quant.html','gushou-assist':'gushou-assist.html'})[m.id]||'results.html';f.src=D.captured.baseUrl+p+(p==='results.html'?'#'+encodeURIComponent(m.id):'');};

init();
</script></body></html>
