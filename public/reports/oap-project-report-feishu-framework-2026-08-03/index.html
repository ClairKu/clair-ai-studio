<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="description" content="Clair Executive Visual Report">
  <title>Clair Executive Visual Report</title>
  <style>
    :root{
      --accent:#8067e8;--accent-2:#a992ff;--accent-soft:#eeeaff;
      --ink:#161927;--muted:#687287;--line:#e3e5ec;--paper:#fff;
      --soft:#f5f4fa;--dark:#0b1224;--dark-2:#151e36;--teal:#51b9ad;
      --serif:"Songti SC","Noto Serif SC",STSong,SimSun,serif;
      --sans:"Songti SC","Noto Serif SC",STSong,SimSun,serif;
      --mono:"Songti SC","Noto Serif SC",STSong,SimSun,serif;--nav-h:54px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:var(--nav-h);scroll-snap-type:y mandatory;scrollbar-width:none}
    html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.65;overflow-x:hidden}
    a{color:inherit}button{font:inherit}.skip{position:fixed;left:16px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:var(--dark);color:#fff}.skip:focus{top:16px}
    #reading-progress{position:fixed;left:0;top:0;z-index:90;width:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .1s linear}
    .wrap{width:min(1180px,calc(100% - 48px));margin:auto}.section{position:relative;height:calc(100svh - var(--nav-h));padding:clamp(22px,3.6vh,34px) 0;display:grid;align-items:start;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}.section>.wrap{margin-top:0;margin-bottom:0;max-height:calc(100svh - var(--nav-h) - clamp(44px,7.2vh,68px));overflow:auto}.hero-grid,.section>.wrap,.chapter-nav,.demo-tabs{scrollbar-width:none}.hero-grid::-webkit-scrollbar,.section>.wrap::-webkit-scrollbar,.chapter-nav::-webkit-scrollbar,.demo-tabs::-webkit-scrollbar{display:none}.section.soft{background:var(--soft)}.section.dark{background:radial-gradient(circle at 84% 12%,rgba(128,103,232,.18),transparent 30%),var(--dark);color:#fff}.section.dark .lead,.section.dark .item-body,.section.dark .item-meta,.section.dark .item-source{color:#aeb8cd}.section.dark .kicker{color:#b8a7ff}
    .hero{height:100svh;display:grid;align-items:center;position:relative;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;background:radial-gradient(circle at 80% 15%,rgba(169,146,255,.28),transparent 29%),linear-gradient(140deg,#fcfbff 0,#f0edff 55%,#e7e0ff 100%)}
    .hero:after{content:"";position:absolute;width:460px;height:460px;right:-120px;bottom:-210px;border:1px solid rgba(128,103,232,.22);border-radius:50%;box-shadow:0 0 0 70px rgba(128,103,232,.05),0 0 0 140px rgba(128,103,232,.035)}
    .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:50px;align-items:end;max-height:100svh;padding:clamp(56px,9vh,90px) 0 clamp(42px,7vh,68px);overflow:auto}
    .eyebrow,.kicker{font:800 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
    .hero h1{margin:16px 0 16px;max-width:780px;font:600 clamp(46px,6vw,76px)/1.02 var(--serif);letter-spacing:-.035em}.hero h1 em{font-style:normal;color:var(--accent)}
    .subtitle{max-width:740px;margin:0;color:#586276;font-size:18px}.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}.badge{padding:7px 11px;border:1px solid rgba(128,103,232,.22);border-radius:999px;background:rgba(255,255,255,.56);color:#5c49bd;font-size:11px;font-weight:800}.hero-actions{display:flex;gap:10px;margin-top:18px}.download-button{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:12px;background:var(--dark);color:#fff;text-decoration:none;font-size:12px;font-weight:800;box-shadow:0 12px 28px rgba(18,25,45,.14)}.download-button:after{content:"↓";color:var(--accent-2)}
    .thesis-card{padding:28px;border:1px solid rgba(128,103,232,.2);border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 30px 80px rgba(73,54,145,.13);backdrop-filter:blur(14px)}.thesis-card small{font:800 10px var(--mono);color:var(--accent);letter-spacing:.12em}.thesis-card h2{margin:14px 0;font:600 30px/1.28 var(--serif)}.thesis-card p{margin:0;color:#626d80;font-size:13px}.hero-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.hero-meta div{padding-top:12px;border-top:1px solid rgba(128,103,232,.18)}.hero-meta b{display:block;font-size:11px}.hero-meta span{display:block;color:#778196;font-size:10px}
    .nav-shell{position:sticky;top:0;z-index:70;height:var(--nav-h);border-bottom:1px solid rgba(226,228,235,.88);background:rgba(255,255,255,.9);backdrop-filter:blur(18px)}.nav-inner{height:var(--nav-h);display:flex;align-items:center;gap:12px}.brand{flex:0 0 auto;display:flex;align-items:center;color:inherit;text-decoration:none;font:800 11px var(--serif);letter-spacing:.06em;cursor:pointer;white-space:nowrap}.brand:hover{color:var(--accent)}.brand i{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;font-style:normal}.chapter-nav{display:flex;gap:4px;min-width:0;overflow:auto;scroll-behavior:smooth;scrollbar-width:none}.chapter-nav:after{content:"";flex:0 0 calc(50% - 64px)}.chapter-nav::-webkit-scrollbar{display:none}.chapter-nav a{flex:0 0 auto;padding:6px 9px;border-radius:999px;color:#717b8e;text-decoration:none;font-size:12px;line-height:1.2;white-space:nowrap;transition:color .2s ease,background .2s ease}.chapter-nav a:hover,.chapter-nav a.active{background:var(--accent-soft);color:#5b47c7}.menu-button{display:none;margin-left:auto;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .section-head{display:grid;grid-template-columns:minmax(0,760px);gap:10px;align-content:end;align-items:start;height:108px;margin-bottom:12px;overflow:hidden}.section-head>div{min-width:0;max-height:100%;overflow:hidden}.section-head h2{display:-webkit-box;margin:12px 0 0;overflow:hidden;font:600 clamp(30px,2.6vw,36px)/1.08 var(--serif);letter-spacing:-.025em;word-break:normal;overflow-wrap:anywhere;-webkit-box-orient:vertical;-webkit-line-clamp:2}.lead{display:-webkit-box;width:100%;margin:0;padding-left:0;overflow:hidden;color:var(--muted);font-size:13.5px;line-height:1.55;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .items{display:grid;gap:12px}.cards,.comparison,.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.item{position:relative;min-width:0;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}.dark .item{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.06)}.item-index{display:block;margin-bottom:18px;font:800 11px var(--serif);color:var(--accent)}.item-eyebrow{font:800 9px var(--serif);letter-spacing:.1em;color:var(--accent)}.item h3{margin:7px 0 6px;font:600 20px/1.22 var(--serif)}.item-body{margin:0;color:var(--muted);font-size:12.5px}.item-meta{display:block;margin-top:7px;color:#80899a;font-size:10px}.item ul{margin:12px 0 0;padding:11px 0 0 18px;border-top:1px solid var(--line);color:#4f5b70;font-size:11.5px}.dark .item ul{border-color:rgba(255,255,255,.11);color:#d4daE6}.item-source{display:block;margin-top:12px;color:#8b93a2;font-size:9px}.status{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:4px 7px;border-radius:999px;background:#eef0f4;color:#667084;font-size:9px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#8f98aa}.status.confirmed{background:#e6f6f2;color:#26786f}.status.confirmed:before{background:var(--teal)}.status.inferred{background:#fff4dc;color:#9a6817}.status.inferred:before{background:#e0a32f}.status.missing{background:#feecef;color:#ad4454}.status.missing:before{background:#d65869}.status.target{background:var(--accent-soft);color:#6650cf}.status.target:before{background:var(--accent)}
    .metric{display:block;margin:4px 0 14px;font:600 clamp(36px,4vw,54px)/1 var(--serif);letter-spacing:-.035em;color:var(--accent)}.metrics .item{min-height:205px}.metrics .item h3{font-size:17px}
    .architecture{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.architecture .item{display:block;min-height:300px;padding:18px}.architecture .item-index{margin:0 0 18px;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--accent-soft);font-size:12px}.architecture .item ul{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}.architecture .item:after{content:"→";position:absolute;right:-15px;top:28px;z-index:2;color:var(--accent);font-size:18px}.architecture .item:last-child:after{display:none}
    .timeline{grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.timeline .item{border-radius:0;border-right:0}.timeline .item:first-child{border-radius:24px 0 0 24px}.timeline .item:last-child{border-right:1px solid var(--line);border-radius:0 24px 24px 0}.timeline .item:before{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:var(--accent);opacity:calc(.45 + var(--n,0) * .15)}
    .process{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.process .item{padding:22px}.process .item:not(:last-child):after{content:"→";position:absolute;right:-11px;top:50%;z-index:2;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--dark);color:#fff;font-size:10px}.process .item h3{font-size:18px}
    .evidence{grid-template-columns:repeat(2,minmax(0,1fr))}.evidence .item{padding:0}.evidence-copy{padding:22px}.evidence figure{margin:0;background:#edeaf7;aspect-ratio:16/9;overflow:hidden}.evidence img{display:block;width:100%;height:100%;object-fit:cover}.evidence-placeholder{height:100%;display:grid;place-items:center;color:#7865d5;font:800 11px var(--mono);letter-spacing:.12em}
    .comparison .item:nth-child(2n){background:linear-gradient(145deg,#171f37,#0c1326);color:#fff;border-color:#222c47}.comparison .item:nth-child(2n) .item-body,.comparison .item:nth-child(2n) ul{color:#bdc6d7}.actions .item-index{position:absolute;right:18px;top:6px;margin:0;font:600 84px/1 var(--serif);color:#f0eef8}.actions .item>*:not(.item-index){position:relative}.actions .item h3{margin-top:60px}
    .demo{display:block;padding:11px;border-radius:22px;background:linear-gradient(145deg,var(--dark),var(--dark-2))}.demo-tabs{display:flex;gap:6px;overflow:auto;padding:3px 3px 10px;scrollbar-width:none}.demo-tab{flex:1;min-width:145px;padding:9px 11px;border:0;border-radius:10px;background:rgba(255,255,255,.07);color:#b8c2d5;cursor:pointer;text-align:left}.demo-tab b{display:block;color:#fff;font-size:11px}.demo-tab span{font-size:9px}.demo-tab.active{background:linear-gradient(135deg,var(--accent),#6c54d8);color:#eee9ff}.demo-stage{min-height:400px;border-radius:16px;background:radial-gradient(circle at 20% 10%,rgba(128,103,232,.17),transparent 32%),#f4f2fb;overflow:hidden}.demo-panel{display:none;grid-template-columns:minmax(250px,.72fr) minmax(0,1.28fr);gap:28px;align-items:center;min-height:400px;padding:28px}.demo-panel.active{display:grid}.demo-visual{min-height:280px;padding:22px;border-radius:18px;background:#fff;box-shadow:0 20px 54px rgba(18,25,48,.11)}.demo-visual .item-index{margin-bottom:46px}.demo-panel h3{margin:9px 0;font:600 28px/1.15 var(--serif)}.demo-panel p{color:#657085}.demo-panel ul{padding-left:18px;color:#536076}
    .callout{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:14px;padding:13px 16px;border-radius:14px;background:var(--accent-soft);color:#4e3ca8}.dark .callout{background:rgba(169,146,255,.13);color:#eeeaff}.callout b{font:800 9px var(--serif);letter-spacing:.08em}.callout p{margin:0;font:600 14px/1.45 var(--serif)}
    .closing{background:linear-gradient(140deg,#0b1224,#171f3b);color:#fff}.closing-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px}.closing h2{margin:14px 0;font:600 44px/1.08 var(--serif)}.source-list,.question-list{display:grid;gap:10px}.source,.question{padding:14px 16px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(255,255,255,.055)}.source b,.question b{display:block;font-size:11px}.source span,.question span{display:block;color:#9eabc2;font-size:10px;overflow-wrap:anywhere}.footer{padding:28px 0;background:#080e1d;color:#78859e;font-size:10px;scroll-snap-align:end}.footer-inner{display:flex;justify-content:space-between;gap:18px}
    .page-rail{position:fixed;right:10px;top:50%;z-index:65;display:grid;gap:6px;transform:translateY(-50%);padding:9px 6px;border:1px solid rgba(227,229,236,.8);border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 16px 38px rgba(18,25,45,.08);backdrop-filter:blur(12px)}.page-dot{width:8px;height:8px;padding:0;border:0;outline:none;border-radius:999px;background:#c9cbd5;cursor:pointer;transition:height .22s ease,background .22s ease,transform .22s ease}.page-dot:hover,.page-dot.active{height:22px;background:var(--accent)}.page-dot:focus-visible:not(.active){background:var(--accent-2);transform:scale(1.2)}.page-counter{position:fixed;right:10px;bottom:10px;z-index:64;padding:7px 9px;border:1px solid rgba(227,229,236,.82);border-radius:9px;background:rgba(255,255,255,.78);color:#697286;box-shadow:0 12px 30px rgba(18,25,45,.07);backdrop-filter:blur(10px);font:800 10px var(--serif)}
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}.reveal.visible{opacity:1;transform:none}
    @media(max-width:980px){.hero-grid{grid-template-columns:1fr;gap:28px}.section-head{grid-template-columns:minmax(0,760px);gap:10px;align-items:start;height:120px}.section-head h2{font-size:34px}.lead{padding-left:0;-webkit-line-clamp:2}.cards,.comparison,.actions{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.architecture{grid-template-columns:repeat(2,1fr)}.architecture .item{min-height:0}.architecture .item:after{display:none}.timeline{grid-template-columns:repeat(2,1fr);gap:10px}.timeline .item,.timeline .item:first-child,.timeline .item:last-child{border:1px solid var(--line);border-radius:18px}.process{grid-template-columns:repeat(2,1fr)}.process .item:after{display:none}.closing-grid{grid-template-columns:1fr}}
    @media(max-width:840px){.chapter-nav{display:none}.menu-button{display:block}.nav-shell.open .chapter-nav{position:absolute;left:18px;right:18px;top:calc(var(--nav-h) - 2px);display:grid;max-height:65vh;padding:10px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 24px 60px rgba(18,25,45,.16);overflow:auto}.nav-shell.open .chapter-nav a{padding:9px 11px}}
    @media(max-width:720px){:root{--nav-h:50px}.wrap,.section>.wrap{width:min(100% - 28px,1180px)}.section{height:calc(100svh - var(--nav-h));padding:24px 0}.section>.wrap{max-height:calc(100svh - var(--nav-h) - 48px)}.hero-grid{padding:58px 0 38px}.hero h1{font-size:42px}.subtitle{font-size:14px}.thesis-card{padding:20px}.hero-meta{grid-template-columns:1fr}.brand span{display:none}.section-head{height:136px;margin-bottom:10px}.section-head h2{font-size:29px}.lead{padding-left:0;font-size:12.5px;line-height:1.55}.cards,.metrics,.comparison,.actions,.timeline,.process,.evidence,.architecture{grid-template-columns:1fr}.item{padding:18px}.architecture .item{min-height:0}.architecture .item-index{width:40px;height:40px;margin-bottom:14px}.architecture .item:after{display:none}.demo{margin-left:-7px;margin-right:-7px;padding:8px;border-radius:18px}.demo-tab{min-width:130px}.demo-stage{min-height:0}.demo-panel{grid-template-columns:1fr;min-height:0;padding:18px}.demo-visual{min-height:220px;padding:18px}.demo-visual .item-index{margin-bottom:28px}.demo-panel h3{font-size:24px}.callout{grid-template-columns:1fr}.callout .status{justify-self:start}.footer-inner{display:grid}.closing h2{font-size:32px}.page-rail{right:4px;gap:4px;padding:7px 4px}.page-dot{width:7px;height:7px}.page-dot:hover,.page-dot.active{height:18px}.page-counter{right:6px;bottom:6px}}
    @media print{html{scroll-snap-type:none}#reading-progress,.nav-shell,.demo-tabs,.skip,.page-rail,.page-counter{display:none!important}.section,.hero{height:auto;min-height:auto;overflow:visible;scroll-snap-align:none}.section{padding:48px 0;break-inside:avoid}.section>.wrap,.hero-grid{max-height:none;overflow:visible}.reveal{opacity:1;transform:none}.demo-panel{display:grid!important;break-after:page}.hero-grid{padding:60px 0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}#reading-progress{transition:none}}
  </style>
</head>

类框架"}],"callout":{"label":"设计意图","text":"源文档明确写了目的：将来增加新能力、或者新类型的资产（如知识库）时，不需要重新推翻分类，可直接纳入管理。","status":"confirmed"}},{"id":"capability","kicker":"06 · 能力建设","title":"三层能力各有主线","lead":"MCP 修问题并扩持仓类，Skill 做收敛与统一治理，Agent 搭自有 runtime；内外部能力接入三条线进度不一。治理台账挂在飞书资产治理 Base。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"MCP","title":"先修问题再扩能力","body":"已梳理当前 OAP 对外接口存在的问题，并提交给老吴团队专人对接各接口提供方修复。","bullets":["规划新增 10 个持仓类 MCP","持仓类鉴权需走登录授权，需同步开发","随源文档附《盈米 MCP 质量审计报告》，本报告未展开其结论"],"meta":"10 个持仓类 MCP 为规划数，未上线","status":"confirmed","source":"飞书当前源文档 · revision 66 · P8 能力建设与治理"},{"index":"02","eyebrow":"SKILL","title":"不追数量只追质量","body":"下一步迭代围绕 MCP 的迭代进行，不追求数量；对先前一批 Skills 做收敛和精细化修改，优化第三方平台调用盈米 MCP 的准确性与调用质量。","bullets":["开始对多来源 Skills 做统一化管理","把散落在各 BU 或产品的 Skills 逐步纳入 Stargate 治理体系"],"status":"confirmed","source":"飞书当前源文档 · revision 66 · P8 能力建设与治理"},{"index":"03","eyebrow":"AGENT","title":"自有 runtime 在建","body":"老吴团队正在搭建盈米自有的 Agent runtime，盈米内部搭建的 Agent 也会基于这一体系；治理与调试通过 Stargate 和 AI marketplace 或盈米 AI 实验室来承接。","bullets":["未来会有基于第三方平台 runtime 搭 Agent 的场景","因此更重要的是保持 Skills + MCP 能力矩阵的模块化与精细化"],"status":"confirmed","source":"飞书当前源文档 · revision 66 · P8 能力建设与治理"}],"callout":{"label":"建设主线","text":"三层能力的共同前提是模块化：MCP 保证接口可靠，Skills 保证调用准确，Agent 保证任务完整；哪一层不收敛，上面的平台接入都会放大它的缺陷。","status":"inferred"}},{"id":"integrations","kicker":"06 · 内外部接入","title":"三条线进度都未完成","lead":"两条内部线、一条外部线，都还在进行中，且外部线已出现合作模式变更；三者都没有完成时间。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"内部 · 薛老师团队","title":"财报 MCP 先供内部","body":"财报 MCP 已纳入 OAP 的规划，先支持盈米内部员工通过 OAP 调用相关能力，尚未对外开放。","meta":"进行中 · 先内部后对外","status":"confirmed","source":"飞书当前源文档 · revision 66 · P9 内外部能力接入"},{"index":"02","eyebrow":"内部 · 投研 Vesta","title":"商化模式仍在规划","body":"先前已与 Vesta 团队同步后续 OAP 的商业化模式，7.21 反馈其内部还在规划中，暂无结论。","meta":"进行中 · 7.21 最新反馈","status":"confirmed","source":"飞书当前源文档 · revision 66 · P9 内外部能力接入"},{"index":"03","eyebrow":"外部 · 火富牛","title":"合作模式已有调整","body":"评估火富牛私募数据的合作接入进展；7.28 反馈与火富牛 MCP 的合作模式有调整， 效率——AI 产品建设需要这些面向 AI 的能力与工具储备；二是回答 AI 小顾与且慢如何破圈的问题。","bullets":["2025 年 2 月肖总、永哥在 AI 会上提出希望找到破圈办法","当时 MCP 还没盛行，实验室是最初想法","MCP 协议火起来后，先开启了一系列 AI 开放平台能力建设"],"meta":"起点时间 2025-02，早于 MCP 普及","status":"confirmed","source":"飞书当前源文档 · revision 66 · P13 下一步：AI 实验室"},{"index":"02","eyebrow":"HOW","title":"集众人之力做全民 AI","body":"单场景破圈速度有限，因此希望集众人之力，在且慢小顾上做一个全民 AI，有点像豆包这样的工具集场域。","bullets":["快速放上基于新推理模型做出的工具与服务场景","放公司员工竞赛成果","让用户自主探索、发布、分享自己的场景服务与智能体","优势：可在模型上集成用户自身数据、平台数据与投顾工具 api"],"status":"confirmed","source":"飞书当前源文档 · revision 66 · P13 下一步：AI 实验室"},{"index":"03","eyebrow":"PURPOSE","title":"三个明确的目的","body":"源文档把实验室的目的写成三条，其中第二条是风险边界，不是增长目标。","bullets":["吸引用户：让用户能用上推理模型在金融投资场景，参与到 AI 热潮中","规避风险：与用户做好约定告知，明确这是一个探索性的实验室场域","集结力量：靠大家一起去找到破圈点"],"status":"confirmed","source":"飞书当前源文档 · revision 66 · P13 下一步：AI 实验室"},{"index":"04","eyebrow":"PRODUCT","title":"与官网结合的低代码","body":"初步规划是后续和 OAP 官网结合在一起，支持创作类用户通过低代码方式搭建自己的 AI 应用，并把搭好的应用快速分发到自己的工作环境（小顾也有可能是其中一个）；参考电商方式，区分使用与创作两种界面形态。","bullets":["商业模式：能力调用 + AI 资产交易","初版设计稿仍在持续设计中，不代表已上线"],"meta":"规划态 · 初版设计稿持续迭代中","status":"target","source":"飞书当前源文档 · revision 66 · P13 下一步：AI 实验室（含 lovable 设计稿链接）"}],"callout":{"label":"方案缺口","text":"源文档 P14「下一步：Agent 服务输出」只有标题、没有正文；本报告不补写方案，登记为待补。结合 P1 的 0% 完成度，实验室是十项里唯一既缺实际值又缺落地方案的一项。","status":"missing"}},{"id":"monetization","kicker":"08 · 商化准备","title":"需求已在，方案未定","lead":"需求侧已有明确信号，方案侧仍是计划清单；源文档没有正式价格、成交或收入数据，本报告不外推定价与收入。","layout":"actions","tone":"soft","items":[{"index":"01","eyebrow":"DEMAND","title":"两类付费需求已出现","body":"一是个人使用额度扩充需求，二是付费咨询需求 30+。后者的统计区间、去重规则与转化口径源文档未给，不能直接当成 30 个可成交机会。","meta":"责任人 / 时间：待确认；30+ 的统计口径待补","status":"missing","source":"飞书当前源文档 · revision 66 · P15 商化准备"},{"index":"02","eyebrow":"PRICING","title":"个人版企业版双方案","body":"计划推出个人版与企业版两套收费方案。源文档只给方案方向，未给档位、价格与生效时间。","meta":"责任人 / 时间：待确认；价格与档位未定","status":"target","source":"飞书当前源文档 · revision 66 · P15 商化准备"},{"index":"03","eyebrow":"OPERATION","title":"四项配套仍是清单","body":"收费方案之外还有四项配套动作，目前均处于计划状态。","bullets":["积分体系建设","用户激励   <script>
    const report=JSON.parse(document.getElementById("report-data").textContent);
    const $=(selector,scope=document)=>scope.querySelector(selector);

    const bullets=items=>Array.isArray(items)&&items.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`:"";
    const common=item=>`${item.index?`<span class="item-index">${esc(item.index)}</span>`:""}${item.eyebrow?`<span class="item-eyebrow">${esc(item.eyebrow)}</span>`:""}${item.metric?`<strong class="metric">${esc(item.metric)}</strong>`:""}<h3>${esc(item.title)}</h3>${item.body?`<p class="item-body">${esc(item.body)}</p>`:""}${item.meta?`<span class="item-meta">${esc(item.meta)}</span>`:""}${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}${status(item.status)}`;
    const card=(item,index)=>`<article class="item reveal" style="--n:${index}">${common(item)}</article>`;
    function evidence(item){return `<article class="item reveal"><figure>${item.image?`<img src="${esc(item.image)}" alt="${esc(item.alt||item.title)}" loading="lazy">`:`<div class="evidence-placeholder">SOURCE / EVIDENCE</div>`}</figure><div class="evidence-copy">${common(item)}</div></article>`}
    function demo(section){const tabs=section.items.map((item,index)=>`<button class="demo-tab ${index===0?"active":""}" type="button" data-demo-tab="${index}"><b>${esc(item.title)}</b><span>${esc(item.eyebrow||item.meta||"")}</span></button>`).join("");const panels=section.items.map((item,index)=>`<article class="demo-panel ${index===0?"active":""}" data-demo-panel="${index}"><div class="demo-visual"><span class="item-index">${esc(item.index||String(index+1).padStart(2,"0"))}</span><span class="item-eyebrow">${esc(item.eyebrow||"SCENE")}</span><h3>${esc(item.title)}</h3>${status(item.status)}</div><div><span class="item-eyebrow">${esc(item.meta||"EXPERIENCE WALKTHROUGH")}</span><h3>${esc(item.title)}</h3><p>${esc(item.body||"")}</p>${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}</div></article>`).join("");return `<div class="items demo reveal"><div class="demo-tabs">${tabs}</div><div class="demo-stage">${panels}</div></div>`}
    function sectionMarkup(section,index){const tone=section.tone||"light";const content=section.layout==="demo"?demo(section):`<div class="items ${esc(section.layout)}">${section.items.map((item,itemIndex)=>section.layout==="evidence"?evidence(item):card(item,itemIndex)).join("")}</div>`;const callout=section.callout?`<div class="callout reveal"><b>${esc(section.callout.label||"KEY TAKEAWAY")}</b><p>${esc(section.callout.text)}</p>${status(section.callout.status)}</div>`:"";return `<section class="section ${esc(tone)}" id="${esc(section.id)}"><div class="wrap"><header class="section-head reveal"><div><div class="kicker">${esc(section.kicker||String(index+1).padStart(2,"0"))}</div><h2>${esc(section.title)}</h2></div><p class="lead">${esc(section.lead||"")}</p></header>${content}${callout}</div></section>`}
    document.documentElement.style.setProperty("--accent",report.meta?.accent||"#8067e8");

    $("#hero-conclusion").textContent=report.hero?.conclusion||"";
    $("#hero-thesis").textContent=report.hero?.thesis||"";
    $("#hero-badges").innerHTML=(report.hero?.badges||[]).map(value=>`<span class="badge">${esc(value)}</span>`).join("");
    $("#hero-actions").innerHTML=report.meta?.downloadUrl?`<a class="download-button" href="${esc(report.meta.downloadUrl)}" download>${esc(report.meta.downloadLabel||"下载交付物")}</a>`:"";
    $("#hero-meta").innerHTML=[["报告日期",report.meta?.date],["材料截止",report.meta?.cutoff],["责任方",report.meta?.owner],["范围",report.meta?.confidentiality]].filter(([,value])=>value).map(([label,value])=>`<div><b>${esc(label)}</b><span>${esc(value)}</span></div>`).join("");
    $("#main").innerHTML=(report.sections||[]).map(sectionMarkup).join("");
    $("#chapter-nav").innerHTML=(report.sections||[]).map((section,index)=>`<a href="#${esc(section.id)}"><span>${String(index+1).padStart(2,"0")}</span> ${esc(section.title)}</a>`).join("")+`<a href="#sources">证据边界</a>`;
    $("#source-list").innerHTML=(report.sources||[]).length?(report.sources||[]).map((source,index)=>`<div class="source"><b>${String(index+1).padStart(2,"0")} · ${esc(source.label||source.title||"来源")}</b><span>${esc(source.detail||source.url||"")}</span></div>`).join(""):`<div class="source"><b>暂无外部来源</b><span>请在 report.json 中补充来源、版本与日期。</span></div>`;
    $("#question-list").innerHTML=(report.openQuestions||[]).length?(report.openQuestions||[]).map((question,index)=>`<div class="question"><b>${String(index+1).padStart(2,"0")} · ${esc(question.title||"待确认")}</b><span>${esc(question.detail||question.body||"")}</span></div>`).join(""):`<div class="question"><b>当前无公开待确认项</b><span>仍需在发布前复核材料权限、敏感性与最新版本。</span></div>`;
    $("#footer-left").textContent=`${report.meta?.title||"报告"} · 截至 ${report.meta?.cutoff||"待确认"}`;
    const panels=[$("#top"),...document.querySelectorAll("main>section"),$("#sources")];
    const panelLabels=["报告封面",...(report.sections||[]).map(section=>section.title),"证据边界"];
    const chapterNav=$("#chapter-nav");
    const navLinks=[...document.querySelectorAll(".chapter-nav a")];
    const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    let activePanelIndex=0;
    let scrollFrame=0;
    let navigating=false;
    let restoreScrollStyles=null;
    const syncChapterNav=()=>{const panel=panels[activePanelIndex];const href=panel?.id==="top"?null:`#${panel?.id}`;let activeLink=null;navLinks.forEach(link=>{const active=link.getAttribute("href")===href;link.classList.toggle("active",active);if(active)activeLink=link});let left=0;if(activeLink){const navRect=chapterNav.getBoundingClientRect();const linkRect=activeLink.getBoundingClientRect();const linkCenter=linkRect.left-navRect.left+chapterNav.scrollLeft+linkRect.width/2;left=linkCenter-chapterNav.clientWidth/2}chapterNav.scrollTo({left:Math.max(0,left),behavior:reducedMotion?"auto":"smooth"})};
    const setActivePanel=index=>{activePanelIndex=Math.max(0,Math.min(panels.length-1,index));document.querySelectorAll("[data-page-index]").forEach(node=>node.classList.toggle("active",Number(node.dataset.pageIndex)===activePanelIndex));$("#page-counter").textContent=`${String(activePanelIndex+1).padStart(2,"0")} / ${String(panels.length).padStart(2,"0")}`;syncChapterNav()};
    const cancelPanelNavigation=()=>{if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=0;navigating=false;if(restoreScrollStyles){restoreScrollStyles();restoreScrollStyles=null}};
    const goToPanel=index=>{cancelPanelNavigation();const target=Math.max(0,Math.min(panels.length-1,index));const panel=panels[target];const navOffset=panel.id==="top"?0:$("#nav-shell").offsetHeight;const targetY=Math.max(0,panel.offsetTop-navOffset);const startY=scrollY;const distance=targetY-startY;setActivePanel(target);if(reducedMotion||Math.abs(distance)<2){scrollTo(0,targetY);return}const root=document.documentElement;const previousBehavior=root.style.scrollBehavior;const previousSnap=root.style.scrollSnapType;root.style.scrollBehavior="auto";root.style.scrollSnapType="none";restoreScrollStyles=()=>{root.style.scrollBehavior=previousBehavior;root.style.scrollSnapType=previousSnap};navigating=true;const started=performance.now();const duration=Math.min(520,320+Math.abs(distance)*.018);const tick=now=>{const progress=Math.min(1,(now-started)/duration);const eased=1-Math.pow(1-progress,4);scrollTo(0,startY+distance*eased);if(progress<1){scrollFrame=requestAnimationFrame(tick);return}scrollTo(0,targetY);scrollFrame=0;navigating=false;restoreScrollStyles();restoreScrollStyles=null};scrollFrame=requestAnimationFrame(tick)};
    $("#page-rail").innerHTML=panels.map((panel,index)=>`<button class="page-dot${index===0?" active":""}" type="button" data-page-index="${index}" aria-label="跳转到第 ${index+1} 屏：${esc(panelLabels[index]||panel.id)}"></button>`).join("");
    setActivePanel(0);
    document.addEventListener("click",event=>{const tab=event.target.closest("[data-demo-tab]");if(!tab)return;const demoRoot=tab.closest(".demo");demoRoot.querySelectorAll("[data-demo-tab]").forEach(node=>node.classList.toggle("active",node===tab));demoRoot.querySelectorAll("[data-demo-panel]").forEach(node=>node.classList.toggle("active",node.dataset.demoPanel===tab.dataset.demoTab))});
    $("#page-rail").addEventListener("click",event=>{const dot=event.target.closest("[data-page-index]");if(dot)goToPanel(Number(dot.dataset.pageIndex))});
    $("#back-to-top").addEventListener("click",event=>{event.preventDefault();goToPanel(0)});
    addEventListener("keydown",event=>{if(event.defaultPrevented||event.metaKey||event.ctrlKey||event.altKey||event.shiftKey||event.target.closest("input,textarea,select,button,a,[contenteditable=true]"))return;const next=["ArrowDown","ArrowRight","PageDown"].includes(event.key);const previous=["ArrowUp","ArrowLeft","PageUp"].includes(event.key);if(next||previous||event.key==="Home"||event.key==="End"){event.preventDefault();goToPanel(event.key==="Home"?0:event.key==="End"?panels.length-1:activePanelIndex+(next?1:-1))}});
    $("#menu-button").addEventListener("click",()=>{const shell=$("#nav-shell");const open=shell.classList.toggle("open");$("#menu-button").setAttribute("aria-expanded",String(open))});
    chapterNav.addEventListener("click",event=>{const link=event.target.closest("a");if(link){const target=panels.findIndex(panel=>`#${panel.id}`===link.getAttribute("href"));if(target>=0){event.preventDefault();goToPanel(target)}}$("#nav-shell").classList.remove("open");$("#menu-button").setAttribute("aria-expanded","false")});
    const reveals=[...document.querySelectorAll(".reveal")];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target)}}),{threshold:.12});reveals.forEach(node=>observer.observe(node));
    const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!navigating)setActivePanel(panels.indexOf(entry.target))}),{rootMargin:"-34% 0px -50%",threshold:0});panels.forEach(section=>sectionObserver.observe(section));
    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});
    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};addEventListener("scroll",updateProgress,{passive:true});updateProgress();
  </script>
</body>
</html>
