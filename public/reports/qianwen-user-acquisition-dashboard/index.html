<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="千问 X 且慢AI小顾用户数据看板，展示服务上线以来的绑定用户、新用户、老用户及每日增长明细。" />
  <meta name="theme-color" content="#f5f6fb" />
  <meta name="robots" content="noindex,nofollow" />
  <title>千问 X 且慢AI小顾｜用户数据看板</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" aria-label="回到页面顶部">
        <span class="brand-mark" aria-hidden="true"><i>Q</i><b>且</b></span>
        <span class="brand-copy"><strong>千问 X 且慢AI小顾</strong><small>用户增长看板</small></span>
      </a>
      <div class="topbar-actions">
        <span class="freshness" id="freshness"><i aria-hidden="true"></i><span>正在读取数据</span></span>
        <button class="refresh-button" id="refresh-button" type="button" aria-busy="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>
          <span>更新数据</span>
        </button>
      </div>
    </div>
    <div class="refresh-status" id="refresh-status" role="status" aria-live="polite"></div>
  </header>

  <main id="main">
    <section class="hero shell" id="top" aria-labelledby="hero-title">
      <div class="hero-heading">
        <p class="eyebrow">SERVICE LAUNCH · SINCE 2026.08.10 08:00</p>
        <h1 id="hero-title">千问 X 且慢AI小顾<br /><span>用户数据看板</span></h1>
        <p class="hero-lead" id="hero-lead">正在读取服务上线以来的最新用户数据。</p>
      </div>

      <div class="kpi-heading">
        <div>
          <h2>关键数据</h2>
          <p id="kpi-scope">服务上线以来</p>
        </div>
        <span>选择指标，查看对应走势</span>
      </div>
      <fieldset class="kpi-switch" aria-controls="trend-chart detail-table">
        <legend class="sr-only">选择要查看的指标</legend>
        <label class="kpi-card kpi-bound">
          <input type="radio" name="metric" value="bound" checked />
          <span class="kpi-select">累计绑定用户</span>
          <strong id="bound-total">—</strong>
          <small id="bound-context">服务上线以来</small>
          <i aria-hidden="true">查看走势</i>
        </label>
        <label class="kpi-card kpi-new">
          <input type="radio" name="metric" value="new" />
          <span class="kpi-select">其中新用户</span>
          <div><strong id="new-accounts">—</strong><em id="new-share">—</em></div>
          <small>上线后新注册且慢</small>
          <i aria-hidden="true">查看走势</i>
        </label>
        <label class="kpi-card kpi-existing">
          <input type="radio" name="metric" value="existing" />
          <span class="kpi-select">老用户</span>
          <div><strong id="existing-accounts">—</strong><em id="existing-share">—</em></div>
          <small>上线前已注册且慢</small>
          <i aria-hidden="true">查看走势</i>
        </label>
      </fieldset>
    </section>

    <section class="analysis shell" aria-labelledby="analysis-title">
      <div class="analysis-head">
        <div>
          <p class="eyebrow">INTERACTIVE USER GROWTH</p>
          <h2 id="analysis-title">用户增长走势</h2>
        </div>
        <div class="analysis-controls">
          <fieldset class="segmented" aria-label="选择走势形式">
            <legend>走势</legend>
            <label><input type="radio" name="trend" value="daily" /><span>每日新增</span></label>
            <label><input type="radio" name="trend" value="cumulative" checked /><span>累计</span></label>
          </fieldset>
          <fieldset class="segmented range-segmented" aria-label="选择时间范围">
            <legend>时间</legend>
            <label><input type="radio" name="range" value="since-launch" checked /><span>上线以来</span></label>
            <label><input type="radio" name="range" value="last-7"><span>近 7 日</span></label>
            <label><input type="radio" name="range" value="custom"><span>自定义</span></label>
          </fieldset>
        </div>
      </div>

      <form class="custom-range" id="custom-range" hidden>
        <label>开始日期<input id="range-start" type="date" /></label>
        <span aria-hidden="true">至</span>
        <label>结束日期<input id="range-end" type="date" /></label>
        <button type="submit">应用</button>
        <p id="range-error" role="alert"></p>
      </form>

      <div class="analysis-canvas">
        <div class="chart-summary">
          <div>
            <span id="analysis-label">累计绑定用户</span>
            <strong id="analysis-value">—</strong>
          </div>
          <p id="analysis-context">正在读取趋势数据。</p>
        </div>
        <div class="chart-wrap" id="chart-wrap">
          <svg id="trend-chart" viewBox="0 0 1040 420" role="img" aria-labelledby="chart-title chart-desc" data-metric="bound" data-trend="cumulative">
            <title id="chart-title">服务上线以来累计绑定用户走势</title>
            <desc id="chart-desc">展示服务上线以来累计绑定用户随时间变化。</desc>
          </svg>
          <div class="chart-tooltip" id="chart-tooltip" hidden></div>
        </div>
        <p class="chart-note" id="chart-note"></p>
        <output class="sr-only" id="selection-announcement" aria-live="polite"></output>
      </div>

      <section class="details" aria-labelledby="details-title">
        <div class="details-head">
          <div>
            <p class="eyebrow">LINKED DATA DETAIL</p>
            <h2 id="details-title">对应数据明细</h2>
          </div>
          <p><strong id="detail-range">—</strong><span id="detail-count">—</span></p>
        </div>
        <p class="scroll-hint" id="table-scroll-hint">可左右滑动查看完整数据</p>
        <div class="table-scroll" role="region" tabindex="0" aria-labelledby="details-title" aria-describedby="table-scroll-hint">
          <table id="detail-table">
            <caption class="sr-only">所选时间范围内每天的绑定用户、新用户、老用户增量、占比与累计数据</caption>
            <thead id="detail-head"></thead>
            <tbody id="daily-table"></tbody>
          </table>
        </div>
        <p class="data-footnote" id="data-footnote"></p>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./data/fallback-data.js"></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
