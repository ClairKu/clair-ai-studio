h。","source":"盈米官网 robots.txt、sitemap.xml 与 HTML 响应检查 · 2026-08-26","status":"confirmed"},{"index":"02","eyebrow":"QIEMAN.COM","title":"且慢机器入口返回 SPA","body":"robots.txt 与 sitemap.xml 均返回约 61KB 的首页 HTML；服务端首屏正文极少，H1、canonical、OpenGraph 缺失。","source":"且慢官网 robots.txt、sitemap.xml 与 HTML 响应检查 · 2026-08-26","status":"confirmed"},{"index":"03","eyebrow":"GEO PRINCIPLE","title":"SEO 仍是 GEO 底座","body":"Google 明确指出 AI 功能仍依赖核心搜索索引和检索系统；独特、准确、可访问的内容比批量同质文本更重要。","source":"Google Search AI features and your website / Generative AI content guidance · 2026","status":"confirmed"}],"callout":{"label":"结构性损失","text":"当官方页面不可发现或不可理解时，模型只能依赖分发平台与第三方材料，品牌无法稳定控制事实、截止日和下一步入口。","status":"inferred"}},{"id":"risks","kicker":"05 · TRUST & GOVERNANCE","title":"旧口径正在污染答案","lead":"真正危险的不是没有曝光，而是模型吸收了缺少截止日、来源角色不清或已经过期的品牌说法。","layout":"cards","tone":"soft","items":[{"index":"01","eyebrow":"CLAIM DRIFT","title":"96% 与 >80% 并存","body":"5 月分发稿仍使用“96% 客户盈利”，官网 2026-06-30 当前口径为“超过 80%”。可能是统计窗口变化，但缺少截止日会被模型当成同一事实。","bullets":["先对齐定义","标注统计截止","设置失效日"],"source":"内部发布台账 + 盈米官网 2026-06-30 口径","status":"confirmed"},{"index":"02","eyebrow":"SOURCE ROLE","title":"品牌稿伪装成测评","body":"“排行榜”“真实测评”类标题由品牌主体分发，却使用第三方评测语气，短期利于点击，长期削弱独立可信度。","bullets":["明确内容主体","引用可核验证据","避免无依据排序"],"source":"内部发布台账标题样本 · 截止 2026-07-31","status":"confirmed"},{"index":"03","eyebrow":"MODEL BIAS","title":"不同模型不能外推","body":"豆包与 DeepSeek 的记录不能推导千问、Kimi、文心等模型同样命中；模型、生态、语言和检索源都会改变结果。","bullets":["模型分层","提示词版本化","固定时间复测"],"source":"内部模型信源摸查 + 公开生成式搜索研究","status":"confirmed"}],"callout":{"label":"治理原则","text":"所有可传播数字进入“品牌事实注册表”：定义、分母、时间窗、来源、负责人、失效日缺一不可。","status":"target"}},{"id":"maturity","kicker":"06 · MATURITY DIAGNOSIS","title":"当前处于 L2","lead":"当前已经跨过“只发内容”的阶段，但还没有形成官方信源、问题覆盖、稳定复测与转化归因的闭环。","layout":"timeline","tone":"dark","items":[{"index":"L1","eyebrow":"PUBLISH","title":"内容发布","body":"多渠道规模化发布并形成公开链接台账。","meta":"已完成","status":"confirmed"},{"index":"L2","eyebrow":"CITATION","title":"引用验证","body":"部分内容被豆包与 DeepSeek 记录引用；当前所处阶段。","meta":"当前 · 有结果但样本不统一","status":"confirmed"},{"index":"L3","eyebrow":"CONTROL","title":"可控覆盖","body":"问题库、官方 Answer Hub、权威第三方信源和多模型复测形成稳定机制。","meta":"下一目标","status":"target"},{"index":"L4","eyebrow":"ATTRIBUTION","title":"业务归因","body":"AI 答案带来的访问、咨询、注册、签约可识别并可做增量实验。","meta":"最终目标","status":"target"}],"callout":{"label":"投资判断","text":"供应商或内容预算应以 L3 的可控覆盖和 L4 的可归因为验收条件；单看发稿量与截图不构成 ROI。","status":"inferred"}},{"id":"metrics","kicker":"07 · MEASUREMENT SYSTEM","title":"重建 GEO 仪表盘","lead":"把“发稿台账”升级为“问题—答案—引用—访问—转化”证据链，每层保留分母、模型、时间与版本。","layout":"process","tone":"light","items":[{"index":"01","title":"问题覆盖","body":"六类意图 × 固定问题库；看 Answer Inclusion。","status":"target"},{"index":"02","title":"信源选择","body":"官方、权威媒体、行业研究、分发平台分别计算引用占比。","status":"target"},{"index":"03","title":"事实质量","body":"正确率、新鲜度、旧口径率、负面错误率。","status":"target"},{"index":"04","title":"行为承接","body":"AI referral、合格访问、关键解释页与 App 事件。","status":"target"},{"index":"05","title":"业务增量","body":"用对照组评估注册、签约或留资增量，不做最后点击归因。","status":"target"}],"callout":{"label":"最小周报","text":"每周固定模型、固定问题、固定提示词版本；同时报告分子、分母、截止日和异常样本。","status":"target"}},{"id":"actions","kicker":"08 · 90-DAY PLAN","title":"先修底座，再扩分发","lead":"最优路径不是继续堆稿，而是先修官方信源与事实治理，再补高意图问题，最后接上业务归因。","layout":"actions","tone":"soft","items":[{"index":"P0","eyebrow":"0—14 DAYS","title":"止血与定标","body":"修复 robots/sitemap、H1、canonical、OG 与结构化数据；建立品牌事实注册表，优先治理 96% / >80% 口径。","meta":"产品 + 品牌 + 技术 + 合规","status":"target"},{"index":"P1","eyebrow":"15—45 DAYS","title":"官方答案中枢","body":"上线可索引 Answer Hub，优先覆盖安全、费用、适合谁、怎么选、投顾与自主买基差异、追涨杀跌等问题。","meta":"品牌内容 + SEO/GEO + 投顾专家","status":"target"},{"index":"P2","eyebrow":"46—90 DAYS","title":"多源与归因闭环","body":"扩展权威媒体与行业研究信源；增加 AI 来源标记与关键事件；用连续四周对照实验评估增量。","meta":"增长 + 数据 + 渠道","status":"target"}],"callout":{"label":"本周最小动作","text":"先完成官网机器入口修复、六类问题基线和品牌事实注册表三件事；它们决定后续每一篇内容是否可沉淀。","status":"target"}},{"id":"evidence","kicker":"09 · EVIDENCE BOUNDARY","title":"边界比数字更重要","lead":"本报告把已确认、判断、缺失与目标态分开；公开搜索是诊断样本，不替代完整模型监测。","layout":"evidence","tone":"light","items":[{"index":"01","eyebrow":"INTERNAL LEDGER","title":"发布与引用台账","body":"用于确认链接总量、渠道分布与已记录引用；没有统一测试分母，因此不计算真实命中率。","source":"《GEO 内容发布 / AI 吸收和引用情况》在线版本 · 更新至 2026-07-31","status":"confirmed"},{"index":"02","eyebrow":"PUBLIC SAMPLE","title":"搜索与站点检查","body":"用于判断六类问题的相对占位、官网抓取入口和页面基础；排名会随时间、地区与模型变化。","source":"公开搜索样本 + yingmi.cn / qieman.com 技术响应 · 2026-08-26","status":"confirmed"},{"index":"03","eyebrow":"MISSING DATA","title":"转化与逐题明细","body":"未取得完整逐题、逐模型、逐时点监测明细，也没有 AI 引流后链路数据；不得外推注册、签约、规模或收入。","source":"研究证据覆盖审计 · 2026-08-26","status":"missing"}],"callout":{"label":"中心判断","text":"当前最值得管理层关注的不是 20 条引用，而是能否把一次性平台吸收，升级为官方可控、事实可信、业务可归因的增长系统。","status":"inferred"}}],"sources":[{"label":"内部 GEO 发布/引用台账","detail":"在线版本更新至 2026-07-31；报告仅使用聚合统计"},{"label":"盈米基金、且慢官方站点","detail":"yingmi.cn、qieman.com；公开页面与技术响应检查 2026-08-26"},{"label":"公开搜索问题样本","detail":"品牌、方法、类目、比较、AI 服务、痛点六类意图；2026-08-26"},{"label":"Google Search 官方指南","detail":"AI features and your website / Generative AI content guidance"},{"label":"GEO 研究论文","detail":"arXiv:2311.09735；arXiv:2509.08919"}],"openQuestions":[{"title":"统一测试分母","detail":"115 个链接中，哪些在何时、以什么问题、被哪些模型测试过？"},{"title":"业务归因边界","detail":"AI referral、站内关键行为、App 下载/激活、注册与签约目前如何识别？"},{"title":"指标口径治理","detail":"96% 与 >80% 分别对应什么统计窗口、分母与截止日，哪些旧稿需要更新？"}]}</script>
  <script>
    const report=JSON.parse(document.getElementById("report-data").textContent);
    const $=(selector,scope=document)=>scope.querySelector(selector);
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const statusLabel={confirmed:"已确认",inferred:"判断",missing:"待补",target:"目标态"};
    const status=value=>value?`<span class="status ${esc(value)}">${esc(statusLabel[value]||value)}</span>`:"";
    const bullets=items=>Array.isArray(items)&&items.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`:"";
    const common=item=>`${item.index?`<span class="item-index">${esc(item.index)}</span>`:""}${item.eyebrow?`<span class="item-eyebrow">${esc(item.eyebrow)}</span>`:""}${item.metric?`<strong class="metric">${esc(item.metric)}</strong>`:""}<h3>${esc(item.title)}</h3>${item.body?`<p class="item-body">${esc(item.body)}</p>`:""}${item.meta?`<span class="item-meta">${esc(item.meta)}</span>`:""}${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}${status(item.status)}`;
    const card=(item,index)=>`<article class="item reveal" style="--n:${index}">${common(item)}</article>`;
    function evidence(item){const priority=item.imagePriority==="high";return `<article class="item reveal"><figure>${item.image?`<img src="${esc(item.image)}" data-original-src="${esc(item.image)}" alt="${esc(item.alt||item.title)}" loading="${priority?"eager":"lazy"}"${priority?' fetchpriority="high"':""}>`:`<div class="evidence-placeholder">SOURCE / EVIDENCE</div>`}</figure><div class="evidence-copy">${common(item)}</div></article>`}
    function demo(section){const tabs=section.items.map((item,index)=>`<button class="demo-tab ${index===0?"active":""}" type="button" data-demo-tab="${index}"><b>${esc(item.title)}</b><span>${esc(item.eyebrow||item.meta||"")}</span></button>`).join("");const panels=section.items.map((item,index)=>`<article class="demo-panel ${index===0?"active":""}" data-demo-panel="${index}"><div class="demo-visual"><span class="item-index">${esc(item.index||String(index+1).padStart(2,"0"))}</span><span class="item-eyebrow">${esc(item.eyebrow||"SCENE")}</span><h3>${esc(item.title)}</h3>${status(item.status)}</div><div><span class="item-eyebrow">${esc(item.meta||"EXPERIENCE WALKTHROUGH")}</span><h3>${esc(item.title)}</h3><p>${esc(item.body||"")}</p>${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}</div></article>`).join("");return `<div class="items demo reveal"><div class="demo-tabs">${tabs}</div><div class="demo-stage">${panels}</div></div>`}
    function sectionMarkup(section,index){const tone=section.tone||"light";const content=section.layout==="demo"?demo(section):`<div class="items ${esc(section.layout)}">${section.items.map((item,itemIndex)=>section.layout==="evidence"?evidence(item):card(item,itemIndex)).join("")}</div>`;const callout=section.callout?`<div class="callout reveal"><b>${esc(section.callout.label||"KEY TAKEAWAY")}</b><p>${esc(section.callout.text)}</p>${status(section.callout.status)}</div>`:"";return `<section class="section ${esc(tone)}" id="${esc(section.id)}"><div class="wrap"><header class="section-head reveal"><div><div class="kicker">${esc(section.kicker||String(index+1).padStart(2,"0"))}</div><h2>${esc(section.title)}</h2></div><p class="lead">${esc(section.lead||"")}</p></header>${content}${callout}</div></section>`}
    const agendaGroups=report.agenda?.enabled===false?[]:(report.agenda?.groups||[]);
    const agendaMarkup=group=>`<article class="agenda-row"><div class="agenda-row-number">${esc(group.index)}</div><div class="agenda-row-copy"><span class="agenda-row-eyebrow">${esc(group.eyebrow||"")}</span><h3>${esc(group.title)}</h3><p>${esc(group.summary||"")}</p></div><div class="agenda-row-tags">${(group.sections||[]).map(label=>`<span>${esc(label)}</span>`).join("")}</div></article>`;
    document.documentElement.style.setProperty("--accent",report.meta?.accent||"#7457e8");
    document.title=report.meta?.title||"Clair Executive Visual Report";
    $("meta[name=description]").content=report.hero?.conclusion||report.meta?.subtitle||"Clair Executive Visual Report";
    $("#hero-eyebrow").textContent=report.meta?.eyebrow||"CLAIR · EXECUTIVE REPORT";
    $("#hero-title").innerHTML=esc(report.meta?.title||"").replace(/\s*[｜|]\s*/,"<br><em>")+((report.meta?.title||"").match(/[｜|]/)?"</em>":"");
    $("#hero-subtitle").textContent=report.meta?.subtitle||"";
    $("#hero-badges").innerHTML=(report.hero?.badges||[]).map(value=>`<span class="badge">${esc(value)}</span>`).join("");
    $("#hero-actions").innerHTML=report.meta?.downloadUrl?`<a class="download-button" href="${esc(report.meta.downloadUrl)}" download>${esc(report.meta.downloadLabel||"下载交付物")}</a>`:"";
    $("#brand-mark").textContent=(report.meta?.brandMark||"C").slice(0,2);
    $("#brand-name").textContent=report.meta?.brand||"CLAIR EXECUTIVE REPORT";
    if(agendaGroups.length){$("#agenda").hidden=false;$("#agenda-label").textContent=report.agenda?.label||"AGENDA";const agendaTitle=report.agenda?.title||"报告大纲";$("#agenda-title").innerHTML=agendaTitle.length>2?`${esc(agendaTitle.slice(0,-2))}<em>${esc(agendaTitle.slice(-2))}</em>`:esc(agendaTitle);$("#agenda-rows").innerHTML=agendaGroups.map(agendaMarkup).join("")}
    $("#main").innerHTML=(report.sections||[]).map(sectionMarkup).join("");
    const navSections=(report.sections||[]).filter(section=>!section.navHidden);
    $("#chapter-nav").innerHTML=navSections.map((section,index)=>`<a href="#${esc(section.id)}"><span>${String(index+1).padStart(2,"0")}</span> ${esc(section.navLabel||section.title)}</a>`).join("");
    const closing=report.closing||{};
    $("#ending-mark").textContent=closing.mark||`${report.meta?.brand||"CLAIR"} · EXECUTIVE REPORT`;
    $("#ending-line1").textContent=closing.line1||"让复杂判断变得清晰，";
    $("#ending-line2").textContent=closing.line2||"让每一次报告都通向";
    $("#ending-accent").textContent=closing.accent||"行动";
    $("#ending-lead").textContent=closing.lead||report.hero?.thesis||report.hero?.conclusion||"";
    $("#ending-meta-primary").textContent=closing.metaPrimary||`${report.meta?.brand||"CLAIR"} · ${report.meta?.date||"日期待确认"}`;
    $("#ending-meta-secondary").textContent=closing.metaSecondary||`材料截止 ${report.meta?.cutoff||"待确认"} · 证据状态与口径边界见下方说明`;
    $("#question-list").innerHTML=(report.openQuestions||[]).length?(report.openQuestions||[]).map((question,index)=>`<div class="question"><b>${String(index+1).padStart(2,"0")} · ${esc(question.title||"待确认")}</b><span>${esc(question.detail||question.body||"")}</span></div>`).join(""):`<div class="question"><b>当前无公开待确认项</b><span>仍需在发布前复核材料权限、敏感性与最新版本。</span></div>`;
    const panels=[$("#top"),...(agendaGroups.length?[$("#agenda")]:[]),...document.querySelectorAll("main>section"),$("#sources")];
    const panelLabels=["报告封面",...(agendaGroups.length?[report.agenda?.title||"报告大纲"]:[]),...(report.sections||[]).map(section=>section.title),"口径与边界"];
    const chapterNav=$("#chapter-nav");
    const navLinks=[...document.querySelectorAll(".chapter-nav a")];
    const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    let activePanelIndex=0;
    let scrollFrame=0;
    let navigating=false;
    let restoreScrollStyles=null;
    const syncChapterNav=()=>{const panel=panels[activePanelIndex];const href=panel?.id==="top"?null:`#${panel?.id}`;let activeLink=null;navLinks.forEach(link=>{const active=link.getAttribute("href")===href;link.classList.toggle("active",active);if(active)activeLink=link});let left=0;if(activeLink){const navRect=chapterNav.getBoundingClientRect();const linkRect=activeLink.getBoundingClientRect();const linkCenter=linkRect.left-navRect.left+chapterNav.scrollLeft+linkRect.width/2;left=linkCenter-chapterNav.clientWidth/2}chapterNav.scrollTo({left:Math.max(0,left),behavior:reducedMotion?"auto":"smooth"})};
    const setActivePanel=index=>{activePanelIndex=Math.max(0,Math.min(panels.length-1,index));const active=panels[activePanelIndex];document.body.classList.toggle("cover-active",active?.id==="top");document.body.classList.toggle("agenda-active",active?.id==="agenda");const activeTone=active?.classList.contains("dark")||active?.classList.contains("closing")?"dark":"light";$("#nav-shell").dataset.moduleTone=activeTone;document.querySelectorAll("[data-page-index]").forEach(node=>node.classList.toggle("active",Number(node.dataset.pageIndex)===activePanelIndex));$("#page-counter").textContent=`${String(activePanelIndex+1).padStart(2,"0")} / ${String(panels.length).padStart(2,"0")}`;syncChapterNav()};
    const cancelPanelNavigation=()=>{if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=0;navigating=false;if(restoreScrollStyles){restoreScrollStyles();restoreScrollStyles=null}};
    const goToPanel=index=>{cancelPanelNavigation();const target=Math.max(0,Math.min(panels.length-1,index));const panel=panels[target];const navOffset=panel.id==="top"||panel.id==="agenda"?0:$("#nav-shell").offsetHeight;const targetY=Math.max(0,panel.offsetTop-navOffset);const startY=scrollY;const distance=targetY-startY;setActivePanel(target);if(reducedMotion||Math.abs(distance)<2){scrollTo(0,targetY);return}const root=document.documentElement;const previousBehavior=root.style.scrollBehavior;const previousSnap=root.style.scrollSnapType;root.style.scrollBehavior="auto";root.style.scrollSnapType="none";restoreScrollStyles=()=>{root.style.scrollBehavior=previousBehavior;root.style.scrollSnapType=previousSnap};navigating=true;const started=performance.now();const duration=Math.min(520,320+Math.abs(distance)*.018);const tick=now=>{const progress=Math.min(1,(now-started)/duration);const eased=1-Math.pow(1-progress,4);scrollTo(0,startY+distance*eased);if(progress<1){scrollFrame=requestAnimationFrame(tick);return}scrollTo(0,targetY);scrollFrame=0;navigating=false;restoreScrollStyles();restoreScrollStyles=null};scrollFrame=requestAnimationFrame(tick)};
    $("#page-rail").innerHTML=panels.map((panel,index)=>`<button class="page-dot${index===0?" active":""}" type="button" data-page-index="${index}" aria-label="跳转到第 ${index+1} 屏：${esc(panelLabels[index]||panel.id)}"></button>`).join("");
    setActivePanel(0);
    document.addEventListener("click",event=>{const tab=event.target.closest("[data-demo-tab]");if(!tab)return;const demoRoot=tab.closest(".demo");demoRoot.querySelectorAll("[data-demo-tab]").forEach(node=>node.classList.toggle("active",node===tab));demoRoot.querySelectorAll("[data-demo-panel]").forEach(node=>node.classList.toggle("active",node.dataset.demoPanel===tab.dataset.demoTab))});
    $("#page-rail").addEventListener("click",event=>{const dot=event.target.closest("[data-page-index]");if(dot)goToPanel(Number(dot.dataset.pageIndex))});
    $("#back-to-top").addEventListener("click",event=>{event.preventDefault();goToPanel(0)});
    addEventListener("keydown",event=>{if(event.defaultPrevented||event.metaKey||event.ctrlKey||event.altKey||event.shiftKey||event.target.closest("input,textarea,select,button,a,[contenteditable=true]"))return;const next=["ArrowDown","ArrowRight","PageDown"].includes(event.key);const previous=["ArrowUp","ArrowLeft","PageUp"].includes(event.key);if(next||previous||event.key==="Home"||event.key==="End"){event.preventDefault();goToPanel(event.key==="Home"?0:event.key==="End"?panels.length-1:activePanelIndex+(next?1:-1))}});
    $("#menu-button").addEventListener("click",()=>{const shell=$("#nav-shell");const open=shell.classList.toggle("open");$("#menu-button").setAttribute("aria-expanded",String(open))});
    chapterNav.addEventListener("click",event=>{const link=event.target.closest("a");if(link){const target=panels.findIndex(panel=>`#${panel.id}`===link.getAttribute("href"));if(target>=0){event.preventDefault();goToPanel(target)}}$("#nav-shell").classList.remove("open");$("#menu-button").setAttribute("aria-expanded","false")});
    const reveals=[...document.querySelectorAll(".reveal")];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target)}}),{threshold:.12});reveals.forEach(node=>observer.observe(node));
    const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!navigating)setActivePanel(panels.indexOf(entry.target))}),{rootMargin:"-34% 0px -50%",threshold:0});panels.forEach(section=>sectionObserver.observe(section));
    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});
    const wireImageRecovery=()=>document.querySelectorAll("img[data-original-src]").forEach(image=>{let retried=false;image.addEventListener("load",()=>image.closest("figure")?.classList.remove("image-failed"));image.addEventListener("error",()=>{if(!retried){retried=true;const src=image.dataset.originalSrc;image.src=`${src}${src.includes("?")?"&":"?"}retry=1`;return}image.closest("figure")?.classList.add("image-failed")})});wireImageRecovery();
    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};addEventListener("scroll",updateProgress,{passive:true});updateProgress();
  </script>
</body>
