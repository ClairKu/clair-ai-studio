<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="t d"><title id="t">共用对象：台账、服务包、实例与执行上下文</title><desc id="d">哪些是标准资产、客户服务记录、业务工作和当次AI输入。目标设计，非现网审计。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#117D76"/></marker><marker id="bluearr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#286CAC"/></marker></defs><g font-family="Heiti SC,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="3200" height="1800" rx="0" fill="#F4F5F1" stroke="none" stroke-width="2"/><text x="80" y="75" font-size="23" font-weight="650" fill="#117D76" text-anchor="start">QIEMAN  /  PRODUCT BLUEPRINT</text><text x="80" y="155" font-size="53" font-weight="750" fill="#17343D" text-anchor="start">共用对象：台账、服务包、实例与执行上下文</text><text x="80" y="211" font-size="29" font-weight="400" fill="#597078" text-anchor="start">回答：复用的是什么；谁维护权威状态；AI、真人顾问与工作台如何使用同一套服务。</text><text x="3120" y="77" font-size="33" font-weight="650" fill="#117D76" text-anchor="end">04 / 06</text><rect x="80" y="295" width="660" height="340" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="80" y="295" width="9" height="340" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="110" y="350" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">标准服务包｜可复用定义</text><text x="110" y="407.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">服务目标、权益适用规则</text><text x="110" y="452.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">专业方法、SOP及工具依赖</text><text x="110" y="498.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">责任、交付标准、异常与评测</text><rect x="110" y="574" width="382" height="40" rx="10" fill="#EDE6F5" stroke="none" stroke-width="2"/><text x="126" y="603" font-size="24" font-weight="650" fill="#7452A1" text-anchor="start">版本化规范 · 业务标准主责</text><rect x="80" y="690" width="660" height="350" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="80" y="690" width="9" height="350" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="110" y="745" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">源系统权威事实</text><text x="110" y="802.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">客户身份 / 账户资产 / 交易</text><text x="110" y="847.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">KYC适当性 / 关系 / 业务授权</text><text x="110" y="893.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">保留主键、来源、时间与版本</text><rect x="110" y="979" width="182" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="126" y="1008" font-size="24" font-weight="650" fill="#597078" text-anchor="start">原业务域维护</text><rect x="80" y="1095" width="660" height="400" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="80" y="1095" width="9" height="400" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="110" y="1150" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">洞察与互动输入</text><text x="110" y="1207.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">客户原话、沟通原文</text><text x="110" y="1252.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">AI摘要、候选洞察和推断</text><text x="110" y="1298.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">确认、更正、撤回单独记录</text><text x="110" y="1344.64" font-size="31" font-weight="400" fill="#597078" text-anchor="start">推断经确认才能作为确认事实</text><rect x="110" y="1434" width="182" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="126" y="1463" font-size="24" font-weight="650" fill="#597078" text-anchor="start">记录类型分开</text><rect x="900" y="295" width="1390" height="1200" rx="20" fill="#E8F1EC" stroke="#117D76" stroke-width="3"/><text x="935" y="353" font-size="37" font-weight="700" fill="#117D76" text-anchor="start">统一客户服务台账｜共同记录与受控读写契约</text><text x="935" y="402" font-size="29" font-weight="400" fill="#597078" text-anchor="start">引用源事实，并原生持久保存服务域自己的事实与责任。</text><rect x="940" y="445" width="620" height="275" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="940" y="445" width="9" height="275" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="970" y="500" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">客户与目标</text><text x="970" y="557.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">客户 / 家庭映射与关系</text><text x="970" y="599.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">已确认的诉求、目标与约束</text><text x="970" y="642.84" font-size="29" font-weight="400" fill="#597078" text-anchor="start">授权范围与资料时效</text><rect x="1620" y="445" width="630" height="275" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1620" y="445" width="9" height="275" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="1650" y="500" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">客户服务实例</text><text x="1650" y="557.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">引用服务规范版本</text><text x="1650" y="599.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">实际权益、约定、责任与状态</text><text x="1650" y="642.84" font-size="29" font-weight="400" fill="#597078" text-anchor="start">客户确认、变更与结束原因</text><line x1="1568" y1="580" x2="1605" y2="580" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><rect x="940" y="840" width="620" height="275" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="940" y="840" width="9" height="275" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="970" y="895" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">服务计划与业务任务</text><text x="970" y="952.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">计划组织多个业务任务</text><text x="970" y="994.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">责任人、期限、依赖与交接</text><text x="970" y="1037.84" font-size="29" font-weight="400" fill="#597078" text-anchor="start">任务由人工或多次AI运行支持</text><rect x="1620" y="840" width="630" height="275" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1620" y="840" width="9" height="275" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="1650" y="895" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">交付、回执与服务结果</text><text x="1650" y="952.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">报告及判断的版本 / 签发人</text><text x="1650" y="994.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">已发送、送达、阅读分别记录</text><text x="1650" y="1037.84" font-size="29" font-weight="400" fill="#597078" text-anchor="start">确认、异议、完成评价及复检</text><path d="M1930,732 L1930,780 L1250,780 L1250,825" fill="none" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="1460" y="766" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">形成计划与责任</text><line x1="1568" y1="975" x2="1605" y2="975" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><rect x="940" y="1210" width="1310" height="225" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="970" y="1262" font-size="32" font-weight="700" fill="#117D76" text-anchor="start">权威实现选择原则</text><text x="970" y="1312" font-size="28" font-weight="400" fill="#597078" text-anchor="start">一项服务 / 任务只有一个主状态；既有系统可复用，避免双主写。</text><text x="970" y="1355" font-size="28" font-weight="400" fill="#597078" text-anchor="start">客户确认、顾问判断、AI推断分开；并发与撤销都有记录。</text><text x="970" y="1398" font-size="28" font-weight="400" fill="#597078" text-anchor="start">客户长期关系 ≠ 一件服务实例 ≠ 一次Agent技术运行。</text><line x1="749" y1="470" x2="888" y2="470" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="774" y="438" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">规范供给</text><line x1="749" y1="865" x2="888" y2="865" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="774" y="833" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">引用核验</text><line x1="749" y1="1285" x2="888" y2="1285" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="774" y="1253" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">分层写入</text><rect x="2460" y="295" width="660" height="540" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="2460" y="295" width="9" height="540" rx="0" fill="#286CAC" stroke="none" stroke-width="2"/><text x="2490" y="350" font-size="35" font-weight="700" fill="#286CAC" text-anchor="start">按角色与用途装配上下文</text><text x="2490" y="407.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">引用客户、服务实例与任务</text><text x="2490" y="449.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">选择必要且有效的输入</text><text x="2490" y="492.84000000000003" font-size="29" font-weight="400" fill="#597078" text-anchor="start">携带来源、版本和权限约束</text><text x="2490" y="535.76" font-size="29" font-weight="400" fill="#597078" text-anchor="start">供AI小顾、顾问及工作台使用</text><text x="2490" y="578.6800000000001" font-size="29" font-weight="400" fill="#597078" text-anchor="start">使用前重新核验授权与时效</text><rect x="2490" y="774" width="382" height="40" rx="10" fill="#E3EDF8" stroke="none" stroke-width="2"/><text x="2506" y="803" font-size="24" font-weight="650" fill="#286CAC" text-anchor="start">当次运行输入 · 非状态主账</text><line x1="2300" y1="575" x2="2447" y2="575" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="2325" y="542" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">受控读取</text><rect x="2460" y="970" width="660" height="525" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="2460" y="970" width="9" height="525" rx="0" fill="#286CAC" stroke="none" stroke-width="2"/><text x="2490" y="1025" font-size="35" font-weight="700" fill="#286CAC" text-anchor="start">执行与写回</text><text x="2490" y="1082.0" font-size="29" font-weight="400" fill="#597078" text-anchor="start">工具 / 人工步骤推进任务</text><text x="2490" y="1124.92" font-size="29" font-weight="400" fill="#597078" text-anchor="start">动作前校验权限与幂等标识</text><text x="2490" y="1167.84" font-size="29" font-weight="400" fill="#597078" text-anchor="start">产出、证据及异常回写原实例</text><text x="2490" y="1210.76" font-size="29" font-weight="400" fill="#597078" text-anchor="start">质量反馈关联服务包版本</text><text x="2490" y="1253.68" font-size="29" font-weight="400" fill="#597078" text-anchor="start">失败或中断可恢复、可接管</text><rect x="2490" y="1434" width="332" height="40" rx="10" fill="#E3EDF8" stroke="none" stroke-width="2"/><text x="2506" y="1463" font-size="24" font-weight="650" fill="#286CAC" text-anchor="start">多次技术运行支持业务工作</text><line x1="2790" y1="848" x2="2790" y2="956" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="2820" y="912" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">授权执行</text><line x1="2447" y1="1090" x2="2300" y2="1090" stroke="#117D76" stroke-width="3" marker-end="url(#arr)"/><text x="2312" y="1060" font-size="27" font-weight="400" fill="#117D76" text-anchor="start">结果写回</text><rect x="80" y="1550" width="3040" height="106" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="108" y="1599" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">复用同一标准与服务记录，按角色给不同工作视图。</text><text x="108" y="1645" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">服务包是“怎么合格服务”的定义；实例是“对这个客户已约定什么”；上下文是“本次获准使用什么”。</text><line x1="80" y1="1705" x2="3120" y2="1705" stroke="#CFDBDB" stroke-width="2"/><text x="80" y="1746" font-size="24" font-weight="400" fill="#597078" text-anchor="start">借鉴Salesforce模板/版本/执行计划分离及金融业务对象模型；台账的服务域主写责任为且慢设计建议。</text><text x="3120" y="1780" font-size="23" font-weight="400" fill="#597078" text-anchor="end">且慢目标设计 · 2026.11.04 · 行业研究重绘版</text></g></svg>