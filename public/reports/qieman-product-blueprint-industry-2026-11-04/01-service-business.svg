<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="t d"><title id="t">经营全景：让客户服务持续发生</title><desc id="d">客户的长期目标如何变成持续、可信、有责任的服务。目标设计，非现网审计。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#117D76"/></marker><marker id="bluearr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#286CAC"/></marker></defs><g font-family="Heiti SC,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="3200" height="1800" rx="0" fill="#F4F5F1" stroke="none" stroke-width="2"/><text x="80" y="75" font-size="23" font-weight="650" fill="#117D76" text-anchor="start">QIEMAN  /  PRODUCT BLUEPRINT</text><text x="80" y="155" font-size="53" font-weight="750" fill="#17343D" text-anchor="start">经营全景：让客户服务持续发生</text><text x="80" y="211" font-size="29" font-weight="400" fill="#597078" text-anchor="start">回答：且慢经营的是什么；服务如何产生价值；私域、VIP与顾问运营各处在哪个维度。</text><text x="3120" y="77" font-size="33" font-weight="650" fill="#117D76" text-anchor="end">01 / 06</text><rect x="80" y="265" width="3040" height="122" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="108" y="314" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">服务主张：围绕客户的资金目标，持续理解、专业判断、履行约定。</text><text x="108" y="360" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">产品覆盖客户关系全程；一次服务仍须有清晰范围、责任和完成条件。</text><rect x="80" y="455" width="560" height="315" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="80" y="455" width="9" height="315" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="110" y="510" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">建立关系</text><text x="110" y="567.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">客户能表达问题</text><text x="110" y="612.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">解释服务与授权范围</text><text x="110" y="658.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">留下可接续的诉求</text><rect x="110" y="709" width="157" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="126" y="738" font-size="24" font-weight="650" fill="#597078" text-anchor="start">客户价值链</text><line x1="651" y1="610" x2="688" y2="610" stroke="#117D76" stroke-width="4" marker-end="url(#arr)"/><rect x="700" y="455" width="560" height="315" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="700" y="455" width="9" height="315" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="730" y="510" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">理解客户</text><text x="730" y="567.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">核实目标与约束</text><text x="730" y="612.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">关联事实，补齐缺口</text><text x="730" y="658.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">区分确认事实与推断</text><rect x="730" y="709" width="157" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="746" y="738" font-size="24" font-weight="650" fill="#597078" text-anchor="start">客户价值链</text><line x1="1271" y1="610" x2="1308" y2="610" stroke="#117D76" stroke-width="4" marker-end="url(#arr)"/><rect x="1320" y="455" width="560" height="315" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1320" y="455" width="9" height="315" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="1350" y="510" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">形成服务约定</text><text x="1350" y="567.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">明确能提供什么</text><text x="1350" y="612.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">权益、责任、时限、标准</text><text x="1350" y="658.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">把诉求落实为可履约事项</text><rect x="1350" y="709" width="157" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="1366" y="738" font-size="24" font-weight="650" fill="#597078" text-anchor="start">客户价值链</text><line x1="1891" y1="610" x2="1928" y2="610" stroke="#117D76" stroke-width="4" marker-end="url(#arr)"/><rect x="1940" y="455" width="560" height="315" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1940" y="455" width="9" height="315" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="1970" y="510" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">专业判断与交付</text><text x="1970" y="567.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">有依据地给出结论</text><text x="1970" y="612.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">AI准备，顾问处理专业判断</text><text x="1970" y="658.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">客户保留确认与决定权</text><rect x="1970" y="709" width="157" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="1986" y="738" font-size="24" font-weight="650" fill="#597078" text-anchor="start">客户价值链</text><line x1="2511" y1="610" x2="2548" y2="610" stroke="#117D76" stroke-width="4" marker-end="url(#arr)"/><rect x="2560" y="455" width="560" height="315" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="2560" y="455" width="9" height="315" rx="0" fill="#117D76" stroke="none" stroke-width="2"/><text x="2590" y="510" font-size="35" font-weight="700" fill="#17343D" text-anchor="start">持续检视与接续</text><text x="2590" y="567.0" font-size="31" font-weight="400" fill="#597078" text-anchor="start">目标变化有人跟进</text><text x="2590" y="612.88" font-size="31" font-weight="400" fill="#597078" text-anchor="start">记录结果与下一次约定</text><text x="2590" y="658.76" font-size="31" font-weight="400" fill="#597078" text-anchor="start">复检，必要时开启新服务</text><rect x="2590" y="709" width="157" height="40" rx="10" fill="#E7ECEB" stroke="none" stroke-width="2"/><text x="2606" y="738" font-size="24" font-weight="650" fill="#597078" text-anchor="start">客户价值链</text><path d="M2860,790 L2860,835 L985,835 L985,786" fill="none" stroke="#117D76" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="10 8"/><text x="1320" y="824" font-size="29" font-weight="650" fill="#117D76" text-anchor="start">客户目标 / 事实 / 承诺变化 → 重新检视</text><text x="80" y="917" font-size="36" font-weight="700" fill="#17343D" text-anchor="start">同一条服务价值链，按服务深度配置交付方式</text><rect x="80" y="955" width="3040" height="112" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="110" y="1001" font-size="33" font-weight="650" fill="#117D76" text-anchor="start">普惠与日常服务</text><text x="590" y="1001" font-size="31" font-weight="650" fill="#17343D" text-anchor="start">常见问题、基础解释、标准陪伴</text><text x="590" y="1043" font-size="29" font-weight="400" fill="#597078" text-anchor="start">AI可按获准规范完成；复杂、异常或越界事项进入人工队列。</text><rect x="80" y="1087" width="3040" height="112" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="110" y="1133" font-size="33" font-weight="650" fill="#117D76" text-anchor="start">顾问专业服务</text><text x="590" y="1133" font-size="31" font-weight="650" fill="#17343D" text-anchor="start">目标检视、诊断规划、持续跟进</text><text x="590" y="1175" font-size="29" font-weight="400" fill="#597078" text-anchor="start">顾问对专业判断与交付负责；AI承担准备、核对和接续解释。</text><rect x="80" y="1219" width="3040" height="112" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="110" y="1265" font-size="33" font-weight="650" fill="#117D76" text-anchor="start">VIP及复杂服务</text><text x="590" y="1265" font-size="31" font-weight="650" fill="#17343D" text-anchor="start">更高权益、复杂需求、专家协同</text><text x="590" y="1307" font-size="29" font-weight="400" fill="#597078" text-anchor="start">沿用同一服务记录与责任机制，增加服务深度、权益与专业协作。</text><rect x="80" y="1380" width="1740" height="225" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="108" y="1429" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">顾问运营：让专业服务稳定、可规模地交付</text><text x="108" y="1475" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">设计服务与权益 → 供给方法、知识和工具 → 排班分派与协作 → 质量复盘。</text><text x="108" y="1514" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">运营改进服务生产与履约，不替代顾问的专业责任。</text><text x="108" y="1553" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">私域 = 渠道及关系方式；VIP = 服务权益层级；客户服务 = 业务总域。</text><rect x="1870" y="1380" width="1250" height="225" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1870" y="1380" width="9" height="225" rx="0" fill="#286CAC" stroke="none" stroke-width="2"/><text x="1900" y="1435" font-size="35" font-weight="700" fill="#286CAC" text-anchor="start">衡量三件事</text><text x="1900" y="1492.0" font-size="28" font-weight="400" fill="#597078" text-anchor="start">客户：目标理解与服务接续是否顺畅</text><text x="1900" y="1533.44" font-size="28" font-weight="400" fill="#597078" text-anchor="start">服务：到期约定是否有完成证据</text><text x="1900" y="1574.88" font-size="28" font-weight="400" fill="#597078" text-anchor="start">经营：留存与服务产能变化需有口径及归因</text><line x1="80" y1="1705" x2="3120" y2="1705" stroke="#CFDBDB" stroke-width="2"/><text x="80" y="1746" font-size="24" font-weight="400" fill="#597078" text-anchor="start">参考：平安财富经营全景、Deloitte数字财富顾问架构；本图为且慢经营与服务目标设计。</text><text x="3120" y="1780" font-size="23" font-weight="400" fill="#597078" text-anchor="end">且慢目标设计 · 2026.11.04 · 行业研究重绘版</text></g></svg>