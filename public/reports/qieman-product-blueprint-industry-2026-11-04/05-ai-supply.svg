<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="t d"><title id="t">AI底座与平台供给：按契约接入Lodestar</title><desc id="d">每一项基础能力由谁提供，以什么边界和验收交付。目标设计，非现网审计。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#117D76"/></marker><marker id="bluearr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#286CAC"/></marker></defs><g font-family="Heiti SC,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="3200" height="1800" rx="0" fill="#F4F5F1" stroke="none" stroke-width="2"/><text x="80" y="75" font-size="23" font-weight="650" fill="#117D76" text-anchor="start">QIEMAN  /  PRODUCT BLUEPRINT</text><text x="80" y="155" font-size="53" font-weight="750" fill="#17343D" text-anchor="start">AI底座与平台供给：按契约接入Lodestar</text><text x="80" y="211" font-size="29" font-weight="400" fill="#597078" text-anchor="start">回答：Lodestar需要哪些业务、专业和AI基础能力；供给方交付什么；共同建设什么。</text><text x="3120" y="77" font-size="33" font-weight="650" fill="#117D76" text-anchor="end">05 / 06</text><rect x="80" y="265" width="3040" height="127" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="108" y="314" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">能力消费方：Lodestar / AI小顾 / 受控运营作业；YINGWORK独立消费通用供给</text><text x="108" y="360" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">对业务产品提供稳定能力契约；不默认由某一个应用统包底座，不预设需要新建一个万能平台。</text><rect x="80" y="430" width="480" height="65" rx="8" fill="#143E4A" stroke="none" stroke-width="2"/><text x="102" y="473" font-size="29" font-weight="650" fill="#FFF" text-anchor="start">供给层</text><rect x="580" y="430" width="660" height="65" rx="8" fill="#143E4A" stroke="none" stroke-width="2"/><text x="602" y="473" font-size="29" font-weight="650" fill="#FFF" text-anchor="start">候选供给方 / 接入边界</text><rect x="1260" y="430" width="1110" height="65" rx="8" fill="#143E4A" stroke="none" stroke-width="2"/><text x="1282" y="473" font-size="29" font-weight="650" fill="#FFF" text-anchor="start">交付能力与接口契约</text><rect x="2390" y="430" width="730" height="65" rx="8" fill="#143E4A" stroke="none" stroke-width="2"/><text x="2412" y="473" font-size="29" font-weight="650" fill="#FFF" text-anchor="start">验收重点</text><rect x="80" y="515" width="480" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="559" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">业务与客户事实</text><rect x="580" y="515" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="559" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">客户/账户/交易系统 + CDP</text><rect x="1260" y="515" width="1110" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="559" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">主键映射、源事实查询、数据时点、关系与授权范围</text><rect x="2390" y="515" width="730" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="559" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">来源 / 时效 / 冲突</text><text x="2412" y="599" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">最小范围</text><rect x="80" y="648" width="480" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="692" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">专业服务资产</text><rect x="580" y="648" width="660" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="692" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">投研 / 服务专家 / 内容与质量</text><rect x="1260" y="648" width="1110" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="692" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">标准服务包、知识引用、金融计算、报告与专业规则</text><rect x="2390" y="648" width="730" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="692" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">依据 / 版本 / 专业责任</text><text x="2412" y="732" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">适用边界</text><rect x="80" y="781" width="480" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="825" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">客户服务运行</text><rect x="580" y="781" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="825" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">共用服务域 + 既有SCRM/工单实现</text><rect x="1260" y="781" width="1110" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="825" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">实例与任务API、交接、计划、回执、异常队列</text><rect x="2390" y="781" width="730" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="825" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">唯一主状态 / 接收</text><text x="2412" y="865" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">期限 / 完成证据</text><rect x="80" y="914" width="480" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="958" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">事件与洞察输入</text><rect x="580" y="914" width="660" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="958" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">MESN事件 / CDP客群</text><text x="602" y="998" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">慧客通洞察</text><rect x="1260" y="914" width="1110" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="958" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">带来源的变化信号、候选洞察、策略评估输入</text><rect x="2390" y="914" width="730" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="958" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">去重 / 静默 / 有效期</text><text x="2412" y="998" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">不越权派单</text><rect x="80" y="1047" width="480" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="1091" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">AI推理与持久执行</text><rect x="580" y="1047" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="1091" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">企业AI模型 / Agent</text><text x="602" y="1131" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">编排与持久运行供给</text><rect x="1260" y="1047" width="1110" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="1091" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">模型路由、工具调用、长任务恢复、状态与重试</text><rect x="2390" y="1047" width="730" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="1091" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">中断可恢复 / 幂等</text><text x="2412" y="1131" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">成本 / 人工接管</text><rect x="80" y="1180" width="480" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="1224" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">工具开放与治理</text><rect x="580" y="1180" width="660" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="1224" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">OAP开放能力</text><text x="602" y="1264" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">STARGATE治理（候选）</text><rect x="1260" y="1180" width="1110" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="1224" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">API与MCP接入、发布授权、配额、审计</text><rect x="2390" y="1180" width="730" height="118" rx="8" fill="#EAF0ED" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="1224" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">动作级权限 / 版本兼容 / 调用可追溯</text><rect x="80" y="1313" width="480" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="102" y="1357" font-size="28" font-weight="650" fill="#117D76" text-anchor="start">渠道交付与观测</text><rect x="580" y="1313" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="602" y="1357" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">SCRM等渠道 + 评测观测平台</text><rect x="1260" y="1313" width="1110" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1282" y="1357" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">获准触达、分项回执、质量评测、抽检与回滚</text><rect x="2390" y="1313" width="730" height="118" rx="8" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2412" y="1357" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">发送与送达分开</text><text x="2412" y="1397" font-size="28" font-weight="400" fill="#17343D" text-anchor="start">失败归因 / 问题闭环</text><rect x="80" y="1490" width="3040" height="162" rx="20" fill="#EDE6F5" stroke="#CFDBDB" stroke-width="2"/><text x="110" y="1538" font-size="33" font-weight="700" fill="#7452A1" text-anchor="start">必须一起建设：稳定且可验证的共用契约</text><text x="110" y="1582" font-size="28" font-weight="400" fill="#597078" text-anchor="start">统一客户与服务标识；事实 / 状态 / 版本 / 权限；服务包发布与实例绑定；任务 / 动作 / 回执；异常接管与质量标准。</text><text x="110" y="1624" font-size="28" font-weight="400" fill="#597078" text-anchor="start">平台名为候选职责映射，接口与现网能力未逐项实测。MCP是接入协议，不是一款平台；L3是建设项目，不在在线调用链。</text><line x1="80" y1="1705" x2="3120" y2="1705" stroke="#CFDBDB" stroke-width="2"/><text x="80" y="1746" font-size="24" font-weight="400" fill="#597078" text-anchor="start">借鉴Deloitte互操作层、招行云/数据/技术供给、Aladdin集成边界；具体平台职责与接口需按场景落实。</text><text x="3120" y="1780" font-size="23" font-weight="400" fill="#597078" text-anchor="end">且慢目标设计 · 2026.11.04 · 行业研究重绘版</text></g></svg>