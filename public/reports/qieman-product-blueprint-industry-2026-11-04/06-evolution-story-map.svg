<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="t d"><title id="t">建设路线：每一步都交付可用的服务闭环</title><desc id="d">如何以客户与顾问可用的结果组织建设，而不是按技术层交付。目标设计，非现网审计。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#117D76"/></marker><marker id="bluearr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#286CAC"/></marker></defs><g font-family="Heiti SC,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="3200" height="1800" rx="0" fill="#F4F5F1" stroke="none" stroke-width="2"/><text x="80" y="75" font-size="23" font-weight="650" fill="#117D76" text-anchor="start">QIEMAN  /  PRODUCT BLUEPRINT</text><text x="80" y="155" font-size="53" font-weight="750" fill="#17343D" text-anchor="start">建设路线：每一步都交付可用的服务闭环</text><text x="80" y="211" font-size="29" font-weight="400" fill="#597078" text-anchor="start">回答：Lodestar、L3、小顾4.0如何并行建设；什么必须共建；每一阶段凭什么放量。</text><text x="3120" y="77" font-size="33" font-weight="650" fill="#117D76" text-anchor="end">06 / 06</text><rect x="80" y="260" width="3040" height="105" rx="20" fill="#E7F1EC" stroke="#CFDBDB" stroke-width="2"/><text x="110" y="305" font-size="31" font-weight="700" fill="#117D76" text-anchor="start">顾问作业骨架</text><text x="110" y="345" font-size="28" font-weight="400" fill="#597078" text-anchor="start">发布切片横跨完成目标所需活动；以下为顺序建议，未承诺具体日期或上线范围。</text><rect x="650" y="407" width="480" height="80" rx="9" fill="#143E4A" stroke="none" stroke-width="2"/><text x="674" y="457" font-size="30" font-weight="650" fill="#FFF" text-anchor="start">管理服务队列</text><rect x="1144" y="407" width="480" height="80" rx="9" fill="#143E4A" stroke="none" stroke-width="2"/><text x="1168" y="457" font-size="30" font-weight="650" fill="#FFF" text-anchor="start">理解客户与诉求</text><rect x="1638" y="407" width="480" height="80" rx="9" fill="#143E4A" stroke="none" stroke-width="2"/><text x="1662" y="457" font-size="30" font-weight="650" fill="#FFF" text-anchor="start">准备与专业判断</text><rect x="2132" y="407" width="480" height="80" rx="9" fill="#143E4A" stroke="none" stroke-width="2"/><text x="2156" y="457" font-size="30" font-weight="650" fill="#FFF" text-anchor="start">交付与客户确认</text><rect x="2626" y="407" width="480" height="80" rx="9" fill="#143E4A" stroke="none" stroke-width="2"/><text x="2650" y="457" font-size="30" font-weight="650" fill="#FFF" text-anchor="start">持续跟进与改进</text><rect x="80" y="525" width="530" height="212" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="105" y="575" font-size="29" font-weight="700" fill="#117D76" text-anchor="start">切片A｜顾问主导的服务闭环</text><text x="105" y="625" font-size="27" font-weight="400" fill="#597078" text-anchor="start">Lodestar首条可用闭环</text><rect x="105" y="670" width="257" height="40" rx="10" fill="#E3EDF8" stroke="none" stroke-width="2"/><text x="121" y="699" font-size="24" font-weight="650" fill="#286CAC" text-anchor="start">新建 + L3共建</text><rect x="650" y="525" width="480" height="212" rx="20" fill="#EDF4EF" stroke="#CFDBDB" stroke-width="2"/><text x="672" y="586" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">受理、领单、优先级</text><text x="672" y="634" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">异常有人接住</text><rect x="1144" y="525" width="480" height="212" rx="20" fill="#EDF4EF" stroke="#CFDBDB" stroke-width="2"/><text x="1166" y="586" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">事实核验、缺口补全</text><text x="1166" y="634" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">客户诉求可确认</text><rect x="1638" y="525" width="480" height="212" rx="20" fill="#EDF4EF" stroke="#CFDBDB" stroke-width="2"/><text x="1660" y="586" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">L3验证准备作业</text><text x="1660" y="634" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">顾问核证并签发</text><rect x="2132" y="525" width="480" height="212" rx="20" fill="#EDF4EF" stroke="#CFDBDB" stroke-width="2"/><text x="2154" y="586" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">获准渠道人工交付</text><text x="2154" y="634" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">回执与客户决定</text><rect x="2626" y="525" width="480" height="212" rx="20" fill="#EDF4EF" stroke="#CFDBDB" stroke-width="2"/><text x="2648" y="586" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">约定复检、任务关闭</text><text x="2648" y="634" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">建立耗时和质量基线</text><rect x="80" y="770" width="530" height="212" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="105" y="820" font-size="29" font-weight="700" fill="#117D76" text-anchor="start">切片B｜AI与真人连续服务</text><text x="105" y="870" font-size="27" font-weight="400" fill="#597078" text-anchor="start">小顾4.0按场景开放</text><rect x="105" y="915" width="207" height="40" rx="10" fill="#F9ECD8" stroke="none" stroke-width="2"/><text x="121" y="944" font-size="24" font-weight="650" fill="#9A611B" text-anchor="start">升级 + 共建</text><rect x="650" y="770" width="480" height="212" rx="20" fill="#E8F0F7" stroke="#CFDBDB" stroke-width="2"/><text x="672" y="831" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">小顾创建或接续实例</text><text x="672" y="879" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">接收后转移任务责任</text><rect x="1144" y="770" width="480" height="212" rx="20" fill="#E8F0F7" stroke="#CFDBDB" stroke-width="2"/><text x="1166" y="831" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">跨入口共用确认记录</text><text x="1166" y="879" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">权限与更正实时生效</text><rect x="1638" y="770" width="480" height="212" rx="20" fill="#E8F0F7" stroke="#CFDBDB" stroke-width="2"/><text x="1660" y="831" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">复用已验证服务包</text><text x="1660" y="879" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">自动正常作业+人工判断</text><rect x="2132" y="770" width="480" height="212" rx="20" fill="#E8F0F7" stroke="#CFDBDB" stroke-width="2"/><text x="2154" y="831" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">AI解释签发内容</text><text x="2154" y="879" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">客户异议回到原服务</text><rect x="2626" y="770" width="480" height="212" rx="20" fill="#E8F0F7" stroke="#CFDBDB" stroke-width="2"/><text x="2648" y="831" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">跨会话查询进度</text><text x="2648" y="879" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">超时跟进与反馈回流</text><rect x="80" y="1015" width="530" height="212" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="105" y="1065" font-size="29" font-weight="700" fill="#117D76" text-anchor="start">切片C｜扩展服务深度与产能</text><text x="105" y="1115" font-size="27" font-weight="400" fill="#597078" text-anchor="start">VIP / 私域 / 批量运营</text><rect x="105" y="1160" width="207" height="40" rx="10" fill="#EDE6F5" stroke="none" stroke-width="2"/><text x="121" y="1189" font-size="24" font-weight="650" fill="#7452A1" text-anchor="start">扩展 + 共建</text><rect x="650" y="1015" width="480" height="212" rx="20" fill="#F0EBF6" stroke="#CFDBDB" stroke-width="2"/><text x="672" y="1076" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">更多服务权益与队列</text><text x="672" y="1124" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">复杂度与产能分流</text><rect x="1144" y="1015" width="480" height="212" rx="20" fill="#F0EBF6" stroke="#CFDBDB" stroke-width="2"/><text x="1166" y="1076" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">家庭关系和复杂目标</text><text x="1166" y="1124" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">数据范围分层核验</text><rect x="1638" y="1015" width="480" height="212" rx="20" fill="#F0EBF6" stroke="#CFDBDB" stroke-width="2"/><text x="1660" y="1076" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">多角色 / 专家协作</text><text x="1660" y="1124" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">按场景提高自动化</text><rect x="2132" y="1015" width="480" height="212" rx="20" fill="#F0EBF6" stroke="#CFDBDB" stroke-width="2"/><text x="2154" y="1076" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">多渠道与复杂交付</text><text x="2154" y="1124" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">版本和责任持续一致</text><rect x="2626" y="1015" width="480" height="212" rx="20" fill="#F0EBF6" stroke="#CFDBDB" stroke-width="2"/><text x="2648" y="1076" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">结果抽检与服务复盘</text><text x="2648" y="1124" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">以质量约束规模扩展</text><rect x="80" y="1307" width="1740" height="301" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="108" y="1356" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">L3的可复用交付物 → 对应场景的小顾4.0与Lodestar</text><text x="108" y="1402" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">已验证服务规范版本 + 工具与流程契约 + 评测案例与结果 + 运行监控与异常方案。</text><text x="108" y="1441" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">L3不作为对客产品；验证通过的场景逐步被消费，多个场景可并行建设。</text><text x="108" y="1480" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">共建流持续推进：客户台账 / 服务包版本 / 实例任务状态 / 授权与回执 / 质量标准。</text><text x="108" y="1519" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">共用能力沉淀到长期产品及平台，项目团队不成为永久运行责任的替代。</text><rect x="1870" y="1307" width="1250" height="301" rx="20" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><rect x="1870" y="1307" width="9" height="301" rx="0" fill="#286CAC" stroke="none" stroke-width="2"/><text x="1900" y="1362" font-size="35" font-weight="700" fill="#286CAC" text-anchor="start">放量闸门：先有证据，再扩大范围</text><text x="1900" y="1419.0" font-size="28" font-weight="400" fill="#597078" text-anchor="start">质量：正常、缺数、拒绝、冲突和异常案例通过</text><text x="1900" y="1460.44" font-size="28" font-weight="400" fill="#597078" text-anchor="start">协同：转接有人接、失败可恢复、重试不重复动作</text><text x="1900" y="1501.88" font-size="28" font-weight="400" fill="#597078" text-anchor="start">结果：跨入口接续成功率、合格服务人工耗时、到期履约率</text><text x="1900" y="1543.32" font-size="28" font-weight="400" fill="#597078" text-anchor="start">每项口径、样本与阈值由业务和质量负责人按场景确定</text><line x1="80" y1="1705" x2="3120" y2="1705" stroke="#CFDBDB" stroke-width="2"/><text x="80" y="1746" font-size="24" font-weight="400" fill="#597078" text-anchor="start">方法：Jeff Patton用户故事地图的完整发布切片；Marty Cagan的重点问题与团队结果责任。</text><text x="3120" y="1780" font-size="23" font-weight="400" fill="#597078" text-anchor="end">且慢目标设计 · 2026.11.04 · 行业研究重绘版</text></g></svg>