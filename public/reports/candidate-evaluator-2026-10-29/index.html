/* Clair Select — compact brand system */
:root{--ink:#233e36;--muted:#84968c;--line:#e8eee8;--blue:#337d69;--mint:#edf5ef;--brand:#173f36;--brand-accent:#bce5b7}
body{background:#fdfefb;color:var(--ink)}
.header-inner{padding-top:29px;padding-bottom:25px}
.brand-lockup{display:flex;align-items:center;gap:12px;flex:none}
.brand-mark{width:42px;height:42px;display:block;flex:none}
.brand-type h1{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:25px;line-height:1.16;letter-spacing:-1.1px;color:var(--brand);white-space:nowrap}
.brand-clair{font-weight:420}.brand-select{font-weight:670}
.brand-caption{display:block;font-size:10px;line-height:1.5;letter-spacing:2px;color:#8a9c90;margin-top:4px}
button:hover{background:#edf3ec}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline-color:#bdddc7}
.primary,.header-extra .primary{background:var(--brand);color:#f8fcf6}
.primary:hover,.header-extra .primary:hover{background:#28594b}
.header-extra button:not(.primary){color:#6c8275}
.candidate-search input{background:#f2f5ef;color:#415b4c}
.candidate-search input::placeholder{color:#8d9d90}
.candidate-search #month-filter{background:#f5f7f2;color:#819281}
.role-chips button[aria-pressed=true],.role-switch button[aria-pressed=true]{background:#eaf2e7;color:#3f6b4b;border-color:#eaf2e7}
.candidate-row.active{background:#eef4e9}
.candidate-row:hover{background:#f0f5ed}
.candidate-row b{color:#304d3d}
.candidate-row .career-tags{color:#738773}
.hiring-metrics b{color:#496a54;font-variant-numeric:tabular-nums}
.three-answer-label{color:#315e49}
.detail-section p,.profile-facts p{color:#627d6b}
.user-score{background:#eaf3e5;color:#50754b}
.dialog-tabs button.active,.requirements-tabs button.active,.score-dialog .dialog-tabs button[aria-pressed=true]{background:#edf4e9;color:#4f7555}
.key-star[aria-pressed=true]{color:#678e58!important}
.work-link{border-color:#e0ebdc;color:#527a58}
.review-progress{background:#f0f5ed}.review-progress h3{color:#63866b}
.no-review button{background:#eaf3e5;color:#527a58}
.empty-state h2{color:#3f6550}
.global-drop-overlay{background:#f4faf1f7;border-color:#a8c99c}.global-drop-overlay b{color:#50754b}
.toast{background:var(--brand)}
@media(max-width:620px){.header-inner{padding-top:21px;padding-bottom:20px;gap:9px}.brand-lockup{gap:8px}.brand-mark{width:34px;height:34px}.brand-type h1{font-size:20px;letter-spacing:-.8px}.brand-caption{font-size:8px;letter-spacing:1.2px;margin-top:2px}.header-extra{gap:1px}.header-extra button{font-size:11px;padding:7px 8px}}

$('unlock-form').addEventListener('submit',async ev=>{ev.preventDefault();const requestEpoch=sessionEpoch,requestAttempt=++unlockAttempt;const b=$('unlock-submit');b.disabled=true;b.textContent='正在解密…';$('unlock-error').textContent='';try{if(!crypto.subtle)throw Error('当前页面不支持浏览器解密，请通过HTTPS或本机服务打开。');const res=await fetch('./private.enc.json',{cache:'no-store'});if(!res.ok)throw Error('尚未找到这份报告的私有载荷。可先使用导入JSON。');const env=await res.json();if(requestEpoch!==sessionEpoch||requestAttempt!==unlockAttempt||!$('unlock-dialog').open)return;if(env.version!==1||env.kdf!=='PBKDF2-SHA256'||env.iterations!==310000)throw Error('加密载荷格式不支持。');const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode($('unlock-password').value),{name:'PBKDF2'},false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(env.salt),iterations:env.iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);let clear;try{clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(env.iv)},key,bytes(env.ciphertext))}catch(_){throw Error('口令不正确，或载荷无法校验。未显示任何私有内容。')}const payload=JSON.parse(new TextDecoder().decode(clear));if(requestEpoch!==sessionEpoch||requestAttempt!==unlockAttempt||!$('unlock-dialog').open)return;sessionLocked=false;mergePayload(payload,'encrypted_payload');$('unlock-dialog').close();switchTab('candidates');toast('私有档案已在当前浏览器解锁。口令不保存。')}catch(e){$('unlock-error').textContent=e.message||'解锁失败，请核对口令。'}finally{$('unlock-password').value='';b.disabled=false;b.textContent='解锁档案'}});
$('feedback-form').addEventListener('submit',async ev=>{ev.preventDefault();const epoch=sessionEpoch,cid=$('feedback-id').value,c=data.candidates.find(x=>x.id===cid);if(!c)return;const payload={candidate_id:cid,stage:$('feedback-stage').value,author:$('feedback-author').value.trim(),text:$('feedback-text').value.trim(),occurred_at:$('feedback-time').value?$('feedback-time').value.replace('T',' '):null,source:$('feedback-source').value.trim()||'用户手动补记；原文来源待补',outcome:$('feedback-outcome').value||null,supersedes:$('feedback-supersedes').value.trim()||null};const scoreText=$('feedback-score').value.trim();if(scoreText){const score=Number(scoreText);if(!Number.isFinite(score)||score<0||score>100){$('feedback-error').textContent='分数填0—100';return}payload.score=score}if(!payload.author||!payload.text){$('feedback-error').textContent='请填写真实评价人和原话。';return}try{let review;if(engineConnected&&engineIds.has(cid)&&payload.stage!=='unknown'){review=await api('/api/feedback',payload)}else review={id:uid(),...payload,recorded_at:timestamp(),attribution_status:'explicit_user_assignment'};if(epoch!==sessionEpoch)return;c.human_reviews=arr(c.human_reviews);c.human_reviews.push(review);if(typeof payload.score==='number')c.post_interview_score={score:payload.score,source:'用户面后评价',stage:'after'};preserveDecisionHistory(c);event('human_feedback_added',{candidate_id:cid,review});persist();renderAll();$('feedback-dialog').close();toast(engineConnected&&engineIds.has(cid)?'已记下，原记录仍保留。':'已记在当前页面；要长期保留，请在本机页面使用。')}catch(e){$('feedback-error').textContent=e.message}});
$('resume-file').addEventListener('change',ev=>ingestDroppedFile(ev.target.files[0]));$('choose-resume').addEventListener('click',()=>$('resume-file').click());$('reset-new').addEventListener('click',()=>{resetComposer();resetScreening()});
$('resume-form').addEventListener('submit',async ev=>{ev.preventDefault();if($('upload-dialog').open)$('upload-dialog').close();const b=$('screen-button');b.disabled=true;b.textContent='正在读取简历…';try{const epoch=sessionEpoch,file=chosenFile,text=$('resume-text').value.trim(),role=$('new-role').value,name=$('new-name').value.trim();if(!engineConnected)throw Error('请在这台Mac打开名单，再提交简历。');uploadActive=true;uploadFilename=file?.name||'粘贴的简历';$('candidate-query').value='';$('role-filter').value='all';switchTab('candidates');if(file&&/\.(pdf|docx|doc|png|jpg|jpeg)$/i.test(file.name)){if(!engineConnected)throw Error('Word、PDF和图片需要本机服务。可先粘贴正文，或使用已启动的本机收集页面。');const bytes=new Uint8Array(await file.arrayBuffer());if(epoch!==sessionEpoch)return;let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));sessionLocked=false;engineSignature=null;const result=await api('/api/upload',{filename:file.name,content_base64:btoa(binary),role,...(name?{name}: {})});if(epoch!==sessionEpoch)return;await refreshEngine();const c=data.candidates.find(x=>x.id===result.candidate_id);if(c)showScreening(c);toast(result.status==='duplicate'?'已打开这份简历的最新分析。':'简历已收到，自动开始分析。');return}if(!text)throw Error('请粘贴履历正文，或先选择可读文件。');if(text.length<30)throw Error('正文过短，请补齐经历与项目内容后再定位线索。');if(engineConnected){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));const filename=chosenFile&&/\.(txt|md)$/i.test(chosenFile.name)?chosenFile.name:'粘贴履历.txt';sessionLocked=false;engineSignature=null;const result=await api('/api/upload',{filename,content_base64:btoa(binary),role,...(name?{name}: {})});if(epoch!==sessionEpoch)return;await refreshEngine();const current=data.candidates.find(x=>x.id===result.candidate_id);if(current)showScreening(current);toast(result.status==='duplicate'?'已打开这份简历的最新分析。':'简历已收到，自动开始分析。');return}const hash=await digestText(text);if(epoch!==sessionEpoch)return;const old=data.candidates.find(c=>arr(c.documents).some(d=>d.sha256===hash)||c.source_sha256===hash);if(old){showScreening(old);toast('相同正文已存在，未重复建立候选。');return}const cid='cand-'+hash.slice(0,16),docid='doc-'+hash.slice(0,16),filename=chosenFile?.name||'粘贴履历.txt';const c={id:cid,name:name||filename.replace(/\.[^.]+$/,'')+'（待确认）',identity_status:name?'user_confirmed':'filename_label_unverified',role,status:'待人工确认',created_at:timestamp(),documents:[{id:docid,filename,sha256:hash,extraction_status:'text_extracted',source_type:'candidate_self_report',ingested_at:timestamp(),source_paths:[]}],source_content:text.split(/\n+/).map((t,i)=>({document_id:docid,locator:'正文第'+(i+1)+'段',text:t})).filter(s=>s.text.trim()),assessment:evaluateText(text,role),human_reviews:[],status_note:'本次从用户导入正文建立；姓名由用户填写或文件标签推定。未见面试证据。'};data.candidates.push(c);event('document_ingested',{candidate_id:cid,document_id:docid,sha256:hash,method:'browser_text_only'});selected=cid;persist();renderAll();showScreening(c);toast('已收到正文；本机页面可以自动保存并跟进。')}catch(e){toast(e.message,true)}finally{uploadActive=false;b.disabled=false;b.textContent='开始评价';renderCandidates()}});

$('requirements-open').addEventListener('click',openRequirements);document.querySelectorAll('[data-requirements-role]').forEach(b=>b.addEventListener('click',()=>{requirementsRole=b.dataset.requirementsRole;requirementsTab='focus';$('requirements-message').textContent='';renderRequirements()}));$('requirements-form').addEventListener('submit',async ev=>{ev.preventDefault();const text=$('requirements-text').value.trim();if(!text){$('requirements-message').textContent='写一句就好。';return}const save=$('requirements-save');save.disabled=true;try{await api('/api/requirements',{role:requirementsRole,text});$('requirements-text').value='';$('requirements-message').textContent='记下了，以后按这个看人。';await loadRequirements()}catch(e){$('requirements-message').textContent='没记下来，请再试一下。'}finally{save.disabled=false}});

$('header-resume').addEventListener('click',()=>$('resume-file').click());$('tools-open').addEventListener('click',()=>$('tools-dialog').showModal());$('paste-resume').addEventListener('click',()=>{$('tools-dialog').close();$('upload-dialog').showModal()});document.querySelectorAll('[data-material-tab]').forEach(b=>b.addEventListener('click',()=>{materialsTab=b.dataset.materialTab;renderMaterials()}));document.querySelectorAll('[data-requirements-tab]').forEach(b=>b.addEventListener('click',()=>{requirementsTab=b.dataset.requirementsTab;renderRequirements()}));
$('month-filter').addEventListener('change',applyListFilters);document.querySelectorAll('[data-score-kind]').forEach(b=>b.addEventListener('click',()=>{scoreKind=b.dataset.scoreKind;renderScoreEditor()}));$('score-form').addEventListener('submit',async ev=>{ev.preventDefault();const c=data.candidates.find(x=>x.id===scoreCandidateId),score=Number($('score-value').value);if(!c||!$('score-value').value.trim()||!Number.isFinite(score)||score<0||score>100)return;const epoch=sessionEpoch,save=$('score-save');save.disabled=true;$('score-error').textContent='';try{if(scoreKind==='resume'){if(!await changeMetadata(c,{resume_score:score}))return}else{await api('/api/feedback',{candidate_id:c.id,stage:'after',author:'我（用户录入）',text:'面后综合分：'+score,score,source:'用户手动调整面后综合分'});if(epoch!==sessionEpoch||sessionLocked)return;c.post_interview_score={score,source:'用户调整',stage:'after'};engineSignature=null;await refreshEngine()}if(epoch===sessionEpoch)$('score-dialog').close()}catch(e){if(epoch===sessionEpoch)$('score-error').textContent=e.message}finally{save.disabled=false}});

setupStatic();
try{const saved=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');if(saved?.consent&&saved.data){remember=true;$('persist-choice').checked=true;mergePayload(saved.data,'opted_in_browser_storage');$('storage-label').textContent='已恢复你选择保存在这台浏览器的档案。'}}catch(_){}
if(window.PRIVATE_BOOTSTRAP){try{mergePayload(window.PRIVATE_BOOTSTRAP,'local_private_bootstrap')}catch(e){toast('本地初始档案格式异常：'+e.message,true)}finally{delete window.PRIVATE_BOOTSTRAP;document.querySelectorAll('script').forEach(script=>{if(/^\s*window\.PRIVATE_BOOTSTRAP\s*=/.test(script.textContent||''))script.remove()})}}
renderAll();switchTab('candidates');connectEngine();setInterval(()=>{if(engineConnected&&!sessionLocked)refreshEngine().catch(()=>{});},2000);
</script></body></html>
