<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>招聘沟通复盘 · 私有报告</title><style>*{box-sizing:border-box}body{margin:0;background:#081525;color:#e6f1ff;font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}main{width:min(590px,100%);border:1px solid #2b4b70;background:linear-gradient(140deg,#132e4b,#0d1e32);border-radius:24px;padding:35px}.eyebrow{color:#8abfff;letter-spacing:3px;font-size:12px}h1{font-size:31px;line-height:1.4}p{color:#9db3cc}input,button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #3c6390;width:100%;margin:8px 0}input{background:#08192c;color:#fff}button{background:#357ee3;color:white;cursor:pointer}a{color:#91c9ff}#error{color:#ffbecd;min-height:25px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#081321}</style></head><body><main id="shell"><div class="eyebrow">CLAIR'S STUDIO / PRIVATE REPORT</div><h1>招聘沟通复盘<br>与候选人评价框架</h1><p>输入本报告专用口令，在当前浏览器解密查看。候选人正文已独立加密，口令不会保存。</p><form id="unlock"><label for="key">报告专用口令</label><input type="password" id="key" autocomplete="off" required><button id="submit">解密查看</button><div id="error" role="alert"></div></form><a href="./index.html">打开候选人评价器 ↗</a></main><script>const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));document.querySelector('#unlock').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#submit'),input=document.querySelector('#key');b.disabled=true;b.textContent='正在解密…';document.querySelector('#error').textContent='';try{const response=await fetch('./report.enc.json',{cache:'no-store'});if(!response.ok)throw Error('未找到加密报告');const p=await response.json(),m=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),{name:'PBKDF2'},false,['deriveKey']),k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(p.salt),iterations:p.iterations,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']),bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(p.iv)},k,d(p.ciphertext));const frame=document.createElement('iframe');frame.title='招聘沟通复盘完整报告';frame.sandbox='allow-scripts allow-modals allow-downloads';frame.srcdoc=new TextDecoder().decode(bytes);document.body.append(frame);document.querySelector('#shell').remove();}catch{document.querySelector('#error').textContent='口令不正确，或加密报告无法校验。';}finally{input.value='';b.disabled=false;b.textContent='解密查看';}});</script></body></html>
