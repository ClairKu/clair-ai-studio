function ecoNumber(p,k){const val=p.stage===4?ecoSnapshot[p.id][k]:null;if(val==null)return `<span class="eco-unavailable">${p.stage===4?'不可得':'未到生产阶段'}</span>`;return `<b class="eco-value">${['total','month','day'].includes(k)?short(val):fmt(val)}</b>${k==='mau'?'<small>仅可识别个人</small>':k==='keys'?'<small>共享 Key · 非用户数</small>':''}`;}
function ecoProjects(){let rows=data.projects.filter(p=>(selectedPlatform==='all'||p.id===selectedPlatform)&&(ecoStage==='all'||p.track===ecoStage)&&(ecoMode==='all'||p.mode===ecoMode)&&(ecoOwner==='all'||p.owner===ecoOwner)&&(!ecoSearch||[p.name,p.mode,p.progress,p.block,p.next,p.owner,ecoSnapshot[p.id].win].join(' ').toLowerCase().includes(ecoSearch.toLowerCase())));return rows.sort((a,b)=>ecoSort==='month'?(b.stage===4?ecoSnapshot[b.id].month:-1)-(a.stage===4?ecoSnapshot[a.id].month:-1):ecoSort==='due'?a.due.localeCompare(b.due):ecoSort==='updated'?b.updated.localeCompare(a.updated):b.stage-a.stage);}

function ecoPlatform(p){return `<button class="text-link eco-platform" data-detail="${p.id}"><span class="platform-icon">${esc(p.symbol)}</span><span><b>${esc(p.name)} ↗</b><small>${esc(p.track)}</small></span></button>`;}

function ecoTable(rows,cols){if(!rows.length)return '<div class="screenshot-empty">没有匹配的平台。可清空筛选重新查看。</div>';if(ecoOrientation==='columns'){const groups=[...new Set(cols.map(c=>c.group))];return `<table class="eco-table eco-transpose"><caption class="sr-only">平台为列、指标为行的纵向对照；所有数值与状态均为演示。</caption><thead><tr><th class="eco-frozen">指标 / 平台</th>${rows.map(p=>`<th>${ecoPlatform(p)}</th>`).join('')}</tr></thead><tbody>${groups.map(g=>`<tr class="eco-group-row"><th class="eco-frozen">${g}</th>${rows.map(()=>'<td></td>').join('')}</tr>${cols.filter(c=>c.group===g).map(c=>`<tr><th class="eco-frozen">${c.label}</th>${rows.map(p=>`<td class="${c.numeric?'eco-num':''}">${c.cell(p)}</td>`).join('')}</tr>`).join('')}`).join('')}<tr><th class="eco-frozen">详细档案</th>${rows.map(p=>`<td><button data-detail="${p.id}">查看截图与推进记录 ↗</button></td>`).join('')}</tr></tbody></table>`;}

function ecosystem(){const rows=ecoProjects(),cols=ecoColumnSet();return `${heading('B / Ecosystem partnership matrix','生态合作，一张表看全局','横向比数据与阶段，纵向追每家的重点与细节。',`<div class="row"><button data-act="eco-export">导出当前大表 CSV</button><button class="primary" data-act="edit">＋ 更新合作进展</button></div>`)}<div class="board-summary"><span><b>${data.projects.length}</b>跟进对象</span><span><b>${data.projects.filter(p=>p.stage===4).length}</b>进入运营验证</span><span><b>${data.projects.filter(p=>p.stage===2).length}</b>联调验收</span><span><b>${data.projects.filter(p=>p.stage<2).length}</b>共创与探索</span><span>数字 / 进展均为演示 · 不是实际合作情况</span></div><section class="card eco-matrix"><div class="section-head"><div><h2>生态合作全景大表</h2><small>冻结平台列与表头 · 表内可左右、上下滚动</small></div><div class="seg" aria-label="大表排列方向"><button data-eco-orientation="rows" class="${ecoOrientation==='rows'?'on':''}">平台为行 · 横向总览</button><button data-eco-orientation="columns" class="${ecoOrientation==='columns'?'on':''}">平台为列 · 纵向对照</button></div></div><div class="eco-filters"><label>关键词<input id="eco-search" type="search" placeholder="搜索平台、进展、阻塞…" value="${esc(ecoSearch)}"></label>${ecoSelect('eco-stage','阶段',['上线运营','联调验收','方案共创','探索验证'],ecoStage)}${ecoSelect('eco-mode','模式',[...new Set(data.projects.map(p=>p.mode))],ecoMode)}${ecoSelect('eco-owner','负责人',[...new Set(data.projects.map(p=>p.owner))],ecoOwner)}<label>排序<select id="eco-sort">${[['priority','按阶段优先'],['month','本月调用从高到低'],['due','按计划节点'],['updated','最近更新优先']].map(([k,v])=>`<option value="${k}" ${ecoSort===k?'selected':''}>${v}</option>`).join('')}</select></label><button data-act="eco-reset">清空筛选</button></div><div class="section-head eco-toolbar"><div class="seg" aria-label="大表字段范围">${[['overview','老板总览'],['data','关键数据'],['progress','合作推进'],['resources','成果与投入'],['all','全部字段']].map(([k,l])=>`<button data-eco-preset="${k}" class="${ecoPreset===k?'on':''}">${l}</button>`).join('')}</div><small>当前 ${rows.length} 家 · ${cols.length} 个字段 · <span id="eco-scroll-state">可横向滚动查看更多 →</spa function exportEcoCsv(){const cols=ecoColumnSet(),rows=ecoProjects(),plain=html=>{const e=document.createElement('div');e.innerHTML=html;return e.textContent;},quote=v=>'"'+String(v).replace(/"/g,'""')+'"',csv='\uFEFF'+[['平台（演示）',...cols.map(c=>c.label)],...rows.map(p=>[p.name,...cols.map(c=>plain(c.cell(p)))])].map(r=>r.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='oap-ecosystem-demo-table-2026-10-17.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function about(){openDrawer('怎么选：三套视角，一份底层资料',`<div class="card"><h3>推荐组合：A 做首页，B、C 做深一层</h3><p class="note">老板先看 30 秒判断和核心指标；追问合作就进入 B；追问成果、投入和新方向就进入 C。维护一份资料，不需要反复做三份汇报。</p></div><div class="grid" style="gap:12px">${[['A · CEO 总览','适合随时同步、月度经营会','关键指标、趋势、最新变化、重大阻塞、待决策。','首屏控制为一个判断、六项指标、三条变化、两项决策。'],['B · 生态推进室','适合周会与跨团队推进','合作阶段、合作模式、责任人、节点、验收、证据与截图。','独立记录上架、授权、真实调用和持续使用，支持项目回退。'],['C · 成果与投入','适合阶段汇报与资源评审','投入 → 交付 → 关键突破 → 成效；合作模式与探索去留。','投入不是成效，商业方案不是收入；允许明确写“待验证”。']].map(([t,s,c,n])=>`<div class="card"><h3>${t}</h3>${tag(s,'purple')}<p class="note">${c}</p><p class="note">${n}</p></div>`).join('')}</div><div class="card gap-top"><h3>正式版最小落地方案</h3><div class="detail-pair"><span>共享资料</span><b>企业登录后的合作表、截图库与更新日志</b></div><div class="detail-pair"><span>数据刷新</span><b>只读汇总服务，先人工刷新，稳定后定时</b></div><div class="detail-pair"><span>维护成本</span><b>负责人每次填变化、下一步、时间、证据</b></div><div class="detail-pair"><span>汇报交付</span><b>当前版 + 历史快照 + 可打印汇报页</b></div><div class="detail-pair"><span>必需资源</span><b>产品 Owner、前端、数据支持、平台对接人</b></div><p class="note">实施顺序建议：先确定结构与指标身份口径，再接真实数据，最后接共享编辑与权限。截图和内部资料应存受控空间，公开预览仅放演示内容。</p></div><div class="card"><h3>现在可以试什么</h3><p class="note">切换三套视角；切日期与日/月粒度；点平台看档案；保存进展；附截图；导入示例 JSON；导出或恢复本地备份；打印当前视角。</p></div>`);}
function definitions(){openDrawer('指标口径 · 正式版需冻结',`<div class="card"><h3>先区分四类对象</h3><p class="note">个人用户 ≠ API Key ≠ 合作平台 ≠ 金融机构。一家公司可有多个 Key；平台共享 Key 可承载许多无法识别的个人用户。</p></div>${[['累计调用量 / 日调用 / 月调用','按请求标识去重，保留成功与失败；内部测试、健康检查与重试规则单独定义。累计覆盖从正式上线日起的可得历史，缺失数据展示缺口，不补零。'],['月活用户','按可识别个人 ID 在自然月内去重。第三方没有回传个人身份时，月活显示不可得或“仅可识别部分”，不能把 API Key 数叫作用户数。'],['月活跃 Key','自然月内有生产调用的不同 API Key 数，作为独立技术采用指标。既有“滚动30日活跃 Key”口径需另列，不与自然月 MAU 混用。'],['调用金融机构数','已认证金融机构且有实际生产调用的 institution_id 去重。累计与月内分别统计，不把支持查询的机构数量、注册机构数或合作平台数算进去。'],['上架 / 授权 / 使用','记录真实分发入口、版本与最近复核日；分别判断可发现、可连接、已授权、任务成功、持续使用。安装或配置不等于已经执行。'],['成效与归因','调用是使用量，不能直接证明新增客户、资金、收入或留存。要有渠道标识、身份映射、观察窗与业务事件对账，才显示渠道成效。'],['本月与完整月','本月未结束时标明月初至截止日，不直接与上个完整月计算增长率；可选同日进度同比。日趋势与月趋势聚合规则需一致。']].map(([t,s])=>`<div class="card"><h3>${t}</h3><p class="note">${s}</p></div>`).join('')}<div class="card"><h3>示例中的月活跃 Key</h3><p class="note">${data.monthly.map(m=>`${m.month}：${fmt(m.activeKeys)} 个 Key`).join('；')}。它与首页的可识别个人月活不是一个分母。</p></div>`);}
function download(name,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T00:00:00Z'))&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)===s;}
function validateMetrics(v){if(v.schemaVersion!==1)throw Error('schemaVersion 需为 1');if(!validDate(v.asOf))throw Error('asOf 需为有效 YYYY-MM-DD');if(!Array.isArray(v.daily)||!v.daily.length||v.daily.length>4000)throw Error('daily 需含 1—4000 条日数据');let prev='';for(const d of v.daily){if(!validDate(d.date)||d.date<=prev||d.date>v.asOf)throw Error('日数据日期须按升序唯一排列，且不超过截止日');prev=d.date;for(const f of ['calls','successful','activeKeys','financialInstitutions'])if(!Number.isSafeInteger(d[f])||d[f]<0)throw Error(f+' 需为非负整数');if(d.successful>d.calls)throw Error('成功调用不能大于总调用');}if(v.daily.at(-1).date!==v.asOf)throw Error('最后一条日数据日期须等于 asOf');if(!Number.isSafeInteger(v.totalInstitutions)||v.totalInstitutions<0)throw Error('totalInstitutions 需为非负整数');if(v.daily.some(d=>d.financialInstitutions>v.totalInstitutions))throw Error('单日调用机构不能大于累计机构');if(!Array.isArray(v.monthly))throw Error('monthly 需为数组');let pm='';for(const m of v.monthly){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(m.month)||m.month<=pm||m.month>v.asOf.slice(0,7))throw Error('月份须升序且不超过截止月份');pm=m.month;for(const f of ['activeUsers','activeKeys','financialInstitutions'])if(!Number.isSafeInteger(m[f])||m[f]<0)throw Error('月指标 '+f+' 需为非负整数');if(m.financialInstitutions>v.totalInstitutions)throw Error('月内机构不能大于累计机构');}return true;}
function validate(v){validateMetrics(v);if(!Array.isArray(v.projects)||v.projects.length!==baseProjects.length)throw Error('备份项目结构不匹配');for(const p of v.projects){if(!baseProjects.some(d=>d.id===p.id))throw Error('未知平台');for(const f of ['name','symbol','mode','owner','next','due','progress','updated','block','evidence','success','image'])if(typeof p[f]!=='string')throw Error('项目字段 '+f+' 不合法');if(!validDate(p.due)||!validDate(p.updated)||!['上线运营','联调验收','方案共创','探索验证'].includes(p.track))throw Error('项目日期或阶段不合法');if(!Number.isInteger(p.stage)||p.stage<0||p.stage>4||!Array.isArray(p.events)||p.events.length>1000)throw Error('项目阶段或历史不合法');if(p.image&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.image))throw Error('截图内容不合法');if(p.image.length>1500000)throw Error('单张截图过大');for(const e of p.events)for(const f of ['at','progress','track','next'])if(typeof e[f]!=='string')throw Error('历史记录结构不合法');}if(new Set(v.projects.map(p=>p.id)).size!==baseProjects.length)throw Error('项目 ID 重复');return true;}
function shrink(file){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024)return reject(Error('请选择 5MB 以内的 PNG、JPEG 或 WebP'));const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1100/img.width,1100/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72));};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('图片无法读取'));};img.src=url;});}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ecoOrientation){ecoOrientation=b.dataset.ecoOrientation;render();return;}if(b.dataset.ecoPreset){ecoPreset=b.dataset.ecoPreset;render();return;}if(b.dataset.ecoExpand){const id=b.dataset.ecoExpand;ecoExpanded.has(id)?ecoExpanded.delete(id):ecoExpanded.add(id);render();return;}if(b.dataset.view){view=b.dataset.view;history.replaceState(null,'','#'+view);render();return;}if(b.dataset.detail){detail(b.dataset.detail);return;}if(b.dataset.edit){editor(b.dataset.edit);return;}if(b.dataset.range){range=b.dataset.range;end=data.asOf;const t=new Date(end+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-Number(range)+1);start=range==='all'?data.daily[0].date:[data.daily[0].date,t.toISOString().slice(0,10)].sort().at(-1);render();return;}if(b.dataset.metric){chartMetric=b.dataset.metric;render();return;}if(b.dataset.grain){grain=b.dataset.grain;render();return;}const a=b.dataset.act;if(a==='eco-left'||a==='eco-right'){$('.eco-scroll').scrollBy({left:(a==='eco-left'?-1:1)*600,behavior:'smooth'});return;}if(a==='eco-export'){exportEcoCsv();return;}if(a==='eco-reset'){ecoStage=ecoMode=ecoOwner=selectedPlatform='all';ecoSearch='';ecoSort='priority';ecoExpanded.clear();render();return;}if(a==='close')closeDrawer();else if(a==='about')about();else if(a==='definitions')definitions();else if(a==='edit')editor();else if(a==='print')window.print();else if(a==='apply-date'){const s=$('#start-date').value,t=$('#end-date').value;if(!validDate(s)||!validDate(t)||s>t||s<data.daily[0].date||t>data.asOf){toast('请选择数据范围内且起止顺序正确的日期');return;}start=s;end=t;range='custom';render();}else if(a==='sample'){const {schemaVersion,asOf,daily,monthly,totalInstitutions}=base;download('oap-demo-metrics.json',{schemaVersion,asOf,daily,monthly,totalInstitutions});}else if(a==='import')$('#metrics-file').click();else if(a==='export')download('oap-template-local-backup.json',data);else if(a==='restore')$('#restore-file').click();else if(a==='reset'){if(!confirm('恢复演示初始数据？此浏览器保存的进展和截图会被清除，请先导出备份。'))return;data=structuredClone(base);localChanged=false;localStorage.removeItem(key);start=data.daily[0].date;end=data.asOf;range='all';render();editor();toast('已恢复演示初始数据');}});
document.addEventListener('change',async e=>{if(['eco-stage','eco-mode','eco-owner','eco-sort'].includes(e.target.id)){const v=e.target.value;if(e.target.id==='eco-stage')ecoStage=v;if(e.target.id==='eco-mode')ecoMode=v;if(e.target.id==='eco-owner')ecoOwner=v;if(e.target.id==='eco-sort')ecoSort=v;render();return;}if(e.target.id==='platform-filter'){selectedPlatform=e.target.value;render();}else if(e.target.id==='edit-project')editor(e.target.value);else if(e.target.id==='shot-file'){const file=e.target.files[0];if(!file)return;try{const uri=await shrink(file);$('#shot-preview').innerHTML=`<img class="screenshot-img" src="${uri}" alt="待保存的截图预览">`;$('#shot-preview').dataset.image=uri;}catch(err){$('#edit-error').textContent=err.message;e.target.value='';}}else if(['metrics-file','restore-file'].includes(e.target.id)){const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('文件需小于 10MB');const v=JSON.parse(await f.text());if(e.target.id==='restore-file'){validate(v);data=structuredClone(v);}else{validateMetrics(v);data={...data,schemaVersion:1,asOf:v.asOf,daily:v.daily,monthly:v.monthly,totalInstitutions:v.totalInstitutions};}start=data.daily[0].date;end=data.asOf;range='all';const ok=persist();render();if(ok){editor();toast('已导入并保存到本浏览器；未同步服务器');}}catch(err){$('#import-error').textContent='导入失败：'+err.message;}}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id!=='eco-search')return;const value=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{ecoSearch=value;render();const f=$('#eco-search');f.focus();f.setSelectionRange(value.length,value.length);},180);});
document.addEventListener('submit',e=>{if(e.target.id!=='update-form')return;e.preventDefault();const f=new FormData(e.target),id=$('#edit-project').value,p=data.projects.find(p=>p.id===id),s=Object.fromEntries(f.entries());if(!s.progress.trim()||!s.next.trim()||!s.owner.trim()||!validDate(s.due)){ $('#edit-error').textContent='请填写变化、下一步、负责人和有效日期';return;}const stageByTrack={'上线运营':4,'联调验收':2,'方案共创':1,'探索验证':0};Object.assign(p,s,{updated:new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}),stage:stageByTrack[s.track]});if($('#shot-preview').dataset.image)p.image=$('#shot-preview').dataset.image;p.events.push({at:new Date().toISOString(),progress:s.progress,track:s.track,next:s.next});const ok=persist();render();if(ok){detail(id);toast('进展已保存到本浏览器，已更新最新变化');}});
document.addEventListener('keydown',e=>{const dialog=$('[role=dialog]');if(!dialog)return;if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const els=[...dialog.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled&&!el.closest('.hidden'));const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{if(['executive','ecosystem','outcomes'].includes(location.hash.slice(1))){view=location.hash.slice(1);render();}});render();
})();
</script></body></html>
