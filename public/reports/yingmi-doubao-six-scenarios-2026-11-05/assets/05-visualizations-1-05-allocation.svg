<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">把100万元按用途分开讨论</title><desc id="desc">12万元应急、30万元12个月后装修、58万元5年以上长期目标。用途愿望不是现成可用现金，也不是投资建议。</desc><g font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect x="1" y="1" width="1098" height="548" fill="#FFFFFF" rx="22" stroke="#E2E8EC"/><text x="52" y="48" font-size="16" fill="#61717D" font-weight="600" text-anchor="start">05  ·  资产配置讨论</text><text x="52" y="92" font-size="30" fill="#253847" font-weight="650" text-anchor="start">把100万元按用途分开讨论</text><text x="52" y="125" font-size="18" fill="#61717D" font-weight="400" text-anchor="start">虚构客户的用途愿望  ·  三笔互不重叠  ·  金额合计100万元</text><rect x="60" y="175" width="117.6" height="60" fill="#365E79" rx="0"/><text x="118.8" y="214" font-size="24" fill="#FFFFFF" font-weight="650" text-anchor="middle">12%</text><rect x="177.6" y="175" width="294" height="60" fill="#7395A7" rx="0"/><text x="324.6" y="214" font-size="24" fill="#FFFFFF" font-weight="650" text-anchor="middle">30%</text><rect x="471.6" y="175" width="568.4" height="60" fill="#A7B8C4" rx="0"/><text x="755.8" y="214" font-size="24" fill="#253847" font-weight="650" text-anchor="middle">58%</text><rect x="60" y="283" width="8" height="108" fill="#365E79" rx="3"/><text x="84" y="305" font-size="22" fill="#253847" font-weight="600" text-anchor="start">应急储备</text><text x="84" y="349" font-size="32" fill="#253847" font-weight="650" text-anchor="start">12万元</text><text x="84" y="384" font-size="19" fill="#61717D" font-weight="400" text-anchor="start">随需预留</text><rect x="395" y="283" width="8" height="108" fill="#7395A7" rx="3"/><text x="419" y="305" font-size="22" fill="#253847" font-weight="600" text-anchor="start">装修支出</text><text x="419" y="349" font-size="32" fill="#253847" font-weight="650" text-anchor="start">30万元</text><text x="419" y="384" font-size="19" fill="#61717D" font-weight="400" text-anchor="start">12个月后</text><rect x="730" y="283" width="8" height="108" fill="#A7B8C4" rx="3"/><text x="754" y="305" font-size="22" fill="#253847" font-weight="600" text-anchor="start">长期目标</text><text x="754" y="349" font-size="32" fill="#253847" font-weight="650" text-anchor="start">58万元</text><text x="754" y="384" font-size="19" fill="#61717D" font-weight="400" text-anchor="start">5年以上</text><text x="52" y="449" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">来源：本轮虚构客户输入；12 + 30 + 58 = 100，未重复计算资金池。</text><text x="52" y="481" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">用途愿望不代表现有持仓可按期变现；交易规则与资金可用性仍须另行核实。</text><text x="52" y="519" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">本图不是资产配置推荐、收益预测或逐笔交易方案。</text></g></svg>