<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">指数区间涨跌幅</title><desc id="desc">沪深300与创业板指，在最近5个交易日及10月9日至11月4日区间的涨跌幅。数据为本轮返回摘要，仍待来源复核。</desc><g font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect x="1" y="1" width="1098" height="568" fill="#FFFFFF" rx="22" stroke="#E2E8EC"/><text x="52" y="48" font-size="16" fill="#61717D" font-weight="600" text-anchor="start">01  ·  市场分析</text><text x="52" y="92" font-size="30" fill="#253847" font-weight="650" text-anchor="start">指数区间涨跌幅</text><text x="52" y="125" font-size="18" fill="#61717D" font-weight="400" text-anchor="start">截至2026-11-04收盘  ·  单位：%  ·  按期末／期初收盘点位计算</text><rect x="52" y="151" width="13" height="13" fill="#365E79" rx="2"/><text x="76" y="163" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">5个交易日：10-28收盘 → 11-04</text><rect x="560" y="151" width="13" height="13" fill="#A7B8C4" rx="2"/><text x="584" y="163" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">较长区间：10-09收盘 → 11-04</text><line x1="300" y1="190" x2="300" y2="425" stroke="#E2E8EC" stroke-width="1"/><text x="300" y="458" font-size="16" fill="#61717D" font-weight="400" text-anchor="middle">-20%</text><line x1="444" y1="190" x2="444" y2="425" stroke="#E2E8EC" stroke-width="1"/><text x="444" y="458" font-size="16" fill="#61717D" font-weight="400" text-anchor="middle">-15%</text><line x1="588" y1="190" x2="588" y2="425" stroke="#E2E8EC" stroke-width="1"/><text x="588" y="458" font-size="16" fill="#61717D" font-weight="400" text-anchor="middle">-10%</text><line x1="732" y1="190" x2="732" y2="425" stroke="#E2E8EC" stroke-width="1"/><text x="732" y="458" font-size="16" fill="#61717D" font-weight="400" text-anchor="middle">-5%</text><line x1="876" y1="190" x2="876" y2="425" stroke="#61717D" stroke-width="1.4"/><text x="876" y="458" font-size="16" fill="#61717D" font-weight="400" text-anchor="middle">0%</text><line x1="1020" y1="190" x2="1020" y2="425" stroke="#E2E8EC" stroke-width="1"/><text x="1020" y="458" font-size="16" fill="#61717D" font-weight="400" text-anchor="middle">+5%</text><text x="52" y="249" font-size="25" fill="#253847" font-weight="600" text-anchor="start">沪深300</text><rect x="876" y="226" width="12.32" height="24" fill="#365E79" rx="3"/><text x="898.32" y="245" font-size="20" fill="#253847" font-weight="600" text-anchor="start">+0.43%</text><rect x="731.968" y="264" width="144.032" height="24" fill="#A7B8C4" rx="3"/><text x="721.968" y="283" font-size="20" fill="#253847" font-weight="600" text-anchor="end">-5.00%</text><text x="52" y="363" font-size="25" fill="#253847" font-weight="600" text-anchor="start">创业板指</text><rect x="777.59" y="340" width="98.41" height="24" fill="#365E79" rx="3"/><text x="767.59" y="359" font-size="20" fill="#253847" font-weight="600" text-anchor="end">-3.42%</text><rect x="404.159" y="378" width="471.841" height="24" fill="#A7B8C4" rx="3"/><text x="394.159" y="397" font-size="20" fill="#253847" font-weight="600" text-anchor="end">-16.38%</text><text x="52" y="508" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">来源：本轮返回的收盘点位摘要；具体源返回仍待复核。</text><text x="52" y="536" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">两个窗口长度不同；较长区间为26个自然日，不包装成标准“近1个月”。</text></g></svg>