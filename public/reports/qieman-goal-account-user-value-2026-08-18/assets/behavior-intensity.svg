<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">目标账户样本构成、复投率和平均在管天数对比</title>
  <desc id="desc">样本总计263485人，有目标账户用户占23.17%。有目标账户用户复投率98.57%，无目标账户89.54%；平均在管天数分别为1914.9天和1702.6天。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F7FA"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D86F2"/>
      <stop offset="1" stop-color="#7457E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2D2360" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="66" fill="#7457E8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="800" letter-spacing="2.2">BEHAVIOR INTENSITY · 持续投资行为</text>
  <text x="64" y="112" fill="#171A27" font-family="'Songti SC',STSong,serif" font-size="34" font-weight="600">从一次投资，走向持续关系</text>

  <g filter="url(#shadow)">
    <rect x="64" y="142" width="322" height="462" rx="28" fill="#10182C"/>
    <rect x="416" y="142" width="720" height="462" rx="28" fill="#FFFFFF"/>
  </g>

  <text x="94" y="184" fill="#B7ADEE" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">COHORT · 样本构成</text>
  <circle cx="225" cy="313" r="92" fill="none" stroke="#27314A" stroke-width="30"/>
  <circle cx="225" cy="313" r="92" fill="none" stroke="#9D86F2" stroke-width="30" stroke-linecap="round" stroke-dasharray="133.9 444.2" transform="rotate(-90 225 313)"/>
  <text x="225" y="304" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="36" font-weight="900">23.2%</text>
  <text x="225" y="333" text-anchor="middle" fill="#AEB8CD" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13">有目标用户占比</text>
  <text x="225" y="416" text-anchor="middle" fill="#FFFFFF" font-family="'Songti SC',STSong,serif" font-size="28" font-weight="600">61,056 人</text>
  <text x="225" y="443" text-anchor="middle" fill="#8794AB" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12">总样本 263,485 人</text>
  <line x1="94" y1="481" x2="356" y2="481" stroke="#29344E"/>
  <circle cx="108" cy="521" r="6" fill="#9D86F2"/>
  <text x="124" y="526" fill="#D5D9E4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700">有目标 23.17%</text>
  <circle cx="108" cy="555" r="6" fill="#5F6A80"/>
  <text x="124" y="560" fill="#9EA9BC" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700">无目标 76.83%</text>

  <text x="456" y="184" fill="#7457E8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">01 · REINVESTMENT RATE</text>
  <text x="456" y="218" fill="#171A27" font-family="'Songti SC',STSong,serif" font-size="25" font-weight="600">复投率接近 99%</text>
  <text x="1090" y="214" text-anchor="end" fill="#5138B5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" font-weight="900">+9.03pp</text>
  <line x1="514" y1="284" x2="1050" y2="284" stroke="#D9DCE4" stroke-width="8" stroke-linecap="round"/>
  <line x1="770" y1="284" x2="1012" y2="284" stroke="url(#purple)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="770" cy="284" r="13" fill="#FFFFFF" stroke="#98A1B3" stroke-width="7"/>
  <circle cx="1012" cy="284" r="14" fill="#FFFFFF" stroke="#7457E8" stroke-width="8"/>
  <text x="770" y="263" text-anchor="middle" fill="#687287" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="800">89.54%</text>
  <text x="1012" y="263" text-anchor="middle" fill="#5138B5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="900">98.57%</text>
  <g fill="#8A92A3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="514" y="313">80%</text><text x="782" y="313">90%</text><text x="1050" y="313">100%</text>
  </g>

  <line x1="456" y1="349" x2="1096" y2="349" stroke="#ECEEF2"/>
  <text x="456" y="389" fill="#7457E8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">02 · MANAGED DAYS</text>
  <text x="456" y="423" fill="#171A27" font-family="'Songti SC',STSong,serif" font-size="25" font-weight="600">平均在管多约 7 个月</text>
  <text x="1090" y="419" text-anchor="end" fill="#5138B5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" font-weight="900">+212.3天</text>

  <text x="456" y="473" fill="#687287" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="700">无目标</text>
  <rect x="522" y="456" width="505" height="22" rx="11" fill="#EAECF1"/>
  <rect x="522" y="456" width="430" height="22" rx="11" fill="#98A1B3"/>
  <text x="966" y="473" fill="#687287" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="800">1,702.6天</text>

  <text x="456" y="526" fill="#5138B5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="800">有目标</text>
  <rect x="522" y="509" width="505" height="22" rx="11" fill="#F0EDFF"/>
  <rect x="522" y="509" width="484" height="22" rx="11" fill="url(#purple)"/>
  <text x="1018" y="526" fill="#5138B5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="900">1,914.9天</text>
  <text x="456" y="568" fill="#8A92A3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11">平均值 · 横轴零基线；统计起止口径待补充</text>

  <rect x="64" y="626" width="1072" height="1" fill="#E3E5EC"/>
  <text x="64" y="653" fill="#687287" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12">三个方向同向：持续行动（复投） · 长期在场（在管时长） · 计划连续性（留存）</text>
  <text x="1136" y="653" text-anchor="end" fill="#D99A2B" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="800">观察性相关 · 非因果实验</text>
</svg>
