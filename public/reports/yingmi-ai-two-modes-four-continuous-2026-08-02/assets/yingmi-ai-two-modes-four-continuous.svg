  <circle cx="554" cy="862" r="4" fill="#b8a7ff"/><text x="570" y="868" class="bullet-light">首个财富 MCP Server</text>
  <circle cx="554" cy="900" r="4" fill="#b8a7ff"/><text x="570" y="906" class="bullet-light">首个理财测评集 / 投顾智能立体模型</text>
  <circle cx="554" cy="938" r="4" fill="#b8a7ff"/><text x="570" y="944" class="bullet-light">首个投顾龙虾 OpenClaw</text>
  <circle cx="554" cy="976" r="4" fill="#b8a7ff"/><text x="570" y="982" class="bullet-light">首批千问 MCP / A2A 接入合作商</text>

  <rect x="980" y="708" width="422" height="316" rx="24" fill="#ffffff" stroke="#ddd7f1" filter="url(#shadow)"/>
