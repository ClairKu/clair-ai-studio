  <text x="1008" y="823" class="metric">8类生态伙伴</text>
  <text x="1008" y="856" class="bullet">阿里云 / 百炼 · 百度 · 火山 / 扣子</text>
  <text x="1008" y="884" class="bullet">华为 / 小艺 · 夸克 / 千问</text>
  <text x="1008" y="912" class="bullet">腾讯 / 微信 / WorkBuddy · 智谱</text>
  <text x="1008" y="940" class="bullet">金融机构</text>
  <rect x="1008" y="960" width="168" height="42" rx="13" fill="#eeeaff"/>
  <text x="1092" y="987" class="chip" text-anchor="middle">活动 10场+</text>
  <rect x="1188" y="960" width="186" height="42" rx="13" fill="#f2f0f7"/>
  <text x="1281" y="987" class="chip" text-anchor="middle">交流机构 30家+</text>

  <rect x="1442" y="708" width="422" height="316" rx="24" fill="#ffffff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="1470" y="748" class="eyebrow sans">04 · KEEP VISIBLE</text>
  <text x="1470" y="790" class="card-title">持续曝光</text>
  <text x="1470" y="823" class="metric">8,965篇报道</text>
  <rect x="1470" y="844" width="176" height="44" rx="13" fill="#eeeaff"/><text x="1558" y="872" class="chip" text-anchor="middle">原创 50+</text>
  <rect x="1658" y="844" width="178" height="44" rx="13" fill="#f2f0f7"/><text x="1747" y="872" class="chip" text-anchor="middle">阅读 3万+</text>
  <rect x="1470" y="900" width="176" height="44" rx="13" fill="#f2f0f7"/><text x="1558" y="928" class="chip" text-anchor="middle">发布 300+篇</text>
  <rect x="1658" y="900" width="178" height="44" rx="13" fill="#eeeaff"/><text x="1747" y="928" class="chip" text-anchor="middle">MCP 3,329篇</text>
  <rect x="1470" y="956" width="176" height="44" rx="13" fill="#eeeaff"/><text x="1558" y="984" class="chip" text-anchor="middle">互动 300万+</text>
  <rect x="1658" y="956" width="178" height="44" rx="13" fill="#f2f0f7"/><text x="1747" y="984" class="chip" text-anchor="middle">浏览 1,000万+</text>

  <text x="64" y="1060" class="note sans">来源：用户提供关键行动素材（2026-08-02）及盈米 AI 阶段成果源稿；“首个 / 首批”、活动与机构口径用于外部引用前仍需补公开证据。</text>
</svg>
