  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="70" r="260" fill="none" stroke="#8067e8" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1740" cy="70" r="190" fill="none" stroke="#8067e8" stroke-opacity="0.07" stroke-width="2"/>

  <text x="64" y="48" class="eyebrow sans">YINGMI AI · CAUSAL ACTION MAP</text>
  <text x="64" y="104" class="title">四个持续驱动平台运转 · 两种模式放大势能</text>
  <text x="64" y="141" class="subtitle">核心举措持续供给 → 平台沉淀与编排 → 两种接入触达更多群体 → 放大势能</text>

