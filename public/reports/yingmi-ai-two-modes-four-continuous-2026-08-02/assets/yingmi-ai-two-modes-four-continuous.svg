  <path d="M1370 348 C1370 312 1220 306 1100 282" fill="none" stroke="#8067e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="960" y="314" class="sans" font-size="14" fill="#8067e8" text-anchor="middle">扩大触达</text>

  <rect x="160" y="344" width="760" height="126" rx="24" fill="#ffffff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <circle cx="215" cy="407" r="30" fill="#eeeaff"/>
  <text x="215" y="417" class="sans" font-size="27" font-weight="700" fill="#8067e8" text-anchor="middle">A</text>
