  <text x="960" y="617" class="sans" font-size="13" style="fill:#9fabc1" text-anchor="middle">沉淀能力 · 统一编排 · 服务输出</text>

  <path d="M267 690 C267 660 550 652 720 630" fill="none" stroke="#8067e8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M729 690 C729 660 820 652 900 630" fill="none" stroke="#8067e8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1191 690 C1191 660 1100 652 1020 630" fill="none" stroke="#8067e8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1653 690 C1653 660 1370 652 1200 630" fill="none" stroke="#8067e8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="960" y="665" class="sans" font-size="14" fill="#8067e8" text-anchor="middle">持续注入能力、首发机会、合作生态与品牌声量</text>

  <text x="64" y="692" class="module sans">MODULE 01 · 核心运转模块｜四个持续</text>

  <rect x="56" y="708" width="422" height="316" rx="24" fill="#ffffff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="84" y="748" class="eyebrow sans">01 · KEEP BUILDING</text>
  <text x="84" y="790" class="card-title">持续建设</text>
  <text x="84" y="823" class="metric">3层能力</text>
  <rect x="84" y="844" width="366" height="62" rx="16" fill="#f1edfc"/>
