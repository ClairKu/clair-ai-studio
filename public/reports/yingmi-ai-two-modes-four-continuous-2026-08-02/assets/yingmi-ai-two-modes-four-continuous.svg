  <rect x="456" y="166" width="1008" height="116" rx="30" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="960" y="213" class="outcome" text-anchor="middle">触达更多群体 · 放大平台势能</text>
  <text x="960" y="248" class="outcome-sub" text-anchor="middle">更多入口｜更多场景｜更多用户｜更多机会</text>
  <rect x="1490" y="175" width="132" height="42" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <text x="1556" y="202" class="sans" font-size="15" fill="#ffffff" text-anchor="middle">互动 300万+</text>
