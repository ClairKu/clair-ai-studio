  <circle cx="92" cy="938" r="4" fill="#8067e8"/><text x="108" y="944" class="bullet">标准连接 → 专业流程 → 完整任务</text>
  <circle cx="92" cy="978" r="4" fill="#8067e8"/><text x="108" y="984" class="bullet">能力持续沉淀并形成可复用资产</text>

  <rect x="518" y="708" width="422" height="316" rx="24" fill="url(#navy)" filter="url(#shadow)"/>
