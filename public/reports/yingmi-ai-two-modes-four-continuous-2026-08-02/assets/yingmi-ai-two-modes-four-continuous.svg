<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 两大模式与四个持续关键行动图</title>
  <desc id="desc">两大接入模式汇入盈米 AI 开放平台，通过持续建设、持续抢先、持续合作、持续曝光放大势能，底部展示传播与交流成果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="0.58" stop-color="#f3f0fc"/>
      <stop offset="1" stop-color="#ebe6fa"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8067e8"/>
      <stop offset="1" stop-color="#a992ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#202a49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#35266f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8067e8"/>
    </marker>
    <style>
      text{font-family:"Songti SC","Noto Serif SC",STSong,SimSun,serif;fill:#161927}
      .sans{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .eyebrow{font-size:17px;font-weight:700;letter-spacing:4px;fill:#8067e8}
      .title{font-size:54px;font-weight:700;letter-spacing:-1px}
      .subtitle{font-size:22px;fill:#687287}
      .mode-title{font-size:28px;font-weight:700}
      .mode-body{font-size:17px;fill:#687287}
      .platform-title{font-size:35px;font-weight:700;fill:white}
      .platform-sub{font-size:17px;fill:#ece8ff}
      .card-index{font-size:16px;font-weight:700;fill:#8067e8;letter-spacing:2px}
      .card-title{font-size:30px;font-weight:700}
      .card-sub{font-size:17px;fill:#687287}
      .bullet{font-size:18px;fill:#354058}
      .card-index-light{font-size:16px;font-weight:700;fill:#b8a7ff;letter-spacing:2px}
      .card-title-light{font-size:30px;font-weight:700;fill:#ffffff}
      .card-sub-light{font-size:17px;fill:#b7c1d5}
      .bullet-light{font-size:18px;fill:#eef0f8}
      .metric{font-size:34px;font-weight:700;fill:#8067e8}
      .metric-wide{font-size:28px;font-weight:700;fill:#8067e8}
      .metric-label{font-size:16px;font-weight:700;fill:#3e4860}
      .metric-note{font-size:14px;fill:#7a8497}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="70" r="260" fill="none" stroke="#8067e8" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1740" cy="70" r="190" fill="none" stroke="#8067e8" stroke-opacity="0.07" stroke-width="2"/>
  <path d="M0 1010 C380 920 610 1075 960 980 C1310 885 1520 1045 1920 935 L1920 1080 L0 1080 Z" fill="#8067e8" opacity="0.055"/>

  <text x="76" y="60" class="eyebrow sans">YINGMI AI · EXECUTIVE ACTION MAP</text>
  <text x="76" y="122" class="title">两大模式放大势能 · 四个持续换新机会</text>
  <text x="76" y="160" class="subtitle">模式负责放大入口，持续行动负责积累能力、首发、生态与品牌的复利</text>

  <rect x="76" y="204" width="500" height="128" rx="24" fill="#ffffff" stroke="#ded8f4" filter="url(#shadow)"/>
  <circle cx="126" cy="255" r="26" fill="#eeeaff"/>
  <text x="126" y="263" class="sans" font-size="25" font-weight="700" fill="#8067e8" text-anchor="middle">A</text>
  <text x="174" y="251" class="mode-title">大厂 AI 平台接入</text>
  <text x="174" y="286" class="mode-body">平台生态 · 能力广场 · 联合接入 · 规模分发</text>

  <rect x="1344" y="204" width="500" height="128" rx="24" fill="#ffffff" stroke="#ded8f4" filter="url(#shadow)"/>
  <circle cx="1394" cy="255" r="26" fill="#eeeaff"/>
  <text x="1394" y="263" class="sans" font-size="25" font-weight="700" fill="#8067e8" text-anchor="middle">B</text>
  <text x="1442" y="251" class="mode-title">C 端产品接入</text>
  <text x="1442" y="286" class="mode-body">用户触达 · 场景承接 · 账户连接 · 持续服务</text>

  <path d="M576 268 C650 268 662 268 720 268" fill="none" stroke="#8067e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1344 268 C1270 268 1258 268 1200 268" fill="none" stroke="#8067e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="720" y="192" width="480" height="152" rx="34" fill="url(#platform)" filter="url(#shadow)"/>
  <text x="960" y="255" class="platform-title" text-anchor="middle">盈米 AI 开放平台</text>
  <text x="960" y="294" class="platform-sub" text-anchor="middle">MCP · Skills · Agent｜连接能力、场景与生态</text>
  <path d="M960 344 L960 374" fill="none" stroke="#8067e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="76" y="388" width="420" height="408" rx="26" fill="#ffffff" stroke="#e0dcef" filter="url(#shadow)"/>
  <text x="106" y="428" class="card-index sans">01 · KEEP BUILDING</text>
  <text x="106" y="478" class="card-title">持续建设</text>
  <text x="106" y="510" class="card-sub">把专业能力做成可复用资产</text>
  <rect x="106" y="544" width="360" height="82" rx="18" fill="#f3f0fc"/>
  <text x="286" y="596" class="sans" font-size="31" font-weight="700" fill="#8067e8" text-anchor="middle">MCP · Skills · Agent</text>
  <circle cx="115" cy="670" r="5" fill="#8067e8"/><text x="132" y="677" class="bullet">MCP：标准连接与工具调用</text>
  <circle cx="115" cy="714" r="5" fill="#8067e8"/><text x="132" y="721" class="bullet">Skills：固化专业流程与 SOP</text>
  <circle cx="115" cy="758" r="5" fill="#8067e8"/><text x="132" y="765" class="bullet">Agent：编排端到端完整任务</text>

  <rect x="526" y="388" width="420" height="408" rx="26" fill="url(#dark)" filter="url(#shadow)"/>
  <text x="556" y="428" class="card-index-light sans">02 · KEEP LEADING</text>
  <text x="556" y="478" class="card-title-light">持续抢先</text>
  <text x="556" y="510" class="card-sub-light">以首个与首批形成行业占位</text>
  <circle cx="566" cy="558" r="5" fill="#b8a7ff"/><text x="584" y="565" class="bullet-light">首个财富 MCP Server</text>
  <circle cx="566" cy="612" r="5" fill="#b8a7ff"/><text x="584" y="619" class="bullet-light">首个理财测评集 / 投顾智能</text>
  <text x="584" y="644" class="bullet-light">立体模型</text>
  <circle cx="566" cy="684" r="5" fill="#b8a7ff"/><text x="584" y="691" class="bullet-light">首个投顾龙虾 OpenClaw</text>
  <circle cx="566" cy="738" r="5" fill="#b8a7ff"/><text x="584" y="745" class="bullet-light">首批千问 MCP / A2A 接入</text>
  <text x="584" y="770" class="bullet-light">合作商</text>

  <rect x="976" y="388" width="420" height="408" rx="26" fill="#ffffff" stroke="#e0dcef" filter="url(#shadow)"/>
  <text x="1006" y="428" class="card-index sans">03 · KEEP PARTNERING</text>
  <text x="1006" y="478" class="card-title">持续合作</text>
  <text x="1006" y="510" class="card-sub">连接平台、入口、模型与机构</text>
  <rect x="1006" y="542" width="174" height="54" rx="14" fill="#eeeaff"/><text x="1093" y="576" class="bullet" text-anchor="middle">阿里云 / 百炼</text>
  <rect x="1192" y="542" width="174" height="54" rx="14" fill="#f5f4fa"/><text x="1279" y="576" class="bullet" text-anchor="middle">百度</text>
  <rect x="1006" y="608" width="174" height="54" rx="14" fill="#f5f4fa"/><text x="1093" y="642" class="bullet" text-anchor="middle">火山 / 扣子</text>
  <rect x="1192" y="608" width="174" height="54" rx="14" fill="#eeeaff"/><text x="1279" y="642" class="bullet" text-anchor="middle">华为 / 小艺</text>
  <rect x="1006" y="674" width="174" height="54" rx="14" fill="#eeeaff"/><text x="1093" y="708" class="bullet" text-anchor="middle">夸克 / 千问</text>
  <rect x="1192" y="674" width="174" height="54" rx="14" fill="#f5f4fa"/><text x="1279" y="700" class="sans" font-size="15" fill="#354058" text-anchor="middle">腾讯 / 微信</text><text x="1279" y="719" class="sans" font-size="15" fill="#354058" text-anchor="middle">/ WorkBuddy</text>
  <rect x="1006" y="740" width="174" height="36" rx="12" fill="#f5f4fa"/><text x="1093" y="764" class="sans" font-size="16" fill="#354058" text-anchor="middle">智谱</text>
  <rect x="1192" y="740" width="174" height="36" rx="12" fill="#eeeaff"/><text x="1279" y="764" class="sans" font-size="16" fill="#354058" text-anchor="middle">金融机构</text>

  <rect x="1426" y="388" width="418" height="408" rx="26" fill="#ffffff" stroke="#e0dcef" filter="url(#shadow)"/>
  <text x="1456" y="428" class="card-index sans">04 · KEEP VISIBLE</text>
  <text x="1456" y="478" class="card-title">持续曝光</text>
  <text x="1456" y="510" class="card-sub">持续形成内容、媒体与行业声量</text>
  <circle cx="1496" cy="586" r="34" fill="#eeeaff"/>
  <text x="1496" y="596" class="sans" font-size="27" font-weight="700" fill="#8067e8" text-anchor="middle">文</text>
  <text x="1548" y="577" class="mode-title" font-size="24">内容传播</text>
  <text x="1548" y="607" class="mode-body">原创文章、视频与渠道发布</text>
  <circle cx="1496" cy="670" r="34" fill="#eeeaff"/>
  <text x="1496" y="680" class="sans" font-size="27" font-weight="700" fill="#8067e8" text-anchor="middle">声</text>
  <text x="1548" y="661" class="mode-title" font-size="24">媒体声量</text>
  <text x="1548" y="691" class="mode-body">报道、互动与全网浏览</text>
  <circle cx="1496" cy="754" r="34" fill="#eeeaff"/>
  <text x="1496" y="764" class="sans" font-size="27" font-weight="700" fill="#8067e8" text-anchor="middle">会</text>
  <text x="1548" y="745" class="mode-title" font-size="24">行业活动</text>
  <text x="1548" y="775" class="mode-body">活动交流与机构连接</text>

  <text x="76" y="838" class="eyebrow sans">MOMENTUM PROOF · 阶段势能</text>
  <rect x="76" y="862" width="280" height="150" rx="20" fill="#ffffff" stroke="#e0dcef"/>
  <text x="100" y="910" class="metric">50+</text><text x="100" y="946" class="metric-label">原创文章视频</text><text x="100" y="978" class="metric-note">总阅读量 3 万+次</text>
  <rect x="374" y="862" width="280" height="150" rx="20" fill="#ffffff" stroke="#e0dcef"/>
  <text x="398" y="910" class="metric">300+篇</text><text x="398" y="946" class="metric-label">全网渠道发布</text><text x="398" y="978" class="metric-note">累计发布口径</text>
  <rect x="672" y="862" width="280" height="150" rx="20" fill="#ffffff" stroke="#e0dcef"/>
  <text x="696" y="910" class="metric">8,965篇</text><text x="696" y="946" class="metric-label">盈米 AI 相关报道</text><text x="696" y="978" class="metric-note">其中盈米 MCP 3,329 篇</text>
  <rect x="970" y="862" width="280" height="150" rx="20" fill="#ffffff" stroke="#e0dcef"/>
  <text x="994" y="910" class="metric">300万+</text><text x="994" y="946" class="metric-label">全网互动</text><text x="994" y="978" class="metric-note">内部传播监测口径</text>
  <rect x="1268" y="862" width="280" height="150" rx="20" fill="#ffffff" stroke="#e0dcef"/>
  <text x="1292" y="910" class="metric">1,000万+</text><text x="1292" y="946" class="metric-label">全网浏览</text><text x="1292" y="978" class="metric-note">内部传播监测口径</text>
  <rect x="1566" y="862" width="278" height="150" rx="20" fill="#ffffff" stroke="#e0dcef"/>
  <text x="1590" y="906" class="metric-wide">10场+ · 30家+</text><text x="1590" y="946" class="metric-label">活动 · 交流机构</text><text x="1590" y="978" class="metric-note">统计区间与去重口径待补</text>

  <text x="76" y="1050" class="sans" font-size="14" fill="#7a8497">来源：用户提供关键行动素材（2026-08-02）及盈米 AI 阶段成果源稿；“首个 / 首批”、活动与机构口径用于外部引用前仍需补公开证据。</text>
</svg>
