<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 四个持续驱动平台运转、两种模式放大势能</title>
  <desc id="desc">自下而上展示四个持续作为核心运转引擎，向盈米 AI 开放平台注入能力，再通过大厂 AI 平台接入和 C 端产品接入触达更多群体、放大势能。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="0.58" stop-color="#f4f1fc"/>
      <stop offset="1" stop-color="#eae5fa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f59d9"/>
      <stop offset="1" stop-color="#a992ff"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#202a49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b2a75" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#8067e8"/>
    </marker>
    <style>
      text{font-family:"Songti SC","Noto Serif SC",STSong,SimSun,serif;fill:#161927}
      .sans{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .eyebrow{font-size:16px;font-weight:700;letter-spacing:3px;fill:#8067e8}
      .title{font-size:48px;font-weight:700;letter-spacing:-1px}
      .subtitle{font-size:20px;fill:#687287}
      .module{font-size:15px;font-weight:700;letter-spacing:2px;fill:#8067e8}
      .outcome{font-size:35px;font-weight:700;fill:#ffffff}
      .outcome-sub{font-size:17px;fill:#ede9ff}
      .mode-title{font-size:27px;font-weight:700}
      .mode-body{font-size:16px;fill:#687287}
      .platform-title{font-size:32px;font-weight:700;fill:#ffffff}
      .platform-sub{font-size:17px;fill:#d9dff0}
      .card-title{font-size:27px;font-weight:700}
      .card-sub{font-size:15px;fill:#687287}
      .metric{font-size:34px;font-weight:700;fill:#8067e8}
      .metric-light{font-size:34px;font-weight:700;fill:#b8a7ff}
      .bullet{font-size:16px;fill:#354058}
      .bullet-light{font-size:16px;fill:#eef0f8}
      .chip{font-size:15px;fill:#354058}
      .chip-light{font-size:15px;fill:#eef0f8}
      .note{font-size:13px;fill:#7a8497}
    </style>
