</style></head><body><div class="shell"><header class="header"><a class="brand" href="https://clairku.github.io/clair-ai-studio/">盈米 AI<span>VISUAL DIRECTIONS / 03</span></a><nav class="nav"><a href="../lightfield/index.html?view=static4">光场静态版 ↗</a><a href="../index.html">设计总览 ↗</a></nav></header><main><section class="intro"><div><div class="eyebrow">MATERIAL. FORM. CLARITY.</div><h1>专业能力，三种视觉语言。</h1></div><p>连续曲面、通透玻璃与精密光栅。<br>选择一款，在下方预览完整页面。</p></section><div class="choices" role="tablist" aria-label="三种全新设计"><button class="choice" data-design="satin" type="button" role="tab" id="tab-satin" aria-selected="true" aria-controls="preview-panel"><span class="shot"><img src="./satin/thumb.webp" alt="" width="640" height="427"></span><span class="meta"><span class="number">A / SATIN FLOW</span><span class="line"><span><strong class="card-title">缎光流域</strong><span class="card-desc">连续缎面 · 流动与连接</span></span><span class="arrow" aria-hidden="true">↗</span></span></span></button><button class="choice" data-design="refraction" type="button" role="tab" id="tab-refraction" aria-selected="false" aria-controls="preview-panel" tabindex="-1"><span class="shot"><img src="./refraction/thumb.webp" alt="" width="640" height="427"></span><span class="meta"><span class="number">B / DEEP REFRACTION</span><span class="line"><span><strong class="card-title">深空折光</strong><span class="card-desc">深色玻璃 · 通透与力量</span></span><span class="arrow" aria-hidden="true">↗</span></span></span></button><button class="choice" data-design="lamella" type="button" role="tab" id="tab-lamella" aria-selected="false" aria-controls="preview-panel" tabindex="-1"><span class="shot"><img src="./lamella/thumb.webp" alt="" width="640" height="427"></span><span class="meta"><span class="number">C / LAMELLAR ORDER</span><span class="line"><span><strong class="card-title">光栅秩序</strong><span class="card-desc">精密光栅 · 秩序与层次</span></span><span class="arrow" aria-hidden="true">↗</span></span></span></button></div><section class="preview" id="preview-panel" role="tabpanel" aria-labelledby="tab-satin"><div class="toolbar"><div><strong id="design-label">A / 缎光流域</strong><span id="design-desc">以平滑连续的曲面，表现专业能力的连接。</span></div><a href="./satin/index.html" id="open-design" target="_blank" rel="noopener">打开完整设计 ↗</a></div><iframe id="design-frame" src="./satin/index.html?preview=1" title="缎光流域完整页面预览" loading="eager"></iframe></section><div class="below"><span>三款沿用同一份完整报告，数字保持静态，统计日期与来源说明均保留。主视觉为概念艺术。</span><a href="./yingmi-ai-new-directions.zip" download>下载三款完整设计与主视觉提示词 ↓</a></div></main><footer class="foot">YINGMI AI / VISUAL DIRECTIONS / 2026.10.28</footer></div><script>
(()=>{'use strict';const designs={satin:['A / 缎光流域','以平滑连续的曲面，表现专业能力的连接。','缎光流域'],refraction:['B / 深空折光','以通透的光学玻璃，表现专业能力的纵深。','深空折光'],lamella:['C / 光栅秩序','以精密实体薄片的层次，组织清晰的能力秩序。','光栅秩序']};const tabs=[...document.querySelectorAll('[data-design]')],frame=document.getElementById('design-frame');function select(k,focus=false){if(!designs[k])return;tabs.forEach(t=>{const on=t.dataset.design===k;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;if(on&&focus)t.focus()});document.getElementById('preview-panel').setAttribute('aria-labelledby','tab-'+k);document.getElementById('design-label').textContent=designs[k][0];document.getElementById('design-desc').textContent=designs[k][1];document.getElementById('open-design').href='./'+k+'/index.html';frame.title=designs[k][2]+'完整页面预览';frame.src='./'+k+'/index.html?preview=1';history.replaceState(null,'','#'+k)}tabs.forEach((t,i)=>{t.addEventListener('click',()=>select(t.dataset.design));t.addEventListener('keydown',e=>{let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();select(tabs[j].dataset.design,true)})});const init=location.hash.slice(1);if(designs[init])select(init)})();
