  <script>
    const report=JSON.parse(document.getElementById("report-data").textContent);

    const card=(item,index)=>`<article class="item reveal" style="--n:${index}">${common(item)}</article>`;
    function evidence(item){const priority=item.imagePriority==="high";return `<article class="item reveal"><figure>${item.image?`<img src="${esc(item.image)}" data-original-src="${esc(item.image)}" alt="${esc(item.alt||item.title)}" loading="${priority?"eager":"lazy"}"${priority?' fetchpriority="high"':""}>`:`<div class="evidence-placeholder">图示</div>`}</figure><div class="evidence-copy">${common(item)}</div></article>`}
    function demo(section){return demoRich(section)}
    function strategicView(section){
      const contexts=(section.contexts||[]).map((context,index)=>`<article class="strategic-context reveal"><span class="context-number">${String(index+1).padStart(2,"0")}</span><span class="context-eyebrow">${esc(context.eyebrow||"")}</span><h3>${esc(context.title||"")}</h3><div class="strategic-tags">${(context.tags||[]).map(tag=>`<span class="strategic-tag">${esc(tag)}</span>`).join("")}</div><p class="strategic-conclusion">${esc(context.conclusion||"")}</p></article>`).join("");
      const decision=section.decision||{};
      const decisionMarkup=`<article class="strategic-decision reveal"><span class="decision-eyebrow">${esc(decision.eyebrow||"STRATEGIC CHOICE")}</span><strong class="decision-title">${esc(decision.title||"")}</strong><blockquote class="decision-quote">${esc(decision.quote||"")}</blockquote><p class="decision-body">${esc(decision.body||"")}</p></article>`;
      const problems=(section.problems||[]).map(problem=>`<article class="strategic-problem reveal"><strong class="strategic-problem-type">${esc(problem.type||"")}</strong><span class="item-eyebrow">${esc(problem.eyebrow||"")}</span><h4>${esc(problem.title||"")}</h4><p>${esc(problem.body||"")}</p></article>`).join("");
      return `<div class="strategic-board"><div class="strategic-conditions">${contexts}</div>${decisionMarkup}<div class="strategic-answer">${problems}</div></div>`;
    }
    function qwenScene(section){
      const modes=(section.items||[]).map(item=>`<article class="qwen-mode-card reveal"><span class="item-index">${esc(item.index||"")}</span><span class="item-eyebrow">${esc(item.eyebrow||"")}</span><h3>${esc(item.title||"")}</h3><p>${esc(item.body||"")}</p></article>`).join("");
      return `<div class="qwen-scene reveal"><div class="qwen-scene-visual"><img src="${esc(section.image||"")}" data-original-src="${esc(section.image||"")}" alt="${esc(section.alt||section.title)}" loading="eager" fetchpriority="high"></div><div class="qwen-mode-list">${modes}</div></div>`;
    }
    function channelEntrances(section){
      const cards=(section.items||[]).map(item=>{
        const details=(item.details||[]).map(detail=>`<div class="channel-detail"><b>${esc(detail.title)}</b><span>${esc(detail.body)}</span></div>`).join("");
        return `<article class="channel-card reveal"><div class="channel-card-head"><span class="item-eyebrow">${esc(item.eyebrow||"")}</span><span class="channel-tag">${esc(item.tag||"")}</span></div><h3>${esc(item.title)}</h3><p class="item-body">${esc(item.body||"")}</p><div class="channel-details">${details}</div></article>`;
      }).join("");
      return `<div class="channel-grid">${cards}</div>`;
    }
    function wechatScene(section){
      const item=(section.items||[])[0]||{};
      const images=(item.images||[]).map(image=>`<img src="${esc(image.src)}" data-original-src="${esc(image.src)}" alt="${esc(image.alt||item.title)}" loading="eager" decoding="async">`).join("");
      return `<div class="wechat-scene-board reveal"><figure class="wechat-dialogue">${images}</figure><article class="wechat-copy">${common(item)}</article></div>`;
    }
    function brandExposure(section){
      const cases=(section.items||[]).map((item,index)=>{
        const width=Number(item.videoWidth)||2;
        const height=Number(item.videoHeight)||3;
        return `<article class="brand-case"><div class="brand-case-player" style="--native-video-ratio:${width}/${height}"><video controls playsinline preload="none" tabindex="0" poster="${esc(item.poster||"")}" aria-label="播放案例：${esc(item.title)}"><source src="${esc(item.video||"")}" type="video/mp4">当前浏览器不支持视频播放。</video></div><div class="brand-case-copy"><span class="item-eyebrow">${esc(item.eyebrow||`案例 ${String(index+1).padStart(2,"0")}`)}</span><h3>${esc(item.title)}</h3><p>${esc(item.body||"")}</p></div></article>`;
      }).join("");
      return `<div class="brand-exposure-gallery reveal" aria-label="千问合作品牌传播五个可播放案例">${cases}</div>`;
    }
    function systemRelationship(section){
      const src=section.asset||section.image||"";
      return `<div class="relationship-module reveal" aria-label="${esc(section.alt||section.title)}"><figure class="relationship-stage"><div class="relationship-scroll"><img src="${esc(src)}" data-original-src="${esc(src)}" alt="${esc(section.alt||section.title)}" loading="eager" decoding="async"></div></figure></div>`;
    }
    function platformMatrix(section){
      const labels={live:"已上架",planned:"计划上架",none:"—"};
      const header=`<div class="matrix-cell mode"><b>能力模式</b><small>PLATFORM × MODE</small></div>${(section.platforms||[]).map(name=>`<div class="matrix-cell platform">${esc(name)}</div>`).join("")}`;
      const rows=(section.modes||[]).map(mode=>`<div class="matrix-cell mode"><b>${esc(mode.name)}</b><small>${esc(mode.description||"")}</small></div>${(mode.states||[]).map(value=>`<div class="matrix-cell"><span class="state-pill ${esc(value)}">${esc(labels[value]||value)}</span></div>`).join("")}`).join("");
      const plans=(section.items||[]).map(item=>`<article class="listing-plan reveal">${common(item)}</article>`).join("");
      return `<div class="platform-board"><div class="matrix-shell reveal"><div class="matrix-legend"><span><i></i>已上架</span><span class="planned"><i></i>计划上架</span></div><div class="matrix-grid">${header}${rows}</div></div><div class="listing-plans">${plans}</div></div>`;
    }
    function capabilityStack(section){
      const layers=(section.items||[]).map(item=>`<article class="cap-layer reveal ${String(item.eyebrow||"").includes("AGENT")?"agent":""}"><div class="cap-layer-key">${esc(item.index)} · ${esc(item.eyebrow)}</div><div><h3>${esc(item.title)}</h3><p class="cap-layer-body">${esc(item.body)}</p></div><div class="cap-layer-tags">${(item.bullets||[]).map(tag=>`<span>${esc(tag)}</span>`).join("")}</div></article>`).join("");
      const governance=(section.governance||[]).map(tag=>`<span>${esc(tag)}</span>`).join("");
      return `<div class="cap-stack-board">${layers}<div class="governance-bar reveal"><b>横向治理控制面</b><div class="governance-tags">${governance}</div></div></div>`;
    }
    function capabilityMaturity(section){
      const cards=(section.items||[]).map(item=>{
        const eyebrow=String(item.eyebrow||"").split("·").map(part=>part.trim());
        const rows=(item.bullets||[]).map(line=>{const parts=String(line).split("｜").map(part=>part.trim());return `<li><b>${esc(parts[0])}</b><span>${esc(parts.slice(1).join(" · "))}</span></li>`}).join("");
        return `<article class="cap-card reveal"><header class="cap-card-head"><div class="cap-card-label"><b>${esc(eyebrow[0])}</b><span>${esc(eyebrow.slice(1).join(" · "))}</span></div><span class="cap-card-number">${esc(item.index)}</span></header><div class="cap-card-content"><h3>${esc(item.title)}</h3><p class="item-body">${esc(item.body)}</p><ul>${rows}</ul></div></article>`;
      }).join("");
      const flow=(section.workflow||[]).map(step=>`<div class="delivery-step"><b>${esc(step.title)}</b><span>${esc(step.body)}</span></div>`).join("");
      return `<div class="cap-progression"><div class="cap-progression-cards">${cards}</div><div class="delivery-flow reveal">${flow}</div></div>`;
    }
    function capabilityProgression(section){

    const syncChapterNav=()=>{const panel=panels[activePanelIndex];const href=panel?.id==="top"?null:`#${panel?.id}`;let activeLink=null;navLinks.forEach(link=>{const active=link.getAttribute("href")===href;link.classList.toggle("active",active);if(active)activeLink=link});let left=0;if(activeLink){const navRect=chapterNav.getBoundingClientRect();const linkRect=activeLink.getBoundingClientRect();const linkCenter=linkRect.left-navRect.left+chapterNav.scrollLeft+linkRect.width/2;left=linkCenter-chapterNav.clientWidth/2}chapterNav.scrollTo({left:Math.max(0,left),behavior:reducedMotion?"auto":"smooth"})};
    const setActivePanel=index=>{activePanelIndex=Math.max(0,Math.min(panels.length-1,index));const active=panels[activePanelIndex];document.body.classList.toggle("cover-active",active?.id==="top");document.body.classList.toggle("agenda-active",active?.id==="agenda");const activeTone=active?.classList.contains("dark")||active?.classList.contains("closing")?"dark":"light";$("#nav-shell").dataset.moduleTone=activeTone;document.querySelectorAll("[data-page-index]").forEach(node=>node.classList.toggle("active",Number(node.dataset.pageIndex)===activePanelIndex));$("#page-counter").textContent=`${String(activePanelIndex+1).padStart(2,"0")} / ${String(panels.length).padStart(2,"0")}`;syncChapterNav()};
    const cancelPanelNavigation=()=>{if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=0;navigating=false;if(restoreScrollStyles){restoreScrollStyles();restoreScrollStyles=null}};
    const goToPanel=index=>{cancelPanelNavigation();const target=Math.max(0,Math.min(panels.length-1,index));const panel=panels[target];const navOffset=panel.id==="top"||panel.id==="agenda"?0:$("#nav-shell").offsetHeight;const targetY=Math.max(0,panel.offsetTop-navOffset);const startY=scrollY;const distance=targetY-startY;setActivePanel(target);if(reducedMotion||Math.abs(distance)<2){scrollTo(0,targetY);return}const root=document.documentElement;const previousBehavior=root.style.scrollBehavior;const previousSnap=root.style.scrollSnapType;root.style.scrollBehavior="auto";root.style.scrollSnapType="none";restoreScrollStyles=()=>{root.style.scrollBehavior=previousBehavior;root.style.scrollSnapType=previousSnap};navigating=true;const started=performance.now();const duration=Math.min(520,320+Math.abs(distance)*.018);const tick=now=>{const progress=Math.min(1,(now-started)/duration);const eased=1-Math.pow(1-progress,4);scrollTo(0,startY+distance*eased);if(progress<1){scrollFrame=requestAnimationFrame(tick);return}scrollTo(0,targetY);scrollFrame=0;navigating=false;restoreScrollStyles();restoreScrollStyles=null};scrollFrame=requestAnimationFrame(tick)};
    $("#page-rail").innerHTML=panels.map((panel,index)=>`<button class="page-dot${index===0?" active":""}" type="button" data-page-index="${index}" aria-label="跳转到第 ${index+1} 屏：${esc(panelLabels[index]||panel.id)}"></button>`).join("");
    setActivePanel(0);
    document.addEventListener("click",event=>{
      const creationTab=event.target.closest("[data-creation-tab]");
      if(creationTab){
        const root=creationTab.closest(".creation-board");
        root.querySelectorAll("[data-creation-tab]").forEach(node=>node.classList.toggle("active",node===creationTab));
        root.querySelectorAll("[data-creation-panel]").forEach(node=>node.classList.toggle("active",node.dataset.creationPanel===creationTab.dataset.creationTab));
        return;
      }
      const tab=event.target.closest("[data-demo-tab]");
      if(!tab)return;
      const demoRoot=tab.closest(".demo");
      demoRoot.querySelectorAll("[data-demo-tab]").forEach(node=>node.classList.toggle("active",node===tab));
      demoRoot.querySelectorAll("[data-demo-panel]").forEach(node=>node.classList.toggle("active",node.dataset.demoPanel===tab.dataset.demoTab));
    });
    $("#page-rail").addEventListener("click",event=>{const dot=event.target.closest("[data-page-index]");if(dot)goToPanel(Number(dot.dataset.pageIndex))});
    $("#back-to-top").addEventListener("click",event=>{event.preventDefault();goToPanel(0)});
    addEventListener("keydown",event=>{if(event.defaultPrevented||event.metaKey||event.ctrlKey||event.altKey||event.shiftKey||event.target.closest("input,textarea,select,button,a,video,[contenteditable=true]"))return;const next=["ArrowDown","ArrowRight","PageDown"].includes(event.key);const previous=["ArrowUp","ArrowLeft","PageUp"].includes(event.key);if(next||previous||event.key==="Home"||event.key==="End"){event.preventDefault();goToPanel(event.key==="Home"?0:event.key==="End"?panels.length-1:activePanelIndex+(next?1:-1))}});
    $("#menu-button").addEventListener("click",()=>{const shell=$("#nav-shell");const open=shell.classList.toggle("open");$("#menu-button").setAttribute("aria-expanded",String(open))});
    chapterNav.addEventListener("click",event=>{const link=event.target.closest("a");if(link){const target=panels.findIndex(panel=>`#${panel.id}`===link.getAttribute("href"));if(target>=0){event.preventDefault();goToPanel(target)}}$("#nav-shell").classList.remove("open");$("#menu-button").setAttribute("aria-expanded","false")});
    const reveals=[...document.querySelectorAll(".reveal")];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target)}}),{threshold:.12});reveals.forEach(node=>observer.observe(node));
    const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!navigating)setActivePanel(panels.indexOf(entry.target))}),{rootMargin:"-34% 0px -50%",threshold:0});panels.forEach(section=>sectionObserver.observe(section));
    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});
    const wireImageRecovery=()=>document.querySelectorAll("img[data-original-src]").forEach(image=>{let retried=false;image.addEventListener("load",()=>image.closest("figure")?.classList.remove("image-failed"));image.addEventListener("error",()=>{if(!retried){retried=true;const src=image.dataset.originalSrc;image.src=`${src}${src.includes("?")?"&":"?"}retry=1`;return}image.closest("figure")?.classList.add("image-failed")})});wireImageRecovery();
    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};addEventListener("scroll",updateProgress,{passive:true});updateProgress();
  </script>
</body>
</html>
