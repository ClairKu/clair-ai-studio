<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 能力体系与产品化路径</title>
  <desc id="desc">当前能力体系由数据与工具、MCP Skills Agent、AI 开放平台治理和现有服务入口组成，并延展出正在建设的 YingWork 工作台与下一阶段的 AI 实验室。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7fc"/>
      <stop offset="1" stop-color="#f0eef9"/>
    </linearGradient>
    <linearGradient id="governance" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4d31bc"/>
      <stop offset=".58" stop-color="#6e4fe0"/>
      <stop offset="1" stop-color="#8c72f1"/>
    </linearGradient>
    <linearGradient id="yingwork" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#fff3dc"/>
    </linearGradient>
    <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f5ff"/>
      <stop offset="1" stop-color="#eeebfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#30245f" flood-opacity=".10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#30245f" flood-opacity=".07"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#7357df"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#202238}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:2.5px;fill:#7357df}
      .headline{font-size:34px;font-weight:700;letter-spacing:.5px}
      .lead{font-size:17px;fill:#646b80}
      .stage{font-size:14px;font-weight:700;letter-spacing:1.3px;fill:#7357df}
      .cardTitle{font-size:24px;font-weight:700}
      .cardLead{font-size:16px;fill:#656d82}
      .rowTitle{font-size:17px;font-weight:700}
      .rowText{font-size:14px;fill:#6b7285}
      .tag{font-size:13px;font-weight:600;fill:#56439f}
      .white{fill:#fff}
      .whiteSoft{fill:#f3efff}
      .routeState{font-size:15px;font-weight:700;letter-spacing:1.5px}
      .routeTitle{font-size:27px;font-weight:700}
      .routeText{font-size:15px;fill:#626a7d}
      .routeItems{font-size:14px;font-weight:600}
      .footer{font-size:20px;font-weight:700;fill:#44358a}
      .node{fill:#fff;stroke:#ddd8ec;stroke-width:1.2}
      .softNode{fill:#faf9fe;stroke:#ddd8ec;stroke-width:1.2}
      .tagBox{fill:#f4f1fc;stroke:#e3def1;stroke-width:1}
      .flow{fill:none;stroke:#7357df;stroke-width:2.4;stroke-linecap:round;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#a79ad5;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 7;marker-end:url(#arrow)}
      .icon{fill:none;stroke:#7357df;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .iconWhite{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .iconOrange{fill:none;stroke:#e68a25;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .iconGray{fill:none;stroke:#8076aa;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#canvas)"/>
  <circle cx="1490" cy="18" r="220" fill="#fff" opacity=".48"/>
  <circle cx="52" cy="736" r="170" fill="#e9e4fa" opacity=".45"/>

  <text x="56" y="48" class="eyebrow">CAPABILITY SYSTEM / PRODUCT ROUTES</text>
  <text x="56" y="91" class="headline">能力体系已经形成，产品化路径正在展开</text>
  <text x="56" y="122" class="lead">同一套金融能力，经标准化、治理与编排，既服务现有用户入口，也开始进入新的工作与创新场景。</text>

  <!-- 当前能力体系：单一主链 -->
  <g filter="url(#shadow)">
    <rect x="50" y="160" width="1118" height="476" rx="30" fill="#fff"/>
  </g>
  <text x="82" y="198" class="stage">当前能力体系</text>
  <text x="82" y="226" font-size="17" font-weight="600" fill="#4a5064">从底层资产到服务入口，能力可以被统一调用、组合与持续运营</text>

  <!-- 01 数据与工具 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="258" width="230" height="310" rx="24" class="softNode"/>
  </g>
  <g transform="translate(104 282)">
    <ellipse cx="22" cy="8" rx="18" ry="7" class="icon"/>
    <path d="M4 8v23c0 4 8 7 18 7s18-3 18-7V8M4 20c0 4 8 7 18 7s18-3 18-7" class="icon"/>
    <path d="M48 27h24M55 18l-9 9 9 9M65 18l9 9-9 9" class="icon"/>
  </g>
  <text x="104" y="343" class="stage">01 / 基础资产</text>
  <text x="104" y="379" class="cardTitle">数据与工具</text>
  <text x="104" y="408" class="cardLead">把金融数据与专业工具</text>
  <text x="104" y="431" class="cardLead">整理成 AI 可理解的底座</text>
  <rect x="104" y="460" width="86" height="30" rx="9" class="tagBox"/>
  <text x="147" y="480" text-anchor="middle" class="tag">数据基础</text>
  <rect x="198" y="460" width="86" height="30" rx="9" class="tagBox"/>
  <text x="241" y="480" text-anchor="middle" class="tag">工具能力</text>
  <text x="104" y="521" class="rowText">基金 · 市场 · 账户 · 资讯</text>
  <text x="104" y="546" class="rowText">查询 · 计算 · 分析 · 诊断</text>

  <!-- 02 MCP / Skills / Agent -->
  <g filter="url(#softShadow)">
    <rect x="342" y="258" width="310" height="310" rx="24" class="node"/>
  </g>
  <g transform="translate(368 283)">
    <circle cx="12" cy="22" r="7" class="icon"/>
    <circle cx="38" cy="9" r="7" class="icon"/>
    <circle cx="38" cy="35" r="7" class="icon"/>
    <path d="M18 19l14-7M18 25l14 7M45 9h18M45 35h18" class="icon"/>
  </g>
  <text x="368" y="343" class="stage">02 / 能力资产</text>
  <text x="368" y="379" class="cardTitle">MCP · Skills · Agent</text>

  <circle cx="386" cy="419" r="14" fill="#f0ecfd"/>
  <path d="M380 419h12M386 413v12" class="icon"/>
  <text x="414" y="416" class="rowTitle">MCP</text>
  <text x="414" y="437" class="rowText">底层能力标准化为可调用接口</text>

  <circle cx="386" cy="468" r="14" fill="#f0ecfd"/>
  <path d="M379 463h14v11h-14zM382 459h14v11" class="icon"/>
  <text x="414" y="465" class="rowTitle">Skills</text>
  <text x="414" y="486" class="rowText">业务知识、流程与模板封装</text>

  <circle cx="386" cy="517" r="14" fill="#f0ecfd"/>
  <path d="M378 521c2-8 14-8 16 0M381 511a5 5 0 1 1 10 0M386 501v-4M376 505l-3-3M396 505l3-3" class="icon"/>
  <text x="414" y="514" class="rowTitle">Agent</text>
  <text x="414" y="535" class="rowText">理解意图，规划并完成复杂任务</text>

  <!-- 03 开放平台治理 -->
  <g filter="url(#shadow)">
    <rect x="684" y="258" width="250" height="310" rx="24" fill="url(#governance)"/>
  </g>
  <g transform="translate(710 282)">
    <path d="M6 12h42M6 28h42M6 44h42" class="iconWhite"/>
    <circle cx="20" cy="12" r="5" fill="#6c50dd" stroke="#fff" stroke-width="2"/>
    <circle cx="37" cy="28" r="5" fill="#6c50dd" stroke="#fff" stroke-width="2"/>
    <circle cx="27" cy="44" r="5" fill="#6c50dd" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="710" y="343" class="stage whiteSoft">03 / 治理中枢</text>
  <text x="710" y="379" class="cardTitle white">AI 开放平台</text>
  <text x="710" y="407" class="cardLead whiteSoft">统一管理能力、用户与运行过程</text>
  <line x1="710" y1="435" x2="908" y2="435" stroke="#fff" stroke-opacity=".22"/>
  <g class="whiteSoft" font-size="15" font-weight="600">
    <text x="710" y="469">权限与身份</text>
    <text x="814" y="469">内容与配置</text>
    <text x="710" y="503">发布与版本</text>
    <text x="814" y="503">审计与计量</text>
    <text x="710" y="537">运营与数据</text>
  </g>

  <!-- 04 现有服务入口 -->
  <g filter="url(#softShadow)">
    <rect x="966" y="258" width="170" height="310" rx="24" class="node"/>
  </g>
  <g transform="translate(990 284)">
    <rect x="4" y="5" width="43" height="34" rx="6" class="icon"/>
    <path d="M13 45h25M18 39v6M34 39v6M12 14h27M12 21h20" class="icon"/>
  </g>
  <text x="990" y="343" class="stage">04 / 服务出口</text>
  <text x="990" y="379" class="cardTitle">现有入口</text>
  <text x="990" y="407" class="cardLead">能力已经进入</text>
  <text x="990" y="430" class="cardLead">用户与合作场景</text>
  <g font-size="15" font-weight="600" fill="#4c5166">
    <circle cx="998" cy="468" r="3" fill="#7357df"/><text x="1012" y="474">且慢 App</text>
    <circle cx="998" cy="502" r="3" fill="#7357df"/><text x="1012" y="508">小程序 / H5</text>
    <circle cx="998" cy="536" r="3" fill="#7357df"/><text x="1012" y="542">微信与千问</text>
  </g>

  <!-- 主链箭头 -->
  <path d="M316 413H332" class="flow"/>
  <path d="M658 413H674" class="flow"/>
  <path d="M940 413H956" class="flow"/>

  <!-- 右侧产品化路线 -->
  <text x="1210" y="198" class="stage">产品化路径</text>
  <text x="1210" y="226" font-size="17" font-weight="600" fill="#4a5064">让能力进入新的工作与创新现场</text>

  <g filter="url(#softShadow)">
    <rect x="1204" y="258" width="346" height="142" rx="24" fill="url(#yingwork)" stroke="#efc988" stroke-width="1.2"/>
  </g>
  <g transform="translate(1230 282)">
    <path d="M7 8h35v27H7zM13 14h23M13 21h16M13 28h10M17 41h15" class="iconOrange"/>
    <path d="M23 35v6" class="iconOrange"/>
  </g>
  <text x="1292" y="290" class="routeState" fill="#c66b15">正在建设</text>
  <text x="1292" y="326" class="routeTitle">YingWork 工作台</text>
  <text x="1230" y="356" class="routeText">把内部能力装配成面向员工的 AI 工作入口</text>
  <text x="1230" y="383" class="routeItems" fill="#a85f19">搜索 · 分析 · 写作 · 执行</text>

  <g filter="url(#softShadow)">
    <rect x="1204" y="426" width="346" height="142" rx="24" fill="url(#lab)" stroke="#bcb3d8" stroke-width="1.2" stroke-dasharray="7 6"/>
  </g>
  <g transform="translate(1230 450)">
    <path d="M15 5h20M20 5v13L8 39c-3 5 1 9 7 9h20c6 0 10-4 7-9L30 18V5" class="iconGray"/>
    <path d="M14 36h23M18 29c5 3 10-3 17 1" class="iconGray"/>
  </g>
  <text x="1292" y="458" class="routeState" fill="#746a9e">下一阶段</text>
  <text x="1292" y="494" class="routeTitle">AI 实验室</text>
  <text x="1230" y="524" class="routeText">为业务团队提供受控的试验、评测与孵化空间</text>
  <text x="1230" y="551" class="routeItems" fill="#6f6597">试验 · 评测 · 沙盒 · 发布</text>

  <!-- 从现有体系延展到两条路线 -->
  <path d="M1136 397H1176V329H1194" class="branch"/>
  <path d="M1176 397V497H1194" class="branch"/>
  <circle cx="1176" cy="397" r="5" fill="#7357df"/>

  <!-- 底部结论 -->
  <circle cx="58" cy="687" r="6" fill="#7357df"/>
  <text x="78" y="695" class="footer">能力已形成</text>
  <path d="M222 687H278" stroke="#c8c1df" stroke-width="2"/>
  <circle cx="300" cy="687" r="6" fill="#e68a25"/>
  <text x="320" y="695" class="footer">YingWork 把能力带进工作现场</text>
  <path d="M672 687H728" stroke="#c8c1df" stroke-width="2"/>
  <circle cx="750" cy="687" r="6" fill="#8e83b5"/>
  <text x="770" y="695" class="footer">AI 实验室承接下一轮试验与孵化</text>
</svg>
