<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 服务关系图</title>
  <desc id="desc">底层能力支撑 AI 小顾、正在建设的 YingWork 工作台，以及下一阶段的 AI 实验室，并通过 AI 开放平台连接外部生态。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaff"/><stop offset="1" stop-color="#f1eefa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5b3dcc"/><stop offset=".6" stop-color="#7c61e4"/><stop offset="1" stop-color="#9a83f4"/>
    </linearGradient>
    <linearGradient id="work" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edf5ff"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8f3"/><stop offset="1" stop-color="#faf8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#35266f" flood-opacity=".11"/>
    </filter>
    <marker id="arrowV" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#7457e8"/></marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#4d7fd1"/></marker>
    <style>
      text{font-family:"Songti SC","STSong","SimSun",serif;fill:#202236}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .h1{font-size:38px;font-weight:700}.sub{font-size:16px;fill:#60697d}.kicker{font-size:12px;font-weight:800;letter-spacing:2.4px;fill:#7457e8}
      .card-title{font-size:24px;font-weight:700}.body{font-size:14px;fill:#626b7e}.small{font-size:12px;fill:#687186}.tiny{font-size:11px;fill:#697185}
      .pill{font-size:11px;font-weight:700;fill:#4f566a}.on-dark{fill:#fff}.on-dark-soft{fill:#ddd7ff}
      .line-v{fill:none;stroke:#7457e8;stroke-width:2;marker-end:url(#arrowV)}.line-b{fill:none;stroke:#4d7fd1;stroke-width:1.8;marker-end:url(#arrowB)}
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#paper)"/>
  <circle cx="1160" cy="20" r="170" fill="#fff" opacity=".58"/>
  <text x="64" y="43" class="sans kicker">SERVICE SYSTEM · FROM CAPABILITY TO ECOSYSTEM</text>
  <text x="64" y="88" class="h1">盈米 AI 服务关系图</text>
  <text x="64" y="116" class="sans sub">能力先服务真实场景，再进入工作台与实验环境，最终通过开放平台连接外部生态。</text>

  <!-- 对外连接层 -->
  <g filter="url(#shadow)">
    <rect x="214" y="146" width="852" height="100" rx="24" fill="url(#violet)"/>
    <g transform="translate(246 171)" fill="none" stroke="#fff" stroke-width="2" opacity=".9">
      <circle cx="25" cy="25" r="23"/>
      <path d="M3 25h44M25 2c-9 10-9 36 0 46M25 2c9 10 9 36 0 46M7 14h36M7 36h36"/>
    </g>
    <text x="316" y="187" class="card-title on-dark">AI 开放平台</text>
    <text x="316" y="214" class="sans" font-size="14" fill="#ddd7ff">统一发布、接入与生态分发</text>
    <g class="sans">
      <rect x="660" y="174" width="82" height="32" rx="16" fill="#fff" opacity=".16"/><text x="701" y="195" text-anchor="middle" class="pill on-dark">官网</text>
      <rect x="752" y="174" width="82" height="32" rx="16" fill="#fff" opacity=".16"/><text x="793" y="195" text-anchor="middle" class="pill on-dark">千问</text>
      <rect x="844" y="174" width="82" height="32" rx="16" fill="#fff" opacity=".16"/><text x="885" y="195" text-anchor="middle" class="pill on-dark">微信</text>
      <rect x="936" y="174" width="98" height="32" rx="16" fill="#fff" opacity=".16"/><text x="985" y="195" text-anchor="middle" class="pill on-dark">机构 AI</text>
    </g>
  </g>

  <!-- 服务与产品层 -->
  <g filter="url(#shadow)">
    <rect x="70" y="310" width="300" height="160" rx="22" fill="#fff" stroke="#d9d3ea" stroke-width="1.3"/>
    <path d="M98 345c13-13 34-13 47 0s13 34 0 47-34 13-47 0-13-34 0-47Z" fill="#f1edff"/>
    <path d="M107 368c9-13 19-13 29 0M111 354h22M113 382h18" fill="none" stroke="#7457e8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="164" y="356" class="card-title">AI 小顾｜持续服务</text>
    <text x="98" y="404" class="sans body">把投顾能力带进用户账户与交易场景</text>
    <rect x="98" y="426" width="70" height="26" rx="13" fill="#f1edff"/><text x="133" y="443" text-anchor="middle" class="sans pill">分析</text>
    <rect x="178" y="426" width="70" height="26" rx="13" fill="#f1edff"/><text x="213" y="443" text-anchor="middle" class="sans pill">陪伴</text>
    <rect x="258" y="426" width="84" height="26" rx="13" fill="#f1edff"/><text x="300" y="443" text-anchor="middle" class="sans pill">任务闭环</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="290" width="430" height="180" rx="22" fill="url(#work)" stroke="#8fb4e8" stroke-width="1.5"/>
    <path d="M444 329h36v27h-36ZM449 362h26" fill="none" stroke="#4d7fd1" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="501" y="332" class="card-title" fill="#3f69ac">YingWork 工作台｜正在建设</text>
    <text x="444" y="380" class="sans body">把 AI 能力带进个人、团队与真实工作流</text>
    <rect x="444" y="407" width="352" height="8" rx="4" fill="#dbe9fb"/>
    <rect x="444" y="407" width="218" height="8" rx="4" fill="#5a8bd9"/>
    <g class="sans">
      <text x="444" y="442" class="pill">任务协同</text>
      <text x="544" y="442" class="pill">团队知识</text>
      <text x="644" y="442" class="pill">场景工作台</text>
    </g>
  </g>

  <g>
    <rect x="880" y="310" width="330" height="160" rx="22" fill="url(#lab)" stroke="#e29a70" stroke-width="1.6" stroke-dasharray="8 7"/>
    <path d="M910 339h28M917 339v14l-9 18c-3 7 1 13 9 13h20c8 0 12-6 9-13l-9-18v-14" fill="none" stroke="#e8753e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M915 371h24" stroke="#e8753e" stroke-width="2" stroke-linecap="round"/>
    <text x="965" y="356" class="card-title" fill="#cf6331">AI 实验室｜下一阶段</text>
    <text x="910" y="404" class="sans body">低代码实验、应用创作与快速验证</text>
    <g class="sans">
      <rect x="910" y="426" width="72" height="26" rx="13" fill="#fff2e9"/><text x="946" y="443" text-anchor="middle" class="pill" fill="#bd592b">搭建</text>
      <rect x="992" y="426" width="72" height="26" rx="13" fill="#fff2e9"/><text x="1028" y="443" text-anchor="middle" class="pill" fill="#bd592b">测试</text>
      <rect x="1074" y="426" width="104" height="26" rx="13" fill="#fff2e9"/><text x="1126" y="443" text-anchor="middle" class="pill" fill="#bd592b">发布验证</text>
    </g>
  </g>

  <!-- 能力底座 -->
  <g filter="url(#shadow)">
    <rect x="70" y="544" width="1140" height="108" rx="22" fill="#fff" stroke="#d9d3ea" stroke-width="1.2"/>
    <text x="98" y="579" class="sans kicker">CAPABILITY FOUNDATION</text>
    <text x="98" y="617" class="card-title">可复用能力底座</text>
    <g class="sans">
      <rect x="328" y="568" width="184" height="56" rx="16" fill="#f6f4fc"/><text x="420" y="592" text-anchor="middle" font-size="15" font-weight="700">数据与工具</text><text x="420" y="612" text-anchor="middle" class="tiny">基金 · 市场 · 账户</text>
      <rect x="528" y="568" width="184" height="56" rx="16" fill="#f1edff"/><text x="620" y="603" text-anchor="middle" font-size="16" font-weight="700" fill="#5f49c3">MCP</text>
      <rect x="728" y="568" width="184" height="56" rx="16" fill="#f1edff"/><text x="820" y="603" text-anchor="middle" font-size="16" font-weight="700" fill="#5f49c3">Skills</text>
      <rect x="928" y="568" width="184" height="56" rx="16" fill="#f1edff"/><text x="1020" y="603" text-anchor="middle" font-size="16" font-weight="700" fill="#5f49c3">Agent</text>
    </g>
  </g>

  <!-- 关系线 -->
  <path d="M220 306V272H430V250" class="line-v"/>
  <path d="M625 286V250" class="line-b"/>
  <path d="M1045 306V272H850V250" class="line-v" stroke-dasharray="7 7"/>
  <path d="M220 540V486" class="line-v"/>
  <path d="M625 540V486" class="line-b"/>
  <path d="M1045 540V486" class="line-v" stroke-dasharray="7 7"/>

  <text x="640" y="691" text-anchor="middle" class="sans sub">当下：AI 小顾持续服务　｜　正在建设：YingWork 工作台　｜　下一阶段：AI 实验室</text>
</svg>
