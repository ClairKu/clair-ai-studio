<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">从走出小顾，到走出且慢</title>
  <desc id="desc">且慢 AI 服务经过三次跨越：融入完整用户路径，进入多种服务终端，最终进入 AI 与机构生态。</desc>
  <defs>
    <linearGradient id="stageOne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f4ff"/>
    </linearGradient>
    <linearGradient id="stageTwo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7ff"/>
      <stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <linearGradient id="stageThree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e43d7"/>
      <stop offset="1" stop-color="#8a70f2"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9bfff"/>
      <stop offset="0.52" stop-color="#8e75f4"/>
      <stop offset="1" stop-color="#6548dc"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8064ed" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8064ed" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#3d267f" flood-opacity="0.12"/>
    </filter>
    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#35207b" flood-opacity="0.26"/>
    </filter>
    <style>
      .serif{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
      .number{font-size:76px;font-weight:800;letter-spacing:-3px}
      .stage{font-size:46px;font-weight:700;fill:#171927}
      .statement{font-size:26px;font-weight:500;fill:#616b80}
      .chip{font-size:23px;font-weight:650;fill:#5b43c6}
      .stageLight{fill:#ffffff}
      .statementLight{fill:#eeeaff}
      .chipLight{fill:#ffffff}
      .micro{font-size:18px;font-weight:750;letter-spacing:2.8px;fill:#7a61e7}
    </style>
  </defs>

  <!-- Open composition: no enclosing panel or repeated page title. -->
  <ellipse cx="1320" cy="172" rx="286" ry="238" fill="url(#halo)"/>
  <path d="M170 608 C430 584 632 508 812 392 C1014 262 1182 188 1454 132" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" opacity="0.24"/>
  <path d="M170 608 C430 584 632 508 812 392 C1014 262 1182 188 1454 132" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Stage 01 -->
  <g transform="translate(54 144)" filter="url(#softShadow)">
    <rect width="454" height="492" rx="34" fill="url(#stageOne)"/>
    <rect x="1" y="1" width="452" height="490" rx="33" fill="none" stroke="#ded8f4" stroke-width="2"/>
    <text x="38" y="72" class="sans micro">01 · INSIDE QIEMAN</text>
    <text x="38" y="160" class="sans number" fill="#7659e7">01</text>
    <text x="38" y="225" class="serif stage">走出小顾</text>
    <text x="38" y="274" class="sans statement">化整为零，融入完整用户路径</text>
    <g transform="translate(38 326)">
      <rect width="112" height="52" rx="26" fill="#eee9ff"/>
      <text x="56" y="34" text-anchor="middle" class="sans chip">首页</text>
      <rect x="126" width="112" height="52" rx="26" fill="#eee9ff"/>
      <text x="182" y="34" text-anchor="middle" class="sans chip">持仓</text>
      <rect y="68" width="112" height="52" rx="26" fill="#eee9ff"/>
      <text x="56" y="102" text-anchor="middle" class="sans chip">交易</text>
      <rect x="126" y="68" width="174" height="52" rx="26" fill="#eee9ff"/>
      <text x="213" y="102" text-anchor="middle" class="sans chip">消息任务</text>
    </g>
  </g>

  <!-- Transition 01 → 02 -->
  <g transform="translate(520 336)">
    <circle cx="42" cy="42" r="42" fill="#ffffff" stroke="#d8d0fa" stroke-width="2"/>
    <path d="M24 42h29m-10-10 11 10-11 10" fill="none" stroke="#7659e7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 02 -->
  <g transform="translate(586 96)" filter="url(#softShadow)">
    <rect width="454" height="492" rx="34" fill="url(#stageTwo)"/>
    <rect x="1" y="1" width="452" height="490" rx="33" fill="none" stroke="#d5ccf5" stroke-width="2"/>
    <text x="38" y="72" class="sans micro">02 · MULTI-CHANNEL</text>
    <text x="38" y="160" class="sans number" fill="#6e51df">02</text>
    <text x="38" y="225" class="serif stage">走出 APP</text>
    <text x="38" y="274" class="sans statement">进入用户所在的服务终端</text>
    <g transform="translate(38 326)">
      <rect width="142" height="52" rx="26" fill="#ffffff"/>
      <text x="71" y="34" text-anchor="middle" class="sans chip">小程序</text>
      <rect x="156" width="92" height="52" rx="26" fill="#ffffff"/>
      <text x="202" y="34" text-anchor="middle" class="sans chip">H5</text>
      <rect y="68" width="112" height="52" rx="26" fill="#ffffff"/>
      <text x="56" y="102" text-anchor="middle" class="sans chip">微信</text>
      <rect x="126" y="68" width="174" height="52" rx="26" fill="#ffffff"/>
      <text x="213" y="102" text-anchor="middle" class="sans chip">工作环境</text>
    </g>
  </g>

  <!-- Transition 02 → 03 -->
  <g transform="translate(1052 288)">
    <circle cx="42" cy="42" r="42" fill="#ffffff" stroke="#bbaef7" stroke-width="2"/>
    <path d="M24 42h29m-10-10 11 10-11 10" fill="none" stroke="#6548dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stage 03 -->
  <g transform="translate(1118 48)" filter="url(#deepShadow)">
    <rect width="428" height="492" rx="34" fill="url(#stageThree)"/>
    <path d="M286 0h108a34 34 0 0 1 34 34v130c-78-7-135-62-142-164Z" fill="#ffffff" opacity="0.08"/>
    <text x="38" y="72" class="sans micro stageLight">03 · OPEN ECOSYSTEM</text>
    <text x="38" y="160" class="sans number" fill="#ffffff" opacity="0.72">03</text>
    <text x="38" y="225" class="serif stage stageLight">走出且慢</text>
    <text x="38" y="274" class="sans statement statementLight">进入 AI 与机构生态</text>
    <g transform="translate(38 326)">
      <rect width="112" height="52" rx="26" fill="#ffffff" opacity="0.94"/>
      <text x="56" y="34" text-anchor="middle" class="sans chip">千问</text>
      <rect x="126" width="134" height="52" rx="26" fill="#ffffff" opacity="0.94"/>
      <text x="193" y="34" text-anchor="middle" class="sans chip">Cursor</text>
      <rect y="68" width="174" height="52" rx="26" fill="#ffffff" opacity="0.94"/>
      <text x="87" y="102" text-anchor="middle" class="sans chip">WorkBuddy</text>
      <rect x="188" y="68" width="154" height="52" rx="26" fill="#ffffff" opacity="0.94"/>
      <text x="265" y="102" text-anchor="middle" class="sans chip">机构 AI</text>
    </g>
  </g>
</svg>
