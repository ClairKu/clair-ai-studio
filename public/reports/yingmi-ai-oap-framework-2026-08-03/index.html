"}],"navHidden":true,"navTarget":"ai-lab"},{"id":"monetization","kicker":"20 · 商化准备","title":"稳定卖承诺，波动卖额度","lead":"30+ 额度扩充与付费咨询证明需求已出现；底层统一积分 / 调用计量，个人与企业根据使用稳定性选择主收费。","layout":"cards","visual":"pricing-routing","tone":"soft","items":[{"segment":"企业合同 / SLA","position":"variable","title":"企业按量预付","main":"API 接入、调用量波动","facts":["T1 / T2 / T3 = ¥0.3 / 0.5 / 0.9 每次","多工具混用，单位成本透明"],"status":"target","source":"飞书 API 收费表 · 2026-08-03"},{"segment":"企业合同 / SLA","position":"stable","title":"企业年包","main":"稳定主链路、采购 / SLA","facts":["参考 ¥10 / 20 / 60 万 · 200 / 500 / 1,000 QPS","POC / 主链路 / 多部门并行"],"status":"target","source":"用户提供企业年包设计 · 2026-08-03"},{"segment":"个人自助","position":"variable","title":"个人资源包","main":"低频、临时、试用与扩容","facts":["参考 ¥9.9—¥9,999 · 1 个月—2 年","一次性额度，作为订阅补充"],"status":"target","source":"用户提供资源包设计 · 2026-08-03"},{"segment":"个人自助","position":"stable","title":"个人订阅","main":"持续、高频、固定预算","facts":["单月 / 连续包月 / 按年","月度积分 + 分享邀请促活"],"status":"target","source":"用户提供订阅与积分设计 · 2026-08-03"}],"pricingPhases":[{"index":"01","title":"上线期｜验证付费闭环","body":"个人订阅为主；企业按量预付为主"},{"index":"02","title":"稳定期｜推动长期承诺","body":"个人转年订；稳定企业转轻量 / 高阶年包"},{"index":"03","title":"规模期｜提高客单与保障","body":"旗舰 / 定制年包 + 阶梯折扣 + 专属 SLA"}],"pricingFoundation":{"title":"统一计量底座","body":"工具统一映射 T1 / T2 / T3；个人按 3 / 5 / 9 积分消耗，企业按调用量计价。套餐只是在额度、有效期、并发与服务上的不同封装。"},"readiness":["个人：微信 / 支付宝、连续扣费、退款与到期提醒","企业：打款、合同、开票、对账、用量预警与 SLA"],"callout":{"label":"建议主线 · 管理判断","text":"上线期个人订阅为主、资源包补充；企业按量预付为主，稳定主链路再转年包。","status":"inferred"}},{"id":"retro","kicker":"21 · 问题回顾","title":"四类问题制约规模化","lead":"技术、资源、用户与数据问题共同指向：外部机会窗口快于内部供给与治理能力建设。","layout":"cards","tone":"dark","items":[{"index":"01","eyebrow":"TECH","title":"技术","body":"AI 协议与框架迭代快，需要频繁升级和多套兼容，包括 SSE → HTTP、API Key → OAuth。","source":"飞书源稿「向内看」· revision 1978"},{"index":"02","eyebrow":"RESOURCE","title":"资源","body":"复合人选难招，产品持续补位商务运营；技术团队转移与跨 BU 分工影响稳定性。","source":"飞书源稿「向内看」· revision 1978"},{"index":"03","eyebrow":"USER","title":"用户","body":"MCP 质量、用户需求和大量机构   <script>
    const report=JSON.parse(document.getElementById("report-data").textContent);
    const $=(selector,scope=document)=>scope.querySelector(selector);
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const status=()=>"";
    const bullets=items=>Array.isArray(items)&&items.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`:"";
    const progress=item=>Number.isFinite(Number(item.progress))?`<div class="metric-progress" aria-label="目标完成度 ${esc(item.progress)}%"><span class="metric-progress-track"><span class="metric-progress-fill" style="--progress:${Math.max(0,Math.min(100,Number(item.progress)))}%"></span></span><small>目标完成度 ${esc(item.progress)}%</small></div>`:"";
    const common=item=>`${item.index?`<span class="item-index">${esc(item.index)}</span>`:""}${item.eyebrow?`<span class="item-eyebrow">${esc(item.eyebrow)}</span>`:""}${item.metric?`<strong class="metric">${esc(item.metric)}</strong>`:""}<h3>${esc(item.title)}</h3>${item.body?`<p class="item-body">${esc(item.body)}</p>`:""}${item.meta?`<span class="item-meta">${esc(item.meta)}</span>`:""}${progress(item)}${bullets(item.bullets)}`;
    const card=(item,index)=>`<article class="item reveal" style="--n:${index}">${common(item)}</article>`;
    function evidence(item){if(item.embed)return `<article class="item reveal interactive-evidence"><iframe class="interactive-frame" src="${esc(item.embed)}" title="${esc(item.alt||item.title)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></article>`;return `<article class="item reveal"><figure>${item.image?`<img src="${esc(item.image)}" alt="${esc(item.alt||item.title)}" loading="lazy">`:`<div class="evidence-placeholder">SOURCE / EVIDENCE</div>`}</figure><div class="evidence-copy">${common(item)}</div></article>`}
    function platformMatrix(section){const labels={live:"已上架",planned:"计划上架",none:"—"};const header=`<div class="matrix-cell mode"><b>能力模式</b><small>PLATFORM × MODE</small></div>${(section.platforms||[]).map(name=>`<div class="matrix-cell platform">${esc(name)}</div>`).join("")}`;const rows=(section.modes||[]).map(mode=>`<div class="matrix-cell mode"><b>${esc(mode.name)}</b><small>${esc(mode.description||"")}</small></div>${(mode.states||[]).map(value=>`<div class="matrix-cell"><span class="state-pill ${esc(value)}">${esc(labels[value]||value)}</span></div>`).join("")}`).join("");const plans=(section.items||[]).map(item=>`<article class="listing-plan reveal">${common(item)}</article>`).join("");return `<div class="platform-board"><div class="matrix-shell reveal"><div class="matrix-legend"><span><i></i>已上架</span><span class="planned"><i></i>计划上架</span></div><div class="matrix-grid">${header}${rows}</div></div><div class="listing-plans">${plans}</div></div>`}
    function capabilityStack(section){const layers=(section.items||[]).map(item=>`<article class="cap-layer reveal ${String(item.eyebrow||"").includes("AGENT")?"agent":""}"><div class="cap-layer-key">${esc(item.index)} · ${esc(item.eyebrow)}</div><div><h3>${esc(item.title)}</h3><p class="cap-layer-body">${esc(item.body)}</p></div><div class="cap-layer-tags">${(item.bullets||[]).map(tag=>`<span>${esc(tag)}</span>`).join("")}</div></article>`).join("");const governance=(section.governance||[]).map(tag=>`<span>${esc(tag)}</span>`).join("");return `<div class="cap-stack-board">${layers}<div class="governance-bar reveal"><b>横向治理控制面</b><div class="governance-tags">${governance}</div></div></div>`}
    function capabilityProgression(section){const cards=(section.items||[]).map(item=>`<article class="cap-card reveal">${common(item)}</article>`).join("");const flow=(section.workflow||[]).map(step=>`<div class="delivery-step"><b>${esc(step.title)}</b><span>${esc(step.body)}</span></div>`).join("");return `<div class="cap-progression"><div class="cap-progression-cards">${cards}</div><div class="delivery-flow reveal">${flow}</div></div>`}
    function serviceBlueprint(section){const [platform={},lab={},consumer={},advisor={}]=section.items||[];const node=(item,extra="")=>`<article class="bp-node ${extra}"><span class="item-eyebrow">${esc(item.eyebrow||"")}</span><h4>${esc(item.title||"")}</h4><p>${esc(item.body||"")}</p></article>`;return `<div class="blueprint-board reveal"><div class="blueprint-stage"><div class="blueprint-overline">AI SERVICE OPERATING SYSTEM · THE BLUEPRINT</div><h3>一个底座、一座工厂、两个终端、一个增长飞轮</h3><div class="blueprint-flow">${node(platform)}<div class="bp-arrow">→</div>${node(lab,"factory")}<div class="bp-arrow">→</div><div class="bp-endpoints">${node(consumer)}${node(advisor)}</div></div><div class="bp-loop"><b>能力资产 → 服务生产 → 业务结果 → 反馈回流</b><span>平台供给并治理，实验室组装与运营，两端完成结果交付</span></div></div></div>`}
    function serviceCreation(section){const stages=(section.stages||[]).map(stage=>`<div class="creation-stage"><b>${esc(stage.index)} · ${esc(stage.title)}</b><span>${esc(stage.meta)}</span></div>`).join("");const actions=(section.items||[]).map(item=>`<div class="creation-action"><i>${esc(item.index)}</i><div><b>${esc(item.title)}</b><span>${esc(item.body)}</span></div></div>`).join("");const foundation=(section.foundation||[]).map(item=>`<span>${esc(item)}</span>`).join("");return `<div class="creation-board"><div class="creation-stages reveal">${stages}</div><div class="creation-stage-grid reveal"><div class="phone-mock"><div class="phone-head">小顾服务广场</div><div class="phone-recommend"><small>为你推荐</small><b>更适合你持仓与计划的服务</b></div><div class="phone-service"><b>长赢行动提醒</b><span>市场明显波动时，结合长期计划判断是否需要行动</span></div><div class="phone-service"><b>基金经理季报追踪</b><span>只推送真正影响投资判断的新变化</span></div></div><div class="creation-copy"><div class="blueprint-overline">ECOSYSTEM · 用户也是服务创作者</div><h3>服务在手机端被发现、使用、反馈与再创造</h3><div class="creation-actions">${actions}</div><div class="foundation-grid">${foundation}</div></div></div></div>`}

anel-head"><div><h3>总体 MCP 工具调用榜单</h3><p>当前截图可见 ${esc(meta.visible||tools.length)} 项 · ${esc(meta.period||"截图可见榜单")}</p></div></header><div class="mcp-insight"><b>基金诊断</b><strong>${number(tools[0]?.calls)}</strong><span>${esc(meta.insight||"")}</span></div><div class="mcp-tool-list">${toolMarkup}</div><div class="mcp-pending"><span>按截图可见项完整呈现</span><span>横条按真实调用量线性绘制</span></div></section></div>`}

    function sectionMarkup(section,index){const tone=section.tone||"light";const content=section.visual==="channel-entrances"?channelEntrances(section):section.visual==="qwen-scene"?qwenScene(section):section.visual==="pricing-routing"?pricingRouting(section):section.chart==="horizontal-bars"?userDemandBars(section):section.visual==="usage-dashboard"?usageDashboard(section):section.id==="platform-listing"?platformMatrix(section):section.id==="wechat-cooperation"?wechatScene(section):section.id==="capability-stack"?capabilityStack(section):section.id==="capability"?capabilityProgression(section):section.id==="service-blueprint"?serviceBlueprint(section):section.id==="user-service-creation"?serviceCreation(section):section.layout==="demo"?demo(section):`<div class="items ${esc(section.layout)}">${section.items.map((item,itemIndex)=>section.layout==="evidence"?evidence(item):card(item,itemIndex)).join("")}</div>`;const callout=section.callout?`<div class="callout reveal"><b>${esc(section.callout.label||"KEY TAKEAWAY")}</b><p>${esc(section.callout.text)}</p>${status(section.callout.status)}</div>`:"";const heading=`<header class="section-head reveal${section.lead?"":" no-lead"}"><div><div class="kicker">${esc(section.kicker||String(index+1).padStart(2,"0"))}</div><h2>${esc(section.title)}</h2></div>${section.lead?`<p class="lead">${esc(section.lead)}</p>`:""}</header>`;return `<section class="section ${esc(tone)}" id="${esc(section.id)}" data-nav-target="${esc(section.navTarget||section.id)}"><div class="wrap">${heading}${content}${callout}</div></section>`}
    document.documentElement.style.setProperty("--accent",report.meta?.accent||"#8067e8");

    $("meta[name=description]").content=report.hero?.conclusion||report.meta?.subtitle||"Clair Executive Visual Report";

    $("#uncertainty-list").innerHTML=(report.uncertainties||[]).length?(report.uncertainties||[]).map((item,index)=>`<div class="question"><b>${String(index+1).padStart(2,"0")} · ${esc(item.title||"不确定性")}</b><span>${esc(item.detail||"")}</span></div>`).join(""):`<div class="question"><b>暂无待说明事项</b><span>本报告未登记额外不确定性。</span></div>`;

    $("#page-rail").innerHTML=panels.map((panel,index)=>`<button class="page-dot${index===0?" active":""}" type="button" data-page-index="${index}" aria-label="跳转到第 ${index+1} 屏：${esc(panelLabels[index]||panel.id)}"></button>`).join("");

    const reveals=[...document.querySelectorAll(".reveal")];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target)}}),{threshold:.12});reveals.forEach(node=>observer.observe(node));

    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});
    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};let activeSyncFrame=0;const syncActiveFromScroll=()=>{if(navigating)return;const navOffset=$("#nav-shell").offsetHeight;let closest=0;let distance=Infinity;panels.forEach((panel,index)=>{const target=panel.id==="top"?0:navOffset;const value=Math.abs(panel.getBoundingClientRect().top-target);if(value<distance){distance=value;closest=index}});setActivePanel(closest)};addEventListener("scroll",()=>{updateProgress();if(!activeSyncFrame)activeSyncFrame=requestAnimationFrame(()=>{activeSyncFrame=0;syncActiveFromScroll()})},{passive:true});updateProgress();
