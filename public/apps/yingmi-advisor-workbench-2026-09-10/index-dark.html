<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="robots" content="noindex,nofollow,noarchive" data-clair-access-robots />
    <script data-clair-access-gate data-clair-access-scope="workspace" src="../../access-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YINGMI WORK · 新一代顾问工作台 · 墨玉版</title>
<style>
/* ============ 设计系统 ============ */
:root{
  --brand:#C0A468; --brand-deep:#D8C095; --brand-050:rgba(192,164,104,.14); --brand-100:#4A3F28;
  --gold:#C0A468; --gold-050:rgba(192,164,104,.14);
  --bg:#12141A; --panel:#1B1E25; --panel-2:#22262F; --line:#30343E; --line-2:#2A2E37;
  --ink:#E9E5D8; --sub:#A9A496; --faint:#7C7768;
  --up:#D0665E; --up-bg:rgba(208,102,94,.14); --down:#5FA07C; --down-bg:rgba(95,160,124,.14);
  --warn:#D0A94E; --warn-bg:rgba(208,169,78,.13); --info:#C0A468; --info-bg:rgba(192,164,104,.14);
  --violet:#9A8CB8; --violet-bg:rgba(154,140,184,.13);
  --r-lg:10px; --r-md:7px; --r-sm:5px;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 4px 14px rgba(0,0,0,.35);
  --sh-3:0 16px 48px rgba(0,0,0,.5);
  --top-h:58px; --nav-w:74px;
  --font:"Songti SC","STSong","STZhongsong","Noto Serif SC","SimSun",serif;
  --num:"Songti SC","STSong","Georgia","Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D4CDBB;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#B8B09A}
::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font);font-size:13.5px;color:var(--ink);outline:none}
a{color:var(--brand);text-decoration:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--sub)} .faint{color:var(--faint)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 顶栏 ============ */
#topbar{height:var(--top-h);background:#191B1F;border-bottom:1px solid #2A2D33;display:flex;align-items:center;padding:0 16px;gap:14px;position:relative;z-index:60;color:#F3F1EA}
#topbar .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:2px;white-space:nowrap}
#topbar .logo .mark{width:30px;height:30px;border-radius:5px;background:#8A6D3C;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#F3F1EA}
#topbar .logo small{font-weight:400;font-size:11px;opacity:.55;margin-left:2px;letter-spacing:1px}
#topbar .env{font-size:10px;background:transparent;color:#C9B585;border:1px solid rgba(138,109,60,.65);padding:1px 8px;border-radius:3px;white-space:nowrap;letter-spacing:2px}
.mode-switch{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:2px;gap:2px;margin-left:6px}
.mode-switch button{color:rgba(243,241,234,.6);font-size:12px;padding:5px 14px;border-radius:3px;display:flex;align-items:center;gap:5px;transition:all .22s;white-space:nowrap;letter-spacing:1px}
.mode-switch button.on{background:#8A6D3C;color:#F3F1EA;font-weight:600}
#topbar .searchbox{flex:1;max-width:430px;margin:0 auto}
#topbar .searchbox .fake-input{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:7px 13px;color:rgba(243,241,234,.5);font-size:12.5px;cursor:pointer;transition:all .2s}
#topbar .searchbox .fake-input:hover{background:rgba(255,255,255,.1)}
#topbar .searchbox kbd{margin-left:auto;background:rgba(255,255,255,.1);border-radius:3px;padding:1px 7px;font-size:11px;font-family:var(--font)}
.top-ico{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(243,241,234,.75);position:relative;transition:background .2s}
.top-ico:hover{background:rgba(255,255,255,.1)}
.top-ico .dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:3px;background:#B04A44;color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700;border:2px solid #191B1F}
#topbar .me{display:flex;align-items:center;gap:9px;padding-left:6px;border-left:1px solid rgba(255,255,255,.16)}
#topbar .me .who{text-align:right;line-height:1.25}
#topbar .me .who b{font-size:12.5px;display:block}
#topbar .me .who span{font-size:10.5px;opacity:.6}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* ============ 主布局 ============ */
#shell{display:flex;height:calc(100vh - var(--top-h));position:relative}
#navrail{width:var(--nav-w);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:40;flex:none}
#navrail .nav-item{width:58px;padding:7px 0 6px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--sub);font-size:10.5px;position:relative;transition:all .18s;margin-bottom:1px;letter-spacing:1px}
#navrail .nav-item .ic{font-size:15px;line-height:1;font-weight:700;width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .18s;border:1px solid transparent}
#navrail .nav-item:hover{background:var(--panel-2);color:var(--ink)}
#navrail .nav-item.on{background:var(--brand-050);color:var(--brand-deep);font-weight:600}
#navrail .nav-item.on .ic{background:var(--brand);color:#FCFBF7}
#navrail .nav-item .bdg{position:absolute;top:4px;right:9px;min-width:15px;height:15px;border-radius:3px;background:var(--up);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3.5px;font-weight:700}
#navrail .spacer{flex:1}

#listcol{width:296px;background:var(--panel);border-right:1px solid var(--line);display:none;flex-direction:column;flex:none;overflow:hidden}
#copilot{width:400px;background:var(--panel);display:flex;flex-direction:column;flex:none;overflow:hidden;position:relative;border-left:1px solid var(--line)}
#workarea{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-width:0}

/* 模式：对话优先（默认） */
body.mode-copilot #shell{display:grid;grid-template-columns:var(--nav-w) 452px 1fr;grid-template-areas:"nav copilot work"}
body.mode-copilot #navrail{grid-area:nav}
body.mode-copilot #copilot{grid-area:copilot;width:auto;border-left:none;border-right:1px solid var(--line)}
body.mode-copilot #workarea{grid-area:work}
body.mode-copilot #listcol{display:none!important}
/* 模式：界面优先 */
body.mode-classic #shell{display:grid;grid-template-columns:var(--nav-w) 296px 1fr 380px;grid-template-areas:"nav list work copilot"}
body.mode-classic #navrail{grid-area:nav}
body.mode-classic #listcol{grid-area:list;display:flex}
body.mode-classic #workarea{grid-area:work}
body.mode-classic #copilot{grid-area:copilot;width:auto}
body.mode-classic #copilot.docked-off{width:0;border:none}
body.mode-classic.copilot-hidden #shell{grid-template-columns:var(--nav-w) 296px 1fr 0}
body.mode-classic.copilot-hidden #copilot{display:none}
body.mode-copilot .only-classic{display:none!important}
body.mode-classic .only-copilot{display:none!important}

/* ============ 通用组件 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card .card-h{display:flex;align-items:center;gap:8px;padding:13px 16px 10px;font-weight:700;font-size:13.5px;letter-spacing:1px}
.card .card-h::before{content:"";width:3px;height:13px;background:var(--gold);flex:none;border-radius:1px}
.card .card-h .more{margin-left:auto;font-size:12px;color:var(--faint);cursor:pointer;font-weight:400;letter-spacing:0}
.card .card-h .more:hover{color:var(--brand)}
.card .card-b{padding:0 16px 14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.brand{background:var(--brand-050);border-color:var(--brand-100);color:var(--brand-deep)}
.chip.gold{background:var(--gold-050);border-color:#E0D2B2;color:#7A6134}
.chip.red{background:var(--up-bg);border-color:#E8CCC8;color:var(--up)}
.chip.green{background:var(--down-bg);border-color:#C4DACC;color:var(--down)}
.chip.orange{background:var(--warn-bg);border-color:#E4D3AE;color:#8A6210}
.chip.violet{background:var(--violet-bg);border-color:#D8D0E4;color:var(--violet)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;padding:7px 14px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:all .18s;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-050)}
.btn.primary{background:#1F2227;border-color:#1F2227;color:#F3F1EA}
.btn.primary:hover{background:#000;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-deep)}
.btn.ghost:hover{background:var(--brand-050)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:4px}
.btn.gold{background:#8A6D3C;border:none;color:#F3F1EA}
.btn.gold:hover{background:#6E5730;color:#fff}
.tag-sev{font-size:10.5px;font-weight:700;padding:1.5px 8px;border-radius:3px;letter-spacing:1px}
.tag-sev.high{background:var(--up-bg);color:var(--up)}
.tag-sev.med{background:var(--warn-bg);color:#8A6210}
.tag-sev.low{background:var(--info-bg);color:var(--info)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--panel);position:sticky;top:0;z-index:20}
.tabs button{padding:11px 14px 9px;font-size:13px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand-deep);border-bottom-color:var(--gold);font-weight:700}
.progress{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;font-weight:700;font-size:13px}
.divider{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12.5px}
.kv .k{color:var(--faint)} .kv .v{font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:12.5px}
.empty .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.5}

/* 视图容器 */
.view{padding:18px 22px 40px;max-width:1180px;margin:0 auto;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-h h1{font-size:19px;font-weight:700;letter-spacing:.3px}
.view-h .sub{color:var(--faint);font-size:12.5px}
.view-h .actions{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1500px){.grid.c4{grid-template-columns:repeat(2,1fr)}}
.grid.c32{grid-template-columns:1.35fr 1fr}
.grid.c23{grid-template-columns:1fr 1.35fr}
@media (max-width:1500px){.grid.c3{grid-template-columns:1fr 1fr}.grid.c32,.grid.c23{grid-template-columns:1fr}}

/* 统计卡 */
.stat{padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px}
.stat .val{font-size:23px;font-weight:700;font-family:var(--num);margin-top:3px;letter-spacing:.3px}
.stat .val small{font-size:12px;font-weight:500;color:var(--faint);margin-left:3px}
.stat .delta{font-size:11.5px;margin-top:2px;display:flex;align-items:center;gap:4px}

/* 列表列（界面优先模式） */
#listcol .list-h{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
#listcol .list-h h2{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
#listcol .list-h .count{font-size:11px;color:var(--faint);font-weight:400}
#listcol .list-search{margin-top:9px;display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
#listcol .list-search input{border:none;background:none;flex:1;font-size:12.5px}
#listcol .list-body{flex:1;overflow-y:auto;padding:8px}
.list-cell{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:all .15s;align-items:center}
.list-cell:hover{background:var(--panel-2)}
.list-cell.on{background:var(--brand-050);border-color:var(--brand-100)}
.list-cell .cell-main{flex:1;min-width:0}
.list-cell .cell-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.list-cell .cell-s{font-size:11.5px;color:var(--faint);margin-top:1px}
.list-cell .cell-r{text-align:right;flex:none}

/* 客户360 */
.c360-head{background:#1E2126;color:#F3F1EA;padding:20px 24px 16px;position:relative;overflow:hidden;border-bottom:2px solid var(--gold)}
.c360-head::after{content:"";position:absolute;right:24px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(138,109,60,.6),transparent)}
.c360-head .row1{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.c360-head .nm{font-size:20px;font-weight:700}
.c360-head .meta{font-size:12px;opacity:.78;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.c360-head .kpi-row{display:flex;gap:26px;margin-top:15px;position:relative;z-index:2;flex-wrap:wrap}
.c360-head .kpi .l{font-size:11px;opacity:.65}
.c360-head .kpi .v{font-size:18px;font-weight:700;font-family:var(--num);margin-top:1px}
.c360-head .kpi .v small{font-size:11px;font-weight:400;opacity:.7}
.c360-head .head-act{margin-left:auto;display:flex;gap:8px;position:relative;z-index:2}
.c360-head .head-act .btn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}
.c360-head .head-act .btn:hover{background:rgba(255,255,255,.24)}
.c360-head .head-act .btn.gold{background:#8A6D3C;border:none}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px}
.hbar .bar{flex:1;height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.hbar .bar i{display:block;height:100%}

/* 时间线 */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl-item{position:relative;padding:0 0 16px 8px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand-100)}
.tl-item.t-comm::before{background:var(--violet);box-shadow:0 0 0 2px var(--violet-bg)}
.tl-item.t-trade::before{background:var(--down);box-shadow:0 0 0 2px var(--down-bg)}
.tl-item.t-event::before{background:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.tl-item.t-report::before{background:var(--gold);box-shadow:0 0 0 2px var(--gold-050)}
.tl-item .tt{font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-item .tt time{font-weight:400;color:var(--faint);font-size:11.5px}
.tl-item .td{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.6}

/* 任务 */
.task{display:flex;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;transition:all .18s;align-items:flex-start}
.task:hover{box-shadow:var(--sh-1);border-color:var(--brand-100)}
.task.done{opacity:.55}
.task.done .tk-t{text-decoration:line-through}
.task .ck{width:18px;height:18px;border-radius:6px;border:1.5px solid #C4CDDF;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;transition:all .15s;cursor:pointer}
.task .ck:hover{border-color:var(--brand)}
.task.done .ck{background:var(--down);border-color:var(--down)}
.task .tk-t{font-size:13px;font-weight:600;line-height:1.45}
.pri-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.pri-dot.high{background:var(--up)} .pri-dot.med{background:var(--warn)} .pri-dot.low{background:#B9B29E}
.task .tk-m{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .tk-act{margin-left:auto;display:flex;gap:6px;flex:none}

/* 事件流 */
.evt{display:flex;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;align-items:flex-start;transition:all .15s}
.evt:hover{box-shadow:var(--sh-1)}
.evt .e-ic{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;filter:saturate(.35)}
.evt .e-main{flex:1;min-width:0}
.evt .e-t{font-size:13px;font-weight:600}
.evt .e-s{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.6}
.evt .e-m{font-size:11px;color:var(--faint);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}

/* 洞察卡 */
.insight{border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:13px 15px;margin-bottom:10px;position:relative;overflow:hidden;transition:all .18s}
.insight:hover{box-shadow:var(--sh-2)}
.insight::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px}
.insight.sev-high::before{background:var(--up)}
.insight.sev-med::before{background:var(--warn)}
.insight.sev-low::before{background:var(--brand)}
.insight .i-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insight .i-t{font-size:13.5px;font-weight:700}
.insight .i-b{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.65}
.insight .i-b b{color:var(--ink)}
.insight .i-ev{font-size:11.5px;color:var(--faint);background:var(--panel-2);border-radius:8px;padding:6px 9px;margin-top:8px;line-height:1.6}
.insight .i-act{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}

/* SOP 管道 */
.sop-board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.sop-col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:300px}
.sop-col .sc-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:2px 4px 9px}
.sop-col .sc-h .n{width:19px;height:19px;border-radius:4px;background:#1F2227;color:#F3F1EA;font-size:11px;display:flex;align-items:center;justify-content:center}
.sop-col .sc-h .cnt{margin-left:auto;color:var(--faint);font-weight:400;font-size:11px}
.sop-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:var(--sh-1)}
.sop-card:hover{border-color:var(--brand);transform:translateY(-1px)}
.sop-card .sc-t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.sop-card .sc-s{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.5}
.sop-steps{display:flex;align-items:center;gap:0;margin:6px 0 2px;flex-wrap:wrap}
.sop-step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.sop-step .st-ic{width:26px;height:26px;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint);flex:none}
.sop-step.done{color:var(--down)}
.sop-step.done .st-ic{background:var(--down-bg);color:var(--down)}
.sop-step.cur{color:var(--brand-deep);font-weight:700}
.sop-step.cur .st-ic{background:var(--gold);color:#FCFBF7;box-shadow:0 0 0 4px var(--brand-050)}
.sop-step .st-line{width:26px;height:2px;background:var(--line);margin:0 5px}

/* 副驾 */
#copilot .cp-h{padding:13px 15px 11px;border-bottom:1px solid var(--line);background:var(--panel)}
#copilot .cp-h .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:1px}
#copilot .cp-h .t .ai-badge{background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:9.5px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:2px}
#copilot .cp-h .s{font-size:11px;color:var(--faint);margin-top:3px}
#copilot .cp-h .cp-mode{margin-left:auto;display:flex;gap:4px}
#cp-stream{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;max-width:100%;animation:fadeUp .25s ease}
.msg .m-av{width:28px;height:28px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px}
.msg.ai .m-av{background:#1E2126;color:#C9B585}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .m-av{background:#4A463E;color:#F3F1EA}
.msg .m-body{max-width:calc(100% - 40px);min-width:0}
.msg.me .m-body{display:flex;flex-direction:column;align-items:flex-end}
.msg .m-txt{background:var(--panel-2);border:1px solid var(--line);padding:9px 12px;border-radius:3px 10px 10px 10px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.me .m-txt{background:#1E2126;color:#F3F1EA;border:none;border-radius:10px 3px 10px 10px}
.msg .m-time{font-size:10px;color:var(--faint);margin-top:4px}
.m-card{width:100%;margin-top:8px}
.cp-input{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--panel)}
.cp-input .box{border:1px solid var(--line);border-radius:6px;padding:9px 12px;transition:border .2s;background:var(--panel-2)}
.cp-input .box:focus-within{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px var(--brand-050)}
.cp-input textarea{width:100%;border:none;background:none;resize:none;font-size:13px;line-height:1.5;max-height:110px}
.cp-input .row{display:flex;align-items:center;gap:6px;margin-top:7px}
.cp-input .send{margin-left:auto;width:32px;height:32px;border-radius:5px;background:#1E2126;color:#F3F1EA;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .18s}
.cp-input .send:hover{background:#000}
.cp-input .send:disabled{background:#C9C3B2;cursor:not-allowed}
.skill-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px}
.skill-chips .sk{font-size:11.5px;padding:4px 10px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--sub);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.skill-chips .sk:hover{border-color:var(--gold);color:var(--brand-deep);background:var(--brand-050)}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#B6C0D8;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* 简报卡 */
.brief{border-radius:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);color:var(--ink);padding:15px 16px;position:relative;overflow:hidden}
.brief .b-t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;letter-spacing:1px}
.brief .b-s{font-size:11.5px;color:var(--faint);margin-top:2px}
.brief .b-stats{display:flex;gap:8px;margin-top:11px;position:relative;z-index:2}
.brief .b-stat{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 9px;cursor:pointer;transition:all .18s}
.brief .b-stat:hover{border-color:var(--gold)}
.brief .b-stat .n{font-size:19px;font-weight:700;font-family:var(--num);color:var(--ink)}
.brief .b-stat .l{font-size:10.5px;color:var(--faint);margin-top:1px}
.brief .b-sum{font-size:12px;line-height:1.7;color:var(--sub);margin-top:11px;position:relative;z-index:2}
.brief .b-sum b{color:var(--brand-deep)}

/* 富卡片（副驾流内） */
.rich{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;box-shadow:var(--sh-1)}
.rich .r-h{padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.rich .r-b{padding:11px 12px}
.rich .r-f{padding:8px 12px;border-top:1px solid var(--line-2);display:flex;gap:7px;flex-wrap:wrap;background:var(--panel-2)}
.mini-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line-2);cursor:pointer}
.mini-row:last-child{border-bottom:none}
.mini-row:hover .mr-t{color:var(--brand)}
.mini-row .mr-t{font-size:12.5px;font-weight:600;flex:1;min-width:0;transition:color .15s}
.mini-row .mr-s{font-size:11px;color:var(--faint)}

/* 命令面板 */
#palette{position:fixed;inset:0;background:rgba(18,28,58,.45);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.open{display:flex}
#palette .pal-box{width:640px;max-width:92vw;background:#fff;border-radius:18px;box-shadow:var(--sh-3);overflow:hidden;animation:palIn .2s ease}
@keyframes palIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
#palette .pal-in{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
#palette .pal-in input{flex:1;border:none;font-size:15px;background:none}
#palette .pal-list{max-height:52vh;overflow-y:auto;padding:8px}
#palette .pal-sec{font-size:10.5px;color:var(--faint);padding:8px 10px 4px;letter-spacing:1px;font-weight:700}
#palette .pal-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer}
#palette .pal-item.sel,#palette .pal-item:hover{background:var(--brand-050)}
#palette .pal-item .pi-ic{width:30px;height:30px;border-radius:5px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;filter:saturate(.35)}
#palette .pal-item .pi-t{font-size:13px;font-weight:600}
#palette .pal-item .pi-s{font-size:11px;color:var(--faint)}
#palette .pal-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);background:var(--panel-2)}
#palette kbd{background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:10.5px}

/* 通知抽屉 & 弹层 */
#drawer-mask{position:fixed;inset:0;background:rgba(18,28,58,.4);z-index:150;display:none}
#drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:-430px;width:420px;height:100vh;background:#fff;z-index:160;transition:right .28s ease;box-shadow:var(--sh-3);display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer .d-h{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.drawer .d-h .x{margin-left:auto;color:var(--faint);font-size:16px;padding:4px}
.drawer .d-b{flex:1;overflow-y:auto;padding:12px 14px}

/* Toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E2126;color:#F3F1EA;padding:10px 18px;border-radius:6px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--sh-3);display:flex;align-items:center;gap:8px;max-width:70vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--panel-2)}

/* 看板图 */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hold-bar{display:flex;height:12px;border-radius:7px;overflow:hidden}
.hold-bar i{display:block;height:100%}

/* 设置 */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line-2)}
.set-row .sr-t{font-size:13px;font-weight:600}
.set-row .sr-s{font-size:11.5px;color:var(--faint);margin-top:2px}
.switch{margin-left:auto;width:40px;height:22px;border-radius:4px;background:#CFC9B8;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:17px;height:17px;border-radius:3px;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--gold)}
.switch.on::after{left:20px}

/* 报告预览 */
.report-doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px;max-width:760px;margin:0 auto;box-shadow:var(--sh-1)}
.report-doc h2{font-size:18px;text-align:center;letter-spacing:1px}
.report-doc .rd-sub{text-align:center;color:var(--faint);font-size:11.5px;margin-top:5px}
.report-doc h3{font-size:14px;margin:20px 0 8px;padding-left:9px;border-left:3px solid var(--gold)}
.report-doc p{font-size:12.5px;color:var(--sub);line-height:1.8;margin-bottom:8px}
.report-doc .rd-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.report-doc .rd-kpi{background:var(--panel-2);border-radius:10px;padding:10px;text-align:center}
.report-doc .rd-kpi .n{font-size:17px;font-weight:700;font-family:var(--num)}
.report-doc .rd-kpi .l{font-size:10.5px;color:var(--faint);margin-top:2px}

/* 浮动副驾按钮（界面优先且收起时） */
#cp-fab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:8px;background:#1E2126;color:#C9B585;font-size:19px;display:none;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,34,39,.35);z-index:90;transition:transform .18s}
#cp-fab:hover{transform:scale(1.06)}
body.mode-classic.copilot-hidden #cp-fab{display:flex}

.tooltip{position:relative}
.fade-in{animation:fadeUp .3s ease}

/* 演示讲解模式 */
#tourbar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(860px,94vw);background:rgba(16,24,48,.92);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.4);z-index:300;display:none;flex-direction:column;color:#fff;overflow:hidden}
#tourbar .tb-main{display:flex;align-items:center;gap:14px;padding:13px 18px}
#tourbar .tb-badge{background:#8A6D3C;color:#F3F1EA;border-radius:3px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:1px}
#tourbar .tb-step{font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap;font-family:var(--num)}
#tourbar .tb-m{flex:1;min-width:0}
#tourbar .tb-t{font-size:14px;font-weight:700;margin-bottom:3px}
#tourbar .tb-n{font-size:12px;color:rgba(255,255,255,.72);line-height:1.6}
#tourbar .tb-r{display:flex;gap:6px;flex:none}
#tourbar .tb-r button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s}
#tourbar .tb-r button:hover{background:rgba(255,255,255,.22)}
#tourbar .tb-prog{height:3px;background:rgba(255,255,255,.12)}
#tourbar .tb-prog i{display:block;height:100%;width:0;background:#8A6D3C;transition:width linear}
body.touring #topbar{box-shadow:0 0 0 3px rgba(138,109,60,.4)}

/* ============ 墨玉深色版覆盖层 ============ */
::-webkit-scrollbar-thumb{background:#3A3E47}
::-webkit-scrollbar-thumb:hover{background:#4C515C}
#topbar{background:#0E1013;border-bottom-color:#23262D}

.btn.primary{background:#C0A468;border-color:#C0A468;color:#14161A}
.btn.primary:hover{background:#D8C095;color:#14161A}
.btn.gold{background:#C0A468;color:#14161A}
.btn.gold:hover{background:#D8C095;color:#14161A}

.c360-head::after{background:linear-gradient(180deg,transparent,rgba(192,164,104,.5),transparent)}

.msg.me .m-av{background:#3A3E47;color:#E9E5D8}

.brief{border-left-color:#C0A468}

.tl-item::before{border-color:var(--panel)}
.rich{background:var(--panel)}

#palette{background:rgba(8,9,12,.6)}

.task .ck{border-color:#4A4E58}

#tourbar .tb-badge{background:#C0A468;color:#14161A}

<script>
/* ==================== 工具与图表 ==================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400)}
function openDrawer(title,html){$('#drawer-title').textContent=title;$('#drawer-body').innerHTML=html;$('#drawer').classList.add('open');$('#drawer-mask').classList.add('open');deEmoji($('#drawer-body'))}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawer-mask').classList.remove('open')}
$('#drawer-mask').addEventListener('click',closeDrawer);

/* SVG: 折线/面积图 */
function lineChart(data,{w=560,h=160,color='#8A6D3C',fill=true,labels=null,base=null}={}){
  const min=Math.min(...data),max=Math.max(...data),pad=6;
  const X=i=>pad+i*(w-2*pad)/(data.length-1), Y=v=>h-pad-((v-min)/(max-min||1))*(h-2*pad);
  let line=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  let area=line+` L${X(data.length-1).toFixed(1)},${h-pad} L${X(0).toFixed(1)},${h-pad} Z`;
  const gid='g'+Math.random().toString(36).slice(2,8);
  let baseLine='';
  if(base!=null&&base>=min&&base<=max){baseLine=`<line x1="${pad}" y1="${Y(base)}" x2="${w-pad}" y2="${Y(base)}" stroke="#C4CDDF" stroke-dasharray="4 4" stroke-width="1"/>`}
  const xl = labels?labels.map((l,i)=>i%2===0?`<text x="${X(i)}" y="${h-0}" font-size="9" fill="#8B94AB" text-anchor="middle" dy="8">${l}</text>`:'').join(''):'';
  return `<svg viewBox="0 0 ${w} ${h+12}" width="100%" style="display:block"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${fill?`<path d="${area}" fill="url(#${gid})"/>`:''}${baseLine}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/><circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1])}" r="3.5" fill="${color}" stroke="#1B1E25" stroke-width="1.5"/>${xl}</svg>`;
}
/* SVG: 迷你 sparkline */
function spark(data,{w=84,h=26,up=true}={}){
  const min=Math.min(...data),max=Math.max(...data);
  const X=i=>2+i*(w-4)/(data.length-1), Y=v=>h-3-((v-min)/(max-min||1))*(h-6);
  const d=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col=up?'var(--up)':'var(--down)';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
/* SVG: 环形图 */
function donut(parts,{size=148,th=20}={}){
  const total=parts.reduce((s,p)=>s+p[1],0);const r=(size-th)/2,cx=size/2,cy=size/2;let a0=-90;
  const arcs=parts.map(([k,v,col])=>{
    const a1=a0+v/total*360;const large=(a1-a0)>180?1:0;
    const x0=cx+r*Math.cos(a0*Math.PI/180),y0=cy+r*Math.sin(a0*Math.PI/180);
    const x1=cx+r*Math.cos(a1*Math.PI/180),y1=cy+r*Math.sin(a1*Math.PI/180);
    const d=`M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;
    a0=a1;return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${th}" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}</svg>`;
}
/* SVG: 横向条形 */
function hbars(rows,{w=300,hMax=110,color='var(--brand)'}={}){
  const max=Math.max(...rows.map(r=>r[1]));
  return rows.map(([k,v,extra])=>`<div style="display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px">
    <span style="width:86px;color:var(--sub);text-align:right;flex:none" class="ellipsis">${k}</span>
    <span style="flex:1;height:14px;background:var(--line-2);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${(v/max*100).toFixed(1)}%;background:${color};border-radius:4px"></i></span>
    <b style="width:44px;flex:none" class="num">${extra??v}</b></div>`).join('');
}
/* 进度环 */
function ring(pct,{size=54,th=5,color='var(--brand)',txt=null}={}){
  const r=(size-th)/2,cir=2*Math.PI*r;
  return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${th}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${cir}" stroke-dashoffset="${cir*(1-pct/100)}"/></svg><span class="ring-txt num">${txt??Math.round(pct)+'%'}</span></span>`;
}
const vipChip = c => `<span class="chip gold">👑 ${c.vipLabel}</span>`;
const avatarOf = (c,sz=38) => `<span class="avatar" style="width:${sz}px;height:${sz}px;font-size:${sz*0.36}px;${avaStyle(c)}">${c.name[0]}</span>`;
const custLink = (id,txt) => `<a href="javascript:openCustomer('${id}')">${txt??C(id).name}</a>`;

</script>

<script>
/* ---------- 共享小组件 ---------- */
function insightHTML(i){
  const c=C(i.c);
  return `<div class="insight sev-${i.sev}">
    <div class="i-h"><span class="tag-sev ${i.sev}">${i.sev==='high'?'高优先':i.sev==='med'?'中优先':'低优先'}</span><span class="chip">${i.kind}</span><span class="i-t">${i.t}</span></div>
    <div class="i-b">${i.b}</div>
    <div class="i-ev">依据 · ${i.ev}</div>
    <div class="i-act">
      ${i.acts.map((a,x)=>`<button class="btn sm ${x===0?'primary':''}" onclick="insightAct('${i.id}','${a}')">${a}</button>`).join('')}
      <button class="btn sm ghost" onclick="openCustomer('${i.c}','insights')">查看 ${c.name} 360 ›</button>
    </div></div>`;
}
function insightAct(id,a){
  const i=DB.insights.find(x=>x.id===id);const c=C(i.c);
  if(a.includes('挽留')){askCopilot(`帮我生成${c.name}的赎回挽留方案`);return}
  if(a.includes('安抚')||a.includes('话术')){askCopilot(`生成给${c.name}的回撤安抚话术`);return}
  if(a.includes('方案')||a.includes('测算')){askCopilot(`完善${c.name}的配置方案`);return}
  if(a.includes('外呼')||a.includes('电话')){toast(`📞 正在呼叫 ${c.name}（企微外呼 · 全程留痕）`);return}
  if(a.includes('任务')||a.includes('提醒')||a.includes('商机')){toast(`✅ 已创建：${a} · ${c.name}`);return}
  if(a.includes('报告')||a.includes('体检')){toast(`📑 已为 ${c.name} 生成报告草稿，前往报告中心查看`);go('reports');return}
  if(a.includes('问卷')){toast(`📩 已向 ${c.name} 发送语音问卷（企微）`);return}
  if(a.includes('信托')){toast(`🤝 已预约私行信托经理，待确认三方会谈时间`);return}
  toast(`✅ 已执行：${a}`);
}
function taskHTML(t){
  const done=state.taskDone[t.id]??t.done;
  return `<div class="task ${done?'done':''}">
    <span class="ck" onclick="toggleTask('${t.id}')">${done?'✓':''}</span>
    <div style="flex:1;min-width:0"><div class="tk-t"><i class="pri-dot ${t.pri}"></i>${t.t}</div>
    <div class="tk-m">${t.c?`<span class="chip brand" style="cursor:pointer" onclick="openCustomer('${t.c}')">${C(t.c).name}</span>`:''}<span>${t.due}</span><span>来自：${t.src}</span>${t.note?`<span title="${esc(t.note)}">${esc(t.note.slice(0,26))}${t.note.length>26?'…':''}</span>`:''}</div></div>
    <div class="tk-act">${t.c?`<button class="btn sm" onclick="askCopilot('帮我处理任务：${t.t}')">副驾处理</button>`:''}</div>
  </div>`;
}
function toggleTask(id){state.taskDone[id]=!(state.taskDone[id]??DB.tasks.find(t=>t.id===id).done);renderWork();renderNav();toast(state.taskDone[id]?'✅ 已完成，已同步 SOP 与留痕':'↩️ 已恢复待办')}
function evtHTML(e){
  return `<div class="evt"><span class="e-ic" style="background:${e.bg}">${e.ic}</span>
    <div class="e-main"><div class="e-t">${e.t}</div><div class="e-s">${e.s}</div>
    <div class="e-m"><span>${e.d}</span>${e.c?`<span>${custLink(e.c)}</span>`:''}<span class="tag-sev ${e.sev}">${e.sev==='high'?'高':e.sev==='med'?'中':'低'}</span></div></div>
    <div style="display:flex;flex-direction:column;gap:5px">${e.c?`<button class="btn sm" onclick="askCopilot('事件「${e.t}」我该怎么处理？')">建议</button>`:`<button class="btn sm" onclick="askCopilot('解读一下：${e.t}')">解读</button>`}</div>
  </div>`;
}

      </div>
      <div class="head-act">
        <button class="btn" onclick="toast('💬 打开企微会话（演示）')">💬 企微</button>

</script>
<script>
/* ==================== AI 副驾 ==================== */
const SKILLS=['📇 客户摘要','💬 生成话术','📑 生成报告','🛡️ 合规检查','🌐 市场解读','🚨 赎回挽留','📐 目标测算','🧭 流程体检'];
function renderSkillChips(){$('#skillChips').innerHTML=SKILLS.map(s=>`<span class="sk" onclick="skillTap('${s}')">${s}</span>`).join('')}
function skillTap(s){
  const map={'📇 客户摘要':'总结一下我重点客户的近况','💬 生成话术':'生成给王建国的回撤安抚话术','📑 生成报告':'帮我生成郑立新的Q3复盘报告','🛡️ 合规检查':'检查这段话术是否合规：本产品稳健增值，预期年化6%，名额有限先到先得','🌐 市场解读':'解读一下今天降息对客户组合的影响','🚨 赎回挽留':'帮我生成王建国的赎回挽留方案','📐 目标测算':'帮林晓芸算一下年终奖怎么配置','🧭 流程体检':'检查一下我所有客户的SOP进度有没有超时的'};
  askCopilot(map[s]||s);
}
function nowTime(){return new Date().toTimeString().slice(0,5)}
function pushMsg(role,txt,card){
  const st=$('#cp-stream');
  const div=document.createElement('div');div.className='msg '+role;
  div.innerHTML=`<span class="m-av">${role==='ai'?'✦':'沈'}</span><div class="m-body"><div class="m-txt">${txt}</div>${card?`<div class="m-card">${card}</div>`:''}<div class="m-time">${nowTime()}</div></div>`;
  st.appendChild(div);st.scrollTop=st.scrollHeight;deEmoji(st);return div;
}
function copilotContext(txt){
  const st=$('#cp-stream');if(!st)return;
  const div=document.createElement('div');
  div.style.cssText='text-align:center;font-size:10.5px;color:var(--faint);margin:2px 0';
  div.innerHTML=`<span style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:2px 10px">🔗 ${txt}</span>`;
  st.appendChild(div);st.scrollTop=st.scrollHeight;
}
function typing(){const st=$('#cp-stream');const d=document.createElement('div');d.className='msg ai';d.id='typing';d.innerHTML='<span class="m-av">✦</span><div class="m-body"><div class="m-txt typing"><i></i><i></i><i></i></div></div>';st.appendChild(d);st.scrollTop=st.scrollHeight}
function untyping(){$('#typing')?.remove()}

function askCopilot(q){
  if(!q)return;
  if(state.mode==='classic'&&document.body.classList.contains('copilot-hidden'))toggleCopilot(true);
  pushMsg('me',esc(q));
  $('#cp-text').value='';autosize();
  typing();
  setTimeout(()=>{untyping();const r=copilotAnswer(q);pushMsg('ai',r.txt,r.card);if(r.act)r.act()},650+Math.random()*550);
}

/* 副驾知识库：意图 → 回答 + 富卡片 + 工作区联动 */
function copilotAnswer(q){
  const findC=()=>DB.customers.find(c=>q.includes(c.name)||q.includes(c.name.slice(0,2)));
  const c=findC();

  /* —— 赎回挽留 —— */
  if(q.includes('挽留')||(q.includes('赎回')&&c)){
    const cc=c||C('c3');
    return {txt:`好的，这是为 ${cc.name} 定制的「赎回挽留三步法」。核心原则：先了解真实需求，不劝阻、给方案。`,card:`
    <div class="rich"><div class="r-h">🚨 ${cc.name} · 流失干预方案 <span class="chip red" style="margin-left:auto">流失概率 62%</span></div>
    <div class="r-b" style="font-size:12.5px;line-height:1.8">
      <b>第一步 · 开场（今天 11:00 前电话）</b><br>“王总，最近企业交班还顺利吗？看到您了解过大额转出，我帮您把几种资金安排都准备好了，占用您 5 分钟。”<br>
      <b>第二步 · 诊断需求</b><br>若是<b>企业周转</b> → 推荐「盈米宝大额快线 + 短债增强」，T+0/T+1 可达，不动长钱；若是<b>对收益不满</b> → 展示固收组合年内 5.01% 与回撤 -4.2% 的体检卡，对比存款与理财；若是<b>传承安排</b> → 联动私行信托经理。<br>
      <b>第三步 · 留钩</b><br>无论是否动用资金，约定一周内上门做「企业交班期家庭资产检视」。</div>
    <div class="r-f"><button class="btn sm primary" onclick="toast('📞 正在呼叫 ${cc.name}…（全程留痕）')">📞 立即外呼</button><button class="btn sm" onclick="toast('📄 方案已存至 ${cc.name} 档案')">存入档案</button><button class="btn sm ghost" onclick="openCustomer('${cc.id}','insights')">打开 360 ›</button></div></div>`,
    act:()=>{if(state.view!=='customers'||state.custId!==cc.id)openCustomer(cc.id,'insights')}};
  }
  /* —— 安抚话术 —— */
  if(q.includes('安抚')||q.includes('话术')){
    const cc=c||C('c1');
    return {txt:`给 ${cc.name}（${cc.risk}，回撤阈值 ${cc.ddLimit}%）的安抚话术，已按合规要求校验：`,card:`
    <div class="rich"><div class="r-h">💬 回撤安抚 · 三道防线框架 <span class="chip green" style="margin-left:auto">🛡️ 合规通过</span></div>
    <div class="r-b" style="font-size:12.5px;line-height:1.85">“${cc.name[0]}总，看到您关注最近的波动，跟您同步三个事实：<br>① 您的组合回撤 -5.2%，在您的风险预算（${cc.ddLimit}%）内，处于历史 68% 分位的正常波动；<br>② 组合有三道防线：固收底仓票息、跨资产再平衡、信号止盈机制；<br>③ 历史上同类回撤后 6 个月修复概率 82%（基于策略 2019 年以来数据）。<br>我周五前给您发一份组合体检报告，有任何担心随时打我电话。”</div>
    <div class="r-f"><button class="btn sm primary" onclick="toast('📤 已发送至 ${cc.name} 企微（留痕）')">发送至企微</button><button class="btn sm" onclick="toast('📋 已复制')">复制</button><button class="btn sm ghost" onclick="askCopilot('换一版更简短的')">换一版</button></div></div>`};
  }
  /* —— 报告生成 —— */
  if(q.includes('报告')&&(q.includes('生成')||q.includes('复盘')||q.includes('优化'))){
    const cc=c||C('c8');
    return {txt:`已为 ${cc.name} 生成报告草稿（数据取自持仓/交易/行为 API，解读由 AI 起草、待您确认）。要点如下：`,card:`
    <div class="rich"><div class="r-h">📑 ${cc.name} · Q3 季度复盘报告 <span class="chip orange" style="margin-left:auto">草稿 70%</span></div>
    <div class="r-b">
      <div class="kv"><span class="k">Q3 收益</span><span class="v num up">+2.1%（基准 +0.8%）</span></div>
      <div class="kv"><span class="k">AUM</span><span class="v num">${fmtW(cc.aum)}</span></div>

  const secs=[...new Set(list.map(i=>i.sec))];
  let html='';let idx=0;
  secs.forEach(s=>{html+=`<div class="pal-sec">${s}</div>`;list.filter(i=>i.sec===s).forEach(i=>{const my=idx++;html+=`<div class="pal-item ${my===palSel?'sel':''}" data-i="${my}" onmouseenter="palSel=${my};renderPal($('#pal-input').value)" onclick="palGo(${PAL_ITEMS.indexOf(i)})"><span class="pi-ic">${i.ic}</span><div style="flex:1;min-width:0"><div class="pi-t">${i.t}</div><div class="pi-s">${i.s}</div></div><span style="color:var(--faint);font-size:11px">⏎</span></div>`})});
  if(q)html+=`<div class="pal-sec">副驾</div><div class="pal-item" onclick="closePalette();askCopilot('${esc(q)}')"><span class="pi-ic">✨</span><div style="flex:1"><div class="pi-t">问副驾：“${esc(q)}”</div><div class="pi-s">AI 将检索客户360/投研/报告并联动工作区</div></div></div>`;
  $('#pal-list').innerHTML=html||'<div class="empty">无匹配结果</div>';
  $('#pal-list')._list=list;
}
function palGo(i){const it=PAL_ITEMS[i]||$('#pal-list')._list?.[i];if(!it)return;closePalette();it.fn()}
$('#openPalette').addEventListener('click',openPalette);
$('#pal-input').addEventListener('input',e=>{palSel=0;renderPal(e.target.value)});
$('#pal-input').addEventListener('keydown',e=>{
  const n=$('#pal-list')._list?.length||0;
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,n-1);renderPal(e.target.value)}
  if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);renderPal(e.target.value)}
  if(e.key==='Enter'){e.preventDefault();const q=e.target.value.trim();if(e.shiftKey&&q){closePalette();askCopilot(q);return}const it=$('#pal-list')._list?.[palSel];if(it){closePalette();it.fn()}else if(q){closePalette();askCopilot(q)}}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').classList.contains('open')?closePalette():openPalette()}
  if(e.key==='Escape'){closePalette();closeDrawer()}
});
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')closePalette()});

let tourOn=false,tourIdx=-1,tourTimer=null,tourPaused=false;
function startTour(){tourOn=true;tourPaused=false;document.body.classList.add('touring');$('#tourbar').style.display='flex';closeDrawer();closePalette();tourGo(0)}
function tourGo(i){
  tourIdx=i;const s=TOUR[i];
  $('#tb-t').textContent=s.t;$('#tb-n').textContent=s.n;$('#tb-step').textContent=(i+1)+' / '+TOUR.length;
  $('#tb-play').textContent=tourPaused?'▶':'⏸';
  const bar=$('#tb-bar');bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;
  if(!tourPaused){bar.style.transition=`width ${s.dur}ms linear`;bar.style.width='100%'}
  s.run();
  clearTimeout(tourTimer);
  if(!tourPaused)tourTimer=setTimeout(tourNext,s.dur);
}
function tourNext(){if(tourIdx>=TOUR.length-1){endTour();toast('🎬 演示结束 · 可自由探索');return}tourGo(tourIdx+1)}
function tourPrev(){if(tourIdx>0)tourGo(tourIdx-1)}
function tourToggle(){
  tourPaused=!tourPaused;clearTimeout(tourTimer);
  $('#tb-play').textContent=tourPaused?'▶':'⏸';
  const bar=$('#tb-bar');
  if(tourPaused){const w=getComputedStyle(bar).width;bar.style.transition='none';bar.style.width=w}
  else{const s=TOUR[tourIdx];bar.style.transition=`width ${s.dur}ms linear`;bar.style.width='100%';tourTimer=setTimeout(tourNext,s.dur)}
}
function endTour(){tourOn=false;clearTimeout(tourTimer);$('#tourbar').style.display='none';document.body.classList.remove('touring')}
