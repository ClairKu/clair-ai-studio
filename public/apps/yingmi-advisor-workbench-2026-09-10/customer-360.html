<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户 360° 引擎 · YINGMIWORK 顾问工作台</title>
<style>
/* ============ 设计系统 Tokens（与工作台一致） ============ */
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --panel-2:#FAFBFD; --ink:#16213A; --ink-2:#3D4A68; --ink-3:#7A86A3;
  --line:#E4E8F2; --line-2:#EEF1F8;
  --brand:#0E3A5D; --brand-2:#12558C; --brand-soft:#E8F0F9;
  --gold:#B98A2F; --gold-soft:#F8F1E2;
  --up:#0E9F6E; --up-soft:#E5F6EF; --down:#E5484D; --down-soft:#FCEBEB;
  --warn:#D97706; --warn-soft:#FCF3E3; --violet:#6D5BD0; --violet-soft:#EFECFB;
  --cyan:#0E8FA8; --cyan-soft:#E4F5F8;
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --shadow-1:0 1px 2px rgba(22,33,58,.05),0 1px 8px rgba(22,33,58,.04);
  --shadow-2:0 4px 14px rgba(22,33,58,.09),0 1px 4px rgba(22,33,58,.06);
  --shadow-3:0 14px 44px rgba(22,33,58,.16);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD2E2;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.up-txt{color:var(--up)}.down-txt{color:var(--down)}
.flex{display:flex;align-items:center;gap:8px}
.flex .sp{flex:1}
.mono{font-family:var(--mono)}

/* ============ 框架 ============ */
#app{display:grid;grid-template-rows:46px auto minmax(0,1fr);height:100vh}
#topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--brand);color:#fff}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
#topbar .logo .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#2E7FC4,#0E3A5D);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:11px;font-weight:800;color:#FFE9B8}
#topbar .crumb{font-size:12px;opacity:.85}
#topbar .crumb b{font-weight:600}
#topbar .sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.16);transition:.15s}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn.on{background:#fff;color:var(--brand);font-weight:600}
.tb-sel{height:28px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16);font-size:12px;padding:0 8px}
.tb-sel option{color:var(--ink)}

/* Hero：身份条 */
#hero{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px 10px;display:flex;gap:16px;align-items:flex-start}
#hero .cav{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;background:#12558C;flex:none;position:relative}
#hero .cav .st{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--down);border:2px solid #fff}
#hero .nm{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hero .meta{font-size:11.5px;color:var(--ink-3);margin-top:3px}
#hero .kpis{display:flex;gap:0;margin-left:auto;flex:none}
.hk{padding:0 16px;border-left:1px solid var(--line-2);min-width:110px}
.hk:first-child{border-left:none}
.hk .lb{font-size:10.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:4px}
.hk .vl{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.hk .vl small{font-size:11px;color:var(--ink-3);font-weight:600;margin-left:2px}
.hk .dl{font-size:10.5px;margin-top:1px;font-weight:600}
#hero .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* 三栏 */
#body{display:grid;grid-template-columns:212px minmax(0,1fr) 336px;min-height:0}
#nav{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 20px}
#center{overflow-y:auto;padding:14px 18px 60px;scroll-behavior:smooth;position:relative}
#rail{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1380px){#body{grid-template-columns:196px minmax(0,1fr) 300px}}
@media (max-width:1180px){#body{grid-template-columns:0 minmax(0,1fr) 0}#nav,#rail{display:none}}

/* 左导航 */
.nv-group{margin-bottom:6px}
.nv-gh{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);font-weight:800;letter-spacing:.07em;padding:8px 8px 4px;text-transform:uppercase}
.nv-gh .ln{flex:1;height:1px;background:var(--line-2)}
.nv-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;font-size:12px;color:var(--ink-2);cursor:pointer;border:1px solid transparent;transition:.12s}
.nv-item:hover{background:var(--panel-2)}
.nv-item.on{background:var(--brand-soft);border-color:#C9DCF1;color:var(--brand);font-weight:700}
.nv-item .ic{width:18px;text-align:center;font-size:12px;flex:none}
.nv-item .bd{margin-left:auto;font-size:9.5px;font-weight:800;min-width:16px;height:16px;padding:0 5px;border-radius:8px;display:grid;place-items:center}
.nv-item .bd.red{background:var(--down);color:#fff}.nv-item .bd.gold{background:var(--gold);color:#fff}.nv-item .bd.violet{background:var(--violet);color:#fff}.nv-item .bd.gray{background:#E4E9F4;color:var(--ink-3)}
.nv-item.off{opacity:.45}
.nv-item.off .ic::after{content:""}
.nv-foot{margin:14px 6px 0;padding:10px;border-radius:10px;background:var(--panel-2);border:1px dashed var(--line);font-size:11px;color:var(--ink-3);line-height:1.55}

/* 中心：分组标题与模块网格 */
.grp{margin-bottom:16px}
.grp-h{display:flex;align-items:center;gap:8px;margin:4px 2px 9px}
.grp-h h2{font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.grp-h .ds{font-size:11px;color:var(--ink-3)}
.grp-h .ln{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;align-items:start}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);min-width:0;transition:box-shadow .2s,border-color .2s;position:relative}
.mod.span2{grid-column:span 2}
.mod.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(109,91,208,.0)}20%{box-shadow:0 0 0 4px rgba(109,91,208,.55);border-color:var(--violet)}100%{box-shadow:var(--shadow-1)}}
.mod-h{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--line-2)}
.mod-h .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;flex:none;background:var(--brand-soft);color:var(--brand)}
.mod-h h3{font-size:12.5px;font-weight:700;white-space:nowrap}
.mod-h .ai{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:linear-gradient(135deg,#12558C,#6D5BD0);color:#fff;letter-spacing:.04em}
.mod-h .srcs{display:flex;gap:4px;margin-left:4px}
.src-dot{width:7px;height:7px;border-radius:50%;display:inline-block;position:relative;cursor:help}
.mod-h .tools{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.15s}
.mod:hover .mod-h .tools{opacity:1}
.mod-h .tools button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.mod-h .tools button:hover{background:var(--brand-soft);color:var(--brand)}
.mod-b{padding:12px 13px}
.mod.collapsed .mod-b{display:none}
.mod-f{padding:6px 13px;border-top:1px solid var(--line-2);font-size:10px;color:var(--ink-3);display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.mod.collapsed .mod-f{display:none}
.mod-f .lk{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.lk-chip{font-size:9.5px;padding:1px 6px;border-radius:4px;background:#fff;border:1px solid var(--line);color:var(--ink-2);cursor:pointer}
.lk-chip:hover{border-color:var(--violet);color:var(--violet)}

/* 通用元素 */
.tag{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag.blue{background:var(--brand-soft);color:var(--brand)}.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.green{background:var(--up-soft);color:var(--up)}.tag.red{background:var(--down-soft);color:var(--down)}
.tag.gray{background:#EEF1F7;color:var(--ink-3)}.tag.violet{background:var(--violet-soft);color:var(--violet)}
.tag.cyan{background:var(--cyan-soft);color:var(--cyan)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.outline{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.tag.sm{height:16px;font-size:9.5px;padding:0 5px}
.mini-btn{height:24px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.13s;white-space:nowrap}
.mini-btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.mini-btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.mini-btn.pri:hover{background:var(--brand-2)}
.mini-btn.gold{background:var(--gold-soft);border-color:#E8D5AC;color:var(--gold)}
.mini-btn.violet{background:var(--violet-soft);border-color:#D4CCF2;color:var(--violet)}
.mini-btn.xs{height:20px;padding:0 6px;font-size:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--line-2)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);flex:none}.kv .v{font-weight:600;text-align:right}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;color:var(--ink-3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.tbl td{font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--brand-soft)}
.r{text-align:right}
.seg{display:inline-flex;background:#EEF1F7;border-radius:7px;padding:2px;gap:2px}
.seg button{height:20px;padding:0 8px;border-radius:5px;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow-1)}
.pri-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.bar{height:7px;background:#EEF1F7;border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:10.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.divider{height:1px;background:var(--line-2);margin:10px 0}
.hint{font-size:10.5px;color:var(--ink-3);line-height:1.5}
.callout{border-radius:9px;padding:8px 10px;font-size:11.5px;line-height:1.55;border:1px solid}
.callout.ai{background:var(--violet-soft);border-color:#D4CCF2;color:#3E3480}
.callout.warn{background:var(--warn-soft);border-color:#F1DDB3;color:#7A4A05}
.callout.red{background:var(--down-soft);border-color:#F3C4C6;color:#8B1E22}
.callout.green{background:var(--up-soft);border-color:#BFE7D4;color:#0A5F42}
.callout.gray{background:var(--panel-2);border-color:var(--line);color:var(--ink-2)}

/* 证据链 chip */
.ev-chip{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:600;background:#fff;border:1px solid #D4CCF2;color:var(--violet);cursor:pointer;transition:.12s;vertical-align:middle;margin:1px 1px}
.ev-chip:hover{background:var(--violet);color:#fff}
.ev-chip::before{content:"↗";font-size:9px;opacity:.7}

/* AI 摘要模块 */
.brief{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.brief .txt{font-size:12.5px;line-height:1.8}
.brief .txt b{font-weight:700}
.state-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.state{border-radius:10px;padding:9px 10px;border:1px solid var(--line);background:var(--panel-2)}
.state .lb{font-size:10.5px;color:var(--ink-3);font-weight:600}
.state .vl{font-size:15px;font-weight:800;margin-top:2px}
.state .ds{font-size:10.5px;margin-top:2px;line-height:1.4}
.state.red{background:var(--down-soft);border-color:#F3C4C6}.state.red .vl{color:var(--down)}
.state.gold{background:var(--gold-soft);border-color:#E8D5AC}.state.gold .vl{color:var(--gold)}
.state.green{background:var(--up-soft);border-color:#BFE7D4}.state.green .vl{color:var(--up)}
.conf{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-3)}
.conf .bar{width:46px;height:5px;flex:none}

/* 建议卡 */
.nba{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;transition:.15s;background:#fff}
.nba.adopted{background:var(--up-soft);border-color:#BFE7D4}
.nba.ignored{opacity:.5}
.nba .rk{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:#fff}
.nba .t{font-size:12.5px;font-weight:700;line-height:1.4}
.nba .why{font-size:11px;color:var(--ink-2);margin-top:4px;line-height:1.55}
.nba .acts{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
.nba .cf{margin-left:auto;text-align:right;flex:none;font-size:10px;color:var(--ink-3)}
.nba .cflag{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--warn);font-weight:700;margin-top:4px;cursor:pointer}

/* 标签泳道 */
.lane{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line-2);align-items:flex-start}
.lane:last-child{border-bottom:none}
.lane .ln{width:64px;flex:none;font-size:10.5px;font-weight:700;padding-top:2px;display:flex;flex-direction:column;gap:2px}
.lane .ln small{font-weight:500;color:var(--ink-3);font-size:9.5px}
.lane .tg{display:flex;flex-wrap:wrap;gap:4px}
.tg .tag{cursor:default;position:relative}
.tg .tag.cf{outline:1.5px dashed var(--warn);outline-offset:1px}
.tg .tag .cfv{font-weight:800;opacity:.75;font-size:9.5px}
.tt{position:fixed;z-index:400;background:#16213A;color:#fff;font-size:11px;padding:8px 10px;border-radius:8px;box-shadow:var(--shadow-3);max-width:260px;line-height:1.5;display:none;pointer-events:none}
.tt b{color:#FFE9B8}

/* 备注 */
.note{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px;line-height:1.55;background:var(--panel-2)}
.note .m{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--ink-3);margin-top:5px}
.switch{width:28px;height:16px;border-radius:9px;background:#CBD2E2;position:relative;cursor:pointer;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--up)}.switch.on::after{left:14px}

/* 旅程 */
.jr{display:flex;align-items:flex-start;gap:0;margin-top:4px}
.jr-step{flex:1;position:relative;text-align:center}
.jr-step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;background:#E8ECF5;color:var(--ink-3);border:2px solid #E8ECF5;position:relative;z-index:1}
.jr-step .lb{font-size:11px;font-weight:700;margin-top:6px;color:var(--ink-3)}
.jr-step .dt{font-size:9.5px;color:var(--ink-3);margin-top:1px}
.jr-step .du{font-size:9.5px;margin-top:2px;font-weight:600}
.jr-step::before{content:"";position:absolute;top:12px;left:-50%;right:50%;height:2px;background:#E8ECF5}
.jr-step:first-child::before{display:none}
.jr-step.done .dot{background:var(--up);border-color:var(--up);color:#fff}.jr-step.done .lb{color:var(--up)}
.jr-step.done::before{background:var(--up)}
.jr-step.cur .dot{background:#fff;border-color:var(--brand-2);color:var(--brand-2);box-shadow:0 0 0 4px rgba(18,85,140,.14)}
.jr-step.cur .lb{color:var(--brand)}.jr-step.cur::before{background:var(--up)}
.moments{position:relative;height:74px;margin-top:14px}
.moments .axis{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line)}
.moment{position:absolute;top:26px;transform:translateX(-50%);text-align:center;cursor:pointer;width:80px}
.moment .d{width:14px;height:14px;border-radius:50%;margin:0 auto;border:3px solid #fff;box-shadow:0 0 0 1.5px currentColor}
.moment .l{font-size:9.5px;font-weight:700;margin-top:4px;white-space:nowrap;color:var(--ink-2)}
.moment .y{font-size:9px;color:var(--ink-3)}
.moment.up{top:-2px}.moment.up .d{margin-top:0}
.moment.up .l,.moment.up .y{margin-top:0}
.moment.up{display:flex;flex-direction:column-reverse;gap:2px}
.moment.now .d{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1.5px currentColor}50%{box-shadow:0 0 0 5px rgba(229,72,77,.25)}}

/* 热力图 */
.hm{display:grid;grid-template-columns:28px repeat(8,1fr);gap:2px;font-size:9.5px;color:var(--ink-3)}
.hm .c{height:16px;border-radius:3px;background:var(--brand-soft)}
.hm .rl{display:flex;align-items:center}
.hm .cl{text-align:center}

/* 事件→任务 */
.et{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:center}
.et .arrow{color:var(--ink-3);text-align:center;font-size:12px}
.ev,.tk{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;background:#fff;line-height:1.4}
.ev b,.tk b{font-size:11.5px}
.ev .m,.tk .m{font-size:9.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:5px;align-items:center}
.tk.done{opacity:.55;text-decoration:line-through}
.tk.new{border-color:#BFE7D4;background:var(--up-soft)}

/* 日历条 */
.cal{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin:6px 0 4px}
.cal .d{height:22px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line-2);position:relative;font-size:8px;color:var(--ink-3);display:grid;place-items:end center;padding-bottom:1px}
.cal .d.today{border-color:var(--brand-2);background:var(--brand-soft)}
.cal .d .p{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%}
.cal .d.wk{background:#F1F3F8}

/* 树图 */
.tm{position:relative;height:118px;border-radius:8px;overflow:hidden}
.tm .n{position:absolute;padding:4px 6px;font-size:10px;color:#fff;overflow:hidden;line-height:1.3;border:1px solid rgba(255,255,255,.7)}
.tm .n b{display:block;font-size:10.5px}

/* 右侧引擎 */
.eng{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.eng-h{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line-2);background:#fff;cursor:pointer;user-select:none}
.eng-h .orb{width:20px;height:20px;border-radius:7px;background:linear-gradient(135deg,#12558C,#6D5BD0);display:grid;place-items:center;color:#fff;font-size:10px;flex:none}
.eng-h h4{font-size:12px;font-weight:700}
.eng-h .cnt{margin-left:auto;font-size:10px;color:var(--ink-3);font-weight:700}
.eng-h .cv{font-size:10px;color:var(--ink-3);transition:.2s}
.eng.closed .eng-h .cv{transform:rotate(-90deg)}
.eng-b{padding:10px 11px}
.eng.closed .eng-b{display:none}
.src-row{display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 0}
.src-row .n{font-weight:600;flex:1}
.src-row .f{font-size:10px;color:var(--ink-3)}
.cfl{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;margin-bottom:7px;font-size:11px}
.cfl .h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px}
.cfl .vs{display:grid;grid-template-columns:1fr 18px 1fr;gap:4px;align-items:center;margin:6px 0;font-size:10.5px}
.cfl .vs .a,.cfl .vs .b{padding:5px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);line-height:1.4}
.cfl .vs .x{text-align:center;color:var(--warn);font-weight:800}
.cfl .rule{font-size:10.5px;color:var(--ink-2);line-height:1.5}
.cfl .rule b{color:var(--brand)}
.cfl .res{margin-top:5px;font-size:10.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cfl.done{opacity:.6}
.fb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.fb-grid div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 4px}
.fb-grid b{display:block;font-size:16px}
.fb-grid span{font-size:10px;color:var(--ink-3)}
.gnode{cursor:pointer}
.gnode:hover circle{stroke-width:3}

/* 抽屉 / 弹层 */
.overlay{position:fixed;inset:0;background:rgba(13,24,42,.45);backdrop-filter:blur(3px);z-index:300;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;box-shadow:var(--shadow-3);z-index:310;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer .dh h3{font-size:14px;font-weight:800}
.drawer .db{flex:1;overflow-y:auto;padding:14px 16px}
.mod-opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.mod-opt .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:13px;flex:none}
.mod-opt .t{font-size:12.5px;font-weight:700}
.mod-opt .d{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.mod-opt .a{margin-left:auto;flex:none}
.mod-opt.ext{border-style:dashed;background:var(--panel-2)}
pre.json{background:#16213A;color:#DCE4F5;font-size:10.5px;line-height:1.55;padding:12px;border-radius:9px;overflow:auto;font-family:var(--mono);max-height:60vh}
#toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#16213A;color:#fff;font-size:12px;font-weight:600;padding:9px 16px;border-radius:10px;box-shadow:var(--shadow-3);animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:24px;color:var(--ink-3);font-size:11.5px}
.spark{display:block}

function spark(d,w,h,c,fill){const mn=Math.min(...d),mx=Math.max(...d);const X=i=>i*(w/(d.length-1)),Y=v=>h-2-(v-mn)/(mx-mn||1)*(h-4);

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${fill?`<path d="${p} L${w},${h} L0,${h}Z" fill="${c}" opacity=".12"/>`:''}<path d="${p}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;}
function lines(series,w,h,opts={}){const all=series.flatMap(s=>s.d);const mn=Math.min(...all,opts.zero?0:Infinity),mx=Math.max(...all);const pad=6;

  const zero=opts.zero?`<line x1="${pad}" x2="${w-pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="#CBD2E2" stroke-dasharray="3 3"/>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">${zero}${series.map((s,k)=>{const p=s.d.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    return `${k===0&&opts.area?`<path d="${p} L${X(n-1)},${h} L${X(0)},${h}Z" fill="${s.c}" opacity=".1"/>`:''}<path d="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="4 3"':''} stroke-linecap="round"/><circle cx="${X(n-1)}" cy="${Y(s.d[n-1])}" r="3" fill="${s.c}" stroke="#fff" stroke-width="1.5"/>`;}).join('')}</svg>`;}

  const ps=segs.map(s=>{const a0=acc/tot*2*Math.PI-Math.PI/2;acc+=s.v;const a1=acc/tot*2*Math.PI-Math.PI/2-0.02;const lg=(a1-a0)>Math.PI?1:0;
    return `<path d="M${(cx+r*Math.cos(a0)).toFixed(2)},${(cy+r*Math.sin(a0)).toFixed(2)} A${r},${r} 0 ${lg} 1 ${(cx+r*Math.cos(a1)).toFixed(2)},${(cy+r*Math.sin(a1)).toFixed(2)}" stroke="${s.c}" stroke-width="${th}" fill="none"/>`;}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none">${ps}${center?`<text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="9.5" fill="#7A86A3">${center[0]}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#16213A">${center[1]}</text>`:''}</svg>`;}

function treemap(items,W,H){const out=[];const rec=(its,x,y,w,h)=>{if(!its.length)return;if(its.length===1){out.push({...its[0],x,y,w,h});return;}const tot=its.reduce((a,i)=>a+i.v,0);let acc=0,k=0;for(;k<its.length-1;k++){acc+=its[k].v;if(acc>=tot/2)break;}const A=its.slice(0,k+1),B=its.slice(k+1);const fa=A.reduce((a,i)=>a+i.v,0)/tot;
    if(w>=h){rec(A,x,y,w*fa,h);rec(B,x+w*fa,y,w*(1-fa),h);}else{rec(A,x,y,w,h*fa);rec(B,x,y+h*fa,w,h*(1-fa));}};
  rec([...items].sort((a,b)=>b.v-a.v),0,0,100,100);
  return `<div class="tm" style="height:${H}px">${out.map(n=>`<div class="n" style="left:${n.x}%;top:${n.y}%;width:${n.w}%;height:${n.h}%;background:${n.c}" title="${esc(n.k)} ${n.v.toFixed(1)}%">${n.w>14&&n.h>18?`<b>${esc(n.k)}</b>${n.v.toFixed(1)}%`:''}</div>`).join('')}</div>`;}
function graph(nodes,edges,w,h){return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">${edges.map(([a,b,s])=>{const A=nodes.find(n=>n.id===a),B=nodes.find(n=>n.id===b);return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${s?'#6D5BD0':'#CBD2E2'}" stroke-width="${s?2:1.2}" ${s?'':'stroke-dasharray="3 3"'} opacity=".8"/>`;}).join('')}
  ${nodes.map(n=>`<g class="gnode" onclick="jumpTo('${n.mod||''}')"><circle cx="${n.x}" cy="${n.y}" r="${n.r||14}" fill="${n.c}" stroke="#fff" stroke-width="2"/><text x="${n.x}" y="${n.y+3.5}" text-anchor="middle" font-size="${n.r>16?10:9}" font-weight="700" fill="#fff">${n.ic}</text><text x="${n.x}" y="${n.y+(n.r||14)+11}" text-anchor="middle" font-size="9.5" fill="#3D4A68" font-weight="600">${n.lb}</text></g>`).join('')}</svg>`;}
function heat(m){const rows=['一','二','三','四','五','六','日'],cols=['0','3','6','9','12','15','18','21'];const sh=v=>['#F1F3F8','#DCE7F5','#B7CDEB','#7FA9DD','#3F7BC3','#12558C'][v];
  return `<div class="hm"><div></div>${cols.map(c=>`<div class="cl">${c}时</div>`).join('')}${m.map((r,i)=>`<div class="rl">周${rows[i]}</div>${r.map(v=>`<div class="c" style="background:${sh(v)}" title="${v} 次"></div>`).join('')}`).join('')}</div>`;}

    <div class="res">结果：<b>${esc(c.res)}</b>${c.st==='open'?`<span class="sp"></span><button class="mini-btn xs pri" onclick="resolve('${c.id}','confirm')">确认 AI 标签</button><button class="mini-btn xs" onclick="resolve('${c.id}','reject')">驳回</button>`:''}</div></div>`).join('')}</div></div>

  <div class="eng"><div class="eng-h" onclick="this.parentNode.classList.toggle('closed')"><span class="orb">↻</span><h4>反馈闭环</h4><span class="cnt">近 90 天</span><span class="cv">▾</span></div><div class="eng-b">
   <div class="fb-grid"><div><b class="up-txt">${f.adopted}</b><span>采纳</span></div><div><b style="color:var(--gold)">${f.edited}</b><span>修改后采纳</span></div><div><b class="muted">${f.ignored}</b><span>忽略</span></div></div>
   <div class="flex" style="margin-top:8px;gap:8px"><span class="hint" style="width:70px">建议采纳率</span><div class="bar"><i style="width:${f.acc*100}%;background:var(--violet)"></i></div><b class="num" style="font-size:11px">${(f.acc*100)|0}%</b></div>
   <div class="hint" style="margin-top:6px">采纳/忽略/纠错都会回流：忽略原因用于降权同类建议；纠错用于修正该客户的个体模型。</div></div></div>

  <div class="eng"><div class="eng-h" onclick="this.parentNode.classList.toggle('closed')"><span class="orb">◔</span><h4>画像完整度</h4><span class="cnt">${C.scores.complete}%</span><span class="cv">▾</span></div><div class="eng-b" style="display:flex;gap:10px;align-items:center">${ring(C.scores.complete/100,64,'#12558C',C.scores.complete+'%')}<div class="hint">缺失：${C.profile.missing.join('、')}<br>完整度低于 70% 时 AI 建议自动降级为「需补录后再判断」。</div></div></div>`;}

function renderAll(){renderHero();renderNav();renderCenter();renderRail();$('#preset-sel').innerHTML=Object.entries(PRESETS).map(([k,p])=>`<option value="${k}" ${L.preset===k?'selected':''}>${p.lb}</option>`).join('');}
function rerender(id){const el=$(`#mod-${id}`);if(!el)return;const st=L.mods.find(m=>m.id===id);el.outerHTML=modHTML(MODULES[id],st);}

/* ================= 布局操作 ================= */
function modSpan(id){const st=L.mods.find(m=>m.id===id);st.span=st.span===2?1:2;saveL();rerender(id);}
function modCollapse(id){const st=L.mods.find(m=>m.id===id);st.collapsed=!st.collapsed;saveL();rerender(id);}
function modMove(id,dir){const i=L.mods.findIndex(m=>m.id===id);const g=MODULES[id].group;let j=i+dir;while(j>=0&&j<L.mods.length&&MODULES[L.mods[j].id].group!==g)j+=dir;if(j<0||j>=L.mods.length){toast('已到分组边界');return;}[L.mods[i],L.mods[j]]=[L.mods[j],L.mods[i]];saveL();renderCenter();jumpTo(id,true);}
function removeModule(id){L.mods=L.mods.filter(m=>m.id!==id);L.preset='custom';saveL();renderAll();toast('已移除模块，可在「模块库」或左栏重新添加');}
function addModule(id){if(L.mods.some(m=>m.id===id))return jumpTo(id);const m=MODULES[id];const gi=GROUPS.findIndex(g=>g.id===m.group);let idx=L.mods.length;for(let i=0;i<L.mods.length;i++){if(GROUPS.findIndex(g=>g.id===MODULES[L.mods[i].id].group)>gi){idx=i;break;}}L.mods.splice(idx,0,{id,span:m.span,collapsed:false});L.preset='custom';saveL();renderAll();closeDrawer();setTimeout(()=>jumpTo(id),50);}

/* ================= 联动 / 跳转 ================= */
function jumpTo(id,quiet){if(!id)return;if(id==='conflicts')return jumpConflict();if(!L.mods.some(m=>m.id===id)){if(MODULES[id]){addModule(id);return;}return;}
  const el=$(`#mod-${id}`);if(!el)return;const st=L.mods.find(m=>m.id===id);if(st.collapsed){st.collapsed=false;saveL();rerender(id);}
  const t=$(`#mod-${id}`);t.scrollIntoView({behavior:'smooth',block:'start'});if(!quiet){t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');}}
function jumpConflict(id){const e=$('#eng-conf');e.classList.remove('closed');const t=id?$(`#cf-${id}`):e;t.scrollIntoView({behavior:'smooth',block:'center'});if(id){t.style.outline='2px solid var(--warn)';setTimeout(()=>t.style.outline='',1500);}}
function setupSpy(){const c=$('#center');const secs=$$('.mod[data-mod]');const io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting){$$('.nv-item').forEach(n=>n.classList.toggle('on',n.dataset.nav===x.target.dataset.mod));}});},{root:c,rootMargin:'-10% 0px -70% 0px',threshold:0});secs.forEach(s=>io.observe(s));}

/* ================= 业务动作（演示） ================= */
function nbaSet(id,st){const n=C.nba.find(x=>x.id===id);n.status=st;if(st==='adopted'){C.tasks.unshift({id:'tk'+Date.now(),t:n.t,due:n.pri==='high'?'今天':'本周',src:'AI',done:false,new:true});C.feedback.adopted++;rerender('tasks');}rerender('nba');toast(st==='adopted'?'已采纳并创建任务':'已忽略');renderRail();}
function nbaIgnore(id){const r=prompt('忽略原因（用于降权同类建议）：\n1 已线下处理  2 时机不对  3 判断有误  4 其他','1');if(r===null)return;C.feedback.ignored++;nbaSet(id,'ignored');}
function nbaAct(id,a){const n=C.nba.find(x=>x.id===id);if(a==='创建任务')return nbaSet(id,'adopted');toast(`✦ ${a}：已基于「${n.t.slice(0,14)}…」生成，待审核（演示）`);if(a==='查看调仓')jumpTo('trades');}
function resolve(id,how){const c=C.conflicts.find(x=>x.id===id);c.st='done';c.res=how==='confirm'?'顾问已确认 AI 标签，进入对客流程':'顾问驳回，AI 标签降权';if(how==='reject'){C.tags.ai=C.tags.ai.filter(t=>t.cf!==id);}else{C.tags.ai.forEach(t=>{if(t.cf===id)delete t.cf;});C.tags.cdp.forEach(t=>{if(t.cf===id)delete t.cf;});}
  MODULES.tags.alert=null;renderAll();toast(how==='confirm'?'已确认：标签生效，反馈已回流':'已驳回：标签降权，反馈已回流');}
function fb(msg){C.feedback.edited++;toast('反馈已记录：'+msg);renderRail();}
function reveal(f){toast(`🔒 查看完整${f}需二次授权（短信验证），本次请求已写入审计日志`);C.audit.ops.unshift({d:'09-09 '+new Date().toTimeString().slice(0,5),t:`李慕白 请求解密 ${f}`,r:'待授权',c:'warn'});rerender('audit');}
function toggleNoteAI(i){C.notes[i].ai=!C.notes[i].ai;rerender('notes');toast(C.notes[i].ai?'该备注已允许 AI 读取':'该备注已对 AI 隐藏');}
let NS='shared';function noteScope(s){NS=s;$('#ns-shared').classList.toggle('on',s==='shared');$('#ns-private').classList.toggle('on',s==='private');}
function addNote(){const v=$('#note-in').value.trim();if(!v)return toast('请输入备注内容');C.notes.unshift({d:TODAY.slice(5),by:'李慕白',scope:NS,ai:$('#note-ai').classList.contains('on'),txt:v});rerender('notes');toast('备注已保存'+(NS==='shared'?'（团队共享）':'（仅自己）'));}

/* ================= 抽屉 ================= */
function openDrawer(kind){$('#overlay').classList.add('show');$('#drawer').classList.add('show');
  if(kind==='modules'){$('#dr-title').textContent='模块库 · 注册表';const active=new Set(L.mods.map(m=>m.id));$('#dr-body').innerHTML=`<div class="hint" style="margin-bottom:10px">共 ${Object.keys(MODULES).length} 个已注册模块 · ${active.size} 个在当前布局。模块 = 数据源 + 渲染 + 关联声明；新增只需 <span class="mono">reg({...})</span>。</div>`+GROUPS.map(g=>{const ms=Object.values(MODULES).filter(m=>m.group===g.id);return `<div class="nv-gh" style="padding-left:0">${g.lb}<span class="ln"></span></div>${ms.map(m=>`<div class="mod-opt ${m.ext?'ext':''}"><div class="ic">${m.icon}</div><div style="min-width:0"><div class="t">${m.title} ${m.ai?'<span class="tag sm violet">AI</span>':''}${m.ext?'<span class="tag sm gray">扩展位</span>':''}</div><div class="d">${m.desc||'来源：'+m.src.map(s=>SRC[s].lb).join(' · ')}</div></div><div class="a">${active.has(m.id)?`<button class="mini-btn xs" onclick="removeModule('${m.id}');openDrawer('modules')">移除</button>`:`<button class="mini-btn xs pri" onclick="addModule('${m.id}')">添加</button>`}</div></div>`).join('')}`;}).join('')+
    `<div class="mod-opt ext" style="margin-top:12px"><div class="ic">＋</div><div><div class="t">注册新模块（示意）</div><div class="d">例如「税务概览」「家族信托进度」「ESG 偏好」— 声明 id / group / src / render 即可进入模块库与左栏导航，并自动获得来源页脚、关联跳转、折叠/移动/移除、布局持久化能力。</div></div></div>`;}
  else{$('#dr-title').textContent='布局配置 · JSON';const cfg={schema:'c360-layout/v1',advisor:C.advisor,customer:C.id,preset:L.preset,modules:L.mods,sources:Object.keys(SRC),registry:Object.values(MODULES).map(m=>({id:m.id,group:m.group,ai:m.ai,src:m.src,links:m.links,ext:!!m.ext}))};
    $('#dr-body').innerHTML=`<div class="hint" style="margin-bottom:8px">布局与注册表可导出/导入，用于按角色下发默认方案、跨终端同步，或由管理端统一配置。</div><pre class="json">${esc(JSON.stringify(cfg,null,2))}</pre><div class="flex" style="margin-top:10px;gap:6px"><button class="mini-btn pri" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(JSON.stringify(cfg))});toast('已复制配置 JSON')">复制</button><button class="mini-btn" onclick="resetLayout();closeDrawer()">恢复默认</button></div>`;}}
function closeDrawer(){$('#overlay').classList.remove('show');$('#drawer').classList.remove('show');}

/* ================= Tooltip / Toast ================= */
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tt]');const tip=$('#tt');if(!t){tip.style.display='none';return;}tip.innerHTML=t.dataset.tt;tip.style.display='block';const r=t.getBoundingClientRect();let x=r.left+r.width/2-tip.offsetWidth/2,y=r.top-tip.offsetHeight-8;if(y<8)y=r.bottom+8;x=Math.max(8,Math.min(x,innerWidth-tip.offsetWidth-8));tip.style.left=x+'px';tip.style.top=y+'px';});
function toast(m){const w=$('#toast-wrap');const el=document.createElement('div');el.className='toast';el.textContent=m;w.appendChild(el);setTimeout(()=>el.remove(),2600);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

renderAll();
/* 独立打开时显示返回链接；嵌入工作台 iframe 时隐藏 */
try{if(window.self===window.top)$('#back-link').style.display='inline-flex';}catch(e){}
</script>
</body>
