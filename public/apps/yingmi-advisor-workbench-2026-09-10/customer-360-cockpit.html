<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户 360° 驾驶舱 · YINGMIWORK 顾问工作台</title>
<style>
:root{
  --bg:#070B14; --bg-2:#0B1220; --panel:#0E1626; --panel-2:#121C2F; --panel-3:#172238;
  --line:rgba(160,180,220,.10); --line-2:rgba(160,180,220,.06); --line-3:rgba(160,180,220,.18);
  --ink:#E9EFFA; --ink-2:#AAB7D0; --ink-3:#6F7D9B; --ink-4:#4A5670;
  --cyan:#38D9F5; --cyan-soft:rgba(56,217,245,.12);
  --blue:#4C9AFF; --blue-soft:rgba(76,154,255,.13);
  --gold:#F2C14E; --gold-soft:rgba(242,193,78,.13);
  --up:#2EE59D; --up-soft:rgba(46,229,157,.12);
  --down:#FF5D6C; --down-soft:rgba(255,93,108,.13);
  --warn:#FFA940; --warn-soft:rgba(255,169,64,.13);
  --violet:#A78BFA; --violet-soft:rgba(167,139,250,.14);
  --pink:#F472B6; --pink-soft:rgba(244,114,182,.13);
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 60% 40% at 20% 0%,rgba(76,154,255,.10),transparent 60%),radial-gradient(ellipse 40% 30% at 90% 10%,rgba(56,217,245,.07),transparent 60%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;outline:none}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#243049;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.sp{flex:1}
.flex{display:flex;align-items:center;gap:8px}

/* ===== 框架 ===== */
#app{display:grid;grid-template-rows:48px auto minmax(0,1fr);height:100vh}
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(8,12,22,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.02em}
#topbar .logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4C9AFF,#38D9F5);display:grid;place-items:center;font-size:11px;font-weight:900;color:#06101F}
#topbar .crumb{font-size:12px;color:var(--ink-3)}
#topbar .crumb b{color:var(--ink-2);font-weight:600}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 11px;border-radius:7px;font-size:12px;color:var(--ink-3);font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel-3);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(56,217,245,.35)}
.seg button kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);border:1px solid var(--line-3);border-radius:4px;padding:0 4px;line-height:14px}
.tb-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);background:var(--panel-2);transition:.15s;text-decoration:none;white-space:nowrap}
.tb-btn:hover{border-color:var(--line-3);color:var(--ink)}
.tb-btn kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);border:1px solid var(--line-3);border-radius:4px;padding:0 4px;line-height:14px}
.tb-sel{height:28px;border-radius:8px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);font-size:12px;padding:0 8px}
.tb-sel option{color:var(--ink);background:#0E1626}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3);font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(46,229,157,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,229,157,.55)}70%{box-shadow:0 0 0 7px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}

/* ===== Hero ===== */
#hero{background:linear-gradient(180deg,rgba(18,28,47,.9),rgba(14,22,38,.6));border-bottom:1px solid var(--line);padding:12px 18px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:start}
#hero .cav{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#06101F;background:linear-gradient(135deg,#F2C14E,#FFE9B8);position:relative;flex:none}
#hero .cav .ring{position:absolute;inset:-4px;border-radius:19px;border:1.5px solid rgba(242,193,78,.45)}
#hero .cav .st{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--down);border:2.5px solid var(--panel)}
#hero .who{min-width:0}
#hero .nm{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
#hero .meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
#hero .meta b{color:var(--ink-2);font-weight:600}
.ids{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center}
.ids .lb{font-size:10px;color:var(--ink-4);font-weight:700;letter-spacing:.06em;margin-right:2px}
.idc{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);font-family:var(--mono)}
.idc i{width:6px;height:6px;border-radius:50%;background:var(--up)}
.idc.pend i{background:var(--warn)}
.stages{display:flex;align-items:center;gap:0;margin-top:9px}
.stg{display:flex;align-items:center;gap:0;font-size:10.5px;color:var(--ink-4);font-weight:600}
.stg .dot{width:9px;height:9px;border-radius:50%;background:var(--panel-3);border:1.5px solid var(--ink-4);position:relative}
.stg.done .dot{background:var(--blue);border-color:var(--blue)}
.stg.done{color:var(--ink-3)}
.stg.cur .dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px var(--cyan-soft)}
.stg.cur{color:var(--cyan);font-weight:800}
.stg .ln{width:34px;height:1.5px;background:var(--line-3);margin:0 2px}
.stg.done .ln{background:var(--blue)}
.stg span{margin-left:5px}
.stg.risk .dot{border-color:var(--down);border-style:dashed}
.stg.risk{color:var(--down)}
#hero .kpis{display:flex;gap:0;flex:none}
.hk{padding:2px 16px 0;border-left:1px solid var(--line);min-width:118px;position:relative}
.hk:first-child{border-left:none;padding-left:0}
.hk .lb{font-size:10.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:4px}
.hk .vl{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.hk .vl small{font-size:11px;color:var(--ink-3);font-weight:600}
.hk .dl{font-size:10.5px;margin-top:1px;font-weight:600}
.hk .spark{margin-top:4px}
.ringk{display:flex;align-items:center;gap:8px}
#alerts{grid-column:1/-1;display:flex;gap:8px;padding:9px 0 10px;overflow-x:auto;border-top:1px solid var(--line-2);margin-top:8px}
.al{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 8px;border-radius:8px;font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid transparent;transition:.15s}
.al i{width:7px;height:7px;border-radius:50%;flex:none}
.al.red{background:var(--down-soft);color:#FFB3BA;border-color:rgba(255,93,108,.3)}.al.red i{background:var(--down)}
.al.gold{background:var(--gold-soft);color:#FFE3A1;border-color:rgba(242,193,78,.3)}.al.gold i{background:var(--gold)}
.al.violet{background:var(--violet-soft);color:#D6C8FF;border-color:rgba(167,139,250,.3)}.al.violet i{background:var(--violet)}
.al.cyan{background:var(--cyan-soft);color:#B7F0FA;border-color:rgba(56,217,245,.3)}.al.cyan i{background:var(--cyan)}
.al:hover{filter:brightness(1.15)}
.al .k{opacity:.7;font-weight:500}

/* ===== 三栏 ===== */
#body{display:grid;grid-template-columns:224px minmax(0,1fr) 340px;min-height:0}
#nav{background:rgba(11,18,32,.7);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 20px}
#center{overflow-y:auto;padding:14px 18px 60px;scroll-behavior:smooth;position:relative;min-width:0}
#rail{background:rgba(11,18,32,.7);border-left:1px solid var(--line);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1400px){#body{grid-template-columns:200px minmax(0,1fr) 304px}}
@media (max-width:1180px){#body{grid-template-columns:0 minmax(0,1fr) 0}#nav,#rail{display:none}}

/* 左导航：七层 */
.nv-h{font-size:10px;color:var(--ink-4);font-weight:800;letter-spacing:.1em;padding:6px 8px 6px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.nv-h .ln{flex:1;height:1px;background:var(--line)}
.layer{margin-bottom:4px;border-radius:10px;border:1px solid transparent;transition:.15s}
.layer.on{background:var(--panel-2);border-color:var(--line)}
.layer-h{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer}
.layer-h:hover{background:var(--panel-2)}
.layer-h .n{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;font-family:var(--mono);color:#06101F}
.layer-h .t{font-size:12px;font-weight:700;color:var(--ink-2)}
.layer-h .q{font-size:10.5px;color:var(--ink-4);margin-left:auto;font-family:var(--mono)}
.layer-h .bar{position:absolute}
.layer .cmp{height:2px;background:var(--line);margin:0 9px 4px;border-radius:2px;overflow:hidden}
.layer .cmp i{display:block;height:100%;border-radius:2px}
.layer .subs{display:none;padding:0 6px 6px}
.layer.on .subs{display:block}
.sub{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 22px;border-radius:7px;font-size:11.5px;color:var(--ink-3);cursor:pointer}
.sub:hover{background:var(--panel-3);color:var(--ink)}
.sub .bd{margin-left:auto;font-size:9.5px;font-weight:800;min-width:15px;height:15px;padding:0 4px;border-radius:7px;display:grid;place-items:center;background:var(--panel-3);color:var(--ink-3)}
.sub .bd.red{background:var(--down);color:#fff}.sub .bd.gold{background:var(--gold);color:#06101F}.sub .bd.violet{background:var(--violet);color:#06101F}
.nv-legend{margin:10px 6px 0;padding:10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.nv-legend .t{font-size:10px;font-weight:800;color:var(--ink-4);letter-spacing:.08em;margin-bottom:6px}
.lg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);padding:2px 0}
.lg i{width:7px;height:7px;border-radius:50%}
.lg .f{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.nv-mini{margin:10px 6px 0;padding:8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.nv-mini:hover{border-color:var(--line-3)}
.nv-mini .t{font-size:10px;font-weight:800;color:var(--ink-4);letter-spacing:.08em;margin-bottom:4px;display:flex}
.nv-mini .t span{margin-left:auto;color:var(--cyan)}

/* 中心：模块 */
.view{display:none}.view.on{display:block}
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
.grp-h .n{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;font-family:var(--mono);color:#06101F}
.grp-h h2{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.02em}
.grp-h .ds{font-size:11px;color:var(--ink-3)}
.grp-h .ln{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:start}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0;transition:border-color .2s,box-shadow .2s;position:relative;grid-column:span 3}
.mod.s2{grid-column:span 2}.mod.s4{grid-column:span 4}.mod.s6{grid-column:span 6}
.mod:hover{border-color:var(--line-3)}
.mod.flash{animation:flash 1.8s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(56,217,245,0)}15%{box-shadow:0 0 0 3px rgba(56,217,245,.7),0 0 30px rgba(56,217,245,.35);border-color:var(--cyan)}100%{box-shadow:none}}
.mod-h{display:flex;align-items:center;gap:7px;padding:10px 13px 8px}
.mod-h h3{font-size:12.5px;font-weight:700;white-space:nowrap}
.mod-h .ai{font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--violet-soft);color:var(--violet);letter-spacing:.06em;border:1px solid rgba(167,139,250,.3)}
.mod-h .srcs{display:flex;gap:3px;margin-left:2px}
.sd{width:6px;height:6px;border-radius:50%;display:inline-block;cursor:help}
.mod-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.mod-h .fresh{font-size:10px;color:var(--ink-4);font-family:var(--mono)}
.mod-h .tools button{height:20px;padding:0 6px;border-radius:5px;font-size:10.5px;color:var(--ink-3);border:1px solid transparent}
.mod-h .tools button:hover{border-color:var(--line-3);color:var(--ink)}
.mod-b{padding:4px 13px 12px}
.mod-f{padding:6px 13px;border-top:1px solid var(--line-2);font-size:10px;color:var(--ink-4);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mod-f .lk{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--cyan);color:var(--cyan)}
.chip.ev{color:var(--cyan);border-color:rgba(56,217,245,.3);background:var(--cyan-soft)}

/* 通用 */
.tag{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.tag.blue{background:var(--blue-soft);color:#9CC4FF}.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.green{background:var(--up-soft);color:var(--up)}.tag.red{background:var(--down-soft);color:#FF8A95}
.tag.gray{background:var(--panel-3);color:var(--ink-3)}.tag.violet{background:var(--violet-soft);color:var(--violet)}
.tag.cyan{background:var(--cyan-soft);color:var(--cyan)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.pink{background:var(--pink-soft);color:var(--pink)}
.tag.outline{background:transparent;border-color:var(--line-3);color:var(--ink-2)}
.tag.sm{height:16px;font-size:9.5px;padding:0 5px}
.btn{height:25px;padding:0 10px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-3);background:var(--panel-2);color:var(--ink-2);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#06101F}.btn.pri:hover{filter:brightness(1.1);color:#06101F}
.btn.xs{height:21px;padding:0 7px;font-size:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);flex:none}.kv .v{font-weight:600;text-align:right}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;color:var(--ink-3);font-weight:600;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl .r{text-align:right}
.wbar{height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden;min-width:50px}
.wbar i{display:block;height:100%;border-radius:2px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px}
.stat3 .s{padding:8px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.stat3 .s .k{font-size:10px;color:var(--ink-3);font-weight:600}
.stat3 .s .v{font-size:16px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.stat3 .s .d{font-size:10px;margin-top:1px}
.ct{font-size:10px;color:var(--ink-4);margin-top:4px;font-family:var(--mono)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.tabs{display:inline-flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{height:20px;padding:0 8px;border-radius:5px;font-size:10.5px;color:var(--ink-3);font-weight:600}
.tabs button.on{background:var(--panel-3);color:var(--cyan)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;transition:.13s}
.li:hover{border-color:var(--line-3)}
.li .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;flex:none;font-weight:800}
.li .t{font-size:11.5px;font-weight:600;line-height:1.4}
.li .d{font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.li .rt{margin-left:auto;text-align:right;flex:none;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.goal{padding:8px 0;border-bottom:1px dashed var(--line-2)}
.goal:last-child{border-bottom:none}
.goal .h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600}
.goal .h .r{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.goal .bar{height:6px;border-radius:3px;background:var(--panel-3);margin-top:6px;position:relative;overflow:visible}
.goal .bar i{display:block;height:100%;border-radius:3px}
.goal .bar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--gold)}
.goal .m{display:flex;gap:10px;font-size:10px;color:var(--ink-3);margin-top:4px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.heat i{height:13px;border-radius:2px;background:var(--panel-3);display:block;cursor:help}
.heat-l{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-4);margin-top:4px;font-family:var(--mono)}
.tagcloud{display:flex;flex-direction:column;gap:7px}
.tagrow{display:flex;gap:6px;align-items:flex-start}
.tagrow .src{width:64px;flex:none;font-size:10px;font-weight:700;color:var(--ink-3);padding-top:3px;display:flex;align-items:center;gap:4px}
.tagrow .tags{display:flex;flex-wrap:wrap;gap:4px}
.tagrow .tag{cursor:pointer}
.tagrow .tag:hover{filter:brightness(1.2)}
.bullet{margin:7px 0}
.bullet .h{display:flex;font-size:11.5px;font-weight:600;gap:6px;align-items:center}
.bullet .h .r{margin-left:auto;font-family:var(--mono);font-size:10.5px}
.bullet .tr{height:10px;border-radius:5px;background:var(--panel-3);position:relative;margin-top:5px}

const svgLine=(vals,w,h,c,opt={})=>{
  const mn=opt.min??Math.min(...vals),mx=opt.max??Math.max(...vals),r=mx-mn||1,pad=opt.pad??2;
  const pts=vals.map((v,i)=>[pad+i*(w-pad*2)/(vals.length-1),h-pad-(v-mn)/r*(h-pad*2)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const id='g'+Math.random().toString(36).slice(2,8);
  const last=pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>${opt.area!==false?`<path d="${d} L${last[0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z" fill="url(#${id})"/>`:''}<path d="${d}" fill="none" stroke="${c}" stroke-width="${opt.sw??1.6}" stroke-linejoin="round"/>${opt.dot!==false?`<circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${c}"/>`:''}</svg>`;
};
const svgArea=(vals,labels,w,h,c,opt={})=>{
  const padL=opt.padL??34,padR=8,padT=10,padB=18;
  const mn=opt.min??Math.min(...vals)*0.97,mx=opt.max??Math.max(...vals)*1.02,r=mx-mn||1;
  const X=i=>padL+i*(w-padL-padR)/(vals.length-1),Y=v=>padT+(1-(v-mn)/r)*(h-padT-padB);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const id='a'+Math.random().toString(36).slice(2,8);
  const ticks=[mn,(mn+mx)/2,mx];
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".4"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>`;
  ticks.forEach(t=>{s+=`<line x1="${padL}" x2="${w-padR}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(160,180,220,.08)"/><text x="${padL-5}" y="${Y(t)+3}" font-size="9" fill="#6F7D9B" text-anchor="end" font-family="SF Mono,Menlo,monospace">${opt.fmt?opt.fmt(t):Math.round(t)}</text>`});
  if(opt.bench){const bp=opt.bench.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');s+=`<path d="${bp}" fill="none" stroke="#6F7D9B" stroke-width="1.2" stroke-dasharray="3 3"/>`}
  s+=`<path d="${d} L${pts[pts.length-1][0]},${h-padB} L${pts[0][0]},${h-padB} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.5:2}" fill="${i===pts.length-1?c:'#0E1626'}" stroke="${c}" stroke-width="1.2"/><circle cx="${p[0]}" cy="${p[1]}" r="9" fill="transparent" data-tt="${labels[i]} · ${opt.fmt?opt.fmt(vals[i]):vals[i]}${opt.bench?'<br>基准 '+(opt.fmt?opt.fmt(opt.bench[i]):opt.bench[i]):''}"/>`;if(i%2===0||i===vals.length-1)s+=`<text x="${p[0]}" y="${h-5}" font-size="9" fill="#6F7D9B" text-anchor="middle">${labels[i]}</text>`});
  if(opt.marks)opt.marks.forEach(m=>{s+=`<line x1="${X(m.i)}" x2="${X(m.i)}" y1="${padT}" y2="${h-padB}" stroke="${m.c}" stroke-dasharray="2 3"/><text x="${X(m.i)+3}" y="${padT+8}" font-size="9" fill="${m.c}">${m.t}</text>`});
  return s+'</svg>';
};
const svgBars=(pos,neg,labels,w,h,cp,cn)=>{
  const padL=30,padR=6,padT=8,padB=18,n=pos.length,bw=(w-padL-padR)/n;
  const mx=Math.max(...pos,...neg,1),zero=padT+(h-padT-padB)*mx/(mx+Math.max(...neg,1)*0+mx*0.35);
  const scale=(zero-padT)/mx;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><line x1="${padL}" x2="${w-padR}" y1="${zero}" y2="${zero}" stroke="rgba(160,180,220,.2)"/>`;
  s+=`<text x="${padL-4}" y="${padT+6}" font-size="9" fill="#6F7D9B" text-anchor="end">${mx}</text><text x="${padL-4}" y="${zero+3}" font-size="9" fill="#6F7D9B" text-anchor="end">0</text>`;
  for(let i=0;i<n;i++){const x=padL+i*bw+bw*.22,wd=bw*.56;
    if(pos[i])s+=`<rect x="${x}" y="${zero-pos[i]*scale}" width="${wd}" height="${pos[i]*scale}" rx="2" fill="${cp}" data-tt="${labels[i]} 流入 +${pos[i]} 万"/>`;
    if(neg[i])s+=`<rect x="${x}" y="${zero}" width="${wd}" height="${Math.min(neg[i]*scale,h-padB-zero)}" rx="2" fill="${cn}" data-tt="${labels[i]} 流出 -${neg[i]} 万"/>`;
    if(i%2===0)s+=`<text x="${x+wd/2}" y="${h-5}" font-size="9" fill="#6F7D9B" text-anchor="middle">${labels[i]}</text>`}
  return s+'</svg>';
};
const svgDonut=(segs,size,thick,center)=>{
  const r=size/2-thick/2,cx=size/2,cy=size/2,tot=segs.reduce((a,b)=>a+b.v,0);let off=0,s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">`;
  segs.forEach(g=>{const f=g.v/tot,a0=off*2*Math.PI-Math.PI/2,a1=(off+f)*2*Math.PI-Math.PI/2;off+=f;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path d="M${x0},${y0} A${r},${r} 0 ${f>.5?1:0} 1 ${x1},${y1}" fill="none" stroke="${g.c}" stroke-width="${thick}" data-tt="${g.k} · ${(f*100).toFixed(1)}%${g.d?' · '+g.d:''}" style="cursor:help"/>`});
  if(center)s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${size/6}" font-weight="800" fill="#E9EFFA">${center[0]}</text><text x="${cx}" y="${cy+size/8}" text-anchor="middle" font-size="${size/11}" fill="#6F7D9B">${center[1]}</text>`;
  return s+'</svg>';
};
const svgRing=(v,size,c,lb)=>{
  const r=size/2-4,circ=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(160,180,220,.12)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${circ*v/100} ${circ}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size/3.2}" font-weight="800" fill="#E9EFFA">${lb??v}</text></svg>`;
};
const svgRadar=(items,size)=>{
  const cx=size/2,cy=size/2,R=size/2-30,n=items.length,ang=i=>i*2*Math.PI/n-Math.PI/2;
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  [.25,.5,.75,1].forEach(k=>{s+=`<polygon points="${items.map((_,i)=>(cx+R*k*Math.cos(ang(i))).toFixed(1)+','+(cy+R*k*Math.sin(ang(i))).toFixed(1)).join(' ')}" fill="none" stroke="rgba(160,180,220,.12)"/>`});
  items.forEach((it,i)=>{s+=`<line x1="${cx}" y1="${cy}" x2="${cx+R*Math.cos(ang(i))}" y2="${cy+R*Math.sin(ang(i))}" stroke="rgba(160,180,220,.1)"/>`;
    const lx=cx+(R+16)*Math.cos(ang(i)),ly=cy+(R+16)*Math.sin(ang(i));s+=`<text x="${lx}" y="${ly+3}" font-size="9.5" fill="#AAB7D0" text-anchor="middle">${it[0]}</text><text x="${lx}" y="${ly+14}" font-size="9" fill="${it[1]<65?'#FF5D6C':'#6F7D9B'}" text-anchor="middle" font-weight="700">${it[1]}</text>`});
  const poly=items.map((it,i)=>(cx+R*it[1]/100*Math.cos(ang(i))).toFixed(1)+','+(cy+R*it[1]/100*Math.sin(ang(i))).toFixed(1)).join(' ');
  s+=`<polygon points="${poly}" fill="rgba(56,217,245,.18)" stroke="#38D9F5" stroke-width="1.8"/>`;
  items.forEach((it,i)=>{s+=`<circle cx="${cx+R*it[1]/100*Math.cos(ang(i))}" cy="${cy+R*it[1]/100*Math.sin(ang(i))}" r="3" fill="${it[1]<65?'#FF5D6C':'#38D9F5'}"/>`});
  return s+'</svg>';
};
const svgGauge=(tolIdx,holdIdx,w)=>{
  // 5 档 C1-C5 / R1-R5 半环，展示承受能力与持仓风险位置
  const h=w*.56,cx=w/2,cy=h-8,R=w/2-14;
  const pos=k=>{const a=Math.PI-(k-.5)/5*Math.PI;return [cx+R*Math.cos(a),cy-R*Math.sin(a)]};
  const cols=['#2EE59D','#38D9F5','#4C9AFF','#F2C14E','#FF5D6C'];
  let s=`<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;height:${h}px">`;
  for(let i=0;i<5;i++){const a0=Math.PI-i/5*Math.PI,a1=Math.PI-(i+1)/5*Math.PI+.03;
    s+=`<path d="M${cx+R*Math.cos(a0)},${cy-R*Math.sin(a0)} A${R},${R} 0 0 1 ${cx+R*Math.cos(a1)},${cy-R*Math.sin(a1)}" fill="none" stroke="${cols[i]}" stroke-opacity=".35" stroke-width="12"/>`;
    const [lx,ly]=pos(i+1);s+=`<text x="${lx}" y="${ly-14}" font-size="9" fill="#6F7D9B" text-anchor="middle">C${i+1}/R${i+1}</text>`}
  const [tx,ty]=pos(tolIdx),[hx,hy]=pos(holdIdx);
  s+=`<line x1="${cx}" y1="${cy}" x2="${tx}" y2="${ty}" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round"/><circle cx="${tx}" cy="${ty}" r="5" fill="#F2C14E" data-tt="风险承受能力 C${tolIdx} · 测评 2026-03"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#38D9F5" stroke-width="2.2" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="5" fill="#38D9F5" data-tt="持仓综合风险 R${holdIdx} · T-1"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#E9EFFA"/></svg>`;
  return s;
};

function renderTimeline(){
  const W=Math.max(760,($('#center').clientWidth||1100)-38),laneH=58,padL=96,padR=24,padT=30,H=padT+LANES.length*laneH+30;
  const from=daysAgo(STATE.range),span=TODAY-from;
  const X=d=>padL+(d-from)/span*(W-padL-padR);
  const evs=EV.filter(e=>STATE.lanes.has(e.lane)&&e.d>=from);
  let s=`<svg id="tl-svg" viewBox="0 0 ${W} ${H}" style="height:${H}px">`;
  // 月份网格
  const m0=new Date(from.getFullYear(),from.getMonth()+1,1);
  for(let d=new Date(m0);d<=TODAY;d.setMonth(d.getMonth()+1)){const x=X(d);s+=`<line x1="${x}" x2="${x}" y1="${padT-8}" y2="${H-24}" stroke="rgba(160,180,220,.08)"/>${X(TODAY)-x>44?`<text x="${x+3}" y="${padT-12}" font-size="9.5" fill="#6F7D9B" font-family="SF Mono,Menlo,monospace">${d.getFullYear()!==TODAY.getFullYear()?d.getFullYear()+'.':''}${d.getMonth()+1}月</text>`:''}`}
  // 泳道
  LANES.forEach((l,i)=>{const y=padT+i*laneH;s+=`<rect x="${padL}" y="${y}" width="${W-padL-padR}" height="${laneH}" fill="${i%2?'rgba(160,180,220,.025)':'transparent'}"/><text x="${padL-10}" y="${y+laneH/2+4}" font-size="11" font-weight="700" fill="${STATE.lanes.has(l.id)?l.c:'#4A5670'}" text-anchor="end">${l.t}</text><line x1="${padL}" x2="${W-padR}" y1="${y+laneH/2}" y2="${y+laneH/2}" stroke="${l.c}" stroke-opacity=".18"/>`});
  // 关键旅程标注
  [[89,'规划 V5 解读'],[290,'年终奖追加'],[14,'焦虑窗口开始']].forEach(([da,t])=>{if(da>STATE.range)return;const x=X(daysAgo(da));s+=`<line x1="${x}" x2="${x}" y1="${padT-4}" y2="${H-24}" stroke="#F2C14E" stroke-opacity=".5" stroke-dasharray="3 3"/><text x="${x}" y="${H-10}" font-size="9.5" fill="#F2C14E" text-anchor="middle">${t}</text>`});
  // 今日线
  s+=`<line x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${padT-4}" y2="${H-24}" stroke="#38D9F5" stroke-width="1.5"/><text x="${X(TODAY)-4}" y="${padT-12}" font-size="9.5" fill="#38D9F5" text-anchor="end" font-weight="700">今天</text>`;
  // 事件（时间接近的做轻微垂直抖动）
  const byLane={};evs.forEach((e,i)=>{e.i=EV.indexOf(e);(byLane[e.lane]=byLane[e.lane]||[]).push(e)});
  Object.values(byLane).forEach(arr=>{arr.sort((a,b)=>a.d-b.d);arr.forEach((e,i)=>{e.jit=0;if(i>0&&Math.abs(X(e.d)-X(arr[i-1].d))<14)e.jit=(arr[i-1].jit===0?-14:arr[i-1].jit===-14?14:0)})});
  evs.forEach(e=>{const li=LANES.findIndex(l=>l.id===e.lane),l=LANES[li],x=X(e.d),y=padT+li*laneH+laneH/2+(e.jit||0),r=4+e.imp*1.6;
    const sel=STATE.selEv===e.i;const dim=STATE.selEv!==null&&!sel&&STATE.selMod&&e.mod!==STATE.selMod;
    let shape=e.shape==='d'?`<path d="M${x},${y-r} L${x+r},${y} L${x},${y+r} L${x-r},${y} Z" fill="${l.c}" fill-opacity=".9"/>`:e.shape==='s'?`<rect x="${x-r*.85}" y="${y-r*.85}" width="${r*1.7}" height="${r*1.7}" rx="2" fill="${l.c}" fill-opacity=".9"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="${l.c}" fill-opacity="${e.imp>=3?.95:.7}"/>`;
    if(e.imp>=3)shape+=`<circle cx="${x}" cy="${y}" r="${r+4}" fill="none" stroke="${l.c}" stroke-opacity=".35"/>`;
    s+=`<g class="tl-ev ${sel?'sel':''} ${dim?'dim':''}" onclick="selEv(${e.i})" data-tt="<b>${esc(e.t)}</b><br>${esc(e.ds)}<br><span style='color:#6F7D9B'>${fmtD(e.d)} · ${l.t}</span>">${shape}</g>`});
  s+='</svg>';
  const cnt=id=>EV.filter(e=>e.lane===id&&e.d>=from).length;
  $('#v-timeline').innerHTML=`<div id="tl-wrap"><div class="tl-ctl">${LANES.map(l=>`<span class="lane-chip ${STATE.lanes.has(l.id)?'':'off'}" onclick="toggleLane('${l.id}')"><i style="background:${l.c}"></i>${l.t}<span class="c">${cnt(l.id)}</span></span>`).join('')}<span class="sp"></span><div class="tabs">${[[90,'3 月'],[180,'6 月'],[365,'1 年']].map(([r,t])=>`<button class="${STATE.range===r?'on':''}" onclick="STATE.range=${r};renderTimeline()">${t}</button>`).join('')}</div><button class="btn xs" onclick="STATE.selEv=null;STATE.selMod=null;renderTimeline()">清除选中</button></div>${s}
  <div class="tl-foot"><span>形状：<b>●</b> 事实事件 <b>◆</b> 洞察/关键时刻 <b>■</b> 系统/合规</span><span>大小 = 重要度</span><span>金色虚线 = 关键旅程节点</span><span class="sp"></span><span>点击事件 → 右栏显示详情与关联模块；再点「查看模块」跳转全景</span></div></div>
  <div class="grp" style="margin-top:14px"><div class="grp-h"><h2>时间轴上的三条主链</h2><span class="ln"></span></div><div class="grid">
    <section class="mod s2"><div class="mod-h"><h3>事实链 · 钱的来龙去脉</h3></div><div class="mod-b detail">年终奖追加 +180 万（去年 11 月）→ 稳稳的幸福 → 8/20 赎回 -20 万转活钱 → 9/12 调仓信号待确认。<br><span class="muted">协议 → 账户 → 持仓 → 交易 → 资金 → 费用，每一笔可回溯。</span></div></section>
    <section class="mod s2"><div class="mod-h"><h3>意图链 · 方案 vs 实际</h3></div><div class="mod-b detail">6 月 V5 规划 → 7 月教育金第 2 期 +40 万 → 权益上涨长钱漂移至 47% → 8 月赎回稳钱 → 偏离 7.1pp 触发再平衡建议。<br><span class="muted">偏离处就是洞察产生的地方。</span></div></section>
    <section class="mod s2"><div class="mod-h"><h3>触点链 · 人怎么被服务</h3></div><div class="mod-b detail">直播 8 邀 0 参与 → 推文低打开 → 企微/电话高响应 → 「一对一偏好」标签 → 9/3 企微焦虑 → 建议改电话触达。<br><span class="muted">行为 + 沟通 + 交易 → 标签 → 画像 → 旅程。</span></div></section>
  </div></div>`;
}

function renderGraph(){
  const W=Math.max(760,($('#center').clientWidth||1100)-38),H=640,cx=W/2,cy=H/2+10,R1=Math.min(140,W*.13),R2=Math.min(292,W*.27);
  const pos={c:[cx,cy]};
  LAYERS.forEach((l,i)=>{const a=i/7*2*Math.PI-Math.PI/2;pos[l.id]=[cx+R1*Math.cos(a),cy+R1*Math.sin(a),a]});
  LAYERS.forEach((l,i)=>{const kids=GN.filter(n=>n.l===l.id);const a0=pos[l.id][2],spread=Math.min(.8,kids.length*.17);kids.forEach((k,j)=>{const a=a0+(j-(kids.length-1)/2)*(spread/Math.max(1,kids.length-1)*2||0);pos[k.id]=[cx+R2*Math.cos(a),cy+R2*Math.sin(a),a]})});
  const sel=STATE.grSel,chain=STATE.chain;
  const conn=new Set();if(sel){GE.forEach(e=>{if(e.s===sel)conn.add(e.t);if(e.t===sel)conn.add(e.s)});conn.add(sel)}
  let s=`<svg id="gr-svg" viewBox="0 0 ${W} ${H}" style="height:${H}px">`;
  [R1,R2].forEach(r=>{s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(160,180,220,.07)" stroke-dasharray="2 4"/>`});
  GE.forEach(e=>{const a=pos[e.s],b=pos[e.t];if(!a||!b)return;const k=CHAINS[e.k];const isSt=e.k==='st';
    let cls='ge';if(chain&&e.k!==chain&&!isSt)cls+=' dim';if(chain&&e.k===chain)cls+=' hi';if(sel&&!(e.s===sel||e.t===sel))cls+=' dim';if(sel&&(e.s===sel||e.t===sel))cls+=' hi';
    const mx=(a[0]+b[0])/2+(isSt?0:(b[1]-a[1])*.18),my=(a[1]+b[1])/2-(isSt?0:(b[0]-a[0])*.18);
    s+=`<path class="${cls}" d="M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}" fill="none" stroke="${k.c}" stroke-width="${isSt?1:1.4}" stroke-opacity="${isSt?1:.75}" ${isSt?'':'stroke-dasharray="5 3"'}/>`});
  GN.forEach(n=>{const p=pos[n.id];if(!p)return;const dim=sel&&!conn.has(n.id);
    if(n.ty==='center'){s+=`<g class="gn" onclick="grSel(null)"><circle cx="${p[0]}" cy="${p[1]}" r="34" fill="#F2C14E" fill-opacity=".15"/><circle cx="${p[0]}" cy="${p[1]}" r="24" fill="#F2C14E"/><text x="${p[0]}" y="${p[1]+6}" font-size="17" font-weight="800" fill="#06101F" text-anchor="middle">陈</text><text x="${p[0]}" y="${p[1]+46}" font-size="11" font-weight="700" fill="#E9EFFA" text-anchor="middle">${n.t}</text></g>`;return}
    if(n.ty==='layer'){s+=`<g class="gn ${dim?'dim':''}" onclick="grSel('${n.id}')"><circle cx="${p[0]}" cy="${p[1]}" r="17" fill="${n.c}" fill-opacity="${sel===n.id?1:.9}" stroke="${sel===n.id?'#fff':'none'}" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4}" font-size="11" font-weight="800" fill="#06101F" text-anchor="middle" font-family="SF Mono,Menlo,monospace">${LAYERS.find(l=>l.id===n.id).n}</text><text x="${p[0]}" y="${p[1]+31}" font-size="10.5" font-weight="700" fill="${n.c}" text-anchor="middle">${n.t}</text></g>`;return}
    const l=LAYERS.find(x=>x.id===n.l),ang=p[2],out=Math.cos(ang)>=0,ty=p[1]+3;
    s+=`<g class="gn ${dim?'dim':''}" onclick="grSel('${n.id}')" data-tt="<b>${esc(n.t)}</b><br>${esc(n.ds)}"><circle cx="${p[0]}" cy="${p[1]}" r="${sel===n.id?9:6.5}" fill="#0E1626" stroke="${l.c}" stroke-width="2"/><text x="${p[0]+(out?12:-12)}" y="${ty}" font-size="10.5" fill="${sel===n.id?'#fff':'#AAB7D0'}" font-weight="${sel===n.id?700:500}" text-anchor="${out?'start':'end'}">${n.t}</text></g>`});
  s+='</svg>';
  const n=sel?GN.find(x=>x.id===sel):null;
  const rel=n?GE.filter(e=>e.s===sel||e.t===sel).map(e=>{const o=GN.find(x=>x.id===(e.s===sel?e.t:e.s));return `<span class="chip" style="border-color:${CHAINS[e.k].c};color:${CHAINS[e.k].c}" onclick="grSel('${o.id}')">${e.s===sel?'→':'←'} ${o.t}</span>`}).join(''):'';
  $('#v-graph').innerHTML=`<div id="gr-wrap">
    <div class="gr-ctl">${Object.entries(CHAINS).filter(([k])=>k!=='st').map(([k,v])=>`<span class="lane-chip ${chain&&chain!==k?'off':''}" style="${chain===k?'border-color:'+v.c+';color:'+v.c:''}" onclick="STATE.chain=STATE.chain==='${k}'?null:'${k}';renderGraph()"><i style="background:${v.c}"></i>${v.t}</span>`).join('')}</div>
    <div class="gr-info">${n?`<h4>${n.ty==='layer'?`<span class="tag sm" style="background:${n.c};color:#06101F">${LAYERS.find(l=>l.id===n.id).n}</span>`:''}${n.t}</h4><div class="d">${n.ds}</div><div class="rel">${rel}</div>${n.mod?`<div style="margin-top:8px"><button class="btn xs pri" onclick="jump('${n.mod}')">查看模块 →</button></div>`:''}`:`<h4>客户关系图谱</h4><div class="d">中心 = 客户（合并 ID）；内环 = 七层；外环 = 具体对象。实线为结构归属，虚线为四条业务链。点击节点高亮其关联；点击上方链名只看该链。</div>`}</div>
    ${s}
    <div class="gr-legend"><span><i style="background:rgba(160,180,220,.4)"></i>结构归属</span>${Object.entries(CHAINS).filter(([k])=>k!=='st').map(([k,v])=>`<span><i style="background:${v.c}"></i>${v.t}</span>`).join('')}</div>
  </div>
  <div class="grp" style="margin-top:14px"><div class="grp-h"><h2>三个技术锚点</h2><span class="ln"></span></div><div class="grid">
    <section class="mod s2"><div class="mod-h"><h3>客户 ID（合并后）</h3></div><div class="mod-b detail">App / 企微 / 蜂鸟 / 保险 4 侧已对齐，机构侧无。所有对象挂在同一个合并 ID 上，家庭与转介绍是「客户-客户」边。</div></section>
    <section class="mod s2"><div class="mod-h"><h3>时间戳</h3></div><div class="mod-b detail">交易、沟通、行为、AI、系统 5 类事件进同一条时间轴（见「时间轴」视图），洞察与关键时刻作为标记叠在轴上。</div></section>

  </div></div>`;
}

    <section class="mod s6"><div class="mod-h"><h3>再平衡建议 · 结合 Q4 300 万承接</h3><span class="ai">AI</span><span class="srcs">${srcDots(['ai','plan','pms'])}</span></div><div class="mod-b">
      <table class="tbl"><thead><tr><th>笔</th><th class="r">当前</th><th class="r">目标</th><th class="r">偏离</th><th>动作</th><th class="r">金额</th><th>说明</th></tr></thead><tbody>
      ${[['稳钱','31.8%','37%','-5.2pp','新增承接 → 稳稳的幸福 / 短债','+230 万','300 万回笼优先补稳钱，不动存量长钱，避免在回撤中卖出'],['长钱','47.1%','40%','+7.1pp','Q3 调仓自然降权益 + 不再追加','0','调仓信号 55%→50% 已可修正约 2.5pp；剩余靴子随新增资金摊薄'],['保障','13.6%','15%','-1.4pp','增额寿加保（太太意向）','+50 万','保险顾问张晴协同；不计入投顾费'],['活钱','7.5%','8%','-0.5pp','恢复工资自动转入','+20 万','已停 6 个月；企业备用金底线 80 万']].map(r=>`<tr><td style="font-weight:700">${r[0]}</td><td class="r num">${r[1]}</td><td class="r num">${r[2]}</td><td class="r num ${r[3].startsWith('-')?'down':r[3]==='0'?'muted':'warn'}">${r[3]}</td><td>${r[4]}</td><td class="r num" style="font-weight:700">${r[5]}</td><td class="muted" style="font-size:10.5px">${r[6]}</td></tr>`).join('')}
      </tbody></table>
      <div class="flex" style="margin-top:10px"><span class="muted" style="font-size:10.5px">承接后预计：8.0 / 36.9 / 41.2 / 13.9 · 整体偏离 1.2pp · 适当性仍为 C4/R3 匹配</span><span class="sp"></span><button class="btn" onclick="toast('已生成方案草稿 → 待合规审核（演示）')">生成承接方案</button><button class="btn pri" onclick="toast('已创建任务：300 万承接方案初稿 · 10/10')">创建任务</button></div>
    </div></section>
  </div></div>`;
  mountCharts();
}

/* ---------- 右栏 ---------- */
function renderRail(){
  $('#rail').innerHTML=`
  <div class="rc" id="r-brief"><div class="rc-h"><h3>AI 客户摘要</h3><span class="ai">AI</span><span class="rt">10:48 · 置信 0.82</span></div><div class="rc-b">
    <div class="brief">${C.brief.replace(/\{ev:([\w-]+):([^}]+)\}/g,(_,id,t)=>`<span class="ev" onclick="jump('${id}')">${t}</span>`)}</div>
    <div class="states"><div class="stt" onclick="jump('m-behavior')"><div class="k">流失风险</div><div class="v down">高 · 0.71</div></div><div class="stt" onclick="jump('m-cashflow')"><div class="k">追加机会</div><div class="v" style="color:var(--gold)">中高 · 0.58</div></div><div class="stt" onclick="jump('m-service')"><div class="k">服务健康</div><div class="v">72 / 100</div></div></div>
    <div class="flex" style="margin-top:9px"><button class="btn xs" onclick="toast('摘要已标记为准确，反馈已回流')">✓ 准确</button><button class="btn xs" onclick="toast('已提交修正意见（演示）')">✎ 修正</button><span class="sp"></span><span class="muted" style="font-size:10px">c360-insight v2.3</span></div>
  </div></div>
  <div class="rc" id="r-nba"><div class="rc-h"><h3>跟进建议 · Next Best Action</h3><span class="ai">AI</span><span class="rt">${C.nba.length} 条</span></div><div class="rc-b">
    ${C.nba.map(n=>`<div class="nba ${n.pri} ${STATE.nbaDone.has(n.id)?'done':''}"><div class="t">${n.t}<span class="cf">${Math.round(n.conf*100)}%</span></div><div class="w">${n.why}</div><div class="evs">${n.ev.map(e=>`<span class="chip ev" onclick="jump('${e[0]}')">${e[1]}</span>`).join('')}</div><div class="acts">${n.acts.map(a=>`<button class="btn xs ${a.startsWith('生成')?'pri':''}" onclick="nbaAct('${n.id}','${a}')">${a}</button>`).join('')}<span class="sp"></span><button class="btn xs" onclick="STATE.nbaDone.add('${n.id}');renderRail();toast('已驳回，反馈回流训练')">驳回</button></div></div>`).join('')}
  </div></div>
  <div class="rc" id="r-rem"><div class="rc-h"><h3>关注提醒</h3><span class="rt">${C.reminders.length} 条 · 1 逾期</span></div><div class="rc-b">
    ${C.reminders.map(r=>`<div class="rem"><span class="d">${r[0]}</span><span class="p" style="background:${r[2]==='high'?'var(--down)':r[2]==='mid'?'var(--gold)':'var(--ink-4)'}"></span><span class="t">${r[1]}</span></div>`).join('')}
  </div></div>
  <div class="rc" id="r-task"><div class="rc-h"><h3>事件 → 任务</h3><span class="rt">${STATE.tasks.filter(t=>!t.done).length} 未完成</span></div><div class="rc-b">
    ${STATE.tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><div class="cb" onclick="STATE.tasks[${i}].done=!STATE.tasks[${i}].done;renderRail()">${t.done?'✓':''}</div><span class="t">${t.t}</span><span class="due">${t.due}</span></div>`).join('')}
    <div style="margin-top:8px"><button class="btn xs" onclick="toast('已从最新事件创建任务（演示）')">＋ 从事件创建</button></div>
  </div></div>
  <div class="rc" id="r-detail" style="display:none"><div class="rc-h"><h3>事件详情</h3><span class="rt" id="r-detail-t"></span></div><div class="rc-b detail" id="r-detail-b"></div></div>`;
}
function renderRailDetail(e){const l=LANES.find(x=>x.id===e.lane);const box=$('#r-detail');box.style.display='block';$('#r-detail-t').textContent=fmtD(e.d)+' · '+l.t;$('#r-detail-b').innerHTML=`<div class="h" style="color:${l.c}">${esc(e.t)}</div><div class="muted">${esc(e.ds)}</div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${e.mod?`<button class="btn xs pri" onclick="jump('${e.mod}')">查看关联模块 →</button>`:''}<button class="btn xs" onclick="toast('已从事件创建任务（演示）')">创建任务</button><button class="btn xs" onclick="toast('已加入副驾上下文')">✦ 问副驾</button></div><div class="muted" style="font-size:10.5px;margin-top:8px">同模块其他事件已在时间轴高亮，其余淡化。</div>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function nbaAct(id,a){const n=C.nba.find(x=>x.id===id);if(a.startsWith('生成'))toast(`${a}：已基于 ${n.ev.length} 条证据生成草稿 → 合规检查中（演示）`);else if(a==='创建任务'){STATE.tasks.unshift({t:n.t.split('：')[0].slice(0,18),due:'待定',done:false});renderRail();toast('任务已创建并关联证据链')}else toast(a+'（演示）')}

/* ---------- 导航 / 跳转 ---------- */
function setView(v){STATE.view=v;$$('#view-seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));if(v==='timeline')renderTimeline();if(v==='graph')renderGraph();if(v==='plan')renderPlan();mountCharts();$('#center').scrollTop=0}
function jump(id){
  if(id.startsWith('r-')){const el=$('#'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}return}
  const m=M.find(x=>x.id===id);if(!m)return;
  if(STATE.view!=='overview'&&!(STATE.view==='plan'&&$('#v-plan #'+id)))setView('overview');
  STATE.layerOpen=m.layer;renderNav();
  setTimeout(()=>{const el=$('.view.on #'+id)||$('#'+id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')},40);
}
function applyScene(k){STATE.scene=k;renderNav();renderOverview();toast('已切换：'+SCENES[k].t);if(STATE.view!=='overview')setView('overview');$('#center').scrollTop=0}

/* ---------- 命令面板 ---------- */
function cmdItems(){const a=[];M.forEach(m=>a.push({t:m.title,g:LAYERS.find(l=>l.id===m.layer).t,act:()=>jump(m.id)}));
  [['AI 摘要','r-brief'],['跟进建议','r-nba'],['关注提醒','r-rem'],['任务','r-task']].forEach(x=>a.push({t:x[0],g:'接下来做什么',act:()=>jump(x[1])}));
  C.holdings.forEach(h=>a.push({t:h.n,g:'持仓 · '+h.code,act:()=>jump('m-holdings')}));
  EV.slice(0,20).forEach(e=>a.push({t:e.t,g:'事件 · '+fmtD(e.d),act:()=>{setView('timeline');selEv(EV.indexOf(e))}}));
  Object.values(C.tags).flat().forEach(t=>a.push({t,g:'标签',act:()=>jump('m-tags')}));
  [['时间轴','timeline'],['关系图谱','graph'],['方案偏离','plan'],['全景','overview']].forEach(v=>a.push({t:'视图 · '+v[0],g:'视图',act:()=>setView(v[1])}));
  Object.entries(SCENES).forEach(([k,s])=>a.push({t:s.t,g:'场景',act:()=>{$('#scene-sel').value=k;applyScene(k)}}));
  return a}
let cmdIdx=0,cmdList=[];
function openCmd(){$('#overlay').classList.add('on');$('#cmdk').classList.add('on');const i=$('#cmd-in');i.value='';i.focus();cmdFilter('')}
function closeCmd(){$('#overlay').classList.remove('on');$('#cmdk').classList.remove('on')}
function cmdFilter(q){q=q.trim().toLowerCase();cmdList=cmdItems().filter(x=>!q||(x.t+x.g).toLowerCase().includes(q)).slice(0,14);cmdIdx=0;$('#cmd-res').innerHTML=cmdList.map((x,i)=>`<div class="cr ${i===0?'on':''}" onclick="cmdGo(${i})">${esc(x.t)}<span class="g">${esc(x.g)}</span>${i===0?'<span class="k">↵</span>':''}</div>`).join('')||'<div class="cr muted">无匹配</div>'}
function cmdGo(i){const x=cmdList[i];closeCmd();x&&x.act()}
$('#cmd-in').addEventListener('input',e=>cmdFilter(e.target.value));
$('#cmd-in').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){cmdIdx=Math.min(cmdIdx+1,cmdList.length-1)}else if(e.key==='ArrowUp'){cmdIdx=Math.max(cmdIdx-1,0)}else if(e.key==='Enter'){cmdGo(cmdIdx);return}else if(e.key==='Escape'){closeCmd();return}else return;$$('.cr').forEach((el,i)=>el.classList.toggle('on',i===cmdIdx))});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();return}if(e.key==='Escape')closeCmd();if(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;const map={'1':'overview','2':'timeline','3':'graph','4':'plan'};if(map[e.key])setView(map[e.key])});

/* ---------- 工具 ---------- */
function toast(t){const w=$('#toast-wrap'),d=document.createElement('div');d.className='toast';d.innerHTML=`<i></i>${esc(t)}`;w.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='.3s';setTimeout(()=>d.remove(),300)},2400)}
const tt=$('#tt');
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tt]');if(!el){tt.style.display='none';return}tt.innerHTML=el.dataset.tt;tt.style.display='block'});
document.addEventListener('mousemove',e=>{if(tt.style.display==='none')return;const x=Math.min(e.clientX+14,innerWidth-tt.offsetWidth-10),y=Math.min(e.clientY+14,innerHeight-tt.offsetHeight-10);tt.style.left=x+'px';tt.style.top=y+'px'});
$$('#view-seg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
const ss=$('#scene-sel');ss.innerHTML=Object.entries(SCENES).map(([k,s])=>`<option value="${k}">${s.t}</option>`).join('');ss.onchange=()=>applyScene(ss.value);

/* ---------- 启动 ---------- */
try{if(window.self!==window.top)$('#back-link').style.display='none'}catch(e){}
renderHero();renderNav();renderOverview();renderRail();
setTimeout(()=>toast('客户 360° 已就绪 · 4 侧 ID 已合并 · 数据 T-1 + 实时'),400);
</script>
</body>
</html>
