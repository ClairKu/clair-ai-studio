<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="robots" content="noindex,nofollow,noarchive" data-clair-access-robots />
    <script data-clair-access-gate data-clair-access-scope="report" src="../../access-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盈米本体浏览器 · Yingmi Ontology</title>
<style>
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --panel-2:#FAFBFD; --ink:#16213A; --ink-2:#3D4A68; --ink-3:#7A86A3;
  --line:#E4E8F2; --line-2:#EEF1F8;
  --brand:#0E3A5D; --brand-2:#12558C; --brand-soft:#E8F0F9;
  --gold:#B98A2F; --gold-soft:#F8F1E2;
  --r-lg:12px; --r-md:8px;
  --shadow:0 1px 2px rgba(22,33,58,.05),0 1px 8px rgba(22,33,58,.04);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
a{color:var(--brand-2);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD2E2;border-radius:8px;border:2px solid transparent;background-clip:content-box}

#app{display:flex;flex-direction:column;height:100vh}
#topbar{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--brand);color:#fff;z-index:20}
#topbar .mark{width:26px;height:26px;border-radius:7px;background:#12558C;border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:11px;font-weight:800;color:#FFE9B8}
#topbar h1{font-size:14px;font-weight:700;letter-spacing:.02em}
#topbar .sub{font-size:11px;opacity:.7}
#topbar .sp{flex:1}
#search{width:min(420px,42vw);height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;padding:0 12px 0 32px;font-size:13px}
#search::placeholder{color:rgba(255,255,255,.55)}
#search-wrap{position:relative}
#search-wrap::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.7;font-size:14px}
#search-count{font-size:11px;opacity:.7;min-width:64px}

#kpis{display:flex;gap:0;flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.kpi{flex:1;padding:10px 14px;border-right:1px solid var(--line-2);min-width:0;text-align:left;cursor:pointer}
.kpi:last-child{border-right:none}
.kpi:hover,.kpi.on{background:var(--brand-soft)}
.kpi .l{font-size:11px;color:var(--ink-3);margin-bottom:2px}
.kpi .v{font-size:18px;font-weight:750;letter-spacing:-.02em}
.kpi .s{font-size:10px;color:var(--ink-3);margin-top:1px}

#body{flex:1;min-height:0;display:grid;grid-template-columns:280px 1fr 360px}
#side,#detail{background:var(--panel);overflow:auto;min-height:0}
#side{border-right:1px solid var(--line)}
#detail{border-left:1px solid var(--line)}
#main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}

.pad{padding:12px 14px}
.sec-title{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.dims{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--ink-2)}
.chip.on,.chip:hover{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
.chip .n{margin-left:4px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.facet{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 8px;border-radius:8px;text-align:left}
.facet:hover,.facet.on{background:var(--brand-soft)}
.facet .name{display:flex;align-items:center;gap:7px;min-width:0}
.facet .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facet .n{font-size:11px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

#list{border-top:1px solid var(--line-2)}
.item{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line-2)}
.item:hover{background:var(--panel-2)}
.item.on{background:var(--brand-soft)}
.item .meta{min-width:0;flex:1}
.item .t{font-weight:650;line-height:1.35}
.item .d{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.kind{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;flex:none;margin-top:2px}

#toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 10px;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:#fff}
#canvas-wrap{flex:1;min-height:0;position:relative}
#canvas-wrap svg{width:100%;height:100%;display:block}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;pointer-events:none}
#hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-3);background:rgba(255,255,255,.9);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}

#table-wrap,#overview{flex:1;min-height:0;overflow:auto;display:none}
#table-wrap.on,#overview.on{display:block}
#canvas-wrap.hide{display:none}
#list-title{font-size:12px;color:var(--ink-2);font-weight:650}
.ov{padding:18px 22px}
.ov h2{font-size:16px;font-weight:750;margin-bottom:4px}
.ov .lead{font-size:12px;color:var(--ink-3);margin-bottom:16px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ov-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ov-col h3{font-size:12px;margin-bottom:8px}
.ov-row{display:flex;align-items:center;gap:8px;width:100%;padding:7px 6px;border-radius:8px;text-align:left}
.ov-row:hover,.ov-row.on{background:var(--brand-soft)}
.ov-row .nm{flex:1;min-width:0}
.ov-row .bar{height:6px;background:#EEF1F8;border-radius:4px;width:88px;overflow:hidden;flex:none}
.ov-row .bar i{display:block;height:100%;border-radius:4px}
.ov-row .n{width:36px;text-align:right;font-size:12px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-size:11px;color:var(--ink-3);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr{cursor:pointer}
tr:hover td{background:var(--brand-soft)}
tr.on td{background:#E8F0F9}

.h{font-size:18px;font-weight:750;line-height:1.3;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;font-size:12px;margin:10px 0 14px}
.kv dt{color:var(--ink-3)}
.kv dd{word-break:break-all}
.rel-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.rel-h h3{font-size:12px;font-weight:700}
.rel{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer;text-align:left;width:100%}
.rel:hover{background:var(--panel-2)}
.rel .dir{font-size:10px;color:var(--ink-3);width:36px;flex:none;padding-top:2px}
.rel .body{min-width:0;flex:1}
.rel .nm{font-weight:650}
.muted{color:var(--ink-3);font-size:12px}
.linkish{color:var(--brand-2);cursor:pointer}
.crumb{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb b{color:var(--ink-2);font-weight:600}

.node-label{font-size:11px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

@media (max-width:1100px){
  #body{grid-template-columns:240px 1fr}
  #detail{display:none}
  #body.detail-open{grid-template-columns:1fr}
  #body.detail-open #side,#body.detail-open #main{display:none}
  #body.detail-open #detail{display:block}
}
</style>
</head>

<script>
const KIND = {

  system:   {zh:"系统",     color:"#3B82F6", level:4},
  concept:  {zh:"概念",     color:"#F59E0B", level:4},
  service:  {zh:"服务",     color:"#14B8A6", level:5},
  skill:    {zh:"技能",     color:"#22C55E", level:5},
  playbook: {zh:"预案",     color:"#8B5CF6", level:6}
};
const KIND_ORDER = ["company","platform","bu","team","dept","system","concept","service","skill","playbook"];
const REL = {
  own:     {zh:"拥有 / 归属", color:"#0E3A5D"},
  primary: {zh:"主服务",     color:"#0E8FA8"},
  collab:  {zh:"协作",       color:"#7A86A3"},
  hosts:   {zh:"承载",       color:"#6D5BD0"}
};
const REL_ORDER = ["own","primary","hosts","collab"];
const SIDE = {business:"业务侧", platform:"中台侧"};
const CK = {business_process:"业务流程", business_concept:"业务概念", data_entity:"数据实体"};
const ALIAS = {fengniao:"蜂鸟", qieman:"且慢", qiming:"启明", tp:"TP 中台", "ai-platform":"AI 中台", "data-intelligence":"数据智能", infra:"基础设施", yingmi:"盈米基金", platform:"公共中台"};
const DIMS = [
  {id:"kind", label:"类型"},
  {id:"side", label:"业务侧"},
  {id:"parent", label:"归属"},
  {id:"domain", label:"领域"},
  {id:"conceptKind", label:"概念子类"}
];

const GRAPH = JSON.parse(document.getElementById("graph-data").textContent);
const nodes = GRAPH.nodes || [];
const links = GRAPH.links || [];
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const outE = {};
const inE = {};
for (const n of nodes) { outE[n.id] = []; inE[n.id] = []; }
for (const e of links) {
  if (outE[e.source]) outE[e.source].push(e);
  if (inE[e.target]) inE[e.target].push(e);
}
const degree = Object.fromEntries(nodes.map(n => [n.id, (outE[n.id].length + inE[n.id].length)]));

function displayName(n) {
  if (!n) return "";
  const a = ALIAS[n.id] || ALIAS[n.name];
  if (a && a !== n.name) return n.name + " · " + a;
  return n.name || n.id;
}
function kindMeta(k) { return KIND[k] || {zh:k || "未知", color:"#94A3B8", level:9}; }
function kindBadge(k) {
  const m = kindMeta(k);
  return `<span class="kind" style="background:${m.color}1a;color:${m.color}">${m.zh}</span>`;
}
function fmtTime(ms) {
  if (!ms) return "未知";
  const d = new Date(ms);
  const p = x => String(x).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function parentsOf(n) {
  const chain = [];
  let cur = n && n.parent ? byId[n.parent] : null;
  const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    chain.unshift(cur);
    seen.add(cur.id);
    cur = cur.parent ? byId[cur.parent] : null;
  }
  return chain;
}
function searchHay(n) {
  return [n.id, n.name, n.kind, kindMeta(n.kind).zh, n.side, SIDE[n.side]||"", n.group, n.parent, n.domain, n.repo, n.file, n.conceptKind, CK[n.conceptKind]||"", ALIAS[n.id]||""].join(" ").toLowerCase();
}
nodes.forEach(n => { n._hay = searchHay(n); });

const state = {
  q: "",
  dim: "kind",
  facet: null,
  selected: null,
  view: "graph",
  catalog: null,
  hop: 1,
  rels: new Set(REL_ORDER),
  transform: {x:0, y:0, k:1}
};

function matchesQuery(n) {
  if (!state.q) return true;
  return n._hay.includes(state.q);
}
function matchesFacet(n) {
  if (!state.facet) return true;
  const [dim, val] = state.facet;
  if (dim === "parent") return (n.parent || n.id) === val || n.id === val;
  return String(n[dim] ?? "") === val;
}
function filteredNodes() {
  return nodes.filter(n => matchesQuery(n) && matchesFacet(n));
}
function facetValue(n, dim) {
  if (dim === "parent") return n.parent || (n.kind === "company" || n.kind === "platform" || n.kind === "bu" ? n.id : "");
  return n[dim] ?? "";
}
function facetLabel(dim, val) {
  if (!val) return "未标注";
  if (dim === "kind") return kindMeta(val).zh;
  if (dim === "side") return SIDE[val] || val;
  if (dim === "conceptKind") return CK[val] || val;
  if (dim === "parent") {
    const p = byId[val];
    return p ? displayName(p) : val;
  }
  return val;
}

function openList(catalog, facet, pushHash=true) {
  state.catalog = catalog;
  state.view = "table";
  state.selected = null;
  if (facet === undefined) {
    /* keep current facet */
  } else {
    state.facet = facet;
    if (facet) state.dim = facet[0] === "rel" ? state.dim : facet[0];
  }
  if (pushHash) {
    const h = listHash();
    history.replaceState(null, "", h ? "#"+h : location.pathname+location.search);
  }
  renderAll();
}
function listHash() {
  if (state.selected) return encodeURIComponent(state.selected);
  if (state.catalog === "edges" && state.facet && state.facet[0]==="rel") return "list=rel:"+encodeURIComponent(state.facet[1]);
  if (state.catalog === "edges") return "list=edges";
  if (state.catalog === "types") return "list=types";
  if (state.catalog === "relTypes") return "list=relTypes";
  if (state.catalog === "nodes" && state.facet) return "list="+state.facet[0]+":"+encodeURIComponent(state.facet[1]);
  if (state.catalog === "nodes") return "list=nodes";
  return "";
}
function applyListHash(raw) {
  if (!raw) return false;
  if (raw.startsWith("list=")) {
    const spec = raw.slice(5);
    if (spec === "nodes") { state.catalog="nodes"; state.view="table"; return true; }
    if (spec === "edges") { state.catalog="edges"; state.view="table"; return true; }
    if (spec === "types") { state.catalog="types"; state.view="table"; return true; }
    if (spec === "relTypes") { state.catalog="relTypes"; state.view="table"; return true; }
    const i = spec.indexOf(":");
    if (i>0) {
      const dim = spec.slice(0,i), val = decodeURIComponent(spec.slice(i+1));
      if (dim === "rel") {
        state.catalog = "edges";
        state.facet = ["rel", val];
        state.rels = new Set([val]);
      } else {
        state.catalog = "nodes";
        state.dim = dim;
        state.facet = [dim, val];
      }
      state.view = "table";
      return true;
    }
  }
  if (byId[raw]) { state.selected = raw; return true; }
  return false;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function relAllowed(rel) { return state.rels.has(rel); }

function neighborSet(id, hop) {
  const seen = new Set([id]);
  let frontier = [id];
  const edges = [];
  for (let h=0; h<hop; h++) {
    const next = [];
    for (const cur of frontier) {
      for (const e of [...outE[cur], ...inE[cur]]) {
        if (!relAllowed(e.rel)) continue;
        const other = e.source === cur ? e.target : e.source;
        if (!byId[other]) continue;
        edges.push(e);
        if (!seen.has(other)) { seen.add(other); next.push(other); }
      }
    }
    frontier = next;
  }
  return {ids: seen, edges: uniqEdges(edges)};
}
function uniqEdges(arr) {
  const m = new Map();
  for (const e of arr) m.set(e.source+"|"+e.target+"|"+e.rel, e);
  return [...m.values()];
}
function allRelated(id) {
  const rows = [];
  for (const e of outE[id] || []) if (relAllowed(e.rel) && byId[e.target]) rows.push({dir:"out", e, other: byId[e.target]});
  for (const e of inE[id] || []) if (relAllowed(e.rel) && byId[e.source]) rows.push({dir:"in", e, other: byId[e.source]});
  rows.sort((a,b) => REL_ORDER.indexOf(a.e.rel)-REL_ORDER.indexOf(b.e.rel) || a.dir.localeCompare(b.dir) || kindMeta(a.other.kind).level-kindMeta(b.other.kind).level);
  return rows;
}

function renderGraph() {
  const svg = document.getElementById("svg");
  const empty = document.getElementById("empty");
  const wrap = document.getElementById("canvas-wrap");
  const w = wrap.clientWidth || 800;
  const h = wrap.clientHeight || 600;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const center = byId[state.selected];
  if (!center) {
    const list = filteredNodes();
    if ((state.q || state.facet) && list.length && list.length < nodes.length) {
      renderFilteredCluster(svg, w, h, list);
    } else {
      renderOverview(svg, w, h);
    }
    empty.textContent = "";
    return;
  }
  const {ids, edges} = neighborSet(center.id, state.hop);
  const others = [...ids].filter(id => id !== center.id).map(id => byId[id]).filter(Boolean);
  if (!others.length) {
    svg.innerHTML = "";
    empty.textContent = "当前关系筛选下没有邻居，试试打开「协作」或切到二跳";
    drawNode(svg, w/2, h/2, center, 22, true);
    return;
  }
  empty.textContent = "";
  const groups = [];
  const bucket = new Map();
  for (const e of edges) {
    const otherId = e.source === center.id ? e.target : e.source;
    if (otherId === center.id || !byId[otherId]) continue;
    const dir = e.source === center.id ? "out" : "in";
    const key = e.rel + "|" + dir;
    if (!bucket.has(key)) bucket.set(key, []);
    if (!bucket.get(key).some(x => x.id === otherId)) bucket.get(key).push(byId[otherId]);
  }
  for (const rel of REL_ORDER) {
    for (const dir of ["out","in"]) {
      const key = rel+"|"+dir;
      if (bucket.has(key) && bucket.get(key).length) groups.push({rel, dir, nodes: bucket.get(key)});
    }
  }
  const leftover = others.filter(n => !groups.some(g => g.nodes.includes(n)));
  if (leftover.length) groups.push({rel:"collab", dir:"out", nodes: leftover});

  const cx = w/2, cy = h/2;
  const r0 = Math.min(w,h) * 0.28;
  const r1 = Math.min(w,h) * 0.42;
  const pos = new Map();
  pos.set(center.id, {x:cx, y:cy});
  let angle = -Math.PI/2;
  const total = groups.reduce((s,g) => s + g.nodes.length, 0);
  for (const g of groups) {
    const sweep = (g.nodes.length / total) * Math.PI * 2;
    g.nodes.forEach((n, i) => {
      const a = angle + sweep * ((i+0.5)/g.nodes.length);
      const rr = g.nodes.length > 18 ? r1 : r0;
      pos.set(n.id, {x: cx + Math.cos(a)*rr, y: cy + Math.sin(a)*rr});
    });
    angle += sweep;
  }

  let html = `<g id="viewport">`;
  for (const e of edges) {
    const a = pos.get(e.source), b = pos.get(e.target);
    if (!a || !b) continue;
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${REL[e.rel]?.color || "#CBD2E2"}" stroke-width="${e.rel==="primary"?1.6:1}" stroke-opacity="${e.rel==="collab"?0.35:0.7}"/>`;
  }
  html += drawNodeMarkup(cx, cy, center, 24, true);
  for (const n of others) {
    const p = pos.get(n.id);
    if (p) html += drawNodeMarkup(p.x, p.y, n, 12, false);
  }
  html += `</g>`;
  svg.innerHTML = html;
  applyTransform();
}

function drawNodeMarkup(x, y, n, r, focus) {
  const c = kindMeta(n.kind).color;
  const label = displayName(n);
  const short = label.length > 12 ? label.slice(0,11) + "…" : label;
  return `<g class="gnode" data-id="${encodeURIComponent(n.id)}" transform="translate(${x},${y})" style="cursor:pointer">
    <circle r="${r}" fill="${c}" fill-opacity="${focus?0.95:0.88}" stroke="#fff" stroke-width="${focus?3:1.5}"/>
    <text class="node-label" y="${r+12}" text-anchor="middle" fill="#16213A" font-size="${focus?12:10}" font-weight="${focus?700:500}">${esc(short)}</text>
  </g>`;
}
function drawNode(svg, x, y, n, r, focus) {
  svg.innerHTML = `<g id="viewport">${drawNodeMarkup(x,y,n,r,focus)}</g>`;
}

function renderFilteredCluster(svg, w, h, list) {
  const shown = list.slice().sort((a,b) => degree[b.id]-degree[a.id]).slice(0, 80);
  const shownIds = new Set(shown.map(n => n.id));
  const edges = links.filter(e => shownIds.has(e.source) && shownIds.has(e.target) && relAllowed(e.rel));
  const cx = w/2, cy = h/2;
  const r = Math.min(w, h) * 0.36;
  const pos = new Map();
  shown.forEach((n, i) => {
    const a = -Math.PI/2 + (Math.PI*2*i)/shown.length;
    pos.set(n.id, {x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r});
  });
  let html = `<g id="viewport">`;
  html += `<text x="28" y="28" fill="#16213A" font-size="14" font-weight="700">当前筛选 · ${list.length} 个实体${list.length>80?"（图中展示度数最高的 80 个）":""}</text>`;
  for (const e of edges) {
    const a = pos.get(e.source), b = pos.get(e.target);
    if (!a || !b) continue;
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${REL[e.rel]?.color || "#CBD2E2"}" stroke-width="1" stroke-opacity="0.45"/>`;
  }
  for (const n of shown) {
    const p = pos.get(n.id);
    html += drawNodeMarkup(p.x, p.y, n, 11, false);
  }
  html += `</g>`;
  svg.innerHTML = html;
  state.transform = {x:0,y:0,k:1};
}

function renderOverview(svg, w, h) {
  const roots = nodes.filter(n => ["company","platform","bu","team"].includes(n.kind));
  const kids = id => {
    const direct = nodes.filter(n => n.parent === id);
    if (direct.length) return direct;
    return (outE[id] || []).filter(e => e.rel === "own" && byId[e.target]).map(e => byId[e.target]);
  };
  const items = [];
  const company = nodes.find(n => n.kind==="company");
  if (company) items.push(company);
  for (const n of nodes.filter(n => n.kind==="platform" || n.kind==="bu")) items.push(n);
  for (const n of nodes.filter(n => n.kind==="team")) items.push(n);

  const cols = 3;
  const cellW = (w-80)/cols;
  const cellH = 150;
  let html = `<g id="viewport">`;
  html += `<text x="28" y="36" fill="#16213A" font-size="16" font-weight="700">本体层级总览</text>`;
  html += `<text x="28" y="56" fill="#7A86A3" font-size="12">公司 → 中台 / BU → 团队 / 部门 → 系统 · 概念 · 服务 → 预案 / 技能。点区块进入该归属下的实体。</text>`;
  items.forEach((n, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = 28 + col * cellW;
    const y = 80 + row * cellH;
    const children = kids(n.id);
    const byK = {};
    for (const c of children) byK[c.kind] = (byK[c.kind]||0)+1;
    const summary = KIND_ORDER.filter(k => byK[k]).map(k => `${kindMeta(k).zh} ${byK[k]}`).join(" · ") || "无直接子节点";
    html += `<g class="gnode" data-id="${encodeURIComponent(n.id)}" transform="translate(${x},${y})" style="cursor:pointer">
      <rect width="${cellW-16}" height="128" rx="12" fill="#fff" stroke="#E4E8F2"/>
      <rect width="6" height="128" rx="3" fill="${kindMeta(n.kind).color}"/>
      <text x="18" y="28" fill="#7A86A3" font-size="11">${kindMeta(n.kind).zh}</text>
      <text x="18" y="52" fill="#16213A" font-size="16" font-weight="700">${esc(displayName(n))}</text>
      <text x="18" y="76" fill="#3D4A68" font-size="12">${esc(summary)}</text>
      <text x="18" y="100" fill="#7A86A3" font-size="11">${degree[n.id]} 条关系</text>
    </g>`;
  });
  html += `</g>`;
  svg.innerHTML = html;
  state.transform = {x:0,y:0,k:1};
}

function applyTransform() {
  const vp = document.getElementById("viewport");
  if (!vp) return;
  const t = state.transform;
  vp.setAttribute("transform", `translate(${t.x},${t.y}) scale(${t.k})`);
}

function select(id, pushHash=true) {
  if (!id || !byId[id]) return;
  state.selected = id;
  state.catalog = null;
  if (pushHash) history.replaceState(null, "", "#" + encodeURIComponent(id));
  renderAll();
}

function renderListTitle() {
  const el = document.getElementById("list-title");
  if (!el) return;
  if (state.selected) { el.textContent = "关联 · " + displayName(byId[state.selected]); return; }
  if (state.catalog === "types") { el.textContent = "类型清单 · " + new Set(nodes.map(n=>n.kind)).size + " 种"; return; }
  if (state.catalog === "relTypes") { el.textContent = "关系类型清单 · " + REL_ORDER.length + " 种"; return; }
  if (state.catalog === "edges") {
    const n = links.filter(e => relAllowed(e.rel) && (!state.facet || state.facet[0]!=="rel" || e.rel===state.facet[1])).length;
    el.textContent = "关系清单 · " + n + " 条";
    return;
  }
  el.textContent = "实体清单 · " + filteredNodes().length + " 个";
}

function renderAll() {
  renderKpis();
  renderDims();
  renderFacets();
  renderList();
  renderRelFilters();
  renderDetail();
  renderListTitle();
  const showOverview = state.view === "graph" && !state.selected && !state.catalog && !state.q && !state.facet;
  const tableOn = state.view === "table";
  document.getElementById("canvas-wrap").classList.toggle("hide", tableOn || showOverview);
  document.getElementById("overview").classList.toggle("on", showOverview);
  document.getElementById("table-wrap").classList.toggle("on", tableOn);
  document.getElementById("hop-seg").style.display = !tableOn && state.selected ? "" : "none";
  [...document.querySelectorAll("#view-seg [data-view]")].forEach(b => b.classList.toggle("on", b.dataset.view === state.view));
  if (showOverview) renderOverviewHtml();
  else if (tableOn) renderTable();
  else renderGraph();
}

document.getElementById("kpis").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (!b) return;
  const cat = b.dataset.cat;
  if (cat === "nodes") openList("nodes", null);
  else if (cat === "edges") openList("edges", null);
  else if (cat === "types") openList("types", null);
  else if (cat === "relTypes") openList("relTypes", null);
});
document.getElementById("dims").addEventListener("click", e => {
  const b = e.target.closest("[data-dim]");
  if (!b) return;
  state.dim = b.dataset.dim;
  if (state.facet && state.facet[0] !== state.dim) state.facet = null;
  renderAll();
});
document.getElementById("facets").addEventListener("click", e => {
  const b = e.target.closest(".facet");
  if (!b) return;
  if (b.dataset.clear) openList("nodes", null);
  else openList("nodes", [state.dim, decodeURIComponent(b.dataset.val)]);
});
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b) select(decodeURIComponent(b.dataset.id));
});
document.getElementById("detail").addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b) select(decodeURIComponent(b.dataset.id));
});
function handleOpenSpec(spec) {
  if (!spec) return false;
  const i = spec.indexOf(":");
  if (i < 0) return false;
  const dim = spec.slice(0, i), val = decodeURIComponent(spec.slice(i+1));
  if (dim === "rel") {
    state.rels = new Set([val]);
    openList("edges", ["rel", val]);
    return true;
  }
  openList("nodes", [dim, val]);
  return true;
}
document.getElementById("table-wrap").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open && handleOpenSpec(open.dataset.open)) return;
  const b = e.target.closest("[data-id]");
  if (b) select(decodeURIComponent(b.dataset.id));
});
document.getElementById("overview").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) handleOpenSpec(open.dataset.open);
});
document.getElementById("svg").addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  const id = decodeURIComponent(b.dataset.id);
  if (!state.selected && (byId[id].kind==="bu" || byId[id].kind==="platform" || byId[id].kind==="team" || byId[id].kind==="company")) {
    openList("nodes", ["parent", id]);
    return;
  }
  select(id);
});
document.getElementById("view-seg").addEventListener("click", e => {
  const b = e.target.closest("[data-view]");
  if (!b) return;
  state.view = b.dataset.view;
  [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x===b));
  renderAll();
});
document.getElementById("hop-seg").addEventListener("click", e => {
  const b = e.target.closest("[data-hop]");
  if (!b) return;
  state.hop = Number(b.dataset.hop);
  [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x===b));
  renderAll();
});
document.getElementById("rel-filters").addEventListener("click", e => {
  const b = e.target.closest("[data-rel]");
  if (!b) return;
  const r = b.dataset.rel;
  if (state.rels.has(r)) {
    if (state.rels.size>1) state.rels.delete(r);
  } else state.rels.add(r);
  renderAll();
});
document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase();
  if (state.q) { state.view = "table"; if (!state.catalog) state.catalog = "nodes"; }
  renderAll();
});

const wrap = document.getElementById("canvas-wrap");
let drag = null;
wrap.addEventListener("pointerdown", e => {
  if (e.target.closest("[data-id]")) return;
  drag = {x:e.clientX, y:e.clientY, ox:state.transform.x, oy:state.transform.y};
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  state.transform.x = drag.ox + (e.clientX - drag.x);
  state.transform.y = drag.oy + (e.clientY - drag.y);
  applyTransform();
});
window.addEventListener("pointerup", () => drag=null);
wrap.addEventListener("wheel", e => {
  e.preventDefault();
  const k = state.transform.k * (e.deltaY>0 ? 0.92 : 1.08);
  state.transform.k = Math.min(3, Math.max(0.4, k));
  applyTransform();
}, {passive:false});

window.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== document.getElementById("search")) {
    e.preventDefault();
    document.getElementById("search").focus();
  }
  if (e.key === "Escape") {
    if (state.q) { state.q=""; document.getElementById("search").value=""; }
    else { state.selected=null; state.catalog=null; state.facet=null; state.view="graph"; history.replaceState(null,"",location.pathname+location.search); }
    renderAll();
  }
});
window.addEventListener("resize", () => { if (state.view==="graph" && state.selected) renderGraph(); });
window.addEventListener("hashchange", () => {
  const raw = decodeURIComponent((location.hash||"").slice(1));
  applyListHash(raw);
  renderAll();
});

renderKpis();
applyListHash(decodeURIComponent((location.hash||"").slice(1)));
renderAll();
</script>
</body>
</html>
