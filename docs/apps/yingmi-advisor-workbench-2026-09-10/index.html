<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="robots" content="noindex,nofollow,noarchive" data-clair-access-robots />
    <script data-clair-access-gate data-clair-access-scope="workspace" src="../../access-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YINGMIWORK · 新一代顾问工作台</title>
<style>
/* ============ 设计系统 Tokens ============ */
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --panel-2:#FAFBFD; --ink:#16213A; --ink-2:#3D4A68; --ink-3:#7A86A3;
  --line:#E4E8F2; --line-2:#EEF1F8;
  --brand:#0E3A5D; --brand-2:#12558C; --brand-soft:#E8F0F9;
  --gold:#B98A2F; --gold-soft:#F8F1E2;
  --up:#0E9F6E; --up-soft:#E5F6EF; --down:#E5484D; --down-soft:#FCEBEB;
  --warn:#D97706; --warn-soft:#FCF3E3; --violet:#6D5BD0; --violet-soft:#EFECFB;
  --cyan:#0E8FA8; --cyan-soft:#E4F5F8;
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --shadow-1:0 1px 2px rgba(22,33,58,.05),0 1px 8px rgba(22,33,58,.04);
  --shadow-2:0 4px 14px rgba(22,33,58,.09),0 1px 4px rgba(22,33,58,.06);
  --shadow-3:0 14px 44px rgba(22,33,58,.16);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD2E2;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#A9B4CD;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--brand-2);text-decoration:none}

/* ============ 应用框架 ============ */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{height:50px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--brand);color:#fff;position:relative;z-index:60}
#topbar .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:.02em}
#topbar .logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2E7FC4,#0E3A5D);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:12px;font-weight:800;color:#FFE9B8}
#topbar .logo small{font-weight:500;font-size:11px;opacity:.72;margin-left:2px}
#topbar .crumb{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
#topbar .crumb b{font-weight:600}
#topbar .sp{flex:1}
.tb-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:12px;color:rgba(255,255,255,.88);border:1px solid transparent;transition:.15s}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn .dot{width:6px;height:6px;border-radius:50%;background:#FF5F56;position:absolute;top:6px;right:6px}
.mode-switch{display:flex;background:rgba(255,255,255,.13);border-radius:9px;padding:2px;gap:2px}
.mode-switch button{height:26px;padding:0 12px;border-radius:7px;font-size:12px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:5px;transition:.18s}
.mode-switch button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#C9A254,#8C6A1F);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}

#main{flex:1;display:grid;min-height:0;transition:grid-template-columns .3s ease}
body.mode-copilot #main{grid-template-columns:56px 430px minmax(0,1fr)}
body.mode-classic #main{grid-template-columns:56px 248px minmax(0,1fr) 340px}

/* ============ 左侧图标栏 ============ */
#rail{background:#0B2C49;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;z-index:50}
.rail-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.62);position:relative;transition:.15s}
.rail-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.rail-btn.on{color:#fff;background:rgba(255,255,255,.16)}
.rail-btn.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:2px;background:#7FB8EC}
.rail-btn .bdg{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#FF5F56;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
#rail .sp{flex:1}
.rail-tip{position:fixed;left:52px;padding:5px 9px;background:#16213A;color:#fff;font-size:11px;border-radius:6px;pointer-events:none;opacity:0;transition:.12s;z-index:99;white-space:nowrap;box-shadow:var(--shadow-2)}

/* ============ 列表面板（界面优先模式） ============ */
#listpanel{background:var(--panel);border-right:1px solid var(--line);display:none;flex-direction:column;min-height:0}
body.mode-classic #listpanel{display:flex}
.lp-head{padding:13px 14px 9px;display:flex;align-items:center;justify-content:space-between}
.lp-head h3{font-size:13px;font-weight:700}
.lp-head .cnt{font-size:11px;color:var(--ink-3)}
.lp-search{margin:0 12px 10px;position:relative}
.lp-search input{width:100%;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px 0 28px;font-size:12px;background:var(--panel-2)}
.lp-search svg{position:absolute;left:9px;top:8px;color:var(--ink-3)}
.lp-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.lp-item{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center;transition:.12s;border:1px solid transparent}
.lp-item:hover{background:var(--panel-2)}
.lp-item.on{background:var(--brand-soft);border-color:#C9DCF1}
.lp-item .nm{font-size:12.5px;font-weight:600}
.lp-item .sub{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center}
.lp-item .right{margin-left:auto;text-align:right;flex:none}
.lp-item .amt{font-size:12px;font-weight:700}
.lp-group{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;padding:12px 10px 5px;text-transform:uppercase}

/* ============ 副驾区 ============ */
#copilot{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
body.mode-classic #copilot{border-right:none;border-left:1px solid var(--line)}
.cp-head{flex:none;padding:12px 14px 10px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.cp-head .ai-orb{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#12558C,#6D5BD0);display:grid;place-items:center;color:#fff;flex:none}
.cp-head .t{font-size:13px;font-weight:700}
.cp-head .s{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.cp-head .live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--up);font-weight:600}
.cp-head .live i{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

#chat-stream{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:9px;max-width:100%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .who{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;margin-top:2px}
.msg.ai .who{background:linear-gradient(135deg,#12558C,#6D5BD0);color:#fff}
.msg.me{flex-direction:row-reverse}
.msg.me .who{background:linear-gradient(135deg,#C9A254,#8C6A1F);color:#fff}
.msg .bubble{max-width:calc(100% - 40px);min-width:0}
.msg.ai .bubble{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px 13px 13px 13px;padding:10px 12px}
.msg.me .bubble{background:var(--brand);color:#fff;border-radius:13px 4px 13px 13px;padding:9px 12px}
.msg .txt{font-size:12.5px;line-height:1.65;word-break:break-word}
.msg .txt b{font-weight:700}
.msg .txt .hl{background:linear-gradient(transparent 62%,#FDEFC3 62%);font-weight:600;padding:0 1px}
.msg .time{font-size:10px;color:var(--ink-3);margin-top:5px}
.msg.me .time{text-align:right}
.typing{display:inline-flex;gap:3px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:#9AA6C0;animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* 内联卡片（助理回复中的可操作卡） */
.icard{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow-1);transition:.15s}
.icard.clickable{cursor:pointer}
.icard.clickable:hover{box-shadow:var(--shadow-2);border-color:#C4D6EE;transform:translateY(-1px)}
.icard .ic-head{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.icard .ic-head .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.icard .ic-head .tt{font-size:12px;font-weight:700}
.icard .ic-head .st{font-size:10.5px;color:var(--ink-3);margin-left:auto}
.icard .ic-body{padding:10px 11px}
.icard .ic-foot{display:flex;gap:6px;padding:8px 11px;border-top:1px solid var(--line-2);background:var(--panel-2);flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:3.5px 0}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:600}
.mini-btn{height:24px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.13s}
.mini-btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.mini-btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.mini-btn.pri:hover{background:var(--brand-2)}
.mini-btn.gold{background:var(--gold-soft);border-color:#E8D5AC;color:var(--gold)}

/* 聚焦卡（重点事件/待办/异常） */
.focus-card{border-radius:11px;padding:10px 11px;border:1px solid;position:relative;overflow:hidden}
.focus-card .fc-tag{font-size:10px;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;margin-bottom:6px}
.focus-card .fc-title{font-size:12.5px;font-weight:700;line-height:1.45}
.focus-card .fc-why{font-size:11px;line-height:1.55;margin-top:5px;opacity:.85}
.focus-card .fc-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.focus-card.alert{background:var(--down-soft);border-color:#F3C4C6}
.focus-card.alert .fc-tag{background:var(--down);color:#fff}
.focus-card.todo{background:var(--brand-soft);border-color:#C9DCF1}
.focus-card.todo .fc-tag{background:var(--brand);color:#fff}
.focus-card.event{background:var(--gold-soft);border-color:#E8D5AC}
.focus-card.event .fc-tag{background:var(--gold);color:#fff}
.focus-card.insight{background:var(--violet-soft);border-color:#D4CCF2}
.focus-card.insight .fc-tag{background:var(--violet);color:#fff}

/* 助理输入框 */
#composer{flex:none;border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--panel)}
#composer .ctx-chips{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.ctx-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);border:1px solid #C9DCF1}
.ctx-chip button{display:grid;place-items:center;opacity:.6}
.ctx-chip button:hover{opacity:1}
#composer .box{border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:.15s;box-shadow:var(--shadow-1)}
#composer .box:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(18,85,140,.12)}
#composer textarea{width:100%;border:none;resize:none;padding:10px 12px 4px;font-size:12.5px;line-height:1.5;max-height:110px;background:transparent}
#composer .bar{display:flex;align-items:center;gap:6px;padding:5px 8px 7px}
#composer .bar .hint{font-size:10px;color:var(--ink-3);margin-left:auto}
#composer .send{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;transition:.15s}
#composer .send:hover{background:var(--brand-2)}
#composer .send:disabled{background:#C4CCDD;cursor:default}
.slash-menu{position:absolute;bottom:86px;left:12px;right:12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-3);overflow:hidden;z-index:40;display:none}
.slash-menu.show{display:block}
.slash-menu .sm-head{padding:8px 12px;font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;border-bottom:1px solid var(--line-2)}
.slash-item{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;font-size:12px}
.slash-item:hover,.slash-item.sel{background:var(--brand-soft)}
.slash-item .si-ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
.slash-item .si-cmd{font-family:var(--mono);font-size:11px;color:var(--brand-2);font-weight:600}
.slash-item .si-ds{color:var(--ink-3);font-size:11px;margin-left:auto}

/* ============ 工作区（多标签 + 分屏） ============ */
#canvas{background:var(--bg);overflow:hidden;min-width:0;position:relative;display:flex}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.pane+.pane{border-left:1px solid var(--line);box-shadow:-4px 0 12px rgba(22,33,58,.04)}
.tabstrip{flex:none;display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--panel-2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;min-height:36px}
.tabstrip::-webkit-scrollbar{height:4px}
.wtab{display:flex;align-items:center;gap:6px;height:29px;padding:0 7px 0 9px;border-radius:8px 8px 0 0;font-size:12px;color:var(--ink-3);cursor:pointer;white-space:nowrap;border:1px solid transparent;border-bottom:none;flex:none;max-width:190px;position:relative;transition:background .12s;user-select:none}
.wtab:hover{background:#EAEEF6;color:var(--ink-2)}
.wtab.on{background:var(--bg);color:var(--ink);font-weight:600;border-color:var(--line)}
.wtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--bg)}
.wtab .wt-dot{width:7px;height:7px;border-radius:2.5px;flex:none}
.wtab .wt-title{overflow:hidden;text-overflow:ellipsis}
.wtab .wt-act{display:none;place-items:center;width:16px;height:16px;border-radius:5px;color:var(--ink-3);font-size:10px;flex:none}
.wtab:hover .wt-act{display:grid}
.wtab .wt-act:hover{background:#D8DFEE;color:var(--ink)}
.wtab.dragging{opacity:.4}
.wtab-add{flex:none;width:24px;height:24px;border-radius:7px;color:var(--ink-3);font-size:14px;margin:0 2px 3px;display:grid;place-items:center}
.wtab-add:hover{background:#E2E8F4;color:var(--ink)}
.pane-body{flex:1;overflow-y:auto;min-height:0}
.pane-body:has(.onto-wrap){overflow:hidden}
.onto-wrap{height:100%;display:flex;flex-direction:column;min-height:0}
.onto-wrap iframe{flex:1;width:100%;border:0;background:#F4F5F8}

/* ============ 悬浮视窗 ============ */
#float-layer{position:fixed;inset:0;pointer-events:none;z-index:120}
.float-win{position:absolute;width:308px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-3);pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;animation:msgIn .2s ease}
.float-win .fw-head{display:flex;align-items:center;gap:7px;padding:8px 10px;background:linear-gradient(135deg,#0E3A5D,#12558C);color:#fff;cursor:grab;user-select:none;flex:none}
.float-win .fw-head:active{cursor:grabbing}
.float-win .fw-head .fw-t{font-size:11.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.float-win .fw-head button{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:10px;flex:none}
.float-win .fw-head button:hover{background:rgba(255,255,255,.18);color:#fff}
.float-win .fw-body{padding:11px 12px;max-height:340px;overflow-y:auto}
.float-win.min .fw-body{display:none}

/* ============ 助理多会话 ============ */
#thread-drawer{position:absolute;top:48px;left:8px;right:8px;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-3);z-index:45;display:none;flex-direction:column;overflow:hidden}
#thread-drawer.show{display:flex;animation:msgIn .18s ease}
#thread-drawer .td-head{padding:10px 12px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
#thread-drawer .td-head b{font-size:12.5px}
#thread-drawer .td-list{flex:1;overflow-y:auto;padding:6px}
.th-item{display:flex;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.12s;position:relative}
.th-item:hover{background:var(--panel-2)}
.th-item.on{background:var(--brand-soft);border-color:#C9DCF1}
.th-item .th-ico{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#12558C,#6D5BD0);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.th-item .th-t{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.th-item .th-p{font-size:10.5px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.th-item .th-meta{margin-left:auto;text-align:right;flex:none;font-size:10px;color:var(--ink-3)}
.th-item .th-del{position:absolute;right:6px;bottom:6px;width:17px;height:17px;border-radius:5px;display:none;place-items:center;color:var(--ink-3);font-size:9px;background:#fff;border:1px solid var(--line)}
.th-item:hover .th-del{display:grid}
.th-item .th-del:hover{color:var(--down);border-color:#F3C4C6}
.th-pin{font-size:9px;color:var(--gold)}
.cp-thread-title{font-size:10.5px;color:var(--ink-3);margin-top:1px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cp-thread-title:hover{color:var(--brand-2)}

/* ============ 工作台面总览 ============ */
#overview{position:fixed;inset:0;background:rgba(13,24,42,.48);backdrop-filter:blur(4px);z-index:180;display:none;place-items:center}
#overview.show{display:grid;animation:msgIn .2s ease}
.ov-panel{width:min(920px,94vw);max-height:84vh;background:var(--bg);border-radius:16px;box-shadow:var(--shadow-3);display:flex;flex-direction:column;overflow:hidden}
.ov-head{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#fff}
.ov-head h2{font-size:15px;font-weight:800}
.ov-head .ov-sum{font-size:11.5px;color:var(--ink-3)}
.ov-cols{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:12px;padding:14px;overflow-y:auto}
.ov-col h4{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.07em;margin:2px 2px 8px;display:flex;align-items:center;gap:6px}
.ov-col h4 .cnt{background:#E4E9F4;border-radius:8px;padding:0 6px;font-size:10px}
.ov-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.13s;display:flex;gap:8px;align-items:center}
.ov-item:hover{box-shadow:var(--shadow-2);border-color:#C4D6EE;transform:translateY(-1px)}
.ov-item .oi-t{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-item .oi-s{font-size:10.5px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.ov-cols{grid-template-columns:1fr}}
.page{padding:18px 22px 40px;max-width:1180px;margin:0 auto;animation:pageIn .22s ease}

.sec-title{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.07em;margin:18px 2px 9px;display:flex;align-items:center;gap:7px}

/* ================= SVG 图表 ================= */
function lineChart(data,labels,w,h,color){
  const min=Math.min(...data),max=Math.max(...data),pad=6;
  const X=i=>pad+i*(w-2*pad)/(data.length-1), Y=v=>h-pad-(v-min)/(max-min||1)*(h-2*pad);
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+` L${X(data.length-1).toFixed(1)},${h} L${X(0).toFixed(1)},${h} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" class="chart-line">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="transparent" data-i="${i}" class="chart-dot"/>`).join('')}
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.2" fill="${color}" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
}
function donut(segs,size,th){
  const total=segs.reduce((a,s)=>a+s.v,0);let acc=0;const r=(size-th)/2,cx=size/2,cy=size/2;
  const paths=segs.map(s=>{
    const a0=acc/total*2*Math.PI-Math.PI/2;acc+=s.v;const a1=acc/total*2*Math.PI-Math.PI/2;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    return `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)}" stroke="${s.c}" stroke-width="${th}" fill="none" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">${paths}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="10" fill="#7A86A3">四笔钱</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12" font-weight="800" fill="#16213A">${fmtW(total)}</text></svg>`;
}
function hbar(v,max,color,h){return `<div style="height:${h||8}px;background:#EEF1F7;border-radius:5px;overflow:hidden"><div style="height:100%;width:${Math.min(100,v/max*100)}%;background:${color};border-radius:5px"></div></div>`;}

/* ================= 标签页系统（多窗口载体） ================= */
function mkTab(key){ // key: 'page:home' | 'customer:c1' | 'report:r2'
  const[type,refId]=key.split(':');
  let title='';
  if(type==='page')title=PAGE_TITLES[refId]||refId;
  else if(type==='customer')title=custName(refId)+' · 360';
  else if(type==='report'){const r=DB.reports.find(x=>x.id===refId);title=r?(custName(r.cust)+' · '+r.t.replace(/家庭|专项/g,'')):refId;}
  return {key,type,refId,title,sub:'overview'};
}
function paneOf(key){return S.panes.find(p=>p.tabs.some(t=>t.key===key));}
function activeTab(){const m=S.panes[0];return m.tabs.find(t=>t.key===m.active)||null;}
function openTab(key,paneId){
  let p=paneOf(key);
  if(!p){p=S.panes.find(x=>x.id===(paneId||'main'));p.tabs.push(mkTab(key));}
  p.active=key;
  if(p.id==='side'&&!p.tabs.length)S.panes[1].active=null;
  rerender();
}
function closeTab(key,ev){
  ev&&ev.stopPropagation();
  const p=paneOf(key);if(!p)return;
  const i=p.tabs.findIndex(t=>t.key===key);p.tabs.splice(i,1);
  if(p.active===key)p.active=p.tabs.length?p.tabs[Math.max(0,i-1)].key:null;
  if(p.id==='main'&&!p.tabs.length){p.tabs.push(mkTab('page:home'));p.active='page:home';}
  rerender();
}
function activateTab(key){const p=paneOf(key);if(p){p.active=key;rerender();}}
function moveTab(key,ev){
  ev&&ev.stopPropagation();
  const from=paneOf(key);if(!from)return;
  const to=S.panes.find(p=>p!==from);
  const i=from.tabs.findIndex(t=>t.key===key);const[t]=from.tabs.splice(i,1);
  to.tabs.push(t);to.active=t.key;
  if(from.active===key)from.active=from.tabs.length?from.tabs[Math.max(0,i-1)].key:null;
  if(from.id==='main'&&!from.tabs.length){from.tabs.push(mkTab('page:home'));from.active='page:home';}
  rerender();toast(to.id==='side'?'已移到右侧分屏':'已移回主区');
}
/* 标签拖拽排序（同条内） */
let dragKey=null;
function tabDragStart(e,key){dragKey=key;e.dataTransfer.effectAllowed='move';}
function tabDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function tabDrop(e,targetKey){
  e.preventDefault();if(!dragKey||dragKey===targetKey)return;
  const p=paneOf(targetKey);if(!p||!p.tabs.some(t=>t.key===dragKey))return;
  const from=p.tabs.findIndex(t=>t.key===dragKey),to=p.tabs.findIndex(t=>t.key===targetKey);
  const[m]=p.tabs.splice(from,1);p.tabs.splice(to,0,m);dragKey=null;rerender();
}
function wtabHTML(p,t){
  const w=WTYPE[t.type==='page'?t.refId:t.type];
  const on=p.active===t.key;
  return `<div class="wtab ${on?'on':''}" draggable="true"
    ondragstart="tabDragStart(event,'${t.key}')" ondragover="tabDragOver(event)" ondrop="tabDrop(event,'${t.key}')"

function addMsg(role,html){
  const t=th();if(!t)return;
  const m={role,html,time:new Date().toTimeString().slice(0,5)};
  t.msgs.push(m);t.ts=m.time;
  if(role==='me'&&t.msgs.filter(x=>x.role==='me').length===1&&!t.pinned){
    t.title=html.replace(/<[^>]+>/g,'').slice(0,14)||t.title;$('#cp-thread-title').textContent=t.title;
  }
  const st=$('#chat-stream');const el=document.createElement('div');
  el.className='msg '+(role==='me'?'me':'ai');el.innerHTML=msgHTML(m);
  st.appendChild(el);st.scrollTop=st.scrollHeight;
}
function aiStream(text,cardsHTML){
  const t=th();
  const st=$('#chat-stream');const el=document.createElement('div');
  el.className='msg ai';
  const now=new Date().toTimeString().slice(0,5);
  el.innerHTML=`<div class="who">✦</div><div class="bubble"><div class="txt"><span class="typing"><i></i><i></i><i></i></span></div><div class="time">${now}</div></div>`;
  st.appendChild(el);st.scrollTop=st.scrollHeight;
  const txtEl=el.querySelector('.txt');
  setTimeout(()=>{
    txtEl.innerHTML='';let i=0;
    const timer=setInterval(()=>{
      i+=2;txtEl.innerHTML=text.slice(0,i);st.scrollTop=st.scrollHeight;
      if(i>=text.length){clearInterval(timer);txtEl.innerHTML=text;
        if(cardsHTML){const div=document.createElement('div');div.innerHTML=cardsHTML;txtEl.appendChild(div);st.scrollTop=st.scrollHeight;}
        if(t){t.msgs.push({role:'ai',html:text+(cardsHTML||''),time:now});t.ts=now;}}
    },14);
  },650);
}

function insertSlash(){$('#ask-input').value='/';$('#ask-input').focus();showSlash();}

function togglePopover(e,id){e.stopPropagation();const p=$('#'+id);$$('.popover').forEach(x=>x!==p&&x.classList.remove('show'));p.classList.toggle('show');}
document.addEventListener('click',e=>{

  if(!e.target.closest('#composer'))hideSlash();

function toast(msg){
  const w=$('#toast-wrap');const el=document.createElement('div');el.className='toast';el.textContent=msg;w.appendChild(el);
  setTimeout(()=>{el.style.transition='all .3s';el.style.opacity='0';el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),300);},2400);

/* ================= 悬浮视窗（可拖拽） ================= */
function openFloat(type,refId){
  if(S.floats.some(f=>f.type===type&&f.refId===refId&&!f.min)){toast('该悬浮窗已打开');return;}
  S.floats.push({id:'f'+(++FLOAT_N),type,refId,x:150+S.floats.length*36,y:86+S.floats.length*30,min:false,z:++FLOAT_Z});
  renderFloats();toast('已拖出悬浮窗：可拖动、可最小化，边聊边看');
}
function closeFloat(id){S.floats=S.floats.filter(f=>f.id!==id);renderFloats();}
function minFloat(id){const f=S.floats.find(f=>f.id===id);if(f){f.min=!f.min;renderFloats();}}
function floatTitle(f){
  if(f.type==='customer')return '♟ '+custName(f.refId)+' · 速览';
  if(f.type==='report'){const r=DB.reports.find(x=>x.id===f.refId);return '❖ '+(r?r.t:'');}
  return f.refId;
}
function floatBody(f){
  if(f.type==='customer'){
    const c=cust(f.refId);const sig=DB.events.find(e=>e.cust===c.id&&e.level==='high');
    return `<div class="flex">${cav(c,'s32')}<div><b>${c.name}</b> <span class="muted" style="font-size:10.5px">${c.tier}</span><div class="num" style="font-size:12px;margin-top:2px">AUM <b>${c.aum.toFixed(0)}万</b> · <b class="${clsPct(c.aumChg)}">${fmtPct(c.aumChg)}</b></div></div></div>
    ${sig?`<div style="margin-top:8px;padding:7px 9px;background:var(--down-soft);border-radius:8px;font-size:11px"><b class="down-txt">⛔ ${esc(sig.t)}</b></div>`:''}
    <div style="font-size:11px;color:var(--ink-2);margin-top:8px;line-height:1.6">✦ ${esc(c.insight.sum.slice(0,56))}…</div>
    <div class="flex" style="gap:6px;margin-top:9px"><button class="mini-btn pri" onclick="openTab('customer:${c.id}')">打开 360</button><button class="mini-btn" onclick="quickAsk('帮我写${c.name}的沟通话术')">✦ 话术</button></div>`;
  }
  if(f.type==='report'){
    const r=DB.reports.find(x=>x.id===f.refId);const c=cust(r.cust);
    return `<div style="background:linear-gradient(135deg,#0E3A5D,#12558C);border-radius:9px;padding:10px 12px;color:#fff"><div style="font-size:9.5px;letter-spacing:.2em;opacity:.7">PLAN REPORT</div><b style="font-size:12.5px">${esc(r.t)}</b><div style="font-size:10.5px;opacity:.8;margin-top:3px">${c.name} · ${r.d} · ${r.st}</div></div>
    <div class="kv" style="margin-top:8px"><span class="k">AUM</span><span class="v num">${c.aum.toFixed(0)} 万</span></div>
    <div class="kv"><span class="k">范围</span><span class="v" style="max-width:60%;text-align:right">${esc(r.scope)}</span></div>
    <div class="flex" style="gap:6px;margin-top:9px"><button class="mini-btn pri" onclick="openTab('report:${r.id}')">打开报告</button><button class="mini-btn" onclick="toast('已发送（演示）')">发送</button></div>`;
  }
  return '';
}
function renderFloats(){
  $('#float-layer').innerHTML=S.floats.map(f=>`
    <div class="float-win ${f.min?'min':''}" style="left:${f.x}px;top:${f.y}px;z-index:${f.z}" data-fid="${f.id}">
      <div class="fw-head" onpointerdown="floatDragStart(event,'${f.id}')">
        <span class="fw-t">${esc(floatTitle(f))}</span>
        <button onclick="minFloat('${f.id}')" title="${f.min?'展开':'最小化'}">${f.min?'▢':'—'}</button>
        <button onclick="closeFloat('${f.id}')" title="关闭">✕</button>
      </div>
      <div class="fw-body">${floatBody(f)}</div>
    </div>`).join('');
}
function floatDragStart(e,fid){
  e.preventDefault();
  const f=S.floats.find(x=>x.id===fid);if(!f)return;
  f.z=++FLOAT_Z;
  const win=e.target.closest('.float-win');win.style.zIndex=f.z;
  const startX=e.clientX-f.x,startY=e.clientY-f.y;
  const move=ev=>{f.x=Math.max(0,Math.min(window.innerWidth-120,ev.clientX-startX));f.y=Math.max(50,Math.min(window.innerHeight-60,ev.clientY-startY));win.style.left=f.x+'px';win.style.top=f.y+'px';};
  const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
}

function toggleOverview(show){

}
function renderOverview(){

  const custTabs=allTabs.filter(t=>t.type==='customer'),rptTabs=allTabs.filter(t=>t.type==='report'),pageTabs=allTabs.filter(t=>t.type==='page');

  $('#ov-sum').textContent=`${allTabs.length} 个窗口 · ${S.floats.length} 个悬浮 · ${S.threads.length} 条会话 · ${undone.length} 项待办`;
  $('#ov-cols').innerHTML=`
  <div class="ov-col"><h4>🗔 打开的工作窗口<span class="cnt">${allTabs.length}</span></h4>
    ${[...custTabs.map(t=>({t,g:'客户'})),...rptTabs.map(t=>({t,g:'报告'})),...pageTabs.map(t=>({t,g:'功能页'}))].map(({t,g})=>{
      const w=WTYPE[t.type==='page'?t.refId:t.type];
      return `<div class="ov-item" onclick="activateTab('${t.key}');toggleOverview(false)">
        <span class="wt-dot" style="background:${w.color};width:8px;height:8px;border-radius:3px;flex:none"></span>
        <div style="min-width:0;flex:1"><div class="oi-t">${w.glyph} ${esc(t.title)}</div><div class="oi-s">${g} · ${t.pane==='side'?'右侧分屏':'主工作区'}${activeTab()&&activeTab().key===t.key?' · 当前':''}</div></div>
        ${t.type!=='page'?`<button class="mini-btn" title="拖出悬浮窗" onclick="event.stopPropagation();openFloat('${t.type}','${t.refId}')">⇗</button>`:''}
      </div>`;}).join('')||'<div class="muted" style="font-size:11px">暂无</div>'}
  </div>
  <div class="ov-col"><h4>✦ 助理会话<span class="cnt">${S.threads.length}</span></h4>
    ${S.threads.map(t=>{const last=t.msgs[t.msgs.length-1];
      return `<div class="ov-item" onclick="switchThread('${t.id}');toggleOverview(false)">
        <div class="th-ico" style="width:24px;height:24px;font-size:11px;border-radius:7px;background:linear-gradient(135deg,#12558C,#6D5BD0);color:#fff;display:grid;place-items:center;flex:none">✦</div>
        <div style="min-width:0;flex:1"><div class="oi-t">${t.pinned?'📌 ':''}${esc(t.title)}</div><div class="oi-s">${last?esc(last.html.replace(/<[^>]+>/g,'').slice(0,24)):'（空）'} · ${t.msgs.length}条</div></div>
      </div>`;}).join('')}
    <button class="mini-btn" style="width:100%;justify-content:center" onclick="newThread();toggleOverview(false)">＋ 新会话</button>
  </div>
  <div class="ov-col"><h4>✓ 今日待办<span class="cnt">${undone.filter(t=>t.col==='today').length}</span></h4>
    ${undone.filter(t=>t.col==='today').map(t=>`<div class="ov-item" onclick="openTab('page:tasks');toggleOverview(false)">
      <span class="pri-dot" style="background:${t.pri==='high'?'var(--down)':t.pri==='mid'?'var(--warn)':'#C4CCDD'}"></span>
      <div style="min-width:0;flex:1"><div class="oi-t">${esc(t.title)}</div><div class="oi-s">${t.cust?custName(t.cust)+' · ':''}${t.due}</div></div></div>`).join('')}
    ${S.floats.length?`<h4 style="margin-top:12px">⇗ 悬浮窗<span class="cnt">${S.floats.length}</span></h4>`+S.floats.map(f=>`<div class="ov-item" onclick="closeFloat('${f.id}')"><div style="min-width:0;flex:1"><div class="oi-t">${esc(floatTitle(f))}</div><div class="oi-s">点击关闭</div></div></div>`).join(''):''}
  </div>`;
}
