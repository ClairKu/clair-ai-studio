<html lang="zh-CN">
<head>

<title>用户在小顾里问了什么｜访问验证</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--bg1:#f8fbff;--bg2:#e3f0fd;--card:rgba(255,255,255,.93);--line:#cfe4fa;
  --ink:#0e1c2b;--ink-2:#5b6e84;--ink-3:#8a97a8;--blue:#1b88ee;--deep:#0b5192;--err:#b8460e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0b131e;--bg2:#0f2033;--card:rgba(19,30,44,.94);--line:#243447;
  --ink:#e8eef5;--ink-2:#a9bacd;--ink-3:#7b8da3;--blue:#4aa7ff;--deep:#8fc8ff;--err:#f0925e}}
:root[data-theme="dark"]{--bg1:#0b131e;--bg2:#0f2033;--card:rgba(19,30,44,.94);--line:#243447;
  --ink:#e8eef5;--ink-2:#a9bacd;--ink-3:#7b8da3;--blue:#4aa7ff;--deep:#8fc8ff;--err:#f0925e}
*{box-sizing:border-box;font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);
  background:radial-gradient(circle at 78% 16%,var(--bg2) 0,transparent 34%),linear-gradient(150deg,var(--bg1),var(--bg2))}
.gate{width:min(500px,100%);padding:42px;border:1px solid var(--line);border-radius:22px;
  background:var(--card);box-shadow:0 28px 80px rgba(11,81,146,.14);backdrop-filter:blur(16px)}
.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;color:#fff;
  background:linear-gradient(145deg,#1b88ee,#0f72cd);font:700 19px/1 "Noto Serif SC",serif}
.eyebrow{margin-top:20px;color:var(--deep);font-size:11px;font-weight:700;letter-spacing:.2em}
h1{margin:8px 0 8px;font-family:"Noto Serif SC",Songti SC,serif;font-size:27px;line-height:1.25;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.7}
form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:26px}
input,button{min-height:48px;border-radius:12px;font:inherit;font-size:16px}
input{min-width:0;padding:0 15px;border:1px solid var(--line);background:var(--bg1);color:var(--ink);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(27,136,238,.12)}
button{border:0;padding:0 22px;color:#fff;background:linear-gradient(135deg,#1b88ee,#0f72cd);font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:22px;margin-top:11px;color:var(--err);font-size:13px}
.note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px;line-height:1.6}
@media(max-width:520px){.gate{padding:30px 22px}h1{font-size:22px}form{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
