<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 持续运转与势能放大关键行动图</title>
  <desc id="desc">从左到右展示四个持续作为核心运转引擎，向盈米 AI 开放平台注入能力，再通过大厂 AI 平台接入和 C 端产品接入触达更多群体、放大势能。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#ede9fa"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7058d8"/><stop offset="1" stop-color="#a58df7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a32"/><stop offset="1" stop-color="#263151"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#342568" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8067e8"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#171a2a}.serif{font-family:"Songti SC","Noto Serif SC",STSong,SimSun,serif}.eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#735bd8}.headline{font-size:48px;font-weight:750}.subhead{font-size:20px;fill:#647086}.group-title{font-size:27px;font-weight:750}.group-note{font-size:15px;fill:#6b7588}.card-title{font-size:24px;font-weight:750}.metric{font-size:32px;font-weight:750;fill:#735bd8}.body{font-size:16px;fill:#59647a}.tiny{font-size:13px;fill:#707b8e}.white{fill:#fff}.pale{fill:#e6e9f4}.mode-title{font-size:25px;font-weight:750}.result-main{font-size:35px;font-weight:750;fill:#fff}.result-number{font-size:56px;font-weight:800;fill:#fff}.stage{font-size:12px;font-weight:800;letter-spacing:2px;fill:#735bd8}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1830" cy="60" r="240" fill="none" stroke="#8067e8" stroke-opacity=".07" stroke-width="2"/>
  <circle cx="1830" cy="60" r="170" fill="none" stroke="#8067e8" stroke-opacity=".06" stroke-width="2"/>

  <text x="60" y="58" class="eyebrow">YINGMI AI · KEY ACTION MAP</text>
  <text x="60" y="116" class="headline serif">持续运转，放大势能</text>
  <text x="60" y="154" class="subhead">四个持续做深平台｜两种接入做大触达</text>
  <rect x="1392" y="81" width="468" height="54" rx="27" fill="#fff" stroke="#dcd5f2"/>
  <text x="1626" y="116" class="group-note" text-anchor="middle">核心引擎 → 能力中枢 → 放大路径 → 势能结果</text>

  <!-- 01 核心运转 -->
  <rect x="60" y="200" width="720" height="812" rx="30" fill="#fff" stroke="#dbd5ef" filter="url(#shadow)"/>
  <text x="94" y="245" class="stage">01 · CORE ENGINE</text>
  <text x="94" y="286" class="group-title serif">四个持续｜核心运转引擎</text>
  <text x="94" y="316" class="group-note">持续积累能力、先发、生态与品牌机会</text>
  <path d="M116 346H724" stroke="#e6e1f4" stroke-width="2"/>

  <rect x="94" y="378" width="314" height="258" rx="22" fill="#f7f5fc"/>
  <text x="120" y="417" class="eyebrow">持续建设</text>
  <text x="120" y="468" class="metric serif">3层能力</text>
  <rect x="120" y="492" width="262" height="54" rx="15" fill="#ebe6fa"/>
  <text x="251" y="527" class="card-title" text-anchor="middle">MCP · Skills · Agent</text>
  <text x="120" y="580" class="body">连接 → 流程 → 完整任务</text>
  <text x="120" y="610" class="tiny">把专业能力沉淀为可复用资产</text>

  <rect x="432" y="378" width="314" height="258" rx="22" fill="url(#navy)"/>
  <text x="458" y="417" class="eyebrow" style="fill:#b8a7ff">持续抢先</text>
  <text x="458" y="468" class="metric serif" style="fill:#fff">4项首个 / 首批</text>
  <text x="458" y="514" class="body" style="fill:#eef0f8">财富 MCP Server</text>
  <text x="458" y="548" class="body" style="fill:#eef0f8">理财测评集 / 投顾模型</text>
  <text x="458" y="582" class="body" style="fill:#eef0f8">投顾 OpenClaw</text>
  <text x="458" y="616" class="body" style="fill:#eef0f8">千问 MCP / A2A 首批合作</text>

  <rect x="94" y="660" width="314" height="292" rx="22" fill="#f7f5fc"/>
  <text x="120" y="699" class="eyebrow">持续合作</text>
  <text x="120" y="750" class="metric serif">8类生态伙伴</text>
  <text x="120" y="794" class="body">大厂平台 · C端入口 · 金融机构</text>
  <rect x="120" y="824" width="120" height="44" rx="14" fill="#ebe6fa"/><text x="180" y="853" class="body" text-anchor="middle">活动 10场+</text>
  <rect x="252" y="824" width="130" height="44" rx="14" fill="#eeeef3"/><text x="317" y="853" class="body" text-anchor="middle">机构 30家+</text>
  <text x="120" y="909" class="tiny">合作覆盖平台、产品入口与行业伙伴</text>

  <rect x="432" y="660" width="314" height="292" rx="22" fill="#f7f5fc"/>
  <text x="458" y="699" class="eyebrow">持续曝光</text>
  <text x="458" y="750" class="metric serif">8,965篇报道</text>
  <text x="458" y="792" class="body">互动 300万+｜浏览 1,000万+</text>
  <text x="458" y="826" class="body">原创 50+｜渠道发布 300+篇</text>
  <text x="458" y="860" class="body">其中 MCP 相关报道 3,329篇</text>
  <text x="458" y="909" class="tiny">用内容、媒体与活动持续积累声量</text>

  <!-- 汇聚箭头 -->
  <path d="M806 606H858" stroke="#8067e8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="832" y="582" class="stage" text-anchor="middle">持续注入</text>

  <!-- 平台中枢 -->
  <rect x="874" y="318" width="306" height="576" rx="36" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="1027" y="374" class="stage" text-anchor="middle" style="fill:#b8a7ff">PLATFORM CORE</text>
  <text x="1027" y="430" class="group-title serif white" text-anchor="middle">盈米 AI</text>
  <text x="1027" y="470" class="group-title serif white" text-anchor="middle">开放平台</text>
  <path d="M930 502H1124" stroke="#465171" stroke-width="2"/>
  <rect x="925" y="548" width="204" height="58" rx="18" fill="#313c5e"/><text x="1027" y="585" class="card-title white" text-anchor="middle">MCP 标准连接</text>
  <rect x="925" y="628" width="204" height="58" rx="18" fill="#313c5e"/><text x="1027" y="665" class="card-title white" text-anchor="middle">Skills 专业流程</text>
  <rect x="925" y="708" width="204" height="58" rx="18" fill="#313c5e"/><text x="1027" y="745" class="card-title white" text-anchor="middle">Agent 完整任务</text>
  <text x="1027" y="822" class="body" text-anchor="middle" style="fill:#cbd1e1">沉淀 · 编排 · 输出</text>

  <path d="M1196 606H1248" stroke="#8067e8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1222" y="582" class="stage" text-anchor="middle">向外放大</text>

  <!-- 02 势能放大 -->
  <rect x="1264" y="200" width="596" height="812" rx="30" fill="#fff" stroke="#dbd5ef" filter="url(#shadow)"/>
  <text x="1298" y="245" class="stage">02 · MOMENTUM MULTIPLIER</text>
  <text x="1298" y="286" class="group-title serif">两种接入｜势能放大路径</text>
  <text x="1298" y="316" class="group-note">把平台能力送进用户已经存在的入口与场景</text>
  <path d="M1298 346H1826" stroke="#e6e1f4" stroke-width="2"/>

  <rect x="1298" y="382" width="338" height="176" rx="22" fill="#f7f5fc"/>
  <circle cx="1340" cy="424" r="22" fill="#e9e4fa"/><text x="1340" y="433" class="card-title" text-anchor="middle">A</text>
  <text x="1380" y="432" class="mode-title serif">大厂 AI 平台接入</text>
  <text x="1324" y="484" class="body">借助平台入口与流量</text>
  <text x="1324" y="516" class="body">触达平台原生用户</text>

  <rect x="1298" y="582" width="338" height="176" rx="22" fill="#f7f5fc"/>
  <circle cx="1340" cy="624" r="22" fill="#e9e4fa"/><text x="1340" y="633" class="card-title" text-anchor="middle">B</text>
  <text x="1380" y="632" class="mode-title serif">C 端产品接入</text>
  <text x="1324" y="684" class="body">嵌入真实产品场景</text>
  <text x="1324" y="716" class="body">承接持续服务关系</text>

  <path d="M1654 470H1695" stroke="#8067e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1654 670H1695" stroke="#8067e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="1710" y="382" width="116" height="376" rx="28" fill="url(#violet)"/>
  <text x="1768" y="430" class="stage" text-anchor="middle" style="fill:#eeeaff">OUTCOME</text>
  <text x="1768" y="492" class="result-main serif" text-anchor="middle">更多</text>
  <text x="1768" y="532" class="result-main serif" text-anchor="middle">群体</text>
  <path d="M1736 568H1800" stroke="#cfc5ff" stroke-width="2"/>
  <text x="1768" y="630" class="result-number serif" text-anchor="middle">势能</text>
  <text x="1768" y="694" class="result-number" text-anchor="middle">↑</text>

  <rect x="1298" y="802" width="528" height="150" rx="22" fill="#171f37"/>
  <text x="1562" y="846" class="stage" text-anchor="middle" style="fill:#b8a7ff">最终效果</text>
  <text x="1562" y="893" class="group-title serif white" text-anchor="middle">更多入口 · 更多场景 · 更多用户</text>
  <text x="1562" y="927" class="body" text-anchor="middle" style="fill:#cbd1e1">让专业财富管理能力在更多地方被看见、被使用</text>

  <text x="60" y="1052" class="tiny">数据口径：用户提供关键行动素材，更新至 2026-08-02；“首个 / 首批”及活动、机构数量用于内部汇报，对外使用需补公开证据与统计口径。</text>
</svg>
