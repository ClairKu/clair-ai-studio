const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let plain='',busy=false,blobURL='';
async function openMemoir(value){if(busy)return;busy=true;document.getElementById('open').disabled=true;const status=document.getElementById('status');status.textContent='正在打开…';try{if(!globalThis.crypto?.subtle)throw Error('unavailable');if(!/^[A-Za-z0-9_-]{43}$/.test(value))throw Error('invalid');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv),additionalData:b64(payload.aad),tagLength:128},key,b64(payload.data));plain=new TextDecoder().decode(bytes);document.getElementById('key').value='';try{history.replaceState(null,'',location.pathname+location.search)}catch{}document.getElementById('frame').srcdoc=plain;document.getElementById('lock').hidden=true;document.getElementById('viewer').hidden=false;document.body.classList.add('open');status.textContent='';}catch(e){status.textContent=e.message==='unavailable'?'当前浏览器不支持安全解密，请使用较新的浏览器。':'钥匙不匹配，或档案无法解密。请使用交付时的私人链接。';}finally{busy=false;document.getElementById('open').disabled=false}}
document.getElementById('unlock').addEventListener('submit',e=>{e.preventDefault();openMemoir(document.getElementById('key').value.trim())});
document.getElementById('download').addEventListener('click',()=>{if(!plain)return;const url=URL.createObjectURL(new Blob([plain],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='私人财富记忆.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)});
document.getElementById('close').addEventListener('click',()=>{plain='';document.getElementById('frame').srcdoc='';document.getElementById('viewer').hidden=true;document.getElementById('lock').hidden=false;document.body.classList.remove('open');document.getElementById('key').value='';document.getElementById('status').textContent='档案已锁上。';});
