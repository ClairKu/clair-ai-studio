<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CAP 需求分流目标流程</title>
  <desc id="desc">需求先判断现有能力是否覆盖，目标 70% 由 PM 或生态玩家即时编排，30% 进入新能力建设后回流能力池。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8F7FC"/><stop offset="1" stop-color="#EEF7F6"/></linearGradient>
    <linearGradient id="fast" x1="0" x2="1"><stop stop-color="#7457E8"/><stop offset="1" stop-color="#9B83F1"/></linearGradient>
    <linearGradient id="build" x1="0" x2="1"><stop stop-color="#178C83"/><stop offset="1" stop-color="#54BFB3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B214F" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8572DD"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#289E94"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="58" y="68" fill="#7457E8" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">DEMAND ROUTING · TARGET MODEL</text>
  <text x="58" y="116" fill="#171A27" font-family="Songti SC,STSong,serif" font-size="39" font-weight="600">先问“能否组合”，再决定“是否开发”</text>
  <text x="1142" y="68" text-anchor="end" fill="#9A8AD8" font-family="Arial,sans-serif" font-size="13" font-weight="700">TARGET · NOT ACHIEVEMENT</text>

  <g font-family="Arial,'PingFang SC',sans-serif" filter="url(#shadow)">
    <g transform="translate(58 248)">
      <rect width="210" height="146" rx="28" fill="#171A27"/>
      <text x="105" y="42" text-anchor="middle" fill="#AFA7C9" font-size="12" font-weight="800" letter-spacing="2">INPUT</text>
      <text x="105" y="82" text-anchor="middle" fill="#FFF" font-size="29" font-weight="800">用户需求</text>
      <text x="105" y="113" text-anchor="middle" fill="#C9CED9" font-size="15">自然语言 / 产品反馈</text>
    </g>
    <g transform="translate(328 222)">
      <path d="M142 0L284 99L142 198L0 99Z" fill="#FFF" stroke="#D9D2F2" stroke-width="3"/>
      <text x="142" y="76" text-anchor="middle" fill="#7457E8" font-size="13" font-weight="800" letter-spacing="2">CAPABILITY MATCH</text>
      <text x="142" y="112" text-anchor="middle" fill="#171A27" font-size="25" font-weight="800">现有能力能否覆盖？</text>
      <text x="142" y="143" text-anchor="middle" fill="#687287" font-size="15">数据 × 能力 × 组件 × 规则</text>
    </g>
    <g transform="translate(690 150)">
      <rect width="214" height="146" rx="28" fill="url(#fast)"/>
      <text x="107" y="38" text-anchor="middle" fill="#EEE9FF" font-size="12" font-weight="800" letter-spacing="2">EXISTING ABILITIES</text>
      <text x="107" y="84" text-anchor="middle" fill="#FFF" font-size="46" font-weight="900">70%</text>
      <text x="107" y="117" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">即时编排服务</text>
    </g>
    <g transform="translate(690 380)">
      <rect width="214" height="146" rx="28" fill="url(#build)"/>
      <text x="107" y="38" text-anchor="middle" fill="#DFF7F3" font-size="12" font-weight="800" letter-spacing="2">MISSING ABILITIES</text>
      <text x="107" y="84" text-anchor="middle" fill="#FFF" font-size="46" font-weight="900">30%</text>
      <text x="107" y="117" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">进入能力建设</text>
    </g>
    <g transform="translate(970 150)">
      <rect width="172" height="146" rx="28" fill="#FFF"/>
      <text x="86" y="38" text-anchor="middle" fill="#7457E8" font-size="12" font-weight="800" letter-spacing="2">DELIVER</text>
      <text x="86" y="76" text-anchor="middle" fill="#171A27" font-size="23" font-weight="800">配置到 AI 小顾</text>
      <text x="86" y="108" text-anchor="middle" fill="#687287" font-size="15">或发布应用广场</text>
    </g>
    <g transform="translate(970 380)">
      <rect width="172" height="146" rx="28" fill="#FFF"/>
      <text x="86" y="38" text-anchor="middle" fill="#178C83" font-size="12" font-weight="800" letter-spacing="2">BUILD</text>
      <text x="86" y="76" text-anchor="middle" fill="#171A27" font-size="23" font-weight="800">建设原子能力</text>
      <text x="86" y="108" text-anchor="middle" fill="#687287" font-size="15">验证后回流能力池</text>
    </g>
  </g>

  <g fill="none" stroke="#8572DD" stroke-width="4" marker-end="url(#arrow)"><path d="M268 321H318"/><path d="M612 282C646 282 648 223 680 223"/><path d="M904 223H960"/></g>
  <g fill="none" stroke="#289E94" stroke-width="4" marker-end="url(#arrow2)"><path d="M612 360C646 360 648 453 680 453"/><path d="M904 453H960"/><path d="M1056 536C1056 604 470 611 470 434" stroke-dasharray="9 10"/></g>

  <g font-family="Arial,'PingFang SC',sans-serif">
    <rect x="680" y="314" width="224" height="44" rx="22" fill="#EEE9FF"/>
    <text x="792" y="342" text-anchor="middle" fill="#5138B5" font-size="15" font-weight="800">PM / 生态玩家 · 1h–1d 目标</text>
    <text x="58" y="606" fill="#687287" font-size="15">只有同时通过数据可用、组合正确、结果可解释、体验可接受与合规可发布，才应计入“可即时编排”。</text>
  </g>
</svg>
