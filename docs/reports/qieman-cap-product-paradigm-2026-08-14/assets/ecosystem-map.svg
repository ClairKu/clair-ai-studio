<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">且慢 AI 实验室服务生产系统蓝图</title>
  <desc id="desc">业务规则与原子能力进入 AI 编排，经应用搭建和服务样板生成 AI 小顾官方服务与应用广场生态服务。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10182C"/><stop offset="1" stop-color="#1B2641"/></linearGradient>
    <linearGradient id="ai" x1="0" x2="1"><stop stop-color="#7457E8"/><stop offset="1" stop-color="#9A7EF4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050814" flood-opacity=".34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A997F6"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="58" y="62" fill="#B8A7FF" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">AI LAB · SERVICE PRODUCTION SYSTEM</text>
  <text x="58" y="110" fill="#FFF" font-family="Songti SC,STSong,serif" font-size="39" font-weight="600">能力进入系统，服务走向终端与生态</text>
  <text x="1142" y="62" text-anchor="end" fill="#8F9BB1" font-family="Arial,sans-serif" font-size="13" font-weight="700">CONCEPT TARGET · PPT P1</text>

  <g font-family="Arial,'PingFang SC',sans-serif">
    <g transform="translate(58 168)" filter="url(#shadow)">
      <rect width="252" height="124" rx="22" fill="#F7F7FA"/>
      <text x="22" y="30" fill="#7457E8" font-size="13" font-weight="800" letter-spacing="2">BUSINESS KNOWHOW</text>
      <text x="22" y="64" fill="#171A27" font-size="24" font-weight="800">业务规则库</text>
      <text x="22" y="94" fill="#687287" font-size="16">Prompts · Rules · 方法</text>
    </g>
    <g transform="translate(58 314)" filter="url(#shadow)">
      <rect width="252" height="164" rx="22" fill="#F7F7FA"/>
      <text x="22" y="30" fill="#4E93F6" font-size="13" font-weight="800" letter-spacing="2">ATOMIC ABILITIES</text>
      <text x="22" y="64" fill="#171A27" font-size="24" font-weight="800">原子能力池</text>
      <g fill="#EDF3FF" stroke="#C9DBF7"><rect x="22" y="88" width="58" height="28" rx="14"/><rect x="88" y="88" width="62" height="28" rx="14"/><rect x="158" y="88" width="70" height="28" rx="14"/><rect x="22" y="124" width="74" height="28" rx="14"/><rect x="104" y="124" width="52" height="28" rx="14"/><rect x="164" y="124" width="64" height="28" rx="14"/></g>
      <g fill="#305A90" font-size="12" font-weight="700" text-anchor="middle"><text x="51" y="107">数据</text><text x="119" y="107">算法</text><text x="193" y="107">模型</text><text x="59" y="143">工具</text><text x="130" y="143">组件</text><text x="196" y="143">API</text></g>
    </g>

    <g transform="translate(378 196)" filter="url(#shadow)">
      <rect width="250" height="250" rx="34" fill="url(#ai)"/>
      <circle cx="125" cy="82" r="46" fill="#FFF" opacity=".16"/>
      <path d="M92 82h66M125 49v66" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity=".92"/>
      <text x="125" y="158" fill="#FFF" font-size="30" font-weight="800" text-anchor="middle">AI 编排中枢</text>
      <text x="125" y="191" fill="#EEE9FF" font-size="16" text-anchor="middle">理解 · 拆解 · 路由 · 生成</text>
      <rect x="45" y="211" width="160" height="26" rx="13" fill="#FFF" opacity=".15"/>
      <text x="125" y="229" fill="#FFF" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">BOUNDARY + ORCHESTRATION</text>
    </g>

    <g transform="translate(696 162)" filter="url(#shadow)">
      <rect width="224" height="140" rx="22" fill="#FFF"/>
      <text x="22" y="31" fill="#7457E8" font-size="13" font-weight="800" letter-spacing="2">WORKSHOP</text>
      <text x="22" y="67" fill="#171A27" font-size="25" font-weight="800">应用搭建车间</text>
      <text x="22" y="100" fill="#687287" font-size="16">Functions · Applications</text>
      <text x="22" y="123" fill="#687287" font-size="14">PM / 生态玩家生成服务</text>
    </g>
    <g transform="translate(696 326)" filter="url(#shadow)">
      <rect width="224" height="140" rx="22" fill="#FFF"/>
      <text x="22" y="31" fill="#F08D62" font-size="13" font-weight="800" letter-spacing="2">BLUEPRINTS</text>
      <text x="22" y="67" fill="#171A27" font-size="25" font-weight="800">功能 / 服务样板</text>
      <text x="22" y="100" fill="#687287" font-size="16">Templates · Blueprints</text>
      <text x="22" y="123" fill="#687287" font-size="14">标准范例与可复用逻辑</text>
    </g>

    <g transform="translate(980 162)" filter="url(#shadow)">
      <rect width="162" height="140" rx="22" fill="#EDE9FF"/>
      <text x="81" y="30" fill="#7457E8" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
      <text x="81" y="68" fill="#171A27" font-size="24" font-weight="800" text-anchor="middle">AI 小顾</text>
      <text x="81" y="97" fill="#5138B5" font-size="15" text-anchor="middle">官方最佳范例</text>
      <text x="81" y="121" fill="#687287" font-size="13" text-anchor="middle">Blueprint + AI</text>
    </g>
    <g transform="translate(980 326)" filter="url(#shadow)">
      <rect width="162" height="140" rx="22" fill="#FFF0E9"/>
      <text x="81" y="30" fill="#D86E42" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">ECOSYSTEM</text>
      <text x="81" y="68" fill="#171A27" font-size="24" font-weight="800" text-anchor="middle">应用广场</text>
      <text x="81" y="97" fill="#A24C2A" font-size="15" text-anchor="middle">发布 · 订阅 · 复用</text>
      <text x="81" y="121" fill="#687287" font-size="13" text-anchor="middle">更多服务与投资人</text>
    </g>
  </g>

  <g fill="none" stroke="#A997F6" stroke-width="4" marker-end="url(#arrow)" opacity=".92">
    <path d="M310 230H360"/><path d="M310 396H360"/><path d="M628 321H674"/><path d="M920 232H958"/><path d="M920 396H958"/>
  </g>
  <path d="M1062 484 C920 584 470 602 190 496" fill="none" stroke="#F08D62" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)" opacity=".8"/>

  <g transform="translate(58 538)" font-family="Arial,'PingFang SC',sans-serif">
    <text x="0" y="0" fill="#8F9BB1" font-size="12" font-weight="800" letter-spacing="2">CO-PRODUCERS</text>
    <g transform="translate(0 18)" fill="#26324E" stroke="#3B4968"><rect width="196" height="48" rx="16"/><rect x="210" width="196" height="48" rx="16"/><rect x="420" width="256" height="48" rx="16"/><rect x="690" width="210" height="48" rx="16"/></g>
    <g transform="translate(0 49)" fill="#D8DEEA" font-size="14" font-weight="700" text-anchor="middle"><text x="98">且慢同路人 / PM</text><text x="308">开发者 / 系统商</text><text x="548">大 V / 主理人 / 金融机构</text><text x="795">用户 / 更多投资人</text></g>
    <text x="930" y="50" fill="#F1A17F" font-size="13" font-weight="700">使用反馈回流能力与规则</text>
  </g>
</svg>
