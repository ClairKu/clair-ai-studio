<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 服务关系图</title>
  <desc id="desc">按原图关系重绘的盈米 AI 服务关系图，节点、内容、箭头和反馈闭环保持不变。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaff"/><stop offset="1" stop-color="#f0edfa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5b3dcc"/><stop offset=".62" stop-color="#8067e8"/><stop offset="1" stop-color="#a28cff"/>
    </linearGradient>
    <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff6f1"/><stop offset=".46" stop-color="#fff"/><stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef5ff"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#35266f" flood-opacity=".12"/>
    </filter>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#7457e8"/></marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#4d7fd1"/></marker>
    <style>
      text{font-family:"Songti SC","STSong","SimSun",serif;fill:#222338}
      .h1{font-size:34px;font-weight:700}.sub{font-size:14px;fill:#6c7185}.kicker{font-size:11px;font-weight:700;letter-spacing:2px;fill:#7457e8}
      .box{fill:#fff;stroke:#d9d3ea;stroke-width:1.2}.box-v{fill:url(#violet);stroke:#7457e8}.box-lab{fill:url(#lab);stroke:#e2a782;stroke-width:1.25}.box-blue{fill:url(#blueSoft);stroke:#9ebfeb;stroke-width:1.2}
      .label{font-size:15px;font-weight:700}.label-v{font-size:21px;font-weight:700;fill:#fff}.small{font-size:11px;fill:#6f7589}.small-v{font-size:11px;fill:#ebe6ff}.tiny{font-size:9.5px;fill:#7c8294}
      .pill{fill:#faf9fe;stroke:#ded9ef}.pill-o{fill:#fff7f1;stroke:#f2b895}.pill-b{fill:#f2f7ff;stroke:#b8ceee}.pill-v{fill:#eeeaff;stroke:#d3c9ff}
      .pillText{font-size:10px;fill:#5b6173}.pillTextO{font-size:10px;fill:#d5622e}.pillTextB{font-size:10px;fill:#426da8}.num{font-size:22px;font-weight:700;fill:#7457e8}.numO{font-size:22px;font-weight:700;fill:#f1783c}
      .lineV{fill:none;stroke:#7457e8;stroke-width:1.8;marker-end:url(#arrowV)}.lineB{fill:none;stroke:#4d7fd1;stroke-width:1.7;marker-end:url(#arrowB)}.dash{stroke-dasharray:5 6}
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#paper)"/>
  <circle cx="1120" cy="32" r="150" fill="#fff" opacity=".58"/>
  <text x="640" y="42" text-anchor="middle" class="h1">盈米 AI 服务关系图</text>
  <text x="640" y="68" text-anchor="middle" class="sub">围绕 AI开放平台、AI实验室、AI工作台 与 AI小顾，形成创作—发布—分发—使用—反馈闭环。</text>

  <!-- 服务角色 -->
  <g filter="url(#shadow)">
    <rect x="28" y="146" width="168" height="348" rx="22" class="box"/>
    <rect x="42" y="164" width="140" height="44" rx="12" fill="#f3f0fb"/>
    <text x="58" y="191" class="label" fill="#5c48bd">服务角色</text>
    <rect x="43" y="230" width="138" height="106" rx="16" class="pill-o"/>
    <circle cx="70" cy="267" r="17" fill="#ff7a3d"/><text x="70" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">创</text>
    <text x="98" y="264" class="label" fill="#d9642d">创作者</text>
    <text x="98" y="285" class="small">运营 / 产品 / 业务</text>
    <rect x="43" y="365" width="138" height="106" rx="16" class="pill-b"/>
    <circle cx="70" cy="402" r="17" fill="#4f83db"/><text x="70" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">用</text>
    <text x="98" y="399" class="label" fill="#426fae">使用者</text>
    <text x="98" y="420" class="small">顾问 / 员工 / 用户</text>
  </g>

  <!-- AI开放平台 -->
  <g filter="url(#shadow)">
    <rect x="274" y="104" width="686" height="102" rx="22" class="box-v"/>
    <circle cx="324" cy="155" r="26" fill="#fff" opacity=".16"/>
    <path d="M306 155h36M324 137c-8 8-8 28 0 36M324 137c8 8 8 28 0 36M308 145h32M308 165h32" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="365" y="143" class="label-v">AI开放平台（OAP 官网）</text>
    <text x="365" y="168" class="small-v">统一入口 · 品牌展示 · 开发者 / 创作者入口</text>
    <g>
      <rect x="365" y="177" width="88" height="20" rx="10" fill="#fff" opacity=".15"/><text x="409" y="191" text-anchor="middle" font-size="9.5" fill="#fff">官网入口</text>
      <rect x="463" y="177" width="88" height="20" rx="10" fill="#fff" opacity=".15"/><text x="507" y="191" text-anchor="middle" font-size="9.5" fill="#fff">开放能力</text>
      <rect x="561" y="177" width="88" height="20" rx="10" fill="#fff" opacity=".15"/><text x="605" y="191" text-anchor="middle" font-size="9.5" fill="#fff">应用入口</text>
    </g>
  </g>

  <!-- AI实验室 -->
  <g filter="url(#shadow)">
    <rect x="274" y="240" width="686" height="210" rx="22" class="box-lab"/>
    <rect x="858" y="230" width="76" height="26" rx="13" fill="#7457e8"/><text x="896" y="247" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">规划中</text>
    <text x="617" y="274" text-anchor="middle" font-size="22" font-weight="700" fill="#7443c8">AI实验室</text>
    <text x="617" y="296" text-anchor="middle" class="small">低代码搭建 AI 应用，后续将与 OAP 官网融合</text>
    <rect x="298" y="316" width="309" height="114" rx="17" fill="#fffaf7" stroke="#efb18e"/>
    <text x="452" y="343" text-anchor="middle" class="label" fill="#d9632d">创作界面</text>
    <text x="452" y="363" text-anchor="middle" class="small">面向创作者</text>
    <rect x="315" y="377" width="120" height="22" rx="11" class="pill-o"/><text x="375" y="392" text-anchor="middle" class="pillTextO">搭建 Agent</text>
    <rect x="445" y="377" width="142" height="22" rx="11" class="pill-o"/><text x="516" y="392" text-anchor="middle" class="pillTextO">编排 Workflow</text>
    <rect x="315" y="403" width="143" height="22" rx="11" class="pill-o"/><text x="386" y="418" text-anchor="middle" class="pillTextO">配置 Skills / MCP</text>
    <rect x="468" y="403" width="119" height="22" rx="11" class="pill-o"/><text x="527" y="418" text-anchor="middle" class="pillTextO">测试发布</text>
    <rect x="627" y="316" width="309" height="114" rx="17" fill="#f8fbff" stroke="#a9c5eb"/>
    <text x="781" y="343" text-anchor="middle" class="label" fill="#426fae">使用界面</text>
    <text x="781" y="363" text-anchor="middle" class="small">面向使用者</text>
    <rect x="644" y="377" width="120" height="22" rx="11" class="pill-b"/><text x="704" y="392" text-anchor="middle" class="pillTextB">浏览应用</text>
    <rect x="774" y="377" width="142" height="22" rx="11" class="pill-b"/><text x="845" y="392" text-anchor="middle" class="pillTextB">试用体验</text>
    <rect x="644" y="403" width="120" height="22" rx="11" class="pill-b"/><text x="704" y="418" text-anchor="middle" class="pillTextB">收藏启用</text>
    <rect x="774" y="403" width="142" height="22" rx="11" class="pill-b"/><text x="845" y="418" text-anchor="middle" class="pillTextB">像电商一样使用</text>
  </g>

  <!-- AI工作台 -->
  <g filter="url(#shadow)">
    <rect x="274" y="486" width="686" height="86" rx="20" class="box-blue"/>
    <text x="617" y="517" text-anchor="middle" font-size="20" font-weight="700" fill="#4a70bc">AI工作台</text>
    <text x="617" y="537" text-anchor="middle" class="small">个人 / 团队工作环境</text>
    <rect x="392" y="544" width="102" height="20" rx="10" class="pill-b"/><text x="443" y="558" text-anchor="middle" class="pillTextB">我的应用</text>
    <rect x="504" y="544" width="102" height="20" rx="10" class="pill-b"/><text x="555" y="558" text-anchor="middle" class="pillTextB">团队应用</text>
    <rect x="616" y="544" width="102" height="20" rx="10" class="pill-b"/><text x="667" y="558" text-anchor="middle" class="pillTextB">场景入口</text>
    <rect x="728" y="544" width="102" height="20" rx="10" class="pill-b"/><text x="779" y="558" text-anchor="middle" class="pillTextB">消息协作</text>
  </g>

  <!-- 应用 -->
  <g filter="url(#shadow)">
    <rect x="222" y="614" width="232" height="70" rx="18" fill="#fff8f4" stroke="#ef9a70" stroke-width="1.3"/>
    <circle cx="258" cy="649" r="20" fill="#ff7a3d" opacity=".13"/><text x="258" y="655" text-anchor="middle" font-size="15" font-weight="700" fill="#e66b32">AI</text>
    <text x="289" y="643" class="label" fill="#dc672f">AI小顾</text><text x="289" y="663" class="small">官方旗舰智能体</text>
    <rect x="477" y="614" width="232" height="70" rx="18" class="box"/>
    <circle cx="513" cy="649" r="20" fill="#7457e8" opacity=".12"/><text x="513" y="655" text-anchor="middle" font-size="15" font-weight="700" fill="#7457e8">AI</text>
    <text x="544" y="643" class="label" fill="#6249c8">自建 AI 应用</text><text x="544" y="663" class="small">由创作者搭建并分发</text>
    <rect x="732" y="614" width="252" height="70" rx="18" class="box"/>
    <circle cx="768" cy="649" r="20" fill="#4f83db" opacity=".12"/><text x="768" y="655" text-anchor="middle" font-size="15" font-weight="700" fill="#4f83db">专</text>
    <text x="799" y="643" class="label" fill="#426fae">专家 Agent / 行业应用</text><text x="799" y="663" class="small">策略、投顾、内容等场景</text>
  </g>

  <!-- 主关系线 -->
  <path d="M617 206V236" class="lineV"/>
  <path d="M196 283H270" class="lineB"/>
  <path d="M196 418C220 418 234 374 270 374" class="lineB"/>
  <path d="M617 450V481" class="lineV"/><text x="630" y="472" class="tiny" fill="#7457e8">发布 / 分发</text>
  <path d="M617 572V592H338V610" class="lineB"/>
  <path d="M617 592V610" class="lineB"/>
  <path d="M617 592H858V610" class="lineB"/>

  <!-- 反馈闭环 -->
  <path d="M984 649C1030 649 1036 520 1036 414C1036 328 1018 287 963 287" class="lineV"/>
  <path d="M936 386C1000 386 1014 346 963 346" class="lineV"/>
  <circle cx="1028" cy="360" r="27" fill="#fff" stroke="#cfc5ef"/><path d="M1017 366l9-10 7 7 11-13" fill="none" stroke="#7457e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1028" y="404" text-anchor="middle" class="tiny" fill="#7457e8">使用反馈 /</text><text x="1028" y="419" text-anchor="middle" class="tiny" fill="#7457e8">数据沉淀 /</text><text x="1028" y="434" text-anchor="middle" class="tiny" fill="#7457e8">迭代优化</text>

  <!-- 关系说明 -->
  <g filter="url(#shadow)">
    <rect x="1070" y="146" width="182" height="538" rx="22" class="box"/>
    <text x="1092" y="181" class="label" fill="#5f49c3">关系说明</text>
    <line x1="1092" y1="195" x2="1230" y2="195" stroke="#e3dfef"/>
    <g transform="translate(0 0)"><text x="1092" y="236" class="num">01</text><text x="1132" y="225" font-size="11" font-weight="700" fill="#5d48bd">AI开放平台：</text><text x="1132" y="243" class="tiny">承载官网与统一入口</text></g>
    <g transform="translate(0 88)"><text x="1092" y="236" class="numO">02</text><text x="1132" y="225" font-size="11" font-weight="700" fill="#d96831">AI实验室：</text><text x="1132" y="243" class="tiny">支持低代码搭建与</text><text x="1132" y="258" class="tiny">应用管理</text></g>
    <g transform="translate(0 188)"><text x="1092" y="236" class="num">03</text><text x="1132" y="225" font-size="11" font-weight="700" fill="#5d48bd">双界面：</text><text x="1132" y="243" class="tiny">区分创作与使用</text><text x="1132" y="258" class="tiny">两种体验形态</text></g>
    <g transform="translate(0 288)"><text x="1092" y="236" class="num">04</text><text x="1132" y="225" font-size="11" font-weight="700" fill="#5d48bd">AI工作台：</text><text x="1132" y="243" class="tiny">承接应用分发与</text><text x="1132" y="258" class="tiny">工作环境使用</text></g>
    <g transform="translate(0 397)"><text x="1092" y="236" class="numO">05</text><text x="1132" y="225" font-size="11" font-weight="700" fill="#d96831">AI小顾：</text><text x="1132" y="243" class="tiny">旗舰应用，也可作为</text><text x="1132" y="258" class="tiny">实验室分发应用之一</text></g>
  </g>
</svg>
