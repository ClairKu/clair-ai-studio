  <script type="application/json" id="report-data">{"meta":{"title":"个人理财 Agent 候选作品测评","subtitle":"从能跑、能答到能安全交付：全场景实测、金融事实复核与录用建议","eyebrow":"CANDIDATE WORK SAMPLE · AGENT EVALUATION","date":"2026-08-10","cutoff":"仓库 master@7f117a1 · 2026-08-10 评测","owner":"Clair AI Studio","confidentiality":"候选作品技术评测 · 公开仓库证据","accent":"#e26a3f","downloadUrl":"./evidence-appendix.md","downloadLabel":"下载完整测试证据附录"},"hero":{"conclusion":"45/100：复杂系统与场景搭建能力突出，但金融答案、移动端、安全与可复现交付存在生产阻断；适合有条件复试，不宜仅凭本作品认定其可独立负责 C 端金融 Agent 上线。","thesis":"作品覆盖画像、规划、持仓、基金、报告、定时任务与多类设置，代码量和架构完整度高；但当前干净环境无法按 README 完成端到端启动，官方测试大量失败，货币基金指标语义错误，直接问答泄露模板占位语，云端设置还可能把密钥与用户数据暴露给匿名角色。","badges":["45 / 100","全场景覆盖","P0 安全与数据语义","强原型 · 弱交付"]},"sections":[{"id":"decision","kicker":"01 · HIRING DECISION","title":"有条件复试，不作上线背书","lead":"这不是一个低水平作品：候选人能把多 Agent、工具层、知识库、工作流和页面拼成大系统；问题在于最关键的最后一公里——答案是否对、系统是否安全、别人能否稳定跑起来。","layout":"cards","tone":"light","items":[{"index":"A","eyebrow":"BEST FIT","title":"适合 AI 应用原型与复杂流程搭建","body":"场景拆解、目录组织、工具抽象、人机确认节点和基金知识库设计明显高于普通 Demo，能迅速把业务概念变成可操作产品骨架。","bullets":["529 个 src 文件","107 个单测文件","画像—规划—持仓—基金多场景"],"status":"confirmed","source":"公开仓库源码与本地构建审计 · 2026-08-10"},{"index":"B","eyebrow":"NOT YET PROVEN","title":"尚未证明生产级 Agent 交付能力","body":"官方路径依赖缺失、CI 分支配置失效、22 个单测失败、移动端不可用；关键基金问题虽返回内容，却不稳定返回用户真正要的结论。","bullets":["README 命令缺失","E2E 被未配置模型阻塞","金融问答检索命中不等于答案正确"],"status":"confirmed","source":"README、package scripts、Vitest、Playwright 与浏览器实测 · 2026-08-10"},{"index":"C","eyebrow":"ROLE BAR","title":"岗位不同，结论不同","body":"若岗位偏快速原型、AI 产品工程，可进入带修复任务的复试；若岗位要求独立承担 C 端金融 Agent、全栈生产或安全负责人，本作品当前不通过。","bullets":["复试看修复与解释能力","不以代码量代替质量判断","不连接真实客户数据或生产密钥"],"status":"inferred"}],"callout":{"label":"一句话画像","text":"强在把“大系统做出来”，弱在把“关键答案做对、把系统安全稳定交给别人”。","status":"inferred"}},{"id":"score","kicker":"02 · SCORECARD","title":"总分 45，短板集中在底线项","lead":"评分不是对代码规模的奖励，而是按用户价值、金融正确性、工程可复现、安全与体验的生产门槛加权。任一 P0 都足以阻断上线。","layout":"metrics","tone":"soft","items":[{"metric":"12/15","title":"产品与场景设计","body":"场景广、流程深、对象模型完整；能看出对个人理财任务链的系统理解。","meta":"源码、路由与页面盘点","status":"confirmed"},{"metric":"8/15","title":"Agent 编排","body":"场景内规划较完整；自由对话对“分析持仓”“解读基金”的跨场景路由漏判。","meta":"15 条确定性 planner 用例","status":"confirmed"},{"metric":"5/20","title":"金融事实与语义","body":"部分净值、回撤和费率可取到；货币基金把万份收益当净值并计算出 -15.4% 收益、-59.8% 回撤。","meta":"3 只基金 × 3 类问题 + 盈米 MCP 复核","status":"confirmed"},{"metric":"5/15","title":"答案质量","body":"基金问答常返回 1,400—2,200 字原文，并出现“用 L0”“从风险揭示摘”等内部模板语。","meta":"9 次确定性基金问答","status":"confirmed"},{"metric":"9/15","title":"工程质量","body":"生产构建通过、测试量可观；但 22 个单测失败，CI 不触发默认分支且 README 无法复现。","meta":"构建、Vitest、GitHub Actions 与文档审计","status":"confirmed"},{"metric":"4/10","title":"体验与响应式","body":"桌面端信息架构清晰；390px 下固定 320px 侧栏把主区挤成约 70px。","meta":"1440×900 与 390×844 浏览器实测","status":"confirmed"},{"metric":"2/10","title":"安全与可交付","body":"无用户鉴权，云端 anon 可读全表；模型 key、service role 与数据库密码均存在明文路径。","meta":"API、设置模块与 Supabase migration 审计","status":"confirmed"}],"callout":{"label":"总分","text":"45 / 100。不是“功能少”，而是底线项失败：金融数据语义、安全、移动端与可复现交付。","status":"confirmed"}},{"id":"lab","kicker":"03 · RUNTIME LAB","title":"能编译，不等于能完整跑通","lead":"在全新目录、Node 24.3 / npm 11.4.2、无 Docker、无候选人本地密钥的环境中按公开材料复现；所有缺失依赖均按“未验证”处理，没有用模拟成功代替真实通过。","layout":"metrics","tone":"dark","items":[{"metric":"PASS","title":"生产构建","body":"npm run build 编译、类型检查与静态生成通过。","meta":"master@7f117a1 · 2026-08-10","status":"confirmed"},{"metric":"539/562","title":"单元测试通过","body":"22 失败、1 跳过；失败含缺样例文件、server-only 解析与解析器/默认配置回归。","meta":"107 个 Vitest 文件","status":"confirmed"},{"metric":"10/52","title":"官方 E2E 通过","body":"30 失败、2 跳过、10 未执行；主流程多被缺配置、种子失败与禁用输入框阻断。","meta":"Playwright · 15.7 分钟","status":"confirmed"},{"metric":"19","title":"依赖漏洞","body":"1 low、7 moderate、11 high；Next、js-yaml、hyperframes、xlsx 等链路受影响。","meta":"npm audit · 干净安装","status":"confirmed"},{"metric":"BROKEN","title":"官方快速开始","body":"README 中 supabase:sync-settings、data:init、env:bootstrap 均不存在；当前机器也无 Docker。","meta":"README 与 package.json 对照","status":"confirmed"}],"callout":{"label":"官方 E2E","text":"52 条 Playwright 用例：10 通过、30 失败、2 跳过、10 未执行，耗时 15.7 分钟。失败覆盖画像、规划、持仓、报告与流水线锁等主流程。","status":"confirmed"}},{"id":"coverage","kicker":"04 · SCENARIO COVERAGE","title":"九类使用面均已覆盖","lead":"“覆盖”指每一场景都做了运行态、确定性逻辑或源码审计；只有真实完成才记通过，因模型、数据库或样例缺失而中断的链路均保留为阻塞证据。","layout":"comparison","tone":"light","items":[{"index":"01","eyebrow":"CHAT","title":"自由对话：部分通过","body":"能力介绍与需求梳理可规划；“分析持仓”“解读 019305”仍落到 simple_qa，未跨场景交接。","bullets":["UI 可加载","模型未就绪时输入禁用","跨场景召回不足"],"source":"15 条 planner 用例与浏览器实测","status":"confirmed"},{"index":"02","eyebrow":"PROFILE","title":"画像：部分通过","body":"键值解析能提取核心字段，但常见同义字段被列为 unknown；非法数值 abc 被转成 0，可能污染用户画像。","bullets":["正式流程可规划","输入容错不稳","E2E 未跑通"],"source":"profile parser 确定性用例","status":"confirmed"},{"index":"03","eyebrow":"PLAN","title":"规划：流程有，闭环缺","body":"大类配置、基金明细与替换均能生成步骤；README/E2E 示例缺“计划开始日期”即解析失败，字段契约未对齐。","bullets":["步骤设计完整","样例与解析器冲突","依赖画像与数据库"],"source":"planner、goal parser 与官方 E2E 样例","status":"confirmed"},{"index":"04","eyebrow":"PORTFOLIO","title":"持仓：生产链路阻塞","body":"读仓、行情同步、报告草拟与核验均有规划；普通管道表格在真实调用中仍先要求推理模型，官方 E2E 多次超时。","bullets":["工作流深","确定性格式不应依赖 LLM","全角/空白兼容未被真实证明"],"source":"holdings parser 与官方 Playwright","status":"confirmed"},{"index":"05","eyebrow":"FUND","title":"基金：能检索，答不好","body":"本地知识库、L0 与引用链可工作；9 次问答显示费用、业绩、风险的片段选择与答案合成不稳定。","bullets":["14 基金 / 141 文档 / 355 chunks","019305 指标部分可复核","000198 出现 P0 语义错误"],"source":"fund_matrix.ts 与浏览器实测","status":"confirmed"},{"index":"06","eyebrow":"REPORTS","title":"报告：页面通过，生成未闭环","body":"报告列表与查看页可访问；上游画像、规划、持仓链路未在干净环境完成，因此不能证明端到端产出。","bullets":["桌面 UI 正常","移动端严重挤压","依赖数据库与模型"],"status":"confirmed"},{"index":"07","eyebrow":"SCHEDULED","title":"定时任务：壳层可用","body":"任务页与部分 API smoke 可加载；数据库种子与真实调度执行未完成，不能把列表展示视为任务可靠运行。","bullets":["UI 可访问","执行证据缺失","恢复与幂等未实测"],"status":"confirmed"},{"index":"08","eyebrow":"SETTINGS","title":"设置：功能广但风险高","body":"模型、数据库、数据源和记忆页均可打开；密钥字段命名为 encrypted 却直接保存原值，数据库凭据还有文件与云端双写路径。","bullets":["配置面完整","就绪门禁明确","秘密管理不合格"],"status":"confirmed"},{"index":"09","eyebr   <script>
    const report=JSON.parse(document.getElementById("report-data").textContent);
    const $=(selector,scope=document)=>scope.querySelector(selector);
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const statusLabel={confirmed:"已确认",inferred:"判断",missing:"待补",target:"目标态"};
    const status=value=>value?`<span class="status ${esc(value)}">${esc(statusLabel[value]||value)}</span>`:"";
    const bullets=items=>Array.isArray(items)&&items.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`:"";
    const common=item=>`${item.index?`<span class="item-index">${esc(item.index)}</span>`:""}${item.eyebrow?`<span class="item-eyebrow">${esc(item.eyebrow)}</span>`:""}${item.metric?`<strong class="metric">${esc(item.metric)}</strong>`:""}<h3>${esc(item.title)}</h3>${item.body?`<p class="item-body">${esc(item.body)}</p>`:""}${item.meta?`<span class="item-meta">${esc(item.meta)}</span>`:""}${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}${status(item.status)}`;
    const card=(item,index)=>`<article class="item reveal" style="--n:${index}">${common(item)}</article>`;
    function evidence(item){return `<article class="item reveal"><figure>${item.image?`<img src="${esc(item.image)}" alt="${esc(item.alt||item.title)}" loading="lazy">`:`<div class="evidence-placeholder">SOURCE / EVIDENCE</div>`}</figure><div class="evidence-copy">${common(item)}</div></article>`}
    function demo(section){const tabs=section.items.map((item,index)=>`<button class="demo-tab ${index===0?"active":""}" type="button" data-demo-tab="${index}"><b>${esc(item.title)}</b><span>${esc(item.eyebrow||item.meta||"")}</span></button>`).join("");const panels=section.items.map((item,index)=>`<article class="demo-panel ${index===0?"active":""}" data-demo-panel="${index}"><div class="demo-visual"><span class="item-index">${esc(item.index||String(index+1).padStart(2,"0"))}</span><span class="item-eyebrow">${esc(item.eyebrow||"SCENE")}</span><h3>${esc(item.title)}</h3>${status(item.status)}</div><div><span class="item-eyebrow">${esc(item.meta||"EXPERIENCE WALKTHROUGH")}</span><h3>${esc(item.title)}</h3><p>${esc(item.body||"")}</p>${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}</div></article>`).join("");return `<div class="items demo reveal"><div class="demo-tabs">${tabs}</div><div class="demo-stage">${panels}</div></div>`}
    const number=value=>new Intl.NumberFormat("zh-CN").format(Number(value)||0);
    function usageDashboard(section){const types=Array.isArray(section.institutionTypes)?section.institutionTypes:[];const institutions=Array.isArray(section.items)?section.items:[];const tools=Array.isArray(section.mcpTools)?section.mcpTools:[];const max=Math.max(1,...tools.map(tool=>Number(tool.calls)||0));const meta=section.mcpMeta||{};const typeMarkup=types.map(item=>`<article class="usage-type"><strong>${esc(item.count)}</strong><b>${esc(item.label)}</b><span title="${esc(item.names)}">${esc(item.names)}</span>${item.note?`<em>${esc(item.note)}</em>`:""}</article>`).join("");const institutionMarkup=institutions.map(item=>`<article class="usage-highlight"><span class="usage-highlight-index">${esc(item.index)}</span><h4 title="${esc(item.title)}">${esc(item.title)}</h4><strong>${esc(item.metric)}</strong><span class="usage-highlight-meta">${esc(item.meta)}</span><span class="usage-highlight-tag">${esc(item.eyebrow)}</span></article>`).join("");const toolMarkup=tools.map(tool=>{const percent=Math.max(0,Math.min(100,(Number(tool.calls)||0)/max*100));return `<div class="mcp-tool"><span class="mcp-tool-rank">${String(Number(tool.rank)||0).padStart(2,"0")}</span><span class="mcp-tool-name" title="${esc(tool.name)}">${esc(tool.name)}</span><span class="mcp-track" role="img" aria-label="${esc(tool.name)}调用 ${number(tool.calls)} 次"><span class="mcp-fill" style="--bar:${percent.toFixed(2)}%"></span></span><strong class="mcp-tool-value">${number(tool.calls)}</strong></div>`}).join("");return `<div class="usage-dashboard reveal"><section class="usage-panel"><header class="usage-panel-head"><div><h3>机构覆盖与标杆样板</h3><p>总家数 + 代表机构；重点样板保留调用与用户数</p></div>${status("confirmed")}</header><div class="usage-types">${typeMarkup}</div><div class="usage-subhead"><b>值得关注的 8 家机构</b><span>深度集成 · 团队渗透 · 类目头部</span></div><div class="usage-highlights">${institutionMarkup}</div><span class="usage-source">来源：Stargate 机构使用统计截图 · 最近调用截至 2026-08-02</span></section><section class="usage-panel tools"><header class="usage-panel-head"><div><h3>总体 MCP 工具调用 TOP20</h3><p>当前截图可见 ${esc(meta.visible||tools.length)} / ${esc(meta.requested||20)} 项 · ${esc(meta.period||"统计周期待补")}</p></div>${status("confirmed")}</header><div class="mcp-insight"><b>基金诊断</b><strong>${number(tools[0]?.calls)}</strong><span>${esc(meta.insight||"")}</span></div><div class="mcp-tool-list">${toolMarkup}</div><div class="mcp-pending"><span>16—20 名：数据待补，不补造</span><span>横条按真实调用量线性绘制</span></div></section></div>`}
    function sectionMarkup(section,index){const tone=section.tone||"light";const content=section.layout==="demo"?demo(section):section.layout==="usage-dashboard"?usageDashboard(section):`<div class="items ${esc(section.layout)}">${section.items.map((item,itemIndex)=>section.layout==="evidence"?evidence(item):card(item,itemIndex)).join("")}</div>`;const callout=section.callout?`<div class="callout reveal"><b>${esc(section.callout.label||"KEY TAKEAWAY")}</b><p>${esc(section.callout.text)}</p>${status(section.callout.status)}</div>`:"";return `<section class="section ${esc(tone)}" id="${esc(section.id)}"><div class="wrap"><header class="section-head reveal"><div><div class="kicker">${esc(section.kicker||String(index+1).padStart(2,"0"))}</div><h2>${esc(section.title)}</h2></div><p class="lead">${esc(section.lead||"")}</p></header>${content}${callout}</div></section>`}
    document.documentElement.style.setProperty("--accent",report.meta?.accent||"#8067e8");
    document.title=report.meta?.title||"Clair Executive Visual Report";
    $("meta[name=description]").content=report.hero?.conclusion||report.meta?.subtitle||"Clair Executive Visual Report";
    $("#hero-eyebrow").textContent=report.meta?.eyebrow||"CLAIR · EXECUTIVE REPORT";
    $("#hero-title").innerHTML=esc(report.meta?.title||"").replace(/\s*[｜|]\s*/,"<br><em>")+((report.meta?.title||"").match(/[｜|]/)?"</em>":"");
    $("#hero-subtitle").textContent=report.meta?.subtitle||"";
    $("#hero-conclusion").textContent=report.hero?.conclusion||"";
    $("#hero-thesis").textContent=report.hero?.thesis||"";
    $("#hero-badges").innerHTML=(report.hero?.badges||[]).map(value=>`<span class="badge">${esc(value)}</span>`).join("");
    $("#hero-actions").innerHTML=report.meta?.downloadUrl?`<a class="download-button" href="${esc(report.meta.downloadUrl)}" download>${esc(report.meta.downloadLabel||"下载交付物")}</a>`:"";
    $("#hero-meta").innerHTML=[["报告日期",report.meta?.date],["材料截止",report.meta?.cutoff],["责任方",report.meta?.owner],["范围",report.meta?.confidentiality]].filter(([,value])=>value).map(([label,value])=>`<div><b>${esc(label)}</b><span>${esc(value)}</span></div>`).join("");
    $("#main").innerHTML=(report.sections||[]).map(sectionMarkup).join("");
    $("#chapter-nav").innerHTML=(report.sections||[]).map((section,index)=>`<a href="#${esc(section.id)}"><span>${String(index+1).padStart(2,"0")}</span> ${esc(section.title)}</a>`).join("")+`<a href="#sources">证据边界</a>`;
    $("#source-list").innerHTML=(report.sources||[]).length?(report.sources||[]).map((source,index)=>`<div class="source"><b>${String(index+1).padStart(2,"0")} · ${esc(source.label||source.title||"来源")}</b><span>${esc(source.detail||source.url||"")}</span></div>`).join(""):`<div class="source"><b>暂无外部来源</b><span>请在 report.json 中补充来源、版本与日期。</span></div>`;
    $("#question-list").innerHTML=(report.openQuestions||[]).length?(report.openQuestions||[]).map((question,index)=>`<div class="question"><b>${String(index+1).padStart(2,"0")} · ${esc(question.title||"待确认")}</b><span>${esc(question.detail||question.body||"")}</span></div>`).join(""):`<div class="question"><b>当前无公开待确认项</b><span>仍需在发布前复核材料权限、敏感性与最新版本。</span></div>`;
    $("#footer-left").textContent=`${report.meta?.title||"报告"} · 截至 ${report.meta?.cutoff||"待确认"}`;
    const panels=[$("#top"),...document.querySelectorAll("main>section"),$("#sources")];
    const panelLabels=["报告封面",...(report.sections||[]).map(section=>section.title),"证据边界"];
    const chapterNav=$("#chapter-nav");
    const navLinks=[...document.querySelectorAll(".chapter-nav a")];
    const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    let activePanelIndex=0;
    let scrollFrame=0;
    let navigating=false;
    let restoreScrollStyles=null;
    const syncChapterNav=()=>{const panel=panels[activePanelIndex];const href=panel?.id==="top"?null:`#${panel?.id}`;let activeLink=null;navLinks.forEach(link=>{const active=link.getAttribute("href")===href;link.classList.toggle("active",active);if(active)activeLink=link});let left=0;if(activeLink){const navRect=chapterNav.getBoundingClientRect();const linkRect=activeLink.getBoundingClientRect();const linkCenter=linkRect.left-navRect.left+chapterNav.scrollLeft+linkRect.width/2;left=linkCenter-chapterNav.clientWidth/2}chapterNav.scrollTo({left:Math.max(0,left),behavior:reducedMotion?"auto":"smooth"})};
    const setActivePanel=index=>{activePanelIndex=Math.max(0,Math.min(panels.length-1,index));document.querySelectorAll("[data-page-index]").forEach(node=>node.classList.toggle("active",Number(node.dataset.pageIndex)===activePanelIndex));$("#page-counter").textContent=`${String(activePanelIndex+1).padStart(2,"0")} / ${String(panels.length).padStart(2,"0")}`;syncChapterNav()};
    const cancelPanelNavigation=()=>{if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=0;navigating=false;if(restoreScrollStyles){restoreScrollStyles();restoreScrollStyles=null}};
    const goToPanel=index=>{cancelPanelNavigation();const target=Math.max(0,Math.min(panels.length-1,index));const panel=panels[target];const navOffset=panel.id==="top"?0:$("#nav-shell").offsetHeight;const targetY=Math.max(0,panel.offsetTop-navOffset);const startY=scrollY;const distance=targetY-startY;setActivePanel(target);if(reducedMotion||Math.abs(distance)<2){scrollTo(0,targetY);return}const root=document.documentElement;const previousBehavior=root.style.scrollBehavior;const previousSnap=root.style.scrollSnapType;root.style.scrollBehavior="auto";root.style.scrollSnapType="none";restoreScrollStyles=()=>{root.style.scrollBehavior=previousBehavior;root.style.scrollSnapType=previousSnap};navigating=true;const started=performance.now();const duration=Math.min(520,320+Math.abs(distance)*.018);const tick=now=>{const progress=Math.min(1,(now-started)/duration);const eased=1-Math.pow(1-progress,4);scrollTo(0,startY+distance*eased);if(progress<1){scrollFrame=requestAnimationFrame(tick);return}scrollTo(0,targetY);scrollFrame=0;navigating=false;restoreScrollStyles();restoreScrollStyles=null};scrollFrame=requestAnimationFrame(tick)};
    $("#page-rail").innerHTML=panels.map((panel,index)=>`<button class="page-dot${index===0?" active":""}" type="button" data-page-index="${index}" aria-label="跳转到第 ${index+1} 屏：${esc(panelLabels[index]||panel.id)}"></button>`).join("");
    setActivePanel(0);
    document.addEventListener("click",event=>{const tab=event.target.closest("[data-demo-tab]");if(!tab)return;const demoRoot=tab.closest(".demo");demoRoot.querySelectorAll("[data-demo-tab]").forEach(node=>node.classList.toggle("active",node===tab));demoRoot.querySelectorAll("[data-demo-panel]").forEach(node=>node.classList.toggle("active",node.dataset.demoPanel===tab.dataset.demoTab))});
    $("#page-rail").addEventListener("click",event=>{const dot=event.target.closest("[data-page-index]");if(dot)goToPanel(Number(dot.dataset.pageIndex))});
    $("#back-to-top").addEventListener("click",event=>{event.preventDefault();goToPanel(0)});
    addEventListener("keydown",event=>{if(event.defaultPrevented||event.metaKey||event.ctrlKey||event.altKey||event.shiftKey||event.target.closest("input,textarea,select,button,a,[contenteditable=true]"))return;const next=["ArrowDown","ArrowRight","PageDown"].includes(event.key);const previous=["ArrowUp","ArrowLeft","PageUp"].includes(event.key);if(next||previous||event.key==="Home"||event.key==="End"){event.preventDefault();goToPanel(event.key==="Home"?0:event.key==="End"?panels.length-1:activePanelIndex+(next?1:-1))}});
    $("#menu-button").addEventListener("click",()=>{const shell=$("#nav-shell");const open=shell.classList.toggle("open");$("#menu-button").setAttribute("aria-expanded",String(open))});
    chapterNav.addEventListener("click",event=>{const link=event.target.closest("a");if(link){const target=panels.findIndex(panel=>`#${panel.id}`===link.getAttribute("href"));if(target>=0){event.preventDefault();goToPanel(target)}}$("#nav-shell").classList.remove("open");$("#menu-button").setAttribute("aria-expanded","false")});
    const reveals=[...document.querySelectorAll(".reveal")];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target)}}),{threshold:.12});reveals.forEach(node=>observer.observe(node));
    const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!navigating)setActivePanel(panels.indexOf(entry.target))}),{rootMargin:"-34% 0px -50%",threshold:0});panels.forEach(section=>sectionObserver.observe(section));
    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});
    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};addEventListener("scroll",updateProgress,{passive:true});updateProgress();
    const initialPanelIndex=panels.findIndex(panel=>`#${panel.id}`===location.hash);if(initialPanelIndex>0){panels[initialPanelIndex].querySelectorAll(".reveal").forEach(node=>node.classList.add("visible"));requestAnimationFrame(()=>goToPanel(initialPanelIndex))}
  </script>
</body>
</html>
