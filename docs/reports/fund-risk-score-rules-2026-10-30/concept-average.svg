<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">单项分数不等于整体风险</title><desc id="d">不能仅凭单个基金分数的平均值重建组合风险。</desc><rect width="640" height="360" rx="24" fill="#eeeaf8"/><g font-family="Songti SC,STSong,serif" text-anchor="middle"><circle cx="184" cy="150" r="78" fill="white" stroke="#d8ceec"/><circle cx="456" cy="150" r="78" fill="#e5f2ed" stroke="#c4dfd3"/><text x="184" y="141" font-size="28" fill="#171f37">单项分数</text><text x="184" y="180" font-size="28" fill="#171f37">简单平均</text><text x="456" y="160" font-size="28" fill="#171f37">整体风险</text><text x="320" y="171" font-size="64" fill="#8067c8">≠</text><text x="320" y="289" font-size="26" fill="#685386">还要看权重与资产关系</text><text x="320" y="331" font-size="24" fill="#71687e">原理解读 · 无数值模拟</text></g></svg>