:root{--ink:#151a25;--muted:#657086;--line:#e4e7ef;--paper:#f5f6f9;--card:#fff;--violet:#7158e8;--teal:#1ca69a;--amber:#d99b2b;--navy:#15213c;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.72}
a{color:#5140b8;text-decoration:none}a:hover{text-decoration:underline}
.topline{height:5px;background:linear-gradient(90deg,var(--violet),#a960ee,var(--teal))}
.hero{max-width:1240px;margin:0 auto;padding:76px 52px 44px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;min-height:620px}
.eyebrow{display:inline-flex;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--violet);background:#ece9ff;border-radius:999px;padding:7px 12px}
.hero h1{font-family:Georgia,"Songti SC",serif;font-size:76px;line-height:1.03;letter-spacing:-.045em;margin:23px 0 22px}.hero h1 em{font-style:normal;color:var(--violet)}
.hero-copy>p{max-width:580px;font-size:20px;color:#4d5870}.hero-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.hero-meta span{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--muted);font-size:13px}.hero-meta b{color:var(--ink);font-size:19px;margin-right:4px}.hero-visual svg{width:100%;height:auto}
.thesis-grid{max-width:1240px;margin:0 auto 38px;padding:0 52px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.thesis-grid article{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;min-height:198px}.thesis-grid article>span{font-family:Georgia,serif;color:var(--violet);font-size:26px}.thesis-grid h2{font-size:18px;margin:28px 0 8px}.thesis-grid p{font-size:14px;color:var(--muted);margin:0;line-height:1.6}
.flow-band{max-width:1136px;margin:0 auto 62px;border-radius:24px;padding:22px 25px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.flow-band div{display:flex;flex-direction:column}.flow-band b{font-size:11px;letter-spacing:.13em;color:#6fe0d2}.flow-band span{font-size:13px;color:#d7deed}.flow-band i{font-style:normal;color:#71809e}
.report-layout{max-width:1240px;margin:0 auto;padding:0 52px 90px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:54px}
.toc{position:sticky;top:22px;align-self:start;max-height:calc(100vh - 44px);overflow:auto;border-top:2px solid var(--ink);padding-top:16px}.toc strong{font-size:11px;letter-spacing:.16em}.toc a{display:block;color:#69748a;font-size:12px;line-height:1.45;padding:8px 0;border-bottom:1px solid var(--line)}.toc a:hover{color:var(--violet);text-decoration:none}
.prose{min-width:0;background:#fff;border:1px solid var(--line);border-radius:30px;padding:52px 62px;box-shadow:0 22px 70px rgba(40,48,68,.07)}
.prose>h1:first-of-type{display:none}.prose h1,.prose h2,.prose h3{scroll-margin-top:20px;color:#182033}.prose h2{font-family:Georgia,"Songti SC",serif;font-size:33px;line-height:1.3;margin:74px 0 24px;padding-top:10px;border-top:1px solid var(--line)}.prose h2:first-of-type{margin-top:0;border-top:0}.prose h3{font-size:20px;margin:34px 0 13px}.heading-number{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.15em;color:var(--violet);margin-bottom:9px;min-height:14px}
.prose p{color:#3e485c}.prose li{margin:7px 0;color:#3e485c}.prose strong{color:#111827}.prose code{background:#f0eeff;color:#5842c2;padding:2px 6px;border-radius:6px}
.source-note{background:linear-gradient(135deg,#f2f0ff,#effaf8);border:1px solid #ddd9ff;border-radius:18px;padding:22px 24px;color:#4d5870;margin:0 0 30px}
.architecture-diagram{background:#111827;border-radius:20px;padding:22px;overflow:auto;margin:24px 0}.architecture-diagram pre{margin:0;color:#e4e9f3;font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;line-height:1.6}
.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:17px;margin:22px 0 32px}table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}th{background:#f4f5f9;text-align:left;color:#3c465a;font-size:12px;letter-spacing:.02em}th,td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}td{color:#4b566b}
hr{border:0;border-top:1px solid var(--line);margin:56px 0}
footer{max-width:1136px;margin:0 auto 38px;border-top:1px solid var(--line);padding:24px 0;display:flex;justify-content:space-between;color:#7a8498;font-size:12px}
.progress{position:fixed;top:0;left:0;height:5px;background:linear-gradient(90deg,var(--violet),var(--teal));z-index:30;width:0}
.lock{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 20% 10%,#ece9ff,transparent 32%),radial-gradient(circle at 80% 90%,#dff8f4,transparent 32%),var(--paper)}.lock-card{width:min(540px,100%);background:#fff;border:1px solid var(--line);border-radius:32px;padding:46px;box-shadow:0 30px 90px rgba(29,36,53,.12)}.lock-mark{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:22px}.lock h1{font-family:Georgia,"Songti SC",serif;font-size:38px;line-height:1.2;margin:26px 0 12px}.lock p{color:var(--muted)}.lock label{display:block;font-size:12px;font-weight:700;margin:28px 0 8px}.lock-row{display:flex;gap:9px}.lock input{flex:1;min-width:0;border:1px solid #cfd5e2;border-radius:13px;padding:13px 14px;font-size:15px}.lock button{border:0;border-radius:13px;background:var(--violet);color:#fff;padding:0 19px;font-weight:700;cursor:pointer}.lock-error{min-height:23px;color:#c43f4c;font-size:12px;margin-top:10px}.lock-note{border-top:1px solid var(--line);padding-top:18px;margin-top:22px!important;font-size:12px}
@media(max-width:960px){.hero{grid-template-columns:1fr;padding:58px 28px 28px}.hero h1{font-size:58px}.hero-visual{max-width:520px;margin:auto}.thesis-grid{grid-template-columns:1fr 1fr;padding:0 28px}.flow-band{margin:0 28px 46px;flex-wrap:wrap}.report-layout{grid-template-columns:1fr;padding:0 20px 60px}.toc{display:none}.prose{padding:38px 28px}.prose h2{font-size:28px}footer{margin:0 28px 30px}}
@media(max-width:560px){.hero{padding:46px 20px 24px;min-height:auto}.hero h1{font-size:45px}.hero-copy>p{font-size:17px}.hero-visual{margin-top:10px}.thesis-grid{grid-template-columns:1fr;padding:0 20px}.thesis-grid article{min-height:auto}.flow-band{margin:0 20px 38px;display:grid;grid-template-columns:1fr}.flow-band i{transform:rotate(90deg);justify-self:center}.report-layout{padding:0 12px 50px}.prose{border-radius:20px;padding:30px 18px}.prose h2{font-size:25px;margin-top:54px}.architecture-diagram{padding:15px}.architecture-diagram pre{font-size:10px}.lock-card{padding:32px 22px}.lock h1{font-size:31px}.lock-row{flex-direction:column}.lock button{padding:13px}}
@media print{.toc,.progress{display:none}.report-layout{display:block;padding:0}.prose{box-shadow:none;border:0}.hero,.thesis-grid,.flow-band{break-inside:avoid}}
</style>

      const decode = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      async function unlock() {
        const error = document.getElementById('error');
        const password = document.getElementById('pass').value;
        if (!password) { error.textContent = '请输入访问口令'; return; }
        error.textContent = '正在验证…';
        try {
          const keyMaterial = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
          );
          const key = await crypto.subtle.deriveKey(
            { name:'PBKDF2', salt:decode(protectedPayload.salt), iterations:protectedPayload.iterations, hash:'SHA-256' },
            keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']
          );
          const plain = await crypto.subtle.decrypt(
            { name:'AES-GCM', iv:decode(protectedPayload.iv) },
            key, decode(protectedPayload.data)
          );
          document.getElementById('mount').innerHTML = new TextDecoder().decode(plain);
          document.getElementById('lock').remove();
          history.replaceState(null, '', location.pathname);
          const script = document.createElement('script');
          script.textContent = "\n<script>\n(() => {\n  const bar = document.querySelector('.progress');\n  const update = () => {\n    const doc = document.documentElement;\n    const max = doc.scrollHeight - doc.clientHeight;\n    if (bar) bar.style.width = (max ? (doc.scrollTop / max) * 100 : 0) + '%';\n  };\n  addEventListener('scroll', update, { passive: true });\n  update();\n})();\n";
          document.body.appendChild(script);
        } catch (e) {
          error.textContent = '口令不正确，请重新输入';
        }
      }
      document.getElementById('unlock').addEventListener('click', unlock);
      document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
