    <line x1="540" y1="1702" x2="620" y2="1702" stroke="#EEF2F7" stroke-width="5" marker-start="url(#bWhite)" marker-end="url(#bWhite)"/>
    <text x="640" y="1712" font-size="30">协同 · 接续</text>
    <rect x="880" y="1680" width="80" height="44" rx="8" fill="#1C2A3F" stroke="#F2C14E" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="980" y="1712" font-size="30">建设与验证项目</text>
    <line x1="1230" y1="1702" x2="1310" y2="1702" stroke="#FF7A6B" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#bCoral)"/>
    <text x="1330" y="1712" font-size="30">回流迭代</text>
    <rect x="1520" y="1680" width="190" height="44" rx="22" fill="#3DD6B0"/>
    <text x="1615" y="1712" font-size="30" class="c d">已有·升级</text>
    <rect x="1730" y="1680" width="120" height="44" rx="22" fill="#FFA65C"/>
    <text x="1790" y="1712" font-size="30" class="c d">新建</text>
    <rect x="1870" y="1680" width="190" height="44" rx="22" fill="#B79CFF"/>
    <text x="1965" y="1712" font-size="30" class="c d">独立并列</text>
    <text x="3100" y="1712" font-size="30" class="e m">客户流程、技术架构、接口清单见附图</text>
