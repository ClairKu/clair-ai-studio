<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 开放平台 2026 H2 项目汇报关键行动图</title>
  <desc id="desc">五条主线支撑 OAP 从能力沉淀走向商业闭环：项目进展、产品规划、商化准备、往外看、向内看，千问合作切入超级流量入口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#ede9fa"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7058d8"/><stop offset="1" stop-color="#a58df7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a32"/><stop offset="1" stop-color="#263151"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#342568" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8067e8"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#171a2a}.serif{font-family:"Songti SC",STSong,SimSun,serif}.eyebrow{font-size:24px;font-weight:800;letter-spacing:4px;fill:#735bd8}.title{font-size:64px;font-weight:800}.sub{font-size:26px;fill:#687287}.group{font-size:34px;font-weight:750}.card{font-size:28px;font-weight:750}.metric{font-size:34px;font-weight:800;fill:#735bd8}.white{fill:#fff}.pale{fill:#e8eafd}.small{font-size:22px;fill:#687287}</style>
  </defs>
  <rect width="1920" height="1080" rx="48" fill="url(#bg)"/>
  <text x="80" y="80" class="eyebrow">YINGMI AI OAP · 2026 H2 PROJECT REPORT</text>
  <text x="80" y="160" class="title serif">从能力沉淀到商业闭环</text>
  <text x="80" y="210" class="sub">五条主线｜千问超级入口 × 三大渠道上架 × 商化样板</text>

  <rect x="80" y="260" width="540" height="720" rx="44" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="120" y="320" class="eyebrow">01 · STAGE RESULTS</text>
  <text x="120" y="380" class="group serif">阶段成果｜可见势能</text>
  <text x="120" y="450" class="metric serif">9.2M+</text><text x="120" y="490" class="sub">累计调用量</text>
  <text x="120" y="550" class="metric serif">480+</text><text x="120" y="590" class="sub">服务金融机构</text>
  <text x="120" y="650" class="metric serif">8,700+</text><text x="120" y="690" class="sub">总用户</text>
  <text x="120" y="750" class="metric serif">400+</text><text x="120" y="790" class="sub">每日使用用户</text>
  <rect x="120" y="830" width="460" height="80" rx="26" fill="#171f37"/><text x="350" y="882" class="sub pale" text-anchor="middle">快速放量期 · 向 10M 逼近</text>

  <path d="M630 620H690" stroke="#8067e8" stroke-width="8" marker-end="url(#arrow)"/>

  <rect x="700" y="260" width="540" height="720" rx="44" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="740" y="320" class="eyebrow pale">02 · KEY BREAKTHROUGH</text>
  <text x="740" y="380" class="group serif white">千问合作｜超级入口</text>
  <rect x="740" y="420" width="460" height="150" rx="34" fill="#394465"/>
  <text x="770" y="480" class="card pale">且慢 AI 小顾</text><text x="770" y="530" class="sub pale">千问首批 · 一期唯一金融 Agent</text>
  <rect x="740" y="600" width="460" height="150" rx="34" fill="#394465"/>
  <text x="770" y="660" class="card pale">流量转化闭环</text><text x="770" y="710" class="sub pale">获取 → AI 服务 → 外链交易</text>
  <rect x="740" y="780" width="460" height="140" rx="34" fill="#394465"/>
  <text x="770" y="840" class="card pale">任务模式 MCP + 连接广场</text><text x="770" y="890" class="sub pale">8 月 10 日联合宣发</text>

  <path d="M1250 620H1310" stroke="#8067e8" stroke-width="8" marker-end="url(#arrow)"/>

  <rect x="1320" y="260" width="520" height="720" rx="44" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="1360" y="320" class="eyebrow">03 · CHANNELS &amp; COMMERCIAL</text>
  <text x="1360" y="380" class="group serif">渠道上架 × 商化样板</text>
  <rect x="1360" y="420" width="440" height="120" rx="30" fill="#f5f2fb"/><text x="1390" y="470" class="card">WorkBuddy · MCP</text><text x="1390" y="510" class="sub">已上架 · 7 月新增 1,855</text>
  <rect x="1360" y="560" width="440" height="120" rx="30" fill="#f5f2fb"/><text x="1390" y="610" class="card">支付宝 / 百炼 / SkillHub</text><text x="1390" y="650" class="sub">邀测 / 待上架 / 入驻</text>
  <rect x="1360" y="700" width="440" height="120" rx="30" fill="url(#violet)"/><text x="1390" y="750" class="card white">企业版年包</text><text x="1390" y="790" class="sub pale">10 / 20 / 60 万 · 山西证券</text>
  <rect x="1360" y="840" width="440" height="110" rx="30" fill="#f5f2fb"/><text x="1390" y="890" class="card">个人资源包 10 档</text><text x="1760" y="890" class="sub" text-anchor="end">¥9.9 — ¥9,999</text>

  <text x="80" y="1040" class="small">项目进展 · 产品规划 · 商化准备 · 往外看 · 向内看 → OAP 商业闭环</text>
</svg>
