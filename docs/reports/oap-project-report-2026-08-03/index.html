        document.write(new TextDecoder().decode(plain));
        document.close();
      }catch(errorValue){
        submit.disabled=false;
        submit.textContent="重新打开";
        error.textContent=errorValue?.message==="unsupported"?"当前浏览器不支持打开报告，请升级浏览器。":"报告打开失败，请刷新后重试。";
      }
    });
  </script>
</body>
</html>
