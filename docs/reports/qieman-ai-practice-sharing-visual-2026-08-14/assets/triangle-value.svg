<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">产品价值不可能三角</title>
  <desc id="desc">功能强大、简洁易用、个性化三者在固定产品模式下难以同时最大化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F8F7FC"/><stop offset="1" stop-color="#EEF4FF"/></linearGradient>
    <linearGradient id="tri" x1="0" x2="1"><stop stop-color="#7457E8"/><stop offset="1" stop-color="#4E93F6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2B214F" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="64" y="78" fill="#7457E8" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">IMPOSSIBLE TRIANGLE · VALUE</text>
  <text x="64" y="130" fill="#171A27" font-family="Songti SC,STSong,serif" font-size="42" font-weight="600">强、简、准，很难同时最大化</text>
  <g filter="url(#shadow)">
    <path d="M600 176 L280 530 L920 530 Z" fill="#FFFFFF" stroke="url(#tri)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M600 226 L338 510 L862 510 Z" fill="#7457E8" opacity=".07"/>
  </g>
  <g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">
    <g transform="translate(600 180)">
      <circle r="82" fill="#171A27"/>
      <text y="-6" fill="#FFF" font-size="31" font-weight="800">功能强大</text>
      <text y="28" fill="#C8C1EA" font-size="18">能力 · 深度 · 弹性</text>
    </g>
    <g transform="translate(275 523)">
      <circle r="82" fill="#4E93F6"/>
      <text y="-6" fill="#FFF" font-size="31" font-weight="800">简洁易用</text>
      <text y="28" fill="#E6F2FF" font-size="18">体验 · 易懂 · 低门槛</text>
    </g>
    <g transform="translate(925 523)">
      <circle r="82" fill="#7457E8"/>
      <text y="-6" fill="#FFF" font-size="31" font-weight="800">个性化</text>
      <text y="28" fill="#EEE9FF" font-size="18">因人而异 · 千人千面</text>
    </g>
    <g transform="translate(600 398)">
      <circle r="105" fill="#FFF" stroke="#D9D2F2" stroke-width="2"/>
      <text y="-22" fill="#5138B5" font-size="21" font-weight="800">固定产品模式</text>
      <text y="15" fill="#687287" font-size="18">每增加一层能力与差异</text>
      <text y="46" fill="#687287" font-size="18">都把复杂度推回用户或产研</text>
    </g>
  </g>
  <g fill="none" stroke="#7457E8" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M508 274 C438 292 381 340 347 402"/><path d="M692 274 C762 292 819 340 853 402"/><path d="M422 523 C520 563 680 563 778 523"/>
  </g>
  <text x="1136" y="78" text-anchor="end" fill="#9A8AD8" font-family="Arial,sans-serif" font-size="14" font-weight="700">SOURCE · PPT P3</text>
</svg>
