<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="t d"><title id="t">服务蓝图：半年后用款，现有安排怎么检视</title><desc id="d">一次有明确范围的服务如何被前后台协同完成。目标设计，非现网审计。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#117D76"/></marker><marker id="bluearr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#286CAC"/></marker></defs><g font-family="Heiti SC,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="3200" height="1800" rx="0" fill="#F4F5F1" stroke="none" stroke-width="2"/><text x="80" y="75" font-size="23" font-weight="650" fill="#117D76" text-anchor="start">QIEMAN  /  PRODUCT BLUEPRINT</text><text x="80" y="155" font-size="53" font-weight="750" fill="#17343D" text-anchor="start">服务蓝图：半年后用款，现有安排怎么检视</text><text x="80" y="211" font-size="29" font-weight="400" fill="#597078" text-anchor="start">回答：一件具体服务如何跨AI与顾问接续；客户看见什么；后台交付什么；异常由谁接住。</text><text x="3120" y="77" font-size="33" font-weight="650" fill="#117D76" text-anchor="end">03 / 06</text><rect x="80" y="260" width="3040" height="106" rx="20" fill="#E7F1EC" stroke="#CFDBDB" stroke-width="2"/><text x="108" y="305" font-size="30" font-weight="700" fill="#117D76" text-anchor="start">目标场景示例</text><text x="430" y="305" font-size="32" font-weight="650" fill="#17343D" text-anchor="start">客户：“半年后有一笔用钱计划，想知道现有安排是否需要调整。”</text><text x="430" y="345" font-size="28" font-weight="400" fill="#597078" text-anchor="start">服务承诺：核清需求与现有安排，交付有依据的检视结论，并约定后续复检。</text><rect x="340" y="400" width="446" height="88" rx="10" fill="#143E4A" stroke="none" stroke-width="2"/><text x="362" y="455" font-size="31" font-weight="650" fill="#FFF" text-anchor="start">1  表达目标</text><rect x="798" y="400" width="446" height="88" rx="10" fill="#143E4A" stroke="none" stroke-width="2"/><text x="820" y="455" font-size="31" font-weight="650" fill="#FFF" text-anchor="start">2  确认授权与信息</text><rect x="1256" y="400" width="446" height="88" rx="10" fill="#143E4A" stroke="none" stroke-width="2"/><text x="1278" y="455" font-size="31" font-weight="650" fill="#FFF" text-anchor="start">3  服务准备</text><rect x="1714" y="400" width="446" height="88" rx="10" fill="#143E4A" stroke="none" stroke-width="2"/><text x="1736" y="455" font-size="31" font-weight="650" fill="#FFF" text-anchor="start">4  顾问判断</text><rect x="2172" y="400" width="446" height="88" rx="10" fill="#143E4A" stroke="none" stroke-width="2"/><text x="2194" y="455" font-size="31" font-weight="650" fill="#FFF" text-anchor="start">5  交付与客户确认</text><rect x="2630" y="400" width="446" height="88" rx="10" fill="#143E4A" stroke="none" stroke-width="2"/><text x="2652" y="455" font-size="31" font-weight="650" fill="#FFF" text-anchor="start">6  后续复检</text><rect x="80" y="515" width="230" height="118" rx="10" fill="#E3EDE8" stroke="none" stroke-width="2"/><text x="103" y="567" font-size="30" font-weight="700" fill="#117D76" text-anchor="start">客户动作</text><rect x="340" y="515" width="446" height="118" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="360" y="563" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">提出用款计划</text><text x="360" y="607" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">说明当前疑问</text><rect x="798" y="515" width="446" height="118" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="818" y="563" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">确认、补充或更正</text><text x="818" y="607" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">可拒绝授权</text><rect x="1256" y="515" width="446" height="118" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1276" y="563" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">查看受理进度</text><text x="1276" y="607" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">补充待核事项</tex