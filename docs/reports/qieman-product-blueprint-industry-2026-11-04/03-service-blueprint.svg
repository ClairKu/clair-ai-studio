eight="400" fill="#17343D" text-anchor="start">同一服务实例标识</text><rect x="798" y="1050" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="818" y="1098" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">用途授权、目标版本</text><text x="818" y="1142" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">输入来源与缺口</text><rect x="1256" y="1050" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1276" y="1098" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">输入快照、核对结果</text><text x="1276" y="1142" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">顾问接收回执</text><rect x="1714" y="1050" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1734" y="1098" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">事实 / 推断 / 判断</text><text x="1734" y="1142" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">签发人及交付版本</text><rect x="2172" y="1050" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2192" y="1098" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">送达 / 阅读 / 确认</text><text x="2192" y="1142" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">客户决定及复检约定</text><rect x="2630" y="1050" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2650" y="1098" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">复检记录与结果</text><text x="2650" y="1142" font-size="29" font-weight="400" fill="#17343D" text-anchor="start">新事项关联原服务</text><rect x="80" y="1255" width="230" height="168" rx="10" fill="#E3EDE8" stroke="none" stroke-width="2"/><text x="103" y="1307" font-size="30" font-weight="700" fill="#117D76" text-anchor="start">例外与责任</text><rect x="340" y="1255" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="360" y="1303" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">同类未结事项接续</text><text x="360" y="1347" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">避免重复派单</text><rect x="798" y="1255" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="818" y="1303" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">缺信息 → 等待</text><text x="818" y="1347" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">拒绝 → 解释或结束</text><rect x="1256" y="1255" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1276" y="1303" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">冲突、失效、超时</text><text x="1276" y="1347" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">进入有人的异常队列</text><rect x="1714" y="1255" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="1734" y="1303" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">不足 → 补证或专家</text><text x="1734" y="1347" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">原责任人等到接收</text><rect x="2172" y="1255" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2192" y="1303" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">更正 → 结论待复核</text><text x="2192" y="1347" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">无回应保持待确认</text><rect x="2630" y="1255" width="446" height="168" rx="10" fill="#FFFFFF" stroke="#CFDBDB" stroke-width="2"/><text x="2650" y="1303" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">重大变化重开检视</text><text x="2650" y="1347" font-size="29" font-weight="400" fill="#9B4E43" text-anchor="start">新承诺另建关联实例</text><rect x="80" y="1490" width="3040" height="157" rx="20" fill="#143E4A" stroke="none" stroke-width="2"/><text x="108" y="1539" font-size="34" font-weight="650" fill="#FFFFFF" text-anchor="start">同一件服务持续接棒：实例 / 授权 / 责任人 / 依据 / 当前状态 / 下一次约定</text><text x="108" y="1585" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">报告生成 ≠ 已送达 ≠ 客户确认 ≠ 问题解决；确认检视结论不等于授权交易。</text><text x="108" y="1624" font-size="28" font-weight="400" fill="#DCECEB" text-anchor="start">标准化获准作业可自动完成；专业判断与高影响动作按具体场景的责任和授权规则执行。</text><line x1="80" y1="1705" x2="3120" y2="1705" stroke="#CFDBDB" stroke-width="2"/><text x="80" y="1746" font-size="24" font-weight="400" fill="#597078" text-anchor="start">方法：NN/g服务蓝图；MuleSoft财富接入案例的架构/活动分图。本图是目标场景示例，不是已上线证明。</text><text x="3120" y="1780" font-size="23" font-weight="400" fill="#597078" text-anchor="end">且慢目标设计 · 2026.11.04 · 行业研究重绘版</text></g></svg>