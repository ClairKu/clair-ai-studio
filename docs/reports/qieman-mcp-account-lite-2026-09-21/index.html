<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;color:var(--text);font-size:13px;line-height:1.55;background:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 320px);min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}

.topnav .in{max-width:1220px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 24px;gap:28px}

.nav-links a{color:var(--text-2)} .nav-links a.on{color:var(--blue);font-weight:600}

.wrap{max-width:1220px;margin:20px auto 0;padding:0 24px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.card{background:#fff;border-radius:12px;box-shadow:var(--shadow)}

.b-blue{background:var(--blue-soft);color:var(--blue)} .b-green{background:var(--green-soft);color:var(--green)} .b-orange{background:var(--orange-soft);color:#C9700F} .b-red{background:var(--red-soft);color:var(--red)} .b-gray{background:#F0F2F7;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:12.5px;font-weight:500;white-space:nowrap}

.btn.ghost{border-color:transparent;background:transparent}.btn.danger:hover{color:var(--red);background:var(--red-soft);border-color:#F3B4B6}

.ibtn:hover{background:var(--blue-soft);color:var(--blue)}

.ibtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1F2633;color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;z-index:5}

.profile{text-align:center;padding:22px 16px 16px}

.list{list-style:none}.list li{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);padding:6px 0;border-bottom:1px solid var(--line-2)}.list li:last-child{border-bottom:0}

.tabs{display:flex;gap:4px;padding:6px 10px 0;border-bottom:1px solid var(--line)}

.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}.kpi .d.up{color:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar .sp{flex:1}
.input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;outline:none;min-width:100px}
.input:focus{border-color:var(--blue)}
.input.search{min-width:190px;padding-left:28px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238A93A6' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat 9px center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}

.seg button:last-child{border-right:0}.seg button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:hover td{background:#FAFBFE}
tr.dim td{color:var(--muted)}tr.dim td .nm{color:var(--text-2)}
.nm{font-weight:600}.ph{font-size:11px;color:var(--muted);font-family:"SF Mono",Menlo,monospace}
.q{min-width:150px}.q .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}.q .row b{color:var(--text);font-weight:500}.q .bar{height:5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.expire-soon{color:#C9700F}.expired{color:var(--red)}
td.ops{white-space:nowrap;text-align:right}
.sec{border:1px solid var(--line);border-radius:10px}.sec .hd{padding:12px 14px 0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}.sec .bd{padding:10px 14px 14px}
.sec .hd .sub{font-weight:400;color:var(--muted);font-size:11.5px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px}.mt{margin-top:14px}
.chart{width:100%;display:block}
.hbars .r{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.hbars .nm{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}.hbars .val{text-align:right;font-variant-numeric:tabular-nums}
.codebox{background:#F7F9FD;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codebox .cap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.codebox pre{padding:12px 14px;font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.7;color:#2A3446;overflow:auto}
.codebox .s{color:#1A7F5A}.codebox .k{color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:26px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--text-2)}.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;color:var(--muted);font-size:12px}

.mask{position:fixed;inset:0;background:rgba(20,30,60,.35);z-index:80;display:none}.mask.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:90;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(20,30,60,.12)}
.drawer.show{transform:none}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.drawer .db{flex:1;overflow:auto;padding:18px 20px}.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted);font-size:18px}
.f{margin-bottom:14px}.f label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.f label .hint{color:var(--faint);font-weight:400;margin-left:6px}
.f .input{width:100%}.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-size:11.5px;margin-top:4px;display:none}.err.show{display:block}
.avail{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:14px;padding:10px 12px;background:var(--blue-soft);border-radius:8px}
.avail b{color:var(--text);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#1F2633;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%)}

.demobar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(31,38,51,.94);color:#fff;border-radius:12px;padding:6px;display:flex;align-items:center;gap:4px;z-index:70;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.demobar .lb{font-size:11.5px;color:rgba(255,255,255,.6);padding:0 10px;white-space:nowrap}
.demobar .v{height:30px;padding:0 14px;border-radius:8px;border:0;background:transparent;color:rgba(255,255,255,.85);font-size:12.5px;white-space:nowrap}

@media (max-width:960px){.wrap{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
</style>

<script>
/* 合约：由盈米按约定开通，管理员只能在范围内分配 */
const CONTRACT={org:'盈米资管科技有限公司',short:'盈米资管科技',accounts:20,credits:500000,start:'2026-09-01',end:'2027-08-31',admin:'陈嘉禾',key:'g08************fCFQ'};
const TODAY=new Date(2026,8,21);

let members=[
  {id:1,name:'陈嘉禾',phone:'138****2211',role:'admin',status:'active',total:60000,used:23480,daily:3000,monthly:20000,todayUsed:640,monthUsed:9860,expire:'2027-08-31',last:'今天 14:20'},
  {id:2,name:'林墨',phone:'139****8032',status:'active',total:50000,used:28900,daily:2000,monthly:15000,todayUsed:1930,monthUsed:7210,expire:'2027-08-31',last:'今天 11:05'},
  {id:3,name:'周子航',phone:'136****4410',status:'active',total:40000,used:37800,daily:2000,monthly:15000,todayUsed:2000,monthUsed:12480,expire:'2026-12-31',last:'今天 15:02'},
  {id:4,name:'吴晚晴',phone:'137****9921',status:'active',total:30000,used:12040,daily:1000,monthly:0,todayUsed:210,monthUsed:3120,expire:'2026-10-15',last:'昨天 18:40'},
  {id:5,name:'韩奕',phone:'150****3388',status:'pending',total:20000,used:0,daily:1000,monthly:8000,todayUsed:0,monthUsed:0,expire:'2027-08-31',last:'—'},
  {id:6,name:'苏漫',phone:'186****7712',status:'active',total:20000,used:8320,daily:0,monthly:0,todayUsed:120,monthUsed:2260,expire:'2027-08-31',last:'今天 09:31'},
  {id:7,name:'郑柏然',phone:'135****6650',status:'paused',total:30000,used:29950,daily:2000,monthly:15000,todayUsed:0,monthUsed:0,expire:'2026-09-30',last:'09-12 17:10'},
  {id:8,name:'何雨桐',phone:'158****2049',status:'active',total:30000,used:15600,daily:1500,monthly:10000,todayUsed:880,monthUsed:4380,expire:'2027-08-31',last:'今天 13:47'},
  {id:9,name:'方知远',phone:'159****4471',status:'removed',total:9800,used:9800,daily:0,monthly:0,todayUsed:0,monthUsed:0,expire:'2026-08-31',last:'08-30 16:22',removedAt:'2026-09-02'},
];
const TOOLS=[['财经资讯',18420],['基金代码模糊匹配',15270],['搜索基金',12180],['批量获取基金详情',9880],['基金经理观点',7620],['批量获取基金业绩表现',6910]];
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const DAYS=Array.from({length:30},(_,i)=>{const d=new Date(2026,7,23+i);return `${d.getMonth()+1}/${d.getDate()}`});
const R=rnd(7);const S_ORG=Array.from({length:30},(_,i)=>Math.round(1800+i*18+900*(R()-.5)+((i%7===5||i%7===6)?-700:0)));
const R2=rnd(3);const S_ME=Array.from({length:30},(_,i)=>Math.round(320+180*(R2()-.5)+((i%7===5||i%7===6)?-150:0)));

const fmt=n=>n.toLocaleString('zh-CN');const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
const daysLeft=d=>Math.round((new Date(d)-TODAY)/864e5);
const barClass=p=>p>=95?'danger':p>=80?'warn':'';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function copy(t,m){try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}toast(m||'已复制')}
/* 口径：在用账号 = 未移除；已分配 = 在用账号额度之和；已消耗 = 所有账号（含已移除）累计使用 */
const inUse=()=>members.filter(m=>m.status!=='removed');
const allocated=()=>inUse().reduce((a,m)=>a+m.total,0);
const consumed=()=>members.reduce((a,m)=>a+m.used,0);
const allocUnused=()=>inUse().reduce((a,m)=>a+Math.max(0,m.total-m.used),0);
const free=()=>CONTRACT.credits-allocated();
const ICON={edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  remove:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
  restore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'};
function statusOf(m){if(m.status==='removed')return['b-gray','已移除'];if(m.status==='paused')return['b-gray','已暂停'];if(m.status==='pending')return['b-orange','未登录'];if(daysLeft(m.expire)<0)return['b-red','已到期'];if(m.used>=m.total)return['b-red','额度用尽'];if(m.daily&&m.todayUsed>=m.daily)return['b-orange','今日限流'];return['b-green','正常']}

const expText=d=>{const n=daysLeft(d);return n<0?`<span class="expired">${d}</span>`:n<=30?`<span class="expire-soon">${d}</span>`:d};

function lineChart(sr,{h=180,color='#3B7BFF'}={}){const w=640,pad={l:44,r:12,t:12,b:24},max=Math.max(...sr)*1.15,n=sr.length,x=i=>pad.l+(w-pad.l-pad.r)*i/(n-1),y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">`;for(let g=0;g<=4;g++){const yy=pad.t+(h-pad.t-pad.b)*g/4,val=Math.round(max*(1-g/4));s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="#EEF2F9"/><text x="${pad.l-6}" y="${yy+4}" font-size="10" fill="#B4BBCB" text-anchor="end">${val>=1000?(val/1000).toFixed(1)+'k':val}</text>`}const pts=sr.map((v,i)=>`${x(i)},${y(v)}`).join(' ');s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${color}" opacity=".08"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`;for(let i=0;i<n;i+=4)s+=`<text x="${x(i)}" y="${h-6}" font-size="10" fill="#B4BBCB" text-anchor="middle">${DAYS[i]}</text>`;return s+'</svg>'}
function hbars(items,unit='次'){const max=Math.max(...items.map(i=>i[1]));return `<div class="hbars">${items.map((it,i)=>`<div class="r"><div class="nm">${i+1}&nbsp; ${it[0]}</div><div class="bar" style="height:8px"><i style="width:${it[1]/max*100}%"></i></div><div class="val">${fmt(it[1])} <small class="note">${unit}</small></div></div>`).join('')}</div>`}

function toggleMember(id){const m=members.find(x=>x.id===id);m.status=m.status==='paused'?'active':'paused';toast(m.status==='paused'?`已暂停 ${m.name}`:`已恢复 ${m.name}`);render()}

function restoreMember(id){const m=members.find(x=>x.id===id);if(CONTRACT.accounts-inUse().length<=0){toast('账号数已达合约上限');return}m.status='paused';delete m.removedAt;toast(`已恢复 ${m.name}（暂停状态，请编辑限额后启用）`);state.filter='paused';render()}

function openEdit(id){

  document.getElementById('drawer').innerHTML=`<div class="dh">${m?'编辑限额 · '+m.name:'新增账号'}<button class="x" onclick="closeDrawer()">×</button></div><div class="db">

    ${m?'':`<div class="f"><label>且慢账号手机号<span class="hint">对方登录后自动生效</span></label><input class="input" id="e_phone" placeholder="138 0000 0000"></div><div class="f"><label>姓名</label><input class="input" id="e_name" placeholder="机构内显示"></div>`}
    <div class="f"><label>积分额度</label><input class="input" id="e_total" value="${m?m.total:20000}" oninput="validate()"><div class="chips" style="margin-top:8px">${[10000,20000,50000].map(v=>`<button class="chip" onclick="document.getElementById('e_total').value=${v};validate()">${fmt(v)}</button>`).join('')}</div><div class="err" id="err_total"></div></div>
    <div class="f"><label>限额<span class="hint">可选，留空不限</span></label><div class="row"><input class="input" id="e_daily" value="${m&&m.daily?m.daily:''}" placeholder="每日" oninput="validate()"><input class="input" id="e_monthly" value="${m&&m.monthly?m.monthly:''}" placeholder="每月" oninput="validate()"></div><div class="err" id="err_cap"></div></div>
    <div class="f"><label>效期</label><div class="chips" style="margin-bottom:8px">${['3 个月','6 个月','12 个月','随合约'].map((v,i)=>`<button class="chip ${i===3?'on':''}" onclick="setExp(this,${i})">${v}</button>`).join('')}</div><input class="input" id="e_expire" value="${m?m.expire:CONTRACT.end}" oninput="validate()"><div class="err" id="err_exp"></div></div>
  </div><div class="df"><button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" id="e_save" onclick="saveEdit(${id||0})">${m?'保存':'创建'}</button></div>`;
  document.getElementById('drawer').classList.add('show');document.getElementById('mask').classList.add('show');window._avail=avail;window._used=m?m.used:0;validate();
}
function setExp(el,i){[...el.parentElement.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');const d=new Date(TODAY);if(i<3){d.setMonth(d.getMonth()+[3,6,12][i]);const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;document.getElementById('e_expire').value=s>CONTRACT.end?CONTRACT.end:s}else document.getElementById('e_expire').value=CONTRACT.end;validate()}
function num(id){return +String(document.getElementById(id).value).replace(/[^\d]/g,'')||0}
function validate(){
  const total=num('e_total'),daily=num('e_daily'),monthly=num('e_monthly'),exp=document.getElementById('e_expire').value;let ok=true;
  const e1=document.getElementById('err_total');e1.textContent=total<=0?'请填写积分额度':total>window._avail?`超出待分配积分 ${fmt(window._avail)}`:total<window._used?`不能低于已用 ${fmt(window._used)}`:'';e1.classList.toggle('show',!!e1.textContent);ok=ok&&!e1.textContent;
  const e2=document.getElementById('err_cap');e2.textContent=(daily&&daily>total)?'日限额不能大于积分额度':(monthly&&monthly>total)?'月限额不能大于积分额度':(daily&&monthly&&daily>monthly)?'日限额不能大于月限额':'';e2.classList.toggle('show',!!e2.textContent);ok=ok&&!e2.textContent;
  const e3=document.getElementById('err_exp');e3.textContent=!/^\d{4}-\d{2}-\d{2}$/.test(exp)?'格式 YYYY-MM-DD':exp>CONTRACT.end?`不得晚于合约效期 ${CONTRACT.end}`:daysLeft(exp)<0?'不能早于今天':'';e3.classList.toggle('show',!!e3.textContent);ok=ok&&!e3.textContent;
  const b=document.getElementById('e_save');b.disabled=!ok;return ok;
}
function saveEdit(id){
  if(!validate())return;const total=num('e_total'),daily=num('e_daily'),monthly=num('e_monthly'),exp=document.getElementById('e_expire').value;
  if(id){const m=members.find(x=>x.id===id);Object.assign(m,{total,daily,monthly,expire:exp});toast(`已更新 ${m.name}`)}
  else{const ph=(document.getElementById('e_phone').value||'').replace(/\s/g,'');if(!/^1\d{10}$/.test(ph)){toast('请填写正确的手机号');return}const name=document.getElementById('e_name').value.trim()||('用户'+ph.slice(-4));members.push({id:Date.now(),name,phone:ph.slice(0,3)+'****'+ph.slice(-4),status:'pending',total,used:0,daily,monthly,todayUsed:0,monthUsed:0,expire:exp,last:'—'});toast(`已创建 ${name}，对方登录后生效`);state.filter='inuse'}
  closeDrawer();render();
}
