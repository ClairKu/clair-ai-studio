  <script type="application/json" id="report-data">{"meta":{"title":"且慢 AI 产品实践｜服务做深，能力破圈","subtitle":"小顾做深存量服务\n开放平台打开微信与千问增量入口","eyebrow":"且慢产品团队 · AI PRACTICE REPORT","date":"2026-08-14","cutoff":"飞书源稿 revision 1742；增长趋势截至 2026-08-10；经营快照读取于 2026-08-14 00:37","owner":"且慢产品团队 × 盈米 AI 开放平台","confidentiality":"公开脱敏汇报版","accent":"#7457E8","brand":"Clair AI Studio","brandMark":"C"},"hero":{"conclusion":"真正的破圈不是多一个聊天框，而是把投顾能力从固定产品变成可组合、可治理、可进入新入口的持续服务。","thesis":"AI 小顾先在且慢内部验证服务价值；CAP 与 OAP 再把数据、方法、工具和任务拆成可复用能力，通过微信、千问等新入口完成发现、服务与回流。增长证据、传播效果和目标态在报告中分层呈现。","badges":["小顾 × OAP","微信 × 千问","502 日增长趋势","8 图位 × 4 影片位"]},"agenda":{"enabled":true,"label":"AGENDA","title":"报告大纲","groups":[{"index":"01","eyebrow":"WHY · 为什么","title":"为什么必须换一条路","summary":"入口从页面迁移到任务，旧产品模式无法同时满足效率、体验与个性化。","sections":["入口迁移","同一系统","小顾演进"]},{"index":"02","eyebrow":"SYSTEM · 怎么做","title":"把能力变成可组合服务","summary":"用 CAP 重写产品生产，用 OAP 承接治理、分发与增长。","sections":["CAP 范式","增长快照","增长曲线"]},{"index":"03","eyebrow":"PROOF · 证据","title":"新入口开始承接服务","summary":"微信负责需求发现与路由，千问兼顾能力直连、完整 Agent 与传播放大。","sections":["入口分工","微信场景","千问场景","传播口径","证据舱"]},{"index":"04","eyebrow":"STORY · 汇报","title":"把证据沉淀成可复用叙事","summary":"视频案例与大量媒体槽位让后续素材可直接进入同一套汇报系统。","sections":["视频案例","图像槽位","影片槽位","下一步"]}]},"sections":[{"id":"why-change","kicker":"01 · WHY NOW","title":"入口变了，服务也要重做","lead":"有限资源下，固定页面很难同时兼顾强能力、低门槛与因人而异；AI 让服务单位从页面变成任务。","layout":"evidence","tone":"light","navLabel":"入口迁移","items":[{"eyebrow":"SOURCE VIEW · PRODUCT TENSION","title":"两个不可能三角","body":"内部产品要在效率、体验与能力间取舍；外部需求又在用户、业务与关系人之间拉扯。AI 的价值是改变生产方法，而不是再加一个入口。","image":"assets/product-triangle.png","alt":"传统产品模式中的效率、体验、能力与多方需求两个不可能三角","imagePriority":"high","status":"confirmed","source":"飞书文档《且慢AI产品实践》· revision 1742"},{"eyebrow":"JUDGEMENT · ENTRY SHIFT","title":"用户不再先找页面","body":"当用户先向 AI 描述目标，谁能被理解、被调用、把任务交付到底，谁才拥有新入口。且慢需要把专业能力从 App 内部释放出来。","status":"inferred","source":"飞书源稿与微信、千问历史联调材料 · 2026-08"}],"callout":{"label":"中心判断","text":"不是用 AI 优化旧页面，而是把专业服务重新组织为可完成的     const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!navigating)setActivePanel(panels.indexOf(entry.target))}),{rootMargin:"-34% 0px -50%",threshold:0});panels.forEach(section=>sectionObserver.observe(section));
    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});

    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};addEventListener("scroll",updateProgress,{passive:true});updateProgress();

<script id="growth-showcase-enhancements">(function growthShowcaseEnhancements(){

      {title:"一周后的理财判断",eyebrow:"03 · 专业判断",meta:"37 秒 · AI 普瑞斯 + 用户提供录屏",poster:"assets/posters/03-agent-deep-review.jpg",video:"../qianwen-impact-showcase-2026-08-13/assets/videos/03-agent-deep-review.mp4",body:"围绕真实理财问题，展示 Agent 不只罗列产品，而是提供资产配置、风险解释与适配判断。"},
