  <script type="application/json" id="report-data">{"meta":{"title":"且慢 AI 产品实践｜服务做深，能力破圈","subtitle":"从 AI 小顾验证服务\n到 AI 开放平台重构增长","eyebrow":"且慢产品团队 · AI PRACTICE REPORT","date":"2026-08-14","cutoff":"飞书源稿 revision 2157；增长数据截至 2026-08-10 21:11；传播数据截至 2026-08-13 09:10","owner":"且慢产品团队 × 盈米 AI 开放平台","confidentiality":"公开脱敏版","accent":"#7457E8","brand":"Clair AI Studio","brandMark":"C"},"hero":{"conclusion":"且慢的破圈不是多一个聊天入口，而是把投顾服务变成可完成任务、可跨入口分发、可治理的能力；当前最该补的不是更多概念，而是任务完成与归因证据。","thesis":"AI 小顾先验证哪些专业服务真的有用，AI 开放平台再把数据、工具、方法和任务拆成可复用能力，进入微信、千问等新入口。报告逐章保留完成态、能力边界、缺失口径与目标态，不把截图、规划或传播声量写成经营闭环。","badges":["revision 2157","17 个源章节","完成态 MP4","公开脱敏"]},"agenda":{"enabled":true,"label":"AGENDA","title":"报告大纲","groups":[{"index":"01","eyebrow":"WHY · 为什么","title":"资源不变，入口先变","summary":"先判断且慢为什么必须换增长路径，再诚实面对任务闭环的证据边界。","sections":["增长路径","服务入口","规模口径","能力边界"]},{"index":"02","eyebrow":"SERVICE · 服务","title":"小顾把能力做成服务","summary":"完成复杂分析只是起点，复用依赖产品演进、生产机制与治理机制共同成立。","sections":["完成态","四套机制","产品进程","边界外扩","五层能力"]},{"index":"03","eyebrow":"DISTRIBUTION · 分发","title":"开放平台把服务送进新入口","summary":"微信、千问与更多合作模式各有角色，接入状态和责任边界必须分开表达。","sections":["入口角色","微信合作","千问合作","宣发效果","合作模式"]},{"index":"04","eyebrow":"RESULT · 经营","title":"把势能变成可验收增长","summary":"增长数字带上截止日，系统架构带上状态，愿景最终变成任务、用户和 AUM 指标。","sections":["增长快照","系统关系","经营终点","未来愿景"]}]},"sections":[{"id":"growth-path","kicker":"P1 · STRATEGY","title":"破圈先换增长路径","lead":"流量、线下与资源禀赋不占优，叠加监管、市场与技术变化；AI 的战略意义，是用专业能力换取新的服务效率与流量入口。","layout":"architecture","tone":"soft","navLabel":"增长路径","items":[{"index":"01","eyebrow":"CONSTRAINT","title":"资源禀赋不同","body":"源稿概括为无自带流量、无线下网络、无资源型股东，并处于强监管金融服务中。","status":"inferred","source":"飞书《且慢AI产品实践》revision 2157 · P1"},{"index":"02","eyebrow":"CHANGE","title":"环境持续变化","body":"监管收紧、市场波动与 AI 技术发展同时发生，过去的获客与产品打法边际效率下降。","status":"inferred","source":"飞书《且慢AI产品实践》revision 2157 · P1"},{"index":"03","eyebrow":"NOW","title":"先解决用户痛点","body":"用 AI 降低服务门槛，让存量用户更容易获得个性化投资服务。","status":"target","source":"飞书《且慢AI产品实践》revision 2157 · P1"},{"index":"04","eyebrow":"NEXT","title":"再寻找新入口","body":"把服务拆成可被外部 AI 发现、理解和调用的能力，打开增量触达。","status":"target","source":"飞书《且慢AI产品实践》revision 2157 · P1"}],"callout":{"label":"中心判断","text":"不在别人最擅长的流量战场追赶，而是把且慢已经积累的专业能力改造成 AI 时代的增长资产。","status":"inferred"}},{"id":"service-entry","kicker":"P2 · USER PROBLEM","title":"痛点决定服务入口","lead":"用户不是缺一个聊天框，而是缺引导、入口和顾问；产品单位要从页面转向可交付的服务任务。","layout":"process","tone":"light","navLabel":"服务入口","items":[{"index":"01","eyebrow":"GUIDANCE","title":"不知道怎么开始","body":"用自然语言、提问建议与追问补齐情境，让用户先说问题而非先找功能。","status":"inferred","source":"飞书源稿 revision 2157 · P2"},{"index":"02","eyebrow":"ACCESS","title":"服务获得成本高","body":"把跨页面、跨工具的专业服务组织成实时入口，减少用户自行拼接答案。","status":"inferred","source":"飞书源稿 revision 2157 · P2"},{"index":"03","eyebrow":"ADVISOR","title":"投资问题多元","body":"由顾问型能力理解目标、调度数据与工具，并在关键动作前回到用户确认。","status":"target","source":"飞书源稿 revision 2157 · P2"}],"callout":{"label":"产品定义","text":"超级入口只负责把人带到功能；超级服务柜台必须把理解、分析、解释与下一步组织成一项完整服务。","status":"inferred"}},{"id":"metric-boundary","kicker":"P2 · METRIC AUDIT","title":"规模数据仍待补证","lead":"原文给出用户、问题、解决率、覆盖率、活跃使用与交易转化，但缺少统一的统计期、分母和定义。","layout":"metrics","tone":"soft","navLabel":"规模口径","items":[{"metric":"20 万","title":"累计服务用户","body":"待补截止日、去重主键、产品与渠道范围。","meta":"源文档声称 · 口径待补","status":"missing","source":"飞书源稿 revision 2157 · P2"},{"metric":"300 万次","title":"投资问题","body":"待定义一次问题、追问与重试是否去重。","meta":"源文档声称 · 口径待补","status":"missing","source":"飞书源稿 revision 2157 · P2"},{"metric":"95% / 80%","title":"解决率 / 场景覆盖","body":"待补问题全集、判断主体、分子分母和统计周期。","meta":"源文档声称 · 口径待补","status":"missing","source":"飞书源稿 revision 2157 · P2"},{"metric":"六成 / 翻倍","title":"活跃使用 / 交易转化","body":"待补活跃定义、转化事件、基准期与对照组。","meta":"源文档声称 · 口径待补","status":"missing","source":"飞书源稿 revision 2157 · P2"}],"callout":{"label":"发布边界","text":"这些数字证明“材料提出过这些主张”，尚不能证明经营结果；口径补齐前不进入封面或管理结论。","status":"missing"}},{"id":"export-boundary","kicker":"P3 · TASK EVIDENCE","title":"截图证明的是边界","lead":"原文希望证明“从找功能到交任务”，但现有画面明确写着暂不支持全量导出；它能证明的是边界解释与替代方案。","layout":"evidence","tone":"light","navLabel":"能力边界","items":[{"eyebrow":"SOURCE SCREEN","title":"系统没有假装完成","body":"AI 正确说明无法直接批量导出，并提供月度对账单、资产证明与人工服务等替代路径。","image":"assets/images/p3-trade-export-boundary.png","alt":"AI 小顾说明且慢暂不支持直接批量导出全部历史交易明细，并提供月度对账单和资产证明替代路径","imagePriority":"high","status":"confirmed","source":"飞书源稿 P3 原始截图 · revision 2157"},{"eyebrow":"EVIDENCE GAP","title":"文件交付仍未证明","body":"若要保留“交任务”叙事，必须补录范围确认、授权、生成 CSV/XLSX、下载与打开核验的端到端流程。","status":"missing","source":"P3 截图与标题逐项对照 · 2026-08-14"}],"callout":{"label":"证据反转","text":"正确暴露能力边界，比用一张未完成截图包装成功更可信；下一步是补齐真实文件交付，而不是改文案。","status":"confirmed"}},{"id":"completed-analysis","kicker":"P5 · COMPLETED DEMO","title":"困难任务已经完成","lead":"原始 63.9 秒录频确认：系统完成交易行为分析、逐笔案例、资金目标与行为模式判断，并在最终画面给出 6 条矫正方案。公开版使用脱敏复刻录屏。","layout":"demo","tone":"dark","navLabel":"完成态","items":[{"index":"01","eyebrow":"DATA","title":"整理交易证据","body":"从授权数据中整理交易时间、方向、产品与持有结果，形成可回查事实。","meta":"脱敏复刻演示","image":"assets/posters/qieman-ai-behavior-analysis-demo.png","video":"assets/videos/qieman-ai-behavior-analysis-demo.mp4","status":"confirmed","source":"飞书 P5 原始完成态录频 · revision 2157"},{"index":"02","eyebrow":"PATTERN","title":"识别行为模式","body":"把多笔交易放进同一分析框架，识别重复出现的追涨、频繁调仓、集中与资金节奏问题。","meta":"样例数据","status":"confirmed","source":"飞书 P5 原始完成态录频 · revision 2157"},{"index":"03","eyebrow":"EVIDENCE","title":"逐笔给出依据","body":"每个判断回到具体交易节点和结果，避免只给用户一个无法解释的标签。","meta":"可解释","status":"confirmed","source":"飞书 P5 原始完成态录频 · revision 2157"},{"index":"04","eyebrow":"ACTION","title":"生成六条方案","body":"最终输出可执行矫正动作；分析准确性、行为改善与收益结果仍需后续评测。","meta":"完成态已确认","status":"confirmed","source":"飞书 P5 原始完成态录频 · revision 2157"}],"callout":{"label":"证据边界","text":"已确认系统完成分析和建议交付；尚未确认建议准确率、用户采纳率、长期行为改善或收益提升。","status":"confirmed"}},{"id":"four-mechanisms","kicker":"P6 · OPERATING SYSTEM","title":"四套机制支撑复用","lead":"一次 Demo 可以靠模型惊喜，持续交付必须让业务、服务设计、生产与治理形成闭环。","layout":"cards","tone":"light","navLabel":"四套机制","items":[{"index":"01","eyebrow":"BUSINESS","title":"业务驱动","body":"从真实用户任务出发，不为 AI 而 AI；先定义未完成的问题，再选择模型与工具。","status":"confirmed","source":"飞书源稿 revision 2157 · P6"},{"index":"02","eyebrow":"SERVICE","title":"服务设计","body":"用提问建议与追问降低门槛，用引用、白盒、卡片与人机交接建立信任。","status":"confirmed","source":"飞书源稿 revision 2157 · P6"},{"index":"03","eyebrow":"PRODUCTION","title":"生产机制","body":"让数据、工具、规则和流程可拆、可配、可复用，也能被其他系统接入。","status":"confirmed","source":"飞书源稿 revision 2157 · P6"},{"index":"04","eyebrow":"GOVERNANCE","title":"治理机制","body":"把数据标注、评测、风险提示、用户预期与人工复核放进上线流程。","status":"confirmed","source":"飞书源稿 revision 2157 · P6"}],"callout":{"label":"经验边界","text":"四套机制是方法论总结；它们与业务结果的量化因果关系仍需用任务完成率、复用与风险指标验证。","status":"inferred"}},{"id":"product-roadmap","kicker":"P7 · PRODUCT EVOLUTION","title":"产品走向任务闭环","lead":"四个阶段分别解决账户服务、多元复杂问题、长期记忆与执行、任务闭环；版本号表达能力跃迁，不等于发布日期。","layout":"timeline","tone":"soft","navLabel":"产品进程","items":[{"index":"1.0","eyebrow":"ACCOUNT SERVICE","title":"账户服务","body":"围绕投前分析规划、产品服务、投后管理和日常陪伴解决真实账户问题。","meta":"框架已形成 · 发布时间待补","status":"confirmed","source":"飞书源稿 revision 2157 · P7"},{"index":"2.0","eyebrow":"EXPERT ORCHESTRATION","title":"多专家调度","body":"提高模型在治理范围内的规划权，协调多专家能力，扩大可解决场景。","meta":"原始录频已出现复杂分析案例","status":"confirmed","source":"飞书源稿 P7 + P5 完成态录频"},{"index":"3.0","eyebrow":"MEMORY & TASK","title":"长期记忆与任务","body":"让服务记得住、跟得上，并处理持续任务、执行与结果写回。","meta":"建设状态待确认","status":"target","source":"飞书源稿 revision 2157 · P7"},{"index":"4.0","eyebrow":"SERVICE LOOP","title":"完成投资任务","body":"从发现需求、形成方案到用户确认、执行与反馈形成完整服务闭环。","meta":"目标态","status":"target","source":"飞书源稿 revision 2157 · P7"}],"callout":{"label":"战略问题","text":"当用户不再先打开且慢，专业投顾能力还能否被发现、理解、授权并完成任务？","status":"inferred"}},{"id":"boundary-expansion","kicker":"P8 · DISTRIBUTION","title":"能力走出且慢边界","lead":"不是把同一个聊天框复制到更多地方，而是逐层拆解能力、重构服务，再进入用户已经存在的路径与入口。","layout":"process","tone":"light","navLabel":"边界外扩","items":[{"index":"01","eyebrow":"OUT OF XIAOGU","title":"走出小顾","body":"把能力融入且慢 App 的首页、持仓、交易、消息与任务等完整用户路径。","status":"target","source":"飞书源稿 revision 2157 · P8"},{"index":"02","eyebrow":"OUT OF APP","title":"走出 App","body":"通过小程序、H5 与微信生态，在问题发生的地方发现需求并承接服务。","status":"confirmed","source":"飞书 P8 + P12 微信合作画面"},{"index":"03","eyebrow":"OUT OF QIEMAN","title":"走出且慢","body":"以 MCP、Skills、Agent 或 A2A 进入千问、Cursor、WorkBuddy 与机构生态。","status":"confirmed","source":"飞书 P8 + P13 千问合作画面"}],"callout":{"label":"三步方法","text":"拆解到最小颗粒，重构为 AI 能力体系，再进入新时代入口；入口可以分散，数据授权与责任不能分散。","status":"inferred"}},{"id":"five-layer-stack","kicker":"P9 · CAPABILITY STACK","title":"五层能力输出服务","lead":"底层能力必须经过标准化、业务封装、任务编排与治理，才能成为用户看得懂、愿意授权、能够持续使用的金融服务。","layout":"architecture","tone":"soft","navLabel":"五层能力","items":[{"index":"01","eyebrow":"DATA","title":"金融数据与知识","body":"用户授权数据、资产持仓、市场与基金数据、投研观点、投顾规则与 RAG。","status":"target","source":"飞书 P9 原始五层能力图 · revision 2157"},{"index":"02","eyebrow":"MCP","title":"标准工具","body":"把查询、计算与动作封装为可调用工具，并返回可解释的金融依据。","status":"target","source":"飞书 P9 原始五层能力图 · revision 2157"},{"index":"03","eyebrow":"SKILLS","title":"业务能力资产","body":"把 SOP、规则、脚本、模板和质量检查封装为可复用专业能力。","status":"target","source":"飞书 P9 原始五层能力图 · revision 2157"},{"index":"04","eyebrow":"AGENT","title":"任务执行","body":"理解目标、规划步骤、编排能力、处理异常，并连接人工复核与结果交付。","status":"target","source":"飞书 P9 原始五层能力图 · revision 2157"},{"index":"05","eyebrow":"SERVICE","title":"服务与应用","body":"进入 AI 小顾、顾问工作台、应用广场、合作方 Agent 与外部平台。","status":"target","source":"飞书 P9 原始五层能力图 · revision 2157"}],"callout":{"label":"横向治理","text":"身份与最小权限、用户授权、版本依赖、质量测试、合规与 HITL、审计计量、下线机制必须贯穿五层。","status":"target"}},{"id":"entry-strategy","kicker":"P11 · SUPER ENTRANCE","title":"三类入口各有角色","lead":"微信承接服务路由，千问同时放大标准能力与完整 Agent，百度处于历史能力恢复与升级评估；状态必须分开。","layout":"comparison","tone":"light","navLabel":"入口角色","items":[{"index":"W","eyebrow":"WECHAT","title":"发现与承接","body":"Agent 识别投资意图，且慢 Skills 提供判断，小程序承接身份、账户、交易与持续服务。","meta":"历史联调画面已确认；当前生产状态待验证","status":"confirmed","source":"飞书 P11/P12 · revision 2157"},{"index":"Q","eyebrow":"QWEN","title":"能力与 Agent 双模式","body":"MCP 让标准能力按需调用；A2A 把完整且慢小顾作为服务交给千问。","meta":"合作画面已确认；稳定性与漏斗待补","status":"confirm
