    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};let activeSyncFrame=0;const syncActiveFromScroll=()=>{if(navigating)return;const navOffset=$("#nav-shell").offsetHeight;let closest=0;let distance=Infinity;panels.forEach((panel,index)=>{const target=panel.id==="top"||panel.id==="agenda"?0:navOffset;const value=Math.abs(panel.getBoundingClientRect().top-target);if(value<distance){distance=value;closest=index}});setActivePanel(closest)};addEventListener("scroll",()=>{updateProgress();if(!activeSyncFrame)activeSyncFrame=requestAnimationFrame(()=>{activeSyncFrame=0;syncActiveFromScroll()})},{passive:true});updateProgress();
  </script>
  <script>
    (()=>{
      const mount=(sectionId,src,alt)=>{
        const root=document.querySelector(sectionId+" .architecture");
        if(!root)return;
        root.className="relationship-module reveal visible";
        root.setAttribute("aria-label",alt);
        root.innerHTML='<figure class="relationship-stage"><div class="relationship-scroll"><img src="'+src+'" alt="'+alt+'" loading="eager" decoding="async"></div></figure>';
      };
      mount("#system-relationship","assets/system-relationship.svg","盈米 AI 系统关系图完整可视化");
      mount("#service-relationship","assets/service-relationship.svg","盈米 AI 服务关系图完整可视化");
      wireImageRecovery(document);
    })();
  </script>
  <script id="oap-layout-behavior">
    (()=>{
      document.documentElement.style.setProperty("--accent","#7457e8");
      document.documentElement.style.setProperty("--accent-2","#9d86f2");
      document.documentElement.style.setProperty("--accent-soft","#f0ecff");
      const nav=document.querySelector(".nav-shell");
      if(!nav)return;
      let frame=0;
      const sync=()=>{
        frame=0;
        const rect=nav.getBoundingClientRect();
        const y=Math.max(0,Math.min(innerHeight-1,rect.bottom+2));
        const node=document.elementFromPoint(innerWidth/2,y);
        const panel=node&&node.closest(".section,.hero");
        nav.dataset.moduleTone=panel&&(panel.classList.contains("dark")||panel.classList.contains("closing"))?"dark":"light";
        document.body.classList.toggle("cover-active",panel?.id==="top");
        document.body.classList.toggle("agenda-active",panel?.id==="agenda");
      };
      const queue=()=>{if(!frame)frame=requestAnimationFrame(sync)};
      addEventListener("scroll",queue,{passive:true});
      addEventListener("resize",queue,{passive:true});
      sync();
    })();
  </script>
</body>
</html>
