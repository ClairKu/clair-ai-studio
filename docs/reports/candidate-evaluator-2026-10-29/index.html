$('resume-form').addEventListener('submit',async ev=>{ev.preventDefault();const b=$('screen-button');b.disabled=true;b.textContent='正在收集…';try{const epoch=sessionEpoch,file=chosenFile,text=$('resume-text').value.trim(),role=$('new-role').value,name=$('new-name').value.trim();if(file&&/\.(pdf|docx)$/i.test(file.name)){if(!engineConnected)throw Error('PDF / DOCX需要本机服务。可先粘贴正文，或使用已启动的本机收集页面。');const bytes=new Uint8Array(await file.arrayBuffer());if(epoch!==sessionEpoch)return;let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));sessionLocked=false;engineSignature=null;const result=await api('/api/upload',{filename:file.name,content_base64:btoa(binary),role,...(name?{name}: {})});if(epoch!==sessionEpoch)return;await refreshEngine();const c=data.candidates.find(x=>x.id===result.candidate_id);if(c)showScreening(c);toast(result.status==='duplicate'?'这份简历已经收过了。':'简历已收下，等待 AI 分析。');return}if(!text)throw Error('请粘贴履历正文，或先选择可读文件。');if(text.length<30)throw Error('正文过短，请补齐经历与项目内容后再定位线索。');if(engineConnected){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));const filename=chosenFile&&/\.(txt|md)$/i.test(chosenFile.name)?chosenFile.name:'粘贴履历.txt';sessionLocked=false;engineSignature=null;const result=await api('/api/upload',{filename,content_base64:btoa(binary),role,...(name?{name}: {})});if(epoch!==sessionEpoch)return;await refreshEngine();const current=data.candidates.find(x=>x.id===result.candidate_id);if(current)showScreening(current);toast(result.status==='duplicate'?'这份简历已经收过了。':'简历已收下，等待 AI 分析。');return}const hash=await digestText(text);if(epoch!==sessionEpoch)return;const old=data.candidates.find(c=>arr(c.documents).some(d=>d.sha256===hash)||c.source_sha256===hash);if(old){showScreening(old);toast('相同正文已存在，未重复建立候选。');return}const cid='cand-'+hash.slice(0,16),docid='doc-'+hash.slice(0,16),filename=chosenFile?.name||'粘贴履历.txt
