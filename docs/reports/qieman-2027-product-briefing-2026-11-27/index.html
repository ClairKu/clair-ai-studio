<script>(() => {
  "use strict";
  const payload = JSON.parse(document.getElementById("encrypted-payload").textContent);
  const form = document.getElementById("form");
  const field = document.getElementById("code");
  const button = document.getElementById("open");
  const status = document.getElementById("status");
  const frame = document.getElementById("reader");
  const bytes = text => Uint8Array.from(atob(text), value => value.charCodeAt(0));
  function readCode(value) {
    const trimmed = value.trim();
    if (trimmed.startsWith("https://")) {
      try { return new URLSearchParams(new URL(trimmed).hash.slice(1)).get("open") || ""; }
      catch { return ""; }
    }
    return trimmed;
  }
  async function unlock(value) {
    if (button.disabled || !value) return;
    if (!globalThis.crypto?.subtle) {
      status.textContent = "请使用支持本地解密的浏览器，或打开随附的独立 HTML。"; return;
    }
    button.disabled = true;
    status.textContent = "正在打开规划…";
    try {
      const input = await crypto.subtle.importKey("raw",new TextEncoder().encode(value),"PBKDF2",false,["deriveKey"]);
      const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(payload.salt),iterations:payload.iterations,hash:"SHA-256"},input,{name:"AES-GCM",length:256},false,["decrypt"]);
      const data = await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(payload.iv),additionalData:new TextEncoder().encode(payload.aad),tagLength:128},key,bytes(payload.ciphertext));
      frame.srcdoc = new TextDecoder("utf-8",{fatal:true}).decode(data);
      field.value = "";
      document.getElementById("lock").hidden = true;
      document.body.classList.add("ready");
      frame.hidden = false;
      try { sessionStorage.setItem('qieman-plan-2027-briefing-read',value); } catch {}
      status.textContent = "";
    } catch {
      status.textContent = "未能打开，请核对阅读码或重新打开专属链接。";
    } finally { button.disabled = false; }
  }
  form.addEventListener("submit",event => {event.preventDefault();void unlock(readCode(field.value));});
  let remembered = ''; try { remembered = sessionStorage.getItem('qieman-plan-2027-briefing-read') || ''; } catch {}
  const code = new URLSearchParams(location.hash.slice(1)).get('open') || remembered;
  if (code) void unlock(code);
})();
</script></body></html>
