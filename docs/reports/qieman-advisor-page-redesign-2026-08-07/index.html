  <script type="application/json" id="report-data">{"meta":{"title":"且慢投顾页盘点与新版设计方案","subtitle":"投顾页 × 投资工具 × 策略营销 × AI 小顾｜本体盘点 · 功能迭代 · 使用转化 · 洞察 · 新版蓝图","eyebrow":"且慢产品 / ADVISOR PAGE REDESIGN","date":"2026-08-07","cutoff":"2026-08-07（各数字以条目内截至时间与口径为准；埋点窗口 2026-07-01—16 + 7 日观察）","owner":"且慢产品研究｜Clair","confidentiality":"内部研究 · 数字均注明来源与口径","accent":"#8067e8"},"hero":{"conclusion":"投顾页应从「静态货架」升级为小顾驱动的「规划式服务门户」：定制优先、主动引导、货架可视、组件可组装。","thesis":"本体盘点显示：且慢的信任基本盘扎实（投顾用户盈利占比 96%、平均持有 772 天），但投顾页仍是十年未体系升级的静态货架——定制方案只是一条 banner、工具与货架零串联、AI 小顾与页面平行存在、高交易意向内容得不到曝光。2025 年 11 月投顾费改为直接收入后，推品效率从「重要」变为「生死攸关」。新版方案以「规划为主、定制为主、主动引导为主」重构页面主线，用小顾贯穿识别→建议→方案→执行→复用全旅程，同时以可视化配置地图与用户自定义服务组件保留自助弹性。","badges":["本体盘点","使用与转化实测","新版投顾页方案","证据化"]},"sections":[{"id":"why-now","kicker":"01 · WHY NOW","title":"三个拐点逼出改版","lead":"为什么是现在动投顾页：商业模式、货架供给、AI 能力三条线在 2025—2026 年同时到达拐点。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"商业模式","title":"投顾费成为直接收入","body":"2025-11-03 起第一批组合从「交易费抵扣投顾费」（全市场独此一家坚持 5 年）改为按月收取投顾费：长赢 \u003c100 万部分 0.5%/年、阶梯递减、月封顶 2000 元。推品效率与 AUM 转化从「重要」变为「生死攸关」。","status":"confirmed","source":"且慢官方公告 2025-10-23 · content.qieman.com/items/20419"},{"index":"02","eyebrow":"货架供给","title":"品类矩阵换血约 1/3","body":"研究院品类矩阵升级：四笔钱与严选体系换血约 1/3，3070/5050 等新策略填补风险断档，需要配套页面与陪伴体系。静态硬编码货架承接不动这个上新节奏，每次换血都要排期发版。","status":"confirmed","source":"且慢业务场景.xlsx（2026-06-15）· V1.0 决策稿 2026-07-23"},{"index":"03","eyebrow":"AI 能力","title":"小顾就绪但被边缘化","body":"AI 小顾 2024-05 上线、2025-02 接入 DeepSeek-R1，可秒级生成定制方案并自动化管理账户——「定制优先」原则最可规模化的载体已经存在，但 30 日启动 UV 仅 11,150，与投顾页平行存在、未进入主流账户旅程。","status":"confirmed","source":"百度百科且慢词条；本体使用证据页（经营口径截至 2026-07-24）"}],"callout":{"label":"关键判断","text":"改版不是视觉翻新，而是把「定制优先」的推品原则第一次落成页面级流程——这是收费模式切换后的经营必答题。","status":"confirmed"}},{"id":"business-base","kicker":"02 · BASELINE","title":"基本盘扎实但集中","lead":"两套口径并列呈现：盈米官方投顾口径与且慢 APP 本体聚合口径，不混算。信任充足，是改版最大的资产，也是最不能破坏的东西。","layout":"metrics","tone":"soft","items":[{"title":"公募投顾规模（盈米口径）","metric":"540 亿+","meta":"截至 2026-03-31 · App Store 官方描述（数据来源盈米基金）","status":"confirmed","source":"App Store 且慢官方页面 2026"},{"title":"基金保有量","metric":"2287 亿+","meta":"截至 2026-03-31 · 盈米官方","status":"confirmed","source":"App Store 且慢官方页面 2026"},{"title":"投顾用户盈利占比","metric":"96%","meta":"截至 2025-09-30；历史口径随市场波动：98%（2021 初）→ 80%+（2025-02）→ 96%","status":"confirmed","source":"且慢公告 2025-10-23"},{"title":"投顾用户平均持有","metric":"772 天","meta":"截至 2025-09-30（前口径 690 天），远高于自主交易用户","status":"confirmed","source":"且慢公告；证券时报 2025-03"},{"title":"累计注册用户（本体口径）","metric":"378.3 万","meta":"截至 2026-07-24 · 本体聚合；有资产用户 42.4 万，资产激活率 11.2%","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页"},{"title":"本体在管规模 AUM","metric":"402.7 亿","meta":"截至 2026-07-24 · 本体聚合口径，近 12 个月 +15.8%；与 540 亿盈米口径分属两套统计，不可混算","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页"},{"title":"投顾签约用户","metric":"54.1 万","meta":"累计签约口径，不等于当前持有 · 截至 2026-07-24","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页"},{"title":"长赢系占本体 AUM","metric":"57.6%","meta":"232.14 亿（长赢 150 份 + S 定投）；经典组合 129.54 亿（32.2%）、信号策略 36.91 亿（9.2%）","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页"}],"callout":{"label":"结构风险","text":"资产高度集中于长赢与头部主理人：信任是底盘，但入口独立、交易链路割裂，让「产品形态」而非「用户目标」支配了信息架构；有资产用户中 37.9% 持有不足 1,000 元、仅贡献 0.03% AUM。","status":"confirmed"}},{"id":"page-anatomy","kicker":"03 · AS-IS","title":"投顾页仍是静态货架","lead":"2026-07-23 对 qieman.com/m4（APP 投顾 Tab 对应网页版）自上而下逐屏走查：投顾页是且慢唯一未做过体系性升级的一级页面。","layout":"process","tone":"light","items":[{"index":"①","eyebrow":"BANNER","title":"定制方案 Banner","body":"「新增资金如何合理投资？量身定制您的投资方案」→ 需登录的规划微应用（卡片带 AI 机器人插图，实为小顾定制流入口）。这是「定制优先」原则在页面上的唯一露出：无预览、无价值证明、无与持仓/目标的关联。","status":"confirmed","source":"01 现况盘点 · 2026-07-23 实探；qieman.com 实机走查 2026-08-07"},{"index":"②","eyebrow":"BANNER","title":"养老专区 Banner","body":"「一站式养老专区」→ 养老储蓄罐 + 富达测算 + 颐养天年计划 + 推荐产品三 Tab。是目前唯一「测算→方案→产品」闭环较完整的专区，可作改版模式参照。","status":"confirmed","source":"01 现况盘点 · 2026-07-23 实探"},{"index":"③","eyebrow":"SHELF","title":"四笔钱货架 19 卡","body":"活钱 2 + 短期稳健 5 + 长期投资 5 + 保险保障 7。产品卡 = 名称 + 主理方 + 一个收益数字 + 一句卖点：无风险谱系可视化、无横向对比、无「为什么推荐给我」。","status":"confirmed","source":"01 现况盘点 · 2026-07-23 实探"},{"index":"④","eyebrow":"TOOLS","title":"底部三个工具入口","body":"攒钱计划（独立 H5）、严选策略（更多：短稳 9 + 长期 7）、每日估值（订阅 10.9 万人）。工具与货架、规划之间零串联。","status":"confirmed","source":"01 现况盘点 · 2026-07-23 实探"},{"index":"⑤","eyebrow":"SERVICE","title":"客服气泡浮层","body":"「产品不会选，来问我吧～」在线客服。单策略咨询量 5.5 万+（稳稳的幸福详情页），说明「选品决策难」被外包给了人工客服。","status":"confirmed","source":"01 现况盘点；稳稳的幸福详情页披露 2026-07"}],"callout":{"label":"现状定性","text":"页面本质是「定制 banner + 静态货架清单 + 三个孤岛工具」：规划、推品、工具三层互相孤立，「定制方案优先于标准策略」的推品铁律没有页面级流程承载。","status":"confirmed"}},{"id":"iteration","kicker":"04 · HISTORY","title":"十年迭代到拐点","lead":"从「高手云集的基金组合平台」到持牌投顾、账户化、AI 化：加粗节点改变了产品性质。","layout":"timeline","tone":"light","items":[{"title":"且慢 1.0 上线","meta":"2016-07-14","body":"App Store 首发，定位「高手云集的基金组合平台」；2017-04-01 E 大「长赢指数投资计划」上线成为转机之作。","status":"confirmed","source":"00 网络调研 · MWM 应用情报页；孟岩《且慢，重新说再见》"},{"title":"首创「四笔钱」框架","meta":"2018","body":"把规划前置为账户框架（活钱/稳钱/长钱/保险），后成行业事实标准，2024 年出版《管好四笔钱 财富滚雪球》。","status":"confirmed","source":"盈米官网 archives/171；00 网络调研"},{"title":"投顾业务正式上线","meta":"2020-10-22","body":"「四笔钱投顾服务升级计划」：第一批投顾组合、自动跟车、交易费抵扣投顾费模式；2019-12 盈米获首批投顾试点（独立销售机构仅 3 家）。","status":"confirmed","source":"盈米官网/中国日报 2020-10-23"},{"title":"养老专区上线","meta":"2022-12","body":"「1+1+1」账户体系、Y 份额税优、富达养老计算器；2023-07 颐养天年计划成立。投顾规模 2021-07 破 100 亿、2021-12 破 200 亿。","status":"confirmed","source":"盈米官网 archives/238；App Store 描述"},{"title":"投顾 2.0 + AI 小顾","meta":"2024","body":"以财富目标为起点的账户管理模式；2024-05 AI 小顾上线，2025-02 接入 DeepSeek-R1、规模破 400 亿；2025-04 发布财富管理首个 MCP Server（累计调用超 600 万次、服务 150 家机构）。","status":"confirmed","source":"百度百科且慢词条；证券时报 2025-03；晨星/新华财经 2025 案例集"},{"title":"收费模式拐点","meta":"2025-11-03","body":"第一批组合改为按月收投顾费；同步上线同路人权益体系（时长 × 规模双维定级）。2025-09 规模破 500 亿、盈利占比 96%、平均持有 772 天。","status":"confirmed","source":"且慢公告 2025-10-23"},{"title":"规模 540 亿，页面未动","meta":"2026-03-31","body":"投顾规模突破 540 亿、保有量超 2287 亿；投顾一级页面仍是 2020 年货架结构——供给、商业模式、AI 能力都升级了，分发界面没有。","status":"confirmed","source":"App Store 官方描述 2026；01 现况盘点"}]},{"id":"usage-funnel","kicker":"05 · USAGE","title":"实测：流量不缺","lead":"2026-07 投顾页埋点实测（点击率 = 点击去重用户 ÷ 投顾页去重访问用户 76,758，为代理口径；7 日转化仅纳入 7-01—16 首击用户保证完整观察期）。","layout":"metrics","tone":"light","items":[{"title":"投顾页访问用户","metric":"76,758","meta":"App 页面 UV · 2026-07 埋点窗口；访问 282,804 次 = 3.68 次/访问用户","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"title":"四笔钱「活钱管理」点击率","metric":"24.22%","meta":"四类分别为 24.22% / 21.86% / 18.50% / 12.33%（点击 UV 18,591 / 16,779 / 14,203 / 9,468）——页面最高点击内容","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"title":"稳稳的幸福 7 日下单请求率","metric":"21.43%","meta":"652 / 3,043 完整样本；页面点击率 5.36%（4,115 人）为策略第一——规模与转化双高","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"title":"盈米宝 7 日下单请求率","metric":"35.89%","meta":"543 / 1,513；页面点击率仅 2.71%——全页最高交易意向，曝光最少","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"title":"投顾助理严格曝光转化","metric":"5.08%","meta":"打开 1,097 ÷ 曝光 21,593——当前页面唯一可用的严格模块级曝光转化率","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"title":"策略页→跟车转化率","metric":"2.5%","meta":"本体主交易链路口径——主漏斗的关键断点","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页（截至 2026-07-24）"},{"title":"AI 小顾 30 日启动 UV","metric":"11,150","meta":"同期持仓查看 UV 428,090，比值 2.6%——尚未进入主流账户旅程；事件名三代漂移，数字属下限","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页"},{"title":"每日估值订阅","metric":"109,759","meta":"2026-07-22/23 公开页实测——工具用户体量可观（对比长赢跟投 40 万+），转化路径缺失","status":"confirmed","source":"01 现况盘点 · 页面实测"}],"callout":{"label":"漏斗定性","text":"7.6 万人每月来逛 3.68 次，说明流量与回访习惯都在；断点发生在「匹配」——用户与适配方案之间隔着一张没有被设计过的清单。","status":"inferred"}},{"id":"conversion-insights","kicker":"06 · INSIGHT","title":"高点击≠高转化","lead":"真正影响改版优先级的不是「谁点击多」一个维度：把点击率与 7 日下单请求率放在一起，结构问题立刻显形。","layout":"cards","tone":"soft","items":[{"index":"01","eyebrow":"导航≠选品","title":"四笔钱是切换不是转化","body":"活钱 24.22%、短稳 21.86%、长期 18.50%、保险 12.33% 的高点击，是用户在页面内切换钱用途的导航行为，应与具体策略卡分开评估，不能当作推品成功。","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"index":"02","eyebrow":"双高标杆","title":"稳稳的幸福规模转化双高","body":"点击率 5.36%（策略第一）× 7 日下单请求率 21.43%：继续承担主力坑位。它验证了「稳健 + 强社会证明 + 明确适配说明」的详情页范式有效。","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"index":"03","eyebrow":"高流量低意向","title":"全球丰收缺价值解释","body":"点击率第二（4.30%）但 7 日下单请求率仅 8.35%：流量入口通畅，问题在「适合谁、为何现在、主要风险、资金期限」的价值解释与适配判断。实机走查显示它已改用营销落地页承接（策略目标 + 信号定投推广）——说明营销页解决不了「适配判断」这一步，需要个性化承接。","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24；qieman.com 实机走查 2026-08-07"},{"index":"04","eyebrow":"高意向低曝光","title":"盈米宝、货币三佳被埋没","body":"7 日下单请求率 35.89% / 23.60%，页面点击率却只有 2.71% / 1.69%——交易意向最强的内容最不显眼，应优先保护并做小流量提权实验。","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"index":"05","eyebrow":"可测性盲区","title":"最大盲区是曝光不是点击","body":"1,685 名用户产生空元素点击；顶部 Banner 无稳定 banner_id、收益率被拼进元素文案；「攒钱计划」点击后到达仅 73.58%、「投顾助理」点击→打开匹配仅 43.94%——先修可测性，再谈排序优化。","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"}],"callout":{"label":"历史参照","text":"2023 年养老专区入口页面到目标总转化 3.38%、小顾问诊 2.83%（旧看板，不与当前混算）——服务型入口的转化天花板从来不低，缺的是被编排进主旅程。","status":"confirmed"}},{"id":"tools","kicker":"07 · TOOLS","title":"工具多而不连","lead":"投资工具盘点：每个工具都有真实用户，但全部是「资讯孤岛」——没有一个工具的出口通向配置动作。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"资讯工具","title":"每日估值：10.9 万订阅","body":"股债两市、宽基/行业/主题/策略/全球筛选，PE/PB 分位配色表。订阅 109,759 人（2026-07 实测），但「低估」不等于「可买的且慢策略」，与货架零链接。","status":"confirmed","source":"01 现况盘点 · 页面实测 2026-07-23"},{"index":"02","eyebrow":"转化工具","title":"信号定投：绑定单策略","body":"策略详情页新功能，自动跟随主理人节奏定投（详情页气泡推广中）。是有效的转化工具，但只绑定单策略，未上升为页面级能力。","status":"confirmed","source":"01 现况盘点 · 稳稳的幸福详情页"},{"index":"03","eyebrow":"DIY 工具","title":"自建组合：上限 5 个","body":"官网 /funds 入口，用户评价显示上限 5 个；另有回测、资产分布分析（App Store 描述）。DIY 路径与严选货架、诊断能力互相隔离，无公开使用数据。","status":"confirmed","source":"01 现况盘点；App Store 用户评价"},{"index":"04","eyebrow":"场景工具","title":"攒钱计划：独立 H5","body":"「轻松攒钱 增厚收益」场景化入口（2026 焕新版）；投顾页点击后 10 分钟目标到达仅 73.58%，需排查登录、微应用或重定向损耗。","status":"confirmed","source":"01 现况盘点；投顾页点击与转化分析"},{"index":"05","eyebrow":"规划工具","title":"规划测算已存在未编排","body":"APP 内有四笔钱配置分析看板、资产类别目标配置、10 年规划测算曲线（App Store 截图可见）；养老侧有富达测算模型。断点：规划结论与货架推品之间是弱链接，规划完成后仍回到人工逛货架。","status":"confirmed","source":"00 网络调研 · App Store 截图解说；01 现况盘点"},{"index":"06","eyebrow":"待确认","title":"温度计等三项未证实","body":"「温度计」「行情信号」「额度宝」未找到且慢公开记录（温度计公开可查为好买/有知有行工具、额度宝为理财通/天天基金工具），需内部确认实际状态、数据归属与去留。","status":"missing","source":"00 网络调研 2026-07-23"}],"callout":{"label":"工具定位判断","text":"工具是高频回访钩子（流量），不是转化本身：新版每个工具的结果页都必须带「由此去配置」的推品出口，否则 10.9 万估值订阅者永远只是资讯读者。","status":"inferred"}},{"id":"marketing","kicker":"08 · MARKETING","title":"营销靠信任不靠货架","lead":"策略营销现状：买方投顾叙事 + 主理人信任 + 社会证明扛起了几乎全部转化，页面层的推品体系处于缺位状态。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"定位叙事","title":"不卖爆款、不做排行榜","body":"买方投顾定位：收入与客户资产增值挂钩；2020 年爆款基金潮中「顶住数百亿规模诱惑一款都没卖」。这是品牌信任的来源，也约束了营销手段——不能靠收益率排行拉新。","status":"confirmed","source":"且慢公告 2025-10-23；00 网络调研"},{"index":"02","eyebrow":"转化手段","title":"社会证明是核心武器","body":"稳稳的幸福详情页：「实盘运行 2900 多天」「超 50 万用户跟投」（历史累计文案；盘点核录跟投 18.3 万+）、咨询 5.5 万+；长赢跟投 40 万+（2025-10 报道）。详情页四格适配说明是静态文案，非个性化判断。","status":"confirmed","source":"稳稳的幸福详情页 2026-07；01 现况盘点"},{"index":"03","eyebrow":"陪伴营销","title":"主理人观点流即内容营销","body":"详情页内嵌主理人观点（长赢页 E 大观点直出）、调仓跟车通知、主理人周报、社区群页——「陪伴」是且慢式营销的主形态，把波动期变成信任积累期。","status":"confirmed","source":"长赢详情页 qieman.com 实测 2026-08-07；00 网络调研"},{"index":"04","eyebrow":"货架断档","title":"同风险收益差 2 倍无法感知","body":"28 个在售策略横跨风险分 1—81，但风险分 20—50 区间供给断档（恰是「稳中求进」大众客群的中腰部）；同风险档年化差异巨大（风险分 73 进取派 4.92% vs 风险分 57 价值五剑 10.07%，净值 2026-07-22）——列表式货架完全无法让用户感知。","status":"confirmed","source":"01 现况盘点 · 盈米 MCP 实拉数据"},{"index":"05","eyebrow":"漏斗退化","title":"推品理念在页面上退化","body":"设计的漏斗是「规划→账户→期限匹配推品、定制优先」；页面实际是：定制 = 1 条 banner、严选折叠在「更多」、四笔钱与严选关系未表达、无任何基于持仓/行为/目标的个性化。理念漏斗退化为一张平铺清单。","status":"confirmed","source":"01 现况盘点 ⑧ 推品逻辑现状"},{"index":"06","eyebrow":"留存抓手","title":"同路人权益补了留存缺获取","body":"同路人权益体系（2025-10 上线）以「资产规模 × 同行时长」定级，含账户深度分析、家庭财务分析等服务权益——留存侧已有抓手，页面缺的是获取与转化侧的体系化设计。","status":"confirmed","source":"且慢公告 2025-10-23；01 现况盘点"},{"index":"07","eyebrow":"社区营销","title":"群页资格闭环是营销前提","body":"长赢群页评审结论「有条件通过」：策略社区页（帖子/直播/课程/工具/策略）真正的上线阻断项不是视觉，而是「加入小组」背后的资格、协议与异常状态未闭环；核心指标应为「资格用户加入成功率」，不能拿全量访客当分母——策略社群营销必须先做状态机再做转化。","status":"confirmed","source":"长赢群页需求评审 2026-07-30"}]},{"id":"xiaogu","kicker":"09 · AI 小顾","title":"小顾能力强入口弱","lead":"AI 小顾是「定制优先」最可规模化的载体，但它今天与投顾页平行存在：能力已就绪，编排未发生。","layout":"cards","tone":"soft","items":[{"index":"01","eyebrow":"能力现状","title":"秒级方案 + 自动账户管理","body":"2024-05 上线、2025-02 接入 DeepSeek-R1：输入投资时长、风险偏好、预期目标即可生成专属方案，实现「全程自动化的账户管理」（App Store 官方描述）。24 小时在线，是人工顾问定制能力的规模化版本。","status":"confirmed","source":"App Store 官方描述 2026；百度百科且慢词条"},{"index":"02","eyebrow":"使用现状","title":"30 日启动 UV 仅 1.1 万","body":"AI 小顾 30 日启动 UV 11,150，同期持仓查看 UV 428,090——比值 2.6%，尚未进入主流账户旅程。三代事件名（mia_bot_*/cortex_bot_*）漂移，数字属下限，但量级判断成立。","status":"confirmed","source":"且慢 APP 全景 · 使用情况与证据页（截至 2026-07-24）"},{"index":"03","eyebrow":"入口现状","title":"投顾页入口点击率 1.70%","body":"投顾页「投顾助理」点击 UV 1,304（1.70%）、点击→算法打开匹配仅 43.94%（埋点口径分叉）；严格曝光转化 5.08%（1,097/21,593）。2023 年「小顾问诊」历史总转化 2.83% 可作参照。","status":"confirmed","source":"投顾页点击与转化分析 2026-07-24"},{"index":"04","eyebrow":"结构问题","title":"与投顾页平行而非贯穿","body":"小顾是独立入口（web 端为右侧常驻悬浮气泡 + 货架页顶部定制卡两处），不参与投顾页的货架推荐、工具出口和陪伴内容——「最接近定制优先的自动化载体」没有被编排进「推品的主阵地」，两边各自为战。","status":"confirmed","source":"01 现况盘点 ⑥ 工具盘点；qieman.com 实机走查 2026-08-07"},{"index":"05","eyebrow":"演进路线","title":"小顾 3.0 正补主动服务","body":"能力演进四阶段：1.0 账户服务一体化（已完成）→ 2.0「总指挥 + 多专家」协同解题（已成形）→ 3.0 长期记忆、持续任务、主动触发、结果写回（当前建设，目标态）→ 4.0 发现需求→生成方案→授权执行→结果反馈的任务闭环（终局规划）。新版投顾页恰好是 3.0「主动触发」的最佳落点。","status":"confirmed","source":"且慢 AI 产品实践 2026-07-30（3.0/4.0 为 target 状态）"},{"index":"06","eyebrow":"生态位","title":"对外能力反而跑得更快","body":"盈米 2025-04 发布财富管理首个 MCP Server，累计调用超 600 万次、服务 150 家机构；OAP 后台累计调用 9,145,099 次（截至 2026-07-28）。但外部生态呈同样结构：财经资讯单项占展示调用 42.9%，11 个投顾服务接口合计仅占 4.0%（获取资产配置方案 21.6 万次）——内容强、投顾任务承接弱，与站内问题同构。","status":"confirmed","source":"MCP Top20 审计 2026-08-03（页面展示值估算口径）；OAP 后台 2026-07-28"},{"index":"07","eyebrow":"成效快照","title":"三个成效数字待补口径","body":"内部材料记录：34% 且慢活跃用户使用、50%+ 复用用户周重复使用、14% 用户交易转化率——统计周期、活跃/复用定义、转化分母均未标注，完成回源前只能视为材料快照，不得与 30 日启动 UV 11,150 混用或对外引用。","status":"missing","source":"且慢 AI 产品实践 2026-07-30（原文标注「待补口径」）"}],"callout":{"label":"关键判断","text":"小顾的问题不是能力不足，而是「没有工作岗位」：新版方案的核心动作就是给小顾三个岗位——页面开场的规划引导、常驻的主动服务看板、贯穿所有组件的定制行动点。","status":"inferred"}},{"id":"diagnosis","kicker":"10 · DIAGNOSIS","title":"五个结构性问题","lead":"把盘点收敛为五个可立项的问题：它们共同指向同一个病根——页面的生产方式落后于服务的供给方式。","layout":"cards","tone":"dark","items":[{"index":"P1","eyebrow":"主线断裂","title":"定制优先没有流程承载","body":"「定制优先→标准策略兜底」的推品铁律在页面上只是一条 banner：用户从「我有一笔钱/一个目标/持仓要调优」出发，页面没有任何一条被设计过的路径。","status":"confirmed","source":"01 现况盘点 ⑪ 问题诊断"},{"index":"P2","eyebrow":"表达力不足","title":"28 个策略挤成一张清单","body":"一句卖点 + 一个收益数字：同风险收益差 2 倍无法感知、风险 20—50 断档无法暴露、严选与四笔钱关系不清。选品决策难被外包给客服（单策略咨询 5.5 万+）。","status":"confirmed","source":"01 现况盘点 ⑪ 问题诊断"},{"index":"P3","eyebrow":"千人一面","title":"四类用户看同一张页面","body":"新客/有持仓老客/养老人群/高净值完全同构；四笔钱规划、AI 小顾、持仓诊断能力都已存在，但都没被编排进投顾页。","status":"confirmed","source":"01 现况盘点 ⑪ 问题诊断"},{"index":"P4","eyebrow":"形态不统一","title":"专区与工具各自为政","body":"养老是重专区、全球是两个散落策略、攒钱是独立 H5、估值是纯资讯页——新策略体系上线时缺乏可复用的「专区/组件」框架，每次都要重做页面。","status":"confirmed","source":"01 现况盘点 ⑪ 问题诊断"},{"index":"P5","eyebrow":"生产方式","title":"硬编码页面接不住供给","body":"品类矩阵与策略体系由研究院持续迭代（换血约 1/3），但页面是硬编码静态结构，运营无弹性调整空间——页面应由「可编排的服务组件」组成。","status":"confirmed","source":"01 现况盘点 ⑪ 问题诊断；且慢业务场景.xlsx 2026-06-15"}]},{"id":"insights","kicker":"11 · SYNTHESIS","title":"五条核心洞察","lead":"把本体数据、行为数据与产品史合成五条判断——它们是新版方案每个设计决策的依据。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"资产","title":"信任是资产，简单感是护栏","body":"96% 盈利占比、772 天持有、长赢系 57.6% AUM：用户买的是「有人替我把关」的确定感。改版可以变聪明，不能变复杂——任何新增能力都必须收纳在「一个主行动」之后。","status":"inferred","source":"综合 02 基本盘与 00 网络调研"},{"index":"02","eyebrow":"断点","title":"缺的是匹配不是流量","body":"7.6 万月 UV、人均 3.68 次回访、四笔钱切换点击 12—24%：逛的人很多。但策略页→跟车仅 2.5%、高意向内容（盈米宝 35.89%）曝光垫底——断点在「人与方案的匹配」这一步。","status":"inferred","source":"投顾页点击与转化分析；本体使用证据页"},{"index":"03","eyebrow":"杠杆","title":"小顾是最大的单点杠杆","body":"定制优先原则唯一可规模化的载体已经在线（秒级方案 + 自动账户管理），渗透率只有 2.6%：把小顾从「平行入口」变成「页面操作系统」，是投入产出比最高的一步。","status":"inferred","source":"综合 09 小顾盘点"},{"index":"04","eyebrow":"前提","title":"可测性与口径先于优化","body":"Banner 无 ID、空元素点击 1,685 人、小顾事件三代漂移、两个入口到达异常——统一内容身份之前任何排序调整都无法归因。口径同样是信任问题：收益率事故（三页同名「累计收益率」口径冲突，出现 +1114830.17% 失真展示）证明账户数字可信度是投顾页一切服务的底座。","status":"confirmed","source":"投顾页点击与转化分析 P0 建议；收益率事故复盘 QMRD-46867 · 2026-08-04"},{"index":"05","eyebrow":"解法","title":"组件化是供给节奏的唯一解","body":"货架换血 1/3、专区形态不统一、收费模式要求周级运营迭代：只有把页面拆成「数据契约 + 人群规则 + 埋点 + 合规位」的服务组件，上新才能从「排期发版」变成「配置上线」。","status":"inferred","source":"V1.0 决策稿；04 产品规划书"}]},{"id":"principles","kicker":"12 · PRINCIPLES","title":"新版五大设计原则","lead":"围绕既定思路展开：以规划为主、定制方案为主、主动引导为主，同时保留自助自定义的弹性空间。","layout":"cards","tone":"soft","items":[{"index":"01","eyebrow":"主线","title":"规划为主、定制为主","body":"首屏第一交互 = 规划引导（「你有一笔什么钱？」金额 + 期限两问）→ 小顾生成定制方案；标准货架永远从第二屏开始。未完成规划者主推「做规划」，已有方案者主推「执行/调优」。","status":"target","source":"新版方案 · 呼应 V1.0 推荐方案①"},{"index":"02","eyebrow":"驱动","title":"主动引导为主","body":"状态识别（新客未规划/有持仓未签约/已定制未执行/高活跃 DIY）驱动千人千面插槽编排；事件触发主动服务（发薪、回款、市场低估、扣款失败、方案偏离）——页面每天给用户一个「今天值得关注的事」。","status":"target","source":"新版方案 · 呼应小顾个人服务 Demo 概念"},{"index":"03","eyebrow":"中枢","title":"小顾即页面操作系统","body":"小顾深度整合三个岗位：①开场规划两问由小顾承接追问与兜底；②「小顾今日看板」常驻首屏合成行情 + 持仓 + 规划缺口为一句今日建议；③所有组件的行动点（看方案/是否适合我/帮我看看）统一接小顾定制流。这正是小顾八条经验中「从超级入口升级为超级柜台」「个性化来自账户与目标」「从一次问答走向持续陪伴」的页面化。","status":"target","source":"新版方案 · 呼应「深度整合小顾」；AI 小顾八条产品经验 2026-07-30"},{"index":"04","eyebrow":"弹性","title":"自助自定义留出空间","body":"DIY 是被尊重的辅路：风险收益全景图、指标筛选、自建组合不打扰主线但入口清晰；用户可添加/移除/排序可选组件定制自己的投顾页；每个自助出口保留「对比官方方案/让且慢帮我看看」的回流钩子。","status":"target","source":"新版方案 · 呼应用户思路「自助自定义弹性」"},{"index":"05","eyebrow":"呈现","title":"可视化让货架被看见","body":"多元工具收进统一工具条并带「由此去配置」出口；货架用「配置地图」升级：风险分横轴 + 可切换纵轴（回撤/年化/波动/夏普）+ 滑杆选档 + 列表联动，地图与列表是同一份数据的两种视图。","status":"target","source":"新版方案 · 呼应用户思路「可视化策略筛选及货架工具」"}]},{"id":"blueprint","kicker":"13 · BLUEPRINT","title":"新版页面七层蓝图","lead":"页面 = 七层服务组件的编排容器：用户视角是更聪明的投顾页，工程视角是且慢第一个组件化页面，运营视角是周级迭代的推品阵地。以下均为目标态设计，不代表已上线。","layout":"architecture","tone":"light","items":[{"index":"L0","eyebrow":"AI LAYER · 锁定","title":"小顾今日看板","body":"常驻首屏：合成市场温度、组合昨日表现、规划缺口为一句今日建议 + 一个主行动（继续养老定制/补配稳钱/无事陪伴）。内容经合规审核链路，是「每天回来的理由」。","bullets":["主动引导的页面化","AI 内容走审核链路，组件级可下线"],"status":"target","source":"新版方案（参照 V0.9 方案 C AI 层）"},{"index":"L1","eyebrow":"PLAN · 锁定","title":"规划引导条","body":"「你有一笔什么钱？」金额 + 期限两问替代定制 banner：答完→小顾出定制方案/四笔钱归属；不答→自然下滑看标准货架。定制优先原则的页面化，全员一致的北极星入口。","bullets":["未规划者的 slot-1 主行动","小顾追问兜底，人工顾问高净值升级"],"status":"target","source":"新版方案（参照 V1.0 推荐方案①）"},{"index":"L2","eyebrow":"RECO · 锁定","title":"千人千面推荐位","body":"用品类矩阵「适配客群/适配场景」标签做规则匹配：新客见旗舰、持仓客见补配/调优、35+ 见养老、事件触发（发薪/回款/低估）。规则显式可审计，运营后台可配，无需发版。","bullets":["v1 规则引擎而非模型（合规可审计）","Phase 3 升级模型排序"],"status":"target","source":"新版方案（参照 04 规划书编排引擎 v1）"},{"index":"L3","eyebrow":"SHELF · 锁定","title":"配置地图×四笔钱货架","body":"四笔钱 Tab 内 = 旗舰置顶 + 品类分组列表，头部嵌配置地图：X 轴风险分（0—100）、Y 轴默认最大回撤（合规稳）、可切年化/波动/夏普；滑杆选风险档→列表联动。可视化数据管线已被 28 策略实时数据原型验证。","bullets":["移动端首选风险光谱带，展开进二维全景","策略点击→半屏卡→「先看是否适合我」接小顾"],"status":"target","source":"新版方案（V0.9 §3 可视化专题原型已验证）"},{"index":"L4","eyebrow":"ZONES · 可选","title":"目标专区","body":"养老（颐养天年 + 测算）、教育金、全球配置（全球丰收 + 全球优选 + 中西合璧统一叙事）按统一卡片规格成熟一个挂一个——终结「养老重专区/全球散策略/攒钱独立 H5」的形态混乱。","bullets":["专区 = 测算→方案→产品的标准闭环","参照养老专区已验证模式"],"status":"target","source":"新版方案（参照 01 现况盘点⑤）"},{"index":"L5","eyebrow":"TOOLS · 可选","title":"工具条带回流钩子","body":"每日估值、指数温度、行情信号、回测、自建组合聚合为一行工具条 + 异动红点；每个工具结果页带「由此去配置」出口：低估→对应品类策略、自建组合→「让且慢帮我看看」回定制。","bullets":["工具是流量，钩子是转化","10.9 万估值订阅者的转化路径首次打通"],"status":"target","source":"新版方案（参照 V1.0 推荐方案⑤）"},{"index":"L6","eyebrow":"TRUST · 默认开","title":"陪伴信任层＋自定义","body":"96% 盈利/772 天/同路人权益进度/主理人内容流按持仓关联展示；页尾「＋添加模块」进入用户自定义：添加/移除/排序可选组件（估值表/行情信号/攒钱计划/自建看板…），锁定组件不可动。","bullets":["信任是买方投顾的转化前提","自定义 Phase 3 全量开放"],"status":"target","source":"新版方案（参照小顾卡片广场 Demo 概念）"}],"callout":{"label":"编排逻辑","text":"七层全部按组件协议开发、首发用固定编排：不赌任何未验证的交互范式，但从第一天起就用「AI 产品工厂」的方式生产页面。","status":"target"}},{"id":"xiaogu-journey","kicker":"14 · XIAOGU FLOW","title":"小顾主动服务旅程","lead":"小顾深度整合不是加一个对话框，而是让它承包「识别→建议→方案→执行→调优→复用」六步服务闭环。全流程为目标态设计。","layout":"process","tone":"soft","items":[{"index":"①","eyebrow":"SENSE","title":"识别","body":"进入页面即完成状态判定：规划状态 × 持仓结构 × 签约状态 × 活跃度 → 四类人群；识别失败兜底为新客序列。统一事件主键 user × account × goal × plan_version × recommendation_id。","status":"target","source":"新版方案（参照 04 规划书人群规则 v1）"},{"index":"②","eyebrow":"NUDGE","title":"主动建议","body":"今日看板一句话：「稳钱占比偏低，市场温度 32°，适合补配固收+」——每条建议必须可解释、可追溯、绑定适当性校验；无事时输出陪伴内容而非硬推。","status":"target","source":"新版方案（参照小顾个人服务 Demo「今天有 3 件事值得关注」范式）"},{"index":"③","eyebrow":"PLAN","title":"两问定制","body":"「这笔钱多少金额、什么时候用？」→ 小顾秒级生成定制方案（四笔钱归属 + 策略组合 + 为什么适合你）；不愿答的用户自然落到标准货架，「定制不成→标准策略」的降级承接流首次成立。","status":"target","source":"新版方案（参照 V1.0 推荐方案①）"},{"index":"④","eyebrow":"EXECUTE","title":"执行","body":"方案卡一键执行：签约、首笔转入、信号定投跟随主理人节奏；执行进度可视（四笔钱执行进度 2/4）；扣款失败、限价单失效等异常由小顾主动提醒。","status":"target","source":"新版方案（参照小顾个人服务 Demo 待处理事项）"},{"index":"⑤","eyebrow":"TUNE","title":"调优","body":"持仓诊断卡：四笔钱结构缺口 + 配置地图上叠加「你的落点→目标落点」→ 补配建议接定制流。存量用户的复购引擎，也是「我的坐标」可视化的核心场景。","status":"target","source":"新版方案（参照 V0.9 ④我的坐标叠加）"},{"index":"⑥","eyebrow":"RETAIN","title":"复用","body":"追问归因（今天为什么跌）、账户报告（周报/月报）、心愿攒钱、主理人观点推送——把 3.68 次/月的回访习惯升级为「每次回来都有一件事可做」。","status":"target","source":"新版方案（参照小顾个人服务 Demo；历史证据：2024 心愿攒钱开启 291 例）"}],"callout":{"label":"与人工的分工","text":"小顾管规模化（全量用户的识别/建议/方案初稿），人工顾问管深度（高净值家庭蓝图、同路人高等级权益）——AI 定制与专家定制共用同一套方案数据结构。","status":"target"}},{"id":"shelf-visual","kicker":"15 · VISUAL SHELF","title":"货架可视化四形态","lead":"「让 28 个策略被看见」的四种呈现形态：按用户能力分层投放，全部服务于推品而非纯浏览。","layout":"comparison","tone":"light","items":[{"index":"A","eyebrow":"P0 · 移动端首选","title":"风险光谱带","body":"横向 0—100 风险分色带（绿→红），策略以头像点落位；拖动滑杆或点击风险档，下方列表联动。一维、单手可操作，替代纯列表成为货架第一入口。","bullets":["大众用户、四笔钱语境（每桶对应色带一段）","学习成本最低的可视化"],"status":"target","source":"V0.9 §3.2 形态①"},{"index":"B","eyebrow":"P1 · 进阶","title":"风险×收益散点全景","body":"二维全貌：X 轴风险分、Y 轴可切年化/回撤/波动/夏普，按品类着色、框选对比。从光谱带「展开全景」进入；28 策略实时数据交互原型已验证管线可行。","bullets":["进阶用户与 DIY 路径","默认年化 + 悬浮展示回撤；指标白名单不自造"],"status":"target","source":"V0.9 §3.1 交互演示（盈米 MCP 实数据）"},{"index":"C","eyebrow":"P1-P2 · 依赖打标","title":"品类矩阵热力图","body":"行 = 品类、列 = 风险档，格内为策略数与代表策略——把研究院品类表直接变成可购的货架地图；也是运营检查货架完整性（断档暴露）的工具。","bullets":["依赖品类打标 100% 覆盖","「按品类逛」的用户端入口"],"status":"target","source":"V0.9 §3.2 形态③"},{"index":"D","eyebrow":"P1 · 调优核心","title":"我的坐标叠加","body":"在光谱带/全景图上叠加「你的组合当前落点」与「定制方案目标落点」：让调优可视——从这里，到那里。持仓诊断→补配推品的核心呈现。","bullets":["与定制方案联动的差异化亮点","点击任一策略点→半屏卡→「先看是否适合我」"],"status":"target","source":"V0.9 §3.2 形态④"}],"callout":{"label":"合规锚点","text":"以组合风险分数为唯一横轴锚点（口径统一、监管可解释）；默认轴用风险分 × 最大回撤不承诺收益，收益轴为用户主动切换 + 披露脚注，Phase 1 前置合规评审。","status":"target"}},{"id":"components","kicker":"16 · COMPONENTS","title":"用户自定义服务组件","lead":"「自定义」的前提是「组件化」：先定义组件协议与注册表，再分层开放编辑权限——弹性空间是设计出来的，不是放任出来的。","layout":"cards","tone":"soft","items":[{"index":"01","eyebrow":"协议","title":"组件协议五要素","body":"每个服务组件 = 数据契约（MCP/内部接口）+ 人群规则（适配客群/场景标签）+ 埋点规范（归因到组件 ID + 规则版本）+ 合规披露位 + 降级态。协议 Day 1 生效，首发用固定编排。","status":"target","source":"新版方案（参照 04 规划书组件注册表）"},{"index":"02","eyebrow":"注册表","title":"首批 10 个组件","body":"规划引导 planGuide、持仓诊断 holdingDiag、方案执行 planExec、官方主推 opsBanner、工具条 tools、光谱带 spectrum、货架卡 shelf、专区卡 zones、陪伴卡 companion、小顾今日看板 aiBoard（灰度）。","status":"target","source":"04 产品规划书 §3 组件注册表"},{"index":"03","eyebrow":"权限分层","title":"锁定/推荐/自选三层","body":"锁定组件（今日看板、规划引导、推荐位、货架——合规与主推位，用户不可移除）；官方推荐可选组件（专区、陪伴，默认开）；用户自选组件（估值表、行情信号、攒钱计划、自建看板——可添加/移除/排序）。","status":"target","source":"新版方案（参照 V0.9 方案 C 三层结构）"},{"index":"04","eyebrow":"组件市场","title":"卡片广场：自选的货架","body":"「＋添加模块」进入卡片广场：官方组件 + 场景卡片（养老进度、教育金倒计时、低估提醒、心愿攒钱）可浏览、试用、添加。用户在卡片工作室可参数化定制（时间范围、账户、主动提醒、交易待办）并发布——发布流通的只是服务设定与分析框架，不共享任何个人账户数据。","status":"target","source":"新版方案（参照小顾个人服务 Demo 卡片工作室 + 应用广场，概念原型）"},{"index":"05","eyebrow":"多端复用","title":"一次生产多端分发","body":"同一组件可同时分发到 APP 投顾页、微信小程序 AI 对话流、企微陪伴消息——复用微信 AI 原子组件的 PRD 范式，新策略上线 = 研究院出品类 → AI 生成组件初稿 → 合规审核 → 运营挂载。","status":"target","source":"新版方案（参照 V0.9 方案 C 生产方式变革）"},{"index":"06","eyebrow":"合规单元","title":"组件即合规审计单元","body":"每个组件声明「是否构成投顾建议」；建议类组件（诊断卡、今日看板）绑定适当性校验与留痕，编排规则变更走合规审批；AI 内容出问题组件级下线，不影响页面整体。","status":"target","source":"04 产品规划书 §3 合规说明"}]},{"id":"roadmap","kicker":"17 · ROADMAP","title":"三阶段落地路线","lead":"B 起步、预埋 C：先用固定编排把组件化跑通，再开编排后台，最后开放用户组装与 AI 编排——每阶段有明确验收口径。","layout":"timeline","tone":"light","items":[{"title":"Phase 1 · 首发（约 3 个月）","meta":"固定编排","body":"七层组件固定编排上线：规划引导条、推荐位、配置地图只读版（滑杆 + 切轴）、工具回流钩子、陪伴层；新策略（3070/5050 等）按品类矩阵进场；数据工程 P0（品类打标、风险分补全、统一内容 ID 埋点）同步完成。验收：引导条→定制转化率、地图使用率 >20%、货架 CTR 结构、新策略首发签约。","status":"target","source":"新版方案（参照 V1.0 三阶段与 04 规划书 20 周排期）"},{"title":"Phase 2 · 编排化（+3 个月）","meta":"运营可配","body":"编排后台上线，四套人群默认编排（新客/持仓客/养老/高净值）；地图加持仓叠加与调优推品；教育专区上线；小顾今日看板 10% 灰度（合规审核链路前置）；AI 生成组件文案变体进审核流。验收：编排迭代周期到周级、分人群转化差、调优推品贡献 AUM。","status":"target","source":"新版方案（参照 V1.0 Phase 2）"},{"title":"Phase 3 · 千人千面（+3 个月）","meta":"用户组装","body":"开放用户自定义（添加/移除/排序可选组件，锁定组件不可动）+ 卡片广场；推荐位从规则升级为模型排序；AI 对话式编排（备选二「对话即页面」）收编为新客 10% 灰度实验，用数据决定是否升级为主形态。验收：自定义用户留存差、页面→签约 AUM 全量归因。","status":"target","source":"新版方案（参照 V1.0 Phase 3 与备选二收编建议）"},{"title":"降级预案 · 轻改版","meta":"资源约束时","body":"若新策略档期硬且资源被占：只做引导条替换 banner、严选并入四笔钱 Tab 按品类分组、产品卡升级（风险徽章 + 回撤微图 + 适合谁）、工具加钩子——2-3 个月纯前端，代价是组件化推迟半年且二次改版重复成本。","status":"target","source":"V1.0 备选一"}]},{"id":"kpi","kicker":"18 · KPI & EXPERIMENTS","title":"北极星与实验设计","lead":"改版成功与否不靠感觉：北极星 + 三层 KPI + 四组对照实验，上线即有看板。","layout":"cards","tone":"light","items":[{"index":"01","eyebrow":"北极星","title":"投顾服务渗透率","body":"签约投顾服务的资产/用户占比（两套口径各一）。公开锚点：投顾用户盈利占比 96%、平均持有 772 天，均显著优于自主交易用户——迁移本身就是用户价值。","status":"target","source":"04 产品规划书 §1"},{"index":"02","eyebrow":"一级 KPI","title":"三段推品转化","body":"投顾页→定制方案生成率、定制→签约率、货架→跟投率；以及「定制路径转化占比」——验证定制优先是否真的成立，而不是被运营位绕开。","status":"target","source":"04 产品规划书 §1"},{"index":"03","eyebrow":"二级 KPI","title":"页面健康度","body":"投顾页周复访率、工具→品类出口导流率、新策略上线到首次转化的时间（衡量编排式上新效率）、小顾渗透率（启动 UV/持仓查看 UV，基线 2.6%）。","status":"target","source":"04 产品规划书 §1；本体使用证据页基线"},{"index":"04","eyebrow":"实验","title":"四组对照实验","body":"E1 新旧页 10% 对照（主指标推品转化，护栏复访率/客诉率）；E2 定制优先验证（详情页「先看是否适合我」置顶 vs「跟投」置顶）；E3 光谱带 vs 分桶列表；E4 今日看板有无对复访与定制入口点击的影响。","status":"target","source":"04 产品规划书 §8"},{"index":"05","eyebrow":"护栏","title":"合规与体验护栏","body":"建议类组件适当性校验通过率 100%、AI 内容拦截率、误触/撤单率、灰度期推品转化不低于老页面（快速回滚开关 + 老页保留为降级形态）。","status":"target","source":"04 产品规划书 §8-9"}]},{"id":"actions","kicker":"19 · NEXT","title":"立即行动与待补数据","lead":"先修可测性、再定编排、后开实验：P0 动作全部是数据与合规基建，页面开发反而不是第一步。","layout":"actions","tone":"dark","items":[{"index":"01","title":"统一全链路内容身份","body":"曝光、点击、打开、详情、下单请求、下单成功均携带 page_id / module_id / content_id / position_id / strategy_id；App、Web 与不同版本共用同一字典；修复顶部 Banner 无 ID 与动态文案拼进元素的问题。","meta":"P0 · 数据团队 · 改版前置","status":"target","source":"投顾页点击与转化分析 P0 建议"},{"index":"02","title":"排查两个异常入口","body":"逐端复现「攒钱计划」点击后到达仅 73.58%、「投顾助理」点击与打开事件不一致（43.94%），区分真实跳转失败、登录打断与事件漏报；统一小顾三代事件名。","meta":"P0 · 客户端 + 数据 · 2 周内","status":"target","source":"投顾页点击与转化分析 P0 建议"},{"index":"03","title":"品类打标与风险分补全","body":"研究院品类矩阵接入，全量在售策略打上品类 × 桶 × 风险档标签（覆盖率 100%）；组合风险分数覆盖率 ≥99% 并确认唯一口径——这是配置地图与千人千面的共同数据前提。","meta":"P0 · 数据 + 研究院 · M0 阶段","status":"target","source":"04 产品规划书 §5"},{"index":"04","title":"补齐内部数据一批","body":"规划完成率、定制方案生成/转化率、小顾会话深度与满意度、估值订阅→购买转化、四笔钱渗透率（人均配置几笔钱）、同路人等级分布——本报告中标注 missing 的关键决策数据。","meta":"P0 · 数据团队 · 与 D5 清单合并","status":"missing","source":"01 现况盘点 ⑫ 待确认清单"},{"index":"05","title":"合规前置评审","body":"组件建议属性认定、编排规则审计机制、配置地图指标呈现规范（默认回撤轴）、小顾生成内容审核链路与责任主体——Phase 1 开发前完成预审。","meta":"P0 · 合规 + 产品 · M0 阶段","status":"target","source":"04 产品规划书 §9-10"},{"index":"06","title":"方案走查与立项","body":"用本报告 + 可交互 DEMO 向业务方/研究院/合规做一轮走查，收敛组件清单与人群规则；确认资源（估算约 9.5 HC × 20 周）与「严选升级」首个运营档期。","meta":"P1 · 产品 · 本周可启动","status":"target","source":"04 产品规划书 §10"}]}],"sources":[{"label":"且慢本体 qieman.com","detail":"首页 / 投顾货架 m4 / 长赢与全球丰收详情页 / 社区 / 帮助中心 · 2026-08-07 直接抓取 + 浏览器实机走查（走查纪要仅采信结构性发现，数字以官方口径为准）"},{"label":"且慢投顾页点击与转化分析","detail":"2026-07-24 · 埋点窗口 2026-07-01—16 首击 + 7 日观察 · 投顾页 UV 76,758 与全部点击/转化数字"},{"label":"且慢投顾模块现况盘点报告","detail":"2026-07-23 · 净值 2026-07-22 / 风险分 2026-06-30 · 页面解剖、28 策略全景、工具与推品诊断"},{"label":"且慢产品现况网络调研报告","detail":"2026-07-23 · 18 项公开来源 · 里程碑、策略清单、费率变更、竞品对标"},{"label":"改版方向与方案设计（V0.9）+ 推荐方案定稿（V1.0）+ 产品规划书","detail":"2026-07 · 方案 A/B/C、智能配置投顾页六层结构、组件注册表、20 周排期、实验设计"},{"label":"且慢 APP 全景 · 使用情况与证据","detail":"经营口径截至 2026-07-24 · 注册/有资产/AUM 结构/签约/小顾启动 UV/跟车转化率"},{"label":"仓库内已发布报告","detail":"且慢 AI 产品实践（2026-07-30，含 OAP 版 2026-08-04）、AI 小顾八条产品经验、小顾个人服务与卡片广场 Demo（脱敏演示）、长赢群页评审、MCP Top20 审计（2026-08-03）、收益率事故复盘（2026-08-04）"},{"label":"官方与公开来源","detail":"且慢公告 2025-10-23、App Store 官方描述 2026、盈米官网、证券时报 2025-03、晨星/新华财经 2025 案例集等（完整清单见 00 网络调研附录）"}],"openQuestions":[{"title":"定制方案承接口径（D4）","detail":"「定制优先」落到页面后，定制方案由 AI 小顾出、投顾人工出、还是模板化组合方案？转化如何定义与归因？需业务拍板。"},{"title":"APP 大盘与漏斗数据","detail":"总 DAU/WAU/MAU、各 Tab 到达率、规划完成率、定制转化率、小顾会话深度均无可靠数据；统一事件主键落地前跨入口归因不可用。"},{"title":"三个工具的真实状态","detail":"温度计/行情信号/额度宝未找到且慢公开记录（同名工具属于他家平台），需内部确认是否存在、数据归属与去留。"},{"title":"风险分数口径","detail":"MCP 返回的 1—100 组合风险分数与晨星分数的换算/授权关系待确认；抽样 17 只中 1 只缺失，全量覆盖率待数据盘点。"},{"title":"Banner 全端曝光数据","detail":"顶部 Banner 缺稳定 banner_id，各版本/端口径未打通——「每张 Banner 展示了多少、点击了多少」当前无法回答。"},{"title":"小顾成效快照回源","detail":"「34% 活跃用户使用、50%+ 周复用、14% 交易转化」三个数字的统计周期、活跃/复用定义与转化分母待回源确认，确认前不得对外引用。"}]}</script>
  <script>
    const report=JSON.parse(document.getElementById("report-data").textContent);
    const $=(selector,scope=document)=>scope.querySelector(selector);
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const statusLabel={confirmed:"已确认",inferred:"判断",missing:"待补",target:"目标态"};
    const status=value=>value?`<span class="status ${esc(value)}">${esc(statusLabel[value]||value)}</span>`:"";
    const bullets=items=>Array.isArray(items)&&items.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`:"";
    const common=item=>`${item.index?`<span class="item-index">${esc(item.index)}</span>`:""}${item.eyebrow?`<span class="item-eyebrow">${esc(item.eyebrow)}</span>`:""}${item.metric?`<strong class="metric">${esc(item.metric)}</strong>`:""}<h3>${esc(item.title)}</h3>${item.body?`<p class="item-body">${esc(item.body)}</p>`:""}${item.meta?`<span class="item-meta">${esc(item.meta)}</span>`:""}${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}${status(item.status)}`;
    const card=(item,index)=>`<article class="item reveal" style="--n:${index}">${common(item)}</article>`;
    function evidence(item){return `<article class="item reveal"><figure>${item.image?`<img src="${esc(item.image)}" alt="${esc(item.alt||item.title)}" loading="lazy">`:`<div class="evidence-placeholder">SOURCE / EVIDENCE</div>`}</figure><div class="evidence-copy">${common(item)}</div></article>`}
    function demo(section){const tabs=section.items.map((item,index)=>`<button class="demo-tab ${index===0?"active":""}" type="button" data-demo-tab="${index}"><b>${esc(item.title)}</b><span>${esc(item.eyebrow||item.meta||"")}</span></button>`).join("");const panels=section.items.map((item,index)=>`<article class="demo-panel ${index===0?"active":""}" data-demo-panel="${index}"><div class="demo-visual"><span class="item-index">${esc(item.index||String(index+1).padStart(2,"0"))}</span><span class="item-eyebrow">${esc(item.eyebrow||"SCENE")}</span><h3>${esc(item.title)}</h3>${status(item.status)}</div><div><span class="item-eyebrow">${esc(item.meta||"EXPERIENCE WALKTHROUGH")}</span><h3>${esc(item.title)}</h3><p>${esc(item.body||"")}</p>${bullets(item.bullets)}${item.source?`<span class="item-source">来源：${esc(item.source)}</span>`:""}</div></article>`).join("");return `<div class="items demo reveal"><div class="demo-tabs">${tabs}</div><div class="demo-stage">${panels}</div></div>`}
    const number=value=>new Intl.NumberFormat("zh-CN").format(Number(value)||0);
    function usageDashboard(section){const types=Array.isArray(section.institutionTypes)?section.institutionTypes:[];const institutions=Array.isArray(section.items)?section.items:[];const tools=Array.isArray(section.mcpTools)?section.mcpTools:[];const max=Math.max(1,...tools.map(tool=>Number(tool.calls)||0));const meta=section.mcpMeta||{};const typeMarkup=types.map(item=>`<article class="usage-type"><strong>${esc(item.count)}</strong><b>${esc(item.label)}</b><span title="${esc(item.names)}">${esc(item.names)}</span>${item.note?`<em>${esc(item.note)}</em>`:""}</article>`).join("");const institutionMarkup=institutions.map(item=>`<article class="usage-highlight"><span class="usage-highlight-index">${esc(item.index)}</span><h4 title="${esc(item.title)}">${esc(item.title)}</h4><strong>${esc(item.metric)}</strong><span class="usage-highlight-meta">${esc(item.meta)}</span><span class="usage-highlight-tag">${esc(item.eyebrow)}</span></article>`).join("");const toolMarkup=tools.map(tool=>{const percent=Math.max(0,Math.min(100,(Number(tool.calls)||0)/max*100));return `<div class="mcp-tool"><span class="mcp-tool-rank">${String(Number(tool.rank)||0).padStart(2,"0")}</span><span class="mcp-tool-name" title="${esc(tool.name)}">${esc(tool.name)}</span><span class="mcp-track" role="img" aria-label="${esc(tool.name)}调用 ${number(tool.calls)} 次"><span class="mcp-fill" style="--bar:${percent.toFixed(2)}%"></span></span><strong class="mcp-tool-value">${number(tool.calls)}</strong></div>`}).join("");return `<div class="usage-dashboard reveal"><section class="usage-panel"><header class="usage-panel-head"><div><h3>机构覆盖与标杆样板</h3><p>总家数 + 代表机构；重点样板保留调用与用户数</p></div>${status("confirmed")}</header><div class="usage-types">${typeMarkup}</div><div class="usage-subhead"><b>值得关注的 8 家机构</b><span>深度集成 · 团队渗透 · 类目头部</span></div><div class="usage-highlights">${institutionMarkup}</div><span class="usage-source">来源：Stargate 机构使用统计截图 · 最近调用截至 2026-08-02</span></section><section class="usage-panel tools"><header class="usage-panel-head"><div><h3>总体 MCP 工具调用 TOP20</h3><p>当前截图可见 ${esc(meta.visible||tools.length)} / ${esc(meta.requested||20)} 项 · ${esc(meta.period||"统计周期待补")}</p></div>${status("confirmed")}</header><div class="mcp-insight"><b>基金诊断</b><strong>${number(tools[0]?.calls)}</strong><span>${esc(meta.insight||"")}</span></div><div class="mcp-tool-list">${toolMarkup}</div><div class="mcp-pending"><span>16—20 名：数据待补，不补造</span><span>横条按真实调用量线性绘制</span></div></section></div>`}
    function sectionMarkup(section,index){const tone=section.tone||"light";const content=section.layout==="demo"?demo(section):section.layout==="usage-dashboard"?usageDashboard(section):`<div class="items ${esc(section.layout)}">${section.items.map((item,itemIndex)=>section.layout==="evidence"?evidence(item):card(item,itemIndex)).join("")}</div>`;const callout=section.callout?`<div class="callout reveal"><b>${esc(section.callout.label||"KEY TAKEAWAY")}</b><p>${esc(section.callout.text)}</p>${status(section.callout.status)}</div>`:"";return `<section class="section ${esc(tone)}" id="${esc(section.id)}"><div class="wrap"><header class="section-head reveal"><div><div class="kicker">${esc(section.kicker||String(index+1).padStart(2,"0"))}</div><h2>${esc(section.title)}</h2></div><p class="lead">${esc(section.lead||"")}</p></header>${content}${callout}</div></section>`}
    document.documentElement.style.setProperty("--accent",report.meta?.accent||"#8067e8");
    document.title=report.meta?.title||"Clair Executive Visual Report";
    $("meta[name=description]").content=report.hero?.conclusion||report.meta?.subtitle||"Clair Executive Visual Report";
    $("#hero-eyebrow").textContent=report.meta?.eyebrow||"CLAIR · EXECUTIVE REPORT";
    $("#hero-title").innerHTML=esc(report.meta?.title||"").replace(/\s*[｜|]\s*/,"<br><em>")+((report.meta?.title||"").match(/[｜|]/)?"</em>":"");
    $("#hero-subtitle").textContent=report.meta?.subtitle||"";
    $("#hero-conclusion").textContent=report.hero?.conclusion||"";
    $("#hero-thesis").textContent=report.hero?.thesis||"";
    $("#hero-badges").innerHTML=(report.hero?.badges||[]).map(value=>`<span class="badge">${esc(value)}</span>`).join("");
    $("#hero-actions").innerHTML=report.meta?.downloadUrl?`<a class="download-button" href="${esc(report.meta.downloadUrl)}" download>${esc(report.meta.downloadLabel||"下载交付物")}</a>`:"";
    $("#hero-meta").innerHTML=[["报告日期",report.meta?.date],["材料截止",report.meta?.cutoff],["责任方",report.meta?.owner],["范围",report.meta?.confidentiality]].filter(([,value])=>value).map(([label,value])=>`<div><b>${esc(label)}</b><span>${esc(value)}</span></div>`).join("");
    $("#main").innerHTML=(report.sections||[]).map(sectionMarkup).join("");
    $("#chapter-nav").innerHTML=(report.sections||[]).map((section,index)=>`<a href="#${esc(section.id)}"><span>${String(index+1).padStart(2,"0")}</span> ${esc(section.title)}</a>`).join("")+`<a href="#sources">证据边界</a>`;
    $("#source-list").innerHTML=(report.sources||[]).length?(report.sources||[]).map((source,index)=>`<div class="source"><b>${String(index+1).padStart(2,"0")} · ${esc(source.label||source.title||"来源")}</b><span>${esc(source.detail||source.url||"")}</span></div>`).join(""):`<div class="source"><b>暂无外部来源</b><span>请在 report.json 中补充来源、版本与日期。</span></div>`;
    $("#question-list").innerHTML=(report.openQuestions||[]).length?(report.openQuestions||[]).map((question,index)=>`<div class="question"><b>${String(index+1).padStart(2,"0")} · ${esc(question.title||"待确认")}</b><span>${esc(question.detail||question.body||"")}</span></div>`).join(""):`<div class="question"><b>当前无公开待确认项</b><span>仍需在发布前复核材料权限、敏感性与最新版本。</span></div>`;
    $("#footer-left").textContent=`${report.meta?.title||"报告"} · 截至 ${report.meta?.cutoff||"待确认"}`;
    const panels=[$("#top"),...document.querySelectorAll("main>section"),$("#sources")];
    const panelLabels=["报告封面",...(report.sections||[]).map(section=>section.title),"证据边界"];
    const chapterNav=$("#chapter-nav");
    const navLinks=[...document.querySelectorAll(".chapter-nav a")];
    const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    let activePanelIndex=0;
    let scrollFrame=0;
    let navigating=false;
    let restoreScrollStyles=null;
    const syncChapterNav=()=>{const panel=panels[activePanelIndex];const href=panel?.id==="top"?null:`#${panel?.id}`;let activeLink=null;navLinks.forEach(link=>{const active=link.getAttribute("href")===href;link.classList.toggle("active",active);if(active)activeLink=link});let left=0;if(activeLink){const navRect=chapterNav.getBoundingClientRect();const linkRect=activeLink.getBoundingClientRect();const linkCenter=linkRect.left-navRect.left+chapterNav.scrollLeft+linkRect.width/2;left=linkCenter-chapterNav.clientWidth/2}chapterNav.scrollTo({left:Math.max(0,left),behavior:reducedMotion?"auto":"smooth"})};
    const setActivePanel=index=>{activePanelIndex=Math.max(0,Math.min(panels.length-1,index));document.querySelectorAll("[data-page-index]").forEach(node=>node.classList.toggle("active",Number(node.dataset.pageIndex)===activePanelIndex));$("#page-counter").textContent=`${String(activePanelIndex+1).padStart(2,"0")} / ${String(panels.length).padStart(2,"0")}`;syncChapterNav()};
    const cancelPanelNavigation=()=>{if(scrollFrame)cancelAnimationFrame(scrollFrame);scrollFrame=0;navigating=false;if(restoreScrollStyles){restoreScrollStyles();restoreScrollStyles=null}};
    const goToPanel=index=>{cancelPanelNavigation();const target=Math.max(0,Math.min(panels.length-1,index));const panel=panels[target];const navOffset=panel.id==="top"?0:$("#nav-shell").offsetHeight;const targetY=Math.max(0,panel.offsetTop-navOffset);const startY=scrollY;const distance=targetY-startY;setActivePanel(target);if(reducedMotion||Math.abs(distance)<2){scrollTo(0,targetY);return}const root=document.documentElement;const previousBehavior=root.style.scrollBehavior;const previousSnap=root.style.scrollSnapType;root.style.scrollBehavior="auto";root.style.scrollSnapType="none";restoreScrollStyles=()=>{root.style.scrollBehavior=previousBehavior;root.style.scrollSnapType=previousSnap};navigating=true;const started=performance.now();const duration=Math.min(520,320+Math.abs(distance)*.018);const tick=now=>{const progress=Math.min(1,(now-started)/duration);const eased=1-Math.pow(1-progress,4);scrollTo(0,startY+distance*eased);if(progress<1){scrollFrame=requestAnimationFrame(tick);return}scrollTo(0,targetY);scrollFrame=0;navigating=false;restoreScrollStyles();restoreScrollStyles=null};scrollFrame=requestAnimationFrame(tick)};
    $("#page-rail").innerHTML=panels.map((panel,index)=>`<button class="page-dot${index===0?" active":""}" type="button" data-page-index="${index}" aria-label="跳转到第 ${index+1} 屏：${esc(panelLabels[index]||panel.id)}"></button>`).join("");
    setActivePanel(0);
    document.addEventListener("click",event=>{const tab=event.target.closest("[data-demo-tab]");if(!tab)return;const demoRoot=tab.closest(".demo");demoRoot.querySelectorAll("[data-demo-tab]").forEach(node=>node.classList.toggle("active",node===tab));demoRoot.querySelectorAll("[data-demo-panel]").forEach(node=>node.classList.toggle("active",node.dataset.demoPanel===tab.dataset.demoTab))});
    $("#page-rail").addEventListener("click",event=>{const dot=event.target.closest("[data-page-index]");if(dot)goToPanel(Number(dot.dataset.pageIndex))});
    $("#back-to-top").addEventListener("click",event=>{event.preventDefault();goToPanel(0)});
    addEventListener("keydown",event=>{if(event.defaultPrevented||event.metaKey||event.ctrlKey||event.altKey||event.shiftKey||event.target.closest("input,textarea,select,button,a,[contenteditable=true]"))return;const next=["ArrowDown","ArrowRight","PageDown"].includes(event.key);const previous=["ArrowUp","ArrowLeft","PageUp"].includes(event.key);if(next||previous||event.key==="Home"||event.key==="End"){event.preventDefault();goToPanel(event.key==="Home"?0:event.key==="End"?panels.length-1:activePanelIndex+(next?1:-1))}});
    $("#menu-button").addEventListener("click",()=>{const shell=$("#nav-shell");const open=shell.classList.toggle("open");$("#menu-button").setAttribute("aria-expanded",String(open))});
    chapterNav.addEventListener("click",event=>{const link=event.target.closest("a");if(link){const target=panels.findIndex(panel=>`#${panel.id}`===link.getAttribute("href"));if(target>=0){event.preventDefault();goToPanel(target)}}$("#nav-shell").classList.remove("open");$("#menu-button").setAttribute("aria-expanded","false")});
    const reveals=[...document.querySelectorAll(".reveal")];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");observer.unobserve(entry.target)}}),{threshold:.12});reveals.forEach(node=>observer.observe(node));
    const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!navigating)setActivePanel(panels.indexOf(entry.target))}),{rootMargin:"-34% 0px -50%",threshold:0});panels.forEach(section=>sectionObserver.observe(section));
    addEventListener("wheel",cancelPanelNavigation,{passive:true});addEventListener("touchstart",cancelPanelNavigation,{passive:true});
    const updateProgress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#reading-progress").style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`};addEventListener("scroll",updateProgress,{passive:true});updateProgress();
    const initialPanelIndex=panels.findIndex(panel=>`#${panel.id}`===location.hash);if(initialPanelIndex>0){panels[initialPanelIndex].querySelectorAll(".reveal").forEach(node=>node.classList.add("visible"));requestAnimationFrame(()=>goToPanel(initialPanelIndex))}
  </script>
</body>
</html>
