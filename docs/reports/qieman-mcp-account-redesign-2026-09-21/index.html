<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="robots" content="noindex,nofollow,noarchive" data-clair-access-robots />
    <script data-clair-access-gate data-clair-access-scope="report" src="../../access-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盈米AI开放平台 · 个人中心（个人版 / 团队版 / 企业版）重设计</title>
<style>
:root{
  --blue:#2F6BFF; --blue-dark:#1E52D6; --blue-soft:#EAF0FF; --blue-line:#C9D8FF;
  --bg:#F3F6FC; --card:#FFFFFF; --line:#E6EBF5; --line-2:#EEF2F9;
  --text:#1F2633; --text-2:#4B5566; --muted:#7A8497; --faint:#A7AFC0;
  --green:#1FA971; --green-soft:#E6F7EF; --orange:#F08A24; --orange-soft:#FFF3E6;
  --red:#E5484D; --red-soft:#FDEBEC; --purple:#7C5CFF; --purple-soft:#EFEBFF; --cyan:#12A5C6; --gold:#C89B3C;
  --shadow:0 1px 2px rgba(20,32,60,.04), 0 6px 20px rgba(20,32,60,.05);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:88px}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#D6DCE8;border-radius:8px}

/* ===== Top nav ===== */
.topnav{height:56px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topnav .in{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 24px;gap:28px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#FF5A5F,#2F6BFF);display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;letter-spacing:-.5px}
.nav-links{display:flex;gap:26px;margin-left:auto;font-size:13.5px;color:var(--text-2)}
.nav-links a{color:var(--text-2)}
.nav-links a.on{color:var(--blue);font-weight:600}
.orgswitch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 4px;background:#fff;cursor:pointer;font-size:12.5px}
.orgswitch .av{width:24px;height:24px;border-radius:50%;background:#1F2633;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.orgswitch .plan{font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.orgswitch .caret{color:var(--faint);font-size:10px}

/* ===== Layout ===== */
.wrap{max-width:1280px;margin:20px auto 0;padding:0 24px;display:grid;grid-template-columns:284px minmax(0,1fr);gap:18px;align-items:start}
#right{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;font-weight:600;font-size:13.5px}
.card .hd .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.card .bd{padding:14px 16px 16px}
.card.tight .bd{padding-top:10px}
.h-actions{display:flex;gap:8px;align-items:center}

/* ===== Badges / buttons ===== */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;line-height:1.5;white-space:nowrap}
.b-blue{background:var(--blue-soft);color:var(--blue)} .b-green{background:var(--green-soft);color:var(--green)}
.b-orange{background:var(--orange-soft);color:#C9700F} .b-red{background:var(--red-soft);color:var(--red)}
.b-gray{background:#F0F2F7;color:var(--muted)} .b-purple{background:var(--purple-soft);color:var(--purple)}
.b-gold{background:#FBF3E1;color:#9A6F1B}
.b-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:12.5px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue-line);color:var(--blue);background:var(--blue-soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:26px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.xs{height:22px;padding:0 8px;font-size:11.5px;border-radius:5px}
.btn.danger:hover{border-color:#F3B4B6;color:var(--red);background:var(--red-soft)}
.btn.block{width:100%;justify-content:center}
.link{color:var(--blue);cursor:pointer;font-size:12px}
.link:hover{text-decoration:underline}
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px}

/* ===== Left profile ===== */
.profile{text-align:center;padding:22px 16px 16px}
.avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;background:#1F2633;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-1px;position:relative}
.avatar.org{border-radius:16px;background:linear-gradient(135deg,#1F2633,#3B4C7A)}
.avatar .crown{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:12px}
.pname{font-size:15px;font-weight:600}
.psub{color:var(--muted);font-size:12px;margin-top:2px}
.kv{display:grid;grid-template-columns:64px 1fr;row-gap:8px;font-size:12.5px;text-align:left;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.kv .k{color:var(--muted)} .kv .v{color:var(--text)}
.keybox{display:flex;align-items:center;gap:8px;background:#F6F8FC;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--text-2)}
.keybox .k{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-actions{display:flex;gap:6px;margin-top:8px}
.quota{margin-top:10px}
.quota .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:5px}
.quota .row b{color:var(--text)}
.bar{height:6px;border-radius:6px;background:#EDF0F6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.bar i.warn{background:var(--orange)} .bar i.danger{background:var(--red)} .bar i.green{background:var(--green)} .bar i.purple{background:var(--purple)}
.quota + .quota{margin-top:12px}
.list{list-style:none}
.list li{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);padding:6px 0;border-bottom:1px solid var(--line-2)}
.list li:last-child{border-bottom:0}
.list li .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.todo li{align-items:flex-start;cursor:pointer}
.todo li:hover{color:var(--blue)}
.todo .n{margin-left:auto;font-weight:600;color:var(--text)}
.qr{width:96px;height:96px;margin:6px auto 0;border-radius:8px;background:
  repeating-linear-gradient(90deg,#1F2633 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,#1F2633 0 4px,#fff 4px 8px);opacity:.85;border:6px solid #fff;outline:1px solid var(--line)}
.upgrade{background:linear-gradient(135deg,#1F2633 0%,#2A3E7A 100%);color:#fff;border-radius:var(--r);padding:16px;margin-top:14px;position:relative;overflow:hidden}
.upgrade::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.upgrade h4{font-size:14px;font-weight:600;margin-bottom:4px}
.upgrade p{font-size:12px;color:rgba(255,255,255,.75);margin-bottom:12px}
.upgrade .btn{background:#fff;border-color:#fff;color:#1F2633}

/* ===== Product switcher (right top) ===== */
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;box-shadow:var(--shadow)}
.prod.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
.prod .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--blue-soft);color:var(--blue)}
.prod .t{font-weight:600;font-size:13.5px}
.prod .s{font-size:11.5px;color:var(--muted)}
.prod .right{margin-left:auto;text-align:right}

/* ===== Tabs ===== */
.tabs{display:flex;gap:4px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 12px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--blue)}
.tab.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
.tab .n{font-size:10.5px;padding:0 5px;border-radius:8px;background:#F0F2F7;color:var(--muted);font-weight:500}
.tab .n.red{background:var(--red-soft);color:var(--red)}
.panel{padding:16px}

/* ===== KPI ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpis.five{grid-template-columns:repeat(5,1fr)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;position:relative}
.kpi .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi .d.up{color:var(--green)} .kpi .d.down{color:var(--red)}
.kpi .bar{margin-top:8px}
.kpi.accent{background:linear-gradient(135deg,#F2F6FF,#fff)}

/* ===== Grid helpers ===== */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px}
.mt{margin-top:14px}
.sec{border:1px solid var(--line);border-radius:10px;background:#fff}
.sec .hd{padding:12px 14px 0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec .bd{padding:10px 14px 14px}
.sec .hd .sub{font-weight:400;color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--blue-soft);color:var(--text-2);font-size:12.5px;border:1px solid var(--blue-line)}
.callout.warn{background:var(--orange-soft);border-color:#F7D6B0}
.callout.ok{background:var(--green-soft);border-color:#BFE8D2}
.callout b{color:var(--text)}
.note{font-size:11.5px;color:var(--muted)}

/* ===== Charts ===== */
.chart{width:100%;display:block}
.hbars .r{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.hbars .r .nm{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .r .nm .rk{display:inline-block;width:16px;color:var(--faint);font-variant-numeric:tabular-nums}
.hbars .r .val{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}
.hbars .r .val small{color:var(--muted);font-weight:400}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut-legend{flex:1;font-size:12px}
.donut-legend div{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-2)}
.donut-legend div b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--muted)}
.heat .c{height:14px;border-radius:2px;background:#EEF2F9}
.heat .lb{display:flex;align-items:center}
.heat .hh{text-align:center;height:14px;line-height:14px}

/* ===== Table ===== */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;outline:none;min-width:120px}
.input:focus{border-color:var(--blue)}
.input.search{min-width:220px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237A8497' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat 9px center;padding-left:28px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;color:var(--text-2);font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFE}
td{padding:10px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:hover td{background:#FAFBFE}
td .who{display:flex;align-items:center;gap:8px}
td .who .av{width:28px;height:28px;border-radius:50%;background:#E8EDF7;color:#3A4A6B;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
td .who .nm{font-weight:600;color:var(--text)}
td .who .ph{font-size:11px;color:var(--muted);font-family:"SF Mono",Menlo,monospace}
td .q .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
td .q .bar{height:5px}
td .q{min-width:120px}
td .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;background:#F6F8FC;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--text-2);white-space:nowrap}
td.ops{white-space:nowrap;position:relative}
td.ops .btn{margin-right:2px}
td.exp{white-space:nowrap}
.tbl{overflow-x:auto}
table.members td{padding:9px 8px}
table.members th{padding:8px 8px}
table.members td .q{min-width:110px}
.more{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:26px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(20,30,60,.14);z-index:20;min-width:120px;display:none;padding:4px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:5px;font-size:12.5px;color:var(--text-2)}
.menu button:hover{background:var(--blue-soft);color:var(--blue)}
.menu button.danger:hover{background:var(--red-soft);color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px;color:var(--muted);font-size:12px}
.pager .pg{display:flex;gap:4px}
.pager .pg b{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;border:1px solid var(--line);font-weight:500}
.pager .pg b.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{padding:30px;text-align:center;color:var(--muted)}
input[type=checkbox]{accent-color:var(--blue)}
.expire-soon{color:#C9700F} .expired{color:var(--red)}

/* ===== Config block ===== */
.codebox{background:#F7F9FD;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codebox .cap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:#FBFCFE}
.codebox pre{padding:12px 14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.7;color:#2A3446;overflow:auto;white-space:pre}
.codebox pre .s{color:#1A7F5A} .codebox pre .k{color:#2F6BFF}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700;margin-bottom:8px}
.step .t{font-weight:600;font-size:12.5px;margin-bottom:2px}
.step .d{font-size:11.5px;color:var(--muted)}

/* ===== Plan compare ===== */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;position:relative}
.plan.cur{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,107,255,.12)}
.plan.hi{background:linear-gradient(180deg,#F5F8FF,#fff)}
.plan .nm{font-weight:700;font-size:15px}
.plan .pr{font-size:22px;font-weight:700;margin:6px 0 2px}
.plan .pr small{font-size:12px;color:var(--muted);font-weight:400}
.plan .for{font-size:12px;color:var(--muted);margin-bottom:10px}
.plan ul{list-style:none;font-size:12.5px;color:var(--text-2)}
.plan ul li{padding:4px 0;display:flex;gap:6px}
.plan ul li::before{content:"✓";color:var(--green);font-weight:700}
.plan ul li.no{color:var(--faint)} .plan ul li.no::before{content:"–";color:var(--faint)}
.plan .tag{position:absolute;top:-10px;right:14px}

/* ===== Drawer / modal / toast ===== */
.mask{position:fixed;inset:0;background:rgba(20,30,60,.35);z-index:80;display:none}
.mask.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;z-index:90;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(20,30,60,.12)}
.drawer.show{transform:none}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.drawer .db{flex:1;overflow:auto;padding:18px 20px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted);font-size:18px}
.x:hover{background:#F0F2F7}
.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.f label .req{color:var(--red)}
.f label .hint{color:var(--faint);font-weight:400;margin-left:6px}
.f .input,.f select,.f textarea{width:100%}
.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:60px;resize:vertical}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--text-2)}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font-size:12.5px}
.rc.on{border-color:var(--blue);background:var(--blue-soft)}
.rc b{display:block;font-size:12.5px}
.rc span{color:var(--muted);font-size:11.5px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;color:var(--text-2)}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400;margin:0}
.pass-preview{border:1px dashed var(--blue-line);background:var(--blue-soft);border-radius:10px;padding:14px;text-align:center}
.pass-preview .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:2px;color:var(--blue-dark)}
.pass-preview .meta{font-size:11.5px;color:var(--muted);margin-top:4px}

function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function series(n,base,amp,seed,trend=0){ const r=rnd(seed); return Array.from({length:n},(_,i)=>Math.round(base+trend*i+amp*(r()-.5)+(i%7===5||i%7===6?-base*.35:0))); }

/* ---------- SVG 图表 ---------- */
function lineChart(seriesArr, {w=640,h=180,colors=['#2F6BFF','#7C5CFF'],labels=DAYS,fill=true,unit=''}={}){
  const pad={l:44,r:12,t:12,b:24}; const max=Math.max(...seriesArr.flat())*1.12; const n=seriesArr[0].length;
  const x=i=>pad.l+(w-pad.l-pad.r)*i/(n-1), y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">`;
  for(let g=0;g<=4;g++){const yy=pad.t+(h-pad.t-pad.b)*g/4; const val=Math.round(max*(1-g/4)); s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="#EEF2F9"/><text x="${pad.l-6}" y="${yy+4}" font-size="10" fill="#A7AFC0" text-anchor="end">${val>=1000?(val/1000).toFixed(val>=10000?0:1)+'k':val}</text>`;}
  seriesArr.forEach((sr,si)=>{
    const pts=sr.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    if(fill) s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${colors[si]}" opacity=".08"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="${colors[si]}" stroke-width="2" stroke-linejoin="round"/>`;
    const li=n-1; s+=`<circle cx="${x(li)}" cy="${y(sr[li])}" r="3.5" fill="#fff" stroke="${colors[si]}" stroke-width="2"/>`;
  });
  for(let i=0;i<n;i+=Math.ceil(n/8)) s+=`<text x="${x(i)}" y="${h-6}" font-size="10" fill="#A7AFC0" text-anchor="middle">${labels[i]}</text>`;
  return s+'</svg>';
}
function barChart(vals,{w=640,h=160,color='#2F6BFF',labels=[],stack=null,color2='#7C5CFF'}={}){
  const pad={l:40,r:8,t:10,b:24}; const tot=vals.map((v,i)=>v+(stack?stack[i]:0)); const max=Math.max(...tot)*1.15; const n=vals.length;
  const bw=(w-pad.l-pad.r)/n; const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">`;
  for(let g=0;g<=3;g++){const yy=pad.t+(h-pad.t-pad.b)*g/3; s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="#EEF2F9"/><text x="${pad.l-6}" y="${yy+4}" font-size="10" fill="#A7AFC0" text-anchor="end">${Math.round(max*(1-g/3)/1000)}k</text>`;}
  vals.forEach((v,i)=>{const x0=pad.l+bw*i+bw*.22, ww=bw*.56; s+=`<rect x="${x0}" y="${y(v)}" width="${ww}" height="${y(0)-y(v)}" rx="3" fill="${color}"/>`;
    if(stack) s+=`<rect x="${x0}" y="${y(v+stack[i])}" width="${ww}" height="${y(v)-y(v+stack[i])}" rx="3" fill="${color2}"/>`;
    if(labels[i]) s+=`<text x="${x0+ww/2}" y="${h-7}" font-size="10" fill="#7A8497" text-anchor="middle">${labels[i]}</text>`;});
  return s+'</svg>';
}
function donut(items,{size=140,stroke=18}={}){
  const r=(size-stroke)/2, c=2*Math.PI*r; let off=0;
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  items.forEach(([n,p,col])=>{ const len=c*p/100; s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off+=len; });
  s+=`<text x="50%" y="47%" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2633">${items.length}</text><text x="50%" y="62%" text-anchor="middle" font-size="10" fill="#7A8497">类别</text></svg>`;
  return `<div class="donut-wrap">${s}<div class="donut-legend">${items.map(([n,p,col])=>`<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${col};margin-right:6px"></i>${n}</span><b>${p}%</b></div>`).join('')}</div></div>`;
}
function hbars(items,{unit='次',color='var(--blue)'}={}){
  const max=Math.max(...items.map(i=>i[1]));
  return `<div class="hbars">${items.map((it,i)=>`<div class="r"><div class="nm"><span class="rk">${i+1}</span>${it[0]}${it[2]?` <span class="badge b-gray" style="font-size:10px;padding:0 5px">${it[2]}</span>`:''}</div><div class="bar" style="height:8px"><i style="width:${it[1]/max*100}%;background:${color}"></i></div><div class="val">${fmt(it[1])}<small> ${unit}</small></div></div>`).join('')}</div>`;
}
function heatmap(){
  const r=rnd(21); const days=['一','二','三','四','五','六','日'];
  let s='<div class="heat"><div></div>'+Array.from({length:24},(_,h)=>`<div class="hh">${h%3===0?h:''}</div>`).join('');
  days.forEach((d,di)=>{ s+=`<div class="lb">周${d}</div>`; for(let h=0;h<24;h++){ let v=r(); if(h>=9&&h<=18)v+=.5; if(h>=10&&h<=11||h>=14&&h<=16)v+=.4; if(di>=5)v*=.35; if(h<7)v*=.15; const a=Math.min(1,v/1.6); s+=`<div class="c" style="background:rgba(47,107,255,${(.06+a*.9).toFixed(2)})" title="周${d} ${h}:00"></div>`; } });
  return s+'</div>';
}

    <div class="f"><label>同时调整</label><div class="checks"><label><input type="checkbox">单日调用上限</label><label><input type="checkbox">工具范围</label></div></div>`}
  <div class="f"><label>备注</label><input class="input" placeholder="如：Q4 回测项目"></div>
  <div class="f"><label>生效方式</label><div class="radio-cards"><div class="rc on" onclick="pick(this)"><b>立即生效</b><span>直接写入成员额度并通知</span></div><div class="rc" onclick="pick(this)"><b>生成口令</b><span>由成员自行兑换后生效</span></div></div></div>`,
  `<button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="applyAdjust(${id},'${mode||'credit'}')">确认</button>`);
}
function applyAdjust(id,mode){ const m=members.find(x=>x.id===id); const v=document.getElementById('a_val').value; if(mode==='extend'){ m.expire=v; toast(`${m.name} 使用期限已延至 ${v}`);} else { const n=+String(v).replace(/,/g,'')||0; m.alloc+=n; org().credits.allocated+=n; toast(`${m.name} 已追加 ${fmt(n)} 积分`);} closeAll(); renderRight(); renderLeft(); }
function openRequest(){
  openDrawer('申请追加额度 / 延期',`
  <div class="f"><label>申请类型</label><div class="radio-cards"><div class="rc on" onclick="pick(this)"><b>追加积分</b><span>当前剩余 2,200 / 40,000</span></div><div class="rc" onclick="pick(this)"><b>延长期限</b><span>当前至 2026-12-31</span></div></div></div>
  <div class="f"><label>申请数量</label><div class="chips">${[5000,10000,20000].map((v,i)=>`<button class="chip ${i===1?'on':''}" onclick="pick(this)">+${fmt(v)}</button>`).join('')}</div></div>
  <div class="f"><label>理由 <span class="hint">管理员可见</span></label><textarea placeholder="说明用途，有助于更快审批">Q4 组合回测批量任务，预计调用 8,000 次「基金诊断」「回测分析」。</textarea></div>
  <div class="callout" style="font-size:12px"><span>ⓘ</span><div>申请将推送给管理员 陈嘉禾、林墨。通常 1 个工作日内处理；通过后立即生效，无需重新配置。</div></div>`,
  `<button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="toast('申请已提交，管理员已收到通知');closeAll()">提交申请</button>`);
}

/* URL ?join= 自动进入待激活视图 */
(function(){ const q=new URLSearchParams(location.search); const j=q.get('join'); if(j){ state.view='member-pending'; } const v=q.get('view'); if(v&&VIEWS.some(x=>x.id===v)) state.view=v; if(isAdmin())state.tab='overview'; else state.tab=state.view==='personal'?'stats':'usage'; const t=q.get('tab'); if(t) state.tab=t; })();
render();
(function(){ const q=new URLSearchParams(location.search); if(q.get('join')) document.getElementById('joincode').value=q.get('join');
  const op=q.get('open'); if(op==='create')openCreate(); else if(op==='passcode')openPasscode(); else if(op==='plans')openPlans(); else if(op==='adjust')openAdjust(3); else if(op==='send')openSend('YM-ENT-4H8K-2ZQ7'); else if(op==='request')openRequest(); })();
</script>
