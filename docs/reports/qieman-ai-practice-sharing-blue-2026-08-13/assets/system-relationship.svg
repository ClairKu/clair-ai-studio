<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 系统关系图</title>
  <desc id="desc">金融数据、工具、MCP、Skills 与 Agent 构成能力资产层；Stargate 管理后台与 YINGMIWORK 盈米工作台构成治理与生产双平台；上层连接 AI 小顾、AI 顾问工作台、AI 官网与 AI 实验室。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8faff"/><stop offset="1" stop-color="#eaeef9"/>
    </linearGradient>
    <linearGradient id="stargate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2c519f"/><stop offset=".58" stop-color="#2d6ae2"/><stop offset="1" stop-color="#538dff"/>
    </linearGradient>
    <linearGradient id="yingmiwork" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111a33"/><stop offset=".55" stop-color="#192545"/><stop offset="1" stop-color="#273761"/>
    </linearGradient>
    <linearGradient id="asset" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1d3052" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#2d6ae2"/>
    </marker>
    <style>
      text{font-family:"Songti SC","STSong","SimSun",serif;fill:#171c2d}
      .layer{font:800 15px/1 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.13em;fill:#2d6ae2}
      .overline{font:800 14px/1 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.1em}
      .appTitle{font-size:28px;font-weight:700}.appBody{font:500 15px/1.45 "PingFang SC","Microsoft YaHei",sans-serif;fill:#697288}
      .coreTitle{font-size:32px;font-weight:700}.coreBody{font:500 15px/1.45 "PingFang SC","Microsoft YaHei",sans-serif}
      .assetTitle{font-size:23px;font-weight:700}.assetBody{font:500 14px/1.45 "PingFang SC","Microsoft YaHei",sans-serif;fill:#626d84}
      .onDark{fill:#fff}.softOnDark{fill:#dce3f5}.purple{fill:#2d6ae2}.navy{fill:#23365f}
      .appCard{fill:#fff;stroke:#d2dbed;stroke-width:1.5}.assetCard{fill:url(#asset);stroke:#c7d3ef;stroke-width:1.5}
      .pillLight{fill:#e6efff;stroke:#cddcf9}.pillDark{fill:#fff;fill-opacity:.1;stroke:#fff;stroke-opacity:.42}
      .pillText{font:700 13px/1 "PingFang SC","Microsoft YaHei",sans-serif;fill:#2e5298}.pillTextDark{font:700 13px/1 "PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .assetPill{font:700 12px/1 "PingFang SC","Microsoft YaHei",sans-serif;fill:#3e598c}
      .bus{fill:none;stroke:#81a5eb;stroke-width:2}.flow{fill:none;stroke:#2d6ae2;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#canvas)"/>
  <circle cx="1500" cy="45" r="180" fill="#fff" opacity=".52"/>

  <text x="80" y="31" class="layer">03 · 应用与服务层</text>

  <!-- Platform-to-application distribution bus. -->
  <path d="M245 204H1355" class="bus"/>
  <path d="M245 204V176" class="flow"/>
  <path d="M615 204V176" class="flow"/>
  <path d="M985 204V176" class="flow"/>
  <path d="M1355 204V176" class="flow"/>
  <path d="M430 238V204" class="bus"/>
  <path d="M1170 238V204" class="bus"/>

  <!-- Applications and services. -->
  <g filter="url(#shadow)">
    <g>
      <rect x="80" y="52" width="330" height="124" rx="22" class="appCard"/>
      <text x="106" y="82" class="overline purple">用户服务</text>
      <text x="106" y="121" class="appTitle">AI 小顾</text>
      <text x="106" y="150" class="appBody">用户侧智能投顾与长期陪伴</text>
    </g>
    <g>
      <rect x="450" y="52" width="330" height="124" rx="22" class="appCard"/>
      <text x="476" y="82" class="overline purple">顾问生产</text>
      <text x="476" y="121" class="appTitle">AI 顾问工作台</text>
      <text x="476" y="150" class="appBody">服务生产、协作与专业交付</text>
    </g>
    <g>
      <rect x="820" y="52" width="330" height="124" rx="22" class="appCard"/>
      <text x="846" y="82" class="overline purple">开放入口</text>
      <text x="846" y="121" class="appTitle">AI 官网</text>
      <text x="846" y="150" class="appBody">能力展示、体验与开放接入</text>
    </g>
    <g>
      <rect x="1190" y="52" width="330" height="124" rx="22" class="appCard"/>
      <text x="1216" y="82" class="overline purple">创新孵化</text>
      <text x="1216" y="121" class="appTitle">AI 实验室</text>
      <text x="1216" y="150" class="appBody">试验、评测与创新服务孵化</text>
    </g>
  </g>

  <text x="80" y="226" class="layer">02 · 平台与生产层</text>

  <!-- Governance and production as two equal engines. -->
  <g filter="url(#shadow)">
    <rect x="80" y="238" width="700" height="220" rx="28" fill="url(#stargate)"/>
    <text x="112" y="277" class="overline onDark">治理引擎 · GOVERNANCE</text>
    <text x="112" y="321" class="coreTitle onDark">Stargate 管理后台</text>
    <text x="112" y="351" class="coreBody softOnDark">统一管理身份、权限、内容、发布、审计与运行数据</text>
    <g>
      <rect x="112" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="184.5" y="407" text-anchor="middle" class="pillTextDark">身份与权限</text>
      <rect x="271" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="343.5" y="407" text-anchor="middle" class="pillTextDark">内容与发布</text>
      <rect x="430" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="502.5" y="407" text-anchor="middle" class="pillTextDark">审计与计量</text>
      <rect x="589" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="661.5" y="407" text-anchor="middle" class="pillTextDark">运营与数据</text>
    </g>

    <rect x="820" y="238" width="700" height="220" rx="28" fill="url(#yingmiwork)"/>
    <text x="852" y="277" class="overline onDark">生产引擎 · PRODUCTION</text>
    <text x="852" y="321" class="coreTitle onDark">YINGMIWORK 盈米工作台</text>
    <text x="852" y="351" class="coreBody softOnDark">能力底座与生产平台，让专业服务被编排、测试与稳定交付</text>
    <g>
      <rect x="852" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="924.5" y="407" text-anchor="middle" class="pillTextDark">能力资产</text>
      <rect x="1011" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="1083.5" y="407" text-anchor="middle" class="pillTextDark">MCP·Skills·Agent</text>
      <rect x="1170" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="1242.5" y="407" text-anchor="middle" class="pillTextDark">编排与测试</text>
      <rect x="1329" y="382" width="145" height="38" rx="19" class="pillDark"/><text x="1401.5" y="407" text-anchor="middle" class="pillTextDark">生产与交付</text>
    </g>
  </g>

  <g>
    <circle cx="800" cy="348" r="27" fill="#fff" stroke="#b7ccf4" stroke-width="2"/>
    <text x="800" y="357" text-anchor="middle" font-size="27" font-weight="700" fill="#2d6ae2">↔</text>
  </g>

  <text x="80" y="530" class="layer">01 · 能力资产层</text>

  <!-- Capability-to-platform production bus. -->
  <path d="M216 518H1384" class="bus"/>
  <path d="M430 518V458" class="flow"/>
  <path d="M1170 518V458" class="flow"/>
  <path d="M216 552V518" class="bus"/><path d="M508 552V518" class="bus"/><path d="M800 552V518" class="bus"/><path d="M1092 552V518" class="bus"/><path d="M1384 552V518" class="bus"/>

  <!-- Capability assets. -->
  <g filter="url(#shadow)">
    <g>
      <rect x="80" y="552" width="272" height="158" rx="22" class="assetCard"/>
      <text x="104" y="581" class="overline purple">DATA</text>
      <text x="104" y="616" class="assetTitle">金融数据</text>
      <text x="104" y="643" class="assetBody">授权数据与专业知识</text>
      <rect x="104" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="157" y="683" text-anchor="middle" class="assetPill">基金 · 市场</text>
      <rect x="222" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="275" y="683" text-anchor="middle" class="assetPill">账户 · 资讯</text>
    </g>
    <g>
      <rect x="372" y="552" width="272" height="158" rx="22" class="assetCard"/>
      <text x="396" y="581" class="overline purple">TOOLS</text>
      <text x="396" y="616" class="assetTitle">工具能力</text>
      <text x="396" y="643" class="assetBody">可计算、可诊断的金融工具</text>
      <rect x="396" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="449" y="683" text-anchor="middle" class="assetPill">查询 · 计算</text>
      <rect x="514" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="567" y="683" text-anchor="middle" class="assetPill">分析 · 诊断</text>
    </g>
    <g>
      <rect x="664" y="552" width="272" height="158" rx="22" class="assetCard"/>
      <text x="688" y="581" class="overline purple">STANDARD</text>
      <text x="688" y="616" class="assetTitle">MCP</text>
      <text x="688" y="643" class="assetBody">标准接口与工具调用</text>
      <rect x="688" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="741" y="683" text-anchor="middle" class="assetPill">标准接口</text>
      <rect x="806" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="859" y="683" text-anchor="middle" class="assetPill">工具调用</text>
    </g>
    <g>
      <rect x="956" y="552" width="272" height="158" rx="22" class="assetCard"/>
      <text x="980" y="581" class="overline purple">DELIVERY</text>
      <text x="980" y="616" class="assetTitle">Skills</text>
      <text x="980" y="643" class="assetBody">规则流程与模板交付</text>
      <rect x="980" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="1033" y="683" text-anchor="middle" class="assetPill">规则流程</text>
      <rect x="1098" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="1151" y="683" text-anchor="middle" class="assetPill">模板交付</text>
    </g>
    <g>
      <rect x="1248" y="552" width="272" height="158" rx="22" class="assetCard"/>
      <text x="1272" y="581" class="overline purple">EXECUTION</text>
      <text x="1272" y="616" class="assetTitle">Agent</text>
      <text x="1272" y="643" class="assetBody">目标规划、执行与反馈</text>
      <rect x="1272" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="1325" y="683" text-anchor="middle" class="assetPill">目标规划</text>
      <rect x="1390" y="664" width="106" height="28" rx="14" class="pillLight"/><text x="1443" y="683" text-anchor="middle" class="assetPill">执行反馈</text>
    </g>
  </g>
</svg>
