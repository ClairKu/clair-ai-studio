<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="#16273F" role="img" aria-labelledby="title desc">
  <title id="title">第三方 AI 平台合作的责任与数据边界</title>
  <desc id="desc">以用户、第三方AI平台、盈米金融服务和盈米自营交易四个区域，说明入口路由、金融服务责任、自营交易和最小数据流转。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#EDF3F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#18304D" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#B8C6D8" stroke-width="1" opacity="0.16"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#3478F6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0E8C78"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:3px;fill:#3478F6}
      .title{font-size:46px;font-weight:700;letter-spacing:-1px}
      .sub{font-size:22px;fill:#5F7087}
      .zoneNum{font-size:16px;font-weight:700;fill:#FFFFFF}
      .zoneTitle{font-size:30px;font-weight:700}
      .zoneSub{font-size:18px;font-weight:700;letter-spacing:1px}
      .item{font-size:20px;fill:#506176}
      .label{font-size:18px;font-weight:700}
      .small{font-size:17px;fill:#6C7C91}
      .foot{font-size:17px;fill:#738399}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1515" cy="70" r="220" fill="#E3EAFB" opacity="0.55"/>
  <circle cx="70" cy="870" r="180" fill="#DDF3EE" opacity="0.50"/>

  <text x="78" y="76" class="eyebrow">RESPONSIBILITY &amp; DATA BOUNDARY · 建议目标态</text>
  <text x="78" y="136" class="title">入口可以外部化，金融责任不能外包</text>
  <text x="78" y="177" class="sub">平台负责发现与路由；持牌机构负责服务与控制；敏感操作始终回到自营域</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="66" y="245" width="212" height="300" rx="32" fill="#16273F"/>
  </g>
  <circle cx="172" cy="328" r="37" fill="#2A425D" stroke="#6F91B5" stroke-width="2"/>
  <circle cx="172" cy="316" r="12" fill="#BFD1E5"/>
  <path d="M147 348c5-20 45-20 50 0" fill="#BFD1E5"/>
  <text x="172" y="404" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">用户</text>
  <text x="172" y="441" text-anchor="middle" font-size="18" fill="#BFD1E5">自主发起 · 明示知情</text>
  <rect x="99" y="476" width="146" height="38" rx="19" fill="#233D59"/>
  <text x="172" y="501" text-anchor="middle" font-size="17" font-weight="600" fill="#D7E5F3">可随时退出</text>

  <!-- Platform -->
  <g filter="url(#shadow)">
    <rect x="326" y="225" width="336" height="360" rx="30" fill="#FFFFFF"/>
  </g>
  <rect x="326" y="225" width="336" height="10" rx="5" fill="#675DE6"/>
  <circle cx="374" cy="277" r="21" fill="#675DE6"/>
  <text x="374" y="283" text-anchor="middle" class="zoneNum">01</text>
  <text x="410" y="268" class="zoneSub" fill="#675DE6">THIRD-PARTY AI</text>
  <text x="358" y="329" class="zoneTitle">千问等平台</text>
  <rect x="358" y="357" width="272" height="48" rx="16" fill="#EEEBFF"/>
  <text x="494" y="388" text-anchor="middle" class="label" fill="#5749CF">入口 · 发现 · 对话路由</text>
  <circle cx="365" cy="451" r="4" fill="#675DE6"/><text x="381" y="458" class="item">展示机构官方身份</text>
  <circle cx="365" cy="493" r="4" fill="#675DE6"/><text x="381" y="500" class="item">传递最小任务上下文</text>
  <circle cx="365" cy="535" r="4" fill="#675DE6"/><text x="381" y="542" class="item">提供退出与纠错入口</text>

  <!-- Financial service -->
  <g filter="url(#shadow)">
    <rect x="710" y="205" width="386" height="400" rx="30" fill="#FFFFFF"/>
  </g>
  <rect x="710" y="205" width="386" height="10" rx="5" fill="#0E8C78"/>
  <circle cx="758" cy="257" r="21" fill="#0E8C78"/>
  <text x="758" y="263" text-anchor="middle" class="zoneNum">02</text>
  <text x="794" y="248" class="zoneSub" fill="#0E8C78">LICENSED SERVICE</text>
  <text x="742" y="309" class="zoneTitle">盈米金融服务</text>
  <rect x="742" y="337" width="322" height="48" rx="16" fill="#DFF5F0"/>
  <text x="903" y="368" text-anchor="middle" class="label" fill="#087563">专业内容 · 规则 · 风控</text>
  <circle cx="749" cy="429" r="4" fill="#0E8C78"/><text x="765" y="436" class="item">受控知识与专业数据</text>
  <circle cx="749" cy="471" r="4" fill="#0E8C78"/><text x="765" y="478" class="item">内容审核与风险揭示</text>
  <circle cx="749" cy="513" r="4" fill="#0E8C78"/><text x="765" y="520" class="item">AI 标识与来源追溯</text>
  <circle cx="749" cy="555" r="4" fill="#0E8C78"/><text x="765" y="562" class="item">留痕、复核、客诉处置</text>

  <!-- Self-operated transaction -->
  <g filter="url(#shadow)">
    <rect x="1144" y="225" width="390" height="360" rx="30" fill="#FFFFFF"/>
  </g>
  <rect x="1144" y="225" width="390" height="10" rx="5" fill="#C17621"/>
  <circle cx="1192" cy="277" r="21" fill="#C17621"/>
  <text x="1192" y="283" text-anchor="middle" class="zoneNum">03</text>
  <text x="1228" y="268" class="zoneSub" fill="#C17621">SELF-OPERATED DOMAIN</text>
  <text x="1176" y="329" class="zoneTitle">盈米自营交易域</text>
  <rect x="1176" y="357" width="326" height="48" rx="16" fill="#FFF0D6"/>
  <text x="1339" y="388" text-anchor="middle" class="label" fill="#9A651A">身份 · 适当性 · 协议 · 交易</text>
  <circle cx="1183" cy="451" r="4" fill="#C17621"/><text x="1199" y="458" class="item">用户主动登录与鉴权</text>
  <circle cx="1183" cy="493" r="4" fill="#C17621"/><text x="1199" y="500" class="item">离场提醒与二次确认</text>
  <circle cx="1183" cy="535" r="4" fill="#C17621"/><text x="1199" y="542" class="item">指令仅在自营域完成</text>

  <!-- Primary flow arrows -->
  <line x1="278" y1="388" x2="314" y2="388" stroke="#675DE6" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="662" y1="388" x2="698" y2="388" stroke="#0E8C78" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="1096" y1="388" x2="1132" y2="388" stroke="#C17621" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Responsibility banner -->
  <rect x="326" y="625" width="1208" height="58" rx="18" fill="#16273F"/>
  <circle cx="364" cy="654" r="12" fill="#20B29A"/>
  <path d="M357 654l5 5 9-11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="390" y="663" font-size="22" font-weight="700" fill="#FFFFFF">金融机构主体责任不因平台接入、技术服务或算法协同而转移</text>
  <text x="1500" y="662" text-anchor="end" font-size="17" fill="#BFD1E5">责任锚点</text>

  <!-- Data boundary legend -->
  <rect x="66" y="710" width="1468" height="96" rx="26" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.5"/>
  <g transform="translate(102 736)">
    <line x1="0" y1="17" x2="72" y2="17" stroke="#0E8C78" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="90" y="24" class="label" fill="#087563">可流转</text>
    <text x="183" y="24" class="small">经授权的最小任务上下文 / 必要响应结果</text>
  </g>
  <line x1="670" y1="731" x2="670" y2="785" stroke="#D7E0EA"/>
  <g transform="translate(710 736)">
    <circle cx="17" cy="17" r="15" fill="#FCE9E6" stroke="#C9504B" stroke-width="2"/>
    <path d="M8 8l18 18M26 8L8 26" stroke="#C9504B" stroke-width="3" stroke-linecap="round"/>
    <text x="51" y="24" class="label" fill="#B43E39">不得外流</text>
    <text x="153" y="24" class="small">账户、交易、完整画像等原始敏感数据</text>
  </g>
  <line x1="1196" y1="731" x2="1196" y2="785" stroke="#D7E0EA"/>
  <g transform="translate(1236 736)">
    <rect x="0" y="3" width="30" height="28" rx="7" fill="#FFF0D6" stroke="#C17621" stroke-width="2"/>
    <path d="M8 17h14" stroke="#C17621" stroke-width="3"/>
    <text x="45" y="24" class="label" fill="#9A651A">控制</text>
    <text x="102" y="24" class="small">最小化 · 加密 · 留痕 · 到期删除</text>
  </g>

  <text x="66" y="854" class="foot">监管沟通示意图｜边界为建议控制架构，正式范围以监管意见、合同约定与上线验收为准</text>
  <text x="1534" y="854" text-anchor="end" class="foot">02 / 04</text>
</svg>
