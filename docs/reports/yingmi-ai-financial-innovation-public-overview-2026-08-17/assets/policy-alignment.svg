<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="#16273F" role="img" aria-labelledby="title desc">
  <title id="title">广州 AI 投顾十条政策对照图</title>
  <desc id="desc">将十项政策措施归纳为监管机制、数据设施、标准能力、生态服务四组，并映射盈米可贡献的工作和建议申请支持事项。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#EDF3F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#18304D" flood-opacity="0.09"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#B8C6D8" stroke-width="1" opacity="0.16"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#71839B"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:3px;fill:#3478F6}
      .title{font-size:46px;font-weight:700;letter-spacing:-1px}
      .sub{font-size:22px;fill:#5F7087}
      .cluster{font-size:26px;font-weight:700}
      .num{font-size:17px;font-weight:800;fill:#FFFFFF}
      .measure{font-size:18px;font-weight:600}
      .contribLabel{font-size:15px;font-weight:800;letter-spacing:1.5px}
      .contrib{font-size:18px;font-weight:600}
      .ask{font-size:18px;font-weight:700;fill:#FFFFFF}
      .note{font-size:16.5px;fill:#738399}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1518" cy="72" r="225" fill="#E4E9FA" opacity="0.60"/>
  <circle cx="78" cy="864" r="185" fill="#DDF3EE" opacity="0.55"/>

  <text x="76" y="74" class="eyebrow">POLICY ALIGNMENT · 广州“AI 投顾十条”</text>
  <text x="76" y="134" class="title">十项措施，四类协同价值</text>
  <text x="76" y="175" class="sub">政策方向用于建立对照与试点论证；具体业务仍需履行法定程序并接受监管指导</text>

  <!-- Cluster 1 -->
  <g filter="url(#shadow)"><rect x="68" y="220" width="704" height="230" rx="28" fill="#FFFFFF"/></g>
  <rect x="68" y="220" width="14" height="230" rx="7" fill="#3478F6"/>
  <text x="106" y="264" class="cluster">监管机制</text>
  <text x="106" y="292" font-size="16" font-weight="700" letter-spacing="1.5" fill="#3478F6">PRUDENTIAL GOVERNANCE</text>
  <g transform="translate(106 320)"><circle cx="18" cy="18" r="18" fill="#3478F6"/><text x="18" y="24" text-anchor="middle" class="num">1</text><text x="48" y="24" class="measure">包容审慎机制</text></g>
  <g transform="translate(310 320)"><circle cx="18" cy="18" r="18" fill="#3478F6"/><text x="18" y="24" text-anchor="middle" class="num">2</text><text x="48" y="24" class="measure">信息共享</text></g>
  <g transform="translate(490 320)"><circle cx="18" cy="18" r="18" fill="#3478F6"/><text x="18" y="24" text-anchor="middle" class="num">10</text><text x="48" y="24" class="measure">严密防范风险</text></g>
  <line x1="106" y1="382" x2="706" y2="382" stroke="#DCE4EE"/>
  <text x="106" y="412" class="contribLabel" fill="#3478F6">盈米可贡献</text>
  <text x="235" y="412" class="contrib">受控试点 · 周期报告 · 穿透监测 · 熔断演练</text>

  <!-- Cluster 2 -->
  <g filter="url(#shadow)"><rect x="828" y="220" width="704" height="230" rx="28" fill="#FFFFFF"/></g>
  <rect x="828" y="220" width="14" height="230" rx="7" fill="#0E8C78"/>
  <text x="866" y="264" class="cluster">数据与设施</text>
  <text x="866" y="292" font-size="16" font-weight="700" letter-spacing="1.5" fill="#0E8C78">TRUSTED INFRASTRUCTURE</text>
  <g transform="translate(866 320)"><circle cx="18" cy="18" r="18" fill="#0E8C78"/><text x="18" y="24" text-anchor="middle" class="num">3</text><text x="48" y="24" class="measure">数据要素供给</text></g>
  <g transform="translate(1110 320)"><circle cx="18" cy="18" r="18" fill="#0E8C78"/><text x="18" y="24" text-anchor="middle" class="num">5</text><text x="48" y="24" class="measure">重点设施建设</text></g>
  <line x1="866" y1="382" x2="1466" y2="382" stroke="#DCE4EE"/>
  <text x="866" y="412" class="contribLabel" fill="#0E8C78">盈米可贡献</text>
  <text x="995" y="412" class="contrib">专业数据标准 · 权限隔离 · 可审计接口 · 测试环境</text>

  <!-- Cluster 3 -->
  <g filter="url(#shadow)"><rect x="68" y="480" width="704" height="230" rx="28" fill="#FFFFFF"/></g>
  <rect x="68" y="480" width="14" height="230" rx="7" fill="#675DE6"/>
  <text x="106" y="524" class="cluster">标准与能力</text>
  <text x="106" y="552" font-size="16" font-weight="700" letter-spacing="1.5" fill="#675DE6">STANDARDS &amp; CAPABILITY</text>
  <g transform="translate(106 580)"><circle cx="18" cy="18" r="18" fill="#675DE6"/><text x="18" y="24" text-anchor="middle" class="num">4</text><text x="48" y="24" class="measure">关联产业发展</text></g>
  <g transform="translate(310 580)"><circle cx="18" cy="18" r="18" fill="#675DE6"/><text x="18" y="24" text-anchor="middle" class="num">6</text><text x="48" y="24" class="measure">标准体系</text></g>
  <g transform="translate(490 580)"><circle cx="18" cy="18" r="18" fill="#675DE6"/><text x="18" y="24" text-anchor="middle" class="num">7</text><text x="48" y="24" class="measure">复合型人才</text></g>
  <line x1="106" y1="642" x2="706" y2="642" stroke="#DCE4EE"/>
  <text x="106" y="672" class="contribLabel" fill="#675DE6">盈米可贡献</text>
  <text x="235" y="672" class="contrib">工具接口 · 评测验证 · 流程标准 · 联合人才培养</text>

  <!-- Cluster 4 -->
  <g filter="url(#shadow)"><rect x="828" y="480" width="704" height="230" rx="28" fill="#FFFFFF"/></g>
  <rect x="828" y="480" width="14" height="230" rx="7" fill="#C17621"/>
  <text x="866" y="524" class="cluster">生态与服务</text>
  <text x="866" y="552" font-size="16" font-weight="700" letter-spacing="1.5" fill="#C17621">ECOSYSTEM &amp; EDUCATION</text>
  <g transform="translate(866 580)"><circle cx="18" cy="18" r="18" fill="#C17621"/><text x="18" y="24" text-anchor="middle" class="num">8</text><text x="48" y="24" class="measure">产业链合作</text></g>
  <g transform="translate(1110 580)"><circle cx="18" cy="18" r="18" fill="#C17621"/><text x="18" y="24" text-anchor="middle" class="num">9</text><text x="48" y="24" class="measure">良好发展氛围</text></g>
  <line x1="866" y1="642" x2="1466" y2="642" stroke="#DCE4EE"/>
  <text x="866" y="672" class="contribLabel" fill="#C17621">盈米可贡献</text>
  <text x="995" y="672" class="contrib">平台协作 · 案例共享 · 行业培训 · 投资者教育</text>

  <!-- Support asks -->
  <rect x="68" y="744" width="1464" height="80" rx="24" fill="#16273F"/>
  <text x="101" y="778" font-size="15" font-weight="800" letter-spacing="2" fill="#8FB4D9">建议申请支持</text>
  <g transform="translate(258 760)"><circle cx="18" cy="18" r="18" fill="#3478F6"/><text x="18" y="24" text-anchor="middle" class="num">A</text><text x="50" y="25" class="ask">纳入包容审慎试点观察</text></g>
  <g transform="translate(650 760)"><circle cx="18" cy="18" r="18" fill="#675DE6"/><text x="18" y="24" text-anchor="middle" class="num">B</text><text x="50" y="25" class="ask">共建算法评测与审核标准</text></g>
  <g transform="translate(1070 760)"><circle cx="18" cy="18" r="18" fill="#0E8C78"/><text x="18" y="24" text-anchor="middle" class="num">C</text><text x="50" y="25" class="ask">建立信息共享与周期报送</text></g>

  <text x="68" y="861" class="note">对照依据：《广州市大力推动 AI 投顾发展的若干措施》｜政策一致性不等同于业务许可或监管豁免</text>
  <text x="1532" y="861" text-anchor="end" class="note">04 / 04</text>
</svg>
