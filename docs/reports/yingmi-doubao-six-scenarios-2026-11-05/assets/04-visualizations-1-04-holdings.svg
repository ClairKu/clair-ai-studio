<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">产品市值与具名资产覆盖</title><desc id="desc">00582740万元、00309520万元、未具名货币基金40万元。具名基金分析覆盖60%，不代表股票敞口。</desc><g font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif"><rect x="1" y="1" width="1098" height="518" fill="#FFFFFF" rx="22" stroke="#E2E8EC"/><text x="52" y="48" font-size="16" fill="#61717D" font-weight="600" text-anchor="start">04  ·  客户持仓诊断</text><text x="52" y="92" font-size="30" fill="#253847" font-weight="650" text-anchor="start">产品市值与具名资产覆盖</text><text x="52" y="125" font-size="18" fill="#61717D" font-weight="400" text-anchor="start">虚构客户  ·  合计100万元  ·  产品市值口径</text><rect x="60" y="185" width="392" height="90" fill="#365E79" rx="0"/><text x="256" y="218" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="middle">005827</text><text x="256" y="252" font-size="22" fill="#FFFFFF" font-weight="650" text-anchor="middle">40万元  ·  40%</text><rect x="452" y="185" width="196" height="90" fill="#7395A7" rx="0"/><text x="550" y="218" font-size="20" fill="#FFFFFF" font-weight="600" text-anchor="middle">003095</text><text x="550" y="252" font-size="22" fill="#FFFFFF" font-weight="650" text-anchor="middle">20万元  ·  20%</text><rect x="648" y="185" width="392" height="90" fill="#EAF0F3" rx="0"/><text x="844" y="218" font-size="20" fill="#253847" font-weight="600" text-anchor="middle">未具名货币基金</text><text x="844" y="252" font-size="22" fill="#253847" font-weight="650" text-anchor="middle">40万元  ·  40%</text><text x="60" y="330" font-size="24" fill="#253847" font-weight="600" text-anchor="start">具名基金分析覆盖：60万元（60%）</text><rect x="60" y="354" width="980" height="20" fill="#EAF0F3" rx="5"/><rect x="60" y="354" width="588" height="20" fill="#365E79" rx="5"/><text x="60" y="413" font-size="19" fill="#61717D" font-weight="400" text-anchor="start">其余40万元未提供具体产品代码，不推定收益、持仓或到账安排。</text><text x="52" y="467" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">来源：本轮模拟输入；40%／20%／40%为产品市值比例。</text><text x="52" y="495" font-size="17" fill="#61717D" font-weight="400" text-anchor="start">60万元是两只基金的产品市值，不等同60万元股票；本图未绘制资产穿透。</text></g></svg>