<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="simple-title simple-desc" font-family="'Inter','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Heiti SC',sans-serif">
  <title id="simple-title">小顾帮客户算，顾问陪客户选</title>
  <desc id="simple-desc">一位客户想十年存够三十万元学费。AI 小顾按从零起存、不计收益算出每月两千五百元。在千问里提供这项服务的就是千问小顾。如果同一笔钱三年后还要付首付，真人顾问在且慢顾问工作台打开原测算，和客户比较学费优先和首付优先的安排。盈米 AI 实验室把投顾专家的方法做成两边都能用的教育金测算工具。这是规划示例。</desc>
  <defs>
    <marker id="go" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 13 7 1 13Z" fill="#2e644e"/></marker>
    <marker id="supply-tip" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11Z" fill="#8f6b42"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#faf9f3"/>
  <g fill="#1b4337">
    <path d="M64 46H94" stroke="#386e54" stroke-width="5"/>
    <text x="108" y="53" font-size="23" font-weight="620">且慢 · 投顾服务</text>
    <text x="1536" y="53" text-anchor="end" font-size="21" fill="#53675a">2027 规划示例</text>
    <text x="61" y="144" font-size="71" font-weight="700" letter-spacing="-2">小顾帮客户算，顾问陪客户选</text>
    <text x="65" y="210" font-size="33">客户问：“十年后想给孩子留 30 万元学费，每个月要存多少？”</text>
  </g>
  <g>
    <rect x="64" y="266" width="557" height="310" rx="18" fill="#e8f0e5" stroke="#bbccba" stroke-width="2"/>
    <text x="94" y="310" font-size="23" font-weight="600" fill="#4f7058">客户自己问</text>
    <text x="91" y="377" font-size="53" font-weight="700" fill="#174330">AI 小顾</text>
    <text x="94" y="422" font-size="27" fill="#2b4e3c">在千问里问到的，就是「千问小顾」。</text>
    <text x="91" y="508" font-size="71" font-weight="700" letter-spacing="-2" fill="#195538">2,500</text>
    <text x="294" y="505" font-size="31" font-weight="600" fill="#195538">元 / 月</text>
    <text x="94" y="549" font-size="24" fill="#45624d">30 万元 ÷ 120 个月。从零起存，不计收益。</text>
  </g>
  <g fill="#294f3c" text-anchor="middle">
    <text x="801" y="369" font-size="23" fill="#52675a">客户又说</text>
    <text x="801" y="418" font-size="30" font-weight="630">“三年后还要付首付。”</text>
    <path d="M643 450 H952" fill="none" stroke="#2e644e" stroke-width="4" stroke-linecap="round" marker-end="url(#go)"/>
    <text x="800" y="496" font-size="23" fill="#52675a">两个目标要用同一笔钱</text>
  </g>
  <g>
    <rect x="979" y="266" width="557" height="310" rx="18" fill="#fffefd" stroke="#c8d1c2" stroke-width="2"/>
    <text x="1009" y="310" font-size="23" font-weight="600" fill="#4f7058">真人顾问使用</text>
    <text x="1006" y="377" font-size="49" font-weight="700" fill="#1b4337">且慢顾问工作台</text>
    <text x="1009" y="422" font-size="27" fill="#2b4e3c">顾问打开刚才那份测算，和客户比较</text>
    <text x="1007" y="497" font-size="43" font-weight="650" fill="#1b4337">先保学费，还是先留首付？</text>
    <text x="1009" y="548" font-size="24" fill="#45624d">客户定优先级，顾问记下新计划和复访时间。</text>
  </g>
  <g fill="none" stroke="#8f6b42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 684V632H343V582" marker-end="url(#supply-tip)"/>
    <path d="M800 632H1257V582" marker-end="url(#supply-tip)"/>
  </g>
  <rect x="623" y="610" width="354" height="41" rx="20" fill="#faf9f3"/>
  <text x="800" y="641" text-anchor="middle" font-size="25" font-weight="600" fill="#765633">两边共用同一个测算工具</text>
  <g text-anchor="middle">
    <rect x="307" y="684" width="986" height="141" rx="17" fill="#f3ead8" stroke="#d8c6a8" stroke-width="2"/>
    <text x="800" y="747" font-size="42" font-weight="680" fill="#674827">盈米 AI 实验室</text>
    <text x="800" y="796" font-size="28" fill="#594b38">投顾专家定规则，实验室把规则做成工具，用案例测准后交给两边。</text>
  </g>
  <text x="1536" y="869" text-anchor="end" font-size="20" fill="#687266">教育金场景 · 金额为算术示例</text>
</svg>
