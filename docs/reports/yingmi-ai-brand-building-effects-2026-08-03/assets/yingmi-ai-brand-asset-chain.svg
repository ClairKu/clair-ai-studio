<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 品牌资产链</title>
  <desc id="desc">技术能力、场景案例、生态共建和行业标准依次构成品牌资产，并把曝光连接到申请、使用和采购</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121426"/>
      <stop offset="1" stop-color="#31285d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7761dc"/>
      <stop offset="1" stop-color="#c7baff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#070714" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <text x="90" y="105" fill="#b9acff" font-size="26" letter-spacing="5" font-family="Songti SC, STSong, serif">YINGMI AI · BRAND ASSET CHAIN</text>
  <text x="90" y="175" fill="#fff" font-size="58" font-weight="700" font-family="Songti SC, STSong, serif">品牌价值由事实逐层累积</text>
  <text x="92" y="222" fill="#d8d4eb" font-size="25" font-family="Songti SC, STSong, serif">传播不是起点；能力、案例、生态与标准才是可持续品牌资产。</text>
  <path d="M180 430 H1420" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Songti SC, STSong, serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(230 430)">
      <circle r="108" fill="#6753c5"/>
      <text y="-8" fill="#d9d1ff" font-size="22" letter-spacing="3">ABILITY</text>
      <text y="40" fill="#fff" font-size="40" font-weight="700">技术能力</text>
    </g>
    <g transform="translate(610 430)">
      <circle r="108" fill="#7b65db"/>
      <text y="-8" fill="#e0d9ff" font-size="22" letter-spacing="3">PROOF</text>
      <text y="40" fill="#fff" font-size="40" font-weight="700">场景案例</text>
    </g>
    <g transform="translate(990 430)">
      <circle r="108" fill="#927eef"/>
      <text y="-8" fill="#f0ecff" font-size="22" letter-spacing="3">ECOSYSTEM</text>
      <text y="40" fill="#fff" font-size="40" font-weight="700">生态共建</text>
    </g>
    <g transform="translate(1370 430)">
      <circle r="108" fill="#b8a9ff"/>
      <text y="-8" fill="#4a3f7e" font-size="22" letter-spacing="3">AUTHORITY</text>
      <text y="40" fill="#1f1b38" font-size="40" font-weight="700">行业标准</text>
    </g>
  </g>
  <g fill="#fff" font-family="Songti SC, STSong, serif" text-anchor="middle">
    <text x="230" y="610" font-size="25">MCP · Skills · Agents</text>
    <text x="610" y="610" font-size="25">报告 · 教程 · 用户故事</text>
    <text x="990" y="610" font-size="25">平台 · 大会 · 联合产品</text>
    <text x="1370" y="610" font-size="25">评测 · 报告 · 奖项</text>
  </g>
  <rect x="90" y="700" width="1420" height="112" rx="28" fill="#fff" opacity=".08"/>
  <g font-family="Songti SC, STSong, serif" text-anchor="middle">
    <text x="300" y="755" fill="#bfb4ff" font-size="22" letter-spacing="3">REACH</text>
    <text x="300" y="792" fill="#fff" font-size="30">被看见</text>
    <text x="635" y="755" fill="#bfb4ff" font-size="22" letter-spacing="3">INTENT</text>
    <text x="635" y="792" fill="#fff" font-size="30">提交申请</text>
    <text x="970" y="755" fill="#bfb4ff" font-size="22" letter-spacing="3">ADOPTION</text>
    <text x="970" y="792" fill="#fff" font-size="30">被使用与复用</text>
    <text x="1305" y="755" fill="#bfb4ff" font-size="22" letter-spacing="3">VALUE</text>
    <text x="1305" y="792" fill="#fff" font-size="30">合作与采购</text>
  </g>
</svg>
