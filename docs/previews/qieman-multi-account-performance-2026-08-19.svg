<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="且慢多账户用户投资表现对比">
  <rect width="720" height="405" fill="#f4f4f1"/>
  <rect x="0.5" y="0.5" width="719" height="404" fill="none" stroke="rgba(16,21,28,0.08)"/>

  <!-- 标题区 -->
  <text x="48" y="66" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="800" letter-spacing="2.2" fill="#2a78d6">且慢 · 用户数据分析</text>
  <text x="48" y="104" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#10151c">账户越多，在场更久、赚得更多，</text>
  <text x="48" y="140" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#10151c">也扛着更大的波动</text>
  <text x="48" y="170" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#8a8f98">28.8 万在管用户 × 三组账户数 × 五项指标 · 2026-08</text>

  <!-- 图例 -->
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" fill="#4c5563">
    <rect x="48" y="196" width="10" height="10" rx="3" fill="#2a78d6"/><text x="64" y="206">1 个账户</text>
    <rect x="140" y="196" width="10" height="10" rx="3" fill="#eb6834"/><text x="156" y="206">2 个</text>
    <rect x="212" y="196" width="10" height="10" rx="3" fill="#1baf7a"/><text x="228" y="206">3 个及以上</text>
  </g>

  <!-- 左面板：收益率 -->
  <g>
    <rect x="48" y="228" width="300" height="132" rx="12" fill="#fcfcfb" stroke="rgba(16,21,28,0.1)"/>
    <text x="66" y="254" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#10151c">平均投资收益率</text>
    <line x1="66" y1="264" x2="66" y2="344" stroke="#c6c8c3" stroke-width="2"/>
    <rect x="66" y="270" width="118" height="16" rx="0" fill="#2a78d6"/>
    <rect x="66" y="294" width="166" height="16" fill="#eb6834"/>
    <rect x="66" y="318" width="180" height="16" fill="#1baf7a"/>
    <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#10151c">
      <text x="192" y="283">6.66%</text>
      <text x="240" y="307">9.37%</text>
      <text x="254" y="331">10.13%</text>
    </g>
  </g>

  <!-- 右面板：最大回撤 -->
  <g>
    <rect x="372" y="228" width="300" height="132" rx="12" fill="#fcfcfb" stroke="rgba(16,21,28,0.1)"/>
    <text x="390" y="254" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#10151c">平均最大回撤</text>
    <line x1="390" y1="264" x2="390" y2="344" stroke="#c6c8c3" stroke-width="2"/>
    <rect x="390" y="270" width="138" height="16" fill="#2a78d6"/>
    <rect x="390" y="294" width="178" height="16" fill="#eb6834"/>
    <rect x="390" y="318" width="188" height="16" fill="#1baf7a"/>
    <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#10151c">
      <text x="536" y="283">13.71%</text>
      <text x="576" y="307">17.70%</text>
      <text x="586" y="331">18.74%</text>
    </g>
  </g>

  <!-- 右上角样本徽标 -->
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
    <rect x="524" y="46" width="148" height="56" rx="10" fill="#fcfcfb" stroke="rgba(16,21,28,0.1)"/>
    <text x="540" y="70" font-size="11" fill="#8a8f98">基底样本</text>
    <text x="540" y="92" font-size="18" font-weight="700" fill="#10151c">288,460 人</text>
  </g>
</svg>
