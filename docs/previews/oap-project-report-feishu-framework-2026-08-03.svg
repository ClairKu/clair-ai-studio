<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 开放平台 8·3 项目汇报预览</title>
  <desc id="desc">按当前飞书十项框架生成的加密项目汇报，用户增长图表已内嵌，需密码访问正文。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#eae6f8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7058d8"/><stop offset="1" stop-color="#a58df7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a32"/><stop offset="1" stop-color="#263151"/></linearGradient>
    <style>text{font-family:"Songti SC",STSong,Georgia,serif}.ey{font-size:10px;font-weight:800;letter-spacing:1.6px}.title{font-size:28px;font-weight:800}.sub{font-size:11px}.h{font-size:17px;font-weight:800}.b{font-size:11px}.n{font-size:9px}</style>
  </defs>
  <rect width="720" height="405" rx="28" fill="url(#bg)"/>
  <text x="30" y="34" class="ey" fill="#735bd8">YINGMI AI OPEN PLATFORM · INTERNAL</text>
  <text x="30" y="74" class="title" fill="#171a2a">盈米 AI 开放平台｜8·3 汇报</text>
  <text x="30" y="96" class="sub" fill="#687287">当前飞书十项框架 · 用户增长可视化已纳入 · 加密正文</text>
  <g transform="translate(30 124)">
    <rect width="660" height="128" rx="20" fill="url(#navy)"/>
    <text x="24" y="34" class="ey" fill="#a99aff">REPORT ARCHITECTURE</text>
    <text x="24" y="70" class="h" fill="#fff">年度目标 → 关键举措 → 用户增长 → 新流量入口 → 产品规划</text>
    <text x="24" y="100" class="b" fill="#cfd6f2">能力建设 → AI 实验室 → 商化准备 → 行业机会 → 问题回顾</text>
  </g>
  <g transform="translate(30 272)">
    <rect width="318" height="94" rx="18" fill="#fff" stroke="#dcd5f7"/>
    <text x="20" y="32" class="ey" fill="#735bd8">GROWTH CHART</text>
    <text x="20" y="60" class="h" fill="#171a2a">历程与增长已经同图</text>
    <text x="20" y="79" class="n" fill="#687287">增长图与口径卡均嵌入加密正文</text>
    <rect x="336" width="324" height="94" rx="18" fill="url(#violet)"/>
    <text x="356" y="32" class="ey" fill="#eeeaff">ACCESS CONTROL</text>
    <text x="356" y="60" class="h" fill="#fff">密码解锁 · AES-GCM</text>
    <text x="356" y="79" class="n" fill="#eeeaff">公开仓库不保存明文正文与图表数据</text>
  </g>
  <text x="30" y="391" class="n" fill="#687287">CLAIR EXECUTIVE VISUAL REPORT · PRODUCTION</text>
</svg>
