<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">且慢顾问工作台 QAS · 90秒短片分镜脚本</title>
  <desc id="d">五幕十三镜分镜、完整旁白、录屏清单与视觉合规规范，短片《把时间还给客户》。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaf2ff"/><stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <radialGradient id="g1" cx=".85" cy="0" r=".65">
      <stop stop-color="#c9deff" stop-opacity=".9"/><stop offset="1" stop-color="#c9deff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3d78ff"/><stop offset="1" stop-color="#1d4fd7"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1f4ea2" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#g1)"/>
  <circle cx="92" cy="588" r="150" fill="#dceaff" opacity=".7"/>
  <circle cx="1120" cy="600" r="120" fill="#e4eeff" opacity=".8"/>

  <text x="72" y="86" fill="#1d4fd7" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="800" letter-spacing="4">QAS · 90s FILM STORYBOARD</text>
  <text x="72" y="150" fill="#17233d" font-family="Arial,'PingFang SC',sans-serif" font-size="50" font-weight="900">《把时间还给客户》</text>
  <text x="72" y="208" fill="#2c3d5c" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700">且慢顾问工作台 QAS · 一分半产品短片分镜脚本</text>

  <g font-family="Arial,'PingFang SC',sans-serif" filter="url(#s)">
    <rect x="72" y="252" width="238" height="168" rx="22" fill="#ffffff"/>
    <rect x="72" y="252" width="238" height="8" rx="4" fill="#6a5cff"/>
    <text x="96" y="322" fill="#6a5cff" font-size="44" font-weight="900">90s</text>
    <text x="96" y="362" fill="#17233d" font-size="19" font-weight="800">一分半成片</text>
    <text x="96" y="392" fill="#5d6e8a" font-size="15">1:1 方屏 · 含横版规范</text>

    <rect x="332" y="252" width="238" height="168" rx="22" fill="#ffffff"/>
    <rect x="332" y="252" width="238" height="8" rx="4" fill="#2f6bff"/>
    <text x="356" y="322" fill="#1d4fd7" font-size="44" font-weight="900">5 幕</text>
    <text x="356" y="362" fill="#17233d" font-size="19" font-weight="800">13 个分镜</text>
    <text x="356" y="392" fill="#5d6e8a" font-size="15">痛点 → 登场 → 双案例</text>

    <rect x="592" y="252" width="238" height="168" rx="22" fill="#ffffff"/>
    <rect x="592" y="252" width="238" height="8" rx="4" fill="#0aa3c9"/>
    <text x="616" y="322" fill="#0aa3c9" font-size="44" font-weight="900">420<tspan font-size="22">字</tspan></text>
    <text x="616" y="362" fill="#17233d" font-size="19" font-weight="800">完整旁白稿</text>
    <text x="616" y="392" fill="#5d6e8a" font-size="15">可一键复制配音</text>

    <rect x="852" y="252" width="276" height="168" rx="22" fill="#17233d"/>
    <rect x="852" y="252" width="276" height="8" rx="4" fill="#e8902a"/>
    <text x="878" y="322" fill="#ffd9a3" font-size="40" font-weight="900">4 张</text>
    <text x="878" y="362" fill="#ffffff" font-size="19" font-weight="800">关键帧概念图</text>
    <text x="878" y="392" fill="#a9bcd6" font-size="15">录屏清单 · 合规规范</text>
  </g>

  <g font-family="Arial,'PingFang SC',sans-serif">
    <rect x="72" y="470" width="1056" height="84" rx="18" fill="#ffffff" opacity=".92" filter="url(#s)"/>
    <rect x="100" y="498" width="150" height="28" rx="9" fill="#ecebff"/>
    <text x="175" y="518" text-anchor="middle" fill="#6a5cff" font-size="15" font-weight="800">① 痛点共鸣 22s</text>
    <rect x="266" y="498" width="140" height="28" rx="9" fill="#e4eeff"/>
    <text x="336" y="518" text-anchor="middle" fill="#1d4fd7" font-size="15" font-weight="800">② 产品登场 13s</text>
    <rect x="422" y="498" width="170" height="28" rx="9" fill="#e0f5fb"/>
    <text x="507" y="518" text-anchor="middle" fill="#0a8f9e" font-size="15" font-weight="800">③ 新客承接 22s</text>
    <rect x="608" y="498" width="170" height="28" rx="9" fill="#ecebff"/>
    <text x="693" y="518" text-anchor="middle" fill="#5446e0" font-size="15" font-weight="800">④ 老客跟进 22s</text>
    <rect x="794" y="498" width="150" height="28" rx="9" fill="#fdf1e1"/>
    <text x="869" y="518" text-anchor="middle" fill="#b06a16" font-size="15" font-weight="800">⑤ 升华 11s</text>
    <text x="972" y="519" fill="#17233d" font-size="15" font-weight="900">合计 01:30</text>
    <text x="100" y="548" fill="#5d6e8a" font-size="13">包装动画 + QAS 脱敏录屏 · 浅蓝云视觉 · 全程合规条 · 2026-11-25 v1</text>
  </g>

  <text x="72" y="618" fill="#8596b0" font-family="Arial,'PingFang SC',sans-serif" font-size="15">依据飞书文档《且慢顾问工作台 Demo 内容》重组 · 界面为示意线框 / 概念图，客户与数据均为虚拟演示</text>
