<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Clair Review OS 产品与设计智能评审器</title>
  <desc id="desc">奶油色工作台界面，包含材料、原文标注、评审结论和进化状态</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f2eb"/><stop offset="1" stop-color="#e9eef6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#1c2735" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1050" cy="20" r="240" fill="#dbe6ff" opacity=".7"/>
  <circle cx="70" cy="650" r="220" fill="#e8dfc9" opacity=".7"/>
  <g filter="url(#shadow)">
    <rect x="52" y="44" width="1096" height="587" rx="28" fill="#fbfaf7" stroke="#d8d7d2"/>
    <rect x="52" y="44" width="1096" height="74" rx="28" fill="#18202a"/>
    <rect x="52" y="88" width="1096" height="30" fill="#18202a"/>
  </g>
  <rect x="80" y="65" width="34" height="34" rx="10" fill="#f4f1e9"/>
  <text x="97" y="90" font-family="Georgia,serif" font-size="24" font-style="italic" text-anchor="middle" fill="#18202a">C</text>
  <text x="130" y="80" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">CLAIR REVIEW OS</text>
  <text x="130" y="99" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#aab4c1">PRODUCT JUDGMENT SYSTEM</text>
  <rect x="932" y="68" width="176" height="28" rx="14" fill="#283544"/>
  <circle cx="951" cy="82" r="5" fill="#5dd3a7"/>
  <text x="965" y="87" font-family="Arial,sans-serif" font-size="11" fill="#dce4ed">MODEL v0.3 · LOCAL</text>
  <text x="80" y="153" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#2358dc">REVIEW WORKBENCH</text>
  <text x="80" y="187" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18202a">把重复提醒，变成会进化的评审系统。</text>
  <g transform="translate(80 218)">
    <rect width="292" height="370" rx="18" fill="#fff" stroke="#deddd8"/>
    <text x="22" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#18202a">01 · 评审材料</text>
    <rect x="22" y="54" width="248" height="36" rx="9" fill="#f3f4f6"/>
    <text x="35" y="77" font-family="Arial,sans-serif" font-size="11" fill="#68717c">需求文档 / 设计稿 / 案例</text>
    <rect x="22" y="104" width="248" height="182" rx="11" fill="#fbfaf7" stroke="#e3e2de"/>
    <text x="36" y="129" font-family="Arial,sans-serif" font-size="10" fill="#68717c">目标：在首页增加 AI 推荐专区，</text>
    <text x="36" y="151" font-family="Arial,sans-serif" font-size="10" fill="#68717c">系统根据用户情况智能推荐基金，</text>
    <rect x="33" y="161" width="194" height="22" rx="5" fill="#fff0d8"/>
    <text x="36" y="176" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#9b5d12">提升体验和转化，一期先简单做。</text>
    <rect x="22" y="304" width="248" height="44" rx="11" fill="#18202a"/>
    <text x="146" y="331" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">开始 Clair 式评审</text>
  </g>
  <g transform="translate(394 218)">
    <rect width="390" height="370" rx="18" fill="#fff" stroke="#deddd8"/>
    <text x="22" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#18202a">02 · 原文定位</text>
    <rect x="22" y="58" width="346" height="282" rx="12" fill="#fbfaf7" stroke="#e3e2de"/>
    <text x="42" y="94" font-family="Arial,sans-serif" font-size="10" fill="#a0a5ac">需求背景</text>
    <text x="42" y="121" font-family="Arial,sans-serif" font-size="12" fill="#303946">我们计划在且慢首页新增一个</text>
    <rect x="39" y="134" width="224" height="26" rx="5" fill="#ffe3df"/>
    <text x="42" y="151" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#9d2f28">AI 推荐专区</text>
    <circle cx="340" cy="146" r="14" fill="#d94b43"/>
    <text x="340" y="151" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#fff">1</text>
    <text x="42" y="191" font-family="Arial,sans-serif" font-size="12" fill="#303946">根据用户情况智能推荐基金。</text>
    <rect x="39" y="205" width="246" height="26" rx="5" fill="#fff0d8"/>
    <text x="42" y="222" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#9b5d12">提升用户体验和转化</text>
    <circle cx="340" cy="218" r="14" fill="#d89431"/>
    <text x="340" y="223" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#fff">2</text>
    <text x="42" y="261" font-family="Arial,sans-serif" font-size="12" fill="#303946">点击按钮后可以直接购买。</text>
    <circle cx="340" cy="258" r="14" fill="#d94b43"/>
    <text x="340" y="263" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#fff">3</text>
  </g>
  <g transform="translate(806 218)">
    <rect width="302" height="370" rx="18" fill="#fff" stroke="#deddd8"/>
    <text x="22" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#18202a">03 · 评审结论</text>
    <rect x="22" y="54" width="258" height="74" rx="12" fill="#fff5f2" stroke="#f0cbc5"/>
    <text x="38" y="81" font-family="Arial,sans-serif" font-size="11" fill="#a13a32">需补充后再评审</text>
    <text x="38" y="111" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18202a">58</text>
    <text x="73" y="109" font-family="Arial,sans-serif" font-size="10" fill="#68717c">/ 100 · P0 3 · P1 4</text>
    <rect x="22" y="146" width="258" height="64" rx="10" fill="#fbfaf7" stroke="#e3e2de"/>
    <rect x="36" y="162" width="30" height="18" rx="9" fill="#ffe0dc"/>
    <text x="51" y="175" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#a52e27">P0</text>
    <text x="77" y="175" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#18202a">AI 判断边界未定义</text>
    <text x="36" y="197" font-family="Arial,sans-serif" font-size="9" fill="#68717c">拆分确定性规则、生成内容与人工复核。</text>
    <rect x="22" y="222" width="258" height="64" rx="10" fill="#fbfaf7" stroke="#e3e2de"/>
    <rect x="36" y="238" width="30" height="18" rx="9" fill="#ffe0dc"/>
    <text x="51" y="251" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#a52e27">P0</text>
    <text x="77" y="251" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#18202a">交易与投顾语义混用</text>
    <text x="36" y="273" font-family="Arial,sans-serif" font-size="9" fill="#68717c">补授权、适当性、留痕与客服查询路径。</text>
    <rect x="22" y="304" width="124" height="44" rx="11" fill="#18202a"/>
    <text x="84" y="331" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">复制 PM 版</text>
    <rect x="156" y="304" width="124" height="44" rx="11" fill="#eef2ff"/>
    <text x="218" y="331" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2358dc">沉淀为案例</text>
  </g>
</svg>
