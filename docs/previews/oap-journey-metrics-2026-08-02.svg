<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 开放平台用户走视图预览</title>
  <desc id="desc">左侧为关键举措，右侧为四项用户指标联动走势；完整内容需密码访问。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111629"/>
      <stop offset="1" stop-color="#262244"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8067e8"/>
      <stop offset="1" stop-color="#b9a8ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c85f8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9c85f8" stop-opacity=".02"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <rect x="0" y="0" width="450" height="900" fill="#fbfaff"/>
  <text x="68" y="92" fill="#8067e8" font-family="Songti SC,STSong,serif" font-size="22" font-weight="700" letter-spacing="4">YINGMI AI · OAP JOURNEY</text>
  <text x="68" y="164" fill="#171525" font-family="Songti SC,STSong,serif" font-size="50" font-weight="700">历程・里程碑</text>
  <line x1="106" y1="226" x2="106" y2="790" stroke="#ded9ee" stroke-width="2"/>
  <g font-family="Songti SC,STSong,serif">
    <g transform="translate(0 0)"><circle cx="106" cy="270" r="12" fill="#8067e8"/><text x="148" y="260" fill="#8067e8" font-size="20" font-weight="700">2025.03</text><text x="148" y="296" fill="#171525" font-size="27">能力开放</text></g>
    <g transform="translate(0 128)"><circle cx="106" cy="270" r="12" fill="#42bbaa"/><text x="148" y="260" fill="#42a99c" font-size="20" font-weight="700">2025.06</text><text x="148" y="296" fill="#171525" font-size="27">生态分发</text></g>
    <g transform="translate(0 256)"><circle cx="106" cy="270" r="12" fill="#d59a3d"/><text x="148" y="260" fill="#b57a20" font-size="20" font-weight="700">2025.09</text><text x="148" y="296" fill="#171525" font-size="27">模型与评测</text></g>
    <g transform="translate(0 384)"><circle cx="106" cy="270" r="12" fill="#e0627c"/><text x="148" y="260" fill="#c34b65" font-size="20" font-weight="700">2026.07</text><text x="148" y="296" fill="#171525" font-size="27">终端与商业验证</text></g>
  </g>
  <text x="520" y="92" fill="#a99aff" font-family="Songti SC,STSong,serif" font-size="22" font-weight="700" letter-spacing="4">2025.03 — 2026.08</text>
  <text x="520" y="172" fill="#ffffff" font-family="Songti SC,STSong,serif" font-size="56" font-weight="700">盈米 AI 开放平台用户走视图</text>
  <text x="520" y="218" fill="#aeb6ca" font-family="Songti SC,STSong,serif" font-size="24">关键举措 × 累计用户、累计调用、月活与日活实时联动</text>
  <g opacity=".28" stroke="#8d95ac" stroke-width="1">
    <line x1="520" y1="330" x2="1520" y2="330"/><line x1="520" y1="470" x2="1520" y2="470"/><line x1="520" y1="610" x2="1520" y2="610"/><line x1="520" y1="750" x2="1520" y2="750"/>
  </g>
  <path d="M520 760 C650 736 742 690 832 660 C928 626 1004 622 1094 560 C1192 493 1224 430 1308 398 C1390 367 1440 300 1520 246 L1520 760 Z" fill="url(#area)"/>
  <path d="M520 760 C650 736 742 690 832 660 C928 626 1004 622 1094 560 C1192 493 1224 430 1308 398 C1390 367 1440 300 1520 246" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M520 772 C620 704 684 790 770 690 C860 760 930 640 1008 700 C1092 594 1160 660 1238 514 C1312 588 1402 390 1520 470" fill="none" stroke="#45c6b6" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <g fill="#fff"><circle cx="832" cy="660" r="9"/><circle cx="1094" cy="560" r="9"/><circle cx="1308" cy="398" r="9"/><circle cx="1520" cy="246" r="11"/></g>
  <rect x="1290" y="760" width="230" height="56" rx="28" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.16)"/>
  <text x="1405" y="797" text-anchor="middle" fill="#d8dcec" font-family="Songti SC,STSong,serif" font-size="20">内部 · 密码访问</text>
</svg>
