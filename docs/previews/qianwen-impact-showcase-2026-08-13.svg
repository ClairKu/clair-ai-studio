<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">盈米与千问上线传播成效</title>
  <desc id="desc">展示 327.4 万表内阅读、257 个独立内容、44.9 万公开展现和 5 个可播放经典案例。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f6ff"/><stop offset="1" stop-color="#e8e1ff"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151c35"/><stop offset="1" stop-color="#2c2556"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#5a46a7" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <g font-family="Arial, PingFang SC, sans-serif">
    <text x="100" y="100" fill="#7457e8" font-size="22" font-weight="800" letter-spacing="4">YINGMI × QIANWEN · IMPACT SHOWCASE</text>
    <text x="100" y="180" fill="#171a27" font-size="62" font-weight="800">一次上线，形成内容爆发</text>
    <text x="100" y="242" fill="#7457e8" font-size="42" font-weight="700">媒体验证 × 用户场景扩散</text>

    <g filter="url(#shadow)">
      <rect x="100" y="315" width="410" height="205" rx="30" fill="#fff"/>
      <text x="140" y="365" fill="#726a82" font-size="20" font-weight="700">表内阅读量</text>
      <text x="140" y="455" fill="#5d42d0" font-size="78" font-weight="800">327.4 万</text>
      <text x="140" y="492" fill="#8b8497" font-size="18">2026-08-12 监测快照</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="545" y="315" width="315" height="205" rx="30" fill="#fff"/>
      <text x="585" y="365" fill="#726a82" font-size="20" font-weight="700">独立内容</text>
      <text x="585" y="455" fill="#171a27" font-size="78" font-weight="800">257</text>
      <text x="585" y="492" fill="#8b8497" font-size="18">235 篇文章 · 22 条视频</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="895" y="315" width="315" height="205" rx="30" fill="#fff"/>
      <text x="935" y="365" fill="#726a82" font-size="20" font-weight="700">公开展现</text>
      <text x="935" y="455" fill="#171a27" font-size="70" font-weight="800">44.9 万</text>
      <text x="935" y="492" fill="#8b8497" font-size="18">与阅读、播放不混加</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1245" y="315" width="255" height="205" rx="30" fill="#7457e8"/>
      <text x="1285" y="365" fill="#e9e3ff" font-size="20" font-weight="700">经典案例</text>
      <text x="1285" y="455" fill="#fff" font-size="78" font-weight="800">5</text>
      <text x="1285" y="492" fill="#e9e3ff" font-size="18">页面内直接播放</text>
    </g>

    <g transform="translate(100 590)">
      <rect width="1400" height="190" rx="32" fill="url(#card)"/>
      <circle cx="90" cy="95" r="42" fill="#8d73f2"/><path d="M78 70l34 25-34 25z" fill="#fff"/>
      <text x="160" y="82" fill="#bba9ff" font-size="18" font-weight="800" letter-spacing="3">CLASSIC CASES</text>
      <text x="160" y="132" fill="#fff" font-size="34" font-weight="700">深度文章 · 横向测评 · 一周体验 · 短视频扩散 · 全流程实测</text>
      <g fill="#d7cee9" font-size="18">
        <text x="1150" y="82">8 月 10 日</text><text x="1150" y="116">162 个内容峰值</text><text x="1150" y="150">传播持续三天</text>
      </g>
    </g>
    <text x="100" y="845" fill="#716b7b" font-size="18">Clair AI Studio · 2026.08.13 · 公开脱敏版</text>
