<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GetLatestQuotations 市场温度计与行情公式深查</title>
  <desc id="desc">深蓝色技术报告预览，展示温度公式、五档温度带与行情字段映射。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172c"/>
      <stop offset="1" stop-color="#123b5d"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2da44e"/>
      <stop offset=".4" stop-color="#7cb342"/>
      <stop offset=".6" stop-color="#c9a063"/>
      <stop offset=".8" stop-color="#e07b39"/>
      <stop offset="1" stop-color="#cf222e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1070" cy="88" r="180" fill="#34b3ff" opacity=".08"/>
  <circle cx="80" cy="610" r="220" fill="#c9a063" opacity=".08"/>
  <text x="72" y="72" fill="#7dd3fc" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" letter-spacing="2">MCP · SOURCE-LEVEL AUDIT</text>
  <text x="72" y="142" fill="#fff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="48" font-weight="800">GetLatestQuotations</text>
  <text x="72" y="198" fill="#d8e9f5" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="650">市场温度计与行情公式深查</text>
  <g filter="url(#shadow)">
    <rect x="72" y="244" width="650" height="244" rx="24" fill="#fff" opacity=".98"/>
    <text x="108" y="294" fill="#597083" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700">核心温度公式 · 近十年交易日窗口</text>
    <text x="108" y="354" fill="#0f2c42" font-family="Georgia,Times New Roman,serif" font-size="28" font-weight="700">T = (Pₚₑ + Pₚᵦ + Pᵣᵢₛₖ) ÷ 3 × 100</text>
    <rect x="108" y="390" width="574" height="24" rx="12" fill="url(#heat)"/>
    <g fill="#41586a" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" text-anchor="middle">
      <text x="108" y="442" text-anchor="start">低估</text><text x="251" y="442">较低估</text><text x="395" y="442">合理</text><text x="538" y="442">较高估</text><text x="682" y="442" text-anchor="end">高估</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="758" y="244" width="370" height="244" rx="24" fill="#0b2238" stroke="#4f7795"/>
    <text x="794" y="294" fill="#7dd3fc" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700">行情字段映射</text>
    <g font-family="SFMono-Regular,Menlo,monospace" font-size="18">
      <text x="794" y="346" fill="#a8c4d8">closePrice</text><text x="1086" y="346" fill="#fff" text-anchor="end">price_close</text>
      <text x="794" y="390" fill="#a8c4d8">dailyChange</text><text x="1086" y="390" fill="#fff" text-anchor="end">return_day</text>
      <text x="794" y="434" fill="#a8c4d8">changePercent</text><text x="1086" y="434" fill="#fff" text-anchor="end">r × 100%</text>
    </g>
  </g>
  <text x="72" y="560" fill="#d8e9f5" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19">pmdj → smartdq → commons-processor → finance-api / FDP → 聚源 / Wind</text>
  <text x="1128" y="560" fill="#c9a063" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="end">CLAIR'S STUDIO · 2026.08.30</text>
</svg>
