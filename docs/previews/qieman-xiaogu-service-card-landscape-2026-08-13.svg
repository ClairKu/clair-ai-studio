<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">且慢小顾 35 个服务卡片覆盖结构图</title>
  <desc id="desc">生产端注册 35 个业务组件，其中 23 个真实独立落卡、5 个降级呈现、7 个未独立落卡，并展示从自然语言到下一步行动的四层服务链。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17122b"/><stop offset="1" stop-color="#2b1d57"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b6cf0"/><stop offset="1" stop-color="#b89cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b0718" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <text x="100" y="105" fill="#bba7ff" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700" letter-spacing="3">QIEMAN XIAOGU · PRODUCTION SNAPSHOT</text>
  <text x="100" y="165" fill="#fff" font-size="54" font-family="Arial, PingFang SC, sans-serif" font-weight="700">35 个业务组件，正在变成一套服务系统</text>
  <text x="100" y="210" fill="#d9d1ef" font-size="24" font-family="Arial, PingFang SC, sans-serif">独立落卡是用户真正看到的能力；降级与未落卡是下一轮治理清单</text>

  <g filter="url(#shadow)">
    <rect x="100" y="280" width="430" height="250" rx="28" fill="#fff"/>
    <text x="140" y="335" fill="#5f4b8b" font-size="20" font-family="Arial, PingFang SC, sans-serif" font-weight="700">REGISTERED</text>
    <text x="140" y="435" fill="#241b3c" font-size="110" font-family="Arial, PingFang SC, sans-serif" font-weight="800">35</text>
    <text x="330" y="427" fill="#655b77" font-size="26" font-family="Arial, PingFang SC, sans-serif">业务卡片</text>
    <rect x="140" y="470" width="340" height="16" rx="8" fill="#ece7f7"/>
    <rect x="140" y="470" width="223" height="16" rx="8" fill="url(#bar)"/>
    <rect x="363" y="470" width="49" height="16" fill="#f2bd6f"/>
    <rect x="412" y="470" width="68" height="16" rx="8" fill="#e56f87"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, PingFang SC, sans-serif">
    <rect x="570" y="280" width="290" height="250" rx="28" fill="#7557e8"/>
    <text x="610" y="335" fill="#e9e2ff" font-size="20" font-weight="700">独立落卡</text>
    <text x="610" y="438" fill="#fff" font-size="104" font-weight="800">23</text>
    <text x="610" y="488" fill="#e9e2ff" font-size="24">65.7% · 可真实操作</text>
    <rect x="900" y="280" width="290" height="250" rx="28" fill="#3a2d57" stroke="#f2bd6f" stroke-width="3"/>
    <text x="940" y="335" fill="#f7d79f" font-size="20" font-weight="700">降级呈现</text>
    <text x="940" y="438" fill="#fff" font-size="104" font-weight="800">5</text>
    <text x="940" y="488" fill="#ddd3eb" font-size="24">14.3% · 通用卡兜底</text>
    <rect x="1230" y="280" width="270" height="250" rx="28" fill="#3a2d57" stroke="#e56f87" stroke-width="3"/>
    <text x="1270" y="335" fill="#ffbdca" font-size="20" font-weight="700">未独立落卡</text>
    <text x="1270" y="438" fill="#fff" font-size="104" font-weight="800">7</text>
    <text x="1270" y="488" fill="#ddd3eb" font-size="24">20.0% · 待补链路</text>
  </g>

  <g font-family="Arial, PingFang SC, sans-serif">
    <text x="100" y="620" fill="#bba7ff" font-size="20" font-weight="700" letter-spacing="3">SERVICE CHAIN</text>
    <g>
      <rect x="100" y="660" width="300" height="120" rx="24" fill="#fff" opacity=".97"/>
      <text x="140" y="706" fill="#7557e8" font-size="18" font-weight="700">01 · 用户目标</text>
      <text x="140" y="751" fill="#241b3c" font-size="27" font-weight="700">一句自然话</text>
      <path d="M420 720h60" stroke="#bba7ff" stroke-width="6" stroke-linecap="round"/><path d="m470 706 18 14-18 14" fill="none" stroke="#bba7ff" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="500" y="660" width="300" height="120" rx="24" fill="#fff" opacity=".97"/>
      <text x="540" y="706" fill="#7557e8" font-size="18" font-weight="700">02 · 服务编排</text>
      <text x="540" y="751" fill="#241b3c" font-size="27" font-weight="700">理解 + 取数</text>
      <path d="M820 720h60" stroke="#bba7ff" stroke-width="6" stroke-linecap="round"/><path d="m870 706 18 14-18 14" fill="none" stroke="#bba7ff" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="900" y="660" width="300" height="120" rx="24" fill="#fff" opacity=".97"/>
      <text x="940" y="706" fill="#7557e8" font-size="18" font-weight="700">03 · 卡片表达</text>
      <text x="940" y="751" fill="#241b3c" font-size="27" font-weight="700">解释 + 证据</text>
      <path d="M1220 720h60" stroke="#bba7ff" stroke-width="6" stroke-linecap="round"/><path d="m1270 706 18 14-18 14" fill="none" stroke="#bba7ff" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="1300" y="660" width="200" height="120" rx="24" fill="#9a7dff"/>
      <text x="1335" y="706" fill="#ece7ff" font-size="18" font-weight="700">04 · 闭环</text>
      <text x="1335" y="751" fill="#fff" font-size="27" font-weight="700">下一步</text>
    </g>
    <text x="100" y="840" fill="#c9bfdf" font-size="20">账户 · 收益 · 诊断 · 基金 · 策略 · 规划 · 市场内容 · 消息服务</text>
    <text x="1500" y="840" fill="#c9bfdf" font-size="18" text-anchor="end">2026.08.13 · 公开脱敏版</text>
  </g>
</svg>
