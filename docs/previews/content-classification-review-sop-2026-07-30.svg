<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">宣传推介材料内容分层标准与审核 SOP</title>
  <desc id="desc">盈米内容治理报告预览，展示两级分类、三条事前审核路径、双轨巡检和记录留痕。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#f1edff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7357ed"/>
      <stop offset="1" stop-color="#947cf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0d162b" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)"/>
  <rect x="0" y="0" width="1200" height="76" fill="#f7f8fb" stroke="#dfe3ec"/>
  <rect x="32" y="18" width="42" height="42" rx="13" fill="#0d162b"/>
  <text x="53" y="45" text-anchor="middle" fill="#fff" font-family="Songti SC, STSong, serif" font-size="12" font-weight="800">YM</text>
  <text x="90" y="39" fill="#121827" font-family="Songti SC, STSong, serif" font-size="22" font-weight="800">盈米内容治理</text>
  <text x="962" y="42" fill="#7357ed" font-family="Songti SC, STSong, serif" font-size="11" font-weight="800" letter-spacing="2">STANDARD · SOP</text>

  <text x="48" y="128" fill="#7357ed" font-family="Songti SC, STSong, serif" font-size="11" font-weight="800" letter-spacing="2.4">CONTENT GOVERNANCE · STANDARD OPERATING PROCEDURE</text>
  <text x="48" y="190" fill="#121827" font-family="Songti SC, STSong, serif" font-size="49" font-weight="800">宣传推介材料</text>
  <text x="48" y="250" fill="#121827" font-family="Songti SC, STSong, serif" font-size="49" font-weight="800">内容分层与审核 SOP</text>
  <text x="720" y="173" fill="#68738a" font-family="Songti SC, STSong, serif" font-size="18" font-weight="600">分类—审核—发布—巡检—整改—留痕</text>
  <text x="720" y="210" fill="#68738a" font-family="Songti SC, STSong, serif" font-size="16">两级风险判断 · 三条事前路径 · 双轨事后巡检</text>

  <g transform="translate(48 300)">
    <rect width="1104" height="316" rx="32" fill="#0d162b" filter="url(#shadow)"/>
    <text x="28" y="46" fill="#fff" font-family="Songti SC, STSong, serif" font-size="15" font-weight="800">一条内容主线 · 两级风险判断 · 三类事前审核 · 双轨事后巡检</text>
    <g transform="translate(28 76)">
      <rect width="1048" height="208" rx="24" fill="#f6f3ff"/>
      <text x="28" y="38" fill="#7357ed" font-family="Songti SC, STSong, serif" font-size="10" font-weight="800" letter-spacing="2">OPERATING MODEL</text>
      <text x="28" y="76" fill="#121827" font-family="Songti SC, STSong, serif" font-size="28" font-weight="800">发布前有路径，发布后有监督，问题后有处置</text>
      <g transform="translate(28 106)" font-family="Songti SC, STSong, serif">
        <rect width="228" height="74" rx="14" fill="#fff" stroke="#dfe3ec"/>
        <text x="18" y="27" fill="#7357ed" font-size="10" font-weight="800">LEVEL 01 / 02</text>
        <text x="18" y="53" fill="#121827" font-size="16" font-weight="800">投教 vs 宣推 · 模板化程度</text>

        <rect x="244" width="228" height="74" rx="14" fill="#fff" stroke="#dfe3ec"/>
        <text x="262" y="27" fill="#7357ed" font-size="10" font-weight="800">SOP-1 / 2 / 3</text>
        <text x="262" y="53" fill="#121827" font-size="16" font-weight="800">机审与人工审核分流</text>

        <rect x="488" width="228" height="74" rx="14" fill="#fff" stroke="#dfe3ec"/>
        <text x="506" y="27" fill="#7357ed" font-size="10" font-weight="800">SOP-5 / 6</text>
        <text x="506" y="53" fill="#121827" font-size="16" font-weight="800">公域与私域双轨巡检</text>

        <rect x="732" width="288" height="74" rx="14" fill="url(#violet)"/>
        <text x="750" y="27" fill="#ece8ff" font-size="10" font-weight="800">TRACEABILITY</text>
        <text x="750" y="53" fill="#fff" font-size="16" font-weight="800">整改 · 考核 · 3~20 年留痕</text>
      </g>
    </g>
  </g>
</svg>
