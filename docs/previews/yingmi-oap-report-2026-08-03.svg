<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 开放平台 8·3 项目汇报预览</title>
  <desc id="desc">飞书十项框架汇报，用户增长章节内嵌历程·里程碑与增长走势可视化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#eae6f8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7058d8"/><stop offset="1" stop-color="#a58df7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a32"/><stop offset="1" stop-color="#263151"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#342568" flood-opacity=".12"/></filter>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#171a2a}.serif{font-family:"Songti SC",STSong,SimSun,serif}.eyebrow{font-size:9px;font-weight:800;letter-spacing:1.5px;fill:#735bd8}.title{font-size:24px;font-weight:800}.sub{font-size:10px;fill:#687287}.card{font-size:11px;font-weight:750}.metric{font-size:20px;font-weight:800;fill:#735bd8}.label{font-size:9px;fill:#687287}.white{fill:#fff}.pale{fill:#cfd6f2}.mint{fill:#59c2b4}</style>
  </defs>
  <rect width="720" height="405" rx="28" fill="url(#bg)"/>
  <text x="28" y="30" class="eyebrow">YINGMI AI OAP · PROJECT BRIEFING · 2026-08-03</text>
  <text x="28" y="60" class="title serif">盈米 AI 开放平台｜8·3 项目汇报</text>
  <text x="28" y="79" class="sub">年度目标 · 关键举措 · 用户增长（内嵌走势可视化） · 新流量入口 · 产品规划 · 能力建设 · AI 实验室 · 商化 · 行业 · 问题</text>
  <rect x="28" y="98" width="156" height="76" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="44" y="122" class="label">申请用户 / 10,000</text>
  <text x="44" y="152" class="metric">8,569</text>
  <rect x="198" y="98" width="156" height="76" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="214" y="122" class="label">月活 MAU / 2,000</text>
  <text x="214" y="152" class="metric">1,812</text>
  <rect x="368" y="98" width="156" height="76" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="384" y="122" class="label">累计调用 / 1,300 万</text>
  <text x="384" y="152" class="metric">919万</text>
  <rect x="538" y="98" width="154" height="76" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="554" y="122" class="label">AI 实验室</text>
  <text x="554" y="152" class="metric">0%</text>
  <rect x="28" y="190" width="400" height="186" rx="16" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="46" y="216" class="card white">用户增长 · 历程里程碑 × 增长走势（交互内嵌）</text>
  <text x="46" y="234" class="label pale">累计申请 8,292 · 总调用 9,145,099 · MAU 1,694（截至 07-28）</text>
  <polyline points="46,342 90,338 134,330 178,326 222,312 266,300 310,286 354,266 398,244" fill="none" stroke="#a58df7" stroke-width="3" stroke-linecap="round"/>
  <polyline points="46,352 90,350 134,348 178,342 222,340 266,332 310,322 354,310 398,290" fill="none" stroke="#59c2b4" stroke-width="2" stroke-linecap="round"/>
  <g fill="#e8b25c">
    <rect x="130" y="344" width="5" height="16" rx="2"/><rect x="220" y="336" width="5" height="24" rx="2"/><rect x="308" y="326" width="5" height="34" rx="2"/><rect x="380" y="300" width="5" height="60" rx="2"/>
  </g>
  <text x="46" y="372" class="label pale">2025.03 启动 → 首批 MCP → 百度首接 · 智谱首单 → 千问 A2A · 微信小微</text>
  <rect x="444" y="190" width="248" height="88" rx="14" fill="#fff" stroke="#ddd7f1" filter="url(#shadow)"/>
  <text x="460" y="216" class="card">新流量 · 微信 + 千问双入口</text>
  <text x="460" y="236" class="label">小程序用户 8 万+ · 近 7 日日活 1.37 万</text>
  <text x="460" y="254" class="label">千问首批品牌智能体 · 8/10 联合宣发</text>
  <rect x="444" y="290" width="248" height="86" rx="14" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="460" y="316" class="card white">商化准备 + 问题回顾</text>
  <text x="460" y="336" class="label pale">付费咨询 30+ · 个人/企业版方案</text>
  <text x="460" y="354" class="label pale">技术兼容 · 资源补位 · 数据采购</text>
</svg>
