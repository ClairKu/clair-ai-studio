<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2e52"/>
      <stop offset="1" stop-color="#1b88ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb9f6"/>
      <stop offset="1" stop-color="#1b88ee"/>
    </linearGradient>
  </defs>
  <rect width="720" height="405" fill="url(#bg)"/>
  <text x="48" y="72" font-family="-apple-system,'PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#ffffff">且慢养老场景</text>
  <text x="48" y="112" font-family="-apple-system,'PingFang SC',sans-serif" font-size="22" font-weight="500" fill="#9dcbf7">用户数据与规模增长分析</text>
  <text x="48" y="146" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#6fb9f6">TD 个人养老金 · QMP 养老金计划 · 颐养天年 ｜ 截至 2026-08-18</text>

  <g font-family="-apple-system,'PingFang SC',sans-serif">
    <text x="48" y="220" font-size="34" font-weight="700" fill="#ffffff">7,175</text>
    <text x="48" y="244" font-size="13" fill="#9dcbf7">开通用户</text>
    <text x="200" y="220" font-size="34" font-weight="700" fill="#ffffff">14.43<tspan font-size="18"> 亿</tspan></text>
    <text x="200" y="244" font-size="13" fill="#9dcbf7">用户总资产</text>
    <text x="368" y="220" font-size="34" font-weight="700" fill="#ffffff">38.71<tspan font-size="18"> 万</tspan></text>
    <text x="368" y="244" font-size="13" fill="#9dcbf7">人均资产</text>
  </g>

  <!-- yearly new-user bars: 2019..2026 -->
  <g>
    <rect x="48"  y="356" width="52" height="2"  rx="1" fill="url(#bar)" opacity=".9"/>
    <rect x="112" y="357" width="52" height="1"  rx="0.5" fill="url(#bar)" opacity=".9"/>
    <rect x="176" y="357" width="52" height="1"  rx="0.5" fill="url(#bar)" opacity=".9"/>
    <rect x="240" y="288" width="52" height="70" rx="3" fill="url(#bar)"/>
    <rect x="304" y="262" width="52" height="96" rx="3" fill="url(#bar)"/>
    <rect x="368" y="264" width="52" height="94" rx="3" fill="url(#bar)"/>
    <rect x="432" y="309" width="52" height="49" rx="3" fill="url(#bar)"/>
    <rect x="496" y="337" width="52" height="21" rx="3" fill="#6fb9f6" opacity=".75"/>
  </g>
  <text x="48" y="382" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11.5" fill="#6fb9f6">2019 ─────────── 历年新增开通（2022-11 个养制度落地）──────────── 2026</text>

  <g font-family="-apple-system,'PingFang SC',sans-serif" text-anchor="end">
    <text x="672" y="66" font-size="13" fill="#9dcbf7">CLAIR · 盈米本体</text>
    <text x="672" y="86" font-size="12" fill="#6fb9f6">生产数仓实查 · 2026-08-19</text>
