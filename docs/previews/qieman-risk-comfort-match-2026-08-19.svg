    <text x="672" y="338" font-size="14" fill="#4b5872" text-anchor="end">三组最高 · 领先风险过低组 1.24pp</text>
    <text x="672" y="382" font-size="12.5" fill="#68738c" text-anchor="end">快照 2026-08-15 · 盈米本体 × 生产数仓</text>
