<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 双关系图视觉重绘</title>
  <desc id="desc">服务关系图与系统关系图使用 CLAIR 紫色系和宋体重绘，原图内容与关系保持不变。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf9ff"/><stop offset="1" stop-color="#e9e3ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5738c8"/><stop offset="1" stop-color="#9a84ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b277f" flood-opacity=".14"/></filter>
  </defs>
  <rect width="640" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="570" cy="54" r="120" fill="#fff" opacity=".45"/>
  <text x="42" y="52" fill="#7457e8" font-family="Songti SC,STSong,SimSun,serif" font-size="12" font-weight="700" letter-spacing="2">VISUAL REDRAW</text>
  <text x="42" y="90" fill="#171727" font-family="Songti SC,STSong,SimSun,serif" font-size="29" font-weight="700">双关系图视觉重绘</text>
  <text x="42" y="116" fill="#6b7081" font-family="Songti SC,STSong,SimSun,serif" font-size="13">内容与关系不变 · CLAIR 紫色系 · 全局宋体</text>
  <g filter="url(#shadow)">
    <rect x="42" y="145" width="267" height="198" rx="20" fill="#fff" stroke="#d9d1ee"/>
    <rect x="331" y="145" width="267" height="198" rx="20" fill="#fff" stroke="#d9d1ee"/>
  </g>
  <text x="62" y="174" fill="#5d48bd" font-family="Songti SC,STSong,SimSun,serif" font-size="13" font-weight="700">服务关系图</text>
  <rect x="72" y="192" width="207" height="31" rx="10" fill="url(#core)"/>
  <rect x="72" y="235" width="207" height="38" rx="10" fill="#fff6f1" stroke="#efb28f"/>
  <rect x="72" y="285" width="207" height="26" rx="9" fill="#eef5ff" stroke="#abc7ec"/>
  <path d="M176 223v10M176 273v10M176 311v11" fill="none" stroke="#7457e8" stroke-width="2"/>
  <circle cx="92" cy="253" r="7" fill="#ff7a3d"/><circle cx="258" cy="253" r="7" fill="#4f83db"/>
  <text x="351" y="174" fill="#5d48bd" font-family="Songti SC,STSong,SimSun,serif" font-size="13" font-weight="700">系统关系图</text>
  <rect x="353" y="192" width="223" height="29" rx="9" fill="#fff" stroke="#d8d1ed"/>
  <rect x="373" y="232" width="183" height="38" rx="10" fill="url(#core)"/>
  <rect x="393" y="281" width="143" height="24" rx="8" fill="#f2eeff" stroke="#c9bcf0"/>
  <rect x="413" y="316" width="103" height="18" rx="7" fill="#f7f5fc" stroke="#ddd7ed"/>
  <path d="M465 316v-9M465 281v-9M465 232v-9" fill="none" stroke="#7457e8" stroke-width="2"/>
  <rect x="42" y="366" width="556" height="1" fill="#7457e8" opacity=".2"/>
  <text x="42" y="387" fill="#6b7081" font-family="Songti SC,STSong,SimSun,serif" font-size="11">只换样式、颜色与字体，不改变图中的任何关系与内容</text>
</svg>
