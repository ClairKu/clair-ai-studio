  <text x="72" y="86" fill="#8edbc4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" letter-spacing="3">PUBLIC INFORMATION INDEX · 2026</text>
