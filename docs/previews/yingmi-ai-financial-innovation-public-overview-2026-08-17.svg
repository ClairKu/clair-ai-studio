        <text y="67" fill="#142f2c" font-size="20" font-weight="760">专业数据</text><text y="96" fill="#6a817c" font-size="14">可信基础</text>
      </g>
      <g transform="translate(316 64)">
        <circle r="24" fill="#e0f4ed" stroke="#64b89f" stroke-width="2"/><text y="7" fill="#286f5f" font-size="20" font-weight="800">02</text>
