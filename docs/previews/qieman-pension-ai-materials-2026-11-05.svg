<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">且慢养老与 AI 养老投顾公开资料汇编内容封面</title>
  <desc id="desc">依据报告首屏文字、深青与金色配色及左右布局绘制的原创内容封面，并非网页截图。</desc>
  <rect width="1280" height="800" fill="#f5f2e9"/>
  <g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="72" y="60" font-size="18" font-weight="700" fill="#163e3b">且慢 · 养老服务研究</text>
    <text x="1208" y="58" text-anchor="end" font-size="12" letter-spacing="1.5" fill="#64746e">PUBLIC MATERIALS · 核验至 2026.11.05</text>
    <text x="72" y="143" font-size="12" letter-spacing="2.4" font-weight="700" fill="#b18c4b">RETIREMENT ADVISORY × ARTIFICIAL INTELLIGENCE</text>
    <g font-family="Songti SC,Noto Serif CJK SC,serif" font-weight="600" fill="#203c39">
      <text x="72" y="228" font-size="59">从一笔养老钱</text>
      <text x="72" y="301" font-size="59">到一段长期服务</text>
      <text x="72" y="361" font-size="33" fill="#b18c4b">且慢养老与 AI 养老投顾</text>
      <text x="72" y="407" font-size="33" fill="#b18c4b">公开资料汇编</text>
    </g>
    <g font-size="16" fill="#4b625d">
      <text x="72" y="460">以养老服务、产品匹配与账户体系为主线，</text>
      <text x="72" y="490">梳理且慢如何理解客户、提供差异化方案，</text>
      <text x="72" y="520">并在长期投资中持续陪伴。</text>
    </g>
    <g font-size="12" fill="#64746e" text-anchor="middle">
      <rect x="72" y="551" width="134" height="33" rx="17" fill="#fffdf8" stroke="#d9ddd2"/>
      <text x="139" y="572">养老服务与账户</text>
      <rect x="218" y="551" width="146" height="33" rx="17" fill="#fffdf8" stroke="#d9ddd2"/>
      <text x="291" y="572">客户理解与匹配</text>
      <rect x="376" y="551" width="177" height="33" rx="17" fill="#fffdf8" stroke="#d9ddd2"/>
      <text x="464" y="572">AI 长期记忆与陪伴</text>
    </g>
    <g transform="translate(738,156)">
      <circle cx="226" cy="191" r="151" fill="none" stroke="#d7d6c3"/>
      <circle cx="226" cy="191" r="115" fill="none" stroke="#d9dfd0" stroke-dasharray="4 7"/>
      <path d="M107 268 Q50 119 226 52 M226 52 Q398 120 345 269 M345 269 Q228 348 107 268" fill="none" stroke="#b18c4b" stroke-width="2"/>
