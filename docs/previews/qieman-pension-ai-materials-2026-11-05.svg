      <text x="230" y="665"><tspan fill="#b18c4b">02</tspan> 服务与推品</text>
      <text x="408" y="665"><tspan fill="#b18c4b">03</tspan> 养老账户</text>
      <text x="566" y="665"><tspan fill="#b18c4b">04</tspan> 三种匹配</text>
      <text x="724" y="665"><tspan fill="#b18c4b">05</tspan> 材料库</text>
      <text x="866" y="665"><tspan fill="#b18c4b">06</tspan> AI 养老思路</text>
      <text x="1043" y="665"><tspan fill="#b18c4b">07</tspan> 证据范围</text>
