      <text x="226" y="185" text-anchor="middle" font-size="20" fill="#fffdf8">养老目标</text>
      <text x="226" y="211" text-anchor="middle" font-size="11" fill="#c8d7be">贯穿不同人生阶段</text>
      <g text-anchor="middle">
        <rect x="150" y="20" width="152" height="64" rx="14" fill="#fffdf8" stroke="#d3d8c9"/>
        <text x="226" y="47" font-size="16" fill="#163e3b">理解客户</text>
        <text x="226" y="69" font-size="11" fill="#798775">目标 · 现金流 · 风险</text>
        <rect x="8" y="248" width="174" height="66" rx="14" fill="#fffdf8" stroke="#d3d8c9"/>
