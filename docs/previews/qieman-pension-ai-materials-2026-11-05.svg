      <text x="226" y="365" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#8a957e">基于公开资料的服务结构归纳</text>
    </g>
    <path d="M0 631H1280 M0 687H1280" stroke="#d9ddd2"/>
    <g font-size="13" fill="#64746e">
