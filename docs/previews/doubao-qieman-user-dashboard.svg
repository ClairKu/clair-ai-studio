    <text x="160" y="93" fill="#fff" font-size="22" font-weight="800">豆包 × 且慢</text><text x="160" y="117" fill="#9ca2b8" font-size="12" letter-spacing="3">POST-USE CONVERSION</text>
    <text x="86" y="202" fill="#84e6ef" font-size="14" font-weight="800" letter-spacing="4">DOUBAO × QIEMAN POST-USE JOURNEY</text>
    <text x="86" y="278" fill="#fff" font-size="66" font-weight="900" letter-spacing="-4">真正要看的，</text><text x="86" y="350" fill="url(#accent)" font-size="66" font-weight="900" letter-spacing="-4">是使用之后有没有转化。</text>
