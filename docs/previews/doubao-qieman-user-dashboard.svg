<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">豆包 × 且慢使用后转化看板预览</title>
  <desc id="desc">深色首屏、授权与可使用人数、使用后开户绑卡风测首投和入金规模。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131b"/><stop offset="1" stop-color="#1b1d2b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff3b73"/><stop offset=".55" stop-color="#7157ff"/><stop offset="1" stop-color="#20c7d9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#080910" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <circle cx="1450" cy="50" r="330" fill="#7157ff" opacity=".18"/><circle cx="90" cy="830" r="260" fill="#20c7d9" opacity=".12"/>
