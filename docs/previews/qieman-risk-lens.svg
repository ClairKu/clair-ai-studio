<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3f75"/>
      <stop offset="1" stop-color="#1B88EE"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B9C5A"/>
      <stop offset="0.35" stop-color="#5BB98B"/>
      <stop offset="0.5" stop-color="#E8B94A"/>
      <stop offset="0.72" stop-color="#E08A3C"/>
      <stop offset="1" stop-color="#D95151"/>
    </linearGradient>
  </defs>
  <rect width="720" height="405" fill="url(#bg)"/>
  <text x="56" y="92" fill="#fff" font-size="42" font-weight="700" letter-spacing="1">风险透镜</text>
  <text x="56" y="128" fill="#cfe6ff" font-size="19" font-weight="500">且慢持仓风险测算 · 晨星风险评价 · 适当性匹配</text>

  <!-- risk scale -->
  <g transform="translate(56,196)">
    <text x="0" y="-14" fill="#9fc6f0" font-size="13">保守型</text>
    <text x="128" y="-14" fill="#9fc6f0" font-size="13">稳健偏保守</text>
    <text x="286" y="-14" fill="#9fc6f0" font-size="13">稳健型</text>
    <text x="404" y="-14" fill="#9fc6f0" font-size="13">稳健偏激进</text>
    <text x="548" y="-14" fill="#9fc6f0" font-size="13">激进型</text>
    <rect x="152" y="6" width="196" height="52" rx="8" fill="#ffffff" opacity="0.16"/>
    <rect x="0" y="16" width="608" height="30" rx="8" fill="url(#scale)"/>
    <!-- personal marker -->
    <path d="M300 8 l-8 -12 l16 0 z" fill="#fff"/>
    <text x="300" y="-2" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">我 51</text>
    <!-- portfolio dot -->
    <circle cx="392" cy="78" r="8" fill="#fff"/>
    <line x1="392" y1="46" x2="392" y2="70" stroke="#fff" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
    <text x="392" y="102" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">持仓 61.9</text>
    <text x="250" y="102" fill="#bfe0ff" font-size="13" text-anchor="middle">舒适区间 38–57</text>
  </g>

  <!-- badges -->
  <g transform="translate(56,330)" fill="#eaf4ff" font-size="14.5">
    <rect x="0" y="-20" width="150" height="30" rx="15" fill="#ffffff" opacity="0.14"/>
    <text x="16" y="0" font-weight="600">复刻且慢风测 17 题</text>
    <rect x="166" y="-20" width="176" height="30" rx="15" fill="#ffffff" opacity="0.14"/>
    <text x="182" y="0" font-weight="600">晨星风险分 · C 档命中 96%</text>
    <rect x="358" y="-20" width="150" height="30" rx="15" fill="#ffffff" opacity="0.14"/>
    <text x="374" y="0" font-weight="600">适当性匹配矩阵</text>
  </g>
  <text x="56" y="384" fill="#8fb8e6" font-size="12.5">交互工具 · React SPA · 离线内置数据可直接演示 · 口径经盈米本体 + Redash 核实</text>
</svg>
