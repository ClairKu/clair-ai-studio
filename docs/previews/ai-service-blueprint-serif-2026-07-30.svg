<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">盈米 AI 服务蓝图预览</title>
  <desc id="desc">深海军蓝框架内展示 AI 开放平台、AI 实验室、AI 小顾和 AI 顾问工作台。</desc>
  <rect width="1200" height="675" rx="38" fill="#0d162b"/>
  <rect x="42" y="78" width="1116" height="555" rx="30" fill="#f6f7fb"/>
  <text x="48" y="48" fill="#fff" font-size="18" font-family="Songti SC, STSong, SimSun, serif" font-weight="700">AI 服务操作系统 · 业务蓝图</text>
  <text x="78" y="130" fill="#7352ed" font-size="15" font-family="Songti SC, STSong, SimSun, serif" font-weight="700">THE BLUEPRINT</text>
  <text x="78" y="183" fill="#121827" font-size="34" font-family="Songti SC, STSong, SimSun, serif" font-weight="700">一个底座、一座工厂、两个终端、一个增长飞轮</text>
  <g font-family="Songti SC, STSong, SimSun, serif">
    <rect x="78" y="258" width="225" height="174" rx="20" fill="#fff" stroke="#d9deeb"/>
    <text x="104" y="296" fill="#7352ed" font-size="15" font-weight="700">一个底座</text>
    <text x="104" y="348" fill="#121827" font-size="27" font-weight="700">AI 开放平台</text>
    <text x="104" y="387" fill="#65708a" font-size="16">能力供给与治理</text>
    <path d="M303 345H384" stroke="#7352ed" stroke-width="3"/>
    <circle cx="303" cy="345" r="8" fill="#7352ed" stroke="#e6e0ff" stroke-width="4"/>
    <rect x="384" y="230" width="258" height="230" rx="22" fill="#fff" stroke="#aa98f4"/>
    <text x="414" y="276" fill="#7352ed" font-size="15" font-weight="700">一座工厂</text>
    <text x="414" y="338" fill="#121827" font-size="30" font-weight="700">AI 实验室</text>
    <text x="414" y="388" fill="#65708a" font-size="17">组装 · 测试 · 审核</text>
    <text x="414" y="417" fill="#65708a" font-size="17">发布 · 运营</text>
    <path d="M642 345H720M720 285V407M720 285H755M720 407H755" fill="none" stroke="#7352ed" stroke-width="3"/>
    <circle cx="642" cy="345" r="8" fill="#7352ed" stroke="#e6e0ff" stroke-width="4"/>
    <rect x="755" y="218" width="365" height="132" rx="20" fill="#fff" stroke="#d9deeb"/>
    <text x="784" y="254" fill="#7352ed" font-size="14" font-weight="700">两个服务终端 · C 端</text>
    <text x="784" y="302" fill="#121827" font-size="27" font-weight="700">AI 小顾</text>
    <text x="784" y="329" fill="#65708a" font-size="14">持续陪伴用户，推动理解与行动</text>
    <rect x="755" y="376" width="365" height="132" rx="20" fill="#fff" stroke="#d9deeb"/>
    <text x="784" y="412" fill="#7352ed" font-size="14" font-weight="700">两个服务终端 · B 端</text>
    <text x="784" y="460" fill="#121827" font-size="27" font-weight="700">AI 顾问工作台</text>
    <text x="784" y="487" fill="#65708a" font-size="14">人机协同，标准化交付专业服务</text>
    <rect x="78" y="540" width="1042" height="60" rx="16" fill="#fff" stroke="#d9deeb"/>
    <rect x="78" y="540" width="6" height="60" rx="3" fill="#7352ed"/>
    <text x="104" y="578" fill="#282e40" font-size="17" font-weight="700">平台决定能不能调用；实验室决定能不能生产；两端决定能不能产生结果。</text>
  </g>
</svg>
