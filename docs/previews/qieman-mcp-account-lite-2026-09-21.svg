    <g transform="translate(28 26)">
      <rect width="994" height="58" rx="10" fill="#EEF3FF" stroke="#CFDCFF"/>
      <text x="22" y="24" font-size="13" fill="#4E5869">可新增账号</text><text x="22" y="47" font-size="20" font-weight="800" fill="#1F2633">13 <tspan font-size="13" font-weight="500" fill="#8A93A6">/ 20</tspan></text>
      <text x="360" y="24" font-size="13" fill="#4E5869">可分配积分</text><text x="360" y="47" font-size="20" font-weight="800" fill="#1F2633">250,000 <tspan font-size="13" font-weight="500" fill="#8A93A6">/ 500,000</tspan></text>
      <text x="700" y="24" font-size="13" fill="#4E5869">成员效期上限</text><text x="700" y="47" font-size="20" font-weight="800" fill="#1F2633">2027-08-31</text>
    </g>
    <g transform="translate(28 104)" font-size="14">
