    <text y="108" font-size="56" font-weight="800" fill="#1F2633">合约范围内，管账号、分限额</text>
    <text y="154" font-size="24" fill="#4E5869">账号数 · 总积分 · 效期由盈米按约定提供 ｜ 管理员分配 总额度 / 日限额 / 月限额</text>
  </g>
  <g transform="translate(75 240)" filter="url(#shadow)" font-family="PingFang SC,Microsoft YaHei,sans-serif">
