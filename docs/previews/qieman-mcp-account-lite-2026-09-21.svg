  <text x="75" y="628" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#4E5869">管理员 / 成员 两种视图 ｜ 沿用生产页色系与左右布局 ｜ 无口令、无部门、无审计的精简版</text>
