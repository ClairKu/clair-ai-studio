<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">盈米 MCP 个人中心 · 机构版精简方案</title>
  <desc id="desc">管理员在合约范围内增减账号并分配总额度与日月限额的精简页面封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF1FF"/><stop offset="1" stop-color="#F7F9FC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1F3878" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#3B7BFF" opacity=".07"/>
  <g transform="translate(75 62)" font-family="PingFang SC,Microsoft YaHei,sans-serif">
