        <text x="38" y="17" font-weight="600" fill="#1F2633">周子航</text>
        <text x="220" y="17" fill="#4E5869">37,800 / 40,000</text><rect x="360" y="8" width="140" height="6" rx="3" fill="#EDF0F6"/><rect x="360" y="8" width="133" height="6" rx="3" fill="#E5484D"/>
        <text x="520" y="17" fill="#4E5869">2,000 / 2,000</text><rect x="620" y="3" width="56" height="18" rx="9" fill="#FDECEC"/><text x="648" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#E5484D">已限流</text>
        <text x="700" y="17" fill="#4E5869">12,480 / 15,000</text><text x="880" y="17" fill="#4E5869">2026-12-31</text>
