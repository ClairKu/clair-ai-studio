        <text x="38" y="17" font-weight="600" fill="#1F2633">林墨</text>
        <text x="220" y="17" fill="#4E5869">28,900 / 50,000</text><rect x="360" y="8" width="140" height="6" rx="3" fill="#EDF0F6"/><rect x="360" y="8" width="81" height="6" rx="3" fill="#3B7BFF"/>
        <text x="520" y="17" fill="#4E5869">1,930 / 2,000</text><text x="700" y="17" fill="#4E5869">7,210 / 15,000</text><text x="880" y="17" fill="#4E5869">2027-08-31</text>
      </g>
      <g transform="translate(0 140)">
        <circle cx="14" cy="12" r="14" fill="#E8EDF7"/><text x="14" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#3A4A6B">吴</text>
        <text x="38" y="17" font-weight="600" fill="#1F2633">吴晚晴</text>
        <text x="220" y="17" fill="#4E5869">12,040 / 30,000</text><rect x="360" y="8" width="140" height="6" rx="3" fill="#EDF0F6"/><rect x="360" y="8" width="56" height="6" rx="3" fill="#3B7BFF"/>
        <text x="520" y="17" fill="#4E5869">210 / 1,000</text><text x="700" y="17" fill="#8A93A6">不限</text><text x="880" y="17" fill="#C9700F">2026-10-15 · 剩 24 天</text>
      </g>
      <g transform="translate(0 188)">
        <circle cx="14" cy="12" r="14" fill="#E8EDF7"/><text x="14" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#3A4A6B">韩</text>
        <text x="38" y="17" font-weight="600" fill="#1F2633">韩奕</text><rect x="100" y="3" width="84" height="18" rx="9" fill="#FFF4E8"/><text x="142" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#C9700F">待登录激活</text>
        <text x="220" y="17" fill="#4E5869">0 / 20,000</text><rect x="360" y="8" width="140" height="6" rx="3" fill="#EDF0F6"/>
        <text x="520" y="17" fill="#4E5869">0 / 1,000</text><text x="700" y="17" fill="#4E5869">0 / 8,000</text><text x="880" y="17" fill="#4E5869">2027-08-31</text>
      </g>
