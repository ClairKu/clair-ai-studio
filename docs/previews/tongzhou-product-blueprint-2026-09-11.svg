    <text x="72" y="492">今日是队列，SOP 是门 · 每个数字带口径 · 每条建议可追溯 · 对客输出必经收件箱</text>
  </g>
  <rect x="72" y="540" width="1056" height="2" fill="#D9E1EC"/>
  <text x="72" y="600" font-family="PingFang SC, sans-serif" font-size="20" fill="#0F72CD">配套交互 Demo：同舟双外壳工作台 · 2026-09-11</text>
