<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">长赢同路人小组详情页双版评审</title>
  <desc id="desc">右版信息分层更清楚，但需要压缩首屏并补齐加入资格状态机。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#132f4f"/>
      <stop offset="1" stop-color="#1f6f9e"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#709cc4"/>
      <stop offset="1" stop-color="#a99b9a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <g opacity=".22">
    <circle cx="1110" cy="76" r="180" fill="#7dd3fc"/>
    <circle cx="90" cy="660" r="210" fill="#38bdf8"/>
  </g>
  <text x="72" y="86" fill="#7dd3fc" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-weight="700" letter-spacing="3">PRODUCT REVIEW · 2026.07.30</text>
  <text x="72" y="148" fill="#fff" font-size="46" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-weight="800">长赢同路人小组详情页</text>
  <text x="72" y="203" fill="#dbeafe" font-size="28" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">右版方向有条件通过｜分层正确，转化语义待补齐</text>

  <g transform="translate(74 254)" filter="url(#shadow)">
    <rect width="238" height="382" rx="30" fill="#f8fafc"/>
    <rect width="238" height="136" rx="30" fill="url(#hero)"/>
    <rect y="108" width="238" height="28" fill="url(#hero)"/>
    <circle cx="42" cy="52" r="22" fill="#dbeafe"/>
    <rect x="76" y="36" width="116" height="14" rx="7" fill="#fff" opacity=".9"/>
    <rect x="76" y="62" width="88" height="10" rx="5" fill="#e2e8f0" opacity=".8"/>
    <rect x="18" y="154" width="202" height="78" rx="17" fill="#e2e8f0"/>
    <rect x="18" y="248" width="202" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="18" y="280" width="202" height="72" rx="17" fill="#fff" stroke="#e2e8f0"/>
    <path d="M15 218H223" stroke="#fb4b1f" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="119" y="374" text-anchor="middle" fill="#ef4444" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-weight="700">层级拥挤</text>
  </g>

  <g transform="translate(346 238)" filter="url(#shadow)">
    <rect width="270" height="414" rx="32" fill="#f8fafc"/>
    <rect width="270" height="132" rx="32" fill="url(#hero)"/>
    <rect y="104" width="270" height="28" fill="url(#hero)"/>
    <rect x="18" y="150" width="234" height="64" rx="17" fill="#fff"/>
    <rect x="18" y="228" width="234" height="92" rx="17" fill="#fff"/>
    <rect x="18" y="338" width="234" height="38" rx="19" fill="#e5e7eb"/>
    <circle cx="56" cy="181" r="18" fill="#bae6fd"/>
    <rect x="86" y="170" width="112" height="11" rx="5.5" fill="#334155"/>
    <rect x="86" y="190" width="88" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="38" y="250" width="82" height="12" rx="6" fill="#334155"/>
    <rect x="38" y="278" width="176" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="38" y="296" width="150" height="9" rx="4.5" fill="#cbd5e1"/>
    <circle cx="237" cy="166" r="17" fill="#22c55e"/>
    <path d="M228 166l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="405" text-anchor="middle" fill="#16a34a" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-weight="700">分层清楚</text>
  </g>

  <g transform="translate(676 268)">
    <rect width="452" height="314" rx="28" fill="#fff" opacity=".96"/>
    <text x="36" y="54" fill="#0f172a" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-weight="800">最终建议</text>
    <text x="36" y="98" fill="#0369a1" font-size="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-weight="800">右版分层 + 左版效率</text>
    <g fill="#334155" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
      <text x="36" y="150">01  合并组长与条件卡，压缩首屏</text>
      <text x="36" y="194">02  必要资格不得藏在“查看更多”后</text>
      <text x="36" y="238">03  CTA 随协议与资格状态变化</text>
    </g>
    <rect x="36" y="266" width="380" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="36" y="266" width="286" height="14" rx="7" fill="#0ea5e9"/>
    <text x="416" y="282" text-anchor="end" fill="#64748b" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">CONDITIONAL PASS</text>
  </g>
</svg>
