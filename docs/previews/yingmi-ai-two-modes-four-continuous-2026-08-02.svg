  <rect x="263" y="96" width="194" height="64" rx="18" fill="url(#violet)"/><text x="360" y="126" class="card" fill="#fff" text-anchor="middle">盈米 AI 开放平台</text><text x="360" y="146" class="small" fill="#eeeaff" text-anchor="middle">MCP · Skills · Agent</text>
