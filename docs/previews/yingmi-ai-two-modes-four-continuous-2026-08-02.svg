    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8067e8"/><stop offset="1" stop-color="#a992ff"/></linearGradient>
    <style>text{font-family:"Songti SC",STSong,SimSun,serif;fill:#161927}.label{font:700 12px "PingFang SC",sans-serif;fill:#8067e8;letter-spacing:2px}.title{font-size:29px;font-weight:700}.small{font-size:12px;fill:#687287}.card{font-size:17px;font-weight:700}.metric{font-size:20px;font-weight:700;fill:#8067e8}.note{font-size:10px;fill:#687287}</style>
