  <g transform="translate(199 182)"><rect width="155" height="108" rx="17" fill="#151e36"/><text x="18" y="30" class="label" fill="#b8a7ff">02</text><text x="18" y="58" class="card" fill="#fff">持续抢先</text><text x="18" y="84" class="small" fill="#b7c1d5">首个 · 首批 · 占位</text></g>
