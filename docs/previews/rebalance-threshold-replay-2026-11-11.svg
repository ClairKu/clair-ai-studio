<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">定制方案 · 偏离阈值逐日回放</title>
  <desc id="desc">4%、5%、5.5%、6%并排比较；策略与客户账户分别展示平均、中位数和年度逐方案明细。标准持仓回放、客户实盘事实和期初持仓实验明确标记。需盈米企业登录 · 待平台审核。</desc>
  <rect width="1200" height="720" fill="#f4f5f1"/>
  <path d="M68 105h1064M68 653h1064" stroke="#dce3dc"/>
  <rect x="68" y="53" width="29" height="29" rx="9" fill="#172d2c"/><circle cx="82.5" cy="67.5" r="7" fill="none" stroke="#cbe2ce" stroke-width="1.6"/>
  <text x="110" y="75" fill="#172d2c" font-family="Arial,sans-serif" font-size="20" font-weight="600">Clair’s Studio</text>
  <text x="1132" y="74" text-anchor="end" fill="#647472" font-family="sans-serif" font-size="15">盈米企业登录</text>
  <text x="68" y="174" fill="#176b5d" font-family="sans-serif" font-size="17" letter-spacing="2">定制方案 · 独立逐日回放</text>
  <text x="66" y="253" fill="#172d2c" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="45" font-weight="600" letter-spacing="-1">调仓频次</text>
  <text x="66" y="315" fill="#172d2c" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="45" font-weight="600" letter-spacing="-1">偏离阈值逐日回放</text>
  <text x="68" y="366" fill="#647472" font-family="sans-serif" font-size="19">策略与账户分开看，逐方案、逐年核对变化。</text>
  <g font-family="sans-serif" font-size="17" fill="#376250">
    <rect x="68" y="404" width="91" height="39" rx="19.5" fill="#edf2e9" stroke="#cbd8cc"/><text x="113.5" y="430" text-anchor="middle">4%</text>
    <rect x="170" y="404" width="91" height="39" rx="19.5" fill="#edf2e9" stroke="#cbd8cc"/><text x="215.5" y="430" text-anchor="middle">5%</text>
    <rect x="272" y="404" width="91" height="39" rx="19.5" fill="#edf2e9" stroke="#cbd8cc"/><text x="317.5" y="430" text-anchor="middle">5.5%</text>
    <rect x="374" y="404" width="91" height="39" rx="19.5" fill="#edf2e9" stroke="#cbd8cc"/><text x="419.5" y="430" text-anchor="middle">6%</text>
  </g>
  <rect x="673" y="155" width="459" height="334" rx="26" fill="#e6eee4" stroke="#ceddd0"/>
  <text x="704" y="197" fill="#4f6a5f" font-family="sans-serif" font-size="15">同屏比较 · 结构示意</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="704" y="225" width="88" height="44" rx="10" fill="#f9fbf5" stroke="#c5d5c4"/><text x="748" y="254" fill="#253e33">4%</text>
    <rect x="807" y="225" width="88" height="44" rx="10" fill="#224e40"/><text x="851" y="254" fill="#fff">5%</text>
    <rect x="910" y="225" width="88" height="44" rx="10" fill="#f9fbf5" stroke="#c5d5c4"/><text x="954" y="254" fill="#253e33">5.5%</text>
    <rect x="1013" y="225" width="88" height="44" rx="10" fill="#f9fbf5" stroke="#c5d5c4"/><text x="1057" y="254" fill="#253e33">6%</text>
  </g>
  <g font-family="sans-serif" fill="#253e33" font-size="18">
    <text x="708" y="315">策略本身</text><text x="1094" y="315" text-anchor="end">平均 / 中位数</text>
    <path d="M704 333h397" stroke="#c5d5c4"/>
    <text x="708" y="369">客户账户</text><text x="1094" y="369" text-anchor="end">平均 / 中位数</text>
    <path d="M704 388h397" stroke="#c5d5c4"/>
    <text x="902.5" y="428" text-anchor="middle" fill="#4f6a5f" font-size="17">年度逐方案 · 再平衡 / 总调仓 / 占比</text>
    <text x="902.5" y="462" text-anchor="middle" fill="#6a806e" font-size="13">结构示意不含内部结果数字</text>
  </g>
  <g font-family="sans-serif">
    <rect x="68" y="527" width="1064" height="84" rx="17" fill="#fbfcf8" stroke="#dce3dc"/>
    <path d="M423 548v42M777 548v42" stroke="#dce3dc"/>
    <circle cx="104" cy="570" r="5" fill="#176b5d"/><text x="122" y="576" fill="#172d2c" font-size="19">标准持仓回放</text>
    <circle cx="459" cy="570" r="5" fill="#c58e42"/><text x="477" y="576" fill="#172d2c" font-size="19">客户实盘事实</text>
    <circle cx="813" cy="570" r="5" fill="none" stroke="#176b5d" stroke-width="1.7"/><text x="831" y="576" fill="#172d2c" font-size="19">期初持仓实验</text>
  </g>
  <text x="68" y="688" fill="#647472" font-family="sans-serif" font-size="14">需盈米企业登录 · 待平台审核</text>
  <text x="1132" y="688" text-anchor="end" fill="#647472" font-family="sans-serif" font-size="14">年度逐方案 · 窗口内次数与年化分开</text>
</svg>
