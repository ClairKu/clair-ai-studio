<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Clair 视觉报告生成器</title>
  <desc id="desc">从任意材料到证据化、管理层友好的视觉 HTML 报告</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#eae4ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8067e8"/><stop offset="1" stop-color="#aa92ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#35257b" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="260" fill="#8067e8" opacity=".08"/>
  <circle cx="1025" cy="660" r="230" fill="#aa92ff" opacity=".08"/>
  <g transform="translate(70 86)" font-family="Songti SC, STSong, serif">
    <text fill="#6b56cf" font-size="12" font-weight="700" letter-spacing="2">CLAIR AI STUDIO · REPORT SYSTEM</text>
    <text y="96" fill="#171827" font-size="68" font-weight="600">Clair 视觉报告</text>
    <text y="174" fill="#8067e8" font-size="68" font-weight="600">生成器</text>
    <text y="222" fill="#657086" font-size="18">任意材料 → 证据审计 → 内容编排 → 视觉报告 → 生产发布</text>
    <g transform="translate(0 278)" font-family="Songti SC, STSong, serif">
      <g><rect width="154" height="84" rx="18" fill="#fff" stroke="#ded9ee"/><text x="18" y="38" fill="#8067e8" font-size="30" font-weight="700">9</text><text x="18" y="63" fill="#657086" font-size="12">结构模块</text></g>
      <g transform="translate(168)"><rect width="154" height="84" rx="18" fill="#fff" stroke="#ded9ee"/><text x="18" y="38" fill="#8067e8" font-size="30" font-weight="700">4</text><text x="18" y="63" fill="#657086" font-size="12">证据状态</text></g>
      <g transform="translate(336)"><rect width="154" height="84" rx="18" fill="#fff" stroke="#ded9ee"/><text x="18" y="38" fill="#8067e8" font-size="30" font-weight="700">0</text><text x="18" y="63" fill="#657086" font-size="12">外部依赖</text></g>
    </g>
    <g transform="translate(0 402)"><rect width="490" height="116" rx="24" fill="#11192f"/><text x="24" y="34" fill="#aa92ff" font-size="10" font-weight="700" letter-spacing="1.6">ONE SOURCE · MANY REPORTS</text><text x="24" y="70" fill="#fff" font-size="22" font-weight="700">内容与皮肤解耦</text><text x="24" y="96" fill="#aab5ca" font-size="12">换材料，只重做证据抽取与 report.json</text></g>
  </g>
  <g transform="translate(660 70)" filter="url(#shadow)" font-family="Songti SC, STSong, serif">
    <rect width="455" height="535" rx="34" fill="#0b1224"/>
    <text x="34" y="48" fill="#aa92ff" font-size="11" font-weight="700" letter-spacing="1.4">REPORT GENERATION PIPELINE</text>
    <g transform="translate(34 78)">
      <g><rect width="387" height="70" rx="17" fill="#fff"/><rect width="7" height="70" rx="4" fill="url(#accent)"/><text x="26" y="29" fill="#8067e8" font-size="10" font-weight="700">01 · MATERIALS</text><text x="26" y="52" fill="#171827" font-size="15" font-weight="700">Word / PDF / PPT / 网页 / 截图</text></g>
      <g transform="translate(0 84)"><rect width="387" height="70" rx="17" fill="#fff"/><rect width="7" height="70" rx="4" fill="url(#accent)"/><text x="26" y="29" fill="#8067e8" font-size="10" font-weight="700">02 · EVIDENCE</text><text x="26" y="52" fill="#171827" font-size="15" font-weight="700">事实 / 判断 / 缺失 / 目标态</text></g>
      <g transform="translate(0 168)"><rect width="387" height="70" rx="17" fill="#fff"/><rect width="7" height="70" rx="4" fill="url(#accent)"/><text x="26" y="29" fill="#8067e8" font-size="10" font-weight="700">03 · STRUCTURE</text><text x="26" y="52" fill="#171827" font-size="15" font-weight="700">report.json 单一事实源</text></g>
      <g transform="translate(0 252)"><rect width="387" height="70" rx="17" fill="#fff"/><rect width="7" height="70" rx="4" fill="url(#accent)"/><text x="26" y="29" fill="#8067e8" font-size="10" font-weight="700">04 · RENDER</text><text x="26" y="52" fill="#171827" font-size="15" font-weight="700">响应式 HTML · 九类模块</text></g>
      <g transform="translate(0 336)"><rect width="387" height="70" rx="17" fill="url(#accent)"/><text x="26" y="29" fill="#eeeaff" font-size="10" font-weight="700">05 · PUBLISH</text><text x="26" y="52" fill="#fff" font-size="15" font-weight="700">GitHub Pages + Clair AI Studio</text></g>
    </g>
  </g>
</svg>
